<div class="container-fluid p-4">
  <div class="card shadow rounded-xl">

    <!-- Header -->
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Department Master</h5>
      <button class="btn btn-sm btn-danger d-flex align-items-center" routerLink="/timeline">
        <clr-icon shape="window-close" class="mr-1"></clr-icon> CLOSE
      </button>
    </div>

    <!-- Body -->
    <div class="card-block">
      <form #deptForm="ngForm" (ngSubmit)="saveDepartment(deptForm)" class="space-y-4">

        <!-- Department Input -->
        <div class="clr-form-control">
          <label for="department">{{'common.department' | translate}}</label>
          <input clrInput type="text" id="department" name="department"
                 [(ngModel)]="department" placeholder="Enter department name" required />
        </div>

        <!-- Module Input with Add button -->
        <div class="clr-form-control d-flex align-items-end gap-2">
          <div class="flex-fill">
            <label for="module">Module</label>
            <input clrInput type="text" id="module" name="module"
                   [(ngModel)]="module" placeholder="Enter module name" />
          </div>
          <button class="btn btn-outline btn-sm" type="button" (click)="addModule()">
            <clr-icon shape="plus"></clr-icon> Add
          </button>
        </div>

        <!-- Show Added Modules -->
        <div *ngIf="modules.length > 0" class="mt-3">
          <h6 class="mb-2">Added Modules</h6>
          <div class="d-flex flex-wrap gap-2">
            <span *ngFor="let mod of modules; let i = index" class="badge badge-info d-flex align-items-center">
              {{ mod }}
              <button type="button" class="btn btn-sm btn-link text-white ml-1 p-0"
                      (click)="removeModule(i)">
                <clr-icon shape="times"></clr-icon>
              </button>
            </span>
          </div>
        </div>

        <!-- Save Button -->
        <div class="mt-4 text-right">
          <button class="btn btn-primary" type="submit">
            <clr-icon shape="save" class="mr-1"></clr-icon> Save Department
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
