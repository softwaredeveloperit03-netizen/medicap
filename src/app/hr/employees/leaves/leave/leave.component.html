<div class="card">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-lg-3" style="color: aliceblue;margin-top: -2px;text-align: left;">Leave Form</div>
      <div class="clr-col-lg-9" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        <button class="btn btn-sm btn-danger" routerLink="/hr/employees/leaves"
          style="color: white;border: 1px solid red;">{{'common.close' | translate}}</button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <div class="card-text">
      <form #leaveForm="ngForm">
        <div class="clr-row">
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Type Of Leave:</label>
            <select name="leave_type" ngModel required>
              <option></option>
              <option *ngFor="let leave of leavetypes">{{leave.leave_type}}</option>
            </select>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Department:</label>
            <select name="department_name" [(ngModel)]="department_name"   (change)="getDepartmentsEmployee($event.target.value)"  required style="height: 33px;" (change)="getDeptByManagers($event.target.value)">
              <option></option>
              <option *ngFor="let department of departments" value="{{ department.department_name }}" >{{ department.department_name }}</option>
            </select>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Employee:</label>
              <select name="emp_id" [(ngModel)]="emp_id" required (change)="getDeptHandover()">
                <option></option>
                <option *ngFor="let employee of employees1" [value]="employee.emp_id">{{ employee.firstname}} - {{employee.emp_id}}</option>
              </select>
            </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12" *ngIf="bleave">
            <label>Balance Leave :</label>
            <input type="text" name="bleave1" [(ngModel)]="bleave1"   readonly>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Leave From :</label>
            <input type="date" name="leave_from" [(ngModel)]="leave_from" (change)="calculateDays()"  required>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Leave To Date:</label>
            <input type="date" name="leave_to" [(ngModel)]="leave_to" (change)="calculateDays()"  required>
          </div>
          

          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>No. Of Day:</label>
            <input type="number" name="no_day" [(ngModel)]="no_day" readonly>
          </div>

          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Reason For Leave:</label>
            <input type="text" name="reason_leave" ngModel required>
          </div>
 
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Select Approver:</label>
            <select name="approver" [(ngModel)]="approver" >
              <option></option>
              <option *ngFor="let res of employees" [value]="res.emp_id">{{res.firstname}} {{res.middlename}} {{res.lastname}}</option>
            </select>
          </div>

        </div>
      </form>
      <p style="color: red; font-weight: bolder;">Please submit a separate leave application for each month. You cannot select a "To Date" from the next month within a single application. For example, a leave from August 25 to August 31 is acceptable, but a leave from August 25 to September 3 is not.</p>
    </div>
  </div>
  <div class="card-footer">
    <button class="btn btn-primary" (click)="save(leaveForm)">{{'common.submit' | translate}}</button>
    <button class="btn btn-danger" routerLink="/hr/employees/leaves">{{'common.cancel' | translate}}</button>
  </div>

</div>
