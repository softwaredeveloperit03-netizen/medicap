<div class="contractor-dashboard-shell hr-sub-tile-dash">
  <div class="dash-header">
    <div class="title-block">
      <h2>Contractor Management</h2>
    </div>
    <div class="header-actions">
      <a class="back-btn" routerLink="/hr/labours" aria-label="Back to Labours">
        <i class="fas fa-arrow-left"></i>
        Labours
      </a>
      <a class="close-btn" routerLink="/hr" aria-label="Close">
        <i class="fas fa-times"></i>
        Close
      </a>
    </div>
  </div>

  <h3 class="section-label">Contractor Section</h3>
  <div class="tiles-grid">
    <a
      *ngFor="let tile of getVisibleTiles()"
      class="tile-card"
      [routerLink]="tile.route"
    >
      <div class="icon-wrap" [style.background]="tile.gradient">
        <i class="fas" [ngClass]="tile.icon"></i>
      </div>
      <div class="tile-body">
        <div class="tile-title">{{ tile.title }}</div>
      </div>
    </a>
  </div>
</div>
