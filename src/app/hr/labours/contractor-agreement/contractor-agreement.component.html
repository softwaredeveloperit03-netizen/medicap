<div class="container-fluid" *ngIf="isNew">
    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
      <div class="card">
        <div class="card-header">Contractor Agreement</div>
        <div class="card-block">
          <div class="card-text">
            <form #labourForm="ngForm">
              <div class="clr-row">
  
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                  <label>Name of Contractor</label>
                  <select name="person" ngModel (change)="onClick($event.target.selectedIndex)">
                    <option> </option>
                   <option *ngFor="let item of list1;" >{{item.contract_firm}} </option>
                  </select>
                </div>
  
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                  <label>{{'common.address' | translate}}</label>
                  <input type="text" name="address" [(ngModel)]="address" readonly />
                </div>
  
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                  <label>Postal Code</label>
                  <input type="text" name="pincode" [(ngModel)]="pincode" readonly />
                </div>
  
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                  <label>Phone No</label>
                  <input type="text" name="phone_no" [(ngModel)]="phone_no" readonly />
                </div>
  
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                  <label>Email Id</label>
                  <input type="email" name="email" [(ngModel)]="email" readonly />
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                  <label><strong>Upload Agreement</strong> </label>
                  <input type="file" name="bond" (change)="onFileChanged($event)" ngModel />
                </div>
              </div>
            </form>
          </div>
        </div>
  
        <div class="card-footer">
          <button class="btn btn-primary" (click)="saveForm(labourForm)" [disabled]="labourForm.form.invalid">
            ADD Agreement
          </button>
          <button class="btn btn-danger" (click)="isNew = false">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
  </div>
  
  <div class="container-fluid" *ngIf="!isView && !isNew">
    <div class="card">
      <div class="card-header">Contractor Agreement</div>
      <div class="card-block">
        <div class="card-text">
          <button class="btn btn-sm" (click)="isNew = true" *ngIf="isuser == 'Yes'" >
            Add  Agreement Contractor
          </button>
  
          <clr-datagrid>
            <clr-dg-column>Contractor Name</clr-dg-column>
            <clr-dg-column>{{'common.address' | translate}}</clr-dg-column>
            <clr-dg-column>Mobile No</clr-dg-column>
            <clr-dg-column>Email ID</clr-dg-column>
            <clr-dg-column>View</clr-dg-column>
  
            <clr-dg-row *ngFor="let user of list; let i = index">
              <clr-dg-cell>{{ user.person }}</clr-dg-cell>
              <clr-dg-cell>{{ user.address }}</clr-dg-cell>
              <clr-dg-cell>{{ (user.phone_no  | canadianPhone)}}</clr-dg-cell>
              <clr-dg-cell>{{ user.email }}</clr-dg-cell>
              <clr-dg-cell>
                <button class="btn btn-sm btn-info" (click)="open(user.bond)">
                  View Agreement
                </button>
              </clr-dg-cell>
            </clr-dg-row>
          </clr-datagrid>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-danger" (click)="close()">{{'common.close' | translate}}</button>
      </div>
    </div>
  </div>
  
  <div class="container-fluid" *ngIf="isView">
    <div class="card">
     pdf
    </div>
  </div>
