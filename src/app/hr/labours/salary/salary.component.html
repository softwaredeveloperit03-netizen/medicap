<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Salary Calculation</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/hr" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
      <div class="card-block">
        <div class="card-text">
         <form #salaryCalculate="ngForm">
           <div class="clr-row">
             <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
               <label>Labour:</label>
               <select name="labour_no" ngModel required (change)="selectedlabour($event.target.selectedIndex)">
                 <option *ngFor="let list of labourlist" value="{{list.labour_no}}">{{ list.labour_name }}</option>
               </select>
             </div>
             <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-4">
                <label>Daily Wages</label>
                <input type="text" name="daily_wages" ngModel="{{daily_wages}}" readonly>
              </div>
             <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-4">
               <label>Select Month</label>
               <input type="month" name="month" ngModel>
             </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-4" style="margin-top: 30px;">
                <button class="btn btn-primary" (click)="calculate(salaryCalculate)">Calculate</button>
              </div>
           </div>
           <table class="table">
             
               <tr>
                 <th style="background-color: rgb(14, 67, 112); color: white;">Particulars</th>
                 <th style="background-color: rgb(14, 67, 112); color: white;"></th>
               </tr>
           
               <tr>
                <td>Total Days In Month</td>
                <td>{{ monthdays }}</td>
              </tr>
              <tr>
                <td>Total Present Days In Month</td>
                <td>{{ present }}</td>
              </tr>
              <tr>
                <td>Total Absent Days In Month</td>
                <td>{{ absent }}</td>
              </tr>
              <tr>
                <td>Overtime In Month</td>
                <td>{{ overtime }}</td>
              </tr>
               <tr>
                 <td>Total Earned Salary</td>
                 <td>{{ totalearning }}</td>
               </tr>
           
           </table>
         </form>
        </div>
      </div>
      <!-- <div class="card-footer">
        <button class="btn btn-primary" (click)="generatepdf(salaryForm)" *ngIf="downloadview">Download PDF</button>
      </div> -->
    </div>
</div>
