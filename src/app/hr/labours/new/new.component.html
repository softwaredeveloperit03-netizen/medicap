<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue; margin-top: -2px; text-align: left;">Labour Registration</div>
            <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/hr" style="background-color: red; color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #labourForm="ngForm" class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Labour Name:<span style="color: red;">*</span></label>
                    <input type="text" ngModel name="labour_name" required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Date of Birth:<span style="color: red;">*</span></label>
                    <input type="date" [(ngModel)]="dob" name="dob" (change)="checkAge()" required [max]="maxDate">
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Gender:<span style="color: red;">*</span></label>
                    <select name="gender" ngModel required style="height: 33px;">
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                    <h4 style="margin-top: 0.5rem;">Address</h4>
                </div>
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                    <label>Street Address:<span style="color: red;">*</span></label>
                    <input type="text" name="street_address" [(ngModel)]="street_address" #streetCtrl="ngModel" required>
                    <div *ngIf="streetCtrl.invalid && streetCtrl.touched" style="color:red;font-size:13px;">
                        Street Address is required.
                    </div>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>City:<span style="color: red;">*</span></label>
                    <input type="text" name="city" [(ngModel)]="city" #cityCtrl="ngModel" required>
                    <div *ngIf="cityCtrl.invalid && cityCtrl.touched" style="color:red;font-size:13px;">
                        City is required.
                    </div>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Province:<span style="color: red;">*</span></label>
                    <select name="province" [(ngModel)]="province" #provinceCtrl="ngModel" required>
                        <option value=""></option>
                        <option *ngFor="let p of canadianProvinces" [value]="p">{{ p }}</option>
                    </select>
                    <div *ngIf="provinceCtrl.invalid && provinceCtrl.touched" style="color:red;font-size:13px;">
                        Province is required.
                    </div>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Postal Code:<span style="color: red;">*</span></label>
                    <input
                        type="text"
                        name="postal_code"
                        [(ngModel)]="postal_code"
                        #postalCtrl="ngModel"
                        required
                        [pattern]="postalCaHtmlPattern"
                        placeholder="e.g. K1A 0A6"
                        (input)="formatPostalInput($event)">
                    <div *ngIf="postalCtrl.invalid && postalCtrl.touched" style="color:red;font-size:13px;">
                        <div *ngIf="postalCtrl.errors?.['required']">Postal Code is required.</div>
                        <div *ngIf="postalCtrl.errors?.['pattern']">Enter a valid Canadian postal code (e.g. K1A 0A6).</div>
                    </div>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Country:<span style="color: red;">*</span></label>
                    <input type="text" name="country" [(ngModel)]="country" required readonly>
                </div>

                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Upload Government ID:<span style="color: red;">*</span></label>
                    <input type="file" ngModel name="aadhar_card" (change)="onFileChanged1($event)" required accept="image/*,.pdf">
                    <small class="text-muted">Photo ID or SIN document (image or PDF)</small>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Upload Photo:<span style="color: red;">*</span></label>
                    <input type="file" ngModel name="photo" (change)="onFileChanged3($event)" required accept="image/*">
                </div>
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                    <label>Select Category:</label>
                    <clr-radio-wrapper>
                        <input type="radio" clrRadio value="Labour" ngModel name="category">
                        <label>Labour</label>
                    </clr-radio-wrapper>
                    <clr-radio-wrapper>
                        <input type="radio" clrRadio value="Operator" ngModel name="category">
                        <label>Operator</label>
                    </clr-radio-wrapper>
                    <clr-radio-wrapper>
                        <input type="radio" clrRadio value="Supervisor" ngModel name="category">
                        <label>Supervisor</label>
                    </clr-radio-wrapper>
                    <clr-radio-wrapper>
                        <input type="radio" clrRadio value="Worker" ngModel name="category">
                        <label>Worker</label>
                    </clr-radio-wrapper>
                </div>
                <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12 remove-side-arrow-container">
                    <label>Daily Wages (CAD):<span style="color: red;">*</span></label>
                    <input type="number" name="daily_wages" ngModel required min="0" step="0.01">
                </div>
                <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <label>Contractor Name:</label>
                    <select name="contractor_name" ngModel>
                        <option disabled> </option>
                        <option *ngFor="let item of list">{{item.person}}</option>
                    </select>
                </div>
            </form>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="saveLabour(labourForm)">{{'common.save' | translate}}</button>
    </div>
</div>
