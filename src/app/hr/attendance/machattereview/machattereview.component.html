
<div class="card" *ngIf="!isView">
    <div class="card-header" style="text-align: center"   >
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-lg-3" style="color: aliceblue;margin-top: -2px;text-align: left;">Machine Attendance Review</div>
        <div class="clr-col-lg-9" style="text-align: right;padding-right: 0px;margin-top: -7px;">
             <button class="btn btn-sm btn-danger" routerLink="/hr/attendance/MachattComponent"
            style="color: white;border: 1px solid red;">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
        <div class="clr-row">
            <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
              <label>From Date:</label>
              <input type="date" name="from_date" [(ngModel)]="from_date" style="padding-left: 1px; padding-right: 1px;">
            </div>
            <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
              <label>To Date:</label>
              <input type="date" name="to_date" [(ngModel)]="to_date" style="padding-left: 1px; padding-right: 1px;">
            </div>
            <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
              <button [clrLoading]="validateBtnState" class="btn btn-danger" (click)="getlAttendace()" style="margin-top:30px;">{{'common.search' | translate}}</button>
            </div>
            <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
              <button [clrLoading]="validateBtnState" class="btn btn-danger" (click)="save()" style="margin-top:30px;">send</button>
            </div>
          </div>
      <div class="card-text">
            <table class="table">
                <tr>
                    <th>#</th>
                    <th>Enroll ID</th>
                    <th>{{'common.date' | translate}}</th>
                    <th>Punch Time</th>
                    <th>{{'common.status' | translate}}</th>
                  </tr>
                  <tr *ngFor="let record of plants; let i = index">
                    <td>{{ i + 1 }}</td>
                    <td>{{ record.emp_id }}</td>
                    <td>{{ record.indate }}</td>
                    <td>{{ record.entry_time }}</td>
                    <td>{{ record.status }}</td>
                  </tr>
            </table>
        </div>
    </div>
    <div class="card-footer">
     
    </div>
  </div>
