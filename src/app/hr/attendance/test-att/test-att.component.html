 
<div class="container-fluid">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Employee Attendance</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/hr/attendance" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <div class="clr-row">
          <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
            <label>Department:</label>
            <select name="department_name" [(ngModel)]="department_name" (change)="getEmployee($event.target.value)">
              <option></option>
              <option *ngFor="let dpt of departments" [value]="dpt.department_name">{{ dpt.department_name }}</option>
            </select>
          </div>
          <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
            <label>Employee:</label>
            <select name="employeeId" [(ngModel)]="employeeId" >
              <option></option>
              <option *ngFor="let dpt of employees" [value]="dpt.emp_id">{{ dpt.firstname }} {{ dpt.lastname }}</option>
            </select>
          </div>
          <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
            <label>Month:</label>
            <input type="text" [(ngModel)]="month" placeholder="Month (YYYY-MM)" />
          </div>
          <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
            <label>From Date:</label>
            <input type="date" [(ngModel)]="start_date" placeholder="Start Date (YYYY-MM-DD)" />
          </div>
          <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
            <label>To Date:</label>
            <input type="date" [(ngModel)]="end_date" placeholder="End Date (YYYY-MM-DD)" />
          </div>
          <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
             <br>
             <button class="btn btn-success" (click)="onSearch()">{{'common.search' | translate}}</button>
          </div>

          
        </div>

        <div class="unique-table-wrapper">
          <table class="table table-border unique-table">
            <tr>
              <th *ngFor="let col of columns1" style="text-align: left; background-color: rgb(14, 67, 112); color: white;">
                {{ col }}
              </th>
            </tr>
            <tr *ngFor="let result of results; let i = index">
              <td *ngFor="let col of columns1" style="text-align: left;">
                <span *ngIf="result[col] === 'WPL'" style="font-weight: bolder; color: blue;">{{ result[col] }}</span>
                <span *ngIf="result[col] === 'A'" style="font-weight: bolder; color: rgb(240, 57, 57);">{{ result[col] }}</span>
                <span *ngIf="result[col] === 'PL' || result[col] === 'P'" style="font-weight: bolder; color: green;">{{ result[col] }}</span>
                <span *ngIf="result[col] !== 'WPL' && result[col] !== 'A' && result[col] !== 'PL' && result[col] !== 'P'" style="font-weight: bolder;">
                  {{ result[col] }}
                </span>
              </td>
            </tr>
          </table>
        </div>
        
       





      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="exportToExcel()">Export All Data</button>
     </div>
  </div>
</div>
