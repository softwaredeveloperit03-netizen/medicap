<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Daily Training Annoucement</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-danger" routerLink="/hr/training/daily">{{'common.close' | translate}}</button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #trainerForm="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Date:</label>
                        <input type="date" name="date" ngModel required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Time:</label>
                        <input type="time" name="time" ngModel required>
                    </div>
                    <!-- <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Trainer:</label>
                        <select name="trainer" ngModel required>
                            <option>Internal</option>
                            <option>External</option>
                        </select>
                    </div> -->
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Trainer Name:</label>
                        <select name="trainer_no" ngModel>
                            <option></option>
                            <option *ngFor="let trainer of trainers" [value]="trainer.id">{{ trainer.trainer_name }}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                        <label>Venue:</label>
                        <textarea rows="2" name="venue" ngModel required></textarea>
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                        <label>Training Subject:</label>
                        <textarea rows="2" name="subject" ngModel required></textarea>
                    </div>
                </div>
            </form>
            <h3>Participants:</h3>
            <table class="table">
                <tr>
                    <th style="background-color: rgb(14, 67, 112); color: white;">Sr.</th>
                    <th style="background-color: rgb(14, 67, 112); color: white;">Participant Name</th>
                    <th style="background-color: rgb(14, 67, 112); color: white;">{{'common.category' | translate}}</th>
                    <th style="background-color: rgb(14, 67, 112); color: white;">Contractor</th>
                    <th style="background-color: rgb(14, 67, 112); color: white;">{{'common.table.action' | translate}}</th>
                </tr>
                <tr *ngFor="let labour of labours; let i = index">
                    <td>{{ i + 1 }}.</td>
                    <td>{{ labour.labour_name }}</td>
                    <td>{{ labour.category }}</td>
                    <td>{{ labour.contractor_name }}</td>
                    <td>
                        <clr-icon shape="trash" class="is-error" *ngIf="labour.status == 'true'" (click)="change('false', i)"></clr-icon>
                        <clr-icon shape="plus" class="is-success" *ngIf="labour.status == 'false'" (click)="change('true', i)"></clr-icon>
                    </td>
                </tr>
                <tr *ngIf="labours?.length == 0">
                    <td colspan="5">{{'common.noRecords' | translate}}</td>
                </tr>
            </table>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="save(trainerForm)">MAKE ANNOUCEMENT</button>
    </div>
</div>
