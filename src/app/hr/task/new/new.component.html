<div class="card">
   <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Task Submited Form</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/hr/task" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
    <div class="card-block">
        <div class="card-text">
            <form #Form="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Employee:<span style="color:red">*</span></label>
                        <select name="employee" ngModel required style="height: 33px;">
                            <option></option>
                            <option *ngFor="let list of employeeList" [value]="list.emp_id">{{ list.firstname }} - {{ list.emp_id }}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                        <label>Task:<span style="color:red">*</span></label>
                        <input type="text" name="task" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Description:<span style="color:red">*</span></label>
                        <input type="text" name="description" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Evaluation:<span style="color:red">*</span></label>
                        <select name="evaluation" [(ngModel)]="evaluation" required >
                            <option>Qualitative</option>
                            <option>Quantitative</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12" *ngIf="evaluation=='Quantitative'">
                        <label>Marks:<span style="color:red">*</span></label>
                        <input type="text" name="marks" ngModel required>
                    </div>
                </div> 
            </form>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="save(Form)">{{'common.save' | translate}}</button>
    </div>
</div>
