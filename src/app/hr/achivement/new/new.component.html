<div class="container-fluid">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Achievement Registration
        </div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/hr/achivement/" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>

    <div class="card-block">
      <form #Form="ngForm">
        <div class="card-text">
          <div class="clr-row">

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Department:</label>
              <select name="department" [(ngModel)]="department_name" (change)="getDepartmentsEmployee($event.target.value)">
                <option></option>
                <option *ngFor="let dpt of departments" [value]="dpt.department_name">{{ dpt.department_name }}</option>
              </select>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Employee:</label>
              <select name="emp_id" [(ngModel)]="emp_code" required>
                <option></option>
                <option *ngFor="let employee of employees" [value]="employee.emp_id">{{ employee.firstname }}-{{ employee.emp_id }}</option>
              </select>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Achievement Section:<span style="color: red;">*</span></strong></label>
              <input type="text" name="section" ngModel required #current_salary="ngModel">
              <span *ngIf="current_salary.invalid && current_salary.touched" style="color: red;">Please Enter Achievement Section!</span>
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Description of Achievement:<span style="color: red;">*</span></strong></label>
              <input type="text" name="description" ngModel required #description="ngModel">
              <span *ngIf="description.invalid && description.touched" style="color: red;">Please Enter Description of Achievement!</span>
            </div>

            <div class="clr-col-lg-3 clr-col-md-3">
              <label><strong>Start Date</strong></label>
              <input type="date" name="from_date" [(ngModel)]="from_date" required [max]="today">
            </div>

            <div class="clr-col-lg-3 clr-col-md-3">
              <label><strong>End Date</strong></label>
              <input type="date" name="to_date" [(ngModel)]="to_date" required [max]="today">
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Benefit to Company:<span style="color: red;">*</span></strong></label>
              <input type="text" name="benefit" ngModel required #benefit="ngModel">
              <span *ngIf="benefit.invalid && benefit.touched" style="color: red;">Please Enter Benefit to Company!</span>
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Outcome of Achievement:<span style="color: red;">*</span></strong></label>
              <select name="outcome" ngModel required>
                <option></option>
                <option>Three Months</option>
                <option>Half Year</option>
                <option>Mid Year</option>
                <option>Yearly</option>
              </select>
            </div>

          </div>
        </div>
      </form>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="save(Form)">{{'common.save' | translate}}</button>
    </div>
  </div>
</div>
