<div class="container-fluid">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Joining Report </div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/hr/recruitment" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon>{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #Form="ngForm">
          <div class="clr-row">

            <!-- <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Select Candidate:</label>
                <select name="emp_id" [(ngModel)]="emp_id" required>
                  <option ></option>
                  <option ></option>
                  <option *ngFor="let candidate of candidates" [value]="candidate.id">{{ candidate.candidate_name }} 
                  </option>
                </select>
              </div> -->

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Select Candidate:<sup style="color: red">*</sup>:</strong></label>
              <select name="employee_type" ngModel required (change)="setCandidate($event.target.selectedIndex)">
                <option> </option>
                <option *ngFor="let emp of pending_employees">
                  {{emp.candidate_name }}</option>

              </select>
            </div>


            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Date Of Offer Letter<span style="color: red;">*</span> </label>
              <input type="date" name="date" [(ngModel)]="date" required>

            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Departments:<sup style="color: red">*</sup>:</strong></label>
              <select name="department" ngModel (change)="getDesignation($event.target.selectedIndex)" required
                style="height: 33px;">
                <option></option>
                <option *ngFor="let department of departments">{{
                  department.department_name }}</option>
              </select>
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Designation:<sup style="color: red">*</sup>:</strong></label>
              <select name="designation" ngModel required style="height: 33px;">
                <option></option>
                <option *ngFor="let designation of designations">{{
                  designation.designation }}</option>
              </select>
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Date Of Joining<span style="color: red;">*</span> </label>
              <input type="date" name="entry_date" [(ngModel)]="entry_date" required>
            </div>

            <div class="clr-col-lg-3 clr-col-md-2 clr-col-sm-6 clr-col-xs-6">
              <label>Medical Checkup</label><br>
              <select name="checkup_type" ngModel required>
                <option value="Pre Employeement">Pre Employeement</option>
                <option value="Post Joining">Post Joining</option>
              </select>
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label><strong> Employee Code(Last Code :{{last_Emp_code}}) :<sup
                    style="color: red">*</sup>:</strong></label>
              <input type="text" #emp_no="ngModel" name="emp_no" ngModel required>
              <span style="color: red;" *ngIf="emp_no.invalid && emp_no.touched">Please
                Enter Valid Employee
                Code!</span>
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Location<span style="color: red;">*</span> </label>
              <input type="text" name="location" [(ngModel)]="location" required>
            </div>

          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="savejoining(Form)">{{'common.save' | translate}}</button>
      <button class="btn btn-danger" (click)="isNew = false">{{'common.close' | translate}}</button>
    </div>
  </div>
</div>
