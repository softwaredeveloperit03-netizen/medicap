<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Promotion Registration
          </div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/hr/promotion" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
      <div class="card-block">
        <form #promotionRegistration="ngForm">
          <div class="card-text">
            <div class="clr-row">


              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Department:</strong></label>
                <select name="department_name" ngModel required>
                  <option></option>
                  <option *ngFor="let type of departments">{{type.department_name}}</option>
              </select>
      
              </div>

                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Select Employee:</strong></label>
                    <!-- <input type="text" name="section" ngModel> -->
                    <select name="SelectEmployee" ngModel  style="height: 33px;">
                      <option></option>
                      <option *ngFor="let section of sections">{{ SelectEmployee.SelectEmployee_name }}</option>
                    </select>
      
                  </div>


                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Joining Date:</strong></label>
                    <input type="date" name="joining_date" ngModel>
                  </div>


                  <div class="clr-col-lg-3 clr-col-md-3">
                    <label><strong>Last Appraisal Date</strong></label>
                    <input type="date" name="from_date" [(ngModel)]="from_date" required [max]="today">
                    <span style="margin-right:50px;"></span>
                </div>


                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Appraisal Type :<span style="color: red;">*</span></strong></label>
                    <select name="Approval Type" ngModel required>
                      <option></option>
                      <option>Three Months</option>
                      <option>Half Year</option>
                      <option>Mid Year</option>
                      <option>Yearly</option>
                      
                    </select>
    
                  </div>

                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Reason For Appraisal:<span style="color: red;">*</span></strong></label>
                    <input type="text" name="Reason For Approval" ngModel required>
                  </div>


                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Special Recommendation:<span style="color: red;">*</span></strong></label>
                    <input type="text" name="Reason For Approval" ngModel required>
                  </div>

                 
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Appraisal Out Of Reward:</strong> </label>
                    <select name="epf_app" [(ngModel)]="epf_app" >
                      <option></option>
                      <option>Yes</option>
                      <option>No</option>
                    </select>
                  </div>


                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Recommendation By:<span style="color: red;">*</span></strong></label>
                    <input type="text" name="Recommendation By" ngModel required>
                  </div>


                  
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>HR Remark:<span style="color: red;">*</span></strong></label>
                    <input type="text" name="HR Remark" ngModel required>
                  </div>


                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Attendance:</strong> </label>
                    <select name="epf_app" [(ngModel)]="epf_app" >
                      <option></option>
                      <option>Ok</option>
                      <option>Not Ok</option>
                    </select>
                  </div>

                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Behaviour:<span style="color: red;">*</span></strong></label>
                    <select name="Behaviour" ngModel required>
                      <option></option>
                      <option>Good</option>
                      <option>Excellent</option>
                      <option>outstanding</option>
                     
                    </select>
    
                  </div>

                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Performance:<span style="color: red;">*</span></strong></label>
                    <select name="Performance" ngModel required>
                      <option></option>
                      <option>Good</option>
                      <option>Excellent</option>
                      <option>outstanding</option>
                     
                    </select>
    
                  </div>

            </div>
        </div>
    </form>
</div>
    </div>
</div>
