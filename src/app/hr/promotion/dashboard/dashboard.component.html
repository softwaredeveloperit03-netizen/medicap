
<div class="card"*ngIf="!isView">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-5" style="color: aliceblue;margin-top: -2px;text-align: left;">Performance Appraisal and Promotion</div>
          <div class="clr-col-lg-7" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-success" routerLink="new">{{'common.new' | translate}}</button>
            <button class="btn btn-sm" routerLink="/hr/" style="background-color: red;color: white;">
                <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
    </div>
    <div class="card-block">
      <div class="clr-row">
          <!-- <div class="clr-col-lg-3 clr-col-md-3">
              <label>Department:</label>
              <select name="deparment" [(ngModel)]="department">
                  <option></option>
                  <option *ngFor="let depart of departments" value="{{depart.department_name}}">{{depart.department_name}}</option>
              </select>
          </div> -->
          <div class="clr-col-lg-2 clr-col-md-2">
              <label>From Date</label>
              <input type="date" name="from_date" [(ngModel)]="from_date" required [max]="today">
          </div>
          <div class="clr-col-lg-2 clr-col-md-2">
              <label>To Date</label>
              <input type="date" name="to_date" [(ngModel)]="to_date" required [max]="today">
          </div>
          <div class="clr-col-lg-1 clr-col-md-2" style="margin-top: 32px;">
              <button class="btn btn-danger" (click)="getDeptIndendsLog()">{{'common.search' | translate}}</button>
          </div>
          <div class="clr-col-lg-2">
              <button class="btn btn-danger" (click)="AllRecord()" style="margin-top: 32px;">Clear Filter</button>
          </div>
      </div>
      <div class="card-text">
          <table class="table table-border">
              <tr>
                  
                  <th style="text-align: left;width: 10%; background-color: rgb(14,67,112); color: white;">{{'common.date' | translate}}</th>
                  <th style="text-align: left; background-color: rgb(14,67,112); color: white;">Name Of Employee</th>
                  <th style="text-align: left; background-color: rgb(14,67,112); color: white;">Appraisal Type</th>                    
                  <th style="text-align: left; background-color: rgb(14,67,112); color: white;">Appraisal Due</th> 
                  <th style="text-align: left; background-color: rgb(14,67,112); color: white;">Recommended By</th>  
                  
              </tr>
             
             
          </table>
      </div>
  </div>
  <div class="card-footer">
      <button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button>
  </div>
  </div>
