<div class="card">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Prepared New Letter
      </div>
      <div class="clr-col-12" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        <button class="btn btn-sm" routerLink="/hr/letter" style="background-color: red;color: white;">
          <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
        </button>
      </div>
    </div>
  </div>

  <div class="card-block">
    <div class="card-text">
      <form #Form="ngForm">
        <div class="clr-row">
          <div class="clr-col-lg-3">
            <label><strong>Letter Type:<sup style="color: red">*</sup></strong></label>
            <select name="letter_type" [(ngModel)]="letter_type">
              <option></option>
              <option>Employee</option>
              <option>Goverment Office</option>
              <option>Other</option>
            </select>
          </div>
        </div>
        <div class="row" *ngIf="letter_type=='Employee'" style="display: inline-flex;">

          <div class="clr-col-3 " style="padding: 0%; margin: 0%;">
            <label>Department:</label>
            <select name="department" #dept="ngModel" ngModel (change)="getDesignation(dept)" required>
              <option></option>
              <option *ngFor="let dept of departments">{{ dept.department_name }}</option>
            </select>
          </div>
          <div class="clr-col-3 ">
            <label>Designation:</label>
            <select name="designation" ngModel (change)="getEmployees(dept.value, $event.target.value)" required>
              <option></option>
              <option *ngFor="let designation of designations">{{ designation.designation }}</option>
            </select>
          </div>
          <div class="clr-col-3 ">
            <label>Employee:</label>
            <select name="employee" ngModel required>
              <option></option>
              <option *ngFor="let employee of employees" [value]="employee.emp_id">{{ employee.firstname}} (
                {{employee.emp_id}} )</option>
            </select>
          </div>
          <div class="clr-col-3">
            <label>Date:</label>
            <input type="date" ngModel name="letter_date">
          </div>
        </div>
       

        <div class="clr-row" *ngIf="letter_type=='Employee'" style="padding: 12px;">
          <div class="clr-col-">
            <label>Employee Id:</label>
            <input type="text" name="emp_id" ngModel required>
          </div>
        </div>

        <div class="clr-row" *ngIf="letter_type=='Goverment Office'">
          <div class="clr-col-12">
            <label>Goverment:</label>
            <select name="goverment" ngModel required>
              <option></option>
              <option *ngFor="let gov of agency;let i = index;">{{gov.authority_name}}</option>

            </select>
          </div>
        </div>

        <div class="clr-row" *ngIf="letter_type=='Other'">
          <div class="clr-col-12">
            <label>To:</label>
            <input type="text" name="to" ngModel required>
          </div>
        </div>

        <div class="clr-row" *ngIf="letter_type=='Other'">
          <div class="clr-col-12">
            <label>Address:</label>
            <input type="text" name="address" ngModel required>
          </div>
        </div>

        <div class="clr-row">
          <div class="clr-col-12">
            <label>Subject:</label>
            <input type="text" name="subject" ngModel required>
          </div>
        </div>

        <div class="clr-row">
          <div class="clr-col-12">
            <label>Body:</label>
            <textarea rows="10" name="body" ngModel required></textarea>
          </div>
        </div>


      </form>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="savenew(Form)">{{'common.save' | translate}}</button>
    </div>
