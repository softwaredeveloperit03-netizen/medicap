<div class="card">
    <div class="card-header">Shift Timing</div>
    <div class="card-block">
        <div class="card-text">
            <table class="table">
                <tr>
                    <th style="width: 50px;">Sr.</th>
                    <th style="text-align: left;">Shift</th>
                    <th>Time</th>
                </tr>
                <tr *ngFor="let result of results; let i = index">
                    <td>{{ i + 1 }}.</td>
                    <td style="text-align: left;">{{ result['shift'] }}</td>
                    <td>{{ result['from_time'] }} - {{ result['to_time'] }}</td>
                </tr>
            </table>
        </div>
    </div>
</div>
