<div class="card">
   <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Holidays</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
    <div class="card-block">
        <div class="card-text">
            <table class="table">
                <tr>
                    <th>Sr.</th>
                    <th>{{'common.date' | translate}}</th>
                    <th>Holiday</th>
                </tr>
                <tr *ngFor="let result of results; let i = index">
                    <td>{{ i + 1 }}.</td>
                    <td>{{ result['entry_date'] | date : 'dd-MM-YYYY' }}</td>
                    <td>{{ result['holiday'] }}</td>
                </tr>
            </table>
        </div>
    </div>
</div>
