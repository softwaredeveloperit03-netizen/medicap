<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Medical Checkup</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/hr/medical" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
          </div>
        </div>
    </div>
        <div class="card-block" *ngIf="!isView">
            <div class="clr-row">
                <div class="clr-col-lg-5">
                <label>Search </label>
                <input type="text" placeholder="Search..." [(ngModel)]="searchQuery">
                </div>
            </div>
            <div class="datagrid-wrapper">
                <clr-datagrid [clrDgLoading]="loading" [clrDgFilter]="searchQuery" >
        
                    <clr-dg-column>{{'common.table.srNo' | translate}}</clr-dg-column>
                    <clr-dg-column>Employee Id</clr-dg-column>
                    <clr-dg-column>Candidate Name</clr-dg-column>
                    <clr-dg-column>Checkup Type</clr-dg-column>
                    <clr-dg-column>Entry By</clr-dg-column>
                    <clr-dg-column>Entry Date</clr-dg-column>
                    <clr-dg-column>{{'common.table.action' | translate}}</clr-dg-column>
        
                <clr-dg-row *clrDgItems="let result of filteredMaterials; let i = index" [clrDgItem]="result">
                    <clr-dg-cell>{{i+1}}</clr-dg-cell>
                    <clr-dg-cell>{{ result.id }}</clr-dg-cell>
                    <clr-dg-cell>{{ result.candidate_name }}</clr-dg-cell>
                    <clr-dg-cell>{{ result.checkup_type }}</clr-dg-cell>
                    <clr-dg-cell>{{ result.entry_by }}</clr-dg-cell>
                    <clr-dg-cell>{{ result.entry_date | date: 'dd-MM-yyyy' }}</clr-dg-cell>
                    <clr-dg-cell>
                        <button class="btn btn-sm btn-info" (click)="viewForm(i)">{{'common.view' | translate}}</button>
                    </clr-dg-cell>
                </clr-dg-row>
                </clr-datagrid>
            </div>
        </div>
        <div class="card-block" *ngIf="isView">


                <form #formdata="ngForm" >
                    <div class="clr-row">
                        <div class="clr-col-lg-4 clr-md-4 clr-col-xs-12">
                            <label>Employee / Candidate:</label>
                            <input type="text" name="candidate_name" [(ngModel)]="selectedResult['candidate_name']" readonly>
                        </div>
                        <div class="clr-col-lg-4 clr-md-4 clr-col-xs-12">
                            <label>Checkup Type:</label>
                            <input type="text" name="checkup_type" [(ngModel)]="selectedResult['checkup_type']" readonly>
                        </div>
                    </div>
                    <div class="clr-row">
                        <div class="clr-col-lg-3 clr-md-3 clr-col-xs-12">
                            <label>Select Test to Perform:<span style="color:red;">*</span></label>
                        </div>
                    
                        <div class="clr-col-lg-3 clr-md-3 clr-col-xs-12" *ngFor="let checkbox of results">
                            <input type="checkbox" [id]="'checkbox-' + checkbox.id"name="bp" [(ngModel)]="checkbox.selected">
                            <label [for]="'checkbox-' + checkbox.id"> {{ checkbox.test_name }} {{ checkbox.test }}</label>
                        </div>
                    </div>
                    <div  class="clr-row">
                        <div class="clr-col-lg-3 clr-md-3 clr-col-xs-12">
                            <label>Frequency: (In Month)<span style="color:red;">*</span></label>
                            <select name="frequency" [(ngModel)]="frequency" required>
                                <option value="3">3 Months</option>
                                <option value="6">6 Months</option>
                                <option value="12">12 Months</option>
                            </select>
                        </div>
                    
                    </div>
                    <div class="clr-row">
                        <div class="clr-col-lg-12 clr-md-12 clr-col-xs-12">
                            <button class="btn btn-primary" (click)="addMedicalRecord(formdata)">{{'common.submit' | translate}}</button>
                            <button class="btn btn-warning" (click)="viewf()">{{'common.close' | translate}}</button>
                        </div>
                    </div>
                </form>
        </div>
     
</div>
