    <div class="card-block">

            <clr-datagrid [clrDgLoading]="loading" *ngIf="!isView" >
             
                <clr-dg-column>Candidate Name</clr-dg-column>
                <clr-dg-column>{{'common.department' | translate}}</clr-dg-column>
                <clr-dg-column>Entry By</clr-dg-column>
                <clr-dg-column>Entry Date</clr-dg-column>
                <clr-dg-column>{{'common.status' | translate}}</clr-dg-column>
                <clr-dg-column>Offer Letter</clr-dg-column>
          
            <clr-dg-row *clrDgItems="let user of data; let i = index" [clrDgItem]="user">
                <clr-dg-cell>{{user.candidate_name}}</clr-dg-cell>
                <clr-dg-cell>{{user.department}}</clr-dg-cell>
                <clr-dg-cell>{{user.entry_by}}</clr-dg-cell>
                <clr-dg-cell>{{user.entry_date | date: 'dd-MM-yyyy'}}</clr-dg-cell>
                <clr-dg-cell>{{user.status}}</clr-dg-cell>
                <clr-dg-cell>
                    <button class="btn btn-sm btn-info" (click)="viewForm(calculateStartSrNo() + i)">Proceed</button>
                </clr-dg-cell>
            </clr-dg-row>
            <!-- <clr-dg-footer class="clarity-footer">

      </clr-datagrid>

            <form #formdata="ngForm" *ngIf="isView">
                <div class="clr-row">
                    <div class="clr-col-lg-4 clr-md-4 clr-col-xs-12">
                        <label>Employee / Candidate:</label>
                        <input type="text" name="candidate_name" [(ngModel)]="selectedResult['candidate_name']" readonly>
                    </div>
                    <div class="clr-col-lg-4 clr-md-4 clr-col-xs-12">
                        <label>Checkup Type:</label>
                        <input type="text" name="checkup_type" [(ngModel)]="selectedResult['status']" readonly>
                    </div>
                    <div class="clr-col-lg-4 clr-md-4 clr-col-xs-12">
                        <label>Physician:<span style="color:red;">*</span></label>
                        <select name="phisician_no" ngModel required>
                            <option></option>
                            <option *ngFor="let phisician of phisicians;let i = index" [value]="phisician.id">{{ phisician.doctor_name }}</option>
                        </select>
                    </div>
                </div>
                <div class="clr-row">
                    <div class="clr-col-lg-3 clr-md-3 clr-col-xs-12">
                        <label>Select Test to Perform:<span style="color:red;">*</span></label>
                    </div>
                   
                    <div class="clr-col-lg-3 clr-md-3 clr-col-xs-12" *ngFor="let checkbox of results">
                        <input type="checkbox" [id]="'checkbox-' + checkbox.id"name="bp" [(ngModel)]="checkbox.selected">
                        <label [for]="'checkbox-' + checkbox.id"> {{ checkbox.test_name }} {{ checkbox.test }}</label>
                      </div>

                </div>
                <div class="clr-row">
                    <div class="clr-col-lg-3 clr-md-3 clr-col-xs-12">
                        <label>Frequency: (In Month)<span style="color:red;">*</span></label>
                        <select name="frequency" ngModel required>
                            <option value="3">3 Months</option>
                            <option value="6">6 Months</option>
                            <option value="12">12 Months</option>
                        </select>
                    </div>
                 
                </div>
                <div class="clr-row">
                    <div class="clr-col-lg-12 clr-md-12 clr-col-xs-12">
                        <button class="btn btn-primary" (click)="addMedicalRecord(formdata)">{{'common.submit' | translate}}</button>
