<div class="container-fluid">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Resignation Form</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/hr/resignation/res" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>  <div class="card-block">
      <div class="card-text">
        <form class="clr-row" #Form="ngForm">

            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label>Resignation Type:<span style="color:red">*</span></label>
                <select name="resignation_type" ngModel required>
                  <option>Notice Of Resignation</option>
                  <option>Resignation</option>
                </select>
              </div>
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label>Department:</label>
                <select name="department"   [(ngModel)]="department" (change)="getEmployees( )" required>
                  <option></option>
                  <option *ngFor="let dept of departments">{{ dept.department_name }}</option>
                </select>
              </div> 

 
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Employee Name:<span style="color:red">*</span></label>
              <select name="emp_name" ngModel (change)="getEmployees_id( $event.target.selectedIndex)" required>
              <option></option>
              <option *ngFor="let designation of employees">{{ designation.firstname }} {{ designation.middlename }} {{ designation.lastname }} </option>
            </select>
          </div>
 
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Employee Id:<span style="color:red">*</span></label>
            <input type="text" name="emp_id" [(ngModel)]="emp_ids" required readonly>
          </div>

          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Designation:<span style="color:red">*</span></label>
            <input type="text" name="designation" [(ngModel)]="designation" required readonly>
          </div>
           
          <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
            <label>Description/Resignation Content:<span style="color:red">*</span></label>
            <textarea rows="3" name="description" ngModel required></textarea>
          </div>
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label>Date Of Resignation:<span style="color:red">*</span></label>
            <input type="date" name="resignation_date" ngModel required>
          </div>
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label>Expected Releaving Date:<span style="color:red">*</span></label>
            <input type="date" name="expected_releaving" ngModel required>
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="submit(Form)">{{'common.save' | translate}}</button>
    </div>
  </div>
</div>
