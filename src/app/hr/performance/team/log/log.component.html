<div class="container-fluid" *ngIf="!isView">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Team Approvel</div>
              <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/hr/performance/team" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
              </div>
            </div>
          </div>
        <div class="card-block">
            <div class="card-text">
                <table class="table">
                    <tr>
                        <th style="text-align: left;">Sr.</th>
                        <th style="text-align: left;">Employees Name</th>
                        <th style="text-align: left;">Employee ID </th>
                        <th style="text-align: left;">Appraiser Name  </th>
                         <th>{{'common.table.action' | translate}}</th>
                    </tr>
                    <tr *ngFor="let result of results; let i = index">
                        <td style="text-align: left;">{{ i + 1 }}.</td>
                        <td style="text-align: left;">{{ result.appraisal_type}}</td>
                        <td style="text-align: left;">{{ result.department}}</td>
                        <td style="text-align: left;">{{ result.evualation_parameter}}</td>
                        <td style="text-align: left;">{{ result.evualation_type}}</td>
                         <td>
                            <button class="btn btn-sm btn-info" (click)="view(i)">{{'common.view' | translate}}</button>
                        </td>
                    </tr>
                    <tr *ngIf="results?.length == 0">
                        <td colspan="7">{{'common.noRecords' | translate}}</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</div>


<div class="container-fluid" *ngIf="isView">
    <div class="card">
        <div class="card-header">Team for Approval</div>
        <div class="card-block">
            <div class="card-text">
                <div class="clr-row">
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Employee Name *:</label>
                        <input type="text" name="evualation_type" [ngModel]="selectedCheckList['evualation_type']" readonly tabindex="-1">
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Employee ID:</label> 
                        <input type="text" name="evualation_parameter" [ngModel]="selectedCheckList['department']" readonly tabindex="-1">
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Appraiser Name:</label>
                        <input type="text" name="department" [ngModel]="selectedCheckList['propritor_name']" readonly tabindex="-1">
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Evaluation Type:</label>
                        <input type="text" name="appraisal_type" [ngModel]="selectedCheckList['appraisal_type']" readonly tabindex="-1">
                    </div>
                   
                </div>
            </div>
        </div>
       
    </div>
</div>
