<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Appraisal Report </div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/hr/performance" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
     <form #StatusForm="ngForm">
        <div class="card-text">
            <h4>Employee Information</h4>
                <div class="clr-row">
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Employee Name :<span style="color: red;">*</span></label>
                        <input type="text" name="m_name" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Employee Code:<span style="color: red;">*</span></label>
                        <input type="text" name="m_code" ngModel required>
                    </div>
                   
                </div>
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left; color: black; background-color: lightgreen;">Reporting Period</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Start Date:<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="start_date" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> End Date:<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="end_time" ngModel required>
                        </div>
                          
                    </div>
                </div>
                <div class="card-header" style="text-align: left; color: white; background-color: rgb(154, 107, 230);"> Overall Ratings</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>  Overall Rating Scale:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="overall_scale" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Overall Rating Comments:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="overall_comment" ngModel required>
                        </div>
                    </div>
                </div>    
                <div class="card-header" style="text-align: left; color: white; background-color: rgb(107, 216, 230);"> Appraiser Information</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Appraiser ID:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="app_id" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Appraiser Name:<sup style="color: red">*</sup></strong></label>
                            <select type="text" name="app_name" ngModel required>
                                <option></option>
                                <option>Supervisor</option>
                                <option> </option>
                             </select> 
                        </div>
                         
                       
                    </div>
                </div>    
                <div class="card-header" style="text-align: left; color: white; background-color: rgb(107, 230, 189);">Competency Behaviour Ratings</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>  Competency Behaviour:<sup style="color: red">*</sup></strong></label>
                            <select type="text" name="behaviour" ngModel required>
                                <option></option>
                                <option>Leadership</option>
                                <option>  Problem Solving</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Avg Rating:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="avg_rating" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Comments/Feadback:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="comment" ngModel required>
                        </div>
                    </div>
                </div>        
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left;color: black; background-color: rgb(182, 212, 14);"> Summary</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>strength<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="strength" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Department Areas :<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="dep_area" ngModel required>
                        </div>
                       
                    </div>
                </div>
            </div>
            
        </form>
    </div>
        <div class="card-footer">
            <button class="btn btn-primary"(click)="save(StatusForm)">{{'common.submit' | translate}}</button>
        </div>
</div>
