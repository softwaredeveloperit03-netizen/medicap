<div class="container-fluid">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Schedule Interview</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/hr/performance/" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
      <div class="card-block">
          <div class="card-text">
             
              <table class="table">
                  <tr>
                      <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Employee Name</th>
                      <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Department For</th>
                      <th  style="background-color: rgb(14, 67, 112); color: white;">{{'common.designation' | translate}}</th>
                      <th style="background-color: rgb(14, 67, 112); color: white;">Schedule Interview</th>
                  </tr>
                  <tr *ngFor="let res of candidates;let i=index">
                      <td style="text-align: left;">{{ res.employee_name }}</td>
                      <td style="text-align: left;">{{ res.department}}</td>
                      <td style="text-align:left;">{{ res.designation }}</td>
                      
                      <td *ngIf="res.isScheduleInteview == 'No'">
                        <button class="btn btn-sm btn-info" (click)="scheduleInterview(i)">Initiate Apprisal</button>
                      </td>
                    <tr *ngIf="candidates?.length==0">
                      <td colspan="6">No Record Found !</td>
                    </tr>
              </table> 
          </div>
      </div>
  
  </div>
</div>

<clr-modal [(clrModalOpen)]="isScheduleInterview" [clrModalSize]="'lg'">
  <h3 class="modal-title">Schedule Interview</h3>
  <div class="modal-body">
      <div class="clr-row">
        <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12-clr-col-xs-12">
          Candidate Name: {{ selectedCandidate['candidate_name'] }}
        </div>
      </div>
      <form #scheduleForm="ngForm">
        <div class="clr-row">
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label><strong>Interview Date:</strong></label>
            <input type="date" name="interview_date" [min]="today" ngModel required>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label><strong>Interview Time(From):</strong></label>
            <input type="time" name="interview_time" placeholder="10:00 AM onwords" ngModel required>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label><strong>Interview Time(To):</strong></label>
            <input type="time" name="interview_time" placeholder="10:00 AM onwords" ngModel required>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label><strong>Place / Venue:</strong></label>
            <select name="venue" [(ngModel)]="venue" >
              <option>Factory</option>
              <option>Corporate</option>
              <option style="color: red;">Other</option>
            </select>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12" *ngIf="venue=='Other'">
            <label>Place Name</label>
            <input type="text" name="venue" ngModel>
        </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label><strong>Requirement Department:</strong></label>
            <select name="department" ngModel required>
              <option></option>
              <option *ngFor="let dept of departments">{{ dept.department_name }}</option>
            </select>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label><strong>Designation:</strong></label>
            <select name="designation" ngModel required>
              <option></option>
              <option *ngFor="let designation of reqdesignation">{{ designation.designation }}</option>
            </select>
          </div>
        </div>
      </form>
  </div>
  <div class="modal-footer">
      <button type="button" class="btn btn-success" (click)="saveScheduleInterview(scheduleForm)">{{'common.submit' | translate}}</button>
      <button type="button" class="btn btn-danger" (click)="isScheduleInterview = false">{{'common.close' | translate}}</button>
  </div>
</clr-modal>
