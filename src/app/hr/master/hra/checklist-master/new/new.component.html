<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;">New CheckList Form</div>
            <div class="clr-col-lg-5" style="text-align: right;padding-right: 0px;margin-top: -7px;">

                <button class="btn btn-sm" routerLink="/master/hra/checklist-master" style="background-color: red;color: white;">
                    {{'common.close' | translate}} </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #checkForm="ngForm">
                <div class="clr-row">

                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>{{'common.department' | translate}}<span style="color: red;">*</span></label>
                        <select name="department" [(ngModel)]="department" (change)="getDesignations($event.target.value)" required>
                            <option></option>
                            <option *ngFor="let dept of departments" value="{{dept.id}}">
                                {{dept.department_name}}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>{{'common.designation' | translate}}<span style="color: red;">*</span> </label>
                        <select name="designation" ngModel required>
                            <option value=""></option>
                            <option *ngFor="let des of designations">{{des.designation}}</option>
                        </select>
                    </div>

                    <!-- <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Designation:<sup style="color: red">*</sup>:</strong></label>
                         <select name="designation" ngModel  required>
                            <option></option>
                            <option *ngFor="let des of designations">{{des.designation}}</option>
                          </select>
                    </div> -->
                    <!-- <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Checkpoint<span style="color: red;">*</span> </label>
                        <select name="designation" ngModel  required>
                            <option></option>
                            <option *ngFor="let des of designations">{{des.designation}}</option>
                          </select>
                        
                             
                        
                    </div> -->
                    <!-- <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label><span style="color: red;">*</span>Checkpoint</label>
                        <input type="text" name="check_point" ngModel required>
                    </div> -->


                </div>
                <div>
                    <form #addCheckPoint="ngForm">
                        <table class="table table-border">
                            <tr>
                                <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr No.
                                </th>
                                <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Points
                                </th>
                                <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Result
                                </th>
                                <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Action
                                </th>
                            </tr>
                            <tr>
                                <td>0.</td>
                                <td style="padding:0px;">
                                    <input type="text" name="point" ngModel style="margin:0px;">
                                </td>
                                <td style="padding:0px;">
                                    <select name="result" ngModel style="margin:0px;">
                                        <option></option>
                                        <option>Excellent</option>
                                        <option>Satisfactory</option>
                                        <option>Average</option>
                                        <option>Outstanding</option>
                                    </select>                               
                                 </td>
                                <td style="padding: 0px; vertical-align: middle;" colspan="2" >
                                    <button class="btn btn-sm btn-info" (click)="addData(addCheckPoint)">{{'common.add' | translate}}</button>
                                </td>
                            </tr>
                            <tr *ngFor="let res of checkList ;let i=index">
                                <td>{{i+1}}.</td>
                                <td style="text-align: left;">{{res.point}}</td>
                                <td style="text-align: left;">{{res.result}}</td>
                                
                                <td>
                                    <clr-icon shape="trash" class="is-error" (click)="delData(i)"></clr-icon>
                                </td>

                            </tr>
                        </table>

                    </form>
                </div>

            </form>
        </div>
    </div>
    <div class="card-footer">
        <button type="button" class="btn btn-success" (click)="saveCheckPoint(checkForm)">{{'common.save' | translate}}</button>
        <!-- <button class="btn btn-primary" (click)="saveCheckPoint(checkForm)">{{'common.save' | translate}}</button> -->
        <button class="btn btn-danger" routerLink="/master/hra/checklist-master">{{'common.cancel' | translate}}</button>
    </div>
</div>
