<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-3" style="color: aliceblue;margin-top: -2px;text-align: left;">New Test Master</div>
        <div class="clr-col-lg-9" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/master/hra/test-medical" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #testForm="ngForm" class="clr-row">
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Test Name:</label>
                <select name="test_name" [(ngModel)]="test_name" required (change)="addTestname($event.target.value)">
                  <option></option>
                 
                  <option *ngFor="let test of results">{{test.test_name}}</option>
                  <option style="color: red;">Add New</option>
                </select>
              </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Test:</label>
            <input type="text" required name="test" [(ngModel)]="test" >
          </div> 
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button type="button" class="btn btn-primary" (click)="addTest(testForm.value)"
        [disabled]="testForm.form.invalid">{{'common.submit' | translate}}</button>
    </div>
  </div>

<div class="modal" *ngIf="is_add">
  <div class="modal-dialog" role="dialog" aria-hidden="true">
      <div class="modal-content">
          <div class="modal-header">
              <button aria-label="Close" class="close" type="button">
                  <clr-icon aria-hidden="true" shape="close"></clr-icon>
              </button>
              <h3 class="modal-title">ADD New Medical Test Name:</h3>
          </div>
          <div class="modal-body">
              <form #marketForm="ngForm">
                  <div class="clr-row">
                      <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-6 clr-col-xs-12">
                          <label>Medical Test Name:</label>
                          <input type="text" name="test_name" ngModel required>
                      </div>

                  </div>

              </form>
          </div>
          <div class="modal-footer">
              <button type="button" class="btn btn-outline" (click)="saveTest(marketForm)">{{'common.save' | translate}}</button>
              <button type="button" class="btn btn-danger" (click)="is_add = false">{{'common.close' | translate}}</button>
          </div>
      </div>
  </div>
</div>
