<div class="container-fluid">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Asset Master</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        <button class="btn btn-sm btn-success"  routerLink="/master/hra/asset/master/new" >NEW </button>
          <button type="button" class="btn btn-sm" (click)="closeFromMasterHub()" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
          <clr-datagrid [clrDgLoading]="loading">
          <clr-dg-column clrDgField="asset_name">Asset Name</clr-dg-column>
          <clr-dg-column clrDgField="asset_id">ID</clr-dg-column>
          <clr-dg-column clrDgField="department">Department</clr-dg-column>
          <clr-dg-column clrDgField="asset_type">Type</clr-dg-column>
          <clr-dg-column clrDgField="description">Description</clr-dg-column>
         

          <clr-dg-row *clrDgItems="let user of users; let i = index" [clrDgItem]="user"> 
             
             <clr-dg-cell>{{user.asset_name}}</clr-dg-cell>
             <clr-dg-cell>{{user.asset_id}}</clr-dg-cell>
             <clr-dg-cell>{{user.department}}</clr-dg-cell>
             <clr-dg-cell>{{user.asset_type}}</clr-dg-cell>
             <clr-dg-cell>{{user.description}}</clr-dg-cell>
          </clr-dg-row>
          <clr-dg-footer>
              <clr-dg-pagination #pagination [clrDgPageSize]="10">
                <clr-dg-page-size [clrPageSizeOptions]="[10,20,50,100]">Users per page</clr-dg-page-size>
                {{pagination.firstItem + 1}} - {{pagination.lastItem + 1}}
                of {{pagination.totalItems}} user
              </clr-dg-pagination>
            </clr-dg-footer>
          </clr-datagrid>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button>
    </div>
  </div>
</div>
