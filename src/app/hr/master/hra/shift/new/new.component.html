<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;">New Shift Form</div>
            <div class="clr-col-lg-5" style="text-align: right;padding-right: 0px;margin-top: -7px;">

                <button class="btn btn-sm" routerLink="/master/hra/shift" style="background-color: red;color: white;">
                    {{'common.close' | translate}} </button>
            </div>
        </div>
    </div>
<div class="card-block">
    <div class="card-text">
        <form #shiftForm="ngForm">
            <div class="clr-row">
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Shift Name<span style="color: red;">*</span> </label>
                    <input type="text" name="shift_name" ngModel required>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Night Shift<span style="color: red;">*</span></label><br>
                    <select name="night_shift" ngModel required>
                        <option></option>
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Shift Start Time</label>
                    <input type="time" name="start_time" ngModel required>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Shift End Time</label>
                    <input type="time" name="end_time" ngModel required>
                </div>
                <div class="clr-col-xl-3 clr-col-lg-6 clr-col-md-6 clr-col-sm-6 clr-col-12">
                  <label>Lunch Start Time:</label>
                  <input type="time" name="lunch_start_time" ngModel required>
                </div>
    
    
                <div class="clr-col-xl-3 clr-col-lg-6 clr-col-md-6 clr-col-sm-6 clr-col-12">
                  <label>Lunch End Time:</label>
                  <input type="time" name="lunch_end_time" ngModel required>
                </div>
                <div class="clr-col-xl-3 clr-col-lg-3 clr-col-md-12 clr-col-sm-12 clr-col-12">
                  <label>Short Leave:</label>
                  <select name="short_leave" ngModel required>
                    <option>No</option>
                    <option>Yes</option>
                  </select>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Shift Duration <span style="color: red;">*</span></label>
                    <input type="text" name="duration" ngModel required >
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Date Change</label><br>
                    <select name="date_change" ngModel required>
                        <option></option>
                        <option>Yes</option>
                        <option>No</option>
                    </select>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Min. Hours Half Day<span style="color: red;">*</span></label>
                    <input type="text" name="half_day" ngModel required>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Min. Hours Full Day<span style="color: red;">*</span></label>
                    <input type="text" name="full_day" ngModel required>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Default Shift</label>
                    <input type="text" name="default_shift" ngModel required>
                </div>

    </div>
</div>
<div class="card-footer">
    <button class="btn btn-primary" (click)="save(shiftForm)">{{'common.save' | translate}}</button>
    <button type="button" class="btn btn-danger" (click)="cancelFromMasterHub()">{{'common.cancel' | translate}}</button>
</div>
</div>
