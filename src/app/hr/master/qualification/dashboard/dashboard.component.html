<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Qualification</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <input type="button" value="new Qualification" (click)="isNewQualification = true"    *ngIf="isuser == 'Yes'" class="btn btn-sm btn-success">
            <button class="btn btn-sm" routerLink="/hr" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
      <div class="card-block">
        <div class="card-title">
      <!--     <input type="button" value="new Qualification" (click)="isNewQualification = true" class="btn btn-sm btn-info-outline"> -->
        </div>
        <div class="card-text datagrid-wrapper">
          <clr-datagrid >
            <clr-dg-column >Sr. </clr-dg-column>
              <clr-dg-column clrDgField="qualification">Qualification</clr-dg-column>
             <!--  <clr-dg-column>{{'common.status' | translate}}</clr-dg-column>
              <clr-dg-column>Entry By</clr-dg-column>
              <clr-dg-column>Entry Date</clr-dg-column> -->
  
              <clr-dg-row *clrDgItems="let user of qualifications; let i = index " [clrDgItem]="user">
                <clr-dg-cell>{{ calculateStartSrNo() + i+1}}</clr-dg-cell>
                  <clr-dg-cell>{{user.qualification}}</clr-dg-cell>
                 <!--  <clr-dg-cell>{{user.status}}</clr-dg-cell>
                  <clr-dg-cell>{{user.entry_by}}</clr-dg-cell>
                  <clr-dg-cell>{{user.entry_date}}</clr-dg-cell> -->
              </clr-dg-row>
  
              <clr-dg-footer>
                <clr-dg-pagination #pagination [(clrDgPageSize)]="pageSize" (clrDgPageChange)="onPageChange($event)">
                  <!-- <clr-dg-page-size [clrPageSizeOptions]="[10,20]" (clrPageSizeChange)="onPageSizeChange($event)">
                    Users per page
                  </clr-dg-page-size> -->
                  {{pagination.firstItem + 1}} - {{pagination.lastItem + 1}}
                  of {{pagination.totalItems}} 
                </clr-dg-pagination>
              </clr-dg-footer>
          </clr-datagrid>
        
        </div>
      </div>
    </div>
    </div>
  
    <clr-modal [(clrModalOpen)]="isNewQualification">
        <h3 class="modal-title">ADD NEW QUALIFICATION</h3>
        <div class="modal-body">
          <div class="card">
              <div class="card-block">
                <div class="card-text">
                <form #qualificationForm="ngForm">
                    <div class="clr-row">
                      <div class="clr-col-xl-12 clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-12">
                        <label>Qualification:</label>
                        <input type="text" name="qualification" ngModel required>
                      </div>
                    </div>
                </form>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" (click)='qualificationForm.form.valid && addQualification(qualificationForm)' [disabled]="qualificationForm.form.invalid">{{'common.submit' | translate}}</button>
          </div>
        </div>
    </clr-modal>
