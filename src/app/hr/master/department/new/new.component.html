<div class="container-fluid">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> New Department Form</div>
              <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/hr/master/department" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
              </div>
            </div>
          </div>
        <div class="card-block">
            <div class="card-text">
                <form #deptform="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12">
                            <label> Department Name:</label>
                            <input type="text" name="department_name" ngModel required>
                        </div>
                        <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12">
                            <label> Department Code:</label>
                            <input type="text" name="department_code" ngModel required>
                        </div>
                        <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12">
                            <label> Building No.:</label>
                            <input type="text" name="department_building" ngModel required>
                        </div>
                    </div>
                </form>
                
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="saveDepartment(deptform)"> SAVE</button>
        </div>
    </div>
</div>
<!-- department_code, department_name, department_building -->
