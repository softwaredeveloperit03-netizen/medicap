
<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Cross Functional Departments Appraisal Checklist</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/hr/master/appraisal" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
    </div>
  <div class="card-block">
      <div class="card-text">
        <div class="row container-fluid" >
          <form #appraisalForm="ngForm">
            <table class="table table-border">
              <tr>
                <th style="text-align:center; background-color:rgb(14, 67, 112); color: white;">{{'common.table.srNo' | translate}}</th>
                <th style="text-align:center; background-color: rgb(14, 67, 112); color: white;">Review heading</th>
                <th style="text-align:center; background-color: rgb(14, 67, 112); color: white;">Review point</th>
                <th style="text-align:center; background-color: rgb(14, 67, 112); color: white;">Grade</th>
                <th style="text-align:center; background-color:rgb(14, 67, 112); color: white;">Marks</th>
                <th style="text-align:center; background-color:rgb(14, 67, 112); color: white;">Alert Grade/Mark</th>
                <th style="text-align:center; background-color: rgb(14, 67, 112); color: white;">Action Grade/Mark </th>
              </tr>
              <tr>
                <td></td>
                <td style="padding:0px;">
                  <input type="text" name="heading" ngModel style="margin:0px;">
                </td>
                <td style="padding:0px;">
                  <input type="text" name="point" ngModel style="margin:0px;">
                </td>
                <td style="padding:0px;">
                  <input type="text" name="grade" ngModel style="margin:0px;">
                </td>
                <td style="padding:0px;">
                  <input type="text" name="mark" ngModel style="margin:0px;">
                </td>
                <td style="padding:0px;">
                    <input type="text" name="alert" ngModel style="margin:0px;">
                  </td>
                <td style="padding: 0px; vertical-align: middle;">
                  <button class="btn btn-sm btn-info" (click)="addData(appraisalForm)">{{'common.add' | translate}}</button>
                </td>
              </tr>
              <tr *ngFor="let add of appList ;let i=index">
                <td>{{i+1}}.</td>
                <td style="text-align: left;">{{add.heading}}</td>
                <td style="text-align: left;">{{add.point}}</td>
                <td style="text-align: left;">{{add.grade}}</td>
                <td style="text-align: left;">{{add.mark}}</td>
                <td style="text-align: left;">{{add.alert}}</td>
              
                <td>
                  <clr-icon shape="trash" class="is-error" (click)="delData(i)"></clr-icon>
                </td>
              </tr>
            </table>
          </form>
        </div>
      </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="save(appraisalForm)">{{'common.save' | translate}}</button>
    </div>
  </div>
