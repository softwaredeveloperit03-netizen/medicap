<div class="container-fluid">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Shift Master</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <input type="button" value="new shift" (click)="isNewHoliday = true" class="btn btn-sm btn-success" *ngIf="isuser == 'Yes'">
          <button class="btn btn-sm" routerLink="/hr/shift" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <table class="table">
          <tr>
            <th style="width: 40px;">Sr.</th>
            <th style="text-align: left;">Shift Name</th>
            <th style="text-align: left;">Start Time</th>
            <th style="text-align: left;">End Time</th>
            <!-- <th style="text-align: left;">Lunch Start Time</th>
            <th style="text-align: left;">Lunch End Time</th> -->
            <th style="text-align: left;">Short Leave</th>
            <th style="text-align: left;">Shift Duration</th>
            <th style="text-align: left;">Half Day Hrs</th>

          </tr>
          <tr *ngFor="let data of holidays; let i=index">
            <td style="text-align: left;">{{ i+1 }}.</td>
            <td style="text-align: left;">{{ data.shift_name }}</td>
            <td style="text-align: left;">{{ data.start_time }}</td>
            <td style="text-align: left;">{{ data.end_time }}</td>
            <!-- <td style="text-align: left;">{{ data.lunch_start_time || 'NA' }}</td>
            <td style="text-align: left;">{{ data.lunch_end_time || 'NA' }}</td> -->
            <td style="text-align: left;">{{ data.short_leave || 'NA' }}</td>
            <td style="text-align: left;">{{ data.duration || '0' }}</td>
            <td style="text-align: left;">{{ data.half_day_hrs }}</td>
          </tr>
          <tr *ngIf="holidays?.length == 0">
            <td colspan="6">{{'common.noRecords' | translate}}</td>
          </tr>
        </table>


      </div>
    </div>
  </div>
</div>
