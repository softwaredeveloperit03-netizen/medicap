<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Holidays</div>
          <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <input type="button" value="new holiday" (click)="isNewHoliday = true"  *ngIf="isuser == 'Yes'" class="btn btn-sm btn-success">
            <button class="btn btn-sm" routerLink="/hr" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
      <div class="card-block">
        <div class="card-title">
         </div>
        <div class="card-text unique-table-wrapper">
         
                  
          <table class="table table-border unique-table">
              
            <tr>
              <th style="background-color: rgb(0, 0, 0);color: white; font-weight: bolder;text-align: left;">Sr. No</th>
              <th style="background-color: rgb(0, 0, 0);color: white; font-weight: bolder;text-align: left;">Holiday Date</th>
              <th style="background-color: rgb(0, 0, 0);color: white; font-weight: bolder;text-align: left;">Holiday Name</th>
            </tr>

            <tr *ngFor="let user of filteredMaterials; let i = index" 
                [ngClass]="{'past-date': isPastDate(user.holiday_date), 'upcoming-date': !isPastDate(user.holiday_date)}">
              <td style="text-align: left;font-weight: bolder;">{{ i + 1 }}</td>
              <td style="text-align: left;font-weight: bolder;">{{ user.holiday_date | date: 'dd-MM-yyyy' }}</td>
              <td style="text-align: left;font-weight: bolder;">{{ user.holiday_name }}</td>
            </tr>
     
        </table>
        
        </div>
      </div>
      <div class="card-footer">
        <button type="button" class="btn btn-primary" (click)="exportToExcel()">Export to Excel</button>
      </div>
    </div>
    </div>
  
    <clr-modal [(clrModalOpen)]="isNewHoliday">
        <h3 class="modal-title">ADD NEW HOLIDAY</h3>
        <div class="modal-body">
          <div class="card">
              <div class="card-block">
                <div class="card-text">
                <form #qualificationForm="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-xl-12 clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-12">
                            <label>Holiday Date:</label>
                            <input type="date" name="holiday_date" ngModel required>
                          </div>
                      <div class="clr-col-xl-12 clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-12">
                        <label>Holiday Name:</label>
                        <input type="text" name="holiday_name" ngModel required>
                      </div>
                    </div>
                </form>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" (click)='qualificationForm.form.valid && addHolidays(qualificationForm)' [disabled]="qualificationForm.form.invalid">{{'common.submit' | translate}}</button>
          </div>
        </div>
    </clr-modal>
