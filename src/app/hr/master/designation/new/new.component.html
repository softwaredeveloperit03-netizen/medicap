<div class="card designation-new-card">
  <div class="card-header designation-new-head">
    <div class="designation-new-head__title">New Position</div>
    <button class="btn btn-sm btn-danger" routerLink="/hr/master/designation">
      {{'common.close' | translate}}
    </button>
  </div>

  <div class="card-block">
    <div class="card-text">
      <form #designationForm="ngForm" novalidate class="designation-form">
        <div class="clr-row">
          <!-- <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Designation Heading <span class="req">*</span></label>
            <input type="text" name="designation_heading" ngModel required minlength="2" maxlength="120" #headingRef="ngModel"
              [class.is-invalid]="headingRef.invalid && headingRef.touched">
            <span class="field-error" *ngIf="headingRef.invalid && headingRef.touched">Enter heading (min 2 chars).</span>
          </div> -->

          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Department <span class="req">*</span></label>
            <select name="dept_id" ngModel required #deptRef="ngModel" [class.is-invalid]="deptRef.invalid && deptRef.touched">
              <option value="">Select...</option>
              <option *ngFor="let dept of departments" [value]="dept.id">{{ dept.department_name }}</option>
            </select>
            <span class="field-error" *ngIf="deptRef.invalid && deptRef.touched">Select department.</span>
          </div>

          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Position <span class="req">*</span></label>
            <input type="text" name="designation" ngModel required minlength="2" maxlength="120" #designationRef="ngModel"
              [class.is-invalid]="designationRef.invalid && designationRef.touched">
            <span class="field-error" *ngIf="designationRef.invalid && designationRef.touched">Enter position (min 2 chars).</span>
          </div>
        </div>
      </form>

      <div class="responsibility-box">
        <label>Responsibilities <span class="req">*</span></label>
        <div class="responsibility-input-row">
          <input type="text" [(ngModel)]="responsibilityInput" [ngModelOptions]="{standalone: true}" placeholder="Enter responsibility">
          <button type="button" class="btn btn-sm btn-info" (click)="addResponsibility()">{{'common.add' | translate}}</button>
        </div>

        <div class="compact-table-wrap">
          <table class="table compact-table">
            <thead>
              <tr>
                <th>Sr.</th>
                <th>Responsibility</th>
                <th>{{'common.table.action' | translate}}</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let result of list; let i = index">
                <td>{{ i + 1 }}</td>
                <td>{{ result.responsibility }}</td>
                <td>
                  <clr-icon shape="trash" class="is-error action-icon" (click)="del(i)"></clr-icon>
                </td>
              </tr>
              <tr *ngIf="list.length === 0">
                <td colspan="3">{{'common.noRecords' | translate}}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="card-footer">
    <button class="btn btn-primary" (click)="addDesignation(designationForm)">{{'common.save' | translate}}</button>
  </div>
</div>
