<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Section Entry Form</div>
          <div class="clr-col-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/hr/master/section" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
          </div>
        </div>
      </div>
    <div class="card-block">
        <div class="card-text">
            <form #sectionForm="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Department:</label>
                        <select name="department" ngModel required>
                            <option></option>
                            <option *ngFor="let department of departments">{{ department.department_name }}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Room Name:</label>
                        <input type="text" name="section_name" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Room Number:</label>
                        <input type="text" name="section_code" ngModel required>
                    </div>
                    <!-- <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Building No:</label>
                        <input type="text" name="building_no" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Room No:</label>
                        <input type="text" name="room_no" ngModel required>
                    </div> -->
                </div>
            </form>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="save(sectionForm)">{{'common.save' | translate}}</button>
    </div>
</div>
