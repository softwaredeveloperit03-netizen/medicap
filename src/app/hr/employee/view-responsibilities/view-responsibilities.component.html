<div class="container-fluid" *ngIf="isShow">
  <div class="card">
    <div class="card-header">Job Responsibility and Accountability</div>
    <div class="card-block">
      <div class="card-text">
        <form>
          <div class="clr-row">
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Employee</label>
              <input type="text" name="employee" ngModel="{{ responsibilities['emp_name'] }} - {{ responsibilities['emp_id'] }}" readonly>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>{{'common.designation' | translate}}</label>
              <input type="text" name="designation" ngModel="{{ responsibilities['designation'] }}" readonly>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Date of Joining</label>
              <input type="text" name="joining_date" ngModel="{{ responsibilities['joining_date'] }}" readonly>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Qualification</label>
              <input type="text" name="qualification" ngModel="{{ responsibilities['qualification'] }}" readonly>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Reporting To</label>
              <input type="text" name="reporting_to" ngModel="{{ responsibilities['reporting_to'] }}" readonly>
            </div>
          </div>
          <table class="table">
            <thead>
              <tr>
                <th style="width: 10%">Sr.</th>
                <th style="width: 90%">Responsibility</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let resp of list1; let i = index">
                <td>{{ i+1 }}</td>
                <td>{{ resp.responsibility }}</td>
              </tr>
            </tbody>
          </table>
        </form>
      </div>
    </div>
  </div>
</div>
