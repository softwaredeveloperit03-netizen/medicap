<div class="container">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Induction Training</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/medical-dashboard" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <clr-datagrid>
            <clr-dg-column>Employee</clr-dg-column>
            <clr-dg-column>Learning</clr-dg-column>
            <clr-dg-column>Equipment Seen</clr-dg-column>
            <clr-dg-column>Training Start Date</clr-dg-column>
            <clr-dg-column>Training End Date</clr-dg-column>
            <clr-dg-column>{{'common.status' | translate}}</clr-dg-column>

            <clr-dg-row *ngFor="let user of trainings">
                <clr-dg-cell>{{user.emp_name}}</clr-dg-cell>
                <clr-dg-cell>{{user.learning}}</clr-dg-cell>
                <clr-dg-cell>{{user.equipmentseen}}</clr-dg-cell>
                <clr-dg-cell>{{user.trainingfrom}}</clr-dg-cell>
                <clr-dg-cell>{{user.trainingto}}</clr-dg-cell>
                <clr-dg-cell *ngIf="user.status == 'pending'">
                  <button class="btn btn-sm btn-primary-outline" (click)="approveTraining(user.id)">{{'common.approve' | translate}}</button>
                </clr-dg-cell>
                <clr-dg-cell *ngIf="user.status !== 'pending'">
                  {{user.status}}
                </clr-dg-cell>
            </clr-dg-row>
        </clr-datagrid>
      </div>
    </div>
  </div>
</div>
