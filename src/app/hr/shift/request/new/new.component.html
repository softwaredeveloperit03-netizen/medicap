
<div class="container-fluid">
    <div class="card">
      <div class="card-header">Shift Change Request Form</div>
      <div class="card-block">
        <div class="card-text">
        <form #apprisal="ngForm">
            <div class="clr-row">
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Departments:<sup style="color: red">*</sup>:</strong></label >
                    <select  name="department" #dept="ngModel"  [(ngModel)]="department"  (change)="getEmployees($event.target.value)" required >
                      <option></option>
                      <option *ngFor="let dept of departments">  {{ dept.department_name }} </option>
                      <option>ALL Employee</option>
                    </select>
                  </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Employee:<sup style="color: red">*</sup>:</strong></label >
                    <select  name="employee" #dept="ngModel"  [(ngModel)]="employee"  (change)="getcurrentShift($event.target.value)" required >
                      <option></option>
                      <option *ngFor="let dept of result" [value]="dept.emp_id">  {{ dept.emp_name }} </option>
                    
                    </select>
                  </div>
                  <div class="clr-col-3">
                    <label><strong>Employee Id:<sup style="color: red">*</sup>:</strong></label>
                    <input type="text" name="emp_id"  [(ngModel)]="emp_id" readonly>
                </div>
                <div class="clr-col-3">
                    <label><strong>Current Shift:<sup style="color: red">*</sup>:</strong></label>
                    <input type="text" name="current_shift"  [(ngModel)]="current_shift" readonly>
                </div>
                <div class="clr-col-3">
                    <label><strong>Change Shift:<sup style="color: red">*</sup>:</strong></label>
                    <select name="shift"  [(ngModel)]="shift" (change)="addShift($event.target.selectedIndex)"  required>
                    <option></option>
                    <option *ngFor="let shift of shifts; let i = index" > {{ shift.shift_name }}  ( {{ shift.start_time }} - {{ shift.end_time }} )</option>
                    </select>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>From Date:</label>
                    <input type="date" name="from_date" [(ngModel)]="from_date" [min]="max_date"  required />
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>To Date:</label>
                    <input type="date"  name="to_date" [(ngModel)]="to_date" [min]="from_date" required />
                </div>
               
                 
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                  <label>Reason For Request</label>
                    <textarea rows="3" name="Request_reason" ngModel required></textarea>
                </div>
            </div>
        </form>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-success" (click)="save(apprisal)">{{'common.save' | translate}}</button>

        <button class="btn btn-danger" routerLink="/hr/shift" >{{'common.close' | translate}}</button>
      </div>
    </div>
  </div>
