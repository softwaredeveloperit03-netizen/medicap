<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Shift Master</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/hr/shift" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
          </div>
        </div>
      </div>
    <div class="card-block">
        <div class="card-text">
            <form #f="ngForm">
                <table class="table"> 
                    <tr>
                        <th style="width: 40px;">Sr.</th>
                        <th style="text-align: left;">Shift Name</th>
                    </tr>
                    <tr *ngFor="let data of holidays; let i=index">
                        <td style="text-align: left;">{{ i+1 }}.</td>
                        <td style="text-align: left;">{{ data.shift_name }}</td>
                    </tr>
                    <tr *ngIf="result?.length == 0">
                        <td colspan="6">{{'common.noRecords' | translate}}</td>
                    </tr>
                    <tr *ngIf="holidays?.length == 0">
                        <td colspan="6">{{'common.noRecords' | translate}}</td>
                    </tr>
                </table>
                <br>
                <div class="clr-row">
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Shift Name:</label>
                        <input type="date" name="shift_name" [(ngModel)]="shift_name"  required>
                    </div>
                     
                </div>
            </form>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary"(click)="addHolidays(f)">{{'common.save' | translate}}</button>
    </div>
</div>
