
<div class="card">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Salary / Payroll</div>
      <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        <button class="btn btn-sm" routerLink="/hr" style="background-color: red;color: white;">{{'common.close' | translate}}</button>

      </div>
    </div>
  </div>
  <div class="card-block">
    <div class="card-text">
      <div class="clr-row">
       <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="isapprover=='Yes' ">
        <div class="card custom-card"  routerLink="approval" style="height: auto; border: none; border-radius: 7px; box-shadow: rgba(0, 0, 0, 0.07) 0px 1px 2px, rgba(0, 0, 0, 0.07) 0px 2px 4px, rgba(0, 0, 0, 0.07) 0px 4px 8px, rgba(0, 0, 0, 0.07) 0px 8px 16px, rgba(0, 0, 0, 0.07) 0px 16px 32px, rgba(0, 0, 0, 0.07) 0px 32px 64px">
          <div class="card-block" style="text-align: center; border-top: solid 3px rgb(160, 83, 68); border-radius: 7px;">
          <img width="75px" height="75px"  src="assets/recruitment.png">
          <p class="card-text" style="color: white;"><b>Payroll Approval</b></p>
        </div>
      </div>
      </div>
       <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
        <div class="card custom-card"  routerLink="statement" style="height: auto; border: none; border-radius: 7px; box-shadow: rgba(0, 0, 0, 0.07) 0px 1px 2px, rgba(0, 0, 0, 0.07) 0px 2px 4px, rgba(0, 0, 0, 0.07) 0px 4px 8px, rgba(0, 0, 0, 0.07) 0px 8px 16px, rgba(0, 0, 0, 0.07) 0px 16px 32px, rgba(0, 0, 0, 0.07) 0px 32px 64px">
          <div class="card-block" style="text-align: center; border-top: solid 3px rgb(160, 83, 68); border-radius: 7px;">
          <img width="75px" height="75px"  src="assets/recruitment.png">
          <p class="card-text" style="color: white;"><b>Payroll Statement</b></p>
        </div>
      </div>
      </div>

      
      </div>       
    </div>
  </div>
  </div>
