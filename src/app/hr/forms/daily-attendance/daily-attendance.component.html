<div class="container-fluid">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Attendance Report</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/attendance-dashboard" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <clr-datagrid>
          <clr-dg-column [clrDgField]="'emp_id'">Employee</clr-dg-column>
          <clr-dg-column [clrDgField]="'indate'">In Date</clr-dg-column>
          <clr-dg-column>In Time</clr-dg-column>
          <clr-dg-column [clrDgField]="'outdate'">Out Date</clr-dg-column>
          <clr-dg-column>Out Time</clr-dg-column>
      
          <clr-dg-row *clrDgItems="let user of employees">
              <clr-dg-cell>{{user.emp_id}}</clr-dg-cell>
              <clr-dg-cell>{{user.indate}}</clr-dg-cell>
              <clr-dg-cell>{{user.intime}}</clr-dg-cell>
              <clr-dg-cell>{{user.outdate}}</clr-dg-cell>
              <clr-dg-cell>{{user.outtime}}</clr-dg-cell>
          </clr-dg-row>

          <clr-dg-footer>
            <clr-dg-pagination #pagination [clrDgPageSize]="10">
                <clr-dg-page-size [clrPageSizeOptions]="[10,20,50,100]">Employees per page</clr-dg-page-size>
                {{pagination.firstItem + 1}} - {{pagination.lastItem + 1}}
                of {{pagination.totalItems}} Employees
            </clr-dg-pagination>
        </clr-dg-footer>

        </clr-datagrid>
      </div>
    </div>
  </div>
</div>

  <clr-modal [(clrModalOpen)]="isEdit">
      <h3 class="modal-title">Employee Id: {{ employee_id }}</h3>
      <div class="modal-body">
          <form #editForm="ngForm" class="clr-row">
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>In Time:</label>
              <input type="time" name="intime" ngModel="{{intime}}">
            </div>
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>Out Time:</label>
              <input type="time" name="outtime" ngModel="{{outtime}}">
            </div>
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>Reason:</label>
              <textarea rows="2" name="reason" ngModel required></textarea>
            </div>
          </form>
      </div>
      <div class="modal-footer">
          <button type="button" class="btn btn-outline" (click)="isEdit = false">{{'common.cancel' | translate}}</button>
          <button type="button" class="btn btn-primary" (click)="editForm.form.valid && updateAttendance(editForm)">{{'common.update' | translate}}</button>
      </div>
  </clr-modal>
