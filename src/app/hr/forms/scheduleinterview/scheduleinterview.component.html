<div class="container-fluid" *ngIf="isInit">
  <div class="clr-row">
      <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
        <div class="card">
          <div class="card-header" style="text-align: center">Schedule Interview</div>
          <div class="card-block">
            <div class="card-text">
              <form #scheduleform="ngForm">
                <div class="clr-row">
                  <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Candidate:</strong></label>
                    <select name="candidate_name" ngModel (change)="getCandidateInfo($event.target.selectedIndex)" required>
                      <option></option>
                      <option *ngFor="let candidate of candidates">{{ candidate.candidate_name }}</option>
                    </select>
                  </div>
                  <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Qualification:</strong></label>
                    <input type="text" name="qualification" [ngModel]="qualification" readonly required>
                  </div>
                  <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Place:</strong></label>
                    <input type="text" name="place" [ngModel]="place" readonly required>
                  </div>
                </div>
                <div class="clr-row">
                  <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Email Id:</strong></label>
                    <input type="email" name="email_id" [ngModel]="email_id" readonly required>
                  </div>
                  <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Mobile No:</strong></label>
                    <input type="text" name="mobile_no" [ngModel]="mobile_no" readonly required>
                  </div>
                  <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Contact Person:</strong></label>
                    <input type="text" name="contact_person" ngModel required>
                  </div>
                </div>
                <div class="clr-row">
                  <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Interview Date:</strong></label>
                    <input type="date" name="interview_date" [min]="today" ngModel required>
                  </div>
                  <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Interview Time:</strong></label>
                    <input type="text" name="interview_time" placeholder="10:00 AM onwords" ngModel required>
                  </div>
                  <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Place / Venue:</strong></label>
                    <select name="venue" ngModel="Factory">
                      <option>Factory</option>
                      <option>Corporate</option>
                      <option>Other</option>
                    </select>
                  </div>
                </div>
                <div class="clr-row">
                  <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Requirement Department:</strong></label>
                    <select name="department" ngModel required>
                      <option></option>
                      <option *ngFor="let dept of departments">{{ dept.department_name }}</option>
                    </select>
                  </div>
                  <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Designation:</strong></label>
                    <select name="designation" ngModel required>
                      <option></option>
                      <option *ngFor="let designation of reqdesignation">{{ designation.designation }}</option>
                    </select>
                  </div>
                </div>
              </form>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn btn-primary" (click)="scheduleform.form.valid && saveForm(scheduleform)">submit & send to Department Head</button>
          </div>
        </div>
      </div>
    </div>
</div>

<div class="clr-row" *ngIf="isFirst">
  <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
    <div class="card">
      <div class="card-header">Assign Interviewers</div>
      <div class="card-block">
        <form #interviewers="ngForm">
          <div class="clr-row">
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>Department:</label>
              <select name="department" #dept="ngModel" ngModel (change)="getDesignation()" required>
                <option></option>
                <option *ngFor="let dept of departments">{{ dept.department_name }}</option>
              </select>
            </div>
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>Designation:</label>
              <select name="designation" ngModel (change)="getEmployees(dept.value, $event.target.value)" required>
                <option></option>
                <option *ngFor="let designation of designations">{{ designation.designation }}</option>
              </select>
            </div>
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>Employee:</label>
              <select name="employee" ngModel required>
                <option></option>
                <option *ngFor="let employee of employees" [value]="employee.emp_id">{{ employee.emp_name }} ( {{employee.emp_id}} )</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="interviewers.form.valid && addInterviewer(interviewers)">{{'common.add' | translate}}</button>
      </div>
    </div>
  </div>
  <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
    <div class="card">
      <div class="card-header">Selected Interviewers</div>
      <div class="card-block">
        <div class="card-text">
          <clr-datagrid>
              <clr-dg-column>{{'common.department' | translate}}</clr-dg-column>
              <clr-dg-column>{{'common.designation' | translate}}</clr-dg-column>
              <clr-dg-column>Employee</clr-dg-column>

              <clr-dg-row *ngFor="let user of interviewer">
                  <clr-dg-cell>{{user.department}}</clr-dg-cell>
                  <clr-dg-cell>{{user.designation}}</clr-dg-cell>
                  <clr-dg-cell>{{user.employee}}</clr-dg-cell>
              </clr-dg-row>
            </clr-datagrid>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="submitInterviewers()">{{'common.submit' | translate}}</button>
      </div>
    </div>
  </div>
</div>
