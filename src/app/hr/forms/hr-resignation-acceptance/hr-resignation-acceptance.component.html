<div class="container-fluid" *ngIf="!isSelectedResignation">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Resignation Acceptance</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/resignation-dashboard" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <clr-datagrid>
            <clr-dg-column>Emp ID</clr-dg-column>
            <clr-dg-column>{{'common.name' | translate}}</clr-dg-column>
            <clr-dg-column>Subject</clr-dg-column>
            <clr-dg-column>Request Date</clr-dg-column>
            <clr-dg-column>view</clr-dg-column>
        
            <clr-dg-row *ngFor="let user of resignations; let i = index">
                <clr-dg-cell>{{user.emp_id}}</clr-dg-cell>
                <clr-dg-cell>{{user.emp_name}}</clr-dg-cell>
                <clr-dg-cell>{{user.subject}}</clr-dg-cell>
                <clr-dg-cell>{{user.entry_date}}</clr-dg-cell>
                <clr-dg-cell>
                  <button class="btn btn-sm" (click)="showDetails(i)">{{'common.view' | translate}}</button>
                </clr-dg-cell>
            </clr-dg-row>
        </clr-datagrid>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid" *ngIf="isSelectedResignation">
    <div class="card">  <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Resignation Acceptance</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/resignation-dashboard" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
      <div class="card-block">
        <div class="card-text">
          <form class="clr-row" #reportForm="ngForm">
            <input type="hidden" name="resignation_id" ngModel="{{ selectedResignation['id'] }}" required>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Employee Id:</label>
              <input type="text" name="emp_id" ngModel="{{ selectedResignation['emp_id'] }}" readonly>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Employee Name:</label>
              <input type="text" name="emp_name" ngModel="{{ selectedResignation['emp_name'] }}" readonly>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Department:</label>
              <input type="text" name="department" ngModel="{{ selectedResignation['department'] }}" readonly>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Designation:</label>
              <input type="text" name="designation" ngModel="{{ selectedResignation['designation'] }}" readonly>
            </div>
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>Subject:</label>
              <input type="text" name="subject" ngModel="{{ selectedResignation['subject'] }}" readonly>
            </div>
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
              <label>Expected Notice Period:</label>
              <input type="text" name="expected_notice" ngModel="{{ selectedResignation['expected_notice'] }}" readonly>
            </div>
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
              <label>Expected Releaving Date:</label>
              <input type="text" name="expected_releaving" ngModel="{{ selectedResignation['expected_releaving'] }}" readonly>
            </div>
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>Reason for Resignation:</label>
              <textarea rows="5" name="reason" ngModel="{{ selectedResignation['reason'] }}" readonly></textarea>
            </div>
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
              <label>Department Status:</label>
              <input type="text" name="dept_status" ngModel="{{ selectedResignation['dept_status'] }}" readonly>
            </div>
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
              <label>Releaving On Date:</label>
              <input type="date" name="releaving_date" ngModel="{{ selectedResignation['releaving_date'] }}" readonly required>
            </div>
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>Department Head Remark:</label>
              <textarea rows="2" name="dept_remark" ngModel="{{ selectedResignation['dept_remark'] }}" readonly required></textarea>
            </div>
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>Status:</label>
              <select name="hr_status" ngModel required>
                <option>Accepted</option>
                <option>{{'common.rejected' | translate}}</option>
              </select>
            </div>
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>Remark:</label>
              <textarea rows="2" name="hr_remark" ngModel required></textarea>
            </div>
          </form>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="submitResignation(reportForm)">{{'common.submit' | translate}}</button>
        <button class="btn btn-danger" (click)="isSelectedResignation = false">{{'common.close' | translate}}</button>
      </div>
    </div>
  </div>
