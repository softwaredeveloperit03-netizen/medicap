<div class="container-fluid">
  <div class="card">
    <div class="card-header">Offer Acceptance</div>
    <div class="card-block">
      <div class="card-text">
        <form class="clr-row" #offerform="ngForm">
          <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
            <label>Candidate Name:</label>
            <select name="candidate" ngModel required>
              <option></option>
              <option *ngFor="let candidate of candidates" [value]="candidate.id">{{ candidate.candidate_name }}</option>
            </select>
          </div>
          <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>Offer Accepted by Candidate?</label>
              <select name="offeracceptance" ngModel (change)="checkoffer($event.target.value)" required>
                <option>yes</option>
                <option>no</option>
              </select>
          </div>
          <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12" *ngIf="isAccepted">
              <clr-radio-container>
                <label>Medical Checkup Required</label>
                <clr-radio-wrapper>
                  <input type="radio" clrRadio name="medicalcheckup" required value="yes" ngModel />
                  <label>Yes</label>
                </clr-radio-wrapper>
                <clr-radio-wrapper>
                  <input type="radio" clrRadio name="medicalcheckup" required value="no" ngModel />
                  <label>No</label>
                </clr-radio-wrapper>
                <clr-control-error>This field is required!</clr-control-error>
              </clr-radio-container>
          </div>
          <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>Tentative Date of Joining</label>
              <input type="date" name="tentative_joining_date" ngModel required>
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="offerAcceptance(offerform)">{{'common.submit' | translate}}</button>
    </div>
  </div>
</div>
