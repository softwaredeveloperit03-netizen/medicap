<div class="container" *ngIf="isNewForm">
  <div class="card">
    <div class="card-header" style="text-align: center">NOTICE</div>
    <div class="card-block">
      <div class="card-text">
        <form #noticeForm="ngForm">
          <div class="row">
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>Employee Id</label>
              <input type="text" name="employee" ngModel required>
            </div>
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>Subject</label>
              <input type="text" name="subject" ngModel required>
            </div>
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>Body</label>
              <textarea rows="5" name="description" ngModel required></textarea>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="sendNotice(noticeForm)">SEND</button>
      <button class="btn btn-danger" (click)="isNewForm = false">{{'common.close' | translate}}</button>
    </div>
  </div>
</div>

<div class="container" *ngIf="!isNewForm">
  <div class="card">
    <div class="card-header" style="text-align: center">NOTICE LOG</div>
    <div class="card-block">
      <div class="card-text">
        <button class="btn btn-sm btn-info" (click)="isNewForm = true">New Notice</button>
        <clr-datagrid>
            <clr-dg-column>Sr.</clr-dg-column>
            <clr-dg-column>Notice TO</clr-dg-column>
            <clr-dg-column>Subject</clr-dg-column>
            <clr-dg-column>{{'common.status' | translate}}</clr-dg-column>
            <clr-dg-column>{{'common.table.remark' | translate}}</clr-dg-column>

            <clr-dg-row *ngFor="let notice of notices; let i = index">
                <clr-dg-cell>{{i+1}}</clr-dg-cell>
                <clr-dg-cell>{{notice.emp_id}}</clr-dg-cell>
                <clr-dg-cell>{{notice.subject}}</clr-dg-cell>
                <clr-dg-cell>{{notice.status}}</clr-dg-cell>
                <clr-dg-cell>{{notice.remark}}</clr-dg-cell>
            </clr-dg-row>
        </clr-datagrid>
      </div>
    </div>
  </div>
</div>
