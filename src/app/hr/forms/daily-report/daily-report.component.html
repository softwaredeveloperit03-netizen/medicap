<div class="container-fluid" *ngIf="!isShow">
  <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Daily Task </div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/user-dashboard" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div> 
      <div class="card-block">
        <div class="card-text">
          <clr-datagrid>
              <clr-dg-column>Sr.</clr-dg-column>
              <clr-dg-column>Assign Date</clr-dg-column>
              <clr-dg-column>{{'common.status' | translate}}</clr-dg-column>
              <clr-dg-column>view</clr-dg-column>

              <clr-dg-row *ngFor="let user of tasks; let i = index">
                  <clr-dg-cell>{{i+1}}</clr-dg-cell>
                  <clr-dg-cell>{{user.assign_date}}</clr-dg-cell>
                  <clr-dg-cell>{{user.status}}</clr-dg-cell>
                  <clr-dg-cell>
                    <button class="btn btn-sm btn-icon" (click)="getTask(i)">{{'common.view' | translate}}</button>
                  </clr-dg-cell>
              </clr-dg-row>
          </clr-datagrid>
        </div>
      </div>
  </div>
</div>

<div class="container-fluid" *ngIf="isShow">
  <div class="clr-row">
    <div class="clr-col-lg-6 clr-col-md-6" *ngFor="let task1 of selectedTask" id="task-{{task1.id}}">
      <div class="card">
        <div class="card-header">Task</div>
        <div class="card-block">
          <div class="card-text">
            <form class="clr-row">
              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                {{ task1.task }}
              </div>
              <input type="hidden" name="id" #id="ngModel" ngModel="{{ task1.id }}" required>
              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label>{{'common.table.remark' | translate}}</label>
                <textarea rows="2" name="task" #task="ngModel" ngModel required></textarea>
              </div>
              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label>{{'common.status' | translate}}</label>
                <select name="status" ngModel #status="ngModel" required>
                  <option>{{'common.completed' | translate}}</option>
                  <option>Partially Completed</option>
                  <option>Not Completed</option>
                </select>
              </div>
            </form>
          </div>
        </div>
        <div class="card-footer">
          <button class="btn btn-primary" (click)="sendTaskReport(id.value, task.value, status.value)">{{'common.submit' | translate}}</button>
        </div>
      </div>
    </div>
  </div>
  <form class="clr-row">
    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
      <label>{{'common.table.remark' | translate}}</label>
      <input type="text" name="remark" ngModel #remark="ngModel">
    </div>
    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
      <label>Instruction for Next Shift</label>
      <input type="text" name="instruction" ngModel #instruction="ngModel">
    </div>
  </form>
  <button class="btn btn-primary" (click)="submitFinalTaskReport(remark.value, instruction.value)">{{'common.submit' | translate}}</button>
  <button class="btn btn-danger" (click)="isShow = false">{{'common.close' | translate}}</button>
</div>
