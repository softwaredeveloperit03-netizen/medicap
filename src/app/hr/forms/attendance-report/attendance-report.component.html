<div class="container-fluid">
  <div class="card">
      <div class="card-header">Employee Entry / Exit Log</div>
      <div class="card-block">
        <div class="card-text">
          <form #employeeForm="ngForm">
            <div class="clr-row">
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Employee:</label>
                <select name="emp_id" ngModel>
                  <option></option>
                  <option *ngFor="let employee of candidates" [value]="employee.emp_id">{{ employee.emp_name }}</option>
                </select>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>From Date:</label>
                <input type="date" name="fromdate" ngModel>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>To Date:</label>
                <input type="date" name="todate" ngModel>
              </div>
              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 cl-col-xs-12">
                <button class="btn btn-primary-outline btn-sm" (click)="getEmployeeDetails(employeeForm)">procced</button>
              </div>
            </div>
          </form>
          <clr-datagrid>
              <clr-dg-column>Employee</clr-dg-column>
              <clr-dg-column>In Time</clr-dg-column>
              <clr-dg-column>Out Time</clr-dg-column>

              <clr-dg-row *ngFor="let user of employees">
                  <clr-dg-cell>{{user.emp_id}}</clr-dg-cell>
                  <clr-dg-cell>{{user.intime}}</clr-dg-cell>
                  <clr-dg-cell>{{user.outtime}}</clr-dg-cell>
              </clr-dg-row>
          </clr-datagrid>
        </div>
      </div>
      <!-- <div class="card-footer">
        <button class="btn btn-success" (click)="reportemployee(employeeForm)"><clr-icon shape="download"></clr-icon> Download Excel Report</button>
      </div> -->
  </div>
</div>
