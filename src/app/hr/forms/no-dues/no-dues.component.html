<div class="container-fluid">
  <div class="card">
    <div class="card-header">No Dues</div>
    <div class="card-block">
      <div class="card-text">
        <clr-datagrid>
            <clr-dg-column>Employee ID</clr-dg-column>
            <clr-dg-column>Subject</clr-dg-column>
            <clr-dg-column>Resignation Date</clr-dg-column>
            <clr-dg-column>{{'common.department' | translate}}</clr-dg-column>
            <clr-dg-column>view</clr-dg-column>
        
            <clr-dg-row *ngFor="let user of resignations">
                <clr-dg-cell>{{user.emp_id}}</clr-dg-cell>
                <clr-dg-cell>{{user.subject}}</clr-dg-cell>
                <clr-dg-cell>{{user.releaving_date}}</clr-dg-cell>
                <clr-dg-cell>{{user.department}}</clr-dg-cell>
                <clr-dg-cell>
                  <button class="btn btn-sm" (click)="showRemark(user.id)">{{'common.view' | translate}}</button>
                </clr-dg-cell>
            </clr-dg-row>
        </clr-datagrid>
      </div>
    </div>
  </div>
</div>

<clr-modal [(clrModalOpen)]="isRemark">
    <h3 class="modal-title">{{'common.table.remark' | translate}}</h3>
    <div class="modal-body">
        <form class="clr-row">
          <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
            <label>Due Status</label>
            <select name="due_status" [(ngModel)]="status" required>
              <option>{{'common.pending' | translate}}</option>
              <option>No Dues</option>
            </select>
          </div>
          <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
            <label>{{'common.table.remark' | translate}}</label>
            <textarea rows="2" name="remark" [(ngModel)]="remark" required></textarea>
          </div>
        </form>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-outline" (click)="isRemark = false">{{'common.cancel' | translate}}</button>
        <button type="button" class="btn btn-primary" (click)="sendResignationStatus()">{{'common.submit' | translate}}</button>
    </div>
</clr-modal>
