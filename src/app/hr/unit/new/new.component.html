<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Add New Unit</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-danger" routerLink="/hr/unit">{{'common.close' | translate}}</button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #unit="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-6 clr-col-md-6">
                        <label>Unit Description:</label>
                         <input type="text" name="unit" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6">
                        <label>Type:</label>
                        <select name="type" ngModel required>
                            <option>EOU</option>
                            <option>Ordinary</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="card-footer">
      <button type="button" class="btn btn-primary" (click)="save(unit)">{{'common.submit' | translate}}</button>
    </div>
</div>
