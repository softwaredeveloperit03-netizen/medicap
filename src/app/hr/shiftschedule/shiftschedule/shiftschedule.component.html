<div class="container">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Shift Shedule</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/attendance-dashboard" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text datagrid-wrapper">
        <clr-datagrid >
            <clr-dg-column [clrDgField]="'emp_id'">Employee</clr-dg-column>
            <clr-dg-column [clrDgField]="'department'">{{'common.department' | translate}}</clr-dg-column>
            <clr-dg-column [clrDgField]="'fromdate'">From Date</clr-dg-column>
            <clr-dg-column [clrDgField]="'todate'">To Date</clr-dg-column>
            <clr-dg-column [clrDgField]="'shift'">Shift</clr-dg-column>
            <clr-dg-column [clrDgField]="'entry_by'">Entry By</clr-dg-column>
            <clr-dg-column>Entry Date</clr-dg-column>

            <clr-dg-row *clrDgItems="let shift of shifts">
                <clr-dg-cell>{{shift.emp_id}}</clr-dg-cell>
                <clr-dg-cell>{{shift.department}}</clr-dg-cell>
                <clr-dg-cell *ngIf="shift['isshift']=='yes'">{{shift.fromdate}}</clr-dg-cell>
                <clr-dg-cell *ngIf="shift['isshift']=='yes'">{{shift.todate}}</clr-dg-cell>
                <clr-dg-cell *ngIf="shift['isshift']=='yes'">{{shift.shift}}</clr-dg-cell>
                <clr-dg-cell *ngIf="shift['isshift']=='yes'">{{shift.entry_by}}</clr-dg-cell>
                <clr-dg-cell *ngIf="shift['isshift']=='yes'">{{shift.entry_date}}</clr-dg-cell>
                <clr-dg-cell *ngIf="shift['isshift']=='no'">No Shift</clr-dg-cell>
                <clr-dg-cell *ngIf="shift['isshift']=='no'"></clr-dg-cell>
                <clr-dg-cell *ngIf="shift['isshift']=='no'"></clr-dg-cell>
                <clr-dg-cell *ngIf="shift['isshift']=='no'"></clr-dg-cell>
                <clr-dg-cell *ngIf="shift['isshift']=='no'"></clr-dg-cell>
            </clr-dg-row>
            <!-- <clr-dg-footer class="clarity-footer">
              <clr-dg-pagination #pagination [clrDgPageSize]="10">
                <clr-dg-page-size [clrPageSizeOptions]="[10,20,50,100]">Users per page</clr-dg-page-size>
                {{pagination.firstItem + 1}} - {{pagination.lastItem + 1}}
                of {{pagination.totalItems}} users
              </clr-dg-pagination>
            </clr-dg-footer> -->
        </clr-datagrid>
      </div>
    </div>
  </div>
</div>
