<clr-tabs>
  <clr-tab>
    <button clrTabLink id="link1">Prior Approval</button>
    <clr-tab-content id="content1" *clrIfActive="true">
        <div class="card">
          <div class="card-header">Prior Shift Change Request</div>
          <div class="card-block">
            <div class="card-text">
              <form class="clr-row" #changeForm="ngForm">
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <label>Current Shift:</label>
                  <input type="text" name="current_shift" readonly [ngModel]="current_shift" required>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <label>From Date:</label>
                  <input type="date" name="from_date" ngModel required>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <label>To Date:</label>
                  <input type="date" name="to_date" ngModel required>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <label>Required Shift:</label>
                  <select name="required_shift" ngModel required>
                    <option>General</option>
                    <option>First</option>
                    <option>Second</option>
                    <option>Third</option>
                  </select>
                </div>
              </form>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn btn-primary" (click)="changeForm.form.valid && sendChangeRequest(changeForm)">{{'common.submit' | translate}}</button>
          </div>
        </div>
    </clr-tab-content>
  </clr-tab>
  <clr-tab>
    <button clrTabLink>Todays Shift Change Request</button>
    <clr-tab-content *clrIfActive>
      <div class="card" *ngIf="isShow">
        <div class="card-header">Todays Shift Change Request</div>
        <div class="card-block">
          <div class="card-text">
            <form class="clr-row" #todayForm="ngForm">
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>In Date:</label>
                <input type="text" name="in_date" ngModel="{{ last_attendance.indate }}" readonly>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Shift:</label>
                <input type="text" name="shift" ngModel="{{ last_attendance.shift }}" readonly>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>In Entry By:</label>
                <input type="text" name="in_entry_by" ngModel="{{ last_attendance.inentry_by }}" readonly>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Required Shift:</label>
                <select name="required_shift" ngModel required>
                  <option>General</option>
                  <option>First</option>
                  <option>Second</option>
                  <option>Third</option>
                </select>
              </div>
            </form>
          </div>
        </div>
        <div class="card-footer">
          <button class="btn btn-primary" (click)="todayForm.form.valid && updateTodaysAttendance(todayForm)">{{'common.submit' | translate}}</button>
        </div>
      </div>
    </clr-tab-content>
  </clr-tab>
</clr-tabs>
