<div class="container">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Shift Allocation</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/attendance-dashboard" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #shiftForm="ngForm">
          <div class="clr-row">
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
              <label><strong>From Date:</strong></label>
              <input type="date" name="fromdate" [ngModel]="fromdate" required>
            </div>
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
              <label><strong>To Date:</strong></label>
              <input type="date" name="todate" [ngModel]="todate" required>
            </div>
          </div>
          <table class="table" ngModelGroup="employeeshift">
              <thead>
                  <tr>
                      <th>Employee</th>
                      <th>{{'common.designation' | translate}}</th>
                      <th>G</th>
                      <th>I</th>
                      <th>II</th>
                      <th>III</th>
                  </tr>
              </thead>
              <tbody>
                  <tr *ngFor="let employee of employees">
                      <td>{{ employee.emp_name }}</td>
                      <td>{{ employee.designation }}</td>
                      <td><input type="checkbox" ClrCheckbox name="{{employee.emp_id}}@General" ngModel></td>
                      <td><input type="checkbox" ClrCheckbox name="{{employee.emp_id}}@First" ngModel></td>
                      <td><input type="checkbox" ClrCheckbox name="{{employee.emp_id}}@Second" ngModel></td>
                      <td><input type="checkbox" ClrCheckbox name="{{employee.emp_id}}@Third" ngModel></td>
                  </tr>
                  <tr *ngIf="employees.length == 0">
                    <td colspan="6">{{'common.noRecords' | translate}}</td>
                  </tr>
              </tbody>
          </table>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="shiftForm.form.valid && allocateShift(shiftForm)">proceed</button>
    </div>
  </div>
</div>
