<div class="container-fluid">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Shift Change Request</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/attendance-dashboard" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text datagrid-wrapper">
        <clr-datagrid >
          <clr-dg-column>Employee</clr-dg-column>
          <clr-dg-column>Current Shift</clr-dg-column>
          <clr-dg-column>Required Shift</clr-dg-column>
          <clr-dg-column>From Date</clr-dg-column>
          <clr-dg-column>To Date</clr-dg-column>
          <clr-dg-column>{{'common.table.action' | translate}}</clr-dg-column>
      
          <clr-dg-row *ngFor="let user of shifts">
              <clr-dg-cell>{{user.emp_id}}</clr-dg-cell>
              <clr-dg-cell>{{user.current_shift}}</clr-dg-cell>
              <clr-dg-cell>{{user.required_shift}}</clr-dg-cell>
              <clr-dg-cell>{{user.from_date}}</clr-dg-cell>
              <clr-dg-cell>{{user.to_date}}</clr-dg-cell>
              <clr-dg-cell>
                <button class="btn btn-sm btn-icon"><clr-icon class="is-highlight" shape="check" (click)="shiftchangeAction('approve')"></clr-icon></button>
                <button class="btn btn-sm btn-icon"><clr-icon class="is-warning" shape="times" (click)="shiftchangeAction('approve')"></clr-icon></button>
              </clr-dg-cell>
          </clr-dg-row>
          <!-- <clr-dg-footer class="clarity-footer">
            <clr-dg-pagination #pagination [clrDgPageSize]="10">
              <clr-dg-page-size [clrPageSizeOptions]="[10,20,50,100]">Users per page</clr-dg-page-size>
              {{pagination.firstItem + 1}} - {{pagination.lastItem + 1}}
              of {{pagination.totalItems}} users
            </clr-dg-pagination>
          </clr-dg-footer> -->
      </clr-datagrid>
      </div>
    </div>
  </div>
</div>
