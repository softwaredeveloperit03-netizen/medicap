<div class="card">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Prepared New Letter
      </div>
      <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        <button class="btn btn-sm" routerLink="/hr" style="background-color: red;color: white;">
          <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
        </button>
      </div>
    </div>
  </div>



  <div class="card-block">
    <div class="card-text">
      <div class="clr-row">
        <div class="clr-col-lg-3">
          <label>letter Type:</label>
          <select name="letter_type" [(ngModel)]="letter_type">
            <option></option>
            <option>Employee</option>
            <option>Other</option>
          </select>
        </div>

      </div>
      <div class="clr-row">
        <div class="clr-col-lg-6">
          <label>Contact No:</label>
          <input type="text" name="contact" ngModel required>
        </div>
        <div class="clr-col-lg-6">
          <label>letter date :</label>
          <input type="date" name="letter_date" ngModel required>
        </div>

        <div class="clr-col-lg-6">
          <label>Subject:</label>
          <input type="text" name="subject" ngModel required>
        </div>

        <div class="clr-col-lg-6">
          <label>Letter Body:</label>
          <input type="text" name="letter" ngModel required>
        </div>
      </div>
      <div class="card-footer">
        <button type="button" class="btn btn-primary" (click)="save()">{{'common.save' | translate}}</button>
      </div>

    </div>



    {{letter_type}}
    <div class="card-block">
      <div *ngIf="letter_type=='Employee'">
        <div class="clr_row">
          <div class="clr-col-lg-3">
            <label>Department:</label>
            <input type="text" name="department" ngModel required>
          </div>
          <div class="clr-col-lg-6">
            <label>letter date :</label>
            <input type="date" name="letter_date" ngModel required>
          </div>

          <div class="clr-col-lg-3">
            <label>Employee Name:</label>
            <input type="text" name="emp_name" ngModel required>
          </div>

          <div class="clr-col-lg-3">
            <label>ID:</label>
            <input type="text" name="id" ngModel required>
          </div>

          <div class="clr-col-lg-3">
            <label>Joining Date:</label>
            <input type="date" name="join_date" readonly ngModel required>
          </div>

          <div class="clr-col-lg-3">
            <label>Appointment Date:</label>
            <input type="date" name="Appointment_date" readonly ngModel required>
          </div>


          <div class="clr-col-lg-3">
            <label>Effective Date:</label>
            <input type="date" name="Effective_date" readonly ngModel required>
          </div>

          <div class="clr-col-lg-3">
            <label>Valid Team:</label>
            <input type="text" name="valid_team" ngModel required>
          </div>

          <div class="clr-col-lg-3">
            <label>Current Designation:</label>
            <input type="text" name="Current_desig" ngModel required>
          </div>

          <div class="clr-col-lg-3">
            <label>Proposed Designation:</label>
            <input type="text" name="Proposed_desig" ngModel required>
          </div>
        </div>




        <div *ngIf="letter_type=='Other'">
          <div class="clr-row">
            <div class="clr-col-lg-3">
              <label>Name of Person:</label>
              <input type="text" name="name" ngModel required>
            </div>
            <div class="clr-col-lg-6">
              <label>letter date :</label>
              <input type="date" name="letter_date" ngModel required>
            </div>

            <div class="clr-col-lg-3">
              <label>Institute Name:</label>
              <input type="text" name="institute_name" ngModel required>
            </div>

            <div class="clr-col-lg-3">
              <label>Authority:</label>
              <input type="text" name="authority" ngModel required>
            </div>

            <div class="clr-col-lg-3">
              <label>Address:</label>
              <input type="text" name="address" readonly ngModel required>
            </div>


          </div>
        </div>
      </div>
    </div>
    <!-- <div class="card-footer">
        <button type="button" class="btn btn-primary" (click)="save()">{{'common.save' | translate}}</button>
    </div> -->
  </div>
</div>
