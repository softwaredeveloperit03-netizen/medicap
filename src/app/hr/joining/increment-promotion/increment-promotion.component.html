<div class="container-fluid" *ngIf="isNew">
    <div class="card">
        <div class="card-header">INCREMENT / PROMOTION LETTER</div>
        <div class="card-block">
            <div class="card-text">
                <form #LetterForm="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Employee:</label>
                            <select name="emp" ngModel required (change)="selectedemployee($event.target.selectedIndex)">
                                <option *ngFor="let list of employeelist; let i = index" [value]="i">{{ list.emp_name }}</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-4">
                            <label>Designation:</label>
                            <input type="text" name="current_designation" ngModel="{{current_designation}}" readonly>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-4">
                            <label>Current Gross Salary:</label>
                            <input type="number" name="current_gross" ngModel="{{current_gross}}" readonly>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-4">
                            <label>Letter Type</label>
                            <select name="letter_type" [(ngModel)]="letter_type" required >
                                <option value="Increment Letter">Increment Letter</option>
                                <option value="Promotion Letter">Promotion Letter</option>
                                <option value="Increment And Promotion Letter">Increment & Promotion Letter</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-4">
                            <label>Effective From</label>
                            <input type="month" name="effective"  ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-4" *ngIf="letter_type != 'Increment Letter'">
                            <label>Promoted Designation:</label>
                            <select name="updated_designation" ngModel required>
                                <option *ngFor="let list of designationlist">{{list.designation}}</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-4" *ngIf="letter_type != 'Promotion Letter'">
                            <label>Updates Gross Salary:</label>
                            <input type="number" name="updated_gross" ngModel>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="card-footer" *ngIf="!submiting">
            <button class="btn btn-primary" (click)="generate(LetterForm)">{{'common.save' | translate}}</button>
            <button class="btn btn-danger" (click)="closeform(LetterForm)">{{'common.close' | translate}}</button>
        </div>
        <div class="card-footer" *ngIf="submiting">
            <button class="btn btn-primary">Submiting Please Wait ....</button>
        </div>
    </div>
</div>
  
<div class="container-fluid" *ngIf="!isNew">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Increment /Promotion Letter</div>
              <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/" style="background-color: red;color: white;">
                  <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
              </div>
            </div>
          </div>
        <div class="card-block">
            <div class="card-text">
                <button class="btn btn-sm btn-info" (click)="isNew = true">GENERATE NEW LETTER</button>
                <clr-datagrid>
                    <clr-dg-column>Employee Id</clr-dg-column>
                    <clr-dg-column>Employee Name</clr-dg-column>
                    <clr-dg-column>Letter</clr-dg-column>
                    <clr-dg-column>Effective Date</clr-dg-column>
                    <clr-dg-column>Current Designation</clr-dg-column>
                    <clr-dg-column>Current Salary</clr-dg-column>
                    <clr-dg-column>Actions</clr-dg-column>
                    <clr-dg-row *ngFor="let user of generatedletter">
                        <clr-dg-cell>{{user.emp_id}}</clr-dg-cell>
                        <clr-dg-cell>{{user.emp_name}}</clr-dg-cell>
                        <clr-dg-cell>{{user.letter_type}}</clr-dg-cell>
                        <clr-dg-cell>{{user.effective}}</clr-dg-cell>
                        <clr-dg-cell>{{user.designation}}</clr-dg-cell>
                        <clr-dg-cell>{{user.salary}}</clr-dg-cell>
                        <clr-dg-cell>
                        <button class="btn btn-sm btn-info btn-icon" (click)="downloadPdf(user.emp_id)"><clr-icon shape="download"></clr-icon></button>
                        <button class="btn btn-sm btn-info btn-icon" (click)="emailOffer(user.emp_id)"><clr-icon shape="envelope"></clr-icon></button>
                        </clr-dg-cell>
                    </clr-dg-row>
                </clr-datagrid>
            </div>
        </div>
    </div>
  </div>
