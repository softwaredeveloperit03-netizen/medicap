<div class="card">
    <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> User Rights</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/responsibility" style="background-color: red;color: white;">
                <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
            </div>
    </div>  
  <div class="card-block" *ngFor="let user of designations; let i = index">
    <div class="card-title">{{user.designation}}</div>
    <div class="card-text">
        <table class="table">
            <tr>
                <th style="width: 50px;">Sr.</th>
                <th>Responsibilities</th>
            </tr>
            <tr *ngFor="let result of user['responsibilities']; let j = index">
                <td>{{ j + 1 }}.</td>
                <td style="text-align: left;">{{ result.responsibility }}</td>
            </tr>
            <tr *ngIf="user['responsibilities']?.length == 0">
                <td colspan="2">{{'common.noRecords' | translate}}</td>
            </tr>
        </table>
    </div>
  </div>
</div>
