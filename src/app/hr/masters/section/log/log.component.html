<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Sections List</div>
        <div class="clr-col-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/section" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
  <div class="card-block">
    <div class="card-text">
      <div class="clr-row">
        <div class="clr-col-lg-5 clr-col-md-5 clr-col-sm-5 clr-col-xs-12">
          <label>Department:</label>
          <select name="department" [(ngModel)]="department" required>
            <option></option>
            <option *ngFor="let department1 of results1">{{ department1.department_name }}</option>
          </select>
        </div>
        <div class="clr-col-lg-5 clr-col-md-5 clr-col-sm-5 clr-col-xs-12">
          <label>Status:</label>
          <select name="status" [(ngModel)]="status" required>
            <option></option>
            <option>Active</option>
            <option>{{'common.pending' | translate}}</option>
          </select>
        </div>
        <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-2 clr-col-xs-12">
          <button class="btn btn-danger"(click)=" getSections()" style="margin-top:30px;">{{'common.search' | translate}}</button>
        </div>
      </div>
        <table class="table">
            <tr>
                <th style="text-align: left;">Sr.</th>
                <th style="text-align: left;">{{'common.department' | translate}}</th>
                <th style="text-align: left;">Room Name</th>
                <th style="text-align: left;">Room Number</th>
                <th style="text-align: left;">Building No</th>
                <th style="text-align: left;">Room No</th>
                <th style="text-align: left;">{{'common.status' | translate}}</th>
            </tr>

            <tr *ngFor="let user of results; let i = index">
                <td style="text-align: left;">{{ i + 1 }}.</td>
                <td style="text-align: left;">{{user.department}}</td>
                <td style="text-align: left;">{{user.section_name}}</td>
                <td style="text-align: left;">{{user.section_code}}</td>
                <td style="text-align: left;">{{user.building_no}}</td>
                <td style="text-align: left;">{{user.room_no}}</td>
                <td style="text-align: left;">{{user.status | titlecase}}</td>
            </tr>
        </table>
    </div>
  </div>
</div>
