<div class="container-fluid" *ngIf="!isNewAgency">
    <div class="card">
      <div class="card-header">Employment Agency Master</div>
      <div class="card-block">
        <div class="card-text datagrid-wrapper">
          <button class="btn btn-sm btn-outline" (click)="isNewAgency = true;">Add New</button>
          <clr-datagrid >
            <clr-dg-column>Agency Name</clr-dg-column>
            <clr-dg-column>{{'common.address' | translate}}</clr-dg-column>
            <clr-dg-column>Contact No</clr-dg-column>
            <clr-dg-column>Email Id</clr-dg-column>
            <clr-dg-column>Contact Person</clr-dg-column>
            <clr-dg-column>{{'common.status' | translate}}</clr-dg-column>

            <clr-dg-row *clrDgItems="let agency of agencies">
                <clr-dg-cell>{{agency.agency_name}}</clr-dg-cell>
                <clr-dg-cell>{{agency.address}}</clr-dg-cell>
                <clr-dg-cell>{{(agency.contact_no | canadianPhone)}}</clr-dg-cell>
                <clr-dg-cell>{{agency.email}}</clr-dg-cell>
                <clr-dg-cell>{{agency.contact_person}}</clr-dg-cell>
                <clr-dg-cell>{{agency.status}}</clr-dg-cell>
            </clr-dg-row>

            <!-- <clr-dg-footer class="clarity-footer">
              <clr-dg-pagination #pagination [clrDgPageSize]="10">
                  {{pagination.firstItem + 1}} - {{pagination.lastItem + 1}}
                  of {{pagination.totalItems}} Agencies
              </clr-dg-pagination>
            </clr-dg-footer> -->
          </clr-datagrid>
        </div>
      </div>
    </div>
</div>

<div class="container-fluid" *ngIf="isNewAgency">
  <div class="card">
    <div class="card-header">Employent Agency</div>
    <div class="card-block">
      <div class="card-text">
        <form #agencyForm="ngForm">
          <div class="clr-row">
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label>Agency Name:</label>
                <input type="text" name="agency_name" ngModel required>
            </div>
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
              <label>Contact No:</label>
              <input type="text" name="contact_no" ngModel required>
            </div>
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
              <label>Email Id:</label>
              <input type="email" name="email" ngModel required email="true">
            </div>
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
              <label>Contact Person:</label>
              <input type="text" name="contact_person" ngModel required>
            </div>
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>Address:</label>
              <textarea rows="2" name="address" ngModel required></textarea>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="agencyForm.form.valid && saveAgency(agencyForm)" [disabled]="agencyForm.form.invalid">{{'common.submit' | translate}}</button>
      <button class="btn btn-danger" (click)="isNewAgency = false;">{{'common.close' | translate}}</button>
    </div>
  </div>
</div>
