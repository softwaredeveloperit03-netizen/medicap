<div class="container-fluid">
  <div class="card">
    <div class="card-header" style="text-align: center">Location Master</div>
    <div class="card-block">
      <div class="card-title">
        <input type="button" value="new Location" (click)="isNewLocation = true" class="btn btn-sm btn-info-outline">
      </div>
      <div class="card-text datagrid-wrapper">
        <clr-datagrid >
            <clr-dg-column>Place</clr-dg-column>
            <clr-dg-column>District</clr-dg-column>
            <clr-dg-column>State</clr-dg-column>
            <clr-dg-column>{{'common.status' | translate}}</clr-dg-column>
            <clr-dg-column>Entry By</clr-dg-column>

            <clr-dg-row *clrDgItems="let user of locations">
                <clr-dg-cell>{{user.place}}</clr-dg-cell>
                <clr-dg-cell>{{user.district}}</clr-dg-cell>
                <clr-dg-cell>{{user.state}}</clr-dg-cell>
                <clr-dg-cell>{{user.status}}</clr-dg-cell>
                <clr-dg-cell>{{user.entry_by}}</clr-dg-cell>
            </clr-dg-row>

            <!-- <clr-dg-footer class="clarity-footer">
              <clr-dg-pagination #pagination [clrDgPageSize]="10">
                  {{pagination.firstItem + 1}} - {{pagination.lastItem + 1}}
                  of {{pagination.totalItems}} Locations
              </clr-dg-pagination>
            </clr-dg-footer> -->
        </clr-datagrid>
      </div>
    </div>
  </div>
  </div>

  <clr-modal [(clrModalOpen)]="isNewLocation">
      <h3 class="modal-title">ADD NEW LOCATION</h3>
      <div class="modal-body">
        <div class="card">
            <div class="card-block">
              <div class="card-text">
              <form #locationForm="ngForm">
                  <div class="clr-row">
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                      <label>Place:</label>
                      <input type="text" name="place" ngModel required>
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                      <label>District:</label>
                      <input type="text" name="district" ngModel required>
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                      <label>State:</label>
                      <input type="text" name="state" ngModel required>
                    </div>
                  </div>
              </form>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" (click)='locationForm.form.valid && addLocation(locationForm)' [disabled]="locationForm.form.invalid">{{'common.submit' | translate}}</button>
        </div>
      </div>
  </clr-modal>
