<div class="container-fluid">
    <div class="card">
        <div class="card-header">Contractor Manager</div>
        <div class="card-block">
            <div class="card-text datagrid-wrapper">
                <clr-datagrid >
                    <clr-dg-column>Contractor Name</clr-dg-column>
                    <clr-dg-column>Contact No</clr-dg-column>
                    <clr-dg-column>{{'common.email' | translate}}</clr-dg-column>
                    <clr-dg-column>{{'common.status' | translate}}</clr-dg-column>
                
                    <clr-dg-row *ngFor="let user of contractors">
                        <clr-dg-cell>{{user.contractor_name}}</clr-dg-cell>
                        <clr-dg-cell>{{(user.contact_no | canadianPhone)}}</clr-dg-cell>
                        <clr-dg-cell>{{user.email}}</clr-dg-cell>
                        <clr-dg-cell>{{user.status}}</clr-dg-cell>
                    </clr-dg-row>
                    <!-- <clr-dg-footer class="clarity-footer">
                        <clr-dg-pagination #pagination [clrDgPageSize]="10">
                          <clr-dg-page-size [clrPageSizeOptions]="[10,20,50,100]">Users per page</clr-dg-page-size>
                          {{pagination.firstItem + 1}} - {{pagination.lastItem + 1}}
                          of {{pagination.totalItems}} users
                        </clr-dg-pagination>
                      </clr-dg-footer> -->
                </clr-datagrid>
            </div>
        </div>
    </div>
</div>
