  <div class="component store-legacy-dash">
    <div class="subsection">
      <div class="purchase-block">
        <div style="text-align:end" class="exit-section">
          <div class="header-block" style="margin:10px 0px">
            <h3>Damage Container Inspection</h3>
          <div routerLink="/store/finish" class="name-board2"><i class="fas fa-times"></i>
          </div>
        </div>
  
        <div class="main-section" style="margin: 0px 10px 10px 10px !important;">
          <div class="category">
            <div class="block-container">
              <div class="item-block" routerLink="awaiting">
                <i class="fas fa-clock"></i>
                <span>Awaiting</span>
              </div>
              
              <div class="item-block" routerLink="approval" *ngIf="ischecker == 'Yes'" >
                <i class="fas fa-check"></i>
                <span>Checking</span>
              </div>
              
              <div class="item-block" routerLink="log">
                <i class="fas fa-book"></i>
                <span>Log Book</span>
              </div>
              
              <div class="item-block" routerLink="correction">
                <i class="fas fa-pencil-alt"></i>
                <span>Correction</span>
              </div>
              
            
                        
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
