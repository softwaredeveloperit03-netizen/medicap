<div class=container-fluid>
    <div class="card">
        <div class="card-header" style="text-align:center;">
            <div class="clr-row" style="margin-bottom: -10px;">
                <div class="clr-col-lg-9" style="text-align: left;margin-top: -2px;">Equipment Usage Form</div>
                <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                    <button class="btn btn-danger btn-sm" routerLink="/store/equipments/usages" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
                </div>
            </div>
        </div>
        <div class="card-block">
            <div class="card-text">
                <form #usage="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                            <label>Equipment Name</label>
                            <select name="equipment_name" ngModel required (change)="getCode($event.target.selectedIndex)">
                                <option></option>
                                <option *ngFor="let eqip of equipments">{{eqip.equipment_name}}</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                            <label>Equipment Code</label>
                            <select name="equipment_code" ngModel required (change)="getClean($event.target.selectedIndex)">
                                <option></option>
                                <option *ngFor="let eq of selectedResult['equipments']">{{eq.equipment_code}}</option>
                            </select>
                        </div>
                    </div>
                    <div class="clr-row" *ngIf="selectedData['clean']=='yes'">
                        <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                            <label>Activity:</label>
                            <textarea rows="2" type="text" name="activity" ngModel required></textarea>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Usage From:</label>
                            <input type="datetime-local" name="usage_from" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Usage To:</label>
                            <input type="datetime-local" name="usage_to" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Operator</label>
                            <select name="operator" ngModel required>
                                <option></option>
                                <option *ngFor="let ope of operators" [value]="ope.labour_no">{{ope.labour_name}}</option>
                            </select>
                        </div>
                    </div>
                    <h3 style="text-align: center; color: red;" *ngIf="selectedData['clean'] == 'no'">You can not use selected equipment, because, Equipment not yet cleaned.</h3>
                </form>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="saveUsage(usage)">{{'common.save' | translate}}</button>
        </div>
    </div>
</div>
