<div class="card">
    <div class="card-header" style="text-align:center;">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-lg-9" style="text-align: left;margin-top: -2px;">Equipment Log</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-danger btn-sm btn-danger" routerLink="/store/equipments/">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <table class="table table-border">
                <tr>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white">Sr.</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white">Equipment Name</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white">Equipment Code</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white">make</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white">Capacity</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white">Location</th>
                </tr>    
                <tr *ngFor="let res of results;let i=index">
                    <td style="text-align: left;">{{i+1}}.</td>
                    <td style="text-align: left;">{{res.equipment_name}}</td>
                    <td style="text-align: left;">{{res.equipment_code}}</td>
                    <td style="text-align: left;">{{res.make}}</td>
                    <td style="text-align: left;">{{res.capacity}} {{res.unit}}</td>
                    <td style="text-align: left;">{{res.location}}</td>
                </tr>
                <tr *ngIf="results?.length==0">
                    <td colspan="6">No Record Found!</td>
                </tr>
            </table>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary"(click)="download()">{{'common.download' | translate}}</button>
    </div>
</div>
