<div class="component store-legacy-dash">
  <div class="subsection">
    <div class="purchase-block">
      <div style="text-align:end" class="exit-section">
        <div class="header-block" style="margin:10px 0px">
          <h3>Rack Location View</h3>
        <div routerLink="/store/wms/graphical-view" class="name-board2"><i class="fas fa-times"></i>
        </div>
      </div>

      <div class="main-section" style="margin: 0px 10px 10px 10px !important;">
        <div class="card">
          <div class="card-block">
            <div class="clr-row" style="margin-bottom: 20px;">
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Select room:</strong></label>
                <select name="section" [(ngModel)]="selectedSection" (change)="getLanesBySection()">
                  <option value="">-- Select Section --</option>
                  <option *ngFor="let section of sections" [value]="section.section_name">{{ section.section_name }}</option>
                </select>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Select Lane:</strong></label>
                <select name="lane" [(ngModel)]="selectedLane" (change)="getRacksByLane()">
                  <option value="">-- Select Lane --</option>
                  <option *ngFor="let lane of lanes" [value]="lane.laneNO">{{ lane.laneNO }}</option>
                </select>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Select Rack:</strong></label>
                <select name="rack" [(ngModel)]="selectedRack" (change)="loadRackLocations()">
                  <option value="">-- Select Rack --</option>
                  <option *ngFor="let rack of racks" [value]="rack.rack_no">{{ rack.rack_no }}</option>
                </select>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" style="padding-top: 25px;">
                <button class="btn btn-primary" (click)="loadRackLocations()" [disabled]="!selectedRack">Load Locations</button>
              </div>
            </div>
          </div>
        </div>

        <div class="card" *ngIf="loading">
          <div class="card-block">
            <div style="text-align: center; padding: 20px;">
              <span class="spinner spinner-inline"></span>
              <span>Loading locations...</span>
            </div>
          </div>
        </div>

        <div class="card" *ngIf="locations && locations.length > 0 && !loading">
          <div class="card-header" style="background-color: #0f4c75; color: white;">
            <h4>Rack: {{ selectedRack }} - Location Status</h4>
            <div style="margin-top: 10px;">
              <span style="background-color: #28a745; padding: 5px 10px; margin-right: 10px; border-radius: 3px;">Green = Empty</span>
              <span style="background-color: #dc3545; padding: 5px 10px; border-radius: 3px; color: white;">Red = Occupied</span>
            </div>
          </div>
          <div class="card-block">
            <div class="location-grid">
              <div 
                *ngFor="let location of locations" 
                class="location-box"
                [style.background-color]="getLocationColor(location)"
                [style.color]="location.occupied ? 'white' : 'black'"
                (click)="viewLocationDetails(location)"
                [title]="'Location: ' + location.locationNo + ' - ' + getLocationStatus(location)">
                <div class="location-number">{{ location.locationNo }}</div>
                <div class="location-status">{{ getLocationStatus(location) }}</div>
                <div class="location-palate" *ngIf="location.occupied">{{ location.palate_barcode }}</div>
              </div>
            </div>
          </div>
        </div>

        <div class="card" *ngIf="selectedRack && locations && locations.length === 0 && !loading">
          <div class="card-block">
            <div class="alert alert-info">
              <i class="fas fa-info-circle"></i> No locations found for this rack.
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
