<app-qc-module-dashboard-shell
  themeVariant="marketing"
  sidebarNavMode="modules"
  [showDeptToolbar]="false"
  dashboardTitle="Stock Book"
  sectionLabel="Stock Section"
  sidebarTitle="Stock Modules"
  closeRouterLink="/store"
  searchPlaceholder="Search modules"
  [cards]="cards"
  paletteStorageKey="store-stock-dashboard-dashboard-component"
  sidebarStorageKey="store-stock-dashboard-dashboard-component_sidebar"
>
  <div qcDashboardBottom class="chart-section" *ngIf="hasChart">
    <div class="chart-card">
      <h3 class="chart-heading">Material Wise Stock Chart</h3>
      <div class="chart-wrap">
        <canvas id="MaterialWiseMonthlyChart"></canvas>
      </div>
    </div>
  </div>
</app-qc-module-dashboard-shell>
