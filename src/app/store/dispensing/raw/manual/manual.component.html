<div class="card recv-page">
    <header class="card-header mef-panel-header">
    <h2 class="mef-panel-header__title">Manual Dispensing</h2>
    <div class="mef-panel-header__actions">
      <button type="button" class="btn btn-sm mef-panel-header__close" routerLink="/store/dispensing/raw">{{'common.close' | translate}}</button>
    </div>
  </header>
    <div class="card-block">
        <div class="card-text">
            <form #formData="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Plant Name :<span style="color:red;">*</span></label>
                        <select name="plant_name" [(ngModel)]="plant_name" required >
                            <option></option>
                            <option *ngFor ="let plant of plants">{{plant.unit}}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-4 clr-col-xs-4">
                        <label>Despansing For:</label>
                        <select name="dispensing_for" [(ngModel)]="dispensing_for" required>
                            <option>PART-A</option>
                            <option>EOU</option>
                        </select>
                        </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Product Name:<span style="color:red;">*</span></label>
                        <select name="product_code" ngModel required >
                            <option></option>
                            <option *ngFor="let product of products; let i = index" [value]="product.product_code">{{ product.product_name }}</option>
                        </select>
                    </div>
         
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Batch/LOT No:</label>
                        <input type="text" name="batch_no"  [(ngModel)]="batch_no" required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Requisition No:</label>
                        <input type="number" name="requisition_no" (input)="checkValue($event)"   [(ngModel)]="req_no" required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Requisition Date:</label>
                        <input type="date" name="requisition_date" ngModel required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>RLAF Pressure:</label>
                        <input type="text" name="rlaf_pressure" ngModel required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Dispensing By:<span style="color:red;">*</span></label>
                        <select name="dispensing_by" ngModel required >
                            <option></option>
                            <option *ngFor="let laf of storePersons">{{ laf.firstname }}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3">
                        <label>Dispensing Start Time:</label>
                        <input type="time" name="dispensing_start" [max]="dispensing_stop" [(ngModel)]="dispensing_start" >
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3">
                        <label>Dispensing Stop Time:</label>
                        <input type="time" name="dispensing_stop" [min]="dispensing_start" [(ngModel)]="dispensing_stop" >
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Dispensing Area Cleaned By:<span style="color:red;">*</span></label>
                        <select name="cleaned_by" ngModel required >
                            <option></option>
                            <option *ngFor="let laf of operator" [value]="laf.labour_no">{{ laf.labour_name }}-{{ laf.labour_no }}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3">
                        <label>Cleaning Start Time:</label>
                        <input type="time" name="cleaning_from"  max="cleaning_to" [(ngModel)]="cleaning_from" >
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3">
                        <label>Cleaning Complete Time:</label>
                        <input type="time" name="cleaning_to" min="cleaning_from" [(ngModel)]="cleaning_to" >
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3">
                        <label>Balance:</label>
                        <input type="text" name="balance_id" ngModel="WB-003" readonly tabindex="-1">
                    </div>
                </div>
                <h4>Raw Materials List:</h4>
                <form #rawForm="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                            <label>Material Type:</label>
                            <select name="material_subtype" [(ngModel)]="material_subtype" (change)="getRawMaterials($event.target.value)">
                                <option></option>
                                <option>Key Starting Material</option>
                                <option>Raw Material</option>
                                <option>Liquid</option>
                                <option>Solvents</option>
                                <option>Others</option>
                            </select>
                        </div>
    
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                            <label>Material Name:</label>
                            <select name="material_code" ngModel (change)="getSelectedMaterial($event.target.selectedIndex)" >
                              <option></option>
                                <option *ngFor="let material of materials;" [value]="material.material_code">{{ material.material_name }} - {{ material.grade }}</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-3 clr-col-xs-3">
                        <label>Medicap Lot No:</label>
                        <select name="ar_no" ngModel required>
                            <option></option>
                            <option *ngFor="let arno of  ars">{{arno.ar_no}}</option> 
                        </select>
                        </div>
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3 clr-col-xs-3">
                            <label>Qty:<br></label>
                            <input type="text" name="qty" ngModel  required style="width: 65%;">
                            <select name="unit"  ngModel  required style="width: 35%;">
                                <option></option>
                                <option *ngFor="let unit of units">{{ unit.unit }}</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-1 clr-col-md-1 clr-col-sm-12 clr-col-xs-12">
                        <button class="btn btn-primary" style="margin-top: 31px;" (click)="add(rawForm)">{{'common.add' | translate}}</button>
                        </div>
                    </div>
                </form>
    
                <table class="table">
                    <tr>
                        <th>Sr.</th>
                        <th style="text-align: left;">Material type</th>
                        <th style="text-align: left;">Material Code</th>
                        <th style="text-align: left;">Material Name</th>
                        <th style="text-align: left;">Medicap Lot No</th>
                        <th>Qty</th>
                        <th>Del</th>
                    </tr>
                    <tr *ngFor="let comp of materialList; let i = index">
                        <td>{{ i + 1 }}.</td>
                        <td style="text-align: left;">{{ comp.material_subtype }}</td>
                        <td style="text-align: left;">{{ comp.material_code }}</td>
                        <td style="text-align: left;">{{ comp.material_name }}</td>
                        <td style="text-align: left;">{{ comp.ar_no }}</td>
                        <td>{{ comp.qty }} {{ comp.unit }}</td>
                        <td>
                            <clr-icon shape="trash" class="is-error" (click)="dele(i)"></clr-icon>
                        </td>
                    </tr>
                    <tr *ngIf="materialList.length == 0">
                        <td colspan="7">{{'common.noRecords' | translate}}</td>
                    </tr>
                </table>
                
            </form>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="save(formData)">{{'common.save' | translate}}</button>
    </div>
</div>
