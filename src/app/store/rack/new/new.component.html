<div class="card recv-page">
    <header class="card-header mef-panel-header">
    <h2 class="mef-panel-header__title">New Palette</h2>
    <div class="mef-panel-header__actions">
      <button type="button" class="btn btn-sm mef-panel-header__close" routerLink="/store/rack">{{'common.close' | translate}}</button>
    </div>
  </header>
    <div class="card-block">
        <div class="card-text">
            <form #paletteForm="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Select Section : <span style="color:red;">*</span></strong></label>
                        <select name="section_name" ngModel required >
                            <option></option>
                            <option *ngFor="let section of sections;" value="{{section.section_name}}">{{ section.section_name }}</option>
                        </select>
                    </div>

                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>No.Of. Palette : <span style="color:red;">*</span></strong></label>
                        <input type="number" name="noOfPalette" ngModel required>
                    </div>

                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label style="color:green; font-weight:bolder">Palette No. Automatically Generated.:</label>
                    </div>

                </div>
            </form>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="savePalette(paletteForm)">Generate Palette</button>
    </div>
    <div class="card-block">
        <div class="card-text">
            <div class="clr-row">
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                    <div class="datagrid-wrapper">
                        <clr-datagrid class="recv-datagrid" [clrDgLoading]="loading" [clrDgFilter]="searchQuery" >

                            <clr-dg-column style="width: 10;">{{'common.table.srNo' | translate}}</clr-dg-column>
                            <clr-dg-column>Room Name</clr-dg-column>
                            <clr-dg-column>Palette No.</clr-dg-column>
                            <clr-dg-column>Gen. By/ On.</clr-dg-column>
                     
                            <clr-dg-row *clrDgItems="let result of filteredMaterials; let i = index" [clrDgItem]="result">
                                <clr-dg-cell>{{ i+1}}</clr-dg-cell>
                                <clr-dg-cell>{{ result.section_name || '-' }}</clr-dg-cell>
                                <clr-dg-cell>{{ result.paletteNo || '-' }}</clr-dg-cell>
                                <clr-dg-cell>{{ result.entryBy || '-'}} / {{ result.entryOn || '-'}}</clr-dg-cell>
                             </clr-dg-row>
                        </clr-datagrid>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-danger" routerLink="/store/rack">{{'common.close' | translate}}</button>
    </div>
</div>
