<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Job Work Invoices</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-danger" routerLink="/store/job_work">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #requestForm="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Material Type:</label>
                        <select name="material_type" [(ngModel)]="material_type" required>
                            <option></option>
                            <option value="Raw Material">Raw Material</option>
                            <option value="Packing Material">Packing Material</option>
                            <!-- <option value="Finish Goods">Finish Goods</option> -->
                        </select>
                    </div>

                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="material_type=='Raw Material'">
                        <label>Material Subtype:</label>
                        <select name="material_subtype" ngModel (change)="getMaterials($event.target.value)" required>
                            <option></option>
                            <option>KSM</option>
                            <option>Raw Material</option>
                            <option>Intermidiate</option>
                        </select>
                    </div>


                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12"  *ngIf="material_type=='Packing Material'">
                        <label>Material Subtype:</label>
                        <select name="material_subtype" ngModel (change)="getMaterials($event.target.value)" required>
                            <option></option>
                            <option value="Primary">Primary</option>
                            <option value="Secondary">Secondary</option>
                            <option value="Tertiary">Tertiary</option>
                            <option value="printed">Printed</option>
                        </select>
                    </div>
                  
 


                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="isMaterial">
                        <label>Material Name:<br></label>
                        <p-dropdown [options]="materials" name="material_code" [(ngModel)]="selectedMaterial" optionLabel="material_name" [filter]="true" filterBy="material_name" [showClear]="true" placeholder="Select Material Name">
                          <ng-template pTemplate="selectedItem">
                            <div class="country-item country-item-value" *ngIf="selectedMaterial">
                              <div>{{selectedMaterial.material_name }}</div>
                            </div>
                          </ng-template>
                          <ng-template let-country pTemplate="item">
                            <div class="country-item">
                              <div>{{country.material_name }}</div>
                            </div>
                          </ng-template>
                        </p-dropdown>
                    </div>

                    <!-- <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="material_type=='Finish Goods'">
                        <label>Product Name:<br></label>
                        <p-dropdown [options]="products" name="product_code" [(ngModel)]="selectedProduct" optionLabel="product_name" [filter]="true" filterBy="material_name" [showClear]="true" placeholder="Select Product Name">
                          <ng-template pTemplate="selectedItem">
                            <div class="country-item country-item-value" *ngIf="selectedProduct">
                              <div>{{selectedProduct.product_name }}</div>
                            </div>
                          </ng-template>
                          <ng-template let-country pTemplate="item">
                            <div class="country-item">
                              <div>{{country.product_name }}</div>
                            </div>
                          </ng-template>
                        </p-dropdown>
                    </div> -->

                    <!-- <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12" *ngIf="material_type=='Finish Goods'">
                        <label>Product Code:</label>
                        <input type="text" name="product_code" value="{{selectedProduct.product_code}}" readonly>
                    </div> -->

                    <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12"*ngIf="material_type=='Raw Material' || material_type=='Packing Material'  ">
                        <label>Material Code:</label>
                        <input type="text" name="material_code" value="{{selectedMaterial.material_code}}" readonly>
                    </div>

                    <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12"*ngIf="material_type=='Raw Material' || material_type=='Packing Material'  ">
                        <label>Grade:</label>
                        <input type="text" name="grade" value="{{selectedMaterial.grade}}" readonly>
                    </div>


                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Address:</label>
                        <input type="text" name="address" ngModel >
                    </div>

                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Location:</label>
                        <input type="text" name="location" ngModel >
                    </div>

                    
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Postal Code:</label>
                        <input type="text" name="pin" ngModel >
                    </div>
                    

                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Contact Person:</label>
                        <input type="text" name="c_person" ngModel >
                    </div>

                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Purpose Of Jobwork:</label>
                        <input type="text" name="purpose" ngModel >
                    </div>

                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Final Output Expected:</label>
                        <input type="text" name="output" ngModel >
                    </div>

                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Expected Date To Return:</label>
                        <input type="date" name="return_date" ngModel >
                    </div>

                    <!-- <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>issued By:</label>
                        <input type="text" name="issued_by" ngModel >
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Approve By:</label>
                        <input type="text" name="approve_by" ngModel >
                    </div> -->

                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Received Qty:</label>
                        <input type="text" name="issued_qty" ngModel >
                    </div>

                    <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12"*ngIf="material_type=='Raw Material' || material_type=='Packing Material'  ">
                        <label>Unit:</label>
                        <input type="text" name="unit" value="{{selectedMaterial.unit}}" readonly>
                    </div>


                </div>
            </form>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary">{{'common.save' | translate}}</button>
    </div>
</div>
