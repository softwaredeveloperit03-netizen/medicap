<div class="card" *ngIf="isView">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Equipement Usages & Cleaning</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/store/logins" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block" >
        <form #newForm="ngForm">   
        <div class="card-text">
            
                <div class="clr-row">
                  <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <label> Date of Cleaning:<span style="color: red;">*</span></label>
                    <input type="date" name="cleaning_date" ngModel required>
                </div>
                  <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <label> Time of Cleaning:<span style="color: red;">*</span></label>
                    <input type="time" name="cleaning_time" ngModel required>
                </div>
                  <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <label>  Start Time:<span style="color: red;">*</span></label>
                    <input type="time" name="start_time" ngModel required>
                </div>
                  <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <label>End  Time  :<span style="color: red;">*</span></label>
                    <input type="time" name="end_time" ngModel required>
                </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>  Type of Utilence  :<span style="color: red;">*</span></label>
                        <input type="text" name="utilence_type" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label> Done By  :<span style="color: red;">*</span></label>
                        <input type="text" name="done_by" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label> Check By:<span style="color: red;">*</span></label>
                        <input type="text" name="checked_by" ngModel required>
                    </div>
                    
                     
                </div>
            </div>
             
             
        </form>
    </div>
  
        <div class="card-footer">
            <button class="btn btn-primary" (click)="save(newForm)">{{'common.save' | translate}}</button>
        </div>
  </div>
