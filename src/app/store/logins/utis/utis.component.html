<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> New Form</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/store/logins/new" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <form #newForm="ngForm">   
        <div class="card-text">
            
                <div class="clr-row">
                  <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <label>Appraisal Type:<span style="color: red;">*</span></label>
                    <input type="text" name="apprasil_type" ngModel required>
                </div>
                  <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <label> Appraisal Code:<span style="color: red;">*</span></label>
                    <input type="text" name="apprasil_code" ngModel required>
                </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>  Department:<span style="color: red;">*</span></label>
                        <input type="text" name="department" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>checklist Heading     :<span style="color: red;">*</span></label>
                        <input type="text" name="checklist" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label> Designation:<span style="color: red;">*</span></label>
                        <input type="text" name="designation" ngModel required>
                    </div>
                    
                     
                </div>
            </div>
             
             
        </form>
    </div>
  
        <div class="card-footer">
            <button class="btn btn-primary" (click)="save(newForm)">{{'common.save' | translate}}</button>
        </div>
  </div>
