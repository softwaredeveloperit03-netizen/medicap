<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Job Work</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-danger" routerLink="/store/job_work">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #MainForm="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12">
                        <label>Party Name: <span style="color: red;"><b>*</b></span></label>
                        <input type="text" name="partyName" ngModel required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Address: <span style="color: red;"><b>*</b></span></label>
                        <input type="text" name="address" ngModel required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Purpose Of Jobwork: <span style="color: red;"><b>*</b></span></label>
                        <input type="text" name="purpose" ngModel required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Expected Date To Return: <span style="color: red;"><b>*</b></span></label>
                        <input type="date" name="return_date" ngModel required>
                    </div>
                </div>
            </form>
        </div>
        <div class="card-block">
            <div class="card-text">
                <form #jobwork="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                            <label>Jobwork Type : <span style="color: red;"><b>*</b></span></label>
                            <select name="material_type" [(ngModel)]="material_type" (change)="getMaterialSubType()" required>
                                 <!-- <option value="Raw Material">Raw Material</option> -->
                                <option ></option>
                                <option value="Finish Goods">Finish Goods</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="material_type == 'Raw Material'">
                            <label>Material Sub Type: <span style="color: red;"><b>*</b></span></label>
                            <select name="material_subtype" [(ngModel)]="material_subtype" (change)="getMaterialForJobWork()" required>
                                <option *ngFor="let item of subTypes">{{item.material_subtype}}</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="material_type == 'Raw Material'">
                            <label>Materials: <span style="color: red;"><b>*</b></span></label>
                            <select name="material_code" [(ngModel)]="material_code" (change)="getBatchData()" required>
                                <option *ngFor="let item of materials" value="{{item.material_code}}">{{item.material_name}}</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="material_type == 'Finish Goods'">
                            <label>Products : <span style="color: red;"><b>*</b></span></label>
                            <select name="material_code" [(ngModel)]="material_code" (change)="getBatchDataFg($event.target.selectedIndex)" required>
                                <option></option>
                                <option *ngFor="let item of products" value="{{item.product_code}}">{{item.product_name}}</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12">
                            <label *ngIf="material_type == 'Raw Material'">Material Code <span style="color: red;"><b>*</b></span></label>
                            <label *ngIf="material_type == 'Finish Goods'">Product Code <span style="color: red;"><b>*</b></span></label>
                            <input type="text" name="material_code" [(ngModel)]="material_code" readonly >
                        </div>
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" >
                            <label>Medicap Lot No : <span style="color: red;"><b>*</b></span></label>
                            <select name="batch_no" ngModel  (change)="selectedBatchNo($event.target.selectedIndex)" required>
                                <option ></option>
                                <option *ngFor="let item of batchData" value="{{item.batch_no}}">{{item.batch_no}}</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12">
                            <label>Ar. No.:</label>
                            <input type="text" name="ar_no" [(ngModel)]="selectedBatch['ar_no']" readonly>
                        </div>
                        <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12">
                            <label>Available Qty <span style="color: green;"><b>{{selectedBatch['pack_size']}} {{selectedBatch['pack_size_unit']}}</b></span></label>
                            <input type="text" name="avaliableQty" [(ngModel)]="selectedBatch['avaliableQty']"  readonly>
                        </div>
                        <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12">
                            <label>Issued Qty. : <span style="color: red;"><b>*</b></span></label>
                            <input type="text" name="issued_qty" ngModel required>
                        </div>
                        <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12">
                            <label>Unit:</label>
                            <input type="text" name="qty_unit" [(ngModel)]="selectedBatch['qty_unit']"  readonly>
                        </div>
                        <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12">
                            <label>Mfg. Date:</label>
                            <input type="text" name="mfg_date" [(ngModel)]="selectedBatch['mfg_date']"  readonly>
                        </div>
                        <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12">
                            <label>Exp. Date:</label>
                            <input type="text" name="exp_date" [(ngModel)]="selectedBatch['exp_date']"  readonly>
                        </div>
                        <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12">
                            <label>Release Date:</label>
                            <input type="text" name="rel_date" [(ngModel)]="selectedBatch['rel_date']"  readonly>
                        </div>
                        <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12">
                            <br>
                            <button class="btn btn-primary" (click)="addData(jobwork)">{{'common.add' | translate}}</button>
                        </div>
                        <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12">
                            <table class="table table-border">
                                <tr>
                                    <td style="background-color: black;color: white;text-align: left;"><b>{{'common.table.srNo' | translate}}</b></td>
                                    <td style="background-color: black;color: white;text-align: left;"><b>Product Name</b></td>
                                    <td style="background-color: black;color: white;text-align: left;"><b>Product Code</b></td>
                                    <td style="background-color: black;color: white;text-align: left;"><b>Medicap Lot No</b></td>
                                    <td style="background-color: black;color: white;text-align: left;"><b>Ar. No.</b></td>
                                    <td style="background-color: black;color: white;text-align: left;"><b>Issued Qty.</b></td>
                                    <td style="background-color: black;color: white;text-align: left;"><b>{{'common.unit' | translate}}</b></td>
                                    <td style="background-color: black;color: white;text-align: left;"><b>{{'common.table.action' | translate}}</b></td>
                                </tr>
                                <tr *ngFor="let item of jobWorkData; let i = index;">
                                    
                                    <td style="text-align: left;">{{item.issued_qty}}</td>
                                    <td style="text-align: left;">{{item.qty_unit}}</td>
                                    <td style="text-align: left;">
                                        <button class="btn btn-sm btn-danger" (click)="delData(i)">DEL</button>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-success" (click)="saveOpeningStock(MainForm)">{{'common.save' | translate}}</button>
        <button class="btn btn-danger" routerLink="/store/job_work">{{'common.close' | translate}}</button>
    </div>
</div>
