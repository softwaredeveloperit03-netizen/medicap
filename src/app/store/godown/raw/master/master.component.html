<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-lg-3" style="color: aliceblue;margin-top: -2px;text-align: left;">Criteria Master</div>
            <div class="clr-col-lg-9" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm btn-danger" routerLink="/store/godown/raw">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #stateForm="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Material Type:<span style="color:red;"></span></label>
                            <select name="material_type" ngModel required>
                                <option>Raw Material </option>
                                <option >Packing Material</option>
                            </select>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Criteria For Weight Checking:<span style="color:red;"></span></label>
                            <select name="weighing" ngModel required>
                                <option>10%</option>
                                <option>√n +1</option>
                                <option>100%</option>
                            </select>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Criteria For Tolerance(%):<span style="color:red;"></span></label>
                        <input type="text" name="tolerance" ngModel required #tolerance="ngModel" min="0" max="99999999">
                        <span style="color: red;" *ngIf="tolerance.invalid && tolerance.touched">Please Enter Postivie Number(4 Digits)!</span>
                    </div>
                </div>
            </form>
            <div class="card-footer"><button class="btn btn-primary" (click)="save(stateForm)">{{'common.add' | translate}}</button></div>
        </div>
        <div class="card-text">
            <table class="table table-border">
                <tr>
                    <th  style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.table.srNo' | translate}}</th>
                    <th  style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Material Type</th>
                    <th  style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Criteria For Weight Checking</th>
                    <th  style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Criteria For Tolerance(%)</th>
                    <!-- <th  style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.table.action' | translate}}</th> -->
                </tr>
                <tr *ngFor="let crit of criterias;let i=index">
                    <td>{{i+1}}.</td>
                    <td>{{crit.material_type}}</td>
                    <td style="text-align: right;">{{crit.weighing}}</td>
                    <td style="text-align: right;">{{crit.tolerance}}</td>
                    <!-- <td><button class="btn btn-sm btn-info">{{'common.edit' | translate}}</button></td> -->
                   
                </tr>
            </table>
            <!-- <div class="card-footer"><button class="btn btn-primary" (click)="saveCountries(countryform)">{{'common.save' | translate}}</button></div> -->
        </div>
    </div>
