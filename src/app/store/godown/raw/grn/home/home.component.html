<div class="card">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Raw Material Goods Receipt Notes</div>
      <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        <button class="btn btn-sm btn-danger" routerLink="/store/godown/raw">{{'common.close' | translate}}</button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <div class="card-text">
      <div class="clr-row">
        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="isUser">
          <div class="card clickable"style="height: auto; border: none; border-radius: 7px; box-shadow: rgba(0, 0, 0, 0.07) 0px 1px 2px, rgba(0, 0, 0, 0.07) 0px 2px 4px, rgba(0, 0, 0, 0.07) 0px 4px 8px, rgba(0, 0, 0, 0.07) 0px 8px 16px, rgba(0, 0, 0, 0.07) 0px 16px 32px, rgba(0, 0, 0, 0.07) 0px 32px 64px"

          routerLink="awaiting">
            <div class="card-block" style="text-align: center; border-top: solid 3px rgb(0, 51, 102); border-radius: 7px;">
              <img width="50px" height="50px" src="assets/new.png">
              <p class="card-text"><b>Awaiting</b></p>
            </div>
          </div>
        </div>
      
        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="isChecker || isApprover">
          <div class="card clickable"style="height: auto; border: none; border-radius: 7px; box-shadow: rgba(0, 0, 0, 0.07) 0px 1px 2px, rgba(0, 0, 0, 0.07) 0px 2px 4px, rgba(0, 0, 0, 0.07) 0px 4px 8px, rgba(0, 0, 0, 0.07) 0px 8px 16px, rgba(0, 0, 0, 0.07) 0px 16px 32px, rgba(0, 0, 0, 0.07) 0px 32px 64px"

          routerLink="checking">
            <div class="card-block" style="text-align: center; border-top: solid 3px rgb(0, 51, 102); border-radius: 7px;">
              <img width="50px" height="50px" src="assets/checklist.png">
              <p class="card-text"><b>Checking</b></p>
            </div>
          </div>
        </div>
      
        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
          <div class="card clickable"style="height: auto; border: none; border-radius: 7px; box-shadow: rgba(0, 0, 0, 0.07) 0px 1px 2px, rgba(0, 0, 0, 0.07) 0px 2px 4px, rgba(0, 0, 0, 0.07) 0px 4px 8px, rgba(0, 0, 0, 0.07) 0px 8px 16px, rgba(0, 0, 0, 0.07) 0px 16px 32px, rgba(0, 0, 0, 0.07) 0px 32px 64px"

          routerLink="log">
            <div class="card-block" style="text-align: center; border-top: solid 3px rgb(0, 51, 102); border-radius: 7px;">
              <img width="50px" height="50px" src="assets/log.png">
              <p class="card-text"><b>Log Book</b></p>
            </div>
          </div>
        </div>

        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
          <div class="card clickable"style="height: auto; border: none; border-radius: 7px; box-shadow: rgba(0, 0, 0, 0.07) 0px 1px 2px, rgba(0, 0, 0, 0.07) 0px 2px 4px, rgba(0, 0, 0, 0.07) 0px 4px 8px, rgba(0, 0, 0, 0.07) 0px 8px 16px, rgba(0, 0, 0, 0.07) 0px 16px 32px, rgba(0, 0, 0, 0.07) 0px 32px 64px"

          routerLink="label">
            <div class="card-block" style="text-align: center; border-top: solid 3px rgb(0, 51, 102); border-radius: 7px;">
              <img width="50px" height="50px" src="assets/label.png">
              <p class="card-text"><b>Label Printing</b></p>
            </div>
          </div>
        </div>


        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
          <div class="card clickable"style="height: auto; border: none; border-radius: 7px; box-shadow: rgba(0, 0, 0, 0.07) 0px 1px 2px, rgba(0, 0, 0, 0.07) 0px 2px 4px, rgba(0, 0, 0, 0.07) 0px 4px 8px, rgba(0, 0, 0, 0.07) 0px 8px 16px, rgba(0, 0, 0, 0.07) 0px 16px 32px, rgba(0, 0, 0, 0.07) 0px 32px 64px"

          routerLink="hold">
            <div class="card-block" style="text-align: center; border-top: solid 3px rgb(0, 51, 102); border-radius: 7px;">
              <img width="50px" height="50px" src="assets/label.png">
              <p class="card-text"><b>Keep On Hold</b></p>
            </div>
          </div>
        </div>



        
        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
          <div class="card clickable"style="height: auto; border: none; border-radius: 7px; box-shadow: rgba(0, 0, 0, 0.07) 0px 1px 2px, rgba(0, 0, 0, 0.07) 0px 2px 4px, rgba(0, 0, 0, 0.07) 0px 4px 8px, rgba(0, 0, 0, 0.07) 0px 8px 16px, rgba(0, 0, 0, 0.07) 0px 16px 32px, rgba(0, 0, 0, 0.07) 0px 32px 64px"

          routerLink="reject">
            <div class="card-block" style="text-align: center; border-top: solid 3px rgb(0, 51, 102); border-radius: 7px;">
              <img width="50px" height="50px" src="assets/label.png">
              <p class="card-text"><b>Rejected GRN</b></p>
            </div>
          </div>
        </div>


      </div>
    </div>
  </div>
</div>
