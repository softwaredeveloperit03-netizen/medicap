<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Spillage of Raw Material</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/store/godown/raw/spillage" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #spillageForm="ngForm">  
                <div class="clr-row">
                    <div class="clr-col-lg-4 clr-col-md-6 clr-col-sm-12 clr-col-sm-12">
                        <label>Material Type<span style="color: red;"></span></label>
                        <select name="material_subtype" [(ngModel)]="material_subtype" required (change)="getName($event.target.value)">
                            <option></option>
                            <option>Key Starting Material</option>
                            <option>Raw Material</option>
                            <option>Solvent</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Material Name<span style="color: red;"></span></label>
                        <select name="material_code" [(ngModel)]="material_code" (change)="getBatches($event.target.selectedIndex)">
                            <option></option>
                            <option *ngFor="let mat of materials" [value]="mat.material_code">{{mat.material_name}}-{{mat.grade}}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Medicap Lot No:<span style="color: red;"></span></label>
                        <select name="batch_no" [(ngModel)]="batch_no" (change)="getDate($event.target.selectedIndex)">
                            <option></option>
                            <option *ngFor="let bat of selectedData['batches']" [value]="bat.batch_no">{{bat.batch_no}}</option>
                        </select>
                    </div>
                    
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12"  *ngIf="batch_no">
                        <table class="table table-border" *ngIf="batch_no">
                            <tr>
                                <td>Mfg Date:</td>
                                <td>{{selectedDate['mfg_date']}}</td>
                                <td>Exp Date:</td>
                                <td>{{selectedDate['exp_date']}}</td>
                            </tr>
                        </table>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-3 clr-col-sm-12 clr-col-xs-12"  *ngIf="batch_no">
                        <label>Qty:<span style="color: red;"></span></label>
                        <input type="text"  name="qty" #qty="ngModel"min="0" maxlength="999999" (keyup)="checkQty()" required>
                        <span style="color: red;" *ngIf="qty.invalid && qty.touched">Please Enter number(6 digit) Only!</span>
                    </div>

                    <div class="clr-col-lg-6 clr-col-md-3 clr-col-sm-12 clr-col-xs-12"  *ngIf="batch_no">
                        <label>Unit:<span style="color: red;"></span></label>
                        <input type="text"  name="unit" #qty="ngModel"min="0" maxlength="999999" required>
                        <span style="color: red;" *ngIf="unit.invalid && unit.touched">Please Enter number(6 digit) Only!</span>

                    </div>
    
                    <div class="clr-col-lg-12 clr-col-md-6 clr-col-sm-12 clr-col-sm-12">
                        <label>Spiilage Incident Reason:<span style="color: red;"></span></label>
                        <textarea  row="2" class="text" name="reason" ngModel required></textarea>
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-sm-12">
                        <label>Type Of Incident:<span style="color: red;"></span></label>
                        <select name="incident_type" ngModel required>
                            <option></option>
                            <option>Major</option>
                            <option>Minor</option>
                            <option>Critical</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Causes Of Incident:<span style="color: red;"></span></label>
                        <textarea rows="2" type="text"  name="incident_cause" ngModel required></textarea>
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Description Of Incident:<span style="color: red;"></span></label>
                        <textarea type="text"  name="description" ngModel required></textarea>
                    </div>
                   
                </div>
            </form>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="saveSpillage(spillageForm)"[disabled]="spillageForm.invalid"
        >{{'common.save' | translate}}</button>
    </div>
</div>
