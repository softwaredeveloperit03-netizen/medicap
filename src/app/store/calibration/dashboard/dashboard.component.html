  <div class="component store-legacy-dash">
    <div class="subsection">
      <div class="purchase-block">
        <div style="text-align:end" class="exit-section">
          <div class="header-block" style="margin:10px 0px">
            <h3>Balance Calibration</h3>
          <div routerLink="/store" class="name-board2"><i class="fas fa-times"></i>
          </div>

        <div class="main-section" style="margin: 0px 10px 10px 10px !important;">
          <div class="category">

              <div class="item-block" routerLink="daily">
                <i class="fas fa-check-circle"></i>

                <span>Monthly Calibration</span>
              </div>
              
              <div class="item-block" routerLink="ooc">
                <i class="fas fa-exclamation-circle"></i>
                <span>Out of Calibration</span>
              </div>

              <div class="item-block" routerLink="equipment">
                <i class="fas fa-clipboard-check"></i>
                <span>Equipment Calibration</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
