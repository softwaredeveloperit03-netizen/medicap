<!-- Common Dashboard Template -->
<!-- 
  Usage: Copy this template and customize:
  1. Replace [DASHBOARD-CONTAINER-CLASS] with your dashboard class (e.g., admin-dashboard-container)
  2. Replace [DASHBOARD-TITLE] with your dashboard title
  3. Replace [DASHBOARD-ICON] with your dashboard icon
  4. Add your header action buttons in header-actions section
  5. Add your analytical/graph section if needed
-->

<div class="[DASHBOARD-CONTAINER-CLASS] dashboard-container-base" 
     [ngStyle]="customBackgroundGradient ? {
       'background-image': customBackgroundGradient, 
       'background-size': '400% 400%', 
       'background-attachment': 'fixed', 
       'background-repeat': 'no-repeat',
       'background-color': selectedBackgroundColor
     } : {}" 
     [class.background-animated]="customBackgroundGradient" 
     [style.--theme-color]="selectedBackgroundColor">
  
  <!-- Floating Color Palette Toggle Button -->
  <button class="color-palette-toggle-floating" (click)="toggleColorPalette()" title="Customize Colors" [class.active]="showColorPalette">
    <i class="fas fa-palette"></i>
  </button>
  
  <!-- Color Palette Floating Bar -->
  <div class="color-palette-bar" [class.active]="showColorPalette">
    <div class="palette-header">
      <span>Choose Theme Color</span>
      <button class="close-palette-btn" (click)="toggleColorPalette()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="palette-colors">
      <div 
        *ngFor="let color of colorPalette" 
        class="color-swatch"
        [style.background-color]="color"
        [class.active]="selectedBackgroundColor === color"
        (click)="selectBackgroundColor(color)"
        [title]="color">
      </div>
    </div>
  </div>

  <!-- Header Section -->
  <div class="dashboard-header">
    <div class="header-content">
      <h1 class="dashboard-title">
        <i class="[DASHBOARD-ICON]"></i>
        [DASHBOARD-TITLE]
      </h1>
      <button routerLink="/" class="close-btn" title="Close Dashboard">
        <i class="fas fa-times"></i>
      </button>
    </div>
    
    <!-- Quick Action Buttons - Customize per dashboard -->
    <div class="header-actions">
      <!-- Add your action buttons here -->
    </div>
  </div>

  <!-- Search and Category Filter -->
  <div class="dashboard-controls">
    <div class="search-category-wrapper">
      <div class="search-box-wrapper">
        <i class="fas fa-search search-icon"></i>
        <input 
          type="text" 
          class="dashboard-search-input"
          placeholder="Search modules..."
          [(ngModel)]="searchQuery"
          (input)="onSearchInput($event)"
          autocomplete="off"
          maxlength="100"
          aria-label="Search dashboard modules">
      </div>
      <div class="category-filter-container">
        <button 
          *ngFor="let category of getCategories()"
          class="category-btn"
          [class.active]="selectedCategory === category"
          [style.--theme-color]="selectedBackgroundColor"
          (click)="filterByCategory(category)">
          <i [class]="getCategoryIcon(category)"></i>
          <span>{{category}}</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Main Dashboard Content -->
  <div class="dashboard-content">
    <div class="dashboard-grid">
      <div 
        *ngFor="let item of filteredItems" 
        class="dashboard-card"
        [ngClass]="getCardClass(item.category)"
        [style.--theme-color]="selectedBackgroundColor"
        [routerLink]="item.route"
        [title]="item.name">
        <div class="card-icon-wrapper">
          <i [class]="item.icon" [style.color]="item.color"></i>
        </div>
        <div class="card-content">
          <h3 class="card-title">{{item.name}}</h3>
        </div>
        <!-- Pending Task Badge -->
        <div class="pending-badge" *ngIf="getPendingCount(item.id) > 0">
          {{ getPendingCount(item.id) }}
        </div>
      </div>
    </div>
    
    <!-- Empty State -->
    <div class="empty-state" *ngIf="filteredItems.length === 0">
      <div class="empty-icon">
        <i class="fas fa-search"></i>
      </div>
      <p>No modules found matching your search.</p>
    </div>
  </div>

  <!-- Analytical Avenue Section - Add if needed -->
  <!--
  <div class="analytical-avenue-section">
    <div class="section-header">
      <h2 class="section-title">
        <i class="fas fa-chart-bar"></i>
        Analytical Avenue
      </h2>
    </div>
    <!-- Add your graphs/charts here -->
  </div>
  -->
</div>
