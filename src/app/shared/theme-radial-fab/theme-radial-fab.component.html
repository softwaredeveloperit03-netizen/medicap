<div class="theme-radial" [class.open]="isOpen">
  <div class="theme-radial__backdrop" *ngIf="isOpen" (click)="close()"></div>

  <div class="theme-radial__arc">
    <button
      type="button"
      class="theme-radial__swatch"
      *ngFor="let theme of themes; let i = index"
      [class.active]="theme.id === activeThemeId"
      [class.visible]="isOpen"
      [style.--angle]="swatchAngle(i)"
      [style.--i]="i"
      [style.background]="theme.swatch"
      [attr.aria-label]="theme.name"
      [attr.title]="theme.name"
      [attr.tabindex]="isOpen ? 0 : -1"
      (click)="selectTheme(theme, $event)"
    ></button>
  </div>

  <button
    type="button"
    class="theme-radial__fab"
    (click)="toggle()"
    [attr.aria-expanded]="isOpen"
    aria-label="Theme colours"
    title="Theme"
  >
    <i class="fas fa-palette" aria-hidden="true"></i>
  </button>
</div>
