<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-lg-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Add Product Value</div>
        <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" style="color: aliceblue; background-color: green;" routerLink="new" *ngIf="isuser == 'Yes'">{{'common.new' | translate}}</button>
          <button class="btn btn-sm btn-danger" routerLink="/dispatch">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">  
      <div class="card-text">
        <div class="clr-row">
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Type:</label>
            <select name="type" [(ngModel)]="type" required (change)="filterEquipment()">
              <option></option>
              <option>Product Wise</option>
              <option>Value</option>
            </select>
          </div>
          <div *ngIf="type=='Product Wise'" class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Product Type:</label>
            <select name="product_type" [(ngModel)]="product_type" required (change)="filterEquipment()">
              <option></option>
              <option>API</option>
              <option>Intermediate</option>
            </select>
          </div>
          <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12" style="margin-top: 6px;">
            <label>&nbsp;</label><br>
            <button class="btn btn-danger" (click)="clear()">Clear Filters</button>
        </div>
    </div>
    <div class="clr-row">
        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
          <label>USD Value In INR:</label>
          <input type="text" name="usd_value" [(ngModel)]="usd_value">
        </div>
    </div>
        <table class="table table-border">
          <tr>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr.</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white">Entry Date</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white">Product Type</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white">Product Name</th>
            <!-- <th style="text-align: left; background-color: rgb(14, 67, 112); color: white">Grade</th> -->
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white">Value In INR</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white">Value In USD</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white">Entry By</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.table.action' | translate}}</th>
          </tr>
          <tr *ngFor="let result of results1; let i = index">
            
            <td style="text-align: left;">{{ result.status }}</td>
            <td style="text-align: left;">{{ result.mfg_date  | date: 'dd-MM-yyyy'}}</td>
            <td style="text-align: left;">{{ result.exp_date  | date: 'dd-MM-yyyy'}}</td>
            <td style="text-align: left;" *ngIf="type=='Value'">{{ result.stock_value }}</td>
            <td>
              <button class="btn btn-sm btn-info" (click)="view(i)">{{'common.view' | translate}}</button>
            </td>
          </tr>
          <tr *ngIf="results1?.length == 0">
            <td colspan="12">{{'common.noRecords' | translate}}</td>
          </tr>
        </table>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button>
    </div>
  </div>
