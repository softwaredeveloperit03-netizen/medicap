<div class="container-fluid" >
    <div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/dispatch/add-product-value" style="background-color: red;color: white;">
                CLOSE
            </button>
            </div>
        </div>
      </div>
      <div class="card-block">
          <div class="card-text">
            <form #stageForm="ngForm">
            <div class="clr-row">
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Product Type:</label>
                    <select name="product_type" (change)="getProductsByType($event.target.value)" ngModel>
                      <option></option>
                      <option>API</option>
                      <option>Intermediate</option>
                    </select>
                  </div>
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Product Name:</label>
                    <select name="product_name" (change)="getProductCode($event.target.selectedIndex)" ngModel>
                      <option></option>
                      <option *ngFor="let product of products" value="{{product.product_name}}">{{product.product_name}}</option>
                    </select>
                  </div>
                <div class="clr-col-lg-3">
                    <label>Product Code</label>
                    <input type="text" name="product_code" [(ngModel)]="product_code" readonly>
                </div>
                <div class="clr-col-lg-3">
                    <label>Price Per Kg In INR</label>
                    <input type="text" name="price" [(ngModel)]="price">
                </div>
            </div>
        </form>
            <br>
            <button class="btn btn-primary" (click)="save(stageForm)">{{'common.save' | translate}}</button>
        </div>
      </div>
    </div>
</div>
