<div class="card" *ngIf="isNew">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-lg-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Shift Change Request</div>
        <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-success" (click)="isNew=true">{{'common.new' | translate}}</button>
          <button class="btn btn-sm btn-danger" routerLink="/dispatch">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <clr-datagrid [clrDgLoading]="loading">
            <clr-dg-column>Sr.</clr-dg-column>
            <!-- Additional columns -->
            <clr-dg-column>Data Logger Number</clr-dg-column>
            <clr-dg-column>Number of Channels</clr-dg-column>
            <clr-dg-column>{{'common.table.action' | translate}}</clr-dg-column>
          
            <clr-dg-row *clrDgItems="let user of finalResults; let i = index">
             
              <!-- Additional cells -->
              <clr-dg-cell>{{i+1}}</clr-dg-cell>
              <clr-dg-cell>{{user.dataLoggerNumber}}</clr-dg-cell>
              <clr-dg-cell>{{user.numberOfChannels}}</clr-dg-cell>
              <clr-dg-cell>
              <button class="btn btn-sm btn-info" (click)="deleteData(user.id)">{{'common.delete' | translate}}</button>
            </clr-dg-cell>
            </clr-dg-row>
          </clr-datagrid>
        </div>
    </div>
  </div>
 
  <div class="container-fluid" *ngIf="!isNew">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Data Logger </div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" style="background-color: red;color: white;" routerLink="/dispatch/data-logger-master" >
              CLOSE
            </button>
          </div>
        </div>
      </div>
      <form #dataLoggerForm="ngForm" >
        <div class="card-block">
          <div class="card-text">
            <div class="clr-row">
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label for="dataLoggerNumber">Data Logger Number</label>
                <input type="text" id="dataLoggerNumber" name="dataLoggerNumber" ngModel required />
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label for="numberOfChannels">Number of Channels</label>
                <input type="number" id="numberOfChannels" name="numberOfChannels" ngModel required />
              </div>
            </div>
          </div>
        </div>
        <div class="card-footer">
          <button class="btn btn-success" (click)="save(dataLoggerForm)">{{'common.save' | translate}}</button>
          <button class="btn btn-danger" routerLink="/dispatch/data-logger-master">{{'common.close' | translate}}</button>
        </div>
      </form>
    </div>
  </div>
