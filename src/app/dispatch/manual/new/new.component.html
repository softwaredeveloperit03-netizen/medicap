<div class="container-fluid" >
    <div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New FG Stock Book</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/dispatch/manual" style="background-color: red;color: white;">
                CLOSE
            </button>
            </div>
        </div>
      </div>
      <div class="card-block">
          <div class="card-text">
            <form #Form="ngForm">
            <div class="clr-row">
                <div class="clr-col-lg-3">
                    <label>Stock Type</label>
                    <select name="stock_type" [(ngModel)]="stock_type">
                        <option></option>
                        <option>Production</option>
                        <option>Opening</option>
                    </select>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Market Type:</label>
                    <select name="market_type" ngModel>
                      <option></option>
                      <option>Domestic</option>
                      <option>Export</option>
                    </select>
                  </div>
                <!-- <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Product Type:</label>
                    <select name="product_type" [(ngModel)]="product_type" required (change)="getProductsByDosage($event.target.value)">
                        <option>API</option>
                        <option>Intermediate</option>
                        <option>Generic/Antihelmentics</option>
                        <option *ngFor="let product of dossage" >{{ product.dosage_form }}</option>
                    </select>
                  </div>
                  <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Name of product:</label>
                    <select name="product_code" [(ngModel)]="product_code" required>
                      <option></option>
                      <option *ngFor="let product of products" value="{{product.product_code}}">{{ product.product_name }}-{{ product.grade }}</option>
                    </select>
                  </div>
                <div class="clr-col-lg-3">
                    <label>Product Code</label>
                    <input type="text" name="product_code" [(ngModel)]="product_code" readonly>
                </div> -->
                <div class="clr-col-lg-3">
                    
                    <label>Nature Of Dose:<span style="color: red">*</span></label>
                    <select name="dosage_type" [(ngModel)]="dosage_type" required
                        (change)="getFGMaterials(dosage_type)">
                        <option></option>
                        <option>SOLID</option>
                        <option>LIQUID</option>
                        <option>SEMI SOLID</option>
                        <option>Gases</option>
                    </select>
                </div>
                <div class="clr-col-lg-3">
                <label>Product Type:<span style="color: red">*</span></label>
                <select name="dosage_form" [(ngModel)]="dosage_form" required
                    (change)="getProductsByDosageForm(dosage_form)">
                    <option></option>
                    <option *ngFor="let type of fg_sub_materials">{{type.dosage_form}}</option>
                </select>
            </div>
            <!-- <div class="clr-col-lg-3">
                <label>Product Type:</label>
                <select name="product_type" (change)="getProductsByType($event.target.value)" ngModel>
                    <option></option>
                    <option>API</option>
                    <option>Intermediate</option>
                </select>
            </div> -->
                <div class="clr-col-lg-3">
                    <label>Product Name:</label>
                    <select name="product_name" (change)="getProductCode($event.target.selectedIndex)"
                        ngModel>
                        <option></option>
                        <option *ngFor="let product of products" value="{{product.product_name}}">
                            {{product.product_name}}</option>
                    </select>
                </div>
                <div class="clr-col-lg-3">
                    <label>Product Code</label>
                    <input type="text" name="product_code" [(ngModel)]="product_code" readonly>
                </div>
                <div class="clr-col-lg-3">
                    <label>Medicap lot no</label>
                    <input type="text" name="ar_no" [(ngModel)]="ar_no">
                </div>
                <div class="clr-col-lg-3">
                    <label>Release Date</label>
                    <input type="date" name="rel_date" [(ngModel)]="rel_date">
                </div>
                <div class="clr-col-lg-3">
                    <label>Medicap Lot No</label>
                    <input type="text" name="batch_no" [(ngModel)]="batch_no">
                </div>
                <div class="clr-col-lg-3">
                    <label>Batch Size :( In Kg )</label>
                    <input type="number" min="0" name="batch_size" [(ngModel)]="batch_size">
                </div>
                <div class="clr-col-lg-3">
                    <label>Batch Yield Qty ( In Kg )</label>
                    <input type="number" min="0" name="yield" [(ngModel)]="yield">
                </div>
                <div class="clr-col-lg-3">
                    <label>Pack Size:(In Kg)</label>
                    <select name="pack_size" [(ngModel)]="pack_size">
                        <option></option>
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                        <option>10</option>
                        <option>15</option>
                        <option>20</option>
                        <option>25</option>
                        <option>30</option>
                        <option>50</option>
                    </select>
                </div>
                <div class="clr-col-lg-3">
                    <label>Total No Of Containers</label>
                    <input type="text" name="total_containers" [(ngModel)]="total_containers">
                </div>
                <div class="clr-col-lg-3">
                    <label>Mfg Date</label>
                    <input type="date" name="mfg_date" [(ngModel)]="mfg_date" [max]="curr_date">
                </div>
                <div class="clr-col-lg-3">
                    <label>Exp Date</label>
                    <input type="date" name="exp_date" [(ngModel)]="exp_date" [min]="curr_date">
                </div>
                <div class="clr-col-lg-3">
                    <label>Entry For:<span style="color: red">*</span></label>
                    <select name="entry_for" [(ngModel)]="entry_for">
                        <option>Own</option>
                        <option>Client</option>
                    </select>
                </div>
                <div class="clr-col-lg-3" *ngIf="entry_for=='Client'">
                    <label>Client Name:<span style="color: red">*</span></label>
                    <input type="text" name="client_name" ngModule>
                    <!-- <select name="client_code" ngModel >
                        <option></option>
                        <option *ngFor="let client of clients" [value]="client.client_code">{{ client.company }}
                        </option>
                    </select> -->
                </div>
            </div>
        </form>
            <br>
            <button class="btn btn-primary" (click)="save(Form)">{{'common.save' | translate}}</button>
        </div>
      </div>
    </div>
</div>
