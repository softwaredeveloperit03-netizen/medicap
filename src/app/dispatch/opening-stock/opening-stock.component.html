<div class="card">
    <div class="card-header">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Opening Stock</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
              <button class="btn btn-sm btn-danger" routerLink="/dispatch">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #requestForm="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Product Name:</label>
                        <select name="product_code" ngModel required>
                            <option></option>
                            <option *ngFor="let product of products" [value]="product.product_code">{{ product.product_name }} {{ product.grade }}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                        <label>Medicap Lot No:</label>
                        <input type="text" name="batch_no" ngModel required>
                    </div>
                    <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                        <label>Medicap lot no:</label>
                        <input type="text" name="ar_no" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Qty & Pack Size:<br></label>
                        <input type="text" name="qty" ngModel required style="width: 33%;">
                        <input type="text" name="pack_size" ngModel required style="width: 33%;" placeholder="Pack Size">
                        <select name="pack_size_unit" ngModel required style="width: 34%;">
                            <option></option>
                            <option *ngFor="let ven of units">{{ ven.unit }}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                        <label>Containers:<br></label>
                        <input type="text" name="total_containers" ngModel="{{ requestForm.value.qty / requestForm.value.pack_size }}" required style="width: 50%;" readonly tabindex="-1">
                        <select name="container_type" ngModel="Drum" required style="width: 50%;">
                            <option>Drum</option>
                            <option>Bag</option>
                            <option>Boxes</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Mfg. Date:</label>
                        <input type="date" name="mfg_date" ngModel required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Exp. Date:</label>
                        <input type="date" name="exp_date" ngModel required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Relese Date:</label>
                        <input type="date" name="rel_date" ngModel required>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="saveOpeningStock(requestForm)">{{'common.save' | translate}}</button>
    </div>
</div>
