<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">PART-I : INITIATION OF DEVIATION</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm btn-danger" routerLink="/pdeviaton">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
    <div class="card-block" style="margin-top: 1%;">
        <div class="card-text">
            <form #deviation="ngForm">
                <div class="clr-row">
                    <div class="clr-col-12">
                        <table class="table table-border">
                             <tr>
                                 
                                <td style="text-align: left;font-weight: bolder;">Change Control No</td>
                                <td style="text-align: center;margin: 0;padding: 20px;font-size: large;font-weight: bolder;">
                                   Auto Generate
                                </td>
                                <td style="text-align: left;font-weight: bolder;">Log ln by QA (Slgn/Date)</td>
                                <td style="text-align: left;margin: 0;padding: 0;">
                               <input type="date"  name="initiateDate" [(ngModel)]="initiateDate"     >
                                </td>
                            </tr>
                                <tr>
                                <td style="text-align: left;font-weight: bolder;">Initiating Department.</td>
                                <td style="text-align: left;margin: 0;padding: 0;" colspan="3"> 
                                    <input type="text" name="initiateDepartment" [(ngModel)]="department_name" readonly>

                                </td>
                                 
                            </tr>
                                          <tr>
                                <td colspan="4" style="text-align: left;">
                                    <b>Change Related To</b><br>
                                    <div
                                    style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 8px;"
                                    >
                                    <label *ngFor="let dept of ChangeRetaedto" style="display: flex; align-items: center; gap: 5px;">
                                        <input type="checkbox" [checked]="dept.valuen" (change)="onchangeSelect(dept, $event)" />
                                        {{ dept.name }}
                                    </label>
                                    </div>
                                </td>
                                </tr>

                               
                            

                            
                        </table>
                        <div></div>
                        <table class="table table-border">
                            <tr>
                                <td style="text-align: left;font-weight: bolder;width:30%" >
                                    1.Type of Deviation<br>
                                </td>
                                <td style="text-align: left;font-weight: bolder;width:70%">
                                    <label style="margin-right: 15px;">
                                        <input type="checkbox" name="isMajor" [(ngModel)]="isMajor"> Major
                                    </label>
                                    <label>
                                        <input type="checkbox" name="isMinor" [(ngModel)]="isMinor"> Minor
                                    </label>
                                </td>
                               
                            </tr>
                            <tr>
                                <td style="text-align: left;font-weight: bolder;" colspan="2">2.Actual Process<br>
                                <textarea name="actualProcedure" [(ngModel)]="actualProcedure" rows="5" style="width:100%" required></textarea>
                                </td>
                               
                            </tr>
                            <tr>
                                <td style="text-align: left;font-weight: bolder;" colspan="2">3.Deviation Observed<br>
                                <textarea name="deviationObserved" [(ngModel)]="deviationObserved" rows="5" style="width:100%" required></textarea>
                                </td>
                               
                            </tr>
                         
                            <tr>
                                <td  style="width: 70%; text-align: left;"> <b> 4.Root Cause, if Observed</b> <br>
                                    <textarea name="rootCauses" [(ngModel)]="rootCauses"  rows="5"  required ></textarea>
                                </td> 
                                <td  style="width: 30%; text-align: left;"> 
                                    <input type="file" name="rootCauseFile" (change)="onFileChanged($event)"   [(ngModel)]="rootCauseFile">
                                </td> 
                            </tr>
                            <tr>
                                <td  colspan="2"  style=" text-align: left;"> <b> 5.Risk Assessment</b><br>
                                    <textarea name="RiskAssessment" [(ngModel)]="RiskAssessment"  rows="5"   ></textarea>
                                </td> 
                                 
                            </tr>
                            <tr>
                                <td  colspan="2"  style=" text-align: left;"> <b> 6.Action Taken/ To Be taken</b><br>
                                    <textarea name="ActionTaken" [(ngModel)]="ActionTaken"  rows="5"   ></textarea>
                                </td> 
                                 
                            </tr>
                        </table>
                     </div>
                </div>
            </form>
        </div>
        <div class="card-block">
            <button   class="btn btn-primary" (click)="saveDeviation(deviation)">{{'common.save' | translate}}</button>
            <button class="btn  btn-danger" routerLink="/qa/qms/deviation">{{'common.close' | translate}}</button>
        </div>


    </div>
</div>
