<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Inward Goods Receiving Log</div>
          <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button *ngIf="isuser == 'Yes'" class="btn btn-sm btn-success" routerLink="new" > New Goods Receiving</button>
            <button class="btn btn-sm btn-danger" routerLink="/microbiology" > {{'common.close' | translate}} </button>
          </div>
        </div>
      </div>
      <div class="card-block">
        <div class="card-text">
  
  
          <div class="clr-row" >
            <div class="clr-col-lg-4 clr-col-sm-4 clr-col-xs-6" >
              <label>Material SubType:<span style="color: red;">*</span></label>
              <select name="material_subtype" [(ngModel)]="material_type" required (change)="getGRNLog()">
                  <option ></option>
                  <option >Cultures</option>
                  <option>Media</option>
                  <option >Consumables</option>

              </select>
          </div>
          </div>
  
  
                         
  
          <table class="table table-border">
            <tr>
              <th>{{'common.table.srNo' | translate}}</th>
              <th>Packaging Slip</th>
              <th style="text-align: left;">Material Name</th>
              <th>Material Code</th>
              <th>Grade</th>
              <th>Receiving no</th>
              <th>View</th>
            </tr>
            <tr *ngFor="let result of results; let i = index">
              <td style="text-align: left;">{{ i+1 }}</td>
              <td style="text-align: left;">{{ result.challan_no }}</td>
              <td style="text-align: left;">{{ result.material_name }}</td>
              <td style="text-align: left;">{{ result.material_code }}</td>
              <td style="text-align: left;">{{ result.grade }}</td>
              <td style="text-align: left;">{{ result.grn_no }}</td>
              <td>
                <button class="btn btn-sm btn-info" (click)="viewResult(i)">{{'common.view' | translate}}</button>
              </td>
            </tr>
            <tr *ngIf="results?.length == 0">
              <td colspan="6">{{'common.noRecords' | translate}}</td>
            </tr>
          </table>
        </div>
      </div>
    </div>
  </div>
