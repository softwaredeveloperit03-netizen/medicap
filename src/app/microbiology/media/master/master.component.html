<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Media Master</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-danger" routerLink="/microbiology/media">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">

        <form #mediaForm="ngForm">
            <div class="clr-row">
              <div class="clr-col-lg-2">
                <label>Media Code:</label>
                <input type="text" name="media_code" ngModel required>
            </div>
                <div class="clr-col-lg-5">
                    <label>Name Of Media:</label>
                    <input type="text" name="media_name" ngModel required>
                </div>
                <div class="clr-col-lg-5">
                    <label>Specification:</label>
                    <input type="text" name="media_specification" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-sm-4 clr-col-xs-6" *ngIf="plant_id=='59'">
                  <label>Upload COA:</label>
                  <input type="file" name="coa" (change)="onFileChanged($event)"  ngModel>
    
                
              </div>
              <div class="clr-col-lg-4 clr-col-sm-4 clr-col-xs-6" *ngIf="plant_id!='59'">
                <label>Upload COA:</label>
                <input type="file" name="coa" (change)="onFileChanged($event)" >
              
            </div>
                <div class="clr-col-lg-2">
                    <button class="btn btn-primary" (click)="save(mediaForm)" style="margin-top: 27px;">{{'common.submit' | translate}}</button>
                </div>
            </div>
        </form>
        <table class="table">
          <tr>
            <th>{{'common.table.srNo' | translate}}</th>
            <th style="text-align: left;">Media Code</th>
            <th style="text-align: left;">Media Name</th>
            <th style="text-align: left;">Media Specification</th>
            <th style="text-align: center;">View</th>
            
          </tr>
          <tr *ngFor="let standard of standards; let i = index">
            <td>{{ i+1 }}.</td>
            <td style="text-align: left;">{{ standard.media_code }}</td>
            <td style="text-align: left;">{{ standard.media_name }}</td>
            <td style="text-align: left;">{{ standard.media_specification }}</td>
            <td>
              <button class="btn btn-sm" (click)="openlic(standard['coa'])">VIEW FILE</button>
          </td>

           
          </tr>
        </table>
      </div>
    </div>
    <div class="card-footer">  
        <button class="btn  btn-primary" (click)="download()">{{'common.download' | translate}}</button>
    </div>
  </div>
