<div class="container-fluid">
    <div class="card">
        <div class="card-header">
            <div class="clr-row" style="margin-bottom: -10px;">
                <div class="clr-col-6" style="color: aliceblue;margin-top: -2px;text-align: left;">ENVIRONMENT ISOLATES LIBRARY</div>
                <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                  <button class="btn btn-sm" routerLink="/microbiology" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                  </button>
                </div>
            </div>
        </div>
        <div class="card-block">
            <div class="card-text">
              <div class="card-text">
                <form #formData="ngForm">
                    <table class="table table-border">
                        <tr>
                            <th style="text-align:center">Sr</th>
                            <th style="text-align:center">Source of Isolates</th>
                            <th style="text-align:center">Name of Organism</th>
                            <th style="text-align:center">{{'common.table.action' | translate}}</th>                           
                        </tr>
                        <tr>
                           <td style="padding: 0px;">0.</td>
                           <td style="text-align: left;padding: 0px"><input type="text" name="isolates" ngModel required style="margin: 0px;"></td>
                           <td style="text-align: left;padding: 0px"><input type="text" name="organism" ngModel required style="margin: 0px;"></td>
                           <td style="padding: 0px"><button class="btn btn-sm btn-info"(click)="save(formData)" style="margin: 0px;">{{'common.save' | translate}}</button></td>
                        </tr>
                        <tr *ngFor="let result of results;let i=index">
                            <td>{{i+1}}</td>
                            <td>{{result.isolates}}</td>
                            <td>{{result.organism}}</td>
                            <td>#</td>
                        </tr>
                        <tr *ngIf="results?.length==0">
                            <td colspan="15"><strong>No Record Found!</strong></td>
                        </tr>
                    </table>
                </form>
              </div>
            </div>
         </div>
         <div class="card-footer">
            <button class="btn btn-primary"(click)="download()">{{'common.download' | translate}}</button>
         </div>
    </div>
</div>
