<div class="card">
    <div class="card-header">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-6" style="color: aliceblue;margin-top: -2px;text-align: left;">OPERATION & CLEANING OF AUTOCLAVE</div>
            <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
              <button class="btn btn-sm btn-danger" routerLink="/microbiology/autocleave">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #lab="ngForm">
                <div class="clr-row">
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3">
                      <label>Procedure Type:</label>
                      <select name="procedure_type" ngModel required>
                          <option>Sterilization</option>
                          <option>Destruction / Decontamination</option>
                      </select>
                  </div>
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3">
                      <label>Select From:</label>
                      <select name="select_from" ngModel required>
                          <option>Media</option>
                          <option>Glassware & Other</option>
                      </select>
                  </div>
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3">
                      <label>Autoclave ID:</label>
                      <select name="autoclave_id" ngModel  >
                          <option></option>
                          <option *ngFor="let equipment of equipments">{{ equipment.equipment_name }}</option>
                      </select>
                  </div>
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3">
                      <label>Name of Media / Material:</label>
                      <select name="media_code" ngModel required>
                        <option *ngFor="let media of medias" [value]="media.media_code">{{media.media_name}}</option>
                    </select>
                  </div>
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3">
                      <label>Lot No. of Media:</label>
                      <input type="text" name="lot_no" ngModel required>
                  </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3">
                      <label>Autoclave Cycle No:</label>
                      <input type="text" name="cycle_no" ngModel required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3">
                        <label>Cycle started at:</label>
                        <input type="time" name="cycle_start" ngModel required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3">
                        <label>121°C Achieved time:</label>
                        <input type="text" name="achieved_time" ngModel required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3">
                        <label>Chamber Steam Pressure (1.5 lbs.):</label>
                        <input type="text" name="steam_pressure" ngModel required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3">
                        <label>Cycle End Time:</label>
                        <input type="time" name="cycle_end" ngModel required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3">
                        <label>Hold Time (Minutes):</label>
                        <input type="time" name="hold_time" ngModel required  >
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3">
                        <label>Chemical Indicator:</label>
                        <input type="text" name="indicator" ngModel required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3">
                        <label>Cleaning start time:</label>
                        <input type="time" name="cleaning_start_time" ngModel required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3">
                        <label>Cleaning end time:</label>
                        <input type="time" name="cleaning_end_time" ngModel required>
                    </div>
                    <!-- <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3">
                      <label>Done by:</label>
                      <select name="done_by" ngModel required>
                          <option>Master</option>
                      </select>
                  </div> -->
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3">
                        <label>Remarks:</label>
                        <input type="text" name="remark" ngModel >
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="card-footer">
    <button type="button" class="btn btn-primary" (click)="save(lab)">{{'common.save' | translate}}</button>
    </div>
</div>
