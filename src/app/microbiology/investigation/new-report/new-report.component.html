<div class="container-fluid">
    <div class="card">
        <div class="card-header">
            <div class="clr-row" style="margin-bottom: -10px;">
                <div class="clr-col-6" style="color: aliceblue;margin-top: -2px;text-align: left;">New INVESTIGATION
                    Report</div>
                <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                    <button class="btn btn-sm" routerLink="/microbiology/investigation/report" style="background-color: red;color: white;">
                        <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                    </button>
                </div>
            </div>
        </div>
        <div class="card-block">
            <div class="card-text">
                <form #formData="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                            <label>Initiation Date</label>
                            <input type="date" name="initiation_date" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                            <label>Investigation Report No</label>
                            <input type="text" name="investigation_reportno" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                            <label>Type of Investigation:</label>
                            <select name="investigation_type" ngModel required>
                                <option>High</option>
                                <option>Medium</option>
                                <option>Low</option>
                                <option>Other</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                            <label>Type of sample:</label>
                            <p-multiSelect [options]="sample" name="sample_type" [(ngModel)]="sample_type"
                                optionLabel="name" required></p-multiSelect>
                        </div>
                    </div>
                    <h4>SAMPLE DESCRIPTION:</h4>
                    <div class="clr-row">
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                            <label>Sampling Date</label>
                            <input type="date" name="sample_date" ngModel required style="margin: 0px;">
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                            <label>Sampling Point/location ID</label>
                            <input type="text" name="sampling_point" ngModel required style="margin: 0px;">
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                            <label>Name of Area</label>
                            <input type="text" name="area" ngModel required style="margin: 0px;">
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                            <label>Grade/class</label>
                            <select name="grade" ngModel required style="margin: 0px;">
                                <option></option>
                                <option *ngFor="let g of grades">{{g.grade}}</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                            <label>Type of Water</label>
                            <select name="water_type" ngModel required style="margin: 0px;">
                                <option>Purified water</option>
                                <option>Raw water</option>
                                <option>RO water</option>
                                <option>Potable water</option>
                                <option>Boiled feed water</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                            <label>Medicap Lot No</label>
                            <input type="text" name="ar_no" ngModel required style="margin: 0px;">
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                            <label>Standard limit </label>
                            <input type="text" name="standard_limit" ngModel required style="margin: 0px;">
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                            <label>Alert limit </label>
                            <input type="text" name="alter_limit" ngModel required style="margin: 0px;">
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                            <label>Action limit</label>
                            <input type="text" name="action_limit" ngModel required style="margin: 0px;">
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                            <label>Result</label>
                            <input type="text" name="result" ngModel required style="margin: 0px;">
                        </div>
                    </div>
                    <h4>Product / Material Details :</h4>
                    <div class="clr-row">
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                            <label>Product/Material Details:<span style="color:red;">*</span></label>
                            <select name="product_details" [(ngModel)]="details" required>
                                <option>Product</option>
                                <option>Material</option>
                            </select>
                        </div>

                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="details == 'Product'">
                            <label>Product Type:<span style="color:red;">*</span></label>
                            <select name="product_type" [(ngModel)]="product_type" required
                                (change)="getProductsByDosage($event.target.value)">
                                <option value="API">API</option>
                                <option value="Intermediate">Intermediate</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-5 clr-col-md-5 clr-col-sm-12 clr-col-xs-12" *ngIf="details == 'Product'">
                            <label>Product Name:<span style="color:red;">*</span></label>
                            <select name="product_code" ngModel required>
                                <option></option>
                                <option *ngFor="let product of products; let i = index" [value]="product.product_code">
                                    {{ product.product_name }}</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" style="padding-right: 0px;"
                            *ngIf="details == 'Material'">
                            <label>Material Type:</label>
                            <select name="product_type" (change)="getApprovedRawMaterials($event.target.value)"
                                ngModel>
                                <option></option>
                                <option>Key Starting Material</option>
                                <option>Raw Material</option>
                                <option>Liquid</option>
                                <option>Solvents</option>
                                <option>Others</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-5 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" style="padding-right: 0px;"
                            *ngIf="details == 'Material'">
                            <label>Material Name:</label>
                            <select name="material_code" (change)="getSelectedMaterial($event.target.selectedIndex)"
                                ngModel>
                                <option></option>
                                <option *ngFor="let material of materials;" [value]="material.material_code">{{
                                    material.material_name }} - {{ material.grade }}</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                            <label>Product Batch No. / A.R No.</label>
                            <input type="text" name="batch_no" ngModel required style="margin: 0px;">
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                            <label>Date of Mfg.</label>
                            <input type="date" name="mfg_date" ngModel required style="margin: 0px;">
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                            <label>Investigation Starting Date</label>
                            <input type="date" name="in_startdate" ngModel required style="margin: 0px;">
                        </div>
                        <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                            <label>Additional Description Information</label>
                            <textarea type="text" rows="2" name="description" ngModel required
                                style="margin: 0px;"> </textarea>
                        </div>
                    </div>
                    <h4>IMPACT ASSESSMENT : </h4>
                    <div class="clr-row">
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                            <label>Batch Number</label>
                            <input type="text" name="ass_batch_no" ngModel required style="margin: 0px;">
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                            <label>Item Code</label>
                            <input type="text" name="ass_item_code" ngModel required style="margin: 0px;">
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                            <label>Raw Material:<span style="color:red;">*</span></label>
                            <select name="ass_material" ngModel  required>
                                <option>Acceptable</option>
                                <option>Unacceptable</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                            <label>Event Occurred Previously:<span style="color:red;">*</span></label>
                            <select name="ass_event" ngModel  required>
                                <option>Yes</option>
                                <option>No</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                            <label>This Event Has Impact On The Quality Of The Product:<span style="color:red;">*</span></label>
                            <select name="ass_product" ngModel  required>
                                <option>Yes</option>
                                <option>No</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                            <label>Classification of Investigation:<span style="color:red;">*</span></label>
                            <select name="classification" ngModel  required>
                                <option>Low</option>
                                <option>Medium</option>
                                <option>High</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                            <label>Regulatory Impact Assessment Required:<span style="color:red;">*</span></label>
                            <select name="regular_impact" ngModel  required>
                                <option>Yes</option>
                                <option>No</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-12">
                            <label>External Partner Impact Assessment Required:<span style="color:red;">*</span></label>
                            <select name="ext_impact" ngModel  required>
                                <option>Yes</option>
                                <option>No</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                            <label>Impact Assessment:</label>
                            <textarea type="text" rows="2" name="impact_ass" ngModel required style="margin: 0px;"> </textarea>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="card-footer"><button class="btn btn-primary" (click)="saveReport(formData)">{{'common.save' | translate}}</button></div>
    </div>
</div>
