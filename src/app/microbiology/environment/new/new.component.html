<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Environment Monitoring</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-danger" routerLink="/microbiology/environment">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #environmentForm="ngForm">
          <div class="clr-row">

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Sampling Date:<span style="color: red">*</span></label>
              <input type="date" name="sampling_date" ngModel>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Medium Used:<span style="color: red">*</span></label>
              <input type="text" name="medium_used" ngModel>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" >
              <label>Media Lot No:<span style="color: red">*</span></label>
              <input type="text" name="media_no" ngModel>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Incubation Temperature:<span style="color: red">*</span></label>
              <input type="text" name="incubation_temp" ngModel>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Incubator Id:<span style="color: red">*</span></label>
              <input type="text" name="incubation_id" ngModel>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Incubator Start:<span style="color: red">*</span></label>
              <input type="text" name="incubation_start" ngModel>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label> Start Time:<span style="color: red">*</span></label>
              <input type="text" name="start_time" ngModel>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Incubator End:<span style="color: red">*</span></label>
              <input type="text" name="incubation_end" ngModel>
            </div>
  
           </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="add(environmentForm)">{{'common.save' | translate}}</button>
    </div>
  </div>
