<div class="card">
    <div class="card-header">
      <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Air Testing Sampling Points</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-danger" routerLink="/microbiology/airtesting">{{'common.close' | translate}}</button>
          </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <div class="clr-row">
          <table class="table table-border">
            <tr>
              <th style="text-align: left;">{{'common.type' | translate}}</th>
              <th style="text-align: left;">Sampling Point</th>
              <th style="text-align: left;">Point No</th>
            </tr>
            <tr *ngFor="let pt of points;let i=index">
              <td style="text-align: left;">{{pt.type}}</td>
              <td style="text-align: left;">{{pt.sampling_point}}</td>
              <td style="text-align: left;">{{pt.point_no}}</td>
            </tr>
          </table>
        </div>
      </div>
    </div>
</div>
