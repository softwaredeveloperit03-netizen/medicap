<div class="container-fluid">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Water Points </div>
              <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/microbiology/water/points" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
              </div>
            </div>
          </div>
        <div class="card-block">
            <div class="card-text">
                <form #waterPoint="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Point Name:</label>
                            <input type="text" name="point_name" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Point no:</label>
                            <input type="text" name="point_no" ngModel required (ngModelChange)="onValueChange($event)">
                            <small *ngIf="flag" class="text-danger" style="color:red">only numbers are allowed</small>

                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Water Type:</label>
                            <select name="water_type" ngModel required>
                                <option>Non-potable water</option>
                                <option>Potable water</option>
                                <option>Water For Injection</option>
                                <option>Sterile water for injection</option>
                                <option>Bacteriostatic Water For Injection</option>
                                <option>Sterile water for Irrigations</option>
                                <option>Purified water</option>
                                <option>Raw water</option>
                                <option> RO water</option>
                                <option>Potable water</option>
                                <option>Boiled feed water</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Frequency:</label>
                            <select name="frequency" [(ngModel)]="frequency" required>
                                <option></option>
                                <option>once in a week</option>
                                <option>everyday</option>
                                <option>once in a month</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12" *ngIf="frequency == 'once in a week'">
                            <label>Day of Week:</label>
                            <select name="day" ngModel required>
                                <option></option>
                                <option>Sunday</option>
                                <option>Monday</option>
                                <option>Tuesday</option>
                                <option>Wednesday</option>
                                <option>Thursday</option>
                                <option>Friday</option> 
                                <option>Saturday</option>        
                            </select>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Testing Type:</label>
                            <p-multiSelect [options]="testings" name="testing_type" ngModel optionLabel="name"></p-multiSelect>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Department:</label>
                            <select name="department" ngModel (change)="getDetails($event.target.selectedIndex)" required>
                                <option></option>
                                <option *ngFor="let result of results; let i = index">{{result.department_name}}</option>       
                            </select>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Room Name:</label>
                            <select name="section" ngModel required>
                                <option></option>
                                <option *ngFor="let result of sections">{{result.section_name}}</option>      
                            </select>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12" *ngIf="frequency == 'once in a month'">
                            <label>Date of Month:</label>
                            <select name="date" ngModel required>
                                <option>1</option>
                                <option>2</option>
                                <option>3</option>
                                <option>4</option>
                                <option>5</option>
                                <option>6</option>
                                <option>7</option>
                                <option>8</option>
                                <option>9</option>
                                <option>10</option>
                                <option>11</option>
                                <option>12</option>
                                <option>13</option>
                                <option>14</option>
                                <option>15</option>
                                <option>16</option>
                                <option>17</option>
                                <option>18</option>
                                <option>19</option>
                                <option>20</option>
                                <option>21</option>
                                <option>22</option>
                                <option>23</option>
                                <option>24</option>
                                <option>25</option>
                                <option>26</option>
                                <option>27</option>
                                <option>28</option>
                                <option>29</option>
                                <option>30</option>
                                <option>31</option>
                            </select>
                        </div>
                    </div>
                </form>    
            </div>
        </div>
       <div class="card-footer">
         <button class="btn btn-primary" [disabled]="flag" (click)="saveData(waterPoint)">{{'common.save' | translate}}</button>
    </div>
</div>
