<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Swab Analysis</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-danger" routerLink="/microbiology/swap">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #swapForm="ngForm">
            <div class="clr-row">

                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <label>Area Name:<span style="color: red">*</span></label>
                  <input type="text" name="area_name" ngModel>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <label>Equipment name / Equipment number:<span style="color: red">*</span></label>
                  <input type="text" name="equipment_name" ngModel>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" >
                  <label>Total bacterial count / plate:<span style="color: red">*</span></label>
                  <input type="text" name="total_plate" ngModel (ngModelChange)="onValueChange($event)">
                  <small *ngIf="flag" class="text-danger" style="color:red">only numbers are allowed</small>

                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <label>Total fungal count / plate:<span style="color: red">*</span></label>
                  <input type="text" name="total_fungal" ngModel (ngModelChange)="onValueChange($event)">
                  <small *ngIf="flag" class="text-danger" style="color:red">only numbers are allowed</small>

                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <label>Checked by:<span style="color: red">*</span></label>
                  <input type="text" name="checked_by" ngModel>
                </div>
      
               </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="add(swapForm)">{{'common.save' | translate}}</button>
    </div>
  </div>
