<ng-container *ngIf="mode === 'header'">
  <th [attr.style]="headerStyle">Gross Bal.</th>
  <th [attr.style]="headerStyle">Booked</th>
  <th [attr.style]="headerStyle">On Hold</th>
  <th [attr.style]="headerStyle">Net Balance</th>
  <th [attr.style]="headerStyle">Pipeline</th>
  <th [attr.style]="headerStyle">Effective Bal.</th>
</ng-container>

<ng-container *ngIf="mode === 'row'">
  <td class="mrp-stock-td">{{ grossQty }}</td>
  <td class="mrp-stock-td" [class.mrp-stock-warn]="hasDeductions">{{ bookedQty }}</td>
  <td class="mrp-stock-td" [class.mrp-stock-warn]="hasDeductions">{{ holdQty }}</td>
  <td class="mrp-stock-td" [ngClass]="netClass">{{ netQty }}</td>
  <td class="mrp-stock-td" [class.mrp-stock-pipeline]="hasPipeline">{{ pipelineQty }}</td>
  <td class="mrp-stock-td" [ngClass]="effectiveClass">{{ effectiveQty }}</td>
</ng-container>
