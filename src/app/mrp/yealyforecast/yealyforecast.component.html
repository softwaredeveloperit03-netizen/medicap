<div class="card" *ngIf="!isView">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Proceed For Material Planning</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
           
 
            <button class="btn btn-sm" routerLink="/mrp/forecast" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div> 
      </div>
    <div class="card-block">
        <div class="card-text">
        
<div style="overflow-x: auto;">
  <table class="table table-bordered" style=" min-width: 1800px; width: 100%;">
    <thead>
      <tr>
        <th style="width: 80px; font-weight: bold; text-align:left; background-color: rgb(9, 243, 212);">Sr. No.</th>
        <th style="width: 200px; font-weight: bold; text-align:left; background-color: rgb(9, 243, 212);">Product Name</th>
        <th style="width: 150px; font-weight: bold; text-align:left; background-color: rgb(9, 243, 212);">Product Code</th>
        <th style="width: 120px; font-weight: bold; text-align:left; background-color: rgb(9, 243, 212);">Total Qty</th>

        <!-- Month headers -->
        <th *ngFor="let m of months" 
            style="width: 100px; font-weight: bold; text-align:center; background-color: rgb(9, 243, 212);">
          {{ m }}
        </th>

        <th style="width: 120px; font-weight: bold; text-align:left; background-color: rgb(9, 243, 212);">Remaining Qty</th>
      </tr>
    </thead>
    <tbody>
          <tr *ngFor="let pending of results; let i = index">
        <td style="width: 80px;text-align:left;font-weight:bold;">{{ i + 1 }}</td>
        <td style="width: 200px;text-align:left;font-weight:bold;">{{ pending.product_name }}</td>
        <td style="width: 150px;text-align:left;font-weight:bold;">{{ pending.product_code }}</td>
        <td style="width: 120px;text-align:left;font-weight:bold;">{{ pending.order_qty }}</td>

        <!-- Month inputs -->
         <td *ngFor="let m of months; let j = index">
          <input type="number" class="form-control"
                 [(ngModel)]="pending[m.toLowerCase()]"
                 (ngModelChange)="updateMonthQty(pending, m.toLowerCase())"
                 [disabled]="j < currentMonthIndex"
                 min="0" />
        </td>

        <!-- Remaining Qty -->
        <td style="text-align:left;font-weight:bold;width: 120px;">{{ pending.remainingQty }}</td>
      </tr>
      <!-- <tr *ngFor="let pending of results; let i = index">
        <td style="width: 80px;text-align:left;font-weight: bold;">{{ i + 1 }}</td>
        <td style="width: 200px;text-align:left;font-weight: bold;">{{ pending.product_name }}</td>
        <td style="width: 150px;text-align:left;font-weight: bold;">{{ pending.product_code }}</td>
        <td style="width: 120px;text-align:left;font-weight: bold;">{{ pending.order_qty }}</td>

        
        <td *ngFor="let m of months; let j = index" style="width: 100px;text-align:center;">
          <input type="text" class="form-control"
                 [(ngModel)]="pending.monthlyQty[j]"
                 (ngModelChange)="updateRemaining(pending)"
                 min="0"
                  [disabled]="j < currentMonthIndex" />
        </td>

         
        <td style="width: 120px;text-align:left;font-weight: bold;">{{ pending.remainingQty }}</td>
      </tr> -->
    </tbody>
  </table>

  <!-- <button class="btn btn-primary mt-2" (click)="proceed()">Proceed</button> -->
</div>


 
        </div>
    </div>

        <button class="btn btn-success" (click)="Save()">{{'common.save' | translate}}</button>
     </div> -->
</div>
