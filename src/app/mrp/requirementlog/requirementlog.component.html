    <div class="card"  >
                <div class="card-header" style="text-align: center">
              <div class="clr-row" style="margin-bottom: -10px;">
                  <div class="clr-col-lg-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Shartage Analyasis Log</div>
                  <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/mrp/New" style="background-color: red;color: white;">
               Shartage Analyasis
            </button>
            <button class="btn btn-sm" routerLink="/mrp" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
            
                  </div>
              </div>
                      <div class="datagrid-wrapper">

                  <clr-datagrid [(clrDgSelected)]="selectedItems" >

                    <clr-dg-column style="color: black;width: 10px;">Sr. No.</clr-dg-column>
                     <clr-dg-column style="color: black;">Material Name</clr-dg-column>
                     <clr-dg-column style="color: black;">Material Code</clr-dg-column>
                    <clr-dg-column style="color: black;">Ordered Qty</clr-dg-column>
                    <clr-dg-column style="color: black;">Month</clr-dg-column>
                    <clr-dg-column style="color: black;">Analyasis By</clr-dg-column>
                    <clr-dg-column style="color: black;">Analyasis On</clr-dg-column>
                 

                     <clr-dg-row *ngFor='let pending of bookedQtys;let i=index'>
                      <clr-dg-cell style="color: black;text-align:left;font-weight: bold;">{{i + 1}}</clr-dg-cell>
                
                   
                    <clr-dg-cell style="color: black;text-align:left;font-weight: bold;">{{pending.material_name}}  </clr-dg-cell>
                    <clr-dg-cell style="color: black;text-align:left;font-weight: bold;"> {{pending.material_code}} </clr-dg-cell>
                    <clr-dg-cell style="color: black;text-align:left;font-weight: bold;">{{pending.ordered_qty}} </clr-dg-cell>
                    <clr-dg-cell style="color: black;text-align:left;font-weight: bold;">{{pending.month}}-{{pending.year}}</clr-dg-cell>
                    <clr-dg-cell style="color: black;text-align:left;font-weight: bold;">{{pending.entry_by}} </clr-dg-cell>
                    <clr-dg-cell style="color: black;text-align:left;font-weight: bold;">{{pending.entry_date}} </clr-dg-cell>
                     
                </clr-dg-row>


                  </clr-datagrid>


                </div>
             </div>
