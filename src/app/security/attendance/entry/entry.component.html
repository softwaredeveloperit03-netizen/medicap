<div class="card" style="border-color: #004A70">
    <div class="card-header" style="background-color: #004A70;color: white">Employee In Time</div>
    <div class="card-block">
      <div class="card-text">
        <form #EmpInTimeForm="ngForm">
          <div class="clr-row">
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>Employee Id:</label>
              <select name="emp_id" [(ngModel)]="selectedEmpId" (ngModelChange)="getEmpDetails($event)" required>
                <option value=""></option>
                <option *ngFor="let candidate of employees" [value]="candidate.emp_id">{{candidate.emp_id}} {{ candidate.firstname}}</option>
              </select>
            </div>
          </div>
        </form>
        <table class="table table-border">
          <tr>
            <td style="text-align: left; width: 20%;">Department:</td>
            <td style="text-align: left;">{{ selectedEmployee['department'] }}</td>
          </tr>
          <tr>
            <td style="text-align: left; width: 20%;">Position:</td>
            <td style="text-align: left;">{{ selectedEmployee['designation'] }}</td>
          </tr>
        </table>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="saveEmpInTime(EmpInTimeForm)">{{'common.save' | translate}}</button>
      <button class="btn btn-danger" routerLink="/security/attendence">{{'common.close' | translate}}</button>
    </div>
</div>
