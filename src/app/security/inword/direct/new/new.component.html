<div class="card-text">
  <form #test="ngForm">
    <div class="clr-row">
      <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6">
        <label><strong>Inward Type:<span style="color: red">*</span></strong></label>
        <select name="inward_type" [(ngModel)]="inward_type" required>
          <option></option>
          <option>Purchase Material</option>
          <option>Returnable Outwards</option>
        </select>
      </div>
      <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6" *ngIf="inward_type=='Returnable Outwards'">
        <label>OutWord GatePass No:</label>
        <select name="outward_no" ngModel (change)="getgetpassdet($event.target.selectedIndex)">
          <option></option>
          <option *ngFor="let de of gatepassno">{{de.gatepass_no}}</option>
        </select>
      </div>
      <div class="clr-col-lg-4 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="inward_type=='Returnable Outwards'">
        <label>Department:<span style="color: red">*</span></label>
        <select name="department" ngModel="department" required>
          <option *ngFor="let de of departments">{{de.department_name}}</option>
          <option></option>
        </select>
      </div>
      <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6">
        <label><strong>Inward Type:<span style="color: red">*</span></strong></label>
        <select name="inward" [(ngModel)]="inward" required>
          <option></option>
          <option>Own Material</option>
          <option>Customer Material</option>
        </select>
      </div>
      <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6">
        <label><strong>Material Type <span style="color: red">*</span></strong></label>
        <select name="material_type" ngModel required>
          <option></option>
          <option value="General Material">General</option>
          <option value="Raw Material"> Raw Material</option>
          <option value="Packing Material"> Packing Material</option>
          <option value="Chemical">Chemical</option>
        </select>
      </div>
      <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6">
        <label><strong>Material Name <span style="color: red">*</span></strong></label>
        <input type="text" name="material_name" [(ngModel)]="material_name" required maxlength="255">
      </div>
      <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6">
        <label><strong>Packaging Slip<span style="color: red">*</span></strong></label>
        <input type="text" name="challan_no" maxlength="20" ngModel required #challan_no="ngModel">
        <span style="color: red;" *ngIf="challan_no.invalid && challan_no.touched">Please Enter Packaging Slip!</span>
      </div>
      <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6">
        <label><strong>Vendor Name:<span style="color: red">*</span></strong></label>
        <select name="vendor_no" ngModel required (change)="onVendorChange($event.target.value)">
          <option></option>
          <option *ngFor="let ven of vendors" [value]="ven.vendor_no">{{ ven.vendor_name }} - {{ ven.vendor_no }}</option>
        </select>
      </div>
      <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6">
        <label><strong>Po No:</strong></label>
        <input type="text" name="po_no" ngModel>
      </div>
      <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6">
        <label><strong>Packaging Slip Date.<span style="color: red">*</span></strong></label>
        <input type="date" name="challan_date" ngModel required [max]="today">
      </div>
      <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6">
        <label><strong>Tax Invoice No:</strong></label>
        <input type="text" name="tax_invoice" maxlength="20" ngModel #tax_invoice="ngModel">
      </div>
      <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6 clr-col-xs-6">
        <label><strong>Transport:<span style="color: red">*</span></strong></label>
        <select name="transport" [(ngModel)]="transport" required>
          <option>By Courier</option>
          <option>By Rail</option>
          <option>By Air</option>
          <option>By Road</option>
          <option>Inhand</option>
        </select>
      </div>
      <div *ngIf="transport=='By Road'" class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6">
        <label><strong>Transport Company<span style="color: red">*</span></strong> </label>
        <select name="transport_company" [(ngModel)]="transport_company" required>
          <option></option>
          <option *ngFor="let ven of transports" [value]="ven.transport_company">{{ ven.transport_company}}</option>
          <option style="color: red;">Other</option>
        </select>
      </div>
      <div *ngIf="transport=='By Courrier'" class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6">
        <label><strong>Courier Name<span style="color: red">*</span></strong> </label>
        <input type="text" class="form-control" name="courier" ngModel required>
      </div>
      <div *ngIf="transport=='Inhand'" class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6">
        <label><strong>Person Name<span style="color: red">*</span></strong> </label>
        <input type="text" class="form-control" name="person" ngModel required>
      </div>
      <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6" *ngIf="transport_company=='Other'">
        <label><strong>Transport Company Name:</strong></label>
        <input type="text" name="transport_company" ngModel>
      </div>
    </div>
  </form>
  <div style="margin-top: 1rem;">
    <button type="button" class="btn btn-primary" (click)="save(test)" [disabled]="test.invalid">{{'common.save' | translate}}</button>
  </div>
</div>
