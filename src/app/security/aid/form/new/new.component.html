<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">First Aid Form</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/security/aid/form" style="background-color: red;color: white;">
            CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #aidForm="ngForm">
          <div class="clr-row">
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>{{'common.department' | translate}}</label>
                <select name="department" ngModel required>
                  <option value=""></option>
                  <option *ngFor="let depart of departments">{{depart.department_name}}</option>
                 </select>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Name Of First Aider:</label>
                <select name="aider" ngModel required>
                  <option></option>
                 <option *ngFor="let emp of employees">{{emp.firstname}}</option>
                </select>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Name Of Employee:</label>
                <select name="employee" ngModel required>
                  <option></option>
                 <option *ngFor="let emp of employees" [value]="emp.emp_id">{{emp.firstname}}</option>
                </select>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Designation:</label>
                <select name="designation" ngModel required>
                  <option></option>
                 <option *ngFor="let emp of designations">{{emp.designation}}</option>
                </select>
              </div>
              <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Accident/Incident On Job:</label>
                <select name="incident" [(ngModel)]="incident" required>
                  <option></option>
                  <option>Yes</option>
                  <option>No</option>
                </select>
              </div>
              <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Date And Time Of Incident:</label>
                  <input type="datetime-local" name="incident_date" ngModel>
              </div>
              <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Category:</label>
                <select name="category" ngModel required>
                  <option></option>
                  <option>Major</option>
                  <option>Minor</option>
                  <option>Critical</option>
                </select>
              </div>
              <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Location/Area:</label>
                <input type="text" name="location" ngModel>
              </div>
              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label>Details:</label>
               <textarea name="details"  rows="2" ngModel></textarea>
              </div>
              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label>Treatment Given:</label>
               <textarea name="treatment"  rows="2" ngModel></textarea>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Have Person Accepted Treatment:</label>
                <select name="treatment_accept" [(ngModel)]="treatment_accept" required>
                  <option></option>
                  <option>Yes</option>
                  <option>No</option>
                </select>
              </div>
              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12"*ngIf="treatment_accept=='No'">
                <label>Reason:</label>
               <textarea name="reason"  rows="2" ngModel></textarea>
              </div>
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="saveAid(aidForm)">{{'common.submit' | translate}}</button>
    </div>
  </div>
