
<div class="card">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;">First Aid Consumption Record</div>
      <div class="clr-col-lg-5" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        <button class="btn btn-sm" routerLink="update" style="background-color:green;color: white;">
          Update
        </button>
        <button class="btn btn-sm" routerLink="/security/aid" style="background-color: red;color: white;">
          {{'common.close' | translate}} </button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <div class="card-text">
      
      <table class="table">
        <tr>
     
         <th style="text-align: left;">Sr</th>
         <th style="text-align: left;">{{'common.date' | translate}}</th>
         <th style="text-align: left;">Name Of Item</th>
         <th style="text-align: left;">{{'common.department' | translate}}</th>
         <th style="text-align: left;">Available Qty</th>
         <th style="text-align: left;">Consumed Qty</th>
         <th style="text-align: left;">Balanced Qty</th>
        </tr>
        <tr *ngFor="let tool of consumptions; let i=index">
   
       <td style="text-align: left;">{{i+1}}</td> 
       <td style="text-align: left;">{{tool.entry_date | date: 'dd-MM-yyyy'}}</td>  
       <td style="text-align: left;">{{tool.item_name}}</td>  
       <td style="text-align: left;">{{tool.department}}</td> 
       <td style="text-align: left;">{{tool.available_qty}}</td>  
       <td style="text-align: left;">{{tool.consum_qty}}</td> 
       <td style="text-align: left;">{{tool.bal_qty}}</td>  
      </tr>
    </table>
    </div>
  </div>
  <div class="card-footer"><button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button></div>
</div>
