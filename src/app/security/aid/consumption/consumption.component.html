<div class="card" *ngIf="!isView">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;">First Aid Consumption Record</div>
        <div class="clr-col-lg-5" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/security/aid/consumption" style="background-color: red;color: white;">
            Close 
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <div class="clr-row">
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Item Name</label>
            <select name="item_name" ngModel required>
              <option value=""></option>
              <option *ngFor="let tool of results">{{tool.item_name}}</option>
             </select>
          </div>
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>{{'common.department' | translate}}</label>
            <select name="department" ngModel required>
              <option value=""></option>
              <option *ngFor="let tool of results">{{tool.department}}</option>
             </select>
          </div>
          <div class="clr-col-lg-1 clr-col-md-3 clr-col-sm-6 clr-col-xs-6">
            <button class="btn btn-danger" (click)="getAidDetails()" style="margin-top: 30px;">{{'common.search' | translate}}</button>
         </div>
       <table class="table">
        <tr>
          <th style="background-color: rgb(14, 67, 112); color: white;">Sr</th>
          <th style="background-color: rgb(14, 67, 112); color: white;">{{'common.date' | translate}}</th>
          <th style="background-color: rgb(14, 67, 112); color: white;">Name Of Item</th>
          <th style="background-color: rgb(14, 67, 112); color: white;">{{'common.department' | translate}}</th>
          <th style="background-color: rgb(14, 67, 112); color: white;">Available Qty</th>
          <th style="background-color: rgb(14, 67, 112); color: white;">Consumed Qty</th>
          <th style="background-color: rgb(14, 67, 112); color: white;">Balanced Qty</th>
          <!-- <th style="background-color: rgb(14, 67, 112); color: white;">{{'common.table.action' | translate}}</th> -->
        </tr>
        <tr *ngFor="let tool of results;let i=index">
          <td>{{i+1}}</td>
          <td>{{tool.item_name}}</td>
          <td>{{tool.qty}}</td>
          <td>{{tool.indend_qty}}</td>
           <!-- <td>
                <button class="btn btn-sm btn-success-outline btn-icon" (click)="view(i)"><clr-icon shape="eye" class="is-success"></clr-icon></button>
            </td> -->
        </tr>
       </table>
      </div>
      </div>
    </div>
    <div class="card-footer"><button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button></div>
  </div>
