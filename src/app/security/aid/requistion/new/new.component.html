<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;">New First Aid Item Requisition</div>
        <div class="clr-col-lg-5" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/security/aid/requistion" style="background-color: red;color: white;">
            {{'common.close' | translate}} </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
       
        <form #formStock="ngForm">
        <div class="clr-row">
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label> Name Item</label>
            <input type="text" name="item_name" ngModel required>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Quantity Stock</label>
           <input type="text" name="stock_qty" ngModel required>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label> Purchase Requisition Quantity </label>
           <input type="text" name="indend_qty" ngModel required>
          </div>
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
    <button class="btn btn-primary" type="button" (click)="saveStock(formStock)">{{'common.save' | translate}}</button>
    </div>
  </div>
