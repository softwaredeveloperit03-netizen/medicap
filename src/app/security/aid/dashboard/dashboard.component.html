<div class="dashboard-shell" [style.background]="selectedPalette.background">
  <div class="compact-layout">
    <aside class="compact-sidebar">
      <div class="compact-sidebar__head">
        <span class="compact-sidebar__title">{{ dashboardTitle }}</span>
        <span class="compact-sidebar__count">{{ filteredCards.length }}</span>
      </div>
      <nav class="compact-sidebar__tabs" aria-label="Categories">
        <button
          *ngFor="let cat of categories"
          type="button"
          class="chip compact-chip"
          [class.active]="cat === selectedCategory"
          (click)="selectCategory(cat)"
        >
          <i class="fas fa-layer-group" aria-hidden="true"></i>
          <span>{{ cat }}</span>
        </button>
      </nav>
    </aside>

    <div class="compact-main aid-compact-main">
      <div class="dash-header dash-header--single-line">
        <div class="title-block">
          <h2>{{ dashboardTitle }}</h2>
        </div>
        <div class="header-actions-row dept-hub-header-actions">
          <app-floating-docs-popup class="dash-header__docs"></app-floating-docs-popup>
          <div class="search-box dash-header__search">
            <i class="fas fa-search"></i>
            <input
              type="text"
              [ngModel]="searchQuery"
              (ngModelChange)="searchQuery=$event; onSearchChange()"
              placeholder="Search by name or category"
              aria-label="Search modules"
            />
          </div>
          <div class="quick-links">
            <a class="quick-link-btn" routerLink="/qa/qms">QMS</a>
            <a class="quick-link-btn" routerLink="/hrfordepthead" *ngIf="dept_head==='Yes'">Dept Head</a>
            <a class="quick-link-btn" routerLink="/qms/maintenance">Maintenance</a>
          </div>
          <button type="button" class="close-btn dept-hub-header-close" (click)="onCloseDashboard()" aria-label="Close">
            <i class="fas fa-times"></i>
            Close
          </button>
        </div>
      </div>

      <h3 class="section-label">{{ sectionLabel }}</h3>
      <div class="tiles-grid">
        <a
          *ngFor="let card of filteredCards; trackBy: trackByCardId"
          class="tile-card"
          [routerLink]="card.route"
          [ngStyle]="{'box-shadow': selectedPalette.cardShadow}"
        >
          <div class="icon-wrap" [style.background]="card.gradient">
            <i class="fas" [ngClass]="card.icon"></i>
          </div>
          <div class="tile-body">
            <div class="tile-title">{{ card.title }}</div>
            <p class="tile-description" *ngIf="card.description">{{ card.description }}</p>
          </div>
        </a>

        <div class="empty-state" *ngIf="filteredCards.length === 0">
          <i class="fas fa-search"></i>
          <p>No modules match your search. Try another keyword or category.</p>
        </div>
      </div>
    </div>
  </div>

  <button class="palette-fab" type="button" (click)="togglePalette()" title="Change theme" aria-label="Change theme">
    <i class="fas fa-palette"></i>
  </button>

  <div class="palette-drawer" *ngIf="showPalette">
    <button
      *ngFor="let palette of paletteOptions"
      type="button"
      class="palette-chip"
      [class.active]="palette === selectedPalette"
      [style.background]="palette.swatch"
      [title]="palette.name"
      (click)="setPalette(palette)"
      [attr.aria-label]="'Theme ' + palette.name"
    >
      <span class="sr-only">{{ palette.name }}</span>
    </button>
  </div>
</div>
