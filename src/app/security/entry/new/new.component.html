<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Vehicle Entry Form</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/security/entry" style="background-color: red;color: white;">
            CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #vechileForm="ngForm">
          <div class="clr-row">
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Vehicle Type:<span style="color: red">*</span></label>
              <select name="vechile_type" ngModel required>
               <option>Car</option>
               <option>Bike</option>
               <option>Bus</option>
              </select>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Vehicle No<span style="color: red">*</span></label>
              <input type="text" name="vechile_no" ngModel #vechile_no="ngModel" required maxlength="10">
              <span style="color: red;" *ngIf="vechile_no.invalid && vechile_no.touched">Please Enter Vehicle No</span>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Visitors/Employee Name<span style="color: red">*</span></label>
              <input type="text" name="visitor_name" ngModel required #visitor_name="ngModel">
              <span style="color: red;" *ngIf="visitor_name.invalid && visitor_name.touched">Please Enter Character Only</span>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Driver Name<span style="color: red">*</span></label>
              <input type="text" name="driver_name" ngModel required #driver_name="ngModel">
              <span style="color: red;" *ngIf="driver_name.invalid && driver_name.touched">Please Enter Character Only</span>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="saveVechile(vechileForm)">{{'common.submit' | translate}}</button>
    </div>
  </div>
