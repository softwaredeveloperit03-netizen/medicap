<div class="card">
    <div class="card-header">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: center;">Labour Attendance</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-danger" routerLink="/security/labour-entry">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      
      <div class="card-text"  style="overflow-x: scroll;">

        <table class="table">
          <tr>
            <th style="text-align: left;">Sr.</th>
            <th style="text-align: left;">Labour Code</th>
            <th style="text-align: left;">Labour Name</th>
            <th style="text-align: left;">Attendance</th>
          </tr>
          <tr *ngFor="let labour1 of todaysLabours; let i = index">
            <td style="text-align: left;">{{ i+1 }}</td>
            <td style="text-align: left;">{{labour1.labour_no }}</td>
            <td style="text-align: left;">{{labour1.labour_name }}</td> 
          <td style="text-align: left;">
               <button class="btn btn-primary" (click)="labourEntry(labour1.labour_no ,'A')"  *ngIf="!isPresent">Present </button>
               <button class="btn btn-primary" (click)="addEntryRecord(labour1.labour_no)"  *ngIf="!isPresent">Manual Entry </button>
               <button class="btn btn-danger" (click)="labourEntry(labour1.labour_no ,'A')" *ngIf="!isAbsent">Absent</button>
          </td>
          </tr>
          <tr *ngIf="results?.length == 0">
            <td colspan="7">{{'common.noRecords' | translate}}</td>
          </tr>
        </table>

      </div>
    </div>
  </div>

  <div class="modal" *ngIf="isEntry">
    <div class="modal-dialog" role="dialog" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <button aria-label="Close" class="close" type="button">
                    <clr-icon aria-hidden="true" shape="close"></clr-icon>
                </button>
                <h3 class="modal-title">Labour Entry</h3>
            </div>
            <div class="modal-body">
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Entry Time:</label>
                <input type="time" [(ngModel)]="entry_time" name="entry_time" required>
              </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" type="button" (click)="isEntry=false">{{'common.cancel' | translate}}</button>
                <button class="btn btn-primary" type="button" (click)="manualEntry('P', entry_time)">{{'common.save' | translate}}</button>
            </div>
        </div>
    </div>
</div>
