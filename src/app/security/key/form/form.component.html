<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Key Register</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/security/key/register" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon>{{'common.close' | translate}}</button>
          </div>
        </div>
      </div>
      <div class="card-block">
        <div class="card-text">
          <form #Form="ngForm">
            <div class="clr-row">

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Key No:<sup style="color: red">*</sup></strong></label>
                <input type="text" name="key_no" [(ngModel)]="key_no" required> 
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Activity:<span style="color: red;">*</span> </label>
                <select name="activity" ngModel required>
                    <option>Issue</option>
                    <option>Submitted</option>
                  </select>
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Departments:<sup style="color: red">*</sup></strong></label>
                <select name="department" ngModel required>
                    <option></option>
                    <option *ngFor="let department of departments">{{
                        department.department_name }}</option>
                </select>
            </div>
              
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Employee Name:<sup style="color: red">*</sup></strong></label>
                <input type="text" name="emp_name" [(ngModel)]="emp_name" required> 
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Date:<span style="color: red;">*</span> </label>
                <input type="date" name="date" [(ngModel)]="date" required>
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Time:<span style="color: red;">*</span> </label>
                <input type="time" name="time" [(ngModel)]="time" required>
            </div>
                           
            </div>
          </form>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="saveform(Form)">{{'common.save' | translate}}</button>
      </div>
    </div>
  </div>
