<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
       <div class="clr-row align-items-center" style="margin-bottom: 10px;">

  <!-- Title -->
  <div class="clr-col-8">
    <h5 style="color: white; margin: 0;">Key Master</h5>
  </div>

  <!-- Buttons -->
  <div class="clr-col-4 text-right">

    <button class="btn btn-sm btn-success mr-2" routerLink="/security/key/new">
      NEW
    </button>

    <button class="btn btn-sm btn-danger" routerLink="/security/key">
      <clr-icon shape="window-close" class="is-solid"></clr-icon>
      CLOSE
    </button>

  </div>

</div>
      </div>
      <div class="card-block">
        <div class="card-text">

          <table class="table table-border" style="border:solid rgb(14, 67, 112) 1px ;">
            <tr>
              <td style="text-align: center;color:white;background-color: rgb(14, 67, 112);">{{'common.table.srNo' | translate}}</td>
              <td style="text-align: center;color:white;background-color: rgb(14, 67, 112);">{{'common.department' | translate}}</td>
              <td style="text-align: center;color:white;background-color: rgb(14, 67, 112);">Room Name</td>
              <td style="text-align: center;color:white;background-color: rgb(14, 67, 112);">Key No</td>
              <td style="text-align: center;color:white;background-color: rgb(14, 67, 112);">{{'common.date' | translate}}</td>
            </tr>
            <tr *ngFor="let key of keys; let i = index">
              <td style="text-align: center;">{{i++1}}</td>
              <td style="text-align: center;">{{key.department}}</td>
              <td style="text-align: center;">{{key.section}}</td>
              <td style="text-align: center;">{{key.key_no}}</td>
              <td style="text-align: center;">{{key.date | date:'dd-MM-yyyy'}}</td>
              
            </tr>
          </table>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button>
      </div>
    </div>
  </div>
