<div class="container-fluid">
  <div class="card">
    <div class="card-header">Labour Exit</div>
    <div class="card-block">
      <div class="card-text">
        <div class="clr-row">
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6 clr-col-xs-6">
            <label>Labour Name:</label>
             <input type="text" name="labour_name"  ngModel required />
        </div>
        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6 clr-col-xs-6">
          <label>Category:</label>
           <input type="text" name="category"  ngModel required />
      </div>
      <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
        <button class="btn btn-danger" (click)="getTodaysLabors()">{{'common.search' | translate}}</button>
      </div>
        <table class="table">
            <thead>
              <tr>
                <th>Labour Name</th>
                <th>{{'common.category' | translate}}</th>
                <th>In Time</th>
                <th>Out Time</th>
                <th>{{'common.table.action' | translate}}</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let labour of todaysLabours">
                <td>{{ labour.labour_name }}</td>
                <td>{{ labour.category }}</td>
                <td>{{ labour.in_time }}</td>
                <td>{{ labour.out_time }}</td>
                <td *ngIf="labour.out_time ==''">
                  <button class="btn btn-sm" (click)="exitLabour(labour.id)">Exit</button>
                </td>
              </tr>
            </tbody>
          </table>
      </div>
    </div>
  </div>
</div>
