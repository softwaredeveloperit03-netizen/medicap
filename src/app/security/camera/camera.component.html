<div class="camera-wrap">
  <div class="camera-live">
    <video #videoEl class="camera-video" playsinline autoplay muted width="640" height="480"></video>
    <canvas #canvasEl class="camera-canvas" style="display: none;"></canvas>
    <p *ngIf="errorMessage" class="camera-error">{{ errorMessage }}</p>
    <div class="camera-actions">
      <button type="button" class="btn btn-sm btn-success" (click)="capture()" [disabled]="!isStreaming">
        Capture
      </button>
      <button type="button" class="btn btn-sm btn-outline" (click)="useUploadPhoto()">
        <i class="fas fa-upload"></i> Use Upload Photo
      </button>
    </div>
  </div>
</div>
