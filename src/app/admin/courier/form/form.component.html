<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Outgoing Courier</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-danger" routerLink="/admin/courier/incoming"> {{'common.close' | translate}} </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #Form="ngForm">
          <div class="clr-row">

          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Date:<span style="color: red">*</span></strong></label>
              <input type="date" name="date" ngModel required> 
          </div>

          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Party Name :<span style="color: red">*</span></strong></label>
              <input type="text" name="party_name" ngModel required>
          </div>

          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Description Of Material/ Courier:<span style="color: red">*</span>:</strong></label>
              <input type="text" name="description" ngModel required>
          </div>

          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Department:<span style="color: red;">*</span></strong></label>
              <input type="text" name="department" ngModel required>
          </div>

          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Name of Courier Agency:<span style="color: red;">*</span></strong></label>
              <input type="text" name="courier_agency" ngModel required>
          </div>

          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label><strong>Docket No.:<span style="color: red;">*</span></strong></label>
            <input type="number" name="docket_no" ngModel required Onlynumber>
        </div>
        </div>
      </form>
  </div>
</div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="saveoutgoing(Form)">{{'common.save' | translate}}</button>
    </div>
</div>
