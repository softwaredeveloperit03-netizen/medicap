<div class="container">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Demand for Resources</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/garden-dashboard" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
  </div>
    <div class="card-block">
      <div class="card-text">
        <button class="btn btn-sm btn-info" *ngIf="!formopen" (click)="addclientbtn()">Fill Form for Resources</button>
        <clr-datagrid *ngIf="!formopen">
          <clr-dg-column>Resource ID</clr-dg-column>
          <clr-dg-column>{{'common.date' | translate}}</clr-dg-column>
          <clr-dg-column>Required Resources</clr-dg-column>
          <clr-dg-column>Details</clr-dg-column>
          <clr-dg-column>Required On Urgent Basis</clr-dg-column>
          <clr-dg-column>Required On Usual</clr-dg-column>

          <clr-dg-row *ngFor="let item of list">
            <clr-dg-cell>{{item.resource_id}}</clr-dg-cell>
            <clr-dg-cell>{{item.date}}</clr-dg-cell>
            <clr-dg-cell>{{item.required_resources}}</clr-dg-cell>
            <clr-dg-cell>{{item.details}}</clr-dg-cell>
            <clr-dg-cell>{{item.required_urgent}}</clr-dg-cell>
            <clr-dg-cell>{{item.required_usual}}</clr-dg-cell>
          </clr-dg-row>
        </clr-datagrid>
        <form #form="ngForm" *ngIf="formopen">
          <div class="clr-row">

            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label> <strong> Resources ID</strong></label>
              <input name="resource_id" ngModel type="text" required />
            </div>

            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label> <strong>Required Resources </strong></label>
              <input name="required_resources" ngModel type="text" required />
            </div>

            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Details</strong></label>
              <textarea name="details" rows="2" ngModel></textarea>
            </div>

            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label><strong> Required on:</strong></label>
              <div class="clr-row">
                <div class="clr-col-lg-3 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                  <div class="clr-form-control">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox="" ngModel name="urgent" type="checkbox" value="urgent" id="urgent" />
                        <label class="clr-control-label" for="urgent">Urgent</label>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="clr-col-lg-3 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                  <div class="clr-form-control">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox="" ngModel name="usual" type="checkbox" value="usual" id="usual" />
                        <label class="clr-control-label" for="usual">Usual</label>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="clr-col-12">
              <br>
              <button class="btn btn-success" (click)="form.form.valid && submit(form)" [disabled]="form.form.invalid">{{'common.submit' | translate}}</button>
              <button class="btn btn-warning" (click)="closeclientbtn()">{{'common.close' | translate}}</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
