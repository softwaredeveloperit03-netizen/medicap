<div class="clr-row">
    <div class="clr-col-xl-6 clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-12 so-icon">
        <div class="card clickable social-card social-card-github" routerLink="/stock_book">
          <div class="card-block" style="text-align: center">
            <div class="community-social-icon">
              <img alt="github" width="50px" height="50px" src="assets/contractor.png">
            </div>
            <p class="card-text"><b>Garden Contractor Master</b></p>
          </div>
        </div>
      </div>
      <div class="clr-col-xl-6 clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-12 so-icon">
        <div class="card clickable social-card social-card-github" routerLink="/dispensingLog">
          <div class="card-block" style="text-align: center">
            <div class="community-social-icon">
              <img alt="github" width="50px" height="50px" src="assets/labour.png">
            </div>
            <p class="card-text"><b>Garden Labour Master</b></p>
          </div>
        </div>
    </div>
</div>

<div class="container-fluid">
    <div class="card">
        <div class="card-header">Garden Contractor</div>
        <div class="card-block">
            <div class="card-text">
                <table class="table">
                    <tr>
                        <th>Name of Contractor</th>
                        <th>{{'common.address' | translate}}</th>
                        <th>Contact Person</th>
                        <th>Email Id</th>
                        <th>Nature of Work Contract</th>
                    </tr>
                    <tr>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="container-fluid">
    <div class="card">
        <div class="card-header">Garden Contractor</div>
        <div class="card-block">
            <div class="card-text">
                <div class="clr-row">
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                        <label>Name of Contractor:</label>
                        <input type="text" name="contractor_name" ngModel required>
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                        <label>Address:</label>
                        <input type="text" name="address" ngModel required>
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                        <label>Contact Person:</label>
                        <input type="text" name="contact_person" ngModel required>
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                        <label>Email Id:</label>
                        <input type="text" name="email" ngModel required>
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                        <label>Nature of Work Contract:</label>
                        <input type="text" name="work_nature" ngModel required>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary">{{'common.submit' | translate}}</button>
            <button class="btn btn-danger">{{'common.close' | translate}}</button>
        </div>
    </div>
</div>

<div class="container-fluid">
    <div class="card">
        <div class="card-header">Garden Labour</div>
        <div class="card-block">
            <div class="card-text">
                <div class="clr-row">
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                        <label>Name of Labour:</label>
                        <input type="text" name="labour_name" ngModel required>
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                        <label>Contractor Name:</label>
                        <select name="contractor" ngModel required>
                            <option></option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary">{{'common.submit' | translate}}</button>
            <button class="btn btn-danger">{{'common.close' | translate}}</button>
        </div>
    </div>
</div>
