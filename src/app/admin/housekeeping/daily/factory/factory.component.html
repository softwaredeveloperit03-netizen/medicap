<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Factory Premises</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-danger" routerLink="/admin/housekeeping/daily"> {{'common.close' | translate}} </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #Form="ngForm">
          <div class="clr-row">

          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Date:<sup style="color: red">*</sup></strong></label>
              <input type="date" name="date" [(ngModel)]="date" required> 
          </div>

          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Road:<sup style="color: red">*</sup></strong></label>
              <input type="text" name="road" ngModel required>
          </div>

          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Outside Wall:<sup style="color: red">*</sup>:</strong></label>
              <input type="text" name="wall" ngModel required>
          </div>

          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label><strong>All drainage:<span style="color: red;">*</span></strong></label>
              <input type="text" name="drainage" ngModel required>
          </div>
          

          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Done By:<span style="color: red;">*</span></strong></label>
              <select name="done_by" ngModel required>
                  <option>Id: 170</option>
                  <option>ID: 171</option>
                  <option>ID: 172</option>
                  <option>ID: 173</option>
                  <option>ID: 174</option>
                  <option>ID: 175</option>
                </select>
          </div>

          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Checked By:<span style="color: red;">*</span></strong></label>
              <select name="checked_by" ngModel required>
                  <option>Id: 170</option>
                  <option>ID: 171</option>
                  <option>ID: 172</option>
                  <option>ID: 173</option>
                  <option>ID: 174</option>
                  <option>ID: 175</option>
                </select>
          </div>

          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label><strong>Remarks:<span style="color: red;">*</span></strong></label>
              <select name="remark" ngModel required>
                <option>{{'common.approved' | translate}}</option>
                <option>Not Approved</option>
              </select>
        </div>
    </div><br>
      </form>
  </div>
</div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="savefactory(Form)">{{'common.save' | translate}}</button>
    </div> 
</div>
