<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Destruction Record Form</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/admin/housekeeping" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
      <form #distruction_record_form="ngForm">
        <div class="card-text">
                <div class="clr-row">
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Date Of Destruction:<span style="color: red;">*</span></label>
                        <input type="date" name="destruction_date" ngModel required>
                    </div>

                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Department/Location:<span style="color: red;">*</span></label>
                        <select name="department" #dept="ngModel" ngModel  required>
                            <option></option>
                            <option *ngFor="let dept of departments">{{ dept.department_name }}</option>
                          </select>                 
                   </div>
                </div>
                <h4>HouseKeeping Material Details</h4>
                <div class="clr-row">
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Material Name:<span style="color: red;">*</span></label>
                        <input type="text" name="material_name" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Material Type:<span style="color: red;">*</span></label>
                        <select type="text" name="material_type" ngModel>
                            <option></option>
                            <option>Raw Material</option>
                            <option>Packing Material</option>
                        </select>                 
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Description:<span style="color: red;">*</span></label>
                        <input type="text" name="description" ngModel required>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left; color: black; background-color: lightgreen;">Reason & Method Of Destruction</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Reason For Destruction:<sup style="color: red">*</sup></strong></label>
                            <select type="text" name="resson_destruction" ngModel>
                                <option></option>
                                <option>Obsolete</option>
                                <option>Damaged</option>
                                <option>upgraded</option>
                                <option>End Of Life</option>
                            </select>    
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Destruction Method:<sup style="color: red">*</sup></strong></label>
                            <select type="text" name="destruction_method" ngModel>
                                <option></option>
                                <option>Deletion</option>
                                <option>Formatting</option>
                                <option>Physical Destruction</option>
                            </select>    
                        </div>
                        <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Additional Comments:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="add_comments" ngModel>
                        </div>
                    </div>
                </div>
                <div class="card-header" style="text-align: left; color: white; background-color: rgb(154, 107, 230);"> Verification</div>
                <div class="card-block">
                    <div class="clr-row">
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                        <p><b> I, <input type="text" name="confirming_person" [(ngModel)]="confirmingPerson" style="width: 200px;"/> confirm that the destruction process was conducted in accordance with the company's policies and procedures.</b> </p>
                    </div>
                </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Witness (If Applicable):<sup style="color: red">*</sup></strong></label>
                        <input type="text" name="witness" ngModel>
                    </div>
                </div>
            </div>
         </form>   
     </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="save(distruction_record_form)">{{'common.save' | translate}}</button>
        </div>
</div>
