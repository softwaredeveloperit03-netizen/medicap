<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Daily Check List For Toilet Cleaning 
            </div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm btn-danger" routerLink="/admin/hygin">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #personalhygieneform="ngForm">

                <div class="clr-row">

                    <div class="clr-col-lg-4 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Floor :<sup style="color: red">*</sup></label>
                        <select name="floor" ngModel (change)="add_floors($event.target.value)">
                            <option></option>
                            <option>First Floor</option>
                            <option>Second Floor</option>
                            <option>Third Floor</option>
                            <option>Fourth Floor</option>
                            <option *ngFor="let dustNO of get_fl">{{dustNO.floor}} </option>
                            <option style="color:red">Add New </option>
                        </select>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Date :<sup style="color: red">*</sup></label>
                        <input type="date" name="clening_date" ngModel (change)="day($event.target.value)" required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Day :<sup style="color: red">*</sup></label>
                        <input type="text" name="cleaning_day" [(ngModel)]="cleaning_day" readonly>
                    </div>
                </div>
               

                <div class="card">
                    <div class="card-header" style="text-align: center">
                        <div class="clr-row" style="margin-bottom: -10px;">
                            <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;">Check
                                Cleaning</div>
                        </div>
                    </div>
                    <div class="card-block">
                       
                            <div class="clr-row">

                                <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Wash Basin :</label><br>
                                    <input type="checkbox"  class="larger" name="wbasin_clean" ngModel  >
                                </div>

                                <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Urinal Pots :</label><br>
                                    <input type="checkbox"  class="larger" name="upot_clean" ngModel  >
                                </div>

                                <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Toilet Doors :</label><br>
                                    <input type="checkbox"  class="larger" name="tdorrs_clean" ngModel  >
                                </div>

                                <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Toilet Block :</label><br>
                                    <input type="checkbox"  class="larger" name="tblock_clean" ngModel  >
                                </div>

                                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Giaz Tiles (Common Place) :</label><br>
                                    <input type="checkbox"  class="larger" name="gtiles_clean" ngModel  >
                                </div>

                                <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Soap Dispenser:</label><br>
                                    <input type="checkbox"  class="larger" name="soapd_clean" ngModel  >
                                </div>

                                <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Exhaust Fan :</label><br>
                                    <input type="checkbox"  class="larger" name="efan_clean" ngModel  >
                                </div>
                                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Plumbing Water Pipe Line:</label><br>
                                    <input type="checkbox"  class="larger" name="pwpipel_clean" ngModel  >
                                </div>
                                

                                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Remark :</label><br>
                                    <input type="text" name="tclean_remark" ngModel required>
                                </div>
                                
                            </div>
                        

                    </div>
                </div>
            </form>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="save(personalhygieneform)">{{'common.submit' | translate}}</button>
        </div>
    </div>
</div>



 

<clr-modal [(clrModalOpen)]="add_floor" clrModalClosable="false">
    <h3 class="modal-title">ADD Floor </h3>
    <div class="modal-body">
        <div class="clr-row">
             <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label>Floor:<span style="color: red">*</span></label>
                <input type="text" name="save_floor" [(ngModel)]="save_floor" required>
            </div>
        </div>

    </div>
    <div class="modal-footer">
         <button type="button" class="btn btn-primary" (click)="add_floor_name()">{{'common.save' | translate}}</button>
    </div>
</clr-modal>
