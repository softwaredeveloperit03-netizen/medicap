<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">WASTE DISPOSAL LOG SHEET 
            </div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm btn-danger" routerLink="/admin/hygin">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #personalhygieneform="ngForm">

                <div class="clr-row">

                    <div class="clr-col-lg-4 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Date :<sup style="color: red">*</sup></label>
                        <input type="date" name="clening_date" ngModel (change)="day($event.target.value)" required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Day :<sup style="color: red">*</sup></label>
                        <input type="text" name="cleaning_day" [(ngModel)]="cleaning_day" readonly>
                    </div>
                </div>
               

                <div class="card">
                    <div class="card-header" style="text-align: center">
                        <div class="clr-row" style="margin-bottom: -10px;">
                            <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;">Check
                                Cleaning
                            </div>
                        </div>
                    </div>
                    <div class="card-block">
                       
                            <div class="clr-row">

                                <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Ground Floor Dustbin Cleaned :</label><br>
                                    <input type="checkbox"  class="larger" name="gf_dust" ngModel  >
                                </div>

                                <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>First Floor Dustbin Cleaned :</label><br>
                                    <input type="checkbox"  class="larger" name="ff_dust" ngModel  >
                                </div>

                                <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Outside Dustbin Cleaned :</label><br>
                                    <input type="checkbox"  class="larger" name="o_dust" ngModel  >
                                </div>

                                <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Label Properly :</label><br>
                                    <input type="checkbox"  class="larger" name="label_prop" ngModel  >
                                </div>

                                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Segregated Properly :</label><br>
                                    <input type="checkbox"  class="larger" name="segregated_prop" ngModel  >
                                </div>

                                <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Not Leaking :</label><br>
                                    <input type="checkbox"  class="larger" name="not_leaking" ngModel  >
                                </div>

                                <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Storage Limit Not Exceeded :</label><br>
                                    <input type="checkbox"  class="larger" name="storage_limit" ngModel  >
                                </div>
                                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Waste Disposal Collected By The Agency:</label><br>
                                    <input type="checkbox"  class="larger" name="collected_by_agency" ngModel  >
                                </div>
                                

                                <!-- <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Remark :</label><br>
                                    <input type="text" name="tclean_remark" ngModel required>
                                </div> -->

                            </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="save(personalhygieneform)">{{'common.submit' | translate}}</button>
        </div>
    </div>
</div>
