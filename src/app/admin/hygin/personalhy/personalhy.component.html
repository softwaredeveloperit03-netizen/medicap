<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">PERSONAL HYGIENE
        </div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-danger" routerLink="/admin/hygin">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #gatepassForm="ngForm">
          <div class="clr-row">
  
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Date :<sup style="color: red">*</sup></label>
              <input type="date" name="personal_hygiene_date" ngModel  required>
            </div>
           
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-xs-12">
              <label>Employee/Labour Selection:</label>
              <select  name="selected_dep" [(ngModel)]="selected_dep" required >
                <option>Employee</option>
                  <option>Labour</option>
                
              </select>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="selected_dep!='Labour'">
                <label>Employee Department :<span style="color: red">*</span></label>
                <select ngModel name="department_name" (change)="getEmployees($event.target.value)" required>
                  <option></option>
                  <option *ngFor="let department of departments1" [value]="department.department_name">{{
                    department.department_name }}</option>
                </select>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="selected_dep!='Labour'">
                <label>Employee Name :</label>
                <select name="emp_name" ngModel  required>
                  <option></option>
                  <option *ngFor="let employee of employees" [value]="employee.emp_id">{{ employee.firstname }}</option>
                  <option style="color: red;">Other</option>
                </select>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="selected_dep=='Labour'">
                <label>Labour Name :</label>
                <input type="text" name="labour_name" ngModel  required>

              </div>
  
             
          </div>
          <div class="clr-row">
  
            <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Closed Pocket Apron Worn Properly :</label><br>
              <input class="larger" type="checkbox" name="c_pocket" ngModel  >
            </div>
            <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Cap/ Mak Worn Properly :</label><br>
              <input class="larger"  type="checkbox" name="cap" ngModel  >
            </div>

            <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Nails Trimmed Properly :</label><br>
              <input class="larger"  type="checkbox" name="nails" ngModel  >
            </div>
            <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Worn Jewellery :</label><br>
              <input class="larger"  type="checkbox" name="jewelry" ngModel  >
            </div>
            <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Open Cuts & Wound :</label><br>
              <input class="larger"  type="checkbox" name="cuts_wound" ngModel  >
            </div> 
             <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Found Beard :</label><br>
              <input class="larger"  type="checkbox" name="beard" ngModel  >
            </div>

            <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Footware :</label><br>
              <input class="larger"  type="checkbox" name="footware" ngModel  >
            </div>
            <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Any Medical Device :</label><br>
              <input class="larger"  type="checkbox" name="medical_device" ngModel  >
            </div>
            <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Any Allergy :</label><br>
              <input class="larger"  type="checkbox" name="any_alergy" ngModel  >
            </div>

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12 text-align: center;">
              <label>Overall Remark:</label><br>
              <input   type="text" name="overall_remark" ngModel  >
            </div>
  
  
  
  
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button type="button" class="btn btn-primary" (click)="save(gatepassForm)">{{'common.submit' | translate}}</button>
    </div>
  </div>
