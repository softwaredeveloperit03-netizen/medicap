
<div class="card">
    <div class="card-header">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Pest Control Service Record
        </div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          
            <button class="btn btn-sm btn-danger" routerLink="/admin/hygin">{{'common.close' | translate}}</button>
          
        </div>
      </div>
    </div>
    <div class="card-block"> 
      <div class="card-text">
        <form #pestcontrol="ngForm">
          <div class="clr-row">
             
            
           
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Date of services :</label>
              <input type="date" name="date_of_service" ngModel required >
           </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label> Services Name :</label>
              <select name="service_name" ngModel  required>
                  <option></option>
                  <option>Lizard Control Service</option>
                  <option>Fly Control Service</option>
                  <option>Rodent Control Service</option>
                  <option>Cockroaches Control Service</option>            
                </select> 
            </div> 
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Pest Status / Observation :</label>
              <input type="text" name="pest_status_obv" ngModel required >
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>No of Found  :</label>
              <input type="number" name="no_of_found" ngModel required >
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Technician  Name :</label>
                <input type="text" name="technician_name" ngModel required >
            </div>
 
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Customer/Representative Name :</label>
                <input type="text" name="cust_rep_name" ngModel required >
            </div>

            <!-- <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Sign of Customer/Representative:</label>
                <input type="text" name="cust_Sign" ngModel required >
            </div> -->
           
            
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button type="button "class="btn btn-success-outline" (click)="save(pestcontrol)">{{'common.save' | translate}}</button>
    </div>
  </div>
