
<div class="card">
    <div class="card-header">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Scrap Management Record
        </div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          
            <button class="btn btn-sm btn-danger"   routerLink="/admin/hygin" >{{'common.close' | translate}}</button>
          
        </div>
      </div>
    </div>
    <div class="card-block"> 
      <div class="card-text">
        <form #scrapForm="ngForm">
          <div class="clr-row">
           
            
           
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Date :<span style="color: red">*</span></label>
              <input type="date" name="scrap_date" ngModel required >
             
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Scrap Type :</label>
              <select name="scrap_type" ngModel required  (change)="add_scraps($event.target.value)">
                <option></option>
                <option>Cartons box</option>
                <option>Paper Waste</option>
                <option >Iron Waste</option>
                <option >Plastic Waste</option>
                <option >Drum</option>
                <option style="color: red">Add New</option>
              </select>              

            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Type Of Wastage :</label>
              <input type="text" name="type_wastage" ngModel required>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Rate/Kg :<span style="color: red">*</span></label>
                <input type="text" name="scrap_rate_kg"   [(ngModel)]="scrap_rate_kg"  ngModel required>
               
              </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Total Kg:<span style="color: red">*</span></label>
                <input type="text" name="scrap_total_kg" ngModel  (keyup)="addition($event.target.value)"   required >
               
              </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Total Amount:<span style="color: red">*</span></label>
                <input type="text" name="total_amount" ngModel  [(ngModel)]="total_amount" readonly>
               
              </div>
           
            
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button type="button" class="btn btn-success-outline" (click)="savescrap(scrapForm)">{{'common.save' | translate}}</button>
    </div>
  </div>






  <clr-modal [(clrModalOpen)]="add_scrap" clrModalClosable="false">
    <h3 class="modal-title">ADD Scrap Type </h3>
    <div class="modal-body">
        <div class="clr-row">
             <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label>Scrap Type :<span style="color: red">*</span></label>
                <input type="text" name="save_scrap" [(ngModel)]="save_scrap" required>
            </div>
        </div>

    </div>
    <div class="modal-footer">
         <button type="button" class="btn btn-primary" (click)="add_scrap_type()">{{'common.save' | translate}}</button>
    </div>
</clr-modal>
