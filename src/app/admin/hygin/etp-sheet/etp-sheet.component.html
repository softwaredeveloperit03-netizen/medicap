<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">ETP-LOG SHEET
            </div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm btn-danger"  routerLink="/admin/hygin" >{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #logsheetform="ngForm">
  
                <div class="clr-row">
  
                     
                    <div class="clr-col-lg-4 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Date :<sup style="color: red">*</sup></label>
                        <input type="date" name="clening_date" ngModel (change)="day($event.target.value)" required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Day Checked:<sup style="color: red">*</sup></label>
                        <input type="text" name="cleaning_day" [(ngModel)]="cleaning_day" readonly>
                    </div>
                </div>     
               
  
                <div class="card">
                    <div class="card-header" style="text-align: center">
                        <div class="clr-row" style="margin-bottom: -10px;">
                            <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;">Log-Checking</div>
                        </div>
                    </div>
                    <div class="card-block">
                       
                            <div class="clr-row">
  
                                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label> BackWash & Rinse Start Time :</label><br>
                                    <input type="time" name="backWash" ngModel required>
                                </div>
  
                                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label> BackWash & Rinse End Time  :</label><br>
                                    <input type="time" name="rinse" ngModel required>
                                </div>
  
                                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Process Start Time :</label><br>
                                    <input type="time" name="process_time" ngModel required>
                                </div>
  
                                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>250 Gm Lime Add Time(15 Min) :</label><br>
                                    <input type="time" name="add_time" ngModel required>
                                </div>
                                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>250 Gm Alarm Add Time(15 Min) :</label><br>
                                    <input type="time" name="alam_time" ngModel required>
                                </div> 
  
                                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>500 Ml Poly Add Time(15 Min) :</label><br>
                                    <input type="time" name="poly_time" ngModel required>
                                </div>
  
                                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Holding Time 1 Hr :</label><br>
                                    <input type="number" name="holding_time" ngModel required>
                                </div>
  
                                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Filter Water Transfer Time:</label><br>
                                    <input type="time" name="water_time" ngModel required>
                                </div>
                                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Slurry Transfer Time :</label><br>
                                    <input type="time" name="transfer_time" ngModel required>
                                </div>
                               
                                
  
                                <!-- <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12 text-align: center;">
                                    <label>Signature of Supervisor:</label><br>
                                    <input type="text" name="rlog_remark" ngModel required>
                                </div> -->
                              </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="save(logsheetform)">{{'common.submit' | translate}}</button>
        </div>
    </div> 
  </div>
