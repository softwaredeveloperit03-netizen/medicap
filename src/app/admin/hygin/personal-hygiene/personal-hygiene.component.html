<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Floor Dust Bins Cleaning
            </div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm btn-danger" routerLink="/admin/hygin">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #personalhygieneform="ngForm">

                <div class="clr-row">

                    <div class="clr-col-lg-4 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Floor :<sup style="color: red">*</sup></label>
                        <select name="floor" ngModel (change)="add_floors($event.target.value)">
                            <option></option>
                            <option>Ground Floor</option>
                            <option>First Floor</option>
                            <option>Second Floor</option>
                            <option>Third Floor</option>
                            <option>Fourth Floor</option>
                            <option *ngFor="let dustNO of get_fl">{{dustNO.floor}} </option>
                            <option style="color:red">Add New </option>
                        </select>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Date :<sup style="color: red">*</sup></label>
                        <input type="date" name="clening_date" ngModel (change)="day($event.target.value)" required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Day :<sup style="color: red">*</sup></label>
                        <input type="text" name="cleaning_day" [(ngModel)]="cleaning_day" readonly>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header" style="text-align: center">
                        <div class="clr-row" style="margin-bottom: -10px;">
                            <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;">Check
                                Cleaning</div>
                        </div>
                    </div>
                    <div class="card-block">
                        <form #checkform="ngForm">
                            <div class="clr-row">

                                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Dust Bin No. :<sup style="color: red">*</sup></label>

                                    <select name="dust_bin_no" ngModel
                                        (change)="adddustno($event.target.value)">
                                        <option></option>
                                        <option *ngFor="let dustNO of get_dust_no">{{dustNO.dust_bin_no}} </option>
                                        <option style="color:red">Add New </option>
                                    </select>
                                </div>


                                <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Check :</label><br>
                                    <input type="checkbox"  class="larger" name="clean_done" ngModel  >
                                </div>


                                <div class="clr-col-lg-2 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                    <button class="btn btn-primary" (click)="addcleanData(checkform)"
                                        [disabled]="checkform.invalid">{{'common.add' | translate}}</button>
                                </div>
                            </div>
                        </form>



                        <div class="card-text">
                            <div class="row container-fluid">
                                <table class="table table-border">
                                    <tr>
                                        <th style="background-color:rgb(14, 67, 112); color: white;">{{'common.table.srNo' | translate}}</th>
                                        <th style="background-color: rgb(14, 67, 112); color: white;">Dust Bin No.</th>
                                        <th style="background-color: rgb(14, 67, 112); color: white;">Check</th>
                                        <th style="background-color: rgb(14, 67, 112); color: white;">{{'common.table.action' | translate}}</th>
                                    </tr>

                                    <tr *ngFor="let add of entrydata ;let i=index">
                                        <td>{{i+1}}.</td>
                                        <td style="text-align: left;">{{add.dust_bin_no}}</td>
                                        <td style="text-align: left;">{{add.clean_done}}</td>
                                        <td>
                                            <clr-icon shape="trash" class="is-error" (click)="delData(i)"></clr-icon>
                                        </td>
                                    </tr>

                                </table>

                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="save(personalhygieneform)" >{{'common.submit' | translate}}</button>
        </div>
    </div>
</div>



<clr-modal [(clrModalOpen)]="add_dust_no" clrModalClosable="false">
    <h3 class="modal-title">Dust Bin Number </h3>
    <div class="modal-body">
        <div class="clr-row">
            <!-- <form #add_mono_cartains="ngForm"> -->
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label>Dust Bin No:<span style="color: red">*</span></label>
                <input type="text" name="save_dust_nosss" [(ngModel)]="save_dust_nosss" required>
            </div>
        </div>

    </div>
    <div class="modal-footer">
        <!-- <button type="button" class="btn btn-primary" (click)="saveColor()">{{'common.save' | translate}}</button> -->
        <button type="button" class="btn btn-primary" (click)="add_dust_nos()">{{'common.save' | translate}}</button>
    </div>
</clr-modal>

<clr-modal [(clrModalOpen)]="add_floor" clrModalClosable="false">
    <h3 class="modal-title">ADD Floor </h3>
    <div class="modal-body">
        <div class="clr-row">
            <!-- <form #add_mono_cartains="ngForm"> -->
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label>Floor:<span style="color: red">*</span></label>
                <input type="text" name="save_floor" [(ngModel)]="save_floor" required>
            </div>
        </div>

    </div>
    <div class="modal-footer">
        <!-- <button type="button" class="btn btn-primary" (click)="saveColor()">{{'common.save' | translate}}</button> -->
        <button type="button" class="btn btn-primary" (click)="add_floor_name()">{{'common.save' | translate}}</button>
    </div>
</clr-modal>
