<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Factory Hygiene Report
            </div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm btn-danger" routerLink="/admin/hygin">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #personalhygieneform="ngForm">

                <div class="clr-row">

                    <div class="clr-col-lg-4 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Floor :<sup style="color: red">*</sup></label>
                        <select name="floor" ngModel (change)="add_floors($event.target.value)">
                            <option></option>
                            <option>First Floor</option>
                            <option>Second Floor</option>
                            <option>Third Floor</option>
                            <option>Fourth Floor</option>
                            <option *ngFor="let dustNO of get_fl">{{dustNO.floor}} </option>
                            <option style="color:red">Add New </option>
                        </select>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Date :<sup style="color: red">*</sup></label>
                        <input type="date" name="clening_date" ngModel (change)="day($event.target.value)" required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Day :<sup style="color: red">*</sup></label>
                        <input type="text" name="cleaning_day" [(ngModel)]="cleaning_day" readonly>
                    </div>
                </div>
               

                <div class="card">
                    <div class="card-header" style="text-align: center">
                        <div class="clr-row" style="margin-bottom: -10px;">
                            <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;">Check
                                Cleaning</div>
                        </div>
                    </div>
                    <div class="card-block">
                       
                            <div class="clr-row">

                                <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Hand Washer :</label><br>
                                    <input type="checkbox"  class="larger" name="hwasher_clean" ngModel  >
                                </div>

                                <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Air Curtains :</label><br>
                                    <input type="checkbox"  class="larger" name="curtain_clean" ngModel  >
                                </div>

                                <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Walls :</label><br>
                                    <input type="checkbox"  class="larger" name="wall_clean" ngModel  >
                                </div>

                                <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Pallets :</label><br>
                                    <input type="checkbox"  class="larger" name="pallet_clean" ngModel  >
                                </div>

                                <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Storage :</label><br>
                                    <input type="checkbox"  class="larger" name="storage_clean" ngModel  >
                                </div>

                                <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Water Tank :</label><br>
                                    <input type="checkbox"  class="larger" name="wtank_clean" ngModel  >
                                </div> 

                                <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Files :</label><br>
                                    <input type="checkbox"  class="larger" name="file_clean" ngModel  >
                                </div>
                                <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Rodent Boxes :</label><br>
                                    <input type="checkbox"  class="larger" name="rodent_clean" ngModel  >
                                </div>
                                <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Machines :</label><br>
                                    <input type="checkbox"  class="larger" name="machine_clean" ngModel  >
                                </div>
                                <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Utensils :</label><br>
                                    <input type="checkbox"  class="larger" name="utencils_clean" ngModel  >
                                </div>
                                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Flycatcher Tube Check :</label><br>
                                    <input type="checkbox"  class="larger" name="flycather_clean" ngModel  >
                                </div>
                                <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>All Inside Corners :</label><br>
                                    <input type="checkbox"  class="larger" name="corner_clean" ngModel  >
                                </div>
                                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Surrounding Of Factory :</label><br>
                                    <input type="checkbox"  class="larger" name="surrounding_clean" ngModel  >
                                </div>

                                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                    <label>Remark :</label><br>
                                    <input type="text" name="clean_remark" ngModel  >
                                </div>


                               
                            </div>
                        

                    </div>
                </div>
            </form>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="save(personalhygieneform)">{{'common.submit' | translate}}</button>
        </div>
    </div>
</div>



 

<clr-modal [(clrModalOpen)]="add_floor" clrModalClosable="false">
    <h3 class="modal-title">ADD Floor </h3>
    <div class="modal-body">
        <div class="clr-row">
            <!-- <form #add_mono_cartains="ngForm"> -->
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label>Floor:<span style="color: red">*</span></label>
                <input type="text" name="save_floor" [(ngModel)]="save_floor" required>
            </div>
        </div>

    </div>
    <div class="modal-footer">
        <!-- <button type="button" class="btn btn-primary" (click)="saveColor()">{{'common.save' | translate}}</button> -->
        <button type="button" class="btn btn-primary" (click)="add_floor_name()">{{'common.save' | translate}}</button>
    </div>
</clr-modal>
