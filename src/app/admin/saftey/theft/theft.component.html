
<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue; margin-top: -2px; text-align: left;"> Theft Information Report Form:</div>
            <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/admin/saftey" style="background-color: red; color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
<div>

 <form #signsafetyform="ngForm">
    <div class="card-block">
        <div class="card-text">
            <h4> General Information</h4>
            <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Date of Theft :</b><span style="color: red;">*</span></label>
                    <input type="date" name="date_time" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b> Time of Theft :</b><span style="color: red;">*</span></label>
                    <input type="time" name="date_time" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Location of Theft:</b><span style="color: red;">*</span></label>
                    <input type="time" name="location" ngModel required>
                </div>
            </div>
        </div>
    </div>
    <div class="card">
     <div class="card-header" style="text-align: left; color: black; background-color: rgb(96, 189, 212);">Equpment Details: </div>
        <div class="card-block">
          <div class="clr-row">
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><b>Type Of Equpment:</b></label>
                <select type="text" name="equpment_type" [(ngModel)]="equpment_type" required>
                    <option></option>
                    <option>Surveillance Camera</option>
                    <option>Access Control System</option>
                    <option>Fire Extinsuisher</option>
                    <option>Other</option>
                </select>
            </div>
            <div *ngIf="equpment_type == 'Other'"class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><b>Other:</b><span style="color: red;">*</span></label>
                <input type="text" name="other" ngModel required>
            </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><b>Manufacturer:</b><span style="color: red;">*</span></label>
                <input type="text" name="manufacturer" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><b>Model:</b><span style="color: red;">*</span></label>
                <input type="text" name="model" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><b>Serial Number:</b></label>
                <input type="text" name="manufacturer" ngModel >
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><b>Unique Identifier (If Any):</b><span style="color: red;">*</span></label>
                <input type="text" name="unique" ngModel required>
            </div>
        </div>
      </div>
    </div>
    <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(96, 193, 223);">Description of Theft</div>
           <div class="card-block">
             <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Method of Theft:</b></label>
                    <select type="text" name="method_theft" [(ngModel)]="method_theft" required>
                        <option></option>
                        <option>Break-in</option>
                        <option>Unauthorized Access</option>
                        <option>Employee Theft</option>
                        <option>Other</option>
                    </select>
                </div>
                <div *ngIf="method_theft == 'Other'"class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Other:</b><span style="color: red;">*</span></label>
                    <input type="text" name="other" ngModel required>
                </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><b>Detailed Description:</b></label>
                <input type="text" name="detailed" ngModel >
              </div>
           </div>
         </div>
       </div>
       <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(96, 193, 223);">Security Measres</div>
           <div class="card-block">
             <div class="clr-row">
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><b>Was the Equipment Secured:</b></label>
                <select type="text" name="method"ngModel required>
                    <option></option>
                    <option>Yes</option>
                    <option>No</option>
                </select>
            </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Details of Security Measres :</b></strong></label>
                   <input type="text" name="detaile" ngModel required>
               </div>
           </div>
         </div>
       </div>
       <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(96, 193, 223);">Witnes Information</div>
           <div class="card-block">
             <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>where the any Witness:</b></label>
                    <select type="text" name="witness" [(ngModel)]="witness" required>
                        <option></option>
                        <option>Yes</option>
                        <option>No</option>
                    </select>
                </div>
               <div *ngIf="witness == 'Yes'" class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Witnes Statements:</b></strong></label>
                   <input type="text" name="statements" ngModel required>
               </div>
               <div *ngIf="witness == 'Yes'" class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Proof   :</b></strong></label>
                <input type="text" name="proof" ngModel required>
              </div>
           </div>
         </div>
       </div> 
       <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(96, 193, 223);">Report Filed</div>
           <div class="card-block">
             <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Has a Police report been Filed:</b></label>
                    <select type="text" name="witness" [(ngModel)]="witness" required>
                        <option></option>
                        <option>Yes</option>
                        <option>No</option>
                    </select>
                </div>
               <div *ngIf="witness == 'Yes'" class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Police Report Number:</b></strong></label>
                   <input type="text" name="report_number" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Attachment:</label>
                <input type="file" name="attachment" ngModel (change)="onFileChanged3($event)">
            </div>
           </div>
         </div>
       </div>   
       <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(96, 193, 223);">Contact Information</div>
           <div class="card-block">
             <div class="clr-row">
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Reporter Name :</b></strong></label>
                   <input type="text" name="reporter_name" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Reporter's Contact NO. :</b></strong></label>
                <input type="text" name="contact_no" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Reporter's Email Address :</b></strong></label>
                <input type="text" name="email" ngModel required>
            </div>
           </div>
         </div>
       </div>        
</form>
</div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="save(signsafetyform)">{{'common.submit' | translate}}</button>
    </div>
</div>
