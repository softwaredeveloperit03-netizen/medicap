
<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue; margin-top: -2px; text-align: left;"> Safety Signs & Drawings:</div>
            <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/admin/saftey" style="background-color: red; color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
<div>

 <form #signsafetyform="ngForm">
    <div class="card-block">
        <div class="card-text">
            <h4> Sign/Drawings Details</h4>
            <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Date Created:</b><span style="color: red;">*</span></label>
                    <input type="date" name="created_date" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Location/Department:</b><span style="color: red;">*</span></label>
                    <input type="text" name="department" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Type of Safety Sign or Drawings:</b></label>
                    <select type="text" name="type" ngModel required>
                        <option></option>
                        <option>Warings</option>
                        <option> Probition</option>
                        <option>Mandatory</option>
                        <option>Emersency</option>
                        <option>In Form</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
    <div class="card">
     <div class="card-header" style="text-align: left; color: black; background-color: rgb(96, 189, 212);">{{'common.description' | translate}}</div>
        <div class="card-block">
          <div class="clr-row">
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Detailed Description:</b></strong></label>
                <input type="text" name="detail_description" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Specific Hazard or Information Conveyed:</b></strong></label>
                <input type="text" name="information" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Colore Scheme & Symbols Used:</b></strong></label>
                <input type="text" name="symbol" ngModel >
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Placement Details :</b></strong></label>
                <input type="text" name="placement" ngModel >
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Any Additional Instructions or Information :</b></strong></label>
                <input type="text" name="instructions" ngModel >
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Design Specifications:</b></strong></label>
                <input type="text" name="specification" ngModel >
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Attachments:</label>
                <input type="file" name="attachments" ngModel (change)="onFileChanged3($event)">
            </div>
        </div>
      </div>
    </div>
    <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(96, 193, 223);">Approval & Review</div>
           <div class="card-block">
             <div class="clr-row">
                
               <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Approval Date:</b></strong></label>
                   <input type="date" name="date_stock" ngModel required>
               </div>
               <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Approved By:</b></strong></label>
                <input type="text" name="approve_by" ngModel required>
                </div>
                <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <label><strong><b>Review By:</b></strong></label>
                    <input type="text" name="review_by" ngModel required>
                    </div>
               <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Review Date:</b></strong></label>
                   <input type="date" name="review_date" ngModel required>
               </div>
               
           </div>
         </div>
       </div>
</form>
</div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="save(signsafetyform)">{{'common.approve' | translate}}</button>
    </div>
</div>
