<div class="card">     
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Safety Alert Form For Others</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/admin/saftey/safety" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <form #newForm="ngForm">           
        <div class="card-text">
            <h4>Alert Details</h4>
                <div class="clr-row">
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Date Of Issuance:<sup style="color: red">*</sup></strong></label>
                        <input type="date" name="issuance_date" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Time Of Issuance:<sup style="color: red">*</sup></strong></label>
                        <input type="time" name="issuance_time" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Product/Compound Name:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="product_name" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Batch/Lot Number:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="batch_no" ngModel required>
                    </div>
                </div>
        </div>
            <div class="card">
                <div class="card-header" style="text-align: left; color: black; background-color: lightgreen;">Alert Description & Severity</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Alert Severity:<sup style="color: red">*</sup></strong></label>
                            <select type="text" name="alert_severity" ngModel required>
                                <option></option>
                                <option>Low</option>
                                <option>Moderate</option>
                                <option>High</option>
                                <option>Critical</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Alert Description:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="alert_desc" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Description Of The Issue:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="desc_issue" ngModel required>
                        </div>
                    </div>
                </div>
                <div class="card-header" style="text-align: left; color: white; background-color: rgb(154, 107, 230);"> Safety Concern</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Potential Risks:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="pote_risks" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Specific Affected Batches or Products:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="affected_batch" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Any Immediate Action,To be Taken:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="immediate_action" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Contact Information For reporting person:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="contact_info" ngModel required>
                        </div>
                    </div>
                </div>        
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left;color: black; background-color: rgb(182, 212, 14);"> Recommended Action</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Employees:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="employee" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Distributors:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="distributors" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Customers:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="customer" ngModel required>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left;color: white; background-color: rgb(212, 103, 14);"> Contact Informations</div>
                <div class="card-block">
                    <h4>In Case Of Questions or Concerns,Please Contact</h4>
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Name & contact Information of Safety Officer:<sup style="color: red">*</sup></strong></label>
                            <input type="file" name="safety_off_name" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Customer Support Hotline:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="customer_support" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Email For Reporting Safety Concerns:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="email_concerns" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Review & Update:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="review_update" ngModel required>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
        <div class="card-footer">
            <button class="btn btn-primary"(click)="save(newForm)">{{'common.submit' | translate}}</button>
            <!-- <button class="btn btn-danger"(click)="isNew=false">{{'common.close' | translate}}</button> -->
        </div>
</div>
