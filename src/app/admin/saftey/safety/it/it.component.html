<div class="card">     
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Safety Alert Form For IT</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/admin/saftey/safety" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <form #newForm="ngForm">           
        <div class="card-text">
            <h4>Incident Details</h4>
                <div class="clr-row">
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Date Of Incident:<sup style="color: red">*</sup></strong></label>
                        <input type="date" name="incident_date" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Time Of Incident:<sup style="color: red">*</sup></strong></label>
                        <input type="time" name="incident_time" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Location:<sup style="color: red">*</sup></strong></label>
                        <input type="text" name="location" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>nature Of Incident:<sup style="color: red">*</sup></strong></label>
                            <select type="text" name="incident_nature" ngModel required>
                                <option></option>
                                <option>CyberSecurity Breach </option>
                                <option>Physical Security Concern</option>
                                <option>Data lost</option>
                            </select> 
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Severity Level:<sup style="color: red">*</sup></strong></label>
                            <select type="text" name="severity_level" ngModel required>
                                <option></option>
                                <option>Low </option>
                                <option>Medium</option>
                                <option>High</option>
                                <option>Critical</option>
                            </select> 
                    </div>
                </div>
        </div>
            <div class="card">
                <div class="card-header" style="text-align: left; color: black; background-color: lightgreen;">{{'common.description' | translate}}</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Description Of Incident:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="incident_desc" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Immediate Action Taken:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="immediate_action" ngModel required>
                        </div>
                    </div>
                </div>
                <div class="card-header" style="text-align: left; color: white; background-color: rgb(154, 107, 230);"> Responsible Parties </div>
                <div class="card-block">
                    <h4>Primary Point Of Contact</h4>
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Name:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="name" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Contact Information:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="contact_info" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Other Relevant Teams/Individuals Notified:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="other_relevant" ngModel required>
                        </div>
                    </div>
                </div>        
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left;color: black; background-color: rgb(182, 212, 14);"> Recommendation</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Recommendation For Mitigation:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="mitigation" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Preventive Measures:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="preventive_measures" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Follow Up Action Planned:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="follow_up_action" ngModel required>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left;color: white; background-color: rgb(212, 103, 14);"> Additional Informations</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Attachments:<sup style="color: red">*</sup></strong></label>
                            <input type="file" name="attachments" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Additional Comments:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="add_comments" ngModel required>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
        <div class="card-footer">
            <button class="btn btn-primary"(click)="save(newForm)">{{'common.submit' | translate}}</button>
            <!-- <button class="btn btn-danger"(click)="isNew=false">{{'common.close' | translate}}</button> -->
        </div>
</div>
