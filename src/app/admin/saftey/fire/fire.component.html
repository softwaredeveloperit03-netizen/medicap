
<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue; margin-top: -2px; text-align: left;"> Fire Map:</div>
            <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/admin/saftey" style="background-color: red; color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
<div>

 <form #signsafetyform="ngForm">
    <div class="card-block">
        <div class="card-text">
            <h4> Map Details</h4>
            <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Date Created:</b><span style="color: red;">*</span></label>
                    <input type="date" name="created_date" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Buldings/Plant Name:</b><span style="color: red;">*</span></label>
                    <input type="text" name="bulding" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Floor/Level:</b><span style="color: red;">*</span></label>
                    <input type="text" name="floor" ngModel required>
                </div>
            </div>
        </div>
    </div>
    <div class="card">
     <div class="card-header" style="text-align: left; color: black; background-color: rgb(96, 189, 212);">Fire Hazard Zone</div>
        <div class="card-block">
          <div class="clr-row">
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><b>Zones:</b></label>
                <select type="text" name="zone" ngModel required>
                    <option></option>
                    <option>High Risk</option>
                    <option>Moderate Risk</option>
                    <option>Low Risk</option>
                </select>
            </div>
        </div>
      </div>
    </div>
    <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(96, 193, 223);">Emergency Exit</div>
           <div class="card-block">
            <h4>Provide Details On The Location Of Emergency Exit</h4>
             <div class="clr-row">
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Detailed Emergency Exit:</b></strong></label>
                   <input type="text" name="detaile" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Exit Routes:</b></strong></label>
                   <input type="text" name="routes" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Evacuation Assembly Points By:</b></strong></label>
                <input type="text" name="assembly_point" ngModel required>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Emergency Exit Door:</b></strong></label>
                <input type="text" name="exit_door" ngModel required>
              </div>
           </div>
         </div>
       </div>
       <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(96, 193, 223);">Fier Safety Equipment</div>
           <div class="card-block">
            <h4>Location Of the Fier Safety Equipment </h4>
             <div class="clr-row">
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Fire Safety Equipment Details:</b></strong></label>
                   <input type="text" name="detaile" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Fire Extinguisher:</b></strong></label>
                   <input type="text" name="extinsuisher" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Fire Hoses :</b></strong></label>
                <input type="text" name="fire_hoses" ngModel required>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Emergency Alarm Pull Station:</b></strong></label>
                <input type="text" name="alarm_station" ngModel required>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Assembly Points:</b></strong></label>
                <input type="text" name="asembly_point" ngModel required>
              </div>
           </div>
         </div>
       </div>
       <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(96, 193, 223);">Emergency Contacts</div>
           <div class="card-block">
            <h4> Detail the steps employee should follow during fire evacuation</h4>
             <div class="clr-row">
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Contacts For Fire Department:</b></strong></label>
                   <input type="text" name="dept_contact" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Security Personnel:</b></strong></label>
                   <input type="text" name="security_peron" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Evacuation Procedure  :</b></strong></label>
                <input type="text" name="evacuation_presure" ngModel required>
              </div>
              
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>How To Use Fire Exit:</b></strong></label>
                <input type="text" name="use_fire" ngModel required>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Assembly Points Procedure:</b></strong></label>
                <input type="text" name="assembly_point" ngModel required>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Action to take if unable to the resular evacuation reute:</b></strong></label>
                <input type="text" name="rute" ngModel required>
              </div>
           </div>
         </div>
       </div>
       <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(96, 193, 223);">Review & Update</div>
           <div class="card-block">
             <div class="clr-row">
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Review Date:</b></strong></label>
                   <input type="date" name="review_date" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Review By:</b></strong></label>
                   <input type="text" name="review_by" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Additional Notes (If Any)  :</b></strong></label>
                <input type="text" name="note" ngModel >
              </div>
              
           </div>
         </div>
       </div>
</form>
</div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="save(signsafetyform)">{{'common.submit' | translate}}</button>
    </div>
</div>
