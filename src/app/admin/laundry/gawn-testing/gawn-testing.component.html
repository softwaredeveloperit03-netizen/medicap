<div class="container-fluid">
    <div class="card">
        <div class="card-header" style="text-align: center">
          <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Gowns Testing Report</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
              <button class="btn btn-sm" routerLink="/admin/laundry" style="background-color: red;color: white;">
                <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
              </button>
            </div>
          </div>
        </div>
        <div class="card-block">
            <div class="card-text">
              <form #FormData="ngForm">
                <div class="clr-row">
                      <div class="clr-col-md-12 clr-col-12">
                        <label><strong>Gown Type:</strong></label>
                        <input ngModel type="text" name="gown_type" required>
                      </div>
                      <div class="clr-col-md-12 clr-col-12">
                        <label><strong>Fabric Type:</strong></label>
                        <input ngModel type="text" name="fabric_type" required>
                      </div>
                  
                      <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Color:<span style="color: red;">*</span></label>
                        <input type="text" name="color" ngModel required>
                      </div>
                      <div class="clr-col-lg-4">
                        <label>Button Type:</label>
                        <select>
                          <option>Mettal</option>
                          <option>PVC</option>
                         </select>
                      </div>
                      
                     <div class="clr-col-lg-4 clr-col-md-4">
                       <label>Up-Load Certificates:<span style="color: red;">*</span></label>
                       <select name="gst_type" ngModel required>
                          <option value="IGST">IGST</option>
                          <option value="GST">SGST & CGST</option>
                      </select>
                      </div>
                      
                    </div>
              </form>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="save(FormData)">{{'common.save' | translate}}</button>
        </div>
    </div>
</div>
