<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Scrap Material Master</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/admin/scrap/list-material" style="background-color: red;color: white;"> CLOSE
            </button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #changeform="ngForm">
                <div class="clr-row">
                    <div class="clr-col-xl-4 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Material Name<span style="color: red;">*</span></label>
                        <input type="text" name="scrap_name" ngModel required >
                     </div>
                    <div class="clr-col-xl-4 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Source of Material<span style="color: red;">*</span></label>
                        <input type="text" name="scrap_source" ngModel required >
                     </div>
                    <!-- <div class="clr-col-xl-4 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Pack Size<span style="color: red;">*</span></label>
                        <input type="number" name="pack_size" ngModel required #pack_size="ngModel">
                        <span style="color: red;" *ngIf="pack_size.invalid && pack_size.touched">Please Enter Pack Size</span>
                    </div> -->
                    <div class="clr-col-xl-4 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>{{'common.department' | translate}}<span style="color: red;">*</span></label>
                        <input type="text" name="cas_name" ngModel required >
                     </div>
                    <!-- <div class="clr-col-xl-4 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Source of Material<span style="color: red;">*</span></label>
                        <input type="text" name="scrap_source" ngModel required >
                     </div> -->
                    <div class="clr-col-lg-4 clr-col-sm-4 clr-col-xs-6">
                        <label>GST:<span style="color: red;">*</span></label>
                        <select name="gst" ngModel>
                            <option></option>
                            <option *ngFor="let gs of gsts">{{gs.gst}}</option>
                            
                        </select>
                    </div>
                    <div class="clr-col-lg-4 clr-col-sm-4 clr-col-xs-6">
                        <label>HSN:</label>
                        <input type="number" name="hsn" ngModel #hsn="ngModel"
                            minlength="4" maxlength="8">
                        <span style="color: red;" *ngIf="hsn.invalid && hsn.touched">Numbers only 4 to 8
                        </span>
                    </div>
                    <div class="clr-col-lg-4 clr-col-sm-4 clr-col-xs-6">
                        <label>Rate:</label>
                        <input type="number" name="hsn1" ngModel #hsn="ngModel"
                            minlength="4" maxlength="8">
                        <span style="color: red;" *ngIf="hsn.invalid && hsn.touched">Numbers only 4 to 8
                        </span>
                    </div>
                    <div class="clr-col-lg-4 clr-col-sm-4 clr-col-xs-6">
                        <label>Rate Unit:</label>
                        <input type="number" name="hsn2" ngModel #hsn="ngModel"
                            minlength="4" maxlength="8">
                        <span style="color: red;" *ngIf="hsn.invalid && hsn.touched">Numbers only 4 to 8
                        </span>
                    </div>

                        <form #makeform ="ngForm">

                                </tr>
                                <tr>

                                    <td style="padding: 0px;">
                                        <input type="text" name="make" ngModel required style="margin: 0px;height: 33px;">

                                    <td style="padding: 0px; vertical-align: middle;"><button class="btn btn-sm  btn-info" (click)="adddata(makeform)">{{'common.add' | translate}}</button></td>

                                </tr>
                            </table>
                        </form> 
                    </div> -->
                </div>
            </form>
          
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" type="button" (click)="save(changeform)" [disabled]="changeform.invalid">{{'common.save' | translate}}</button>
    </div>
</div>
