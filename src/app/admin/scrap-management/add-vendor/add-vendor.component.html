                            <div *ngIf="country=='India'" class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12"
                                (change)="getCity($event.target.value)">
                                <label><strong>State:</strong></label>
                                <select name="state_name" [(ngModel)]="state_name">
                                    <option></option>
                                    <option *ngFor="let state of states">{{state.state_name}}</option>
                                </select>
                            </div>
                            <div *ngIf="country!='India'" class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                <label><strong>State:</strong></label>
                                <input type="text" name="state_name" [(ngModel)]="state_name">
                            </div>

                            <div *ngIf="vendor_subtype=='Local'"
                                class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                <label><strong>District:</strong></label>
                                <input name="district" [(ngModel)]="district">
                            </div>

                            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                <label><strong>City:</strong></label>
                                <input type="text" name="city" [(ngModel)]="city">
                            </div>

                            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                <label><strong>Postal Code:</strong></label>
                                <input type="number" name="pincode" [(ngModel)]="pincode">
                            </div>
                            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                <label><strong>Telephone(R):</strong></label>
                                <input type="number" name="tel_no1" [(ngModel)]="tel_no1">
                            </div>
                            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                <label><strong>Mobile No:</strong></label>
                                <input type="number" name="mobile_no" [(ngModel)]="mobile_no">
                            </div>
                            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                                <label><strong>Emergency Contact:</strong></label>
                                <input type="number" name="tel_no2" [(ngModel)]="tel_no2">
                            </div>
                            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                <label>GST Applicable:<sup style="color: red">*</sup></label>
                                <select name="gst_applicable" [(ngModel)]="gst_applicable" required>
                                    <option>Yes</option>
                                    <option>No</option>
                                </select>
                            </div>
                            <div *ngIf="gst_applicable=='Yes'"
                                class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                <label>GST Type:<sup style="color: red">*</sup></label>
                                <select name="gst_type" ngModel required>
                                    <option>GST</option>
                                    <option>IGST</option>
                                </select>
                            </div>
                            <div *ngIf="gst_applicable=='Yes'"
                                class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                                <label>GST No.:<sup style="color: red">*</sup></label>
                                <input type="text" name="gst_no" ngModel required>
                            </div>
                        </div>
                    </div>
                </div>

             
                <h3>Attachments:</h3>
                <div class="clr-row">
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>GST Certificate:</label>
                        <input type="file" name="gst_certificate" ngModel accept="application/pdf"
                            (change)="onFileChanged($event, 'gst_certificate')">
                    </div>
                    
                </div>

            </form>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="addVendor(vendorForm)" [disabled]="vendorForm.invalid">{{'common.submit' | translate}}</button>
    </div>
</div>
