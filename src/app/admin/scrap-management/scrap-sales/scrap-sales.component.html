<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Scrap Scale Record </div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/admin/scrap" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <form #newForm="ngForm"> 
            <div class="card-text">
                <h4>Scrap Details:</h4>
                 <div class="clr-row">
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Scrap Items:<sup style="color: red">*</sup></strong></label>
                        <select type="text" name="scrap_items" ngModel>
                            <option></option> 
                            <option> Defective Packaging </option>
                            <option> Contaminated Raw Materials</option>
                            <option> Damaged or Broken Tablets/Capsule</option>
                            <option> Rejected API</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Date Of Scrap:<sup style="color: red">*</sup></strong></label>
                        <input type="date" name="scrap_date" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Quantity:<sup style="color: red">*</sup></strong></label>
                        <input type="text" name="quantity" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Reason For Scrap:<sup style="color: red">*</sup></strong></label>
                        <select type="text" name="scrap_reason" ngModel>
                            <option></option> 
                            <option> Defective</option>
                            <option> Contaminated </option>
                            <option> Obsolate</option>
                            <option> Excess </option>
                        </select>                    
                    </div>
                </div>

                <h4>Source Information:</h4>

                <div class="clr-row">
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Source :<sup style="color: red">*</sup></strong></label>
                        <input type="text" name="source" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Source Location:<sup style="color: red">*</sup></strong></label>
                        <input type="text" name="source_location" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Responsible Employee :<sup style="color: red">*</sup></strong></label>
                        <input type="text" name="responsible_emp" ngModel required>
                    </div>
                </div>

                <h4>Disposal Information:</h4>

                <div class="clr-row">
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Scrap Disposal Method :<sup style="color: red">*</sup></strong></label>
                        <select type="text" name="scrap_disposal" ngModel>
                            <option></option> 
                            <option> Recycling</option>
                            <option> Discarding </option>
                            <option> Reselling </option>
                        </select> 
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Disposal Date:<sup style="color: red">*</sup></strong></label>
                        <input type="date" name="disposal_date" ngModel required>
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Comments/Notes :<sup style="color: red">*</sup></strong></label>
                        <input type="text" name="comments" ngModel required>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left; color: black; background-color: lightgreen;">Approval</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Approved By:<sup style="color: red">*</sup></strong></label>
                            <select type="text" name="aproved_by" ngModel>
                                <option></option>
                                <option>Scrap-sales Officer</option>
                                <option>Scrap-sales Manager</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Approved Date:<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="approved_date" ngModel>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="save(newForm)">{{'common.save' | translate}}</button>    
        </div>
</div>
