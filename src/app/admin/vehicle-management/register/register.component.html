<div class="card">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-lg-9" style="color: aliceblue; margin-top: -2px; text-align: left;">Vehicle Register</div>
      <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px;">
        <button class="btn btn-sm btn-success" routerLink="/admin/vehicle-management/new" *ngIf="isuser == 'Yes'">
          {{ 'common.new' | translate }}
        </button>
        <button class="btn btn-sm btn-danger" routerLink="/admin/vehicle-management">{{ 'common.close' | translate }}</button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <table class="table">
      <tr>
        <th style="background-color: rgb(14, 67, 112); color: white;">Vehicle Category</th>
        <th style="text-align: center; background-color: rgb(14, 67, 112); color: white;">Vehicle Type</th>
        <th style="text-align: center; background-color: rgb(14, 67, 112); color: white;">Vehicle Model</th>
        <th style="text-align: center; background-color: rgb(14, 67, 112); color: white;">Make Company</th>
        <th style="text-align: center; background-color: rgb(14, 67, 112); color: white;">Colour</th>
        <th style="text-align: center; background-color: rgb(14, 67, 112); color: white;">Engine Number</th>
        <th style="text-align: center; background-color: rgb(14, 67, 112); color: white;">Chassis Number</th>
      </tr>
      <tr *ngFor="let item of results">
        <td style="text-align: center;">{{ item.vehicle_category }}</td>
        <td style="text-align: center;">{{ item.vehicle_type }}</td>
        <td style="text-align: center;">{{ item.vehicle_model }}</td>
        <td style="text-align: center;">{{ item.make_company }}</td>
        <td style="text-align: center;">{{ item.colour }}</td>
        <td style="text-align: center;">{{ item.engine_no }}</td>
        <td style="text-align: center;">{{ item.chassis_no }}</td>
      </tr>
    </table>
  </div>
</div>
