<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Vehicle Management</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-danger" routerLink="/admin/vehicle-management">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
     
      <div class="card-block">
        <div class="card-text">
          <form #vendorForm="ngForm">
            <div class="clr-row">
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Vehicle Category:</strong><sup style="color: red">*</sup></label>
                <select name="vehicle_category" ngModel="Manufacturer"  (change)="checkType($event.target.value)">
                  <option>Company Owned</option>
                  <option>Private Owned</option>
                  <option>Employee Vehicle</option>
                  <option>Contract Vehicle</option>
                  <option>Temporary Hire</option>

                  <!-- <option>Manufacturer + Supplier</option> -->
                </select>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Vehicle Type:</strong><sup style="color: red">*</sup></label>
                <select name="vehicle_type" ngModel >
                  <option>Car</option>
                  <option>Auto </option>
                  <option>Rickshaw</option>
                  <option>Bus</option>
                  <option>Motorcycle</option>
                  <option>Cycle</option>
                  <option>Transport Vehicle</option>
                </select>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Vehicle Model:</strong></label>
                <input type="text" name="vehicle_model" ngModel >
          
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Make Company:</strong></label>
                <input type="text" name="make_company" ngModel >
  
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Colour:</strong></label>
                <input type="text" name="colour" ngModel >
  
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Engine Number:</strong></label>
                <input type="number" name="engine_no" ngModel >
  
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Chassis Number:</strong></label>
                <input type="text" name="chassis_no" ngModel >
  
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Registration  Number:</strong></label>
                <input type="text" name="registration_no" ngModel >
  
              </div>
              
              
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Purpose Of Vehicle:</strong></label>
                <input type="text" name="purpose_vehicle" ngModel >
              </div>
              <div class="clr-col-lg-12 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <h3><strong>Insurance Details:</strong></h3>
               
              </div>
              <br><br>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong> Insurance No. :</strong></label>
                <input type="text" name="insurance_no" >
               
              </div>
            
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong> Insurance Company:</strong></label>
                <input type="text" name="insurance_company" ngModel>
              </div>
              
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Date Of Insurance:</strong></label>
                <input type="date" name="entry_date">
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Valid Till:</strong></label>
                <input type="date" name="end_date">
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Email Id:</strong></label>
                <input type="text"  id="email" name="email"                        >
                  
              </div>
              <!-- <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Email Id:</strong></label>
                <input type="text" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,3}$" id="email" name="email"
                        ngModel #email="ngModel">
                    <div *ngIf="email.errors &&(email.touched || email.dirty)" style="color: red">
                        <div [hidden]="!email.errors?.pattern">
                            Invalid pattern
                        </div>
                    </div>
              </div> -->
              
            

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Agent No.:</strong></label>
                <input type="number" name="agent_no">
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Insurance Type:</strong></label>
                <input type="text" name="insurance_type">
              </div>
              
              
             
              
             
            </div>

          <div class="card-footer">
            <button class="btn btn-primary" (click)="save(vendorForm)"  [disabled]="vendorForm.invalid">{{'common.submit' | translate}}</button>
          </div>
          </form>
        </div>
      </div>
  </div>
