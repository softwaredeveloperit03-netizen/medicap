<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Asset Record Entry
        </div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-danger" routerLink="/admin/assetManagement">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #assetRecordForm="ngForm">
          <div class="clr-row">
  
 
           
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12-clr-col-xs-12">
              <label><strong>Department :- <span style="color: red;">*</span></strong></label>
              <select  name="department" ngModel required  (change)="getLoactions($event.target.value)">
                <option></option>
                <option *ngFor="let dept of departments;" value="{{dept.department_name}}">{{dept.department_name}}</option>
              </select>
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12-clr-col-xs-12">
              <label><strong>Location :- <span style="color: red;">*</span></strong></label>
              <select  name="location" ngModel required  >
                <option></option>
                <option *ngFor="let loc of locations;" value="{{loc.section_name}}">{{loc.section_name}}</option>
              </select>
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12-clr-col-xs-12">
              <label><strong>Asset Name :- <span style="color: red;">*</span></strong></label>
              <select  name="assetNo" [(ngModel)]="assetNo" required  (change)="checkAssest($event.target.value)">
                <option></option>
                <option *ngFor="let ass of assets;" value="{{ass.assetNo}}">{{ass.assetName}} - ( {{ass.assetNo}} )</option>
                <option style="color: red;" value="ADD NEW"><strong>ADD NEW</strong></option>
              </select>
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12-clr-col-xs-12">
              <label><strong>No. Of. Asset :- <span style="color: red;">*</span></strong></label>
                <input type="text" name="noOfAssets" ngModel  required>
            </div>

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12-clr-col-xs-12">
              <label><strong>Cost Center :- <span style="color: red;">*</span></strong></label>
                <input type="number" name="costCenter" ngModel  required>
            </div>

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12-clr-col-xs-12">
              <label><strong>Desc. Of Asset :- <span style="color: red;">*</span></strong></label>
                <textarea rows="3" name="descOfAsset" ngModel  required></textarea>
            </div>

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12-clr-col-xs-12">
              <label><strong>Conditions Of Asset :- <span style="color: red;">*</span></strong></label>
                <textarea rows="3" name="conditionOfAsset" ngModel  required></textarea>
            </div>
          </div>

        </form>
      </div>
    </div>
    <div class="card-footer">
      <button  class="btn btn-success" (click)="saveAssetRecord(assetRecordForm)">{{'common.submit' | translate}}</button>
      <button  class="btn btn-danger"  routerLink="/admin/assetManagement">{{'common.close' | translate}}</button>
    </div>
  </div>


 
  
 <clr-modal [(clrModalOpen)]="isAddAsset" [clrModalSize]="'m'">
  <h3 class="modal-title">Add New Asset</h3>
  <div class="modal-body">
        <form #assetMasterForm="ngForm">
            <div class="clr-row">
                <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12-clr-col-xs-12">
                    <label><strong> Asset Name:- <span style="color: red;">*</span></strong></label>
                    <input type="text" name="assetName" ngModel  required>
                </div>
                <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12-clr-col-xs-12">
                    <label><strong>Prefix  :- <span style="color: red;">*</span></strong></label>
                    <input type="text" name="assetPrifix" ngModel placeholder="(Eg. If Asset Name Is Chair Then Prefix is CH)"  required>
                </div>
            </div>
        </form>
  </div>
  <div class="modal-footer">
      <button  class="btn btn-success" (click)="saveAssetMaster(assetMasterForm)">{{'common.submit' | translate}}</button>
      <button  class="btn btn-danger" (click)="isAddAsset=false">{{'common.close' | translate}}</button>
  </div>
</clr-modal>
