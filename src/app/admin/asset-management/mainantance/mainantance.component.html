<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Asset Maintenance Entry
        </div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-danger" routerLink="/admin/assetManagement">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #assetMaintenanceForm="ngForm">
          <div class="clr-row">
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12-clr-col-xs-12">
              <label><strong>Department :- <span style="color: red;">*</span></strong></label>
              <select  name="department"[(ngModel)]="department" required  (change)="getLoactions($event.target.value)">
                <option></option>
                <option *ngFor="let dept of departments;" value="{{dept.department_name}}">{{dept.department_name}}</option>
              </select>
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12-clr-col-xs-12">
              <label><strong>Location :- <span style="color: red;">*</span></strong></label>
              <select  name="location" [(ngModel)]="location" required  (change)="getAssetByDepartmentAndLocaton()">
                <option></option>
                <option *ngFor="let loc of locations;" value="{{loc.section_name}}">{{loc.section_name}}</option>
              </select>
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12-clr-col-xs-12">
              <label><strong>Asset Name :- <span style="color: red;">*</span></strong></label>
              <select  name="assetNo" ngModel required  >
                <option></option>
                <option *ngFor="let ass of assets;" value="{{ass.assetNo}}">{{ass.assetName}} - {{ass.assetNo}} ({{ass.noOfAssets}}) </option>
              </select>
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12-clr-col-xs-12">
              <label><strong>No. Of. Asset Maintenance :- <span style="color: red;">*</span></strong></label>
                <input type="text" name="noOfAssets" ngModel  required>
            </div>

            <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12-clr-col-xs-12">
              <label><strong>Maintenance Desc:- <span style="color: red;">*</span></strong></label>
                <input type="text" name="descOfmain" ngModel  required>
            </div>

            <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12-clr-col-xs-12">
              <label><strong>Maintenance Remark:- <span style="color: red;">*</span></strong></label>
                <input type="text" name="remark" ngModel  required>
            </div>

            <div class="clr-col-lg-4 clr-col-md-3 clr-col-sm-12-clr-col-xs-12">
              <label><strong> Make Scrap Asset :- <span style="color: red;">*</span></strong></label>
              <select  name="scrapAsset" [(ngModel)]="scrapAsset" required  >
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>

            <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12-clr-col-xs-12" *ngIf="scrapAsset=='Yes'">
              <label><strong>Scrap Remark:- <span style="color: red;">*</span></strong></label>
                <input type="text" name="scrapRemark" ngModel  required>
            </div>

            <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12-clr-col-xs-12" *ngIf="scrapAsset=='Yes'">
              <label><strong>Scrap Asset No.:- <span style="color: red;">*</span></strong></label>
                <input type="number" name="noOfScrapAssets" ngModel  required>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button  class="btn btn-success" (click)="saveAssetRecord(assetMaintenanceForm)">{{'common.submit' | translate}}</button>
      <button  class="btn btn-danger"  routerLink="/admin/assetManagement">{{'common.close' | translate}}</button>
    </div>
  </div>
