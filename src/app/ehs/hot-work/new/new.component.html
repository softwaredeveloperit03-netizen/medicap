
<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Hot Water Permit
            </div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm btn-danger" routerLink="/ehs/hot-work">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #hotwaterdata="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-4 clr-col-md-4">
                        <label>Date:</label>
                        <input type="date" name="date" [(ngModel)]="date" required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4">
                        <label>From Department:</label>
                      <select name="department_from" ngModel required>
                          <option></option>
                          <option *ngFor="let dept of departments">{{dept.department_name}}</option>
                      </select>
                        <!-- <input type="text" name="from_dept" ngModel ngModel> -->
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4">
                        <label>To Department:</label>
                        <select name="department_to" ngModel required>
                            <option></option>
                            <option *ngFor="let dept of departments">{{dept.department_name}}</option>
                        </select>
                        <!-- <input type="text" name="to_dept" ngModel required> -->
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-12">
                        <label>Details of Work:</label>
                        <textarea name="details_work" ngModel required rows="2"></textarea>
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-12">
                        <label>Location of Work:</label>
                        <input type="text" name="location" ngModel required>
                    </div>
         
                    <div class="clr-col-lg-6 clr-col-md-6">
                        <label>Validity From:</label>
                        <input type="time" name="validity_from" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6">
                        <label>Validity To:</label>
                        <input type="time" name="validity_to" ngModel required>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="card-footer"><button class="btn btn-primary" [disabled]="!hotwaterdata.form.valid" (click)="saveData(hotwaterdata)">{{'common.submit' | translate}}</button></div>
</div>
