<div class="card" *ngIf="!isNew">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-lg-6" style="color: aliceblue;margin-top: -2px;text-align: left;">
                Template for Status Card of First Aid Box
            </div>
            <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm btn-danger" routerLink="/ehs/firstaidbox">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
        <div class="card-block">
            <div class="card-text">
                <form #statusCardForm="ngForm" class="clr-row">

                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                        <label>Item Description</label>
                        <textarea name="itemdesc" rows="2" cols="100" ngModel></textarea>
                    </div>

                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>ID No.</label>
                        <input type="text" name="idNo" ngModel required>
                    </div>

                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12"> 
                    <label>{{'common.department' | translate}}</label> 
                    <select name="depart" [(ngModel)]="depart">
                        <option [ngValue]="null" disabled>--Select--</option> 
                        <option *ngFor="let data of departments" [ngValue]="data"> 
                        {{ data.department_name }} 
                        </option> 
                    </select> 
                    </div>


                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Location</label>
                        <select name="section_name" ngModel (change)="getEmpdata($event.target.selectedIndex)">
                                <option></option>
                                <option *ngFor="let person of Sections">{{ person.section_name }}</option>
                            </select>
                    </div>

                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Inspection Frequency</label>
                        <select name="inspfreq" ngModel>
                                <option value=""></option>
                                <option>3 Months</option>
                                <option>6 Months</option>
                                <option>12 Months</option>
                            </select>
                        
                    </div>

                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Responsibility</label>
                        <textarea name="resp" rows="1" cols="100" ngModel></textarea>
                    </div>

                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Approved By</label>
                       <select name="approved_by" ngModel (change)="getEmpdata($event.target.selectedIndex)">
                                <option></option>
                                <option *ngFor="let person of InvolvedPersons" >{{ person.emp_name }}</option>
                            </select>
                    </div>

                    <table class="table">
                        <tr>
                            <th>Inspected on</th>
                            <th>Next Due Date</th>
                            <th>Inspected By</th>
                        </tr>
                        <tr>
                            <td><input type="date" name="inspOn" ngModel></td>
                            <td><input type="date" name="nextdue" ngModel></td>
                            <td><select name="inspected_by" ngModel (change)="getEmpdata($event.target.selectedIndex)">
                                <option></option>
                                <option *ngFor="let person of InvolvedPersons" >{{ person.emp_name }}</option>
                            </select></td>
                        </tr>
                    </table>
                </form>
            </div>
        </div>
            <div class="card-footer">
                <button class="btn btn-primary" (click)="saveStatusCard(statusCardForm)">{{'common.save' | translate}}</button>
                <button class="btn btn-danger" routerLink="/ehs/firstaidbox">{{'common.close' | translate}}</button>
            </div>
