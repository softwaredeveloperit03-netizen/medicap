<div class="card">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Inprocess Testing Request
        Slip-ETP</div>
      <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        <button class="btn btn-sm" routerLink="/ehs/inprocess"
          style="background-color: red;color: white;">{{'common.close' | translate}}</button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <div class="card-text">
      <form #inprocess="ngForm">
        <div class="clr-row">
          <table border="1" width="100%">
            <thead>
              <tr>
                <th colspan="7">INPROCESS TEST REQUEST SLIP - ETP</th>
              </tr>
            </thead>
            <tr>
              <td>Format No :</td>
              <td> EHS001/F02-01 </td>
              <td></td>
              <td></td>
            </tr>
            <tr>
              <td>To:</td>
              <td>Qc Lab</td>
              <td>From Plant:</td>
              <td>
                <select name="plant_no" id="remove_border" ngModel required>
                  <option></option>
                  <option *ngFor="let plant of plants">{{plant.unit}}</option>
                </select>
              </td>
            </tr>
            <tr>
              <td> Privious Product:</td>
              <td>
                <select name="previous_product" id="remove_border" ngModel required>
                  <option></option>
                  <option *ngFor="let product of products" [value]="product.product_code">{{product.product_name}}
                  </option>
                </select>
              </td>
              <td>Next Product:</td>
              <td>
                <select name="next_product" id="remove_border" ngModel required>
                  <option></option>
                  <option *ngFor="let product of products" [value]="product.product_code">{{product.product_name}}
                  </option>
                </select>
              </td>
            </tr>
            <tr>
              <td>Equipment/Tank:</td>
              <td>
                <select name="sample_from" id="remove_border" ngModel required
                  (change)="checkType($event.target.value)">
                  <option></option>
                  <option>Equipment</option>
                  <option>Tank</option>
                </select>
              </td>
              <td> Equipment / Tank Code:</td>
              <td>
                <select name="equipment_code" id="remove_border" *ngIf="sample_from == 'Equipment'" ngModel required>
                  <option></option>
                  <option *ngFor="let eqp of equipments" [value]="eqp.equipment_code">{{eqp.equipment_name}}</option>
                </select>
                <select name="equipment_code" id="remove_border" *ngIf="sample_from == 'Tank'" ngModel required>
                  <option></option>
                  <option *ngFor="let tank of tanks" [value]="tank.tank_name">{{tank.tank_name}}</option>
                </select>
              </td>
            </tr>
            <tr>
              <td>Sample ID :</td>
              <td>EFFLUENT Water Sample</td>
              <td> Stage : </td>
              <td>
                <select name="stage" id="remove_border" ngModel required>
                  <option></option>
                  <option>ETP Inlet </option>
                  <option>ETP Outlet</option>
                </select>
              </td>
            </tr>
            <tr>
              <td> Sample Quantity: </td>
              <td>
                <input type="text" name="qty" style="width: 70% !important;" ngModel required>
                <select name="unit" ngModel required style="width:30% !important;">
                  <option></option>
                  <option *ngFor="let unit of Units">{{unit.unit}}</option>
                </select>
              </td>
              <td> ETP No: </td>
              <td><input type="text" name="etp_no" ngModel required></td>
            </tr>
          </table>
        </div>
      </form>
    </div>
  </div>
  <div class="card-footer">
    <button class="btn btn-primary" (click)="saveData(inprocess)">Send Sample</button>
  </div>
</div>
