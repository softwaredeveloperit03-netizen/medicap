<div class="card" *ngIf="!isNew">
    <div class="card-header text-center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-lg-6" style="color: aliceblue; margin-top: -2px; text-align: left;">
                MOCK DRILL REPORT
            </div>
        </div>
    </div>

    <div class="card-block">
        <div class="card-text">
            <form #mockdrillform="ngForm">
                <div class="clr-row">

                    <div class="clr-col-12">
                        <label>1. Mock Drill Report Number
                            <input type="text" [(ngModel)]="reportNo" name="reportNo">
                        </label>
                    </div>

                    <div class="clr-col-12">
                        <label>2. Date:
                            <input type="date" [(ngModel)]="dates" name="date">
                        </label>
                    </div>

                    <div class="clr-col-12">
                        <label>3. Location of emergency
                            <select name="section_name" ngModel (change)="getEmpdata($event.target.selectedIndex)">
                                <option></option>
                                <option *ngFor="let person of Sections">{{ person.section_name }}</option>
                            </select>
                        </label>
                    </div>

                    <div class="clr-col-12">
                        <label>4. Emergency Situation
                            <input type="text" [(ngModel)]="emergencystu" name="emergencystu">
                        </label>
                    </div>

                    <div class="clr-col-12">
                        <label>5. Time of Emergency siren Rising
                            <input type="time" [(ngModel)]="siren" name="siren">
                        </label>
                    </div>

                    <div class="clr-col-12">
                        <label>6. Time of All Clear Siren Raising:
                            <input type="time" [(ngModel)]="sirenrising" name="sirenrising">
                        </label>
                    </div>

                    <div class="clr-col-12">
                        <label>7. Names of deputed observers
                            <select name="done_by" ngModel (change)="getEmpdata($event.target.selectedIndex)">
                                <option></option>
                                <option *ngFor="let person of InvolvedPersons" >{{ person.emp_name }}</option>
                            </select>
                        </label>
                    </div>

                    <!-- Replaced table with divs -->
                    <div class="clr-col-12" style="margin-top:10px;">
                        <!-- Header Row -->
                        <div style="font-weight:bold; display:flex; gap:25px; margin-bottom:5px;">
                            <div style="width:30px;">8.</div>
                            <div style="flex:1;">Observation</div>
                            <div style="flex:1;">Recommendation</div>
                            <div style="flex:1;">{{'common.table.action' | translate}}</div>
                        </div>
                    
                        <!-- Input Row -->
                        <div style="display:flex; gap:25px; align-items:center; margin-bottom:5px;">
                            <div style="width:30px;">a</div>
                            <input type="text" name="observation" ngModel style="flex:1; padding:5px;">
                            <input type="text" name="recommendation" ngModel style="flex:1; padding:5px;">
                            <div style="flex:1;">
                                <button class="btn btn-primary" (click)="addcleaning(data.id)">{{'common.add' | translate}}</button>
                            </div>
                        </div>

                    </div>
                    <!-- End of div-based section -->

                    <div class="clr-col-12">
                        <label>9. Action Plan for improvement:
                            <input type="text" [(ngModel)]="actplan" name="actplan">
                        </label>
                    </div>

                </div>
            </form>
        </div>

        <button type="submit" class="btn btn-primary" (click)="submitMocDrill(mockdrillform)">{{'common.submit' | translate}}</button>
        <button class="btn btn-danger" routerLink="/ehs">{{'common.close' | translate}}</button>
    </div>
</div>
