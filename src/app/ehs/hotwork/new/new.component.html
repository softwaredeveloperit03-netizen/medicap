<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Excavation Work Permit
            </div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm btn-danger" routerLink="/ehs/hotwork">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
         <div class="container p-3 border rounded bg-light">
  <h5 class="text-primary fw-bold mb-3">Work Permit Checklist (EHS)</h5>
<div class="container p-3 border rounded bg-white">
  <form #ehsForm="ngForm">

    <table class="table">
        <tr>


            <td colspan="2">
               <label>Location/Equipment No</label>
                <select name="equipment" ngModel>
                  <option></option>
                  <option *ngFor="let data of equipments;" [value]="data.equipment_code">{{data.equipment_name}}</option>
                </select>
            </td>
             <td>

                    <label>{{'common.date' | translate}}</label>
                    <input type="date" [(ngModel)]="date" name="date" />

            </td>

        </tr>
        <tr>

            <td colspan="3">
                        <label>ORIGINATING DEPT</label>
                        <select     name="department_from" ngModel>
                          <option value="" disabled selected>Select Department</option>
                          <option *ngFor="let dept of departments" >{{dept.department_name}}</option>
                        </select>

            </td>


        </tr>
        <tr>

            <td colspan="3">
                        <label>EXECUTING DEPT</label>
                        <select     name="department_to" ngModel>
                          <option value="" disabled selected>Select Department</option>
                          <option *ngFor="let dept of departments" >{{dept.department_name}}</option>
                        </select>

            </td>


        </tr>
        <tr>
            <td> <label>Validity (24 hrs Format)</label></td>
            <td> <label >From</label>
      <input type="time" clrInput class="me-3 w-auto" [(ngModel)]="validFrom" name="validFrom" /></td>
            <td><label >To</label>
      <input type="time" clrInput class="w-auto" [(ngModel)]="validTo" name="validTo" /></td>
        </tr>
        <tr>
          <td colspan="3">
            <label >{{'common.description' | translate}}</label>
            <textarea name="description" ngModel id=""></textarea>
          </td>
        </tr>
    </table>

  <div class="clr-row">
       <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
          <table class="table table-bordered">

        <tr>
          <th colspan="13">A. PRECAUTIONS TAKEN BY ORIGINATING DEPT.</th>
          <th colspan="3">Done</th>
          <th colspan="2">Not Reqd.</th>
        </tr>

        <tr *ngFor="let item of precautions; let i = index">
          <td colspan="13" style="text-align: left;">
            <textarea name="item{{i}}" [(ngModel)]="item.data"></textarea>
           </td>
          <td colspan="3" class="text-center">
            <input type="radio" [name]="'precaution' + i" [(ngModel)]="item.status" value="Done" />
          </td>
          <td colspan="2" class="text-center">
            <input type="radio" [name]="'precaution' + i" [(ngModel)]="item.status" value="Not Required" />
          </td>
        </tr>


    </table>
        </div>

    </div>

        <td><strong>Originating Dept:</strong></td>

  </form>
  <b>I have personally checked the above arrangements and found correct</b>
</div>

</div>


        </div>
    </div>
    <div class="card-footer"><button class="btn btn-primary"   (click)="saveData(ehsForm)">{{'common.submit' | translate}}</button></div>
</div>
