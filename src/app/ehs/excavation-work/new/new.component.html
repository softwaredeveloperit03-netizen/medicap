<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Excavation Work Permit
            </div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm btn-danger" routerLink="/ehs/excavation-work">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
         <div class="container p-3 border rounded bg-light">
  <h5 class="text-primary fw-bold mb-3">Work Permit Checklist (EHS)</h5>
<div class="container p-3 border rounded bg-white">
  <form #ehsForm="ngForm">
    <table class="table">
        <tr>
            <td>
                        <label>Req From</label>
                        <select     name="department_from" ngModel>
                          <option value="" disabled selected>Select Department</option>
                          <option *ngFor="let dept of departments" >{{dept.department_name}}</option>
                        </select>

            </td>
            <td>
                 <clr-input-container>
                    <label>Location/Equipment No.</label>
                    <input clrInput [(ngModel)]="location" name="location" />
                </clr-input-container>
            </td>
            <td>

                    <label>{{'common.date' | translate}}</label>
                    <input clrDate [(ngModel)]="date" name="date" />

            </td>
        </tr>
        <tr>
            <td> <label>Validity (24 hrs Format)</label></td>
            <td> <label >From</label>
      <input type="time" clrInput class="me-3 w-auto" [(ngModel)]="validFrom" name="validFrom" /></td>
            <td><label >To</label>
      <input type="time" clrInput class="w-auto" [(ngModel)]="validTo" name="validTo" /></td>
        </tr>
    </table>


    <table class="table table-bordered">

        <tr>
          <th colspan="13">A. PRECAUTIONS TAKEN BY ORIGINATING DEPT.</th>
          <th colspan="3">Done</th>
          <th colspan="2">Not Reqd.</th>
        </tr>

        <tr *ngFor="let item of precautions; let i = index">
          <td colspan="13" style="text-align: left;">
            <textarea name="item{{i}}" [(ngModel)]="item.data"></textarea>
           </td>
          <td colspan="3" class="text-center">
            <input type="radio" [name]="'precaution' + i" [(ngModel)]="item.status" value="Done" />
          </td>
          <td colspan="2" class="text-center">
            <input type="radio" [name]="'precaution' + i" [(ngModel)]="item.status" value="Not Required" />
          </td>
        </tr>
        <!-- Continue for remaining points if required statically -->

    </table>

    <!-- <table class="table table-bordered">
      <tr>
        <td><strong>Originating Dept:</strong></td>
        <td><input type="text" class="form-control" name="originatingDept" [(ngModel)]="originatingDept" /></td>
        <td><strong>Executing Dept:</strong></td>
        <td><input type="text" class="form-control" name="executingDept" [(ngModel)]="executingDept" /></td>
        <td><strong>HOD ENGINEERING:</strong></td>
        <td><input type="text" class="form-control" name="hodEngineering" [(ngModel)]="hodEngineering" /></td>
        <td><strong>EHS Dept:</strong></td>
        <td><input type="text" class="form-control" name="ehsDept" [(ngModel)]="ehsDept" /></td>
      </tr>
    </table> -->
  </form>
</div>

</div>


        </div>
    </div>
    <div class="card-footer"><button class="btn btn-primary"   (click)="saveData(ehsForm)">{{'common.submit' | translate}}</button></div>
</div>
