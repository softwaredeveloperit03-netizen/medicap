<div class="camera-wrapper">
  <div class="webcam-container">
    <webcam [height]="400" [width]="400" [trigger]="triggerObservable" (imageCapture)="handleImage($event)" *ngIf="showWebcam"
      [allowCameraSwitch]="allowCameraSwitch" [switchCamera]="nextWebcamObservable" [videoOptions]="videoOptions"
      (cameraSwitched)="cameraWasSwitched($event)" (initError)="handleInitError($event)"></webcam>
  </div>
  <div class="action-buttons">
    <button type="button" class="action-btn" (click)="triggerSnapshot()" title="Take Picture">
      <span class="action-icon">📸</span>
      <span class="action-label">Take Picture</span>
    </button>
    <button type="button" class="action-btn" (click)="showNextWebcam(true)" title="Switch Camera" *ngIf="multipleWebcamsAvailable">
      <span class="action-icon">🔁</span>
      <span class="action-label">Switch Camera</span>
    </button>
  </div>
  <h4 *ngIf="errors.length > 0" class="error-title">Messages:</h4>
  <ul *ngFor="let error of errors" class="error-list">
    <li>{{ error | json }}</li>
  </ul>
</div>
