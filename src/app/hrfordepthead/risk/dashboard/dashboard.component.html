 
<div class="module">
    <div class="subdiv">
      <div class="purchase-container" >
        <div style="text-align:end" class="close-block">
          <div class="heading-container" style="margin:10px 0px">
            <h3>Risk</h3>
          </div>
          <div routerLink="/" class="name-board1"><i class="fas fa-times"></i>
          </div>
        </div>
        <div class="master-block" style="margin: 0px 10px 10px 10px !important;">
          <div class="section">
            <div class="line-container">
              <div class="heading">
                <h3>Risk Section</h3>
              </div>
            </div>
            <div class="card-block">
              <div class="icon-container" routerLink="dept_review">
                <i class="fas fa-exclamation-triangle"></i> <!-- Font Awesome icon for Deviation -->
                <span>Pending For Review</span>
              </div>
              <div class="icon-container" routerLink="final_review" *ngIf="dep_name=='Quality Assurance' && dept_head=='Yes'">
                <i class="fas fa-exclamation-triangle"></i> <!-- Font Awesome icon for Deviation -->
                <span>Final Review</span>
              </div>
  
              <div class="icon-container" routerLink="log">
                <i class="fas fa-edit"></i> <!-- Font Awesome icon for Change Control -->
                <span>Review Log</span>
              </div>
  
              
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
