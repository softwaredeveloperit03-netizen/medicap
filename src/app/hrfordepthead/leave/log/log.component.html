<div class="container-fluid" *ngIf="!isView">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
                <div class="clr-col-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Leave Status Log
                </div>
                <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                    <button class="btn btn-sm btn-primary" routerLink="/hrfordepthead/leave/new" >{{'common.new' | translate}}</button>
                    <button class="btn btn-sm btn-success" routerLink="/hrfordepthead/leave/approval" >Approval</button>
                    <button class="btn btn-sm btn-primary" routerLink="/hrfordepthead/leave/coff" >C OFF</button>
                    <button class="btn btn-sm btn-success" routerLink="/hrfordepthead/leave/coffapp" >C OFF Approval</button>
                    <button class="btn btn-sm btn-danger" routerLink="/hrfordepthead" >{{'common.close' | translate}}</button>

                </div>
            </div>
        </div>
        <div class="card-block">
            <div class="card-text">
                <table class="table table-border">
                    <tr>
                        <th style=" background-color: rgb(14, 67, 112); color: white;">{{'common.table.srNo' | translate}}</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Employee Name</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Leave From</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Leave To</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Leave Type</th>
                         <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.status' | translate}}</th>
                      </tr>
                    <tr *ngFor="let user of results; let i = index">
                        <td>{{i+1}}.</td>
                        <td style="text-align: left;">{{user.afirstname}} {{user.alastname}}</td>
                        <td style="text-align: left;">{{user.leave_from |date:'dd-MM-yyyy'}}</td>
                        <td style="text-align: left;">{{user.leave_to |date:'dd-MM-yyyy'}}</td>
                        <td style="text-align: left;">{{user.leave_type}}</td>
                        <td style="text-align: left;">{{user.status}}</td>
                    </tr>
                     
                </table>
            </div>
        </div>
        <div class="card-footer">
             <button class="btn btn-danger" routerLink="/employee-dashboard/dashboard">{{'common.cancel' | translate}}</button>
          </div>
    </div>
</div>
