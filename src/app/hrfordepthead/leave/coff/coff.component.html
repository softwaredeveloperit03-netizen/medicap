
<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-lg-3" style="color: aliceblue;margin-top: -2px;text-align: left;">Leave Form</div>
        <div class="clr-col-lg-9" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-danger" routerLink="/hrfordepthead/leave" 
            style="color: white;border: 1px solid red;">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #leaveForm="ngForm">
          <div class="clr-row">
            

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Employee:</label>
                <select name="emp_id" [(ngModel)]="emp_id" required (change)="getDeptHandover($event.target.selectedIndex)">
                  <option></option>
                  <option *ngFor="let employee of employees1;let i = index" [value]="employee.emp_id">{{ employee.firstname}} - {{employee.emp_id}}</option>
                </select>
            </div>
            
            <!-- <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Type Of Leave:</label>
              <select name="leave_type" [(ngModel)]="leave_type" required>
                <option></option>
                <option *ngFor="let leave of leavetypes">{{leave.leave_type}}</option>
                <option *ngIf="selected_emp['bal_see_OFF']!='0'">C OFF</option>
              </select>
            </div> -->

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12" >
              <label>Balance C OFF Leave :</label>
              <input type="text" name="bleave1" [(ngModel)]="selected_emp['bal_see_OFF']"   readonly>
            </div>

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12"  >
              <label>Working Dates :</label>
              <select name="work_date" [(ngModel)]="work_date" required >
                <option></option>
                <option *ngFor="let employee of selected_emp['coff_dates'];let i = index" [value]="employee.see_OFF_date"  >
                  {{ employee.see_OFF_date}}  </option>
              </select>            
            </div>

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12"  >
              <label>Leave On :</label>
              <input type="date" name="leave_from" [(ngModel)]="leave_from" (change)="calculateDays()" [max]="maxDate" required>
            </div>
            
            

            <!-- <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Leave To Date:</label>
              <input type="date" name="leave_to" [(ngModel)]="leave_to" (change)="calculateDays()" required>
            </div> -->
  
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>No. Of Day:</label>
              <input type="number" name="no_day" [(ngModel)]="no_day" readonly>
            </div>
  
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Reason For Leave:</label>
              <input type="text" name="reason_leave" ngModel required>
            </div>
   
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Select Approver:</label>
              <select name="approver" [(ngModel)]="approver" >
                <option></option>
                <option *ngFor="let res of employees" [value]="res.emp_id">{{res.firstname}} {{res.middlename}} {{res.lastname}}</option>
              </select>
            </div>

            
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="save(leaveForm)">{{'common.submit' | translate}}</button>
      <button class="btn btn-danger" routerLink="/employee-dashboard/dashboard">{{'common.cancel' | translate}}</button>
    </div>
  
  </div>
