<div class="card">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">
        Calibration Approval — {{ department || 'Dept Head' }}
      </div>
      <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        <button type="button" class="btn btn-sm btn-danger" (click)="onClose()">CLOSE</button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <div class="card-text">
      <div class="clr-row">
        <div class="clr-col-lg-5">
          <label>Search</label>
          <input type="text" placeholder="Search..." [(ngModel)]="searchQuery">
        </div>
      </div>

      <clr-datagrid [clrDgLoading]="loading">
        <clr-dg-column>Equipment</clr-dg-column>
        <clr-dg-column>Due Date</clr-dg-column>
        <clr-dg-column>Calibration Date</clr-dg-column>
        <clr-dg-column>Performed By</clr-dg-column>
        <clr-dg-column>Remark</clr-dg-column>
        <clr-dg-column>Action</clr-dg-column>

        <clr-dg-row *clrDgItems="let row of filteredRows; let i = index" [clrDgItem]="row">
          <clr-dg-cell>{{ row.equipment_name }}</clr-dg-cell>
          <clr-dg-cell>{{ row.due_date }}</clr-dg-cell>
          <clr-dg-cell>{{ row.calibration_date }}</clr-dg-cell>
          <clr-dg-cell>{{ row.performed_by || row.entry_by }}</clr-dg-cell>
          <clr-dg-cell>{{ row.remark || '—' }}</clr-dg-cell>
          <clr-dg-cell>
            <button class="btn btn-sm btn-primary" (click)="approve(i)">Approve</button>
            <button class="btn btn-sm btn-info" (click)="viewDetails(i)">View</button>
          </clr-dg-cell>
        </clr-dg-row>
      </clr-datagrid>
    </div>
  </div>
</div>

<clr-modal [(clrModalOpen)]="isViewDetails" clrModalSize="lg" [clrModalClosable]="true">
  <h3 class="modal-title">Calibration Details</h3>
  <div class="modal-body">
    <div class="clr-row">
      <div class="clr-col-lg-4"><label>Equipment</label><input type="text" readonly [value]="selectedResult.equipment_name || ''"></div>
      <div class="clr-col-lg-4"><label>Due Date</label><input type="text" readonly [value]="selectedResult.due_date || ''"></div>
      <div class="clr-col-lg-4"><label>Calibration Date</label><input type="text" readonly [value]="selectedResult.calibration_date || ''"></div>
    </div>
    <div class="clr-row" style="margin-top: 12px;">
      <div class="clr-col-12"><label>Remark</label><input type="text" readonly [value]="selectedResult.remark || ''"></div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-danger" (click)="isViewDetails = false">{{ 'common.close' | translate }}</button>
  </div>
</clr-modal>
