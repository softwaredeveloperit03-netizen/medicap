<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px">
        <div
          class="clr-col-lg-9"
          style="color: aliceblue; margin-top: -2px; text-align: left"
        >
          Shift Allocation
        </div>
        <div
          class="clr-col-lg-3"
          style="text-align: right; padding-right: 0px; margin-top: -7px"
        >
          <button
            class="btn btn-sm"
            routerLink="/hr/shift"
            style="background-color: red; color: white"
          >
            CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <div class="clr-row">
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label><strong>Departments:<sup style="color: red">*</sup>:</strong></label >
            <select  name="department" #dept="ngModel"  [(ngModel)]="department"  (change)="getEmployees($event.target.value)" required >
              <option></option>
              <option *ngFor="let dept of departments">  {{ dept.department_name }} </option>
              <option>ALL Employee</option>
            </select>
          </div>
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
  
            <label><strong>Default Weekly Off:<sup style="color: red">*</sup>:</strong></label>
            <select  name="weekly_off" [(ngModel)]="weekly_off"  (change)="addWeeklyOff()"  required>
              <option value="Monday">Monday</option>
              <option value="Tuesday">Tuesday</option>
              <option value="Wednesday">Wednesday</option>
              <option value="Thursday">Thursday</option>
              <option value="Friday">Friday</option>
              <option value="Saturday">Saturday</option>
              <option value="Sunday">Sunday</option>
            </select>
  
          </div>
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
  
            <label><strong>Default Shift:<sup style="color: red">*</sup>:</strong></label>
            <select name="shift"  [(ngModel)]="shift" (change)="addShift()"  required>
              <option></option>
              <option *ngFor="let shift of shifts; let i = index" value="{{ shift.id }}"> {{ shift.shift_name }}  ( {{ shift.start_time }} - {{ shift.end_time }} )</option>
            </select>
  
          </div>
        </div>
      </div>
    </div>
  
    <div class="card-block">
      <div class="card-text">
        <form #f="ngForm">
          <table class="table">
            <tr>
              <th style="width: 40px">Sr.</th>
              <th style="text-align: left">Employee Id</th>
              <th style="text-align: left">Employee Name</th>
              <th style="text-align: left">{{'common.designation' | translate}}</th>
              <th style="text-align: left">{{'common.department' | translate}}</th>
               <th style="text-align: left">Change Shift</th>
              <th style="text-align: left">Change WO</th>
            </tr>
            <tr *ngFor="let data of result; let i = index">
              <td style="text-align: left">{{ i + 1 }}.</td>
              <td style="text-align: left">{{ data.emp_id }}</td>
              <td style="text-align: left">{{ data.emp_name }}</td>
              <td style="text-align: left">{{ data.designation }}</td>
              <td style="text-align: left">{{ data.department }}</td>
   
              <td style="padding: 0px">
                <select name="shift{{ i }}"  [(ngModel)]="data.shift" style="margin: 0px" >
                  <option></option>
                  <option *ngFor="let shift of shifts; let i = index" value="{{ shift.id }}"> {{ shift.shift_name }}  ( {{ shift.start_time }} - {{ shift.end_time }} )</option>
                </select>
              </td>
  
              <td style="padding: 0px">
                <select  name="weekly_off" [(ngModel)]="data.weekly_off"   required style="margin: 0px">
                  <option value="Monday">Monday</option>
                  <option value="Tuesday">Tuesday</option>
                  <option value="Wednesday">Wednesday</option>
                  <option value="Thursday">Thursday</option>
                  <option value="Friday">Friday</option>
                  <option value="Saturday">Saturday</option>
                  <option value="Sunday">Sunday</option>
                </select>
              </td>
            </tr>
            <tr *ngIf="result?.length == 0">
              <td colspan="6">{{'common.noRecords' | translate}}</td>
            </tr>
          </table>
          <br />
          <div class="clr-row">
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
              <label>From Date:</label>
              <input type="date" name="from_date" [(ngModel)]="from_date" [min]="max_date"  required />
            </div>
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
              <label>To Date:</label>
              <input type="date"  name="to_date" [(ngModel)]="to_date" [min]="from_date" required />
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="save(f)">{{'common.save' | translate}}</button>
    </div>
  </div>
