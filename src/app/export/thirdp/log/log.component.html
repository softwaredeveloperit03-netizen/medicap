<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Order Confirmation Log</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/export/thirdparty1" style="background-color: red;color: white;"> CLOSE
          </button>
        </div>
      </div> 
    </div>
    <div class="card-block">
     
      <div class="card-text">
        <clr-datagrid [clrDgLoading]="loading">
              
              
          <clr-dg-column>Sr. </clr-dg-column>
          <clr-dg-column clrDgField="order_no">Order No</clr-dg-column>
          <clr-dg-column clrDgField="order_date ">Order Date</clr-dg-column>
          <clr-dg-column clrDgField="customer_name">Customer Name</clr-dg-column>
          <clr-dg-column clrDgField="product_name">Product Name</clr-dg-column>
          <clr-dg-column clrDgField="product_id">Product ID</clr-dg-column>
          <clr-dg-column clrDgField="qty">Qty</clr-dg-column>
          <clr-dg-column clrDgField="payment_status">Payment Status</clr-dg-column>
          <clr-dg-column clrDgField="order_status">Order Status</clr-dg-column>
          <!-- <clr-dg-column >{{'common.table.action' | translate}}</clr-dg-column> -->
  
      
          <clr-dg-row *clrDgItems="let user of data; let i = index" [clrDgItem]="user">
            <clr-dg-cell>{{i+1}}</clr-dg-cell>
            <clr-dg-cell>{{user.ordernumber }}</clr-dg-cell>
            <clr-dg-cell>{{user.orderdate | date: 'dd-MM-yyyy' }}</clr-dg-cell>
            <clr-dg-cell>{{user.c_name}}</clr-dg-cell>
            <clr-dg-cell>{{user.p_name}}</clr-dg-cell>
            <clr-dg-cell>{{user.p_id}}</clr-dg-cell>
            <clr-dg-cell>{{user.quantity}}</clr-dg-cell>
            <clr-dg-cell>{{user.paym_status}}</clr-dg-cell>
            <clr-dg-cell>{{user.order_status}}</clr-dg-cell>
            <!-- <clr-dg-cell><button class="btn btn-sm btn-info btn-icon" (click)="view(i)">
              <clr-icon shape="eye" class="is-info"></clr-icon>
            </button></clr-dg-cell> -->
  
          </clr-dg-row>
          
        </clr-datagrid>
      </div>
    </div>
    <div class="card-footer">
      <!-- <button class="btn btn-primary" (click)="downloadLog()">DOWNLOAD PDF</button> -->
      <button class="btn btn-danger"  routerLink="/export/thirdparty1">{{'common.close' | translate}}</button>
     
    </div>
  </div>
