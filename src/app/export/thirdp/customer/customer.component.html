<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Customer Registration Form</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/export/thirdparty1" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <form #newForm="ngForm">   
        <div class="card-text">
             <h4>Customer Details:</h4>
           
                 <div class="clr-row">
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Customer ID:<span style="color: red;">*</span></label>
                        <input type="text" name="customer_id" ngModel required>
                    </div>

                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Registration Date:<span style="color: red;">*</span></label>
                        <input type="date" name="reg_date" ngModel required>
                    </div>
                </div>
            </div>
            <div class="card-text">

                 <h4>Personnel Information:</h4>
                <div class="clr-row">
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Title:<sup style="color: red">*</sup></strong></label>
                        <select type="text" name="title" ngModel>
                            <option></option>
                            <option>Mrs. </option>
                            <option>Mr.</option>
                            <option>Miss.</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Full Name:<sup style="color: red">*</sup></strong></label>
                        <input type="text" name="full_name" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Gender:<sup style="color: red">*</sup></strong></label>
                        <select type="text" name="gender" ngModel>
                            <option></option>
                            <option>Male </option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label><strong> Date Of Birth:<sup style="color: red">*</sup></strong></label>
                        <input type="date" name="dob" ngModel required>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left; color: black; background-color: lightgreen;">Contact Information</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Email Address:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="email" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Phone Number:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="mo_no" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Address:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="address" ngModel required>
                        </div>
                    </div>
                </div>
                <div class="card-header" style="text-align: left; color: black; background-color: rgb(199, 237, 199);">Company Information(If Applicable)</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Company Name:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="c_name" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Position/Title:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="position" ngModel required>
                        </div>
                    </div>
                </div>
                <div class="card-header" style="text-align: left; color: black; background-color: rgb(199, 237, 199);">Preference</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Communication Preference:<sup style="color: red">*</sup></strong></label>
                            <select type="text" name="comn_pref" ngModel>
                                <option></option>
                                <option>{{'common.email' | translate}}</option>
                                <option>{{'common.phone' | translate}}</option>
                                <option>SMS</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Marketing  Preference:<sup style="color: red">*</sup></strong></label>
                            <select type="text" name="mark_pref" ngModel>
                                <option></option>
                                <option>Option-In</option>
                                <option>Option-Out</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            
            
            <div class="card">
                <div class="card-header" style="text-align: left; color: black;background-color: lightblue;">Additional Information</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>How Did You Hear About Us?:<sup style="color: red">*</sup></strong></label>
                            <select type="text" name="about_us" ngModel>
                                <option></option>
                                <option>Referral </option>
                                <option>Advertisement</option>
                                <option>Social Media</option>
                                <option>Linkedin</option>
                            </select>
                        </div>                          
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Comments/Notes:</label>
                            <input type="text" name="comments" ngModel>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left; color: black;background-color: pink;">Consent</div>
                <div class="card-block">
                    <div class="clr-row">                       
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>I agree to Terms & Conditions</label><br>
                            <input type="checkbox" name="term_condn" ngModel>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="save(newForm)">{{'common.save' | translate}}</button>    
        </div>
</div>
