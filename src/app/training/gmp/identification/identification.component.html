<div class="container-fluid" >
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
                <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">cGMP Training</div>
                <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                  <button class="btn btn-sm" routerLink="/training/gmp"
                        style="background-color: red;color: white;">{{'common.close' | translate}}</button>
                </div>
            </div>
        </div>
        <div class="card-block">
            <div class="card-text">
                <form #trainingForm="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-3">
                            <label style="font-weight: bolder;">Department : <span style="color: red;">*</span></label>
                            <input type="text" name="department_name"  [(ngModel)]="department_name" readonly>
                        </div>
                        <div class="clr-col-3">
                            <label style="font-weight: bolder;">Select Level : <span style="color: red;">*</span></label>
                            <select name="emp_level"   ngModel   required (change)="getEmployees($event.target.value)">
                                <option></option>
                                <option>Level 1</option>
                                <option>Level 2</option>
                                <option>Level 3</option>
                            </select>
                        </div>
                        <div class="clr-col-3">
                            <label style="font-weight: bolder;">Subject : <span style="color: red;">*</span></label>
                            <input type="text" name="subject"  [(ngModel)]="subject" required>
<!-- 
                            <select name="subject" [(ngModel)]="subject" (change)="checkOther($event.target.value)"   required >

                                <option></option>
                                <option *ngFor="let item of subject_list; ">{{item.subject}}</option>
                                <option style="color: red;">Add New</option>
                            </select> -->
                        </div>
                        <div class="clr-col-3">
                            <label style="font-weight: bolder;">Last Date Of Training: <span style="color: red;">*</span></label>
                            <input type="date" name="lastDateOfTraning"  [(ngModel)]="lastDateOfTraning" required>
                        </div>
                    </div>
  
                    <table class="table table-border">
  
                        <tr>
                            <th style="background-color: aquamarine;font-weight: bolder;text-align: left;">Select</th>
                            <th style="background-color: aquamarine;font-weight: bolder;text-align: left;">Employee Name</th>
                            <th style="background-color: aquamarine;font-weight: bolder;text-align: left;">{{'common.department' | translate}}</th>
                            <th style="background-color: aquamarine;font-weight: bolder;text-align: left;">Designation (Level) </th>
                            <th style="background-color: aquamarine;font-weight: bolder;text-align: left;">Frequency </th>
                         </tr>
                        <tr *ngFor="let emp of employees">
                            <td style="font-weight: bolder;">
                             <input type="checkbox" name="check{{i}}" [(ngModel)]="emp.check"  >
                            </td>
                            <td style="font-weight: bolder;text-align: left;">{{ emp.firstname }} {{ emp.lastname }} ( {{ emp.emp_id }} )</td>
                            <td style="font-weight: bolder;text-align: left;">{{ emp.department }} </td>
                            <td style="font-weight: bolder;text-align: left;">{{ emp.designation }} ( {{ emp.emp_level }} )</td>
                            <td style="font-weight: bolder;text-align: left;">{{ emp.frequency }} Month</td>
                        </tr>
                    </table>
                   
                </form>
            </div>
        </div>
        <div class="card-footer"  >
            <button class="btn btn-primary" (click)="saveTrainingNeeds(trainingForm)">{{'common.submit' | translate}}</button>
            <button class="btn btn-danger" routerLink="/training/gmp">{{'common.close' | translate}}</button>
        </div>
    </div>
  </div>
   
  
  <clr-modal [(clrModalOpen)]="add_subject" clrModalClosable="false">
    <h3 class="modal-title">ADD cGMP Training Subject </h3>
    <div class="modal-body">
        <form #externalForm="ngForm">
            <div class="clr-row">
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12">
                    <label>Training Category:<sup style="color: red">*</sup></label>
                    <input type="text" name="training_category" [(ngModel)]="training_category" readonly>
                </div>
                <div   class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12">
                    <label>Subject Title: <sup style="color: red">*</sup></label>
                    <input type="text" name="subject" ngModel required>
                </div>
            </div>
        </form>
  
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-primary" (click)="add_subject_name(externalForm)">{{'common.save' | translate}}</button>
        <button type="button" class="btn btn-danger" (click)="add_subject = false">{{'common.close' | translate}}</button>
  
    </div>
  </clr-modal>
