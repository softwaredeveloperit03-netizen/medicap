 
<div class="module">
  <div class="subdiv">
    <div class="purchase-container">
      <div style="text-align:end" class="close-block">
        <div class="heading-container" style="margin:10px 0px">
          <h3>Change Control</h3>
        </div>
        <div routerLink="/qa/qms" class="name-board1"><i class="fas fa-times"></i>
        </div>
      </div>

      <div class="master-block" style="margin: 0px 10px 10px 10px !important;">
        <div class="section">
          <div class="line-container">
            <div class="heading">
              <h3>Change Control Section</h3>
            </div>
          </div>
          <!-- Main-dashboard -->
          <div class="card-block" style="    
            display: grid;
            grid-template-columns: repeat(6, 150px);
            grid-gap: 35px;
            overflow-x: auto;
            max-width: 100%;">
            <div class="icon-container" *ngIf="isuser == 'Yes'" routerLink="new">
              <i class="fa fa-file-text"></i> <!-- Font Awesome icon for New Deviation -->
              <span>Initiaton Of CC</span>
            </div>
            <div class="icon-container" *ngIf="Department == 'Quality Assurance'" routerLink="officereview">
              <i class="fa fa-file-text"></i> <!-- Font Awesome icon for New Deviation -->
              <span>QA Executive / Officer Review</span>
            </div>
            <div class="icon-container" *ngIf="Department == 'Quality Assurance'" routerLink="review">
              <i class="fa fa-file-text"></i> <!-- Font Awesome icon for New Deviation -->
              <span>QA Manager Review</span>
            </div>
            <div class="icon-container"   routerLink="impact">
              <i class="fa fa-file-text"></i> <!-- Font Awesome icon for New Deviation -->
              <span>Department Impact</span>
            </div>
            <div class="icon-container"   routerLink="log">
              <i class="fa fa-file-text"></i> <!-- Font Awesome icon for New Deviation -->
              <span>Log</span>
            </div>

           
  
 

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
