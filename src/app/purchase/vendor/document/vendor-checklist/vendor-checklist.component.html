<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Vendor Checklist</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/purchase/vendor/document/new_doc"
                    style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">

            <form #vendorchecklist="ngForm">
                <div class="clr-row">
                   
 
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Checklist Heading:</strong><sup style="color: red">*</sup></label>
                        <select name="chklist_id" [(ngModel)]="chklist_id" required (change)="isAdd($event.target.value)">
                            <option></option>
                            <option *ngFor="let check of checklistHeadings ;" value="{{check.id}}">{{check.checklistpoints }}</option>
                            <option style="color: red;">ADD NEW</option>
                    
                        </select>
                    </div>
            <div class="card">
                <div class="card-header" style="text-align: center">
                    <div class="clr-row" style="margin-bottom: -10px;">
                        <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;">Checklist Details</div>
                        <div class="clr-col-lg-5" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                            
                        </div>
                    </div>
                </div>
                <div class="card-block">
            
                    <form #checkForm="ngForm">
                        <div class="clr-row">
            
                            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                                <label>Checkpoint Particulars:<span style="color: red;">*</span></label>
                                <input type="text" name="check_point" ngModel #check_point="ngModel" required>
                            </div>

                            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                <label>Evaluation Parameter:<span style="color: red;">*</span></label>
                                <select name="evaluation_parameter" [(ngModel)]="evaluation_parameter" required>
                                    <option></option>
                                    <option value="1">{{'common.remarks' | translate}}</option>
                                    <option value="2">Yes/No</option>
                                    <option value="3">Ok/Not Ok</option>
                                    <option value="4">Satisfactory/Not Satisfactory</option>
                                    <option value="5">Applicable/Not Applicable</option>
                                    <option value="6">Cleaned/Not Cleaned</option>
                                    <option value="7">Sealed/ Unsealed</option>
                                    <option value="8">Verified/ Not Verified</option>
                                    <option value="9">Covered / Uncovered</option>
                                    <option value="10">Exceptional / Above Average / Average/ Below Average / Unsatisfactory
                                    </option>
                                </select>
                            </div>
    
                            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                <button class="btn btn-success" (click)="addData(checkForm)" style="margin-top:30px;">{{'common.add' | translate}}</button>
                            </div>
                        </div>
                    </form>
            
            
                    <div class="card-text">
                        <div class="row container-fluid">
                            <table class="table table-border">
                                <tr>
                                    <th style="background-color:rgb(14, 67, 112); color: white;">{{'common.table.srNo' | translate}}</th>
                                    <th style="background-color: rgb(14, 67, 112); color: white;">Checklist Heading</th>
                                    <th style="background-color: rgb(14, 67, 112); color: white;">Evaluation Parameter</th>
                                    <th style="background-color: rgb(14, 67, 112); color: white;">{{'common.table.action' | translate}}</th>
                                </tr>
            
                                <tr *ngFor="let add of CheckList ;let i=index">
                                    <td>{{i+1}}.</td>
                                    <td style="text-align: left;">{{add.check_point}}</td>
                                    <td style="text-align: left;">{{add.evaluation_parameter}}</td>
                                    <td>
                                        <clr-icon shape="trash" class="is-error" (click)="delData(i)"></clr-icon>
                                    </td>
                                </tr>
            
                            </table>
            
                        </div>
                    </div>
                </div>
            
            </div>
                </div>
            </form>
        </div>
        <div style="position: relative;top: 0px;left: 0px;">
            <button class="btn btn-primary" (click)="saveChecklist(vendorchecklist)">{{'common.submit' | translate}}</button>
        </div>
    </div>


    <clr-modal [(clrModalOpen)]="isDIGI" clrModalSize="m" clrModalClosable="true">
        <h3 class="modal-title">Ckecklist Heading</h3>
        <div class="modal-body">
            <form #chechead="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                        <label>Checklist Heading</label>
                        <input type="text" name="checkHeading" ngModel required>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-danger" (click)="addchecklistHeading(chechead)">{{'common.save' | translate}}</button>
            <button type="button" class="btn btn-danger" (click)="isDIGI = false">{{'common.close' | translate}}</button>
        </div>
    </clr-modal>
