<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Send Checklist</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-danger" [routerLink]="['/purchase']" [queryParams]="{ category: 'Vendor Registration' }">{{'common.close' | translate}}</button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="clr-col-lg-12">
            <label>Vendor Name</label>
            <select name="vendor_no" [(ngModel)]="vendor_no" required>
                <option></option>
                <option *ngFor="let res of vendors" [value]="res.vendor_no">{{ res.vendor_name }}</option>
            </select>
        </div>
        <div class="clr-row">
            <table class="table table-border">
                <tr>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr.</th>
                    
                    <!-- <th>Vendor Name</th> -->
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">checklist No.</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Checklist Type</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Effective Date</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Entry by</th>
                    <!-- <th>Evidence</th> -->
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Entry Date</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.table.action' | translate}}</th>
                </tr>
                <tr *ngFor="let res of checklist;let i=index">
                    <td>{{ i+1 }}</td>
                    <td><input type="checkbox" name="checklist{{i}}" [(ngModel)]="res.check" required ></td>
                    <!-- <td>
                      
                    </td> -->
                    <td>{{ res.checklist_No}}</td>
                    <td>{{ res.checklist_type}}</td>
                    <td>{{ res.effective_date  | date: 'dd-MM-yyyy'}}</td>
                    <td>{{ res.entry_by }}</td>
                    <td>{{ res.entry_date  | date: 'dd-MM-yyyy'}}</td>
                    <td><button class="btn btn-primary" (click)="sendVendor(i)">Send To Qa</button></td>
               </tr>
            </table>
        </div>
    </div>
    
</div>
