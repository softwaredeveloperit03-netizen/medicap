<div class="container-fluid" *ngIf="!isView">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Log</div>
              <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" [routerLink]="['/purchase']" [queryParams]="{ category: 'Vendor Registration' }" style="background-color: red;color: white;"> CLOSE
                </button>
              </div>
            </div>
          </div>
        <div class="card-block">
            <div class="card-text">
                <table class="table">
                    <tr>
                        <th>Sr</th>
                        <th style="text-align: left;">Material Name</th>
                        <th>Grade</th>
                        
                       
                       
                   <!--      <th>{{'common.status' | translate}}</th> -->
                        <th>View</th>
                    </tr>
                    <tr *ngFor="let record of reports; let i = index">
                        <td>{{ i+1 }}.</td>
                        <td style="text-align: left;">{{ record.name}}</td>
                        <td>{{ record.grade}}</td>
                        
                       
                      <!--   <td>{{ record.status }}</td> -->
                        <td>
                            <button class="btn btn-sm btn-info" (click)="viewReviews(i)">{{'common.view' | translate}}</button>
                        </td>
                    </tr>
                    <tr *ngIf="reports?.length == 0">
                        <td colspan="7">{{'common.noRecords' | translate}}</td>
                    </tr>
                </table>
            </div>
        </div>
        <div class="card-footer"><button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button></div>
    </div>
</div>

<div class="container-fluid" *ngIf="isView">
    <div class="card">
        <div class="card-header">Log </div>
        <div class="card-block">
            <div class="card-text">
                <table class="table">
                    <tr>
                        <td style="text-align: center;width:20%;">material name:</td>
                        <td style="text-align: center;">{{ selectedReview['name'] }}</td>
                    </tr>
                    <tr>
                        <td style="text-align: center;width:20%;">grade:</td>
                        <td style="text-align: center;">{{ selectedReview['grade'] }}</td>
                    </tr>
                   
                    
                </table>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-danger" (click)="isView = false">{{'common.close' | translate}}</button>
        </div>
    </div> 
</div>
