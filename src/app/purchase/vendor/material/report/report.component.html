<div class="card" >
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-5" style="color: aliceblue;margin-top: -2px;text-align: left;">Vendor Notice</div>
        <div class="clr-col-lg-7" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-success" (click)="new()">{{'common.new' | translate}}</button>
        
          <button class="btn btn-sm" [routerLink]="['/purchase']" [queryParams]="{ category: 'Vendor Registration' }" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
     
      <div class="card-text">
          <table class="table table-border">
              <tr>
                  <th style="background-color: rgb(14,67,112); color: white;">Sr.</th>
                  <th style="background-color: rgb(14,67,112); color: white;">vendor No</th>
                  <th style="background-color: rgb(14,67,112); color: white;">Vendor Name</th>
                  <th style="background-color: rgb(14,67,112); color: white;">Notice Subject</th>
                  <th style="background-color: rgb(14,67,112); color: white;">{{'common.table.action' | translate}}</th>
              </tr>
             <tr *ngFor="let item of notice; let i = index">
                  <td>{{ i + 1 }}.</td>
                   <td>{{item.vendor_no}}</td>
                  <td>{{item.vendor_name}}</td>
                  <td >{{item.notice_subject}}</td>
                   <td ><button class="btn btn-sm btn-info" (click)="view(i)">{{'common.view' | translate}}</button></td>
              </tr>
          </table>
      </div>
    </div>
    <div class="card-footer">
      <!-- <button class="btn btn-primary"(click)="download()">{{'common.download' | translate}}</button> -->
  </div>
  </div>




    
<clr-modal [(clrModalOpen)]="ispayment">
  <h3 class="modal-title">Vendor Notice</h3>
  <div class="modal-body">
    <div class="card">
        <div class="card-block">
          <div class="card-text">
          <form #qualificationForm="ngForm">
              <div class="clr-row">
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12"  >
                  <label>Vendor:<span style="color: red">*</span></label>
                  <select name="vendor_no" [(ngModel)]="vendor_no" required >
                    <option></option>
                    <option *ngFor="let ven of vendors"  [value]="ven.vendor_no" > {{ ven.vendor_name }}</option>
                  </select>
                </div>
  
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12"  >
                  <label>Subject</label>
                  <textarea type="text" name="notice_subject" ngModel required></textarea>
                </div>

                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12"  >
                  <label>Special Note</label>
                  <textarea type="text" name="special_note" ngModel required> </textarea>
                </div>

                  
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12"  >
                  <label>Document</label>
                  <input type="file" name="notice_doc" ngModel required (change)="onFileChanged($event)"> 
                </div>

              </div>
          </form>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-primary" (click)='add_notice(qualificationForm)'>Save Notice</button>
    </div>
  </div>
</clr-modal>
  
  
<clr-modal [(clrModalOpen)]="isView">
  <h3 class="modal-title">Vendor Notice</h3>
  <div class="modal-body">
    <div class="card">
        <div class="card-block">
          <div class="card-text">
               <div class="clr-row">
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12"  >
                  <label>Vendor:<span style="color: red">*</span></label>
                  <input type="text" name="vendor_name" [(ngModel)]="selectedNotice['vendor_name']" required > 
                </div>
  
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12"  >
                  <label>Subject</label>
                  <textarea type="text" name="notice_subject"  [(ngModel)]="selectedNotice['notice_subject']" required ></textarea>
                </div>

                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12"  >
                  <label>Special Note</label>
                  <textarea type="text" name="special_note"  [(ngModel)]="selectedNotice['special_note']" required> </textarea>
                </div>

                  
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12"  >
                  <label>Document</label> <br>
                  <button  class="btn btn-sm btn-info" (click)="viewfile1(selectedNotice['notice_doc'])">View File</button>
                </div>

              </div>
         </div>
      </div>
    </div>
    <div class="modal-footer">
      <!-- <button type="button" class="btn btn-primary" (click)='add_notice(qualificationForm)'>Save Notice</button> -->
    </div>
  </div>
</clr-modal>
