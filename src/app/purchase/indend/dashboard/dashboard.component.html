<div class="indt dashboard-shell" [style.background]="selectedPalette.background">
  <div class="compact-layout">
    <aside class="compact-sidebar">
      <div class="compact-sidebar__head">
        <span class="compact-sidebar__title">Requisition Modules</span>
        <span class="compact-sidebar__count">{{ moduleCount }}</span>
      </div>
      <nav class="compact-sidebar__tabs" aria-label="Requisition modules">
        <button
          *ngFor="let tab of sidebarTabs; trackBy: trackByTabId"
          type="button"
          class="compact-nav-item"
          [class.active]="tab.id === selectedTabId"
          (click)="selectTab(tab.id)"
        >
          <i class="fas" [ngClass]="tab.icon" aria-hidden="true"></i>
          <span class="compact-nav-item__label">{{ tab.label }}</span>
          <span class="compact-nav-item__badge" *ngIf="getTabBadge(tab.id) as badge">{{ badge }}</span>
        </button>
      </nav>
    </aside>

    <div class="compact-main">
      <div class="dash-header dash-header--single-line">
        <div class="title-block">
          <h2>Requisition Management</h2>
        </div>
        <div class="header-actions-row dept-hub-header-actions">
          <div class="search-box dash-header__search">
            <i class="fas fa-search" aria-hidden="true"></i>
            <input
              type="text"
              [ngModel]="searchQuery"
              (ngModelChange)="searchQuery=$event; onSearchChange()"
              placeholder="Search by name or category"
              aria-label="Search modules"
            />
          </div>
          <a class="close-btn dept-hub-header-close" routerLink="/purchase" aria-label="Close">
            <i class="fas fa-times" aria-hidden="true"></i>
            Close
          </a>
        </div>
      </div>

      <h3 class="section-label">{{ selectedTabLabel }} · {{ filteredCards.length }} available</h3>
      <div class="tiles-grid">
        <a
          *ngFor="let card of filteredCards; trackBy: trackByCardId"
          class="tile-card"
          [routerLink]="card.route"
          [ngStyle]="{'box-shadow': selectedPalette.cardShadow}"
        >
          <div class="icon-wrap" [style.background]="card.gradient">
            <i class="fas" [ngClass]="card.icon" aria-hidden="true"></i>
            <span class="badge-count" *ngIf="card.badge">{{ card.badge }}</span>
          </div>
          <div class="tile-body">
            <div class="tile-title">{{ card.title }}</div>
            <p class="tile-description" *ngIf="card.description">{{ card.description }}</p>
          </div>
        </a>

        <div class="empty-state" *ngIf="filteredCards.length === 0">
          <i class="fas fa-search" aria-hidden="true"></i>
          <p>No modules match your search. Try another keyword or tab.</p>
        </div>
      </div>
    </div>
  </div>

  <button class="palette-fab" type="button" (click)="togglePalette()" title="Change theme" aria-label="Change theme">
    <i class="fas fa-palette" aria-hidden="true"></i>
  </button>

  <div class="palette-drawer" *ngIf="showPalette">
    <button
      *ngFor="let palette of paletteOptions"
      type="button"
      class="palette-chip"
      [class.active]="palette === selectedPalette"
      [style.background]="palette.swatch"
      [title]="palette.name"
      (click)="setPalette(palette)"
      [attr.aria-label]="'Theme ' + palette.name"
    >
      <span class="sr-only">{{ palette.name }}</span>
    </button>
  </div>
</div>
