<app-hplc-page-shell title="System Suitability" subtitle="Injection sequence · %RSD · N · T · Rs · S/N — USP &lt;621&gt;" [backLink]="back">
  <div class="hplc-actions"><button type="button" class="hplc-btn hplc-btn--primary" (click)="showForm = !showForm">{{ showForm ? 'Cancel' : 'New SST' }}</button></div>
  <div *ngIf="showForm" class="hplc-section">
    <h3>System suitability test form</h3>
    <div class="hplc-form">
      <div><label>HPLC unit</label><select [(ngModel)]="form.hplc_id"><option *ngFor="let h of demo.getInstruments()" [value]="h.id">{{ h.id }}</option></select></div>
      <div><label>Method</label><input [(ngModel)]="form.method" /></div>
      <div><label>Column ID</label><input [(ngModel)]="form.column_id" /></div>
      <div><label>Bracketing standard</label><input [(ngModel)]="form.bracket_std" /></div>
      <div><label>%RSD (n≥5)</label><input type="number" step="0.01" [(ngModel)]="form.rsd_pct" /></div>
      <div><label>Tailing factor (T)</label><input type="number" step="0.01" [(ngModel)]="form.tailing" /></div>
      <div><label>Theoretical plates (N)</label><input type="number" [(ngModel)]="form.plates" /></div>
      <div><label>Resolution (Rs)</label><input type="number" step="0.1" [(ngModel)]="form.resolution" /></div>
      <div><label>Signal / noise</label><input type="number" [(ngModel)]="form.sn" /></div>
      <div><label>Overall result</label><select [(ngModel)]="form.result"><option>Pass</option><option>Fail</option></select></div>
    </div>
    <table class="hplc-table">
      <tr><th>Parameter</th><th>Specification</th><th>ICH / USP</th></tr>
      <tr *ngFor="let p of params"><td>{{ p.param }}</td><td>{{ p.spec }}</td><td>{{ p.ich }}</td></tr>
    </table>
    <div class="hplc-sign">
      <div><label>Analyst</label><input /></div>
      <div><label>Checker</label><input /></div>
      <div><label>Approver</label><input /></div>
    </div>
    <div class="hplc-actions"><button type="button" class="hplc-btn hplc-btn--primary" (click)="save()">Save SST log</button></div>
  </div>
  <div class="hplc-section">
    <h3>SST logbook</h3>
    <table class="hplc-table">
      <tr><th>SST No</th><th>Method</th><th>HPLC</th><th>Date</th><th>%RSD</th><th>T</th><th>N</th><th>Rs</th><th>S/N</th><th>Result</th></tr>
      <tr *ngFor="let r of rows">
        <td>{{ r.sst_no }}</td><td>{{ r.method }}</td><td>{{ r.hplc_id }}</td><td>{{ r.date }}</td>
        <td>{{ r.rsd_pct }}</td><td>{{ r.tailing }}</td><td>{{ r.plates }}</td><td>{{ r.resolution }}</td><td>{{ r.sn }}</td>
        <td [class.hplc-pass]="r.result === 'Pass'" [class.hplc-fail]="r.result === 'Fail'">{{ r.result }}</td>
      </tr>
    </table>
  </div>
</app-hplc-page-shell>
