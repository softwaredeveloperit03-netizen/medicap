<app-hplc-page-shell title="Column Destruction Record" subtitle="Retirement, witness, disposal per SOP" [backLink]="back">
  <div class="hplc-actions"><button type="button" class="hplc-btn hplc-btn--primary" (click)="showForm = !showForm">{{ showForm ? 'Cancel' : 'New destruction' }}</button></div>
  <div *ngIf="showForm" class="hplc-section">
    <h3>Column destruction form</h3>
    <div class="hplc-form">
      <div><label>Column ID</label><input [(ngModel)]="form.column_id" /></div>
      <div><label>Serial no.</label><input [(ngModel)]="form.serial" /></div>
      <div><label>Total injections</label><input type="number" [(ngModel)]="form.total_injections" /></div>
      <div><label>Reason for destruction</label><input [(ngModel)]="form.reason" /></div>
      <div><label>Disposal method</label><select [(ngModel)]="form.disposal"><option>Incineration vendor</option><option>Return to manufacturer</option><option>Secure waste</option></select></div>
      <div><label>Witness (QA)</label><input [(ngModel)]="form.witness" /></div>
      <div class="full"><label>Destruction narrative</label><textarea rows="3" [(ngModel)]="form.narrative"></textarea></div>
    </div>
    <div class="hplc-sign">
      <div><label>Initiated by</label><input /></div>
      <div><label>QC Head</label><input /></div>
      <div><label>QA Approval</label><input /></div>
    </div>
    <div class="hplc-actions"><button type="button" class="hplc-btn hplc-btn--primary" (click)="save()">Record destruction</button></div>
  </div>
  <div class="hplc-section">
    <h3>Destruction log</h3>
    <table class="hplc-table">
      <tr><th>Destroy No</th><th>Column ID</th><th>Reason</th><th>Date</th><th>Witness</th><th>Status</th></tr>
      <tr *ngFor="let r of rows"><td>{{ r.destroy_no }}</td><td>{{ r.column_id }}</td><td>{{ r.reason }}</td><td>{{ r.destroy_date }}</td><td>{{ r.witness }}</td><td>{{ r.status }}</td></tr>
    </table>
  </div>
</app-hplc-page-shell>
