<app-hplc-page-shell title="Column Ordering" subtitle="Purchase order linked to approved column master" [backLink]="back">
  <div class="hplc-actions"><button type="button" class="hplc-btn hplc-btn--primary" (click)="showForm = !showForm">{{ showForm ? 'Cancel' : 'New order' }}</button></div>
  <div *ngIf="showForm" class="hplc-section">
    <h3>Column purchase order</h3>
    <p class="hplc-hint" *ngIf="!masters.length">No Approved masters. Approve a Column Master entry first.</p>
    <div class="hplc-form">
      <div>
        <label>Master reference</label>
        <select [(ngModel)]="form.master_ref" [disabled]="!masters.length">
          <option value="">— Select approved master —</option>
          <option *ngFor="let m of masters" [value]="m.master_no">{{ m.master_no }} — {{ m.column_type }}</option>
        </select>
      </div>
      <div><label>Quantity</label><input type="number" [(ngModel)]="form.qty" min="1" /></div>
      <div><label>Vendor</label><input [(ngModel)]="form.vendor" /></div>
      <div><label>PO number</label><input [(ngModel)]="form.po" /></div>
      <div><label>Expected delivery</label><input type="date" [(ngModel)]="form.expected" /></div>
      <div><label>Requested by</label><input [(ngModel)]="form.requested_by" /></div>
      <div class="full"><label>Justification</label><textarea rows="2" [(ngModel)]="form.justification"></textarea></div>
    </div>
    <div class="hplc-actions">
      <button type="button" class="hplc-btn hplc-btn--primary" [disabled]="saving || !masters.length" (click)="save()">{{ saving ? 'Saving…' : 'Submit order' }}</button>
    </div>
  </div>
  <div class="hplc-section">
    <h3>Order log</h3>
    <p class="hplc-hint" *ngIf="!rows.length">No orders yet.</p>
    <table class="hplc-table" *ngIf="rows.length">
      <tr><th>Order No</th><th>Master</th><th>Qty</th><th>Vendor</th><th>PO</th><th>Order date</th><th>Expected</th><th>Status</th></tr>
      <tr *ngFor="let r of rows"><td>{{ r.order_no }}</td><td>{{ r.master_ref }}</td><td>{{ r.qty }}</td><td>{{ r.vendor }}</td><td>{{ r.po }}</td><td>{{ r.order_date }}</td><td>{{ r.expected }}</td><td>{{ r.status }}</td></tr>
    </table>
  </div>
</app-hplc-page-shell>
