<app-hplc-page-shell title="Column Logbook" subtitle="Injection count, HPLC assignment, last use" [backLink]="back">
  <div class="hplc-section">
    <h3>Log column usage</h3>
    <p class="hplc-hint" *ngIf="!rows.length">No inventory columns. Receive and Release a column first.</p>
    <div class="hplc-form">
      <div>
        <label>Column ID</label>
        <select [(ngModel)]="form.column_id" [disabled]="!rows.length">
          <option value="">— Select column —</option>
          <option *ngFor="let r of rows" [value]="r.column_id">{{ r.column_id }}</option>
        </select>
      </div>
      <div><label>HPLC unit</label><select [(ngModel)]="form.hplc_id"><option value="">—</option><option *ngFor="let h of demo.getInstruments()" [value]="h.id">{{ h.id }} — {{ h.name }}</option></select></div>
      <div><label>Injections (this run)</label><input type="number" [(ngModel)]="form.injections" min="1" /></div>
      <div><label>Method / batch ref</label><input [(ngModel)]="form.batch_ref" /></div>
      <div><label>Analyst</label><input [(ngModel)]="form.analyst" /></div>
    </div>
    <div class="hplc-actions"><button type="button" class="hplc-btn hplc-btn--primary" [disabled]="!rows.length" (click)="logUse()">Log usage</button></div>
  </div>
  <div class="hplc-section">
    <h3>Column inventory log</h3>
    <table class="hplc-table" *ngIf="rows.length">
      <tr><th>Column ID</th><th>Type</th><th>Injections</th><th>Last used</th><th>HPLC</th><th>Status</th></tr>
      <tr *ngFor="let r of rows"><td>{{ r.column_id }}</td><td>{{ r.type }}</td><td>{{ r.injections }}</td><td>{{ r.last_used }}</td><td>{{ r.hplc }}</td><td>{{ r.status }}</td></tr>
    </table>
  </div>
</app-hplc-page-shell>
