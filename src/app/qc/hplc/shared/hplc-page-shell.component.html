<div class="hplc-page">
  <div class="hplc-page__head" role="banner">
    <div class="hplc-page__title">
      <h2>{{ title }}</h2>
      <p *ngIf="subtitle">{{ subtitle }}</p>
    </div>
    <a [routerLink]="backLink" class="hplc-btn hplc-btn--close" aria-label="Close">
      <i class="fas fa-times"></i>
      Close
    </a>
  </div>
  <p class="hplc-demo" *ngIf="showDemo && demoMode"><i class="fas fa-flask"></i> {{ demoBanner }}</p>
  <ng-content></ng-content>
</div>
