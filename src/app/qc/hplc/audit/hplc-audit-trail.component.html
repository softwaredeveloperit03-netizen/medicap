<app-hplc-page-shell title="HPLC Audit Trail" subtitle="Immutable log — column, solution, analysis, SST, calibration" [backLink]="back">
  <div class="hplc-form">
    <div><label>Filter module</label><input [(ngModel)]="filterModule" placeholder="e.g. Analysis" /></div>
    <div><label>Filter user</label><input [(ngModel)]="filterUser" /></div>
  </div>
  <table class="hplc-table">
    <tr><th>Timestamp</th><th>Module</th><th>Action</th><th>Reference</th><th>User</th><th>Detail</th></tr>
    <tr *ngFor="let r of filtered()">
      <td>{{ r.ts }}</td><td>{{ r.module }}</td><td>{{ r.action }}</td><td>{{ r.ref }}</td><td>{{ r.user }}</td><td>{{ r.detail }}</td>
    </tr>
  </table>
  <p style="font-size:11px;color:#78909c;margin-top:8px">21 CFR Part 11 — records are time-stamped; live mode writes to hplc_audit_trail via API.</p>
</app-hplc-page-shell>
