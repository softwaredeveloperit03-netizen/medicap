<app-hplc-page-shell title="HPLC Solution Log" subtitle="All preparations across instruments" [backLink]="back">
  <div class="hplc-form" style="max-width:320px">
    <div><label>Filter by HPLC</label><select [(ngModel)]="filterHplc"><option value="">All</option><option *ngFor="let h of demo.getInstruments()" [value]="h.id">{{ h.id }}</option></select></div>
  </div>
  <table class="hplc-table">
    <tr><th>Solution No</th><th>Type</th><th>Name</th><th>HPLC</th><th>Prep</th><th>Expiry</th><th>Status</th></tr>
    <tr *ngFor="let r of filtered()"><td>{{ r.sol_no }}</td><td>{{ r.type }}</td><td>{{ r.name }}</td><td>{{ r.hplc_id }}</td><td>{{ r.prep_date }}</td><td>{{ r.expiry }}</td><td>{{ r.status }}</td></tr>
  </table>
</app-hplc-page-shell>
