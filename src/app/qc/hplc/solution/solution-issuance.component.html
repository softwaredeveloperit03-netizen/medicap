<app-hplc-page-shell title="Solution Issuance" subtitle="Issue prepared solutions to analysis — HPLC-specific" [backLink]="back">
  <div class="hplc-section">
    <h3>Issue solution</h3>
    <div class="hplc-form">
      <div><label>Solution no.</label><select [(ngModel)]="form.sol_no"><option *ngFor="let s of solutions" [value]="s.sol_no">{{ s.sol_no }} — {{ s.name }}</option></select></div>
      <div><label>HPLC unit</label><select [(ngModel)]="form.hplc_id"><option *ngFor="let h of instruments" [value]="h.id">{{ h.id }}</option></select></div>
      <div><label>Issued to (analysis ref)</label><input [(ngModel)]="form.issued_to" /></div>
      <div><label>Quantity (mL)</label><input type="number" [(ngModel)]="form.qty_ml" /></div>
      <div><label>Issued by</label><input [(ngModel)]="form.issued_by" /></div>
      <div><label>Received by</label><input [(ngModel)]="form.received_by" /></div>
    </div>
    <div class="hplc-actions"><button type="button" class="hplc-btn hplc-btn--primary" (click)="issue()">Issue</button></div>
  </div>
  <div class="hplc-section">
    <h3>Issuance log</h3>
    <table class="hplc-table">
      <tr><th>Iss No</th><th>Solution</th><th>HPLC</th><th>Issued to</th><th>Qty mL</th><th>By</th><th>Date</th></tr>
      <tr *ngFor="let r of rows"><td>{{ r.iss_no }}</td><td>{{ r.sol_no }}</td><td>{{ r.hplc_id }}</td><td>{{ r.issued_to }}</td><td>{{ r.qty_ml }}</td><td>{{ r.issued_by }}</td><td>{{ r.date }}</td></tr>
    </table>
  </div>
</app-hplc-page-shell>
