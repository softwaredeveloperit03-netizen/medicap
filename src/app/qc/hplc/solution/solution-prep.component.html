<app-hplc-page-shell [title]="solutionType + ' Preparation'" [subtitle]="'Multi-HPLC — select instrument, prep, sign-off, log'" [backLink]="back">
  <div class="hplc-actions"><button type="button" class="hplc-btn hplc-btn--primary" (click)="showForm = !showForm">{{ showForm ? 'Cancel' : 'New preparation' }}</button></div>

  <div *ngIf="showForm" class="hplc-section">
    <h3>{{ solutionType }} preparation form</h3>
    <div class="hplc-form">
      <div><label>HPLC unit *</label><select [(ngModel)]="form.hplc_id"><option *ngFor="let h of instruments" [value]="h.id">{{ h.id }} — {{ h.name }} ({{ h.location }})</option></select></div>
      <div><label>Solution name / ID</label><input [(ngModel)]="form.name" /></div>
      <div><label>Method reference</label><input [(ngModel)]="form.method" /></div>
      <div *ngIf="formKind === 'mp'"><label>Mobile phase composition</label><input [(ngModel)]="form.composition" placeholder="e.g. ACN : 0.05M phosphate 40:60" /></div>
      <div *ngIf="formKind === 'mp'"><label>pH (if aqueous)</label><input type="number" step="0.1" [(ngModel)]="form.ph" /></div>
      <div *ngIf="formKind === 'mp'"><label>Filter / degas</label><select [(ngModel)]="form.degas"><option>0.45 µm Nylon + Helium sparge 10 min</option><option>0.22 µm PTFE</option></select></div>
      <div *ngIf="formKind === 'dil'"><label>Diluent type</label><input [(ngModel)]="form.diluent_type" /></div>
      <div *ngIf="formKind === 'stk'"><label>Standard / RS lot</label><input [(ngModel)]="form.rs_lot" /></div>
      <div *ngIf="formKind === 'stk'"><label>Target concentration</label><input [(ngModel)]="form.concentration" placeholder="mg/mL" /></div>
      <div><label>Prepared volume (mL)</label><input type="number" [(ngModel)]="form.volume_ml" /></div>
      <div><label>Prep date</label><input type="date" [(ngModel)]="form.prep_date" /></div>
      <div><label>Expiry date</label><input type="date" [(ngModel)]="form.expiry" /></div>
      <div><label>Balance ID</label><input [(ngModel)]="form.balance_id" /></div>
      <div><label>Weighing record ref</label><input [(ngModel)]="form.weigh_ref" /></div>
      <div *ngIf="formKind === 'dilution'"><label>Stock solution no.</label><input [(ngModel)]="form.stock_sol_no" /></div>
      <div *ngIf="formKind === 'dilution'"><label>Dilution factor</label><input [(ngModel)]="form.dilution_factor" /></div>
      <div *ngIf="formKind === 'dilution'"><label>Final concentration</label><input [(ngModel)]="form.final_conc" /></div>
      <div class="full"><label>Preparation procedure (step-wise)</label><textarea rows="4" [(ngModel)]="form.procedure"></textarea></div>
      <div class="full"><label>Reagents / solvents (lot nos.)</label><textarea rows="2" [(ngModel)]="form.materials"></textarea></div>
    </div>
    <div class="hplc-sign">
      <div><label>Prepared by</label><input [(ngModel)]="form.prepared_by" /></div>
      <div><label>Checked by</label><input /></div>
      <div><label>Approved by</label><input /></div>
    </div>
    <div class="hplc-actions"><button type="button" class="hplc-btn hplc-btn--primary" (click)="save()">Save to log</button></div>
  </div>

  <div class="hplc-section">
    <h3>{{ solutionType }} log</h3>
    <table class="hplc-table">
      <tr><th>Solution No</th><th>Name</th><th>HPLC</th><th>Prep</th><th>Expiry</th><th>Status</th></tr>
      <tr *ngFor="let r of rows"><td>{{ r.sol_no }}</td><td>{{ r.name }}</td><td>{{ r.hplc_id }}</td><td>{{ r.prep_date }}</td><td>{{ r.expiry }}</td><td>{{ r.status }}</td></tr>
    </table>
  </div>
</app-hplc-page-shell>
