<div class="container-fluid">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
                <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">UV Visible Calibration</div>
                <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                    <button class="btn btn-sm" routerLink="/qc/calibration/visible/new" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                    </button>
                </div>
            </div>
        </div>

        <div class="card-block">
            <form  [FormGroup]="visibleform">
                <div class="card-text">
                    <div class="clr-row">

                            <div class="card-block">
                                <div class="card-text">
                                    <div class="clr-row">
                                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                                            <label><strong>ID No:<sup
                                                        style="color: red">*</sup>:</strong></label>
                                            <input type="text" name="id_no" formControlName="id">
                                        </div>

                                        
                                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                                            <label><strong>Sr.No:<sup 
                                                style="color: red">*</sup>:</strong></label>                                                        
                                            <input type="text" name="sr_no" formControlName="Sr_no">
                                        </div>

                                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                                            <label><strong> Model No:<sup 
                                                style="color: red">*</sup>:</strong></label>                                                        
                                            <input type="text" name="model_no" formControlName="m_no">
                                        </div>

                                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                                            <label><strong> Make:<sup 
                                                style="color: red">*</sup>:</strong></label>                                                        
                                            <input type="text" name="make" formControlName="Make">
                                        </div>

                                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                                            <label><strong>Location:<sup 
                                                style="color: red">*</sup>:</strong></label>                                                        
                                            <input type="text" name="location" formControlName="Location">
                                        </div>


                                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                                            <label><strong>Next Calibration Due date:<sup 
                                                style="color: red">*</sup>:</strong></label>                                                        
                                            <input type="text" name="next_date" formControlName="due_date">
                                        </div>

                                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                                            <label><strong>Date of Calibration:<sup 
                                                style="color: red">*</sup>:</strong></label>                                                        
                                            <input type="date" name="date" formControlName="Date">
                                        </div>                                      
                                    </div>                               
                                </div>
                            </div>                        
                        </div>    
                    </div>
   
                


                <div class="card">
                    <div class="card-header" style="text-align: center">
                        <div class="clr-row" style="margin-bottom: -10px;">
                            <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;">Control of Absorbance</div>
                            <div class="clr-col-lg-5" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                                <button class="btn btn-sm btn-info btn-icon" (click)="toggleShow()">
                                    <clr-icon shape="eye" class="is-warning"></clr-icon>
                                </button>
                            </div>
                        </div>
                    </div>
                    

                    <!-- <div class="card-header" style="text-align: center">
                        <div class="clr-row" style="margin-bottom: -10px;">
                          <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Sulpheric Acid</div>
                        </div>
                    </div> -->
                    <div class="card-block">
                        <div class="card-text">
                            <div *ngIf="isShown" class="row container-fluid" id="div">
                               
                                <table class="table table-border">
                                    <tr>
                                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Name of Chemical</th>
                                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Qty_given</th>
                                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Qty_taken</th>
                                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.unit' | translate}}</th>
                                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Done by</th>
                                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">weighing slip</th>
                                    </tr>
                                    <tr *ngFor="let result of results; let i = index">
                                        <td>{{ i + 1 }}.</td>
                                        <td>{{ result.qty_given }}</td>
                                        <td>{{ result.qty_taken }}</td>
                                        <td>{{ result.unit }}</td>
                                        <td>{{ result.done_by }}</td>
                                       
                                        <td>
                                            <button class="btn btn-sm btn-info" (click)="view(i)">{{'common.upload' | translate}}</button>
                                        </td>
                                    </tr>
                                    <tr *ngIf="results?.length == 0">
                                        <td colspan="4">{{'common.noRecords' | translate}}</td>
                                    </tr>
                                </table>
                            </div>
                        </div>
                    </div>

              </form> 
                </div>

                <button class="btn btn-primary" (click)="save()">{{'common.submit' | translate}}</button>

        </div>
    </div>
