<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Daily pH Calibration</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/qc/calibration/meter/daily" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
  
      <div class="card-block">
        <form #meterForm="ngForm">
          <div class="card-text">
            <div class="clr-row">

                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Date:<sup style="color: red">*</sup>:</strong></label>
                    <input type="date" name="date" [(ngModel)]="date" [max]="today" required>                
                  </div>

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Standard Buffer Solution:<sup style="color: red">*</sup>:</strong></label>
                <select name="buffer" ngModel required>
                    <option>Buffer pH 4.00</option>
                    <option>Buffer pH 7.00</option>
                    <option>Buffer pH 9.20</option>
                  </select>
              </div>

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Remark:<span style="color: red;">*</span></strong></label>
                <select name="remark" ngModel required>
                    <option>Complies</option>
                    <option>Non Complies</option>
                  </select>
              </div> 

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Acceptance Criteria:<sup style="color: red">*</sup>:</strong></label>
                <select name="acceptance" ngModel required>
                    <option>±0.05 pH</option>
                  </select>        
              </div> 

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Done By/On:<sup style="color: red">*</sup>:</strong></label>
                <input type="text" name="done" ngModel  required>         
              </div>

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Checked By/On:<span style="color: red;">*</span></strong></label>
                <input type="text" name="checked" ngModel  required>  
              </div> 
            
              <hr>
            </div>
          </div>
        </form>    
      </div>  
    <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
      <button class="btn btn-success" (click)="save(meterForm)">{{'common.save' | translate}}</button>
    </div>
  </div>
</div>
