<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Preparation</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/qc/calibration/meter/prepared/prepare" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
  
      <div class="card-block">
        <form #meterForm="ngForm">
          <div class="card-text">
            <div class="clr-row">

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Date:<sup style="color: red">*</sup>:</strong></label>
                <input type="date" name="date" [(ngModel)]="date" [max]="today" required>
             
              </div>

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Time:<span style="color: red;">*</span></strong></label>
                <select name="time" [(ngModel)]="time" required >
                </select>
              </div>

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Buffer Table Name:<span style="color: red;">*</span></label>
                <input type="text" name="buffer_name" ngModel  required>  
              </div> 

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>B.No.Of Buffer table used:<sup style="color: red">*</sup>:</strong></label>
                <input type="text" name="no_of_buffer" ngModel  required>          
              </div> 

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Volume Preparation:<sup style="color: red">*</sup>:</strong></label>
                <input type="text" name="volume" ngModel  required>         
              </div>

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Prepared By:<sup style="color: red">*</sup>:</strong></label>
                <select name="prepared_by" [(ngModel)]="prepared_by" required>
                  <option>QC</option>
                  <option>QA</option> 
                  <option>Micro</option>                                   
                </select>     
              </div>           
              <hr>
            </div>
          </div>
        </form>    
      </div>  
    <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
      <button class="btn btn-success" (click)="saveEntry(entry)">{{'common.save' | translate}}</button>
    </div>
  </div>
</div>
