<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Inssurance Of Buffer</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/qc/calibration/meter/readymade/inssurance" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
  
      <div class="card-block">
        <form #meterForm="ngForm">
          <div class="card-text">
            <div class="clr-row">

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Buffer Solution Name:<sup style="color: red">*</sup>:</strong></label>
                <select name="buffer_name" ngModel required>
                    <option></option>
                    <option></option>
                    <option></option>
                    <option></option>
                  </select>
             
              </div>

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>QTY Availabe:<span style="color: red;">*</span></strong></label>
                <input type="text" name="availabe" ngModel  required>  
              </div> 

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Medicap Lot No:<sup style="color: red">*</sup>:</strong></label>
                <input type="number" name="batch_no" ngModel  required>          
              </div> 

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Lot No:<sup style="color: red">*</sup>:</strong></label>
                <input type="number" name="lot_no" ngModel  required>         
              </div>

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>QTY Issued:<span style="color: red;">*</span></strong></label>
                <input type="text" name="issued" ngModel  required>  
              </div> 
              
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>QTY Balance:<span style="color: red;">*</span></strong></label>
                <input type="text" name="balance" ngModel  required>  
              </div> 
              <hr>
            </div>
          </div>
        </form>    
      </div>  
    <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
      <button class="btn btn-success" (click)="saveform()">{{'common.save' | translate}}</button>
    </div>
  </div>
</div>
