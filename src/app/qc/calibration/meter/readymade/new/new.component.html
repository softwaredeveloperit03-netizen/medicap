<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Buffer Solution Entry</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/qc/calibration/meter/readymade/buffer" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
  
      <div class="card-block">
        <form #meterForm="ngForm">
          <div class="card-text">
            <div class="clr-row">

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Received Date:<sup style="color: red">*</sup>:</strong></label>
                <input type="date" name="received_date" [(ngModel)]="received_date" [max]="today" required>
             
              </div>

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Manufactured Name:<span style="color: red;">*</span></strong></label>
                <input type="text" name="manufactured_name" ngModel  required>  
              </div> 

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Medicap Lot No:<sup style="color: red">*</sup>:</strong></label>
                <input type="number" name="batch_no" ngModel  required>          
              </div> 

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Lot No:<sup style="color: red">*</sup>:</strong></label>
                <input type="number" name="lot_no" ngModel  required>         
              </div>

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Received QTY:<sup style="color: red">*</sup>:</strong></label>
                <input type="text" name="received_qty" ngModel  required>   
              </div>   
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Issued QTY:<sup style="color: red">*</sup>:</strong></label>
                <input type="text" name="issued_qty" ngModel  required>   
              </div> 
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Balance QTY:<sup style="color: red">*</sup>:</strong></label>
                <input type="text" name="balance_qty" ngModel  required>   
              </div>         
              <hr>
            </div>
          </div>
        </form>    
      </div>  
    <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
      <button class="btn btn-success" (click)="savebuffer(meterForm)">{{'common.save' | translate}}</button>
    </div>
  </div>
</div>
