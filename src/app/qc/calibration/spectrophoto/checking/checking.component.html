<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> SpectrophotoMeter</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-danger" routerLink="/qc/calibration/spectrophoto">{{'common.close' | translate}}</button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <table class="table">
                <tr>
                    <th>Sr.</th>
                    <th>{{'common.date' | translate}}</th>
                    <th>Time</th>
                    <th>{{'common.table.remark' | translate}}</th>
                    <th>Done By</th>
                </tr>
                <tr *ngFor="let result of results; let i = index">
                    <td>{{ i + 1 }}.</td>
                    <td>{{ result.date | date: 'dd-MM-yyyy'}}</td>
                    <td>{{ result.time }}</td>
                    <td>{{ result.remark }} </td>
                    <td>{{ result.done_by }}</td>
                </tr>
                <tr *ngIf="results?.length == 0">
                    <td colspan="5">{{'common.noRecords' | translate}}</td>
                </tr>
            </table>
        </div>
    </div>
</div>
