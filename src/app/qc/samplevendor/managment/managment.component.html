<div class="container-fluid" >
    <div class="card">
      <div class="card-header">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">   Management  From         </div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/qc/Samplevendor" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
        </div>
        </div>
      </div>
      <div class="card-block">
        <div class="card-text">
          <form #managementForm="ngForm">
            <div class="clr-row">  
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Material Type:<span style="color: red">*</span></label>
                    <select name="material_type" ngModel [(ngModel)]="material_type" required
                        (change)="getSubMaterials($event.target.selectedIndex)">
                        <option></option>
                        <option *ngFor="let data of materials;let i = index;">{{data.material_type}}</option>
                        
                     </select>
                </div>                 
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Material Sub Type:<span style="color: red">*</span></label>
                    <select name="material_subtype" [(ngModel)]="material_subtype" required
                        (change)="getMaterialsData($event.target.selectedIndex)">
                        <option></option>
                        <option *ngFor="let type of selected_material_type">{{type.material_subtype}}</option>
                    </select>
                </div>
                
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Material Name:<span style="color: red">*</span></label>
                    <select name="material_code" ngModel required  [(ngModel)]="material_code" 
                    (change)="selectMaterial($event.target.selectedIndex)">
                        <option></option>
                        <option *ngFor="let material of selected_material_Subtype" [ngValue]="material">{{
                            material['material_name'] }} - {{ material.gradeName }}</option>
                    </select>
                </div>
                
            </div>            
          </form>
        </div>
      </div>
      <div class="card-footer">  
        <button type="button" class="btn btn-success-outline" (click)="saveGatepass(managementForm)">{{'common.save' | translate}}</button>
        <button type="button" class="btn btn-outline" (click)="isNew = false">{{'common.cancel' | translate}}</button>
      </div>
    </div>
  </div>
