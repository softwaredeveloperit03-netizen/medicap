<div class="container-fluid">
    <div class="card">
        <div class="card-header" style="text-align:center;">
            <div class="clr-row" style="margin-bottom: -10px;">
                <div class="clr-col-lg-9" style="text-align: left;margin-top: -2px;">New Equipment Cleaning</div>
                <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                    <button class="btn btn-danger btn-sm" routerLink="/qc/equipments/cleaning" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
                </div>
            </div>
        </div>
        <div class="card-block">
            <div class="card-text">
                <form #clean="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                            <label>Equipment Name</label>
                            <select name="equipment_name" ngModel required (change)="onEquipmentNameChange($event.target.selectedIndex)">
                                <option value="">Select</option>
                                <option *ngFor="let eqip of equipments" [value]="eqip.equipment_name">{{ eqip.equipment_name }}</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                            <label>Equipment Code</label>
                            <select name="equipment_code" ngModel required>
                                <option value="">Select</option>
                                <option *ngFor="let eq of selectedResult['equipments']" [value]="eq.equipment_code">{{ eq.equipment_code }}</option>
                            </select>
                        </div>
                    </div>
                    <div class="clr-row">
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Clean From:</label>
                            <input type="datetime-local" name="clean_from" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Clean To:</label>
                            <input type="datetime-local" name="clean_to" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Cleaning Type:</label>
                            <select name="cleaning_type" ngModel required>
                                <option>Type A</option>
                                <option>Type B</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-12 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Operator</label>
                            <select name="clean_by" [(ngModel)]="clean_by" required>
                                <option value="">Select operator</option>
                                <option *ngFor="let ope of operators" [value]="ope.labour_name || ope.labour_no">
                                  {{ ope.labour_name || ope.labour_no }}
                                </option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="saveCleaning(clean)">{{'common.save' | translate}}</button>
        </div>
    </div>
</div>
