<div class="container-fluid">
    <div class="card">
        <div class="card-header" style="text-align:center;">
            <div class="clr-row" style="margin-bottom: -10px;">
                <div class="clr-col-lg-9" style="text-align: left;margin-top: -2px;">Equipment Usage Log</div>
                <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                    <button class="btn btn-danger btn-sm" routerLink="/qc/equipments/usages" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
                </div>
            </div>
        </div>
        <div class="card-block">
            <div class="clr-row">
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Equipment Name:</label>
                    <select name="equipment_name" [(ngModel)]="equipment_name">
                        <option value="">All</option>
                        <option *ngFor="let eq of equipmentNames" [value]="eq.equipment_name">{{ eq.equipment_name }}</option>
                    </select>
                  </div>
                <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12" style="padding-right: 1px; padding-left: 1px;">
                  <label>From Date:</label>
                  <input type="date" name="from_date" [(ngModel)]="from_date">
                </div>
                <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                  <label>To Date:</label>
                  <input type="date" name="to_date" [(ngModel)]="to_date" style="padding-right: 1px; padding-left: 1px;">
                </div>
                <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                  <button class="btn btn-danger" (click)="getEquipmentUsagesLog()" style="margin-top:30px;">{{'common.search' | translate}}</button>
                </div>
            </div>
            <div class="card-text">
                <table class="table table-border">
                    <tr>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr.</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Equipment Name</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Equipment Code</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Activity</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Usage From</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Usage To</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Operator</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Check By</th>
                      <!--   <th style="text-align: left;">{{'common.status' | translate}}</th> -->
                    </tr>    
                    <tr *ngFor="let res of results;let i=index">
                        <td style="text-align: left;">{{i+1}}</td>
                        <td style="text-align: left;">{{res.equipment_name}}</td>
                        <td style="text-align: left;">{{res.equipment_code}}</td>
                        <td style="text-align: left;">{{res.activity}}</td>
                        <td style="text-align: left;">{{res.usage_from}}</td>
                        <td style="text-align: left;">{{res.usage_to}}</td>
                        <td style="text-align: left;">{{res.operator}}</td>
                        <td style="text-align: left;">{{res.entry_by}}</td>
                     <!--    <td style="text-align: left;">{{res.status}}</td> -->
                    </tr>
                    <tr *ngIf="results?.length==0">
                        <td colspan="9">No Record Found!</td>
                    </tr>
                </table>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary"(click)="download()">{{'common.download' | translate}}</button>
        </div>
    </div>
</div>
