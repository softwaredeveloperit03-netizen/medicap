<div class="container-fluid">
    <div class="card">
        <div class="card-header" style="text-align:center;">
            <div class="clr-row" style="margin-bottom: -10px;">
                <div class="clr-col-lg-9" style="text-align: left;margin-top: -2px;">New Glassware Cleaning</div>
                <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                    <button class="btn btn-danger btn-sm" routerLink="/qc/cleaning" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
                </div>
            </div>
        </div>
        <div class="card-block">
            <div class="card-text">
                <form #clean="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                            <label>Glassware Name</label>
                            <select
                                class="form-select-field"
                                name="glassware_name"
                                [(ngModel)]="glassware_name"
                                (change)="onGlasswareNameChange()"
                                required
                            >
                                <option value="">Select</option>
                                <option *ngFor="let name of glasswareNames" [value]="name">{{ name }}</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                            <label>Glassware Code</label>
                            <select
                                class="form-select-field"
                                name="glassware_code"
                                [(ngModel)]="glassware_code"
                                (change)="onGlasswareCodeChange()"
                                required
                            >
                                <option value="">Select</option>
                                <option
                                    *ngFor="let item of filteredGlasswares.length ? filteredGlasswares : glasswares"
                                    [value]="item.glassware_no || item.id"
                                >
                                    {{ item.glassware_no || item.id }}
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="clr-row">
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Clean From:</label>
                            <input type="date" name="clean_from" [(ngModel)]="date" [max]="today" required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Clean To:</label>
                            <input type="date" name="clean_to" [(ngModel)]="clean_to" [min]="date" [max]="today" required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Cleaning Type:</label>
                            <select class="form-select-field" name="cleaning_type" [(ngModel)]="cleaning_type" required>
                                <option value="">Select</option>
                                <option value="Type A">Type A</option>
                                <option value="Type B">Type B</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-12 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Operator</label>
                            <select name="clean_by" [(ngModel)]="clean_by" required>
                                <option value="">Select operator</option>
                                <option *ngFor="let op of operators" [value]="op.labour_name || op.labour_no">
                                    {{ op.labour_name || op.labour_no }}
                                </option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="saveCleaning(clean)">{{'common.save' | translate}}</button>
        </div>
    </div>
</div>
