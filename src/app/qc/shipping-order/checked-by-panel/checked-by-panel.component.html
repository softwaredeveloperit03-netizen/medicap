<div class="checked-by-panel">
  <div class="sign-row">
    <div class="sign-cell">
      <label>{{ label }}</label>
      <div class="sign-value" *ngIf="isDone(); else pendingBlock">
        <i class="fas fa-check-circle done-icon"></i>
        {{ byName }}
      </div>
      <ng-template #pendingBlock>
        <span class="pending-text">—</span>
      </ng-template>
    </div>
    <div class="sign-cell date-cell">
      <label>Date</label>
      <div class="sign-value">{{ byDate | date:'dd-MM-yyyy' }}</div>
    </div>
    <div class="sign-action" *ngIf="canCheck && !isDone()">
      <button type="button" class="btn btn-sm btn-success" (click)="onCheck()" [disabled]="checking">
        {{ checking ? 'Checking...' : checkLabel }}
      </button>
    </div>
  </div>
</div>
