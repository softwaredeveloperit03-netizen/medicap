<div class="so-page-wrap">
  <div class="card so-form-card">
    <div class="card-header">
      <div class="clr-row header-row">
        <div class="clr-col-8">{{ formId }} — Shipping Order Form</div>
        <div class="clr-col-4 text-right">
          <button class="btn btn-sm btn-danger" routerLink="/qc/shipping-order">CLOSE</button>
        </div>
      </div>
    </div>

    <div class="card-block">
      <div class="form-title">SHIPPING ORDER FORM</div>

      <div class="clr-row form-meta">
        <div class="clr-col-lg-3"><label>Order No.</label><input type="text" [(ngModel)]="order_no" readonly /></div>
        <div class="clr-col-lg-3"><label>Quotation Ref (§1.2.1)</label><input type="text" [(ngModel)]="form.quotation_ref" /></div>
        <div class="clr-col-lg-4">
          <label>Shipping Vendor (§1.3.4) — Vendor Master</label>
          <select [(ngModel)]="selectedVendorNo" (ngModelChange)="onVendorSelect($event)" [disabled]="loadingVendors">
            <option value="">{{ loadingVendors ? 'Loading vendors...' : '-- Select shipping vendor --' }}</option>
            <option *ngFor="let v of vendors" [value]="v.vendor_no">{{ v.vendor_name }} ({{ v.vendor_no }})</option>
          </select>
        </div>
        <div class="clr-col-lg-2" style="padding-top:1.4rem">
          <button type="button" class="btn btn-sm btn-secondary" (click)="loadVendors()" [disabled]="loadingVendors">Refresh</button>
        </div>
      </div>

      <div class="address-grid">
        <div class="address-block ship-to-block">
          <div class="master-select-row">
            <label>Ship To — Client Master</label>
            <select [(ngModel)]="selectedClientCode" (ngModelChange)="onClientSelect($event)" [disabled]="loadingClients">
              <option value="">{{ loadingClients ? 'Loading clients...' : '-- Select client / contract lab --' }}</option>
              <option *ngFor="let c of clients" [value]="c.client_code">{{ clientLabel(c) }}</option>
            </select>
            <button type="button" class="btn btn-sm btn-secondary" (click)="loadClients()" [disabled]="loadingClients">Refresh</button>
          </div>
          <div class="addr-row">
            <label>Ship To</label>
            <input type="text" [(ngModel)]="form.ship_to" placeholder="Client / contract laboratory name" />
            <label class="po-label">P.O.#</label>
            <input type="text" class="po-input" [(ngModel)]="form.po_number" />
          </div>
          <label>Address</label>
          <textarea rows="4" [(ngModel)]="form.ship_to_address" placeholder="Destination address"></textarea>
        </div>

        <div class="address-block from-block">
          <div class="addr-row">
            <label>From</label>
            <span class="from-company">{{ fromInfo.company }}</span>
          </div>
          <label>Address</label>
          <div class="from-address">
            <div>{{ fromInfo.line1 }}</div>
            <div>{{ fromInfo.line2 }}</div>
            <div class="tel-fax-row">
              <span>Tel:</span>
              <input type="text" [(ngModel)]="form.from_tel" />
              <span>Fax:</span>
              <input type="text" [(ngModel)]="form.from_fax" />
            </div>
          </div>
        </div>
      </div>

      <div class="field-block">
        <label>Tests Required (§1.2.4 — list of required tests)</label>
        <textarea rows="3" [(ngModel)]="form.tests_required" placeholder="Enter tests to be performed at contract lab"></textarea>
      </div>

      <div class="sample-table-wrap">
        <table class="so-sample-table">
          <thead>
            <tr>
              <th>Lab sample #</th>
              <th>Quantity</th>
              <th>Lot/Batch#</th>
              <th>Description</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of lines">
              <td><input type="text" class="cell-input" [(ngModel)]="row.lab_sample_no" /></td>
              <td><input type="text" class="cell-input" [(ngModel)]="row.quantity" /></td>
              <td><input type="text" class="cell-input" [(ngModel)]="row.lot_batch_no" /></td>
              <td><input type="text" class="cell-input" [(ngModel)]="row.description" /></td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="add-row-bar">
        <button type="button" class="btn btn-sm btn-outline" (click)="addRow()">+ Add Row</button>
      </div>

      <div class="signoff-preview">
        <p class="hint">On submit, <strong>Packaged By</strong> is stamped from your login. <strong>Checked By</strong> is done on the view screen.</p>
      </div>
    </div>

    <div class="card-footer">
      <button class="btn btn-secondary" (click)="saveDraft()" [disabled]="saving">{{ saving ? 'Saving...' : 'Save Draft' }}</button>
      <button class="btn btn-primary" (click)="submit()" [disabled]="submitting">{{ submitting ? 'Submitting...' : 'Submit for Check' }}</button>
      <button class="btn btn-danger" routerLink="/qc/shipping-order">CLOSE</button>
    </div>
  </div>
</div>
