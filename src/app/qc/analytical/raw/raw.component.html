<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Analytical Status For Raw Material </div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qc/anat1" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
     <form #StatusForm="ngForm">
        <div class="card-text">
            <h4>Raw Material Information</h4>
                <div class="clr-row">
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Material Name :<span style="color: red;">*</span></label>
                        <input type="text" name="m_name" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Material Code/ID:<span style="color: red;">*</span></label>
                        <input type="text" name="m_code" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Supplier Name:<span style="color: red;">*</span></label>
                        <input type="text" name="supplier_name" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Supplier Code/ID:<span style="color: red;">*</span></label>
                        <input type="text" name="supllier_id" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Batch/Lot Number:<span style="color: red;">*</span></label>
                        <input type="text" name="batch_no" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Date Of Receipt:<span style="color: red;">*</span></label>
                        <input type="date" name="date_receipt" ngModel required>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left; color: black; background-color: lightgreen;">Analytical Testing</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Apperance:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="apperance" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Colour:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="colour" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Odour:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="odour" ngModel required>
                        </div>
                    </div>
                </div>
                <div class="card-header" style="text-align: left; color: white; background-color: rgb(154, 107, 230);"> Chemical Composition</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Chemical Composition(%):<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="chemical_composition" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Impurities:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="impurities" ngModel required>
                        </div>
                    </div>
                </div>    
                <div class="card-header" style="text-align: left; color: white; background-color: rgb(107, 216, 230);"> Microbial Status</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Microbial Load:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="microbial_load" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Test Method Used:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="testmethod_used" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Testing Methodology<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="testing_method" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Testing Equipment:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="test_equpment" ngModel required>
                        </div>
                    </div>
                </div>    
                <div class="card-header" style="text-align: left; color: white; background-color: rgb(107, 230, 189);"> Result</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Test Result:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="test_result" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Ref.Standard:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="ref_standard" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Comments/Remarks:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="comment" ngModel required>
                        </div>
                    </div>
                </div>        
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left;color: black; background-color: rgb(182, 212, 14);"> Review & Approval</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Reviewed By<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="reviewed_by" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Review Date :<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="reviewed_date" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Approval Status:<sup style="color: red">*</sup></strong></label>
                            <select type="text" name="approval_status" ngModel required>
                                <option></option>
                                <option>{{'common.approved' | translate}}</option>
                                <option>{{'common.pending' | translate}}</option>
                                <option>{{'common.rejected' | translate}}</option>
                            </select> 
                        </div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left;color: white; background-color: rgb(212, 103, 14);"> Authorized Signature</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Authorized Person's Name:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="head_name" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Date Of Authorization :<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="author_date" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Signature:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="sign" ngModel required>
                        </div>
                       
                    </div>
                </div>
            </div>
        </form>
    </div>
        <div class="card-footer">
            <button class="btn btn-primary"(click)="save(StatusForm)">{{'common.save' | translate}}</button>
        </div>
</div>
