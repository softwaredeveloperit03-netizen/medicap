<div class="card" *ngIf="!isView">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Calibration Of Protocol Potentiometer</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm btn-success" (click)=new()>{{'common.new' | translate}}</button>
                <button class="btn btn-sm btn-danger" routerLink="/qc/qc-calibration">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text" *ngIf="isNew">
            <form #pdaForm="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Filled Burette in ml:</label>
                        <input type="text" name="burette" [(ngModel)]="burette">
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Wt.of Empty beaker A:</label>
                        <input type="text" name="beaker" [(ngModel)]="beaker">
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Wt. of beaker + water B:</label>
                        <input type="text" name="water" [(ngModel)]="water">
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Wt. of water (B-A):</label>
                        <input type="text" name="water1" [(ngModel)]="water1">
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>ml of water (B-A/0.99602):</label>
                        <input type="text" name="water2" [(ngModel)]="water2">
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Mean:</label>
                        <input type="text" name="mean" [(ngModel)]="mean">
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Limit:</label>
                        <input type="text" name="limit" [(ngModel)]="limit">
                    </div>

                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12" style="margin-top:10px;">
                        <button class="btn btn-success" (click)="save(pdaForm)">{{'common.save' | translate}}</button>
                        <button class="btn btn-danger" (click)="isNew = false">{{'common.close' | translate}}</button>
                    </div>
                </div>
            </form>
        </div>
        <div class="card-text" *ngIf="!isNew">
            <div class="clr-row">
                <div class="clr-col-lg-12 clr-col-md-8 clr-col-sm-4 clr-col-xs-12" style="margin-top:10px;">
                    <table class="table table-border">
                        <tr>
                            <td style="text-align:left; width: 25%;">Subject :</td>
                            <td style="text-align:left"></td>
                            <td style="text-align:left; width: 25%;">Date Of Calibration </td>
                            <td style="text-align:left"></td>
                        </tr>
                        <tr>
                            <td style="text-align:left">Instrument :</td>
                            <td style="text-align:left"></td>
                            <td style="text-align:left">Next Calibration Due</td>
                            <td style="text-align:left"></td>
                        </tr>
                        <tr>
                            <td style="text-align:left">Instrument ID:</td>
                            <td style="text-align:left" colspan="3"></td>
                        </tr>
                   </table>

                   <h3>Burette Calibration:</h3>
                   <table class="table table-border">
                       <tr>
                           <th style="vertical-align: middle; background-color: rgb(14, 67, 112); color: white;">{{'common.table.srNo' | translate}}</th>
                           <th style="vertical-align: middle; background-color: rgb(14, 67, 112); color: white;">Filled Burette in ml</th>
                           <th style="vertical-align: middle; background-color: rgb(14, 67, 112); color: white;">Wt. of Empty beaker A</th>
                           <th style="vertical-align: middle; background-color: rgb(14, 67, 112); color: white;"> Wt. of beaker  + water B</th>
                           <th style="vertical-align: middle; background-color: rgb(14, 67, 112); color: white;">Wt. of water (B-A)</th>
                           <th style="vertical-align: middle; background-color: rgb(14, 67, 112); color: white;">ml of water (B-A/0.99602)</th>
                           <th style="vertical-align: middle; background-color: rgb(14, 67, 112); color: white;">Mean</th>
                           <th style="vertical-align: middle; background-color: rgb(14, 67, 112); color: white;">Limit</th>
                       </tr>
                       <tr>
                           <td rowspan="2"></td>
                           <td rowspan="2"></td>
                           <td colspan="1"></td>
                           <td colspan="1"></td>
                           <td colspan="1"></td>
                           <td colspan="1"></td>
                           <td colspan="1"></td>
                           <td rowspan="2"></td>
                       </tr>
                       <tr>
                           <td></td>
                           <td></td>
                           <td></td>
                           <td></td>
                           <td></td>
                       </tr>
                   </table>
                </div>


            </div>
            <div class="card-footer">
                <button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button>
            </div>
        </div>
    </div>
