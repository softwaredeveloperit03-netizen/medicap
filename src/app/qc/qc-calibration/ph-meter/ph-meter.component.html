<div class="card" *ngIf="!isView">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Calibration of Pico+
                pH Meter</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm btn-success" (click)=new()>{{'common.new' | translate}}</button>
                <button class="btn btn-sm btn-danger" routerLink="/qc/qc-calibration">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text" *ngIf="isNew">
            <form #bulkForm="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12" style="margin-top:10px;">
                        <label>Limit(1.63-1.73):</label>
                        <input type="number" name="limit1" [(ngModel)]="limit1">
                    </div>

                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-4" style="margin-top:10px;">
                        <label>Limit(3.96-4.06):</label>
                        <input type="number" name="limit2" [(ngModel)]="limit2">
                    </div>

                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12" style="margin-top:10px;">
                        <label>Limit(6.81-6.91):</label>
                        <input type="number" name="limit3" [(ngModel)]="limit3">
                    </div>

                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-4" style="margin-top:10px;">
                        <label>Limit(9.13-9.23):</label>
                        <input type="number" name="limit4" [(ngModel)]="limit4">
                    </div>
                    
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-4" style="margin-top:10px;">
                        <label>Slope(90%-105%):</label>
                        <input type="number" name="limit4" [(ngModel)]="limit4">
                    </div>

                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-4" style="margin-top:10px;">
                        <label>Done By:</label>
                        <select name="done" [(ngModel)]="results">
                            <option></option>
                            <option *ngFor="let data of results">{{data.done_by}}</option>
                        </select>
                    </div>

                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12" style="margin-top:10px;">
                        <button class="btn btn-success" (click)="save(bulkForm)">{{'common.save' | translate}}</button>
                        <button class="btn btn-danger" (click)="isNew = false">{{'common.close' | translate}}</button>
                    </div>
                </div>
            </form>
        </div>
        <div class="card-text" *ngIf="!isNew">
            <div class="clr-row">
                <div class="clr-col-lg-12 clr-col-md-8 clr-col-sm-4 clr-col-xs-12" style="margin-top:10px;">
                    <table class="table table-border">
                        <tr>
                           <th style="vertical-align: middle; background-color: rgb(14, 67, 112); color: white;" rowspan="3">{{'common.date' | translate}}</th>
                           <th style="vertical-align: middle; background-color: rgb(14, 67, 112); color: white;" colspan="5">Buffer Solution</th>
                           <th style="vertical-align: middle; background-color: rgb(14, 67, 112); color: white;" rowspan="3">Slope <br> (90%-105%)</th>
                           <th style="vertical-align: middle; background-color: rgb(14, 67, 112); color: white;" rowspan="3">Done By</th>
                           <th style="vertical-align: middle; background-color: rgb(14, 67, 112); color: white;" rowspan="3">Check By</th>
                           <th style="vertical-align: middle; background-color: rgb(14, 67, 112); color: white;" rowspan="3">Verify By <br>(AQA/Date)</th>
                           
                       </tr>
                        <tr>
                           <th style="vertical-align: middle; background-color: rgb(14, 67, 112); color: white;" colspan="1">1.68</th>
                           <th style="vertical-align: middle; background-color: rgb(14, 67, 112); color: white;" colspan="1">4.01</th>
                           <th style="vertical-align: middle; background-color: rgb(14, 67, 112); color: white;" colspan="1">6.86</th>
                           <th style="vertical-align: middle; background-color: rgb(14, 67, 112); color: white;" colspan="1">9.18</th>
                           <th style="vertical-align: middle; background-color: rgb(14, 67, 112); color: white;" colspan="1">12.45</th>

                       </tr>
                       <tr>
                        <th style="vertical-align: middle; background-color: rgb(14, 67, 112); color: white;">Limit <br>1.63-1.73</th>
                        <th style="vertical-align: middle; background-color: rgb(14, 67, 112); color: white;">Limit <br>3.96-4.06</th>
                        <th style="vertical-align: middle; background-color: rgb(14, 67, 112); color: white;">Limit <br>6.81-6.91</th>
                        <th style="vertical-align: middle; background-color: rgb(14, 67, 112); color: white;">Limit <br>9.13-9.23</th>
                        <th style="vertical-align: middle; background-color: rgb(14, 67, 112); color: white;">Limit <br>12.40-12.50</th>
                       </tr>

                       <tr>
                
                           <td></td>
                           <td></td>
                           <td></td>
                           <td></td>
                           <td></td>
                           <td></td>
                           <td></td>
                           <td></td>
                           <td></td>
                           <td></td>
                       </tr>
                       <tr *ngIf="results?.length == 0">
                           <td colspan="10">{{'common.noRecords' | translate}}</td>
                       </tr>
                   </table>
                </div>


            </div>
            <div class="card-footer">
                <button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button>
            </div>
        </div>
    </div>
