<div class="ipps-page-wrap">
  <div class="card ipps-form-card">
    <div class="card-header">
      <div class="clr-row header-row">
        <div class="clr-col-8">{{ formTitle }}</div>
        <div class="clr-col-4 text-right">
          <button class="btn btn-sm btn-danger" routerLink="/qc/in-process-product-sampling">CLOSE</button>
        </div>
      </div>
    </div>

    <div class="card-block">
      <div class="form-title">IN PROCESS PRODUCT SAMPLING, TESTING AND REPORTING</div>

      <div class="clr-row form-meta">
        <div class="clr-col-lg-3"><label>Form No.</label><input type="text" [(ngModel)]="form_no" readonly /></div>
        <div class="clr-col-lg-3">
          <label>Sample Type</label>
          <select [(ngModel)]="form.sample_type">
            <option *ngFor="let t of sampleTypes" [value]="t.value">{{ t.label }}</option>
          </select>
        </div>
        <div class="clr-col-lg-6">
          <label>Product (Master)</label>
          <select (ngModelChange)="onProductSelect($event)" [ngModel]="form.product_code">
            <option value="">-- Select product --</option>
            <option *ngFor="let p of products" [value]="p.product_code">{{ p.product_name }} ({{ p.product_code }})</option>
          </select>
        </div>
      </div>

      <div class="clr-row">
        <div class="clr-col-lg-6"><label>Product Name</label><input type="text" [(ngModel)]="form.product_name" /></div>
        <div class="clr-col-lg-3"><label>Product Code</label><input type="text" [(ngModel)]="form.product_code" /></div>
        <div class="clr-col-lg-3"><label>Lot Number</label><input type="text" [(ngModel)]="form.lot_number" /></div>
      </div>

      <div class="clr-row">
        <div class="clr-col-lg-3"><label>Amount of sample requested</label><input type="text" [(ngModel)]="form.amount_requested" /></div>
        <div class="clr-col-lg-3"><label>Amount of sample provided</label><input type="text" [(ngModel)]="form.amount_provided" /></div>
        <div class="clr-col-lg-3">
          <label>Provide samples to</label>
          <select [(ngModel)]="form.provide_samples_to">
            <option *ngFor="let o of provideToOptions" [value]="o">{{ o }}</option>
          </select>
        </div>
        <div class="clr-col-lg-3">
          <label>Testing required?</label>
          <select [(ngModel)]="form.testing_required">
            <option>No</option><option>Yes</option>
          </select>
        </div>
      </div>

      <div class="field-block">
        <label>Reason</label>
        <textarea rows="3" [(ngModel)]="form.reason" placeholder="Reason for sampling"></textarea>
        <small class="hint" *ngIf="form.testing_required === 'Yes'">
          Complete Analytical Test Request Form <a routerLink="/qc/analytical-test-request/new">FQC-005-06-A</a> if testing is required.
        </small>
      </div>

      <div class="signoff-grid">
        <div class="sign-block">
          <label>Requested by</label>
          <input type="text" [(ngModel)]="form.requested_by" />
          <label>Date</label>
          <input type="date" [(ngModel)]="form.requested_date" />
        </div>
        <div class="sign-block">
          <label>Sampled by</label>
          <input type="text" [(ngModel)]="form.sampled_by" />
          <label>Date</label>
          <input type="date" [(ngModel)]="form.sampled_date" />
        </div>
      </div>
    </div>

    <div class="card-footer">
      <button class="btn btn-secondary" (click)="saveDraft()" [disabled]="saving">{{ saving ? 'Saving...' : 'Save Draft' }}</button>
      <button class="btn btn-primary" (click)="submit()" [disabled]="submitting">{{ submitting ? 'Submitting...' : 'Submit Request' }}</button>
      <button class="btn btn-danger" routerLink="/qc/in-process-product-sampling">CLOSE</button>
    </div>
  </div>
</div>
