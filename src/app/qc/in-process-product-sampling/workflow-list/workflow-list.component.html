<div class="card">
  <div class="card-header">
    <div class="clr-row header-row">
      <div class="clr-col-8">{{ title }}</div>
      <div class="clr-col-4 text-right"><button class="btn btn-sm btn-danger" routerLink="/qc/in-process-product-sampling">CLOSE</button></div>
    </div>
  </div>
  <div class="card-block">
    <clr-datagrid [clrDgLoading]="loading">
      <clr-dg-column>Sr.</clr-dg-column>
      <clr-dg-column>Form No.</clr-dg-column>
      <clr-dg-column>Product</clr-dg-column>
      <clr-dg-column>Lot #</clr-dg-column>
      <clr-dg-column>Type</clr-dg-column>
      <clr-dg-column>Lab #</clr-dg-column>
      <clr-dg-column>Action</clr-dg-column>
      <clr-dg-row *clrDgItems="let r of results; let i = index" [clrDgItem]="r">
        <clr-dg-cell>{{ i + 1 }}</clr-dg-cell>
        <clr-dg-cell>{{ r.form_no }}</clr-dg-cell>
        <clr-dg-cell>{{ r.product_name }}</clr-dg-cell>
        <clr-dg-cell>{{ r.lot_number }}</clr-dg-cell>
        <clr-dg-cell>{{ r.sample_type }}</clr-dg-cell>
        <clr-dg-cell>{{ r.lab_number || '—' }}</clr-dg-cell>
        <clr-dg-cell><button class="btn btn-sm btn-info" (click)="open(r)">Proceed</button></clr-dg-cell>
      </clr-dg-row>
    </clr-datagrid>
    <p *ngIf="!loading && results.length === 0" class="empty-msg">No pending records.</p>
  </div>
</div>
