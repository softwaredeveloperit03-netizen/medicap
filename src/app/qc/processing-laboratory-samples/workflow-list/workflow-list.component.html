<div class="card">
  <div class="card-header">
    <div class="clr-row header-row">
      <div class="clr-col-8">{{ title }}</div>
      <div class="clr-col-4 text-right">
        <button class="btn btn-sm btn-danger" routerLink="/qc/processing-laboratory-samples">Close</button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <clr-datagrid [clrDgLoading]="loading">
      <clr-dg-column>Sr.</clr-dg-column>
      <clr-dg-column>Form No.</clr-dg-column>
      <clr-dg-column>Chemical</clr-dg-column>
      <clr-dg-column>Medicap Code</clr-dg-column>
      <clr-dg-column>Lot #</clr-dg-column>
      <clr-dg-column>Status</clr-dg-column>
      <clr-dg-column>Action</clr-dg-column>
      <clr-dg-row *clrDgItems="let r of results; let i = index" [clrDgItem]="r">
        <clr-dg-cell>{{ i + 1 }}</clr-dg-cell>
        <clr-dg-cell>{{ r.form_no }}</clr-dg-cell>
        <clr-dg-cell>{{ r.chemical_name }}</clr-dg-cell>
        <clr-dg-cell>{{ r.medicap_code }}</clr-dg-cell>
        <clr-dg-cell>{{ r.medicap_lot }}</clr-dg-cell>
        <clr-dg-cell>{{ statusLabel(r.status) }}</clr-dg-cell>
        <clr-dg-cell><button class="btn btn-sm btn-primary" (click)="open(r)">Open</button></clr-dg-cell>
      </clr-dg-row>
    </clr-datagrid>
  </div>
</div>
