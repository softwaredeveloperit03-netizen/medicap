<div class="card">
  <div class="card-header">
    <div class="clr-row">
      <div class="clr-col-8"><strong>{{ title }}</strong></div>
      <div class="clr-col-4 text-right"><button class="btn btn-sm btn-danger" routerLink="/qc/finished-product-sampling">CLOSE</button></div>
    </div>
  </div>
  <div class="card-block">
    <div *ngIf="loading">Loading...</div>
    <table class="table table-compact" *ngIf="!loading">
      <thead>
        <tr><th>Form No.</th><th>Product</th><th>Lot No.</th><th>Batch Type</th><th>Entry Date</th><th></th></tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of results">
          <td>{{ item.form_no }}</td>
          <td>{{ item.product_name }}</td>
          <td>{{ item.lot_no }}</td>
          <td>{{ item.batch_type }}</td>
          <td>{{ item.entry_date | date:'dd-MM-yyyy' }}</td>
          <td><button class="btn btn-sm btn-primary" (click)="open(item)">Open</button></td>
        </tr>
        <tr *ngIf="!results.length"><td colspan="6">No pending records.</td></tr>
      </tbody>
    </table>
  </div>
</div>
