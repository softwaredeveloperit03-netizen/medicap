<div class="dashboard-shell qc-sub-hub" [style.background]="selectedPalette.background">
  <div class="dash-header">
    <div class="title-block"><h2>{{ dashboardTitle }}</h2></div>
    <div class="header-actions-row">
      <div class="search-box"><i class="fas fa-search"></i><input type="text" [(ngModel)]="searchQuery" placeholder="Search modules" /></div>
      <a class="close-btn" [routerLink]="closeRouterLink"><i class="fas fa-times"></i> Close</a>
    </div>
  </div>
  <h3 class="section-label">{{ sectionLabel }}</h3>
  <div class="tiles-grid">
    <a *ngFor="let card of getFilteredCards(); trackBy: trackByCardId" class="tile-card" [routerLink]="card.route" [ngStyle]="{'box-shadow': selectedPalette.cardShadow}">
      <div class="icon-wrap" [style.background]="card.gradient"><i class="fas" [ngClass]="card.icon"></i></div>
      <div class="tile-body"><div class="tile-title">{{ card.title }}</div><div class="tile-desc" *ngIf="card.description">{{ card.description }}</div></div>
    </a>
  </div>
</div>
