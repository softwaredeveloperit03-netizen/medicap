<div class="card">
  <div class="card-header">
    <div class="clr-row">
      <div class="clr-col-8"><strong>Finished Product Sampling Register</strong></div>
      <div class="clr-col-4 text-right"><button class="btn btn-sm btn-danger" routerLink="/qc/finished-product-sampling">CLOSE</button></div>
    </div>
  </div>
  <div class="card-block">
    <div class="clr-row filter-row">
      <div class="clr-col-lg-3"><label>From</label><input type="date" [(ngModel)]="from_date" /></div>
      <div class="clr-col-lg-3"><label>To</label><input type="date" [(ngModel)]="to_date" /></div>
      <div class="clr-col-lg-3">
        <label>Status</label>
        <select [(ngModel)]="statusFilter">
          <option *ngFor="let o of statusOptions" [value]="o.value">{{ o.label }}</option>
        </select>
      </div>
      <div class="clr-col-lg-3" style="padding-top:1.4rem"><button class="btn btn-primary" (click)="loadLogs()">Search</button></div>
    </div>

    <div *ngIf="loading">Loading...</div>
    <table class="table table-compact" *ngIf="!loading">
      <thead>
        <tr>
          <th>Form No.</th><th>Product</th><th>Lot No.</th><th>Lab #</th><th>Status</th><th>Entry Date</th><th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let log of logs">
          <td>{{ log.form_no }}</td>
          <td>{{ log.product_name }}</td>
          <td>{{ log.lot_no }}</td>
          <td>{{ log.lab_number || '—' }}</td>
          <td>{{ statusLabel(log.status) }}</td>
          <td>{{ log.entry_date | date:'dd-MM-yyyy' }}</td>
          <td><button class="btn btn-sm btn-link" (click)="view(log)">View</button></td>
        </tr>
        <tr *ngIf="!logs.length"><td colspan="7">No records found.</td></tr>
      </tbody>
    </table>
  </div>
</div>
