<div class="container-fluid" *ngIf="!isView">    
  <div class="card">
            <div class="card-header" style="text-align: center">
              <div class="clr-row" style="margin-bottom: -10px;">
                <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Validation Log</div>
                <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                  <button class="btn btn-sm" routerLink="/qc/validation/process" style="background-color: red;color: white;"> CLOSE
                  </button>
                </div>
              </div>
            </div>
          <div class="card-block">
              <div class="card-text">
                  <table class="table">
                      <tr>
                          <th>Sr</th>
                          <th style="text-align: left;">Product Code</th>
                          <th style="text-align: left;">Reason</th>
                          <th style="text-align: left;">Required change</th> 
                          <th style="text-align: left;">Batch Size</th>
                          <th style="text-align: left;">{{'common.status' | translate}}</th>
                          <th style="text-align: left;">{{'common.table.action' | translate}}</th>
                      </tr>
                      <tr *ngFor="let item of results;let i = index">
                          <td >{{ i+1 }}.</td>
                          <td style="text-align: left;">{{item.product_code}}</td>
                          <td style="text-align: left;">{{item.reason}}</td>
                          <td style="text-align: left;">{{item.change_required}}</td>
                          <td style="text-align: left;">{{item.batch_size}}</td>
                          <td style="text-align: left;">{{item.status}}</td>
                          <td  style="text-align: left;">
                              <button class="btn btn-sm btn-info" (click)="view(i)">{{'common.view' | translate}}</button>
                          </td>
                      </tr>
                  </table>
              </div>
          </div>
  </div>
</div>

<div class="container-fluid" *ngIf="isView">
  <div class="card">
      <div class="card-header">Validation Log</div>
      <div class="card-block">
          <div class="card-text">
              <div class="clr-row">
              <div class="clr-col-xl-4 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                  <label>Product Code :</label>
                  <input type="text" name="product_code" [ngModel]="selectresults['product_code']" readonly tabindex="-1">
              </div>
              <div class="clr-col-xl-4 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                  <label>Reason:</label>
                  <input type="text" name="reason" [ngModel]="selectresults['reason']" readonly tabindex="-1">
              </div>
              <div class="clr-col-xl-4 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                  <label>Change Required</label>
                  <input type="text" name="pack_size" [ngModel]="selectresults['change_required']" readonly tabindex="-1">
              </div>
              <div class="clr-col-xl-4 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                  <label>Batch Size :</label>
                  <input type="text" name="batch_size" [ngModel]="selectresults['batch_size']" readonly tabindex="-1">
              </div>
              <div class="clr-col-xl-4 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                  <label>Entry By</label>
                  <input type="text" name="entry_by" [ngModel]="selectresults['entry_by']" readonly tabindex="-1">
              </div>
              <div class="clr-col-xl-4 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                  <label>Entry Date</label>
                  <input type="text" name="entry_date" [ngModel]="selectresults['entry_date']" readonly tabindex="-1">
              </div>
              </div>
          </div>
      </div>
      <div class="card-footer">
          <button class="btn btn-danger" (click)="isView=false">{{'common.close' | translate}}</button>
      </div>
  </div>
</div>
