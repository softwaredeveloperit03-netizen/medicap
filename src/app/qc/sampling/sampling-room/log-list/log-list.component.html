<div class="card">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-8" style="color: aliceblue; margin-top: -2px; text-align: left;">Sampling Room Usage and Cleaning Log Register</div>
      <div class="clr-col-4" style="text-align: right; padding-right: 0; margin-top: -7px;">
        <button class="btn btn-sm btn-danger" routerLink="/qc/sampling/sampling-room">Close</button>
      </div>
    </div>
  </div>

  <div class="card-block">
    <div class="clr-row" style="margin-bottom: 1rem;">
      <div class="clr-col-lg-3">
        <label>From Date</label>
        <input type="date" [(ngModel)]="from_date" />
      </div>
      <div class="clr-col-lg-3">
        <label>To Date</label>
        <input type="date" [(ngModel)]="to_date" />
      </div>
      <div class="clr-col-lg-3" style="padding-top: 1.4rem;">
        <button class="btn btn-primary" (click)="loadLogs()">Search</button>
      </div>
    </div>

    <clr-datagrid [clrDgLoading]="loading">
      <clr-dg-column>Sr.</clr-dg-column>
      <clr-dg-column>Sheet No.</clr-dg-column>
      <clr-dg-column>Log Date</clr-dg-column>
      <clr-dg-column>Entries</clr-dg-column>
      <clr-dg-column>Status</clr-dg-column>
      <clr-dg-column>Entry By</clr-dg-column>
      <clr-dg-column>Action</clr-dg-column>

      <clr-dg-row *clrDgItems="let log of logs; let i = index" [clrDgItem]="log">
        <clr-dg-cell>{{ i + 1 }}</clr-dg-cell>
        <clr-dg-cell>{{ log.sheet_no }}</clr-dg-cell>
        <clr-dg-cell>{{ log.log_date | date:'dd-MM-yyyy' }}</clr-dg-cell>
        <clr-dg-cell>{{ log.entry_count }}</clr-dg-cell>
        <clr-dg-cell><strong>{{ log.status | uppercase }}</strong></clr-dg-cell>
        <clr-dg-cell>{{ log.entry_by_name || log.entry_by }}</clr-dg-cell>
        <clr-dg-cell>
          <button class="btn btn-sm btn-info" (click)="viewLog(log)">View</button>
        </clr-dg-cell>
      </clr-dg-row>
    </clr-datagrid>
  </div>

  <div class="card-footer">
    <button class="btn btn-danger" routerLink="/qc/sampling/sampling-room">Close</button>
  </div>
</div>
