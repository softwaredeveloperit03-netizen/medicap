<div class="dashboard-shell" [style.background]="selectedPalette.background">
  <ng-container *ngIf="getFilteredCards() as cards">
    <div class="compact-layout" [class.compact-layout--collapsed]="sidebarCollapsed">
      <aside class="compact-sidebar" [class.compact-sidebar--collapsed]="sidebarCollapsed">
        <div class="compact-sidebar__head">
          <span class="compact-sidebar__title" *ngIf="!sidebarCollapsed">Sampling</span>
          <span class="compact-sidebar__count" *ngIf="!sidebarCollapsed">{{ cards.length }}</span>
          <button
            type="button"
            class="sidebar-toggle"
            (click)="toggleSidebar()"
            [attr.aria-label]="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
            [attr.title]="sidebarCollapsed ? 'Expand' : 'Collapse'"
          >
            <i class="fas" [ngClass]="sidebarCollapsed ? 'fa-chevron-right' : 'fa-chevron-left'"></i>
          </button>
        </div>

        <nav class="compact-sidebar__tabs" aria-label="Sampling module groups">
          <app-sidebar-guide-link
            moduleId="sampling"
            [section]="selectedCategory !== 'All' ? selectedCategory : 'Sampling'"
            [title]="dashboardTitle || 'Sampling'"
          ></app-sidebar-guide-link>
          <button
            *ngFor="let tab of sidebarTabs; trackBy: trackBySidebarTab"
            type="button"
            class="compact-nav-item"
            [class.active]="tab.category === selectedCategory"
            (click)="selectCategory(tab.category)"
            [attr.title]="tab.label"
          >
            <i class="fas" [ngClass]="tab.icon" aria-hidden="true"></i>
            <span class="compact-nav-item__label" *ngIf="!sidebarCollapsed">{{ tab.label }}</span>
          </button>
        </nav>
      </aside>

      <div class="compact-main">
        <header class="dash-header dash-header--single-line">
          <div class="title-block">
            <h2>{{ dashboardTitle }}</h2>
          </div>
          <div class="header-actions-row dept-hub-header-actions">
            <div class="search-box dash-header__search">
              <i class="fas fa-search"></i>
              <input
                type="text"
                [(ngModel)]="searchQuery"
                placeholder="Search modules"
                aria-label="Search modules"
              />
            </div>
            <app-floating-docs-popup class="dash-header__docs"></app-floating-docs-popup>
            <a class="close-btn dept-hub-header-close" [routerLink]="closeRouterLink" aria-label="Close">
              <i class="fas fa-times"></i>
              Close
            </a>
          </div>
        </header>

        <nav class="dept-toolbar" aria-label="Department quick links">
          <a
            *ngFor="let link of deptToolbarLinks; trackBy: trackByToolbarLink"
            class="dept-toolbar__link"
            [routerLink]="link.route"
            [hidden]="!isToolbarLinkVisible(link)"
            [attr.title]="link.label"
          >
            <i class="fas" [ngClass]="link.icon" aria-hidden="true"></i>
            <span>{{ link.label }}</span>
          </a>
        </nav>

        <h3 class="section-label">
          {{ getSectionLabel() }}
          <small class="section-label__count">{{ cards.length }} module(s)</small>
        </h3>

        <div class="tiles-grid">
          <a
            *ngFor="let card of cards; trackBy: trackByCardId"
            class="tile-card"
            [routerLink]="card.route"
            [attr.data-category]="card.category"
            [ngStyle]="{ 'box-shadow': selectedPalette.cardShadow }"
          >
            <div class="icon-wrap" [style.background]="card.gradient">
              <i class="fas" [ngClass]="card.icon"></i>
            </div>
            <div class="tile-body">
              <div class="tile-title">{{ card.title }}</div>
            </div>
          </a>

          <div class="empty-state" *ngIf="cards.length === 0">
            <i class="fas fa-search"></i>
            <p>No modules match your search. Try another keyword.</p>
          </div>
        </div>
      </div>
    </div>
  </ng-container>

  <button class="palette-fab" type="button" (click)="togglePalette()" title="Change theme" aria-label="Change theme">
    <i class="fas fa-palette"></i>
  </button>

  <div class="palette-drawer" *ngIf="showPalette">
    <button
      *ngFor="let palette of paletteOptions"
      type="button"
      class="palette-chip"
      [class.active]="palette === selectedPalette"
      [style.background]="palette.swatch"
      [title]="palette.name"
      (click)="setPalette(palette)"
      [attr.aria-label]="'Theme ' + palette.name"
    >
      <span class="sr-only">{{ palette.name }}</span>
    </button>
  </div>
</div>
