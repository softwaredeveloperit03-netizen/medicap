<div class="card">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Specifications Checklist</div>
      <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        <button class="btn btn-sm btn-success" routerLink="/qc/specifications/master/add-checklist" *ngIf="isuser == 'Yes'">{{'common.new' | translate}}</button>
        <button class="btn btn-sm btn-danger" routerLink="/qc">{{'common.close' | translate}}</button>
      </div>
    </div>
  </div>

  <div class="card-block">
    <div class="card-text">
      <clr-datagrid [clrDgLoading]="loading">
        <clr-dg-column clrDgField="department">SR. No.</clr-dg-column>
        <clr-dg-column clrDgField="material_subtype">Checklist Heading</clr-dg-column>
        <clr-dg-column clrDgField="material_nature">Version No</clr-dg-column>
        <clr-dg-column clrDgField="material_code">Form Type</clr-dg-column>
        <clr-dg-row *clrDgItems="let user of checkList; let i = index" [clrDgItem]="results">
          <clr-dg-cell>{{i + 1}}</clr-dg-cell>
          <clr-dg-cell>{{ user.checklist_heading}}</clr-dg-cell>
          <clr-dg-cell>{{ user.version_no }}</clr-dg-cell>
          <clr-dg-cell>{{ user.form_type }}</clr-dg-cell>
        </clr-dg-row>

        <clr-dg-footer>
          <clr-dg-pagination #pagination [clrDgPageSize]="10">
            <clr-dg-page-size [clrPageSizeOptions]="[10,20,50,100]">Users per page</clr-dg-page-size>
            {{pagination.firstItem + 1}} - {{pagination.lastItem + 1}}
            of {{pagination.totalItems}} users
          </clr-dg-pagination>
        </clr-dg-footer>
      </clr-datagrid>
    </div>
  </div>
</div>
