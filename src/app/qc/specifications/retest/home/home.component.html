<div class="component qc-legacy-dash">
  <div class="subsection">
    <div class="purchase-block" >
      <div style="text-align:end" class="exit-section">
        <div class="header-block" style="margin:10px 0px">
          <h3>Retest Specifications</h3>
        <div routerLink="/master/specification/raw" class="name-board2"><i class="fas fa-times"></i>
        </div>
      </div>

      <div class="main-section" style="margin: 0px 10px 10px 10px !important;">
        <div class="category">
          <div class="line-section">
            <div class="header-div">
              <h3>Retest Specifications Section</h3>
            </div>
          </div>
          <div class="block-container" style="    
          display: grid;
          grid-template-columns: repeat(6, 150px);
          grid-gap: 35px;
          overflow-x: auto;
          max-width: 100%;">
          <div class="item-block" routerLink="new">
            <i class="fas fa-file"></i>
            <span>New Specification</span>
          </div>
          
          <!-- 
          <div class="item-block" routerLink="/specifications/retest/checking" *ngIf="isChecker">

          <div class="item-block" routerLink="/specifications/retest/approval" *ngIf="isApprover">
            <i class="fas fa-check-double"></i>
            <span>Specification For Approval</span>
          </div>
          -->
          
          <div class="item-block" routerLink="report">
            <i class="fas fa-file-alt"></i>
            <span>Specifications Report</span>
          </div>
          

          </div>
        </div>
      </div>
    </div>
  </div>
