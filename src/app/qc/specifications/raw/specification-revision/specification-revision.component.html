<div class="dashboard-shell" [style.background]="selectedPalette.background">
  <ng-container *ngIf="filteredCards as cards">
    <div class="compact-layout">
      <aside class="compact-sidebar">
        <div class="compact-sidebar__head">
          <span class="compact-sidebar__title">Specification Revision</span>
          <span class="compact-sidebar__count">{{ cards.length }}</span>
        </div>
        <nav class="compact-sidebar__tabs" aria-label="Specification revision modules">
          <button
            type="button"
            class="compact-nav-item compact-nav-item--all compact-nav-item--menu"
            [class.active]="selectedCategory === 'All'"
            (click)="selectedCategory = 'All'"
          >
            <i class="fas fa-layer-group" aria-hidden="true"></i>
            <span>All Modules</span>
            <em class="compact-nav-count">{{ cards.length }}</em>
          </button>
          <button
            type="button"
            *ngFor="let cat of getCategories()"
            class="compact-nav-item compact-nav-item--menu"
            [class.active]="cat === selectedCategory"
            (click)="selectedCategory = cat"
          >
            <i class="fas" [ngClass]="categoryIcon(cat)" aria-hidden="true"></i>
            <span>{{ cat }}</span>
            <em class="compact-nav-count">{{ countForCategory(cat) }}</em>
          </button>
        </nav>
      </aside>

      <div class="compact-main">
        <div class="dash-header dash-header--single-line">
          <div class="title-block">
            <h2>{{ dashboardTitle }}</h2>
          </div>
          <div class="header-actions-row dept-hub-header-actions">
            <div class="search-box dash-header__search">
              <i class="fas fa-search"></i>
              <input
                type="text"
                [(ngModel)]="searchQuery"
                placeholder="Search revision modules"
                aria-label="Search revision modules"
              />
            </div>
            <a class="back-btn" routerLink="/master/specification">
              Back To Specification
            </a>
            <a class="close-btn dept-hub-header-close" routerLink="/master/specification" aria-label="Close">
              <i class="fas fa-times"></i>
              Close
            </a>
          </div>
        </div>

        <h3 class="section-label">{{ getSectionLabel() }}</h3>

        <div class="tiles-grid tiles-grid--qc">
          <a
            *ngFor="let card of cards; trackBy: trackByCardId"
            class="tile-card"
            [routerLink]="card.route"
            [ngStyle]="{ 'box-shadow': selectedPalette.cardShadow }"
          >
            <div class="icon-wrap" [style.background]="card.gradient">
              <i class="fas" [ngClass]="card.icon"></i>
            </div>
            <div class="tile-body">
              <div class="tile-title">{{ card.title }}</div>
              <p class="tile-description" *ngIf="card.description">{{ card.description }}</p>
            </div>
          </a>

          <div class="empty-state" *ngIf="cards.length === 0">
            <i class="fas fa-search"></i>
            <p>No revision modules found for this search.</p>
          </div>
        </div>
      </div>
    </div>
  </ng-container>

  <button class="palette-fab" type="button" (click)="togglePalette()" title="Change theme" aria-label="Change theme">
    <i class="fas fa-palette"></i>
  </button>

  <div class="palette-drawer" *ngIf="showPalette">
    <button
      *ngFor="let palette of paletteOptions"
      type="button"
      class="palette-chip"
      [class.active]="palette === selectedPalette"
      [style.background]="palette.swatch"
      [title]="palette.name"
      (click)="setPalette(palette)"
      [attr.aria-label]="'Theme ' + palette.name"
    >
      <span class="sr-only">{{ palette.name }}</span>
    </button>
  </div>
</div>
