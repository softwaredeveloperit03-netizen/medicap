<div class="container-fluid" *ngIf="!isView">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Control Sample Review </div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-primary" routerLink="../new-review">New Review</button>
            <button class="btn btn-sm" routerLink="/qc/controlsample" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>  
      </div>
      <div class="card-block">
        <div class="card-text">

          <div class="clr-col-4">
            <label><strong>Material Type: </strong></label>
            <select name="material_type" [(ngModel)]="material_type" (change)="getReviewsLog($event.target.value)" required>
              <option> </option>
              <option>Raw Material</option>
              <option>Packing Material</option>
              </select>
          </div>

          <table class="table">
            <tr>
              <th style="width: 40px;">Sr.</th>
              <th style="text-align: left;">Material Code</th>
              <th style="text-align: left;">Material Name</th>
              <th style="text-align: left;">Medicap Lot No</th>
              <th style="text-align: left;">A.R No</th>
              <!-- <th style="text-align: left;">Grade</th> -->
              <th style="text-align: left;">Analysis Date</th>
              <!-- <th style="text-align: left;">Release Date</th> -->
              <th style="text-align: left;">Sample Qty</th>
              <th style="text-align: left;">Rack No</th>
              <!-- <th style="text-align: left;">Checked By</th> -->
              <th style="text-align: left;">{{'common.status' | translate}}</th>
            </tr>
            <tr *ngFor="let entry of results; let i = index">
              
              <!-- <td style="text-align: left;">{{ entry.grade }}</td> -->
              <td style="text-align: left;">{{ entry.analysis_date }}</td>
              <!-- <td style="text-align: left;">{{ entry.release_date }}</td> -->
              <td style="text-align: left;">{{ entry.sample_quantity }}</td>
              <td style="text-align: left;">{{ entry.rack_no }}</td>
              <!-- <td style="text-align: left;">{{ entry.checked_by }}</td> -->
              <td style="text-align: left;">{{ entry.status }}</td>
            </tr>
            <tr *ngIf="results?.length == 0">
              <td colspan="10" style="text-align: center;">{{'common.noRecords' | translate}}</td>
            </tr>
          </table>

      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="getprint()">{{'common.download' | translate}}</button>&nbsp;
        <!-- <button class="btn btn-danger" routerLink="/qa/controlsample">{{'common.close' | translate}}</button> -->
      </div>
    </div>
</div>
