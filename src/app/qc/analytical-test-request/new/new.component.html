<div class="atr-page-wrap">
<div class="card atr-form-card">
  <div class="card-header">
    <div class="clr-row header-row">
      <div class="clr-col-8">FQC-005-06-A — Analytical Test Request (Section A: Requestor)</div>
      <div class="clr-col-4 text-right">
        <button class="btn btn-sm btn-danger" routerLink="/qc/analytical-test-request">CLOSE</button>
      </div>
    </div>
  </div>

  <div class="card-block">
    <div class="clr-row form-meta">
      <div class="clr-col-lg-3"><label>Request No.</label><input type="text" [(ngModel)]="request_no" readonly /></div>
      <div class="clr-col-lg-3"><label>Requestor Date</label><input type="date" [(ngModel)]="form.requestor_date" /></div>
      <div class="clr-col-lg-3"><label>Date Results Required</label><input type="date" [(ngModel)]="form.date_results_required" /></div>
    </div>

    <h4 class="section-heading">Section A — Requestor</h4>

    <div class="clr-row">
      <div class="clr-col-lg-4">
        <label>Select Product</label>
        <select [(ngModel)]="selectedProductCode" (ngModelChange)="onProductSelect($event)">
          <option value="">-- Product --</option>
          <option *ngFor="let p of products" [value]="p.product_code">{{ p.product_name }} ({{ p.product_code }})</option>
        </select>
      </div>
      <div class="clr-col-lg-4">
        <label>Or Select Material</label>
        <select [(ngModel)]="selectedMaterialCode" (ngModelChange)="onMaterialSelect($event)">
          <option value="">-- Material --</option>
          <option *ngFor="let m of materials" [value]="m.material_code">{{ m.material_name }} ({{ m.material_code }})</option>
        </select>
      </div>
    </div>

    <div class="clr-row">
      <div class="clr-col-lg-12">
        <label>Product Description *</label>
        <textarea rows="2" [(ngModel)]="form.product_description" placeholder="Product/Material name, strength, dosage unit, in-process step, expiry if applicable"></textarea>
      </div>
    </div>

    <div class="clr-row">
      <div class="clr-col-lg-4"><label>Product Code</label><input type="text" [(ngModel)]="form.product_code" /></div>
      <div class="clr-col-lg-4"><label>Lot # *</label><input type="text" [(ngModel)]="form.lot_number" /></div>
      <div class="clr-col-lg-4"><label>MFG Date</label><input type="date" [(ngModel)]="form.mfg_date" /><small *ngIf="isProductionSample()" class="hint">QA &amp; Compliance may enter/verify for production samples</small></div>
    </div>

    <div class="clr-row">
      <div class="clr-col-lg-4"><label>Type of Samples *</label><input type="text" [(ngModel)]="form.sample_type" placeholder="e.g. Granules, Coated Tablets" /></div>
      <div class="clr-col-lg-4"><label>Sampling Site *</label><input type="text" [(ngModel)]="form.sampling_site" placeholder="Production, Warehouse, R&amp;D" /></div>
      <div class="clr-col-lg-4"><label># of Samples *</label><input type="text" [(ngModel)]="form.num_of_samples" placeholder="e.g. 1 Beginning/ 1 Middle/ 1 Bottom" /></div>
    </div>

    <div class="field-block">
      <label>Sample Category *</label>
      <div class="checkbox-grid">
        <label *ngFor="let cat of sampleCategories" class="chk-label">
          <input type="checkbox" [checked]="isCategoryChecked(cat)" (change)="toggleCategory(cat)" /> {{ cat }}
        </label>
      </div>
      <div class="clr-row" *ngIf="isCategoryChecked('Other')">
        <div class="clr-col-lg-6"><input type="text" [(ngModel)]="form.sample_category_other" placeholder="Specify Other" /></div>
      </div>
    </div>

    <div class="clr-row">
      <div class="clr-col-lg-4"><label>Processing Start Date</label><input type="date" [(ngModel)]="form.processing_start_date" (change)="onProcessingStartChange()" /></div>
      <div class="clr-col-lg-4"><label>Holding Time</label><input type="text" [(ngModel)]="form.holding_time" placeholder="Default: 30 days" /></div>
    </div>

    <div class="field-block">
      <label>Test(s) Requested</label>
      <label class="chk-label master-spec">
        <input type="checkbox" [(ngModel)]="form.tests_requested.has_approved_specs" />
        SAMPLES WHICH HAVE APPROVED SPECIFICATIONS: REFER RESPECTIVE APPROVED SPECIFICATION FOR TESTING REQUIREMENTS
      </label>
      <div class="checkbox-grid" *ngIf="!form.tests_requested.has_approved_specs">
        <div *ngFor="let t of testOptions" class="test-item">
          <label class="chk-label">
            <input type="checkbox" [(ngModel)]="form.tests_requested[t.key]" /> {{ t.label }}
          </label>
          <input *ngIf="t.hasText && form.tests_requested[t.key]" type="text" class="test-detail-input" [(ngModel)]="form.tests_requested[t.textKey]" [placeholder]="t.label" />
        </div>
      </div>
    </div>

    <div class="clr-row">
      <div class="clr-col-lg-12">
        <label>Comments</label>
        <textarea rows="3" [(ngModel)]="form.comments" placeholder="Reason for request, LIR#, NCR#, stability time points, etc."></textarea>
      </div>
    </div>

    <div class="clr-row">
      <div class="clr-col-lg-4"><label>Requestor *</label><input type="text" [(ngModel)]="form.requestor" /></div>
    </div>
  </div>

  <div class="card-footer">
    <button class="btn btn-outline" (click)="saveDraft()" [disabled]="saving">{{ saving ? 'Saving...' : 'Save Draft' }}</button>
    <button class="btn btn-primary" (click)="submit()" [disabled]="submitting">{{ submitting ? 'Submitting...' : 'Submit Request' }}</button>
    <button class="btn btn-danger" routerLink="/qc/analytical-test-request">CLOSE</button>
  </div>
</div>
</div>
