<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">OOS Checklist Master</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/qc/testerp/oosreview" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
  
      <div class="card-block">
        <form #checklistForm="ngForm">
          <div class="card-text">
            <div class="clr-row">
  
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Checklist Index:<sup style="color: red">*</sup>:</strong></label>
                <input type="text" name="check_index" [(ngModel)]="check_index"  required>
              </div>
  
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Checklist Heading:<sup style="color: red">*</sup>:</strong></label>
                <input type="text" name="checklist_heading" [(ngModel)]="checklist_heading"  required>
              </div>

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Table No:<span style="color: red;">*</span></label>
                <input type="text" name="table_no" ngModel required>
              </div>
  
              <hr>
            </div>
          </div>
  
          <div class="card">
            <div class="card-header" style="text-align: center">
              <div class="clr-row" style="margin-bottom: -10px;">
                <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;">OOS Checklist Details</div>
                <div class="clr-col-lg-5" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                  <button class="btn btn-sm btn-info btn-icon">
                    <clr-icon shape="eye" class="is-warning"></clr-icon>
                  </button>
                </div>
              </div>
            </div>
            <div class="card-block">
  
              <form #checkForm="ngForm">
                <div class="clr-row">
  
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Area:<span style="color: red;">*</span></label>
                    <input type="text" name="check_point" ngModel  required>
                  </div>
  
 
  
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Evaluation Parameter:<span style="color: red;">*</span></label>
                    <select name="evaluation_parameter" [(ngModel)]="evaluation_parameter" required>
                      <option></option>
                      <option value="0">Sub Heading</option>
                      <option value="1">Comments</option>
                      <option value="2">Yes/No/NA</option>
                      <!-- <option value="3">{{'common.table.remark' | translate}}</option> -->
                      <option value="4">Textarea</option>
                      <option value="5">Employee List</option>
                      <option value="6">Further discussion required ?</option>
                      <!-- <option value="5">{{'common.date' | translate}}</option> -->
                     </select>
                  </div>


  
            
  
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <button class="btn btn-success" (click)="addData(checkForm)" style="margin-top:30px;">{{'common.add' | translate}}</button>
                  </div>
                </div>
              </form>
  
  
              <div class="card-text">
                <div class="row container-fluid">
                    <table class="table table-border">
                        <tr>
                            <th style="background-color:rgb(14, 67, 112); color: white;">{{'common.table.srNo' | translate}}</th>
                            <th style="background-color: rgb(14, 67, 112); color: white;">Checklist Heading</th>
                             <th style="background-color: rgb(14, 67, 112); color: white;">Evaluation Parameter</th>
                            <th style="background-color: rgb(14, 67, 112); color: white;">{{'common.table.action' | translate}}</th>
                        </tr>
    
                        <tr *ngFor="let add of checklistList ;let i=index">
                            <td>{{i+1}}.</td>
                            <td style="text-align: left;">{{add.check_point}}</td>
                            <td style="text-align: left;">{{add.evaluation_parameter}}</td>
                            <td>
                                <clr-icon shape="trash" class="is-error" (click)="delData(i)"></clr-icon>
                            </td>
                        </tr>
                    </table>

                </div>
              </div>
            </div>
  
          </div>
        </form>
      </div>
      <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
        <button class="btn btn-success" (click)="saveChecklist(checklistForm)">{{'common.save' | translate}}</button>
      </div>



      <div class="card">
        <div class="card-block">
          <table class="table table-border">
            <tr>
                <th style="background-color:rgb(14, 67, 112); color: white;">Checklist Index</th>
                <th style="background-color: rgb(14, 67, 112); color: white;">Checklist Heading</th>
              </tr>

            <tr *ngFor="let add of ooschecklist_data ;let i=index">
                 <td style="text-align: left;">{{add.check_index}}</td>
                <td style="text-align: left;">{{add.checklist_heading}}</td>
         
            </tr>
        </table>

        </div>
      </div>

 
    </div>
  </div>
