<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;">New Standard Ordering Form
            </div>
            <div class="clr-col-lg-5" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qc/standard/ordering" style="background-color: red;color: white;">
                    {{'common.close' | translate}} </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #orderForm="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Type:<span style="color:red;">*</span></label>
                        <select name="type" ngModel>
                            <option></option>
                            <option>Referance Standard</option>
                            <option>Working Standard</option>
                            <option>Primary Standard</option>
                            <option>Secondary Standard</option>
                            <option>Inhouse Standard</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Select Standard:<span style="color:red;">*</span></label>
                        <select name="standard_name" ngModel required>
                            <option></option>
                            <option *ngFor="let std of standards">{{std.standard_name}}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Required Qty</label>
                        <input type="text" name="req_qty" ngModel>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>For Product:<span style="color:red;">*</span></label>
                        <select name="product_code" [(ngModel)]="product_code" required>
                            <option></option>
                            <option *ngFor="let product of products" value="{{product.product_code}}">{{product.product_name}}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>For Client:<span style="color:red;">*</span></label>
                        <select name="client_code" [(ngModel)]="client_code" required>
                            <option></option>
                            <option *ngFor="let client of clients" value="{{client.client_code}}">{{client.LglNm}}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Pack Size</label>
                        <input type="text" name="pack_size" ngModel>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Unit:<span style="color:red;">*</span></label>
                        <select name="unit" ngModel required>
                            <option></option>
                            <option>%</option>
                            <option>mg</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Specific Vendor</label>
                       <select name="vendor_no" [(ngModel)]="vendor_no">
                           <option></option>
                           <option *ngFor="let ven of vendors" value="{{ven.vendor_no}}">{{ven.vendor_name}}</option>
                       </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Standard No.</label>
                        <input type="text" name="std_no" ngModel>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="save(orderForm)">{{'common.save' | translate}}</button>
        <button class="btn btn-danger" routerLink="/qc/standard/ordering">{{'common.close' | translate}}</button>
    </div>
</div>
