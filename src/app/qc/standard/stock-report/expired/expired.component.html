<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Expiry Standard Stock Book </div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qc/standard/stock-report" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
      <form #expiry_standard_form="ngForm"> 
        <div class="card-text">
            <h4> Expired Standard Details</h4>
                <div class="clr-row">
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Standard Title:<span style="color: red;">*</span></label>
                        <input type="text" name="e_name" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Standard Identifier Number:<span style="color: red;">*</span></label>
                        <input type="text" name="e_std_num" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Revision Version (If Applicable) :<span style="color: red;">*</span></label>
                        <input type="text" name="e_revision" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label> Date Of Expiry :<span style="color: red;">*</span></label>
                        <input type="date" name="e_date_exp" ngModel required>
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                        <label> Reason Of Expiry :<span style="color: red;">*</span></label>
                        <input type="text" name="e_reason_exp" ngModel required>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left; color: white; background-color: rgb(154, 107, 230);"> Additional Information</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Impact Assessment:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="e_impact" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Replacement & Renewal :<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="e_replacement" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Disposal & Archiving : here to add multiple calibration<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="e_disposal" ngModel required>
                        </div>
                    </div>
                </div>   
                <div class="card-header" style="text-align: left; color: white; background-color: rgb(154, 107, 230);"> Record Keeping</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Record Keeping Details:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="e_record_details" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Location:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="e_location" ngModel required>
                        </div>
                    </div>
                </div>       
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left;color: black; background-color: rgb(182, 212, 14);"> Review & Approval</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Prepared By:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="e_prepared_by" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Prepared Date:<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="e_prepared_date" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Reviewed By:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="review_by" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Review Date:<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="review_date" ngModel required>
                        </div>
                    </div>
                </div>
            </div>
      </form>
    </div>
        <div class="card-footer">
            <button class="btn btn-primary"(click)="save(expiry_standard_form)">{{'common.save' | translate}}</button>
        </div>
</div>
