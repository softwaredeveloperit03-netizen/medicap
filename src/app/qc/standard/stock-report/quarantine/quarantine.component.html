<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Reference Standard Book </div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qc/standard/stock-report" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
      <form #refrence_standard_bookform="ngForm">
        <div class="card-text">
            <h4> Reference Standard Details</h4>
                <div class="clr-row">
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Standard Name:<span style="color: red;">*</span></label>
                        <input type="text" name="s_title" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Standard Identifier Number/Code:<span style="color: red;">*</span></label>
                        <input type="text" name="s_identifier" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-6 clr-col-xs-6">
                        <label>Grade:</label>
                        <select name="grade" [(ngModel)]="material_type" required>
                          <option></option>
                          <option>IP</option>
                          <option>BP</option>
                          <option>USP</option>
                        </select>
                      </div>
                      <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Medicap Lot No :<span style="color: red;">*</span></label>
                        <input type="text" name="batch_no" ngModel required>
                    </div>     
                </div>
            </div>
            <div class="card">    
                <div class="card-header" style="text-align: left; color: white; background-color: rgb(154, 107, 230);"> Record Keeping</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-6 clr-col-xs-6">
                            <label><strong>Record Keeping Details:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="record_details" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-6 clr-col-xs-6">
                            <label><strong>Date Of Entry:<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="record_date" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-6 clr-col-xs-6">
                            <label><strong>Received Qty.:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="received_qty" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-6 clr-col-xs-6">
                            <label><strong>Available Qty.:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="available_qty" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-6 clr-col-xs-6">
                            <label><strong>UOM:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="umo" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-6 clr-col-xs-6">
                            <label><strong>Storage Location:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="storage_location" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-6 clr-col-xs-6">
                            <label><strong>Supplier Information:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="supplier_info" ngModel required>
                        </div>
                        <!-- <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-6 clr-col-xs-6">
                            <label><strong>Certificate:<sup style="color: red">*</sup></strong></label>
                            <input type="file" name="record_details" ngModel required>
                        </div> -->
                        <div class="clr-col-lg-6">
                            <label>Certificate:</label>
                            <input type="file" name="doc" ngModel (change)="onFileChanged1($event)">
                        </div>
                    
                <form #formlevle="ngForm">
                    <table class="table">
                            <tr>
                                <th style="background-color:#144196;color:white;font-size:15px" input type="date" >{{'common.date' | translate}}</th>
                                <th style="background-color:#144196;color:white;font-size:15px">Qty.Consumed</th>
                                <th style="background-color:#144196;color:white;font-size:15px">Receiving Qty.</th>
                                <th style="background-color:#144196;color:white;font-size:15px">User</th>
                            </tr>
                            <tr>
                                <td style="padding:0px;"> <input type="text" name="date" ngModel required style="margin:0px;"></td>
                                <td style="padding:0px;"> <input type="text" name="qty_consumed" ngModel required style="margin:0px;"></td>
                                <td style="padding:0px;"> <input type="text" name="reciving_qty" ngModel required style="margin:0px;"></td>
                                <td style="padding:0px;"> <input type="text" name="user" ngModel required style="margin:0px;"></td>

                                <td><button class="btn btn-sm btn-info" (click)="addlabel1(formlevle)" style="margin:0px;">{{'common.add' | translate}}</button></td>
                            </tr>
                            <tr *ngFor="let list of fromlevel1;let i=index">
                                <td>{{list.date}}</td>
                            <td>{{list.qty_consumed}}</td>
                            <td>{{list.reciving_qty}}</td>  
                            <td>{{list.user}}</td> 
                            <td>
                                <button class="btn btn-sm btn-info" (click)="delData(i)">{{'common.delete' | translate}}</button>
                            </td>
                            </tr>
                            <tr *ngIf="fromlevel1?.length == 0">
                            <td colspan="3">No Record Found!</td>
                            </tr>
                         </table>
                      </form>
                    </div>
                </div>       
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left;color: black; background-color: rgb(182, 212, 14);"> Review & Approval</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Prepared By:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="prepared_by" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Prepared Date:<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="prepared_date" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Review By:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="review_by" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Review Date:<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="review_date" ngModel required>
                        </div>
                    </div>
                </div>
            </div>
      </form>
    </div>
        <div class="card-footer">
            <button class="btn btn-primary"(click)="save(refrence_standard_bookform)">{{'common.save' | translate}}</button>
        </div>
</div>
