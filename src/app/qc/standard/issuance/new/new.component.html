<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;">New Standard Master Form
            </div>
            <div class="clr-col-lg-5" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qc/standard/issuance"
                    style="background-color: red;color: white;">
                    {{'common.close' | translate}} </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #issuanceForm="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Category:<span style="color:red;">*</span></label>
                        <select name="category" ngModel required>
                            <option></option>
                            <option>Referance Standard</option>
                            <option>Working Standard</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Standard Name <span style="color:red;">*</span></label>
                        <select name="standard_name" ngModel>
                            <option></option>
                            <option *ngFor="let std of standards">{{std.standard_name}}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Available Qty<span style="color:red;">*</span></label>
                        <input type="number" name="available_qty" ngModel>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Quantity Required:<span style="color:red;">*</span></label>
                        <input type="number" name="req_qty" ngModel style="width: 60%;">
                        <select name="req_unit" ngModel style="width: 30%;padding: 1px;">
                            <option></option>
                            <option>%</option>
                            <option>mg</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Quantity Issued:<span style="color:red;">*</span></label>
                        <input type="number" name="qty_issued" ngModel style="width: 60%;">
                        <select name="issued_unit" ngModel style="width: 30%;padding: 1px;">
                            <option></option>
                            <option>%</option>
                            <option>mg</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Issued By:<span style="color:red;">*</span></label>
                        <select name="issued_by" ngModel>
                            <option></option>
                            <option *ngFor="let result of results" [value]="result.emp_id">{{result.emp_id}} - {{result.firstname}}
                            </option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Issued To:<span style="color:red;">*</span></label>
                        <select name="issued_to" ngModel>
                            <option></option>
                            <option *ngFor="let result of results" [value]="result.emp_id">{{result.emp_id}} - {{result.firstname}}
                            </option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Issued For:<span style="color:red;">*</span></label>
                        <select name="issued_for" [(ngModel)]="product_code">
                            <option></option>
                            <option *ngFor="let product of products" value="{{product.product_code}}">
                                {{product.product_name}}</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="save(issuanceForm)">{{'common.save' | translate}}</button>
        <button class="btn btn-danger" routerLink="/qc/standard/issuance">{{'common.close' | translate}}</button>
    </div>
</div>
