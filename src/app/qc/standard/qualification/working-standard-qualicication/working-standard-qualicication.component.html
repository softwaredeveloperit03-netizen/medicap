<div class="card" *ngIf="!isView&&!isNew">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Working Standard Qualification</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-success" (click)="new()" *ngIf="isuser == 'Yes'">{{'common.new' | translate}}</button>
            <button class="btn btn-sm btn-danger" routerLink="/qc/standard/qualification">{{'common.close' | translate}}</button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <table class="table">
               
            </table>
        </div>
    </div>
</div>

<div class="card" *ngIf="isView">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">View</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-danger" routerLink="/qc/calibration/balance/monthly">{{'common.close' | translate}}</button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
          
        </div>
    </div>
    <div class="card-footer"><button class="btn btn-primary" (click)="downloadReport()">{{'common.download' | translate}}</button></div>
</div>
<div class="card" *ngIf="isNew">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-danger" (click)="isNew = false">{{'common.close' | translate}}</button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <div class="clr-row" style="margin-bottom: -10px;">
                <div class="clr-col-lg-3" >
                    <label>Name Of Material</label>
                    <select name="material_name" [(ngModel)]="material_name" required (change)="get_data($event.target.selectedIndex)">
                       <option></option>
                        <option *ngFor="let data of results;let i=index;">{{data.material_name}}</option>
                    </select>
                </div>
                <div class="clr-col-lg-3" >
                    <label>Grade</label>
                    <input type="text" name="grade" [(ngModel)]="grade" required>
                </div>
                <div class="clr-col-lg-3" >
                    <label>Qty To Be Tested</label>
                    <input type="text" name="qty" ngModel required>
                </div>
              
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-4 clr-col-xs-4">
                  <label>UOM:<span style="color: red">*</span></label>
                  <select name="uom" ngModel required>
                    <option></option>
                    <option *ngFor="let unit of units">{{ unit.unit }}</option>
                  </select>
                </div>
            </div>
        </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #batchForm="ngForm">
        <table class="table">
          <tr>
            <td>{{'common.table.srNo' | translate}}</td>
            <td>Specification No.</td>
            <td>Medicap Lot No</td>
            <td>Vendor</td>
            <td>Assay Result</td>
            <td>Limit</td>
            <td>select</td>
          </tr>
          <tr *ngFor="let data of tests;let i=index;">
              <td>{{i+1}}</td>
              <td>{{data.specification_no}}</td>
              <td>{{data.ar_no}}</td>
              <td>{{data.vendor_name}}</td>
              <td style="padding: 0px;">
                <input type="text" name="assay_result" [(ngModel)]="data.assay_result" required style="margin: 0px;">
            </td>
              <td></td>
              <td style="text-align: center;">
                <input type="checkbox" name="selected{{ i }}" [(ngModel)]="data.selected" >
              </td>

          </tr>
        </table>
        </form>
        <button type="button" class="btn btn-outline" (click)="addProduct(batchForm)" *ngIf="tests?.length!=0">{{'common.add' | translate}}</button>

      </div>
    </div>  
</div>
