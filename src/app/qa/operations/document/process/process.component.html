<div class="container-fluid">
    <div class="card">
        <div class="card-header">Process & Analytical Documents</div>
        <div class="card-block">
            <div class="card-text">
                <table class="table">
                    <tr>
                        <th>Req. No.</th>
                        <th>{{'common.department' | translate}}</th>
                        <th>Name of Product</th>
                        <th>Document Type</th>
                        <th>Document No.</th>
                        <th>Required Copies</th>
                        <th>View</th>
                    </tr>
                    <tr *ngFor="let process of processes; let i = index">
                        <td>{{ process.req_no }}</td>
                        <td>{{ process.department }}</td>
                        <td>{{ process.product_name }}</td>
                        <td>{{ process.document_type }}</td>
                        <td>{{ process.document_no }}</td>
                        <td>{{ process.copies }}</td>
                        <td>
                            <button class="btn btn-sm btn-info">PROCEED</button>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</div>
