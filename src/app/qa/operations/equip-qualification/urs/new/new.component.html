<div class="container-fluid">
    <div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">User Requirement Specification</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/equipment-qualification/urs" style="background-color: red;color: white;">
                <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
            </div>
        </div>
        </div>
        <div class="card-block">
            <div class="card-text">
                <form #userForm="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-6">
                            <label>Equipment Name:</label>
                            <input type="text" name="equipment_name" ngModel required>
                        </div>
                        <div class="clr-col-6">
                            <label>Capacity Required:</label>
                            <input type="text" name="capacity" ngModel required>
                        </div>
                        <div class="clr-col-6">
                            <label>Expected Output:</label>
                            <input type="text" name="expected_output" ngModel required>
                        </div>
                        <div class="clr-col-6">
                            <label>No. of Equipments Required:</label>
                            <input type="text" name="equipments_no" ngModel required>
                        </div>
                        <div class="clr-col-12">
                            <label>Suggest Vendor Name:</label>
                            <select name="vendor_no" ngModel required>
                                <option></option>
                                <option *ngFor="let vendor of vendors;" [value]="vendor.vendor_no">{{ vendor.vendor_name }}</option>
                            </select>
                        </div>
                    </div>
                </form>
                <h4>Technical Specification</h4>
                <form #specForm="ngForm">
                    <table class="table">
                        <tr>
                            <th>Requirement</th>
                            <th>Specification</th>
                            <th>{{'common.table.remark' | translate}}</th>
                            <th>Add</th>
                        </tr>
                        <tr>
                            <td style="padding: 0px;">
                                <input type="text" style="margin: 0px;" name="requirement" ngModel required>
                            </td>
                            <td style="padding: 0px;">
                                <input type="text" style="margin: 0px;" name="specification" ngModel required>
                            </td>
                            <td style="padding: 0px;">
                                <input type="text" style="margin: 0px;" name="remark" ngModel required>
                            </td>
                            <td style="padding: 0px;vertical-align: middle;">
                                <button class="btn btn-sm btn-info" (click)="addSpec(specForm)">{{'common.add' | translate}}</button>
                            </td>
                        </tr>
                        <tr *ngFor="let spec of specs; let i = index">
                            <td>{{ spec.requirement }}</td>
                            <td>{{ spec.specification }}</td>
                            <td>{{ spec.remark }}</td>
                            <td>#</td>
                        </tr>
                    </table>
                </form>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="save(userForm)">{{'common.submit' | translate}}</button>
        </div>
    </div>
</div>
