<div class="container-fluid" *ngIf="!isNew">
    <div class="card">
        <div class="card-header">Equipment Qualification Request</div>
        <div class="card-block">
            <div class="card-text">
                <button class="btn btn-sm btn-info" (click)="isNew = true">New Qualification Request</button>
                <table class="table">
                    <tr>
                        <th>{{'common.department' | translate}}</th>
                        <th>Room Name</th>
                        <th>Equipment Name</th>
                        <th>Make</th>
                        <th>Capacity</th>
                        <!-- <th>Po. No.</th>
                        <th>Received At Site</th>
                        <th>DQ. No.</th> -->
                    </tr>
                    <tr *ngFor="let res of results;let i=index">
                        <td>{{ res.department_name}}</td>
                        <td>{{ res.section_name}}</td>
                        <td>{{ res.equip_name}}</td>
                        <td>{{ res.make}}</td>
                        <td>{{ res.capacity}}</td>
                     
                    </tr>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="container-fluid" *ngIf="isNew">
    <div class="card">
        <div class="card-header">Equipment Qualification Request</div>
        <div class="card-block">
            <div class="card-text">
                <form #reportForm="ngForm">
                     <div class="clr-row">

                        <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                            <label>Department:</label>
                            <select name="department_name" ngModel (change)="getSection($event.target.selectedIndex)" required>
                                <option></option>
                                <option *ngFor="let dept of dept" [value]="dept.department_name">{{dept.department_name}}</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                            <label>Room Name:</label>
                            <select name="section_name" ngModel required>
                                <option></option>
                                <option *ngFor="let dept of selectedSection['sections']" [value]="dept.section_name">{{dept.section_name}}</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                            <label>Equipment Name:</label>
                            <input type="text" name="equip_name" ngModel required>
                        </div>
                        <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                            <label>Make:</label>
                            <input type="text" name="make" ngModel required>
                        </div>
                        <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                            <label>Capacity:</label>
                            <input type="text" name="capacity" ngModel required>
                        </div>     
                    </div>
                </form>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="saveRequest(reportForm)">{{'common.submit' | translate}}</button>
            <button class="btn btn-danger" (click)="isNew = false">{{'common.close' | translate}}</button>
        </div>
    </div>
</div>
