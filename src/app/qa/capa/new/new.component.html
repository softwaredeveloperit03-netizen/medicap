
     <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New CAPA</div>
              <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qa/capa" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
              </div>
            </div>
          </div>
      <div class="card-block">
          <form #capa="ngForm">
            <div class="clr-row" style="margin-top: 20px;">
                <div class="clr-col-md-12 clr-col-12">
                    <fieldset style="border: solid 1px #a8a8a8;height: 100px;">
                    <legend style="width:auto; margin-bottom: 0px; font-size: 12px; font-weight: bold; color: #1f497d;">Origin Of CAPA</legend>
                    <div class="clr-row" style="padding-left: 15px;">
                        <div class="clr-control-container clr-control-inline">
                        <div class="clr-checkbox-wrapper" *ngFor="let order of origins; let i = index">
                            <input class="clr-checkbox" id="{{order.origin}}" type="checkbox" name="{{order.origin}}" [(ngModel)]="order.value" (change)="update($event.target.checked, i)">
                            <label for="{{order.origin}}" class="clr-control-label">{{order.origin}}</label>
                        </div>
                        </div>
                    </div>
                    </fieldset>
                </div>
            </div>
            <div class="clr-row">
              <div class="clr-col-4">
                <label>Reference Supporting Document No:</label>
                <input type="text" name="document_no" ngModel required>
              </div>
              <div class="clr-col-4">
                <label>Document File:</label>
                <input type="file" name="document" (change)="onFileChanged($event)" accept="application/pdf">
              </div>
            </div>
            <h4>CAPA Plan:</h4>
              <form #capa1="ngForm">
                <table class="table table-border">
                  <tr>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr No</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">CAPA</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Responsible Person Name</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Target Due Date</th>
                    <th *ngIf="plant_id == '58' || plant_id == '59'" style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Training required</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.table.action' | translate}}</th>
                  </tr>
                  <tr>
                    <td>0.</td>
                    <td style="padding: 0px; text-align: left;"><input type="text" name="capa" ngModel required style="margin: 0px;"></td>
                    <td style="padding: 0px; text-align: left;"><input type="text" name="person" ngModel required style="margin:0px"></td>
                    <td style="padding: 0px; text-align: left;"><input type="date" name="due_date" ngModel required style="margin:0px"></td>
                    <td *ngIf="plant_id == '58' || plant_id == '59'" style="padding: 0px; text-align: left;">
                      <select name="training"   ngModel required style="margin:0px">
                      <option></option>
                      <option>YES</option>
                      <option>NO</option>
                    </select>
                    </td>
                    <td style="padding: 0px; text-align: center;"><button class="btn btn-sm"(click)="add(capa1)" style="margin: 0px;">{{'common.add' | translate}}</button></td>
                  </tr>
                  <tr *ngFor="let capa of capas;let i=index">
                    <td>{{i+1}}</td>
                    <td>{{capa.capa}}</td>
                    <td>{{capa.person}}</td>
                    <td>{{capa.due_date | date: 'dd-MM-yyyy'}}</td>
                    <td>{{capa.training}}</td>
                    <td><clr-icon shape="trash" class="is-error" (click)="del(i)"></clr-icon></td>
                  </tr>
                </table>
              </form>
          </form>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="save(capa)">{{'common.save' | translate}}</button>
      </div>
    </div>
