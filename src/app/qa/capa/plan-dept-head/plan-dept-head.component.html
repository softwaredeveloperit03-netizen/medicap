<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Effectiveness Plan Dept. Head Approval Form</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qa/capa" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <form #newForm="ngForm">   
        <div class="card-text">
            <h4>Effectiveness Plan Details</h4>
           
                <div class="clr-row">
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Effectiveness Plan ID/Capa Refrence Number:<span style="color: red;">*</span></label>
                        <select type="text" name="effectiveness_id" ngModel required>
                            <option></option>
                            <option *ngFor="let ref of capa">{{ ref.capa_no }}</option>
                          </select>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Plan Title:<span style="color: red;">*</span></label>
                        <input type="text" name="plan_title" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Responsible Department:<span style="color: red;">*</span></label>
                        <input type="text" name="responsible_department" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Initiation Date:<span style="color: red;">*</span></label>
                        <input type="date" name="initiation_date" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Proposed Completion Date:<span style="color: red;">*</span></label>
                        <input type="date" name="proposed_completion_date" ngModel required>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left; color: black; background-color: lightgreen;">Effectiveness Criteria</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Key Performance Indicators:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="key_Performance" ngModel>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Success Criteria:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="Criteria_success" ngModel>
                        </div>
                    </div>
                </div>
                <div class="card-header" style="text-align: left; color: white; background-color: rgb(154, 107, 230);"> Action Plan</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Strategies & Actions:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="strategies_action" ngModel>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Resource Required:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="resource_req" ngModel>
                        </div>
                    </div>
                </div>        
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left;color: black; background-color: rgb(182, 212, 14);"> Review & Approval</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Prepared By:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="prepared_by" ngModel>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Department Head:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="department_head" ngModel>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Review Date:<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="review_date" ngModel>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Approval Status:<sup style="color: red">*</sup></strong></label>
                            <select type="text" name="approvel_status" ngModel>
                                <option></option>
                                <option>{{'common.approved' | translate}}</option>
                                <option>{{'common.pending' | translate}}</option>
                                <option>{{'common.rejected' | translate}}</option>
                            </select> 
                        </div>
                    </div>
                </div>
                <h4> Comments</h4>
                <div class="clr-row">
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Department Head's Comments:<sup style="color: red">*</sup></strong></label>
                        <input type="text" name="department_head_contains" ngModel>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Supporting Documents:<sup style="color: red">*</sup></strong></label>
                        <input type="file" name="supporting_doc" ngModel (change)="onFileChanged3($event)">                    </div>
                </div>
            </div>
        </form>
    </div>

        <div class="card-footer">
            <button class="btn btn-primary" (click)="save(newForm)">{{'common.save' | translate}}</button>
        </div>
</div>
