<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">LIST OF CALCULATORS</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm btn-danger" routerLink="/qa">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>

    <div class="card-block">
        <div class="card-text">
            <form #formData="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3 clr-col-xs-3">
                        <label>From Date</label>
                        <input type="date" name="from_date" [(ngModel)]="from_date" [max]="to_date">
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3 clr-col-xs-3">
                        <label>To Date</label>
                        <input type="date" name="to_date" [(ngModel)]="to_date" [max]="today" [min]="from_date">
                    </div>
                    <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-4 clr-col-xs-6">
                        <button class="btn btn-danger" (click)="getCalculator()"
                            style="margin-top: 31px;">{{'common.search' | translate}}</button>
                    </div>
                </div>
                <table class="table table-border">
                    <tr>
                        <th style="text-align:center; vertical-align: middle;">Sr No</th>
                        <th style="text-align:center; vertical-align: middle;">Calculator ID</th>
                        <th style="text-align:center; vertical-align: middle;">Type of Calculator</th>
                        <th style="text-align:center; vertical-align: middle;">Location of Calculator</th>
                        <th style="text-align:center; vertical-align: middle;">{{'common.remarks' | translate}}</th>
                        <th style="text-align:center; vertical-align: middle;">{{'common.table.action' | translate}}</th>
                    </tr>
                    <tr>
                        <td></td>
                        <td style="padding: 0px;"><input type="text" name="calculator_id" ngModel required
                                style="margin: 0px;"></td>
                        <td style="padding: 0px;">
                            <select name="type" ngModel required style="margin: 0px;">
                                <option>Scientific </option>
                                <option>Normal</option>
                            </select>
                        </td>
                        <td style="padding: 0px;"><input type="text" name="location" ngModel required
                                style="margin: 0px;"></td>
                        <td style="padding: 0px;"><input type="text" name="remark" ngModel required
                                style="margin: 0px;"></td>
                        <td style="padding: 0px; vertical-align: middle;"><button class="btn btn-info btn-sm"
                                (click)="saveCalculator(formData)">{{'common.add' | translate}}</button></td>
                    </tr>
                    <tr *ngFor="let res of results; let i=index">
                        <td>{{i+1}}</td>
                        <td>{{res.calculator_id}}</td>
                        <td>{{res.type}}</td>
                        <td>{{res.location}}</td>
                        <td style="text-align: left;">{{res.remark}}</td>
                        <td></td>
                    </tr>
                    <tr *ngIf="results?.length == 0">
                        <td colspan="6">{{'common.noRecords' | translate}}</td>
                    </tr>
                </table>
            </form>
        </div>
    </div>
    <div class="card-footer"><button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button></div>
</div>
