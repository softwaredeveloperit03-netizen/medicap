<!-- RCA LOG LIST -->
<div class="card" *ngIf="!isView">
  <div class="card-header">
    <div class="clr-row" style="margin-bottom: -10px">
      <div class="clr-col-6" style="color: aliceblue; text-align: left">
        RCA Approval
      </div>
      <div class="clr-col-6" style="text-align: right">
        <button
          class="btn btn-sm"
          routerLink="/qa/rootcause"
          style="background: red; color: white"
        >
          CLOSE
        </button>
      </div>
    </div>
  </div>

  <div class="card-block">
    <table class="table">
      <tr>
        <th>Sr.</th>
        <th>Initiating Dept</th>
        <th>{{'common.date' | translate}}</th>
        <th>RCA No</th>
        <th>{{'common.status' | translate}}</th>
        <th>{{'common.table.action' | translate}}</th>
      </tr>

      <tr *ngFor="let r of rcaList; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ r.dept }}</td>
        <td>{{ r.date }}</td>
        <td>{{ r.rca_no }}</td>
        <td [ngClass]="{ positive: r.status == 'pending' }">
          {{ r.status }}
        </td>
        <td>
          <button class="btn btn-sm btn-info" (click)="view(i)">{{'common.view' | translate}}</button>
        </td>
      </tr>

      <tr *ngIf="rcaList?.length == 0">
        <td colspan="6">No Records Found</td>
      </tr>
    </table>
  </div>
</div>
<!-- END RCA LOG LIST -->

<!-- RCA VIEW FORM -->
<div class="card" *ngIf="isView">
  <div class="card-header">
    <div class="clr-row">
      <div class="clr-col-9" style="color: aliceblue; text-align: left">
        RCA View
      </div>
      <div class="clr-col-3" style="text-align: right">
        <button
          class="btn btn-sm"
          (click)="isView = false"
          style="background: red; color: white"
        >
          CLOSE
        </button>
      </div>
    </div>
  </div>

  <div class="card-block">
    <form>
      <div class="clr-row">
        <div class="clr-col-6">
          <label>Initiating Dept</label>
          <input
            type="text"
            [(ngModel)]="selectedRca.dept"
            name="dept"
            readonly
          />
        </div>

        <div class="clr-col-6">
          <label>{{'common.date' | translate}}</label>
          <input
            type="date"
            [(ngModel)]="selectedRca.rca_date"
            name="date"
            readonly
          />
        </div>

        <div class="clr-col-6">
          <label>RCA No</label>
          <input
            type="text"
            [(ngModel)]="selectedRca.rca_no"
            name="rca_no"
            readonly
          />
        </div>

        <div class="clr-col-6">
          <label>Linked QMS No</label>
          <input
            type="text"
            [(ngModel)]="selectedRca.qms_no"
            name="qmsno"
            readonly
          />
        </div>

        <div class="clr-col-6">
          <label>Material Name</label>
          <input
            type="text"
            [(ngModel)]="selectedRca.material_name"
            name="material_name"
            readonly
          />
        </div>

        <div class="clr-col-6">
          <label>Medicap Lot No</label>
          <input
            type="text"
            [(ngModel)]="selectedRca.batch"
            name="batch"
            readonly
          />
        </div>

        <div class="clr-col-6">
          <label>Mfg Date</label>
          <input
            type="date"
            [(ngModel)]="selectedRca.mfg_date"
            name="mfg"
            readonly
          />
        </div>

        <div class="clr-col-6">
          <label>Expiry Date</label>
          <input
            type="date"
            [(ngModel)]="selectedRca.expiry_date"
            name="expiry"
            readonly
          />
        </div>

        <div class="clr-col-6">
          <label>Observation</label>
          <textarea
            rows="3"
            [(ngModel)]="selectedRca.observation"
            name="observation"
            readonly
          >
          </textarea>
        </div>

        <div class="clr-col-6">
          <label>Tools used for RCA</label>
          <input
            type="text"
            [(ngModel)]="selectedRca.tools"
            name="tools"
            readonly
          />
        </div>
      </div>
    </form>
  </div>
  <div class="card-footer">
    <button class="btn btn-primary" (click)="approve()">{{'common.approve' | translate}}</button>
  </div>
</div>
