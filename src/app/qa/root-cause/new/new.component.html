<div class="card">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px">
      <div
        class="clr-col-9"
        style="color: aliceblue; margin-top: -2px; text-align: left"
      >
        New RCA Form
      </div>
      <div
        class="clr-col-lg-3"
        style="text-align: right; padding-right: 0px; margin-top: -7px"
      >
        <button
          class="btn btn-sm"
          routerLink="/qa/rootcause"
          style="background-color: red; color: white"
        >
          <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
        </button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <form #newForm="ngForm">
      <div class="card-text">
        <div class="clr-row">
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Initiating Dept:<span style="color: red">*</span></label>
            <input type="text" name="dept" [(ngModel)]="dept" required />
          </div>
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Date:<span style="color: red">*</span></label>
            <input type="date" name="date" ngModel required />
          </div>
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label> Material Type<span style="color: red">*</span> </label>

            <select
              class="clr-select"
              name="material_type"
              [(ngModel)]="materialType"
              (ngModelChange)="getMaterials()"
              required
            >
              <option value="" disabled>-- Select Type --</option>
              <option value="Raw Material">Raw Material</option>
              <option value="Packing Material">Packing Material</option>
            </select>
          </div>

          <!-- <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label>RCA No.:<span style="color: red">*</span></label>
            <input type="text" name="rca" ngModel required />
          </div> -->
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Linked QMS No.:<span style="color: red">*</span></label>
            <input type="text" name="qmsno" ngModel required />
          </div>
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>
              Product / Stage / Material Name<span style="color: red">*</span>
            </label>

            <select
              class="clr-select"
              name="material_name"
              [(ngModel)]="selectedMaterial"
              (ngModelChange)="getBatchDetails()"
              required
            >
              <option [ngValue]="null">-- Select Material --</option>

              <option *ngFor="let m of mat" [ngValue]="m">
                {{ m.material_name }}
              </option>
            </select>
          </div>

          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>
              Medicap Lot No / Lot No. / Receiving no<span style="color: red"
                >*</span
              >
            </label>

            <select
              class="clr-select"
              name="batch"
              [(ngModel)]="selectedBatch"
              (ngModelChange)="onBatchChange()"
              required
            >
              <option [ngValue]="null">-- Select Batch --</option>

              <option *ngFor="let b of batchList" [ngValue]="b">
                {{ b.batch_no }}
              </option>
            </select>
          </div>

          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Mfg. Date<span style="color: red">*</span></label>
            <input
              type="date"
              name="mfg"
              [(ngModel)]="mfgDate"
              readonly
              required
            />
          </div>

          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Expiry Date<span style="color: red">*</span></label>
            <input
              type="date"
              name="expiry"
              [(ngModel)]="expiryDate"
              readonly
              required
            />
          </div>

          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label> Observation:<span style="color: red">*</span> </label>
            <input type="text" name="observation" ngModel required />
          </div>
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label>Tools used for RCA:<span style="color: red">*</span></label>
            <input type="text" name="tool" ngModel required />
          </div>
          <!-- CAPA Yes / No -->
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label> CAPA Required?<span style="color: red">*</span> </label>

            <select
              name="capa"
              class="clr-select"
              [(ngModel)]="capaRequired"
              required
            >
              <option value="" disabled selected>-- Select --</option>
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </div>

          <!-- Corrective & Preventive Action Textarea -->
          <div
            class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12"
            *ngIf="capaRequired === 'Yes'"
          >
            <label>
              Corrective & Preventive Action<span style="color: red">*</span>
            </label>
            <textarea
              name="capa_action"
              rows="4"
              ngModel
              required
              placeholder="Enter corrective and preventive action"
            ></textarea>
          </div>
        </div>
      </div>
    </form>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="save(newForm)">{{'common.submit' | translate}}</button>
    </div>
  </div>
</div>
