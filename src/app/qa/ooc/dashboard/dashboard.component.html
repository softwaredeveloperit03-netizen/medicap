<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-lg-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Out of Calibration</div>
          <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-success" routerLink="awaiting">Awaiting Requisitions</button>
            <button class="btn btn-sm btn-danger" routerLink="/qa">{{'common.close' | translate}}</button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <div class="clr-row">
                <div class="clr-col-lg-3">
                    <label>Department:</label>
                    <select name="department_name" [(ngModel)]="department_name" required>
                        <option></option>
                        <option *ngFor="let user of departments">{{ user.department_name }}</option>
                    </select>
                </div>
                <div class="clr-col-lg-3">
                    <label>From Date:</label>
                    <input type="date" name="from_date" [(ngModel)]="from_date" required>
                </div>
                <div class="clr-col-lg-3">
                    <label>To Date:</label>
                    <input type="date" name="to_date" [(ngModel)]="to_date" required>
                </div>
                <div class="clr-col-lg-3" style="padding: 0px;">
                    <button class="btn btn-danger" (click)="getOOCLog()" style="margin-top: 30px;">{{'common.search' | translate}}</button>
                </div>
            </div>
            <table class="table">
                <tr>
                    <th>{{'common.date' | translate}}</th>
                    <th>OOC Report No.</th>
                    <th>Dept.</th>
                    <th>Equipment Details</th>
                    <th>Details of OOC</th>
                    <th>Requisition given By</th>
                    <th>Issued By</th>
                    <th>CAPA Taken</th>
                    <th>OOC Closed on</th>
                    <th>{{'common.table.remark' | translate}}</th>
                    <th>{{'common.table.action' | translate}}</th>
                </tr>
                <tr *ngIf="results?.length == 0">
                    <td colspan="11">{{'common.noRecords' | translate}}</td>
                </tr>
            </table>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary">{{'common.download' | translate}}</button>
    </div>
</div>
