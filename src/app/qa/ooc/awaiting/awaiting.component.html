<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-lg-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Awaiting Out of Calibration</div>
          <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-danger" routerLink="/qa/ooc">{{'common.close' | translate}}</button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <table class="table">
                <tr>
                    <th>{{'common.date' | translate}}</th>
                    <th>OOC Report No.</th>
                    <th>Dept.</th>
                    <th>Equipment Name</th>
                    <th>Equipment Code</th>
                    <th>Make</th>
                    <th>Location</th>
                    <th>{{'common.table.action' | translate}}</th>
                </tr>
                <tr *ngIf="results?.length == 0">
                    <td colspan="8">{{'common.noRecords' | translate}}</td>
                </tr>
            </table>
        </div>
    </div>
</div>
