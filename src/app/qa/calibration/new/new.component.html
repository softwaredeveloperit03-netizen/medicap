<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">New Calibration</div>
      <div class="card-block">
        <div class="card-text">
          <form #calibration="ngForm">
            <div class="clr-row">
              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label>Equipment Id:</label>
                <select name="equipment_code" ngModel required>
                    <option></option>
                  <option *ngFor="let result of results" [value]="result.equipment_code">{{ result.equipment_name }} - {{ result.equipment_code }}</option>
                </select>
              </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Gmp Impact:</label>
                    <select name="gmp_impact" ngModel=required>
                      <option>low </option>
                      <option>Moderate</option>
                      <option>high</option>
                    </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Economical Impact:</label>
                    <select name="economical_impact" ngModel required>
                      <option>Low</option>
                      <option>Moderate</option>
                      <option>High</option>
                    </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Frequency:</label>
                    <select name="frequency" [(ngModel)]="frequency" required>
                        <option>once in a week</option>
                        <option>everyday</option>
                        <option>once in a month</option>
                    </select>
                </div>
                <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                  <label>Conclusion: </label>
                  <input type="text" name="conclusion" ngModel required>
                </div>
                <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12" *ngIf="frequency == 'once in a week'">
                    <label>Day:</label>
                    <select name="day" ngModel required>
                        <option>Sunday</option>
                        <option>Monday</option>
                        <option>Tuesday</option>
                        <option>wednesday</option>
                        <option>Thirsday</option>
                        <option>Friday</option> 
                        <option>Saturday</option>        
                    </select>
                </div>
                <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12" *ngIf="frequency == 'once in a month'">
                    <label>Date:</label>
                    <select name="day" ngModel required>
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                        <option>6</option>
                        <option>7</option>
                        <option>8</option>
                        <option>9</option>
                        <option>10</option>
                        <option>11</option>
                        <option>12</option>
                        <option>13</option>
                        <option>14</option>
                        <option>15</option>
                        <option>16</option>
                        <option>17</option>
                        <option>18</option>
                        <option>19</option>
                        <option>20</option>
                        <option>21</option>
                        <option>22</option>
                        <option>23</option>
                        <option>24</option>
                        <option>25</option>
                        <option>26</option>
                        <option>27</option>
                        <option>28</option>
                        <option>29</option>
                        <option>30</option>
                        <option>31</option>
                    </select>
                </div>
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                  <label>Acceptance Criteria:</label>
                  <input type="text" name="acceptance_criteria" ngModel required>
                </div>
            </div>
            </form>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="save(calibration)">{{'common.save' | translate}}</button>
      </div>
    </div>
</div>
