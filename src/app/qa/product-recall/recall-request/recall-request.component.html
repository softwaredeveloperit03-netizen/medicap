<div class="container-fluid" *ngIf="isNew">
  <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
    <div class="card">
      <div class="card-header">Product Recall </div>
      <div class="card-block">
        <div class="card-text">

          <form [formGroup]="reactiveForm">
            <div class="clr-row">

              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong> Name of Product</strong></label>
                <input type="text" formControlName="product_name">
              </div>

              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Medicap Lot No</strong></label>
                <input type="text" formControlName="batch_no">
              </div>

              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Date of Manufacture</strong></label>
                <input type="date" formControlName="mfg_date">
              </div>

              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Date of Expiry</strong></label>
                <input type="date" formControlName="exp_date">
              </div>

              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Recall Coordinator</strong></label>
                <input type="text" formControlName="coordinator">
              </div>

              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Company Person Nominated</strong></label>
                <input type="text" formControlName="company_person">
              </div>

              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Name of Person Nominated on Behalf of Client</strong></label>
                <input type="text" formControlName="clients_person">
              </div>

              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong>{{'common.email' | translate}}</strong></label>
                <input type="text" formControlName="email">
              </div>

              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Mobile</strong></label>
                <input type="text" formControlName="mobile">
              </div>

              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12" style="margin-top: 15px;">
                <label><strong>Type of Recall</strong></label>
                <div class="clr-row">

                  <div class="clr-col-lg-2 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox type="checkbox" formControlName="mock_recall" value="true" id="mock_recall" />
                        <label class="clr-control-label" for="mock_recall">Mock Recall</label>
                      </div>
                    </div>
                  </div>

                  <div class="clr-col-lg-2 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox type="checkbox" formControlName="public_recall" value="true" id="public_recall" />
                        <label class="clr-control-label" for="public_recall">Public Recall</label>
                      </div>
                    </div>
                  </div>

                  <div class="clr-col-lg-2 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox type="checkbox" value="true" formControlName="professional_recall" id="professional_recall" />
                        <label class="clr-control-label" for="professional_recall">Professional Recall</label>
                      </div>
                    </div>
                  </div>

                  <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox type="checkbox" value="true" formControlName="enforcement_auth_recall" id="enforcement_auth_recall" />
                        <label class="clr-control-label" for="enforcement_auth_recall">Recall as directed by Enforcement
                          authorities</label>
                      </div>
                    </div>
                  </div>

                </div>
              </div>

              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12" style="margin-top: 15px;">
                <label><strong>Implementation Method Adopted</strong></label>
                <div class="clr-row">

                  <div class="clr-col-lg-2 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox type="checkbox" value="true" formControlName="television" id="television" />
                        <label class="clr-control-label" for="television">Television</label>
                      </div>
                    </div>
                  </div>

                  <div class="clr-col-lg-2 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox type="checkbox" value="true" formControlName="radio" id="radio" />
                        <label class="clr-control-label" for="radio">Radio</label>
                      </div>
                    </div>
                  </div>

                  <div class="clr-col-lg-2 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox type="checkbox" value="true" formControlName="newspaper" id="newspaper" />
                        <label class="clr-control-label" for="newspaper">Newspaper</label>
                      </div>
                    </div>
                  </div>

                  <div class="clr-col-lg-2 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox type="checkbox" value="true" formControlName="cfagents" id="cfagents" />
                        <label class="clr-control-label" for="cfagents">C & F agents</label>
                      </div>
                    </div>
                  </div>

                  <div class="clr-col-lg-2 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox type="checkbox" value="true" formControlName="stockiest" id="stockiest" />
                        <label class="clr-control-label" for="stockiest">Stockiest</label>
                      </div>
                    </div>
                  </div>

                  <div class="clr-col-lg-2 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox type="checkbox" value="true" formControlName="distributors" id="distributors" />
                        <label class="clr-control-label" for="distributors">Distributors</label>
                      </div>
                    </div>
                  </div>

                </div>
              </div>

              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12" style="margin-top: 15px;">
                <label><strong>Reason for Recall</strong></label>
                <div class="clr-row">

                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox type="checkbox" value="true" formControlName="mfg_error" id="mfg_error" />
                        <label class="clr-control-label" for="mfg_error">Manufacturing Error
                          </label>
                      </div>
                    </div>
                  </div>

                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox type="checkbox" value="true" formControlName="packing_error" id="packing_error" />
                        <label class="clr-control-label" for="packing_error">Packing Error
                          </label>
                      </div>
                    </div>
                  </div>

                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox type="checkbox" value="true" formControlName="side_effect" id="unforeseen_error" />
                        <label class="clr-control-label" for="unforeseen_error">Unforeseen Error
                          </label>
                      </div>
                    </div>
                  </div>

                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox type="checkbox" value="true" formControlName="dosage_error" id="dosage_error" />
                        <label class="clr-control-label" for="dosage_error">Dosage Error
                          </label>
                      </div>
                    </div>
                  </div>

                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox type="checkbox" value="true" formControlName="degradation" id="degradation" />
                        <label class="clr-control-label" for="degradation">Degradation of active ingredient
                        </label>
                      </div>
                    </div>
                  </div>

                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox type="checkbox" value="true" formControlName="abnormal_stability" id="abnormal_stability" />
                        <label class="clr-control-label" for="abnormal_stability">Abnormal stability results                          
                        </label>
                      </div>
                    </div>
                  </div>

                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox type="checkbox" value="true" formControlName="contamination_product" id="contamination_rpoduct" />
                        <label class="clr-control-label" for="contamination_rpoduct">Contamination of product                                                    
                        </label>
                      </div>
                    </div>
                  </div>

                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox type="checkbox" value="true" formControlName="release_change" id="release_change" />
                        <label class="clr-control-label" for="release_change">Change in Release pattern                                                                             
                        </label>
                      </div>
                    </div>
                  </div>

                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox type="checkbox" value="true" formControlName="packing_defect" id="packing_defect" />
                        <label class="clr-control-label" for="packing_defect">Defect of packaging                                                                                                      
                        </label>
                      </div>
                    </div>
                  </div>

                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox type="checkbox" value="true" formControlName="overprint_error_price" id="overprint_error_price" />
                        <label class="clr-control-label" for="overprint_error_price">Overprinting error - price                                                                                                     
                        </label>
                      </div>
                    </div>
                  </div>

                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox type="checkbox" value="true" formControlName="overprint_error_batch" id="overprint_error_batch" />
                        <label class="clr-control-label" for="overprint_error_batch">Overprinting error - Medicap Lot No                                                                                                     
                        </label>
                      </div>
                    </div>
                  </div>

                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox type="checkbox" value="true" formControlName="overprint_error_exp" id="overprint_error_exp" />
                        <label class="clr-control-label" for="overprint_error_exp">Overprinting error - Date of expiry                                                                                               
                        </label>
                      </div>
                    </div>
                  </div>

                </div>
              </div>

              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Any Other Reason</strong></label>
                <input type="text" formControlName="other_reason">
              </div>

              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Recalled Product to be received at</strong></label>
                <input type="text" formControlName="product_receive">
              </div>

              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Quantities received against distributed location-wise </strong></label>
                <input type="file" (change)="onFileChange($event, 'received_quantity')" name="file">
              </div>

              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Recalled goods received examination report</strong></label>
                <input type="file" (change)="onFileChange($event, 'examination_report')">
              </div>

              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Recalled goods destruction report as per current SOP for Destruction of Finished Products</strong></label>
                <input type="file" (change)="onFileChange($event, 'destruction_report')">
              </div>

            </div>
          </form>
        </div>
      </div>

      <div class="card-footer">
        <button class="btn btn-primary" (click)="saveProductRecall()">{{'common.submit' | translate}}</button>
        <button class="btn btn-danger" (click)="isNew = false">{{'common.close' | translate}}</button>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid" *ngIf="!isView && !isNew">
  <div class="card">
    <div class="card-header">Product Recall</div>
    <div class="card-block">
      <div class="card-text">
        <button class="btn btn-sm" (click)="isNew = true">Add New Product Recall</button>
        <clr-datagrid>
          <clr-dg-column>Sr.</clr-dg-column>
          <clr-dg-column>Product Name</clr-dg-column>
          <clr-dg-column>Medicap Lot No</clr-dg-column>
          <clr-dg-column>Coordinator</clr-dg-column>
          <clr-dg-column>View</clr-dg-column>
          <clr-dg-column>PDF</clr-dg-column>

          <clr-dg-row *ngFor="let entry of products; let i = index">
            <clr-dg-cell>{{ i + 1 }}. </clr-dg-cell>
            <clr-dg-cell>{{ entry.product_name }}</clr-dg-cell>
            <clr-dg-cell>{{ entry.batch_no }}</clr-dg-cell>
            <clr-dg-cell>{{ entry.coordinator }}</clr-dg-cell>

            <clr-dg-cell>
              <button class="btn btn-sm btn-info" (click)="viewPlan(i)">{{'common.view' | translate}}</button>
            </clr-dg-cell>
            
            <clr-dg-cell>
              <button class="btn btn-sm btn-info" (click)="viewPDF(i)">PDF</button>
            </clr-dg-cell>

          </clr-dg-row>
        </clr-datagrid>

      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-danger" (click)="close()">{{'common.close' | translate}}</button>
    </div>
  </div>

</div>

            </div>

            </div>

            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">

              <input type="date" [value]="selectedProduct.mfg_date" disabled>
            </div>

            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">

                    <div class="clr-checkbox-wrapper">

                    <div class="clr-checkbox-wrapper">

                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">

                    <div class="clr-checkbox-wrapper">
                      <input clrcheckbox type="checkbox" [checked]="selectedProduct.enforcement_auth_recall == 'true' ? true : false" id="enforcement_auth_recall" disabled>

            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12" style="margin-top: 15px;">
              <label><strong>Implementation Method Adopted</strong></label>

                  </div>
                </div>

                <div class="clr-col-lg-2 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                  <div class="clr-control-container">
                    <div class="clr-checkbox-wrapper">
                      <input clrcheckbox type="checkbox" [checked]="selectedProduct.radio == 'true' ? true : false" id="radio" disabled>
                      <label class="clr-control-label" for="radio">Radio</label>
                    </div>
                  </div>
                </div>

                <div class="clr-col-lg-2 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                  <div class="clr-control-container">
                    <div class="clr-checkbox-wrapper">
                      <input clrcheckbox type="checkbox" [checked]="selectedProduct.newspaper == 'true' ? true : false" id="newspaper" disabled>
                      <label class="clr-control-label" for="newspaper">Newspaper</label>
                    </div>
                  </div>
                </div>

                <div class="clr-col-lg-2 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                  <div class="clr-control-container">
                    <div class="clr-checkbox-wrapper">
                      <input clrcheckbox type="checkbox" [checked]="selectedProduct.cfagents == 'true' ? true : false" id="cfagents" disabled>
                      <label class="clr-control-label" for="cfagents">C & F agents</label>
                    </div>
                  </div>
                </div>

                <div class="clr-col-lg-2 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                  <div class="clr-control-container">
                    <div class="clr-checkbox-wrapper">
                      <input clrcheckbox type="checkbox" [checked]="selectedProduct.stockiest == 'true' ? true : false" id="stockiest" disabled>
                      <label class="clr-control-label" for="stockiest">Stockiest</label>
                    </div>
                  </div>
                </div>

                <div class="clr-col-lg-2 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                  <div class="clr-control-container">
                    <div class="clr-checkbox-wrapper">
                      <input clrcheckbox type="checkbox" [checked]="selectedProduct.distributors == 'true' ? true : false" id="distributors" disabled>
                      <label class="clr-control-label" for="distributors">Distributors</label>
                    </div>
                  </div>
                </div>

              </div>
            </div>

            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12" style="margin-top: 15px;">
              <label><strong>Reason for Recall</strong></label>
              <div class="clr-row">

                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <div class="clr-control-container">
                    <div class="clr-checkbox-wrapper">
                      <input clrcheckbox type="checkbox" [checked]="selectedProduct.mfg_error == 'true' ? true : false" id="mfg_error" disabled>
                      <label class="clr-control-label" for="mfg_error">Manufacturing Error
                        </label>
                    </div>
                  </div>
                </div>

                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <div class="clr-control-container">
                    <div class="clr-checkbox-wrapper">
                      <input clrcheckbox type="checkbox" [checked]="selectedProduct.packing_error == 'true' ? true : false" id="packing_error" disabled>
                      <label class="clr-control-label" for="packing_error">Packing Error
                        </label>
                    </div>
                  </div>
                </div>

                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <div class="clr-control-container">
                    <div class="clr-checkbox-wrapper">
                      <input clrcheckbox type="checkbox"  [checked]="selectedProduct.side_effect == 'true' ? true : false" id="unforeseen_error" disabled>
                      <label class="clr-control-label" for="unforeseen_error">Unforeseen Error
                        </label>
                    </div>
                  </div>
                </div>

                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <div class="clr-control-container">
                    <div class="clr-checkbox-wrapper">
                      <input clrcheckbox type="checkbox" [checked]="selectedProduct.dosage_error == 'true' ? true : false" id="dosage_error" disabled>
                      <label class="clr-control-label" for="dosage_error">Dosage Error
                        </label>
                    </div>
                  </div>
                </div>

                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <div class="clr-control-container">
                    <div class="clr-checkbox-wrapper">
                      <input clrcheckbox type="checkbox" [checked]="selectedProduct.degradation == 'true' ? true : false" id="degradation" disabled>
                      <label class="clr-control-label" for="degradation">Degradation of active ingredient
                      </label>
                    </div>
                  </div>
                </div>

                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <div class="clr-control-container">
                    <div class="clr-checkbox-wrapper">
                      <input clrcheckbox type="checkbox" [checked]="selectedProduct.abnormal_stability == 'true' ? true : false" id="abnormal_stability" disabled>
                      <label class="clr-control-label" for="abnormal_stability">Abnormal stability results                          
                      </label>
                    </div>
                  </div>
                </div>

                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <div class="clr-control-container">
                    <div class="clr-checkbox-wrapper">
                      <input clrcheckbox type="checkbox" [checked]="selectedProduct.contamination_product == 'true' ? true : false" id="contamination_rpoduct" disabled>
                      <label class="clr-control-label" for="contamination_rpoduct">Contamination of product                                                    
                      </label>
                    </div>
                  </div>
                </div>

                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <div class="clr-control-container">
                    <div class="clr-checkbox-wrapper">
                      <input clrcheckbox type="checkbox" [checked]="selectedProduct.release_change == 'true' ? true : false" id="release_change" disabled>
                      <label class="clr-control-label" for="release_change">Change in Release pattern                                                                             
                      </label>
                    </div>
                  </div>
                </div>

                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <div class="clr-control-container">
                    <div class="clr-checkbox-wrapper">
                      <input clrcheckbox type="checkbox" [checked]="selectedProduct.packing_defect == 'true' ? true : false" id="packing_defect" disabled>
                      <label class="clr-control-label" for="packing_defect">Defect of packaging                                                                                                      
                      </label>
                    </div>
                  </div>
                </div>

                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <div class="clr-control-container">
                    <div class="clr-checkbox-wrapper">
                      <input clrcheckbox type="checkbox" [checked]="selectedProduct.overprint_error_price == 'true' ? true : false" id="overprint_error_price" disabled>
                      <label class="clr-control-label" for="overprint_error_price">Overprinting error - price                                                                                                     
                      </label>
                    </div>
                  </div>
                </div>

                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <div class="clr-control-container">
                    <div class="clr-checkbox-wrapper">
                      <input clrcheckbox type="checkbox" [checked]="selectedProduct.overprint_error_batch == 'true' ? true : false" id="overprint_error_batch" disabled>
                      <label class="clr-control-label" for="overprint_error_batch">Overprinting error - Medicap Lot No                                                                                                     
                      </label>
                    </div>
                  </div>
                </div>

                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <div class="clr-control-container">
                    <div class="clr-checkbox-wrapper">
                      <input clrcheckbox type="checkbox" [checked]="selectedProduct.overprint_error_exp == 'true' ? true : false" id="overprint_error_exp" disabled>
                      <label class="clr-control-label" for="overprint_error_exp">Overprinting error - Date of expiry                                                                                               
                      </label>
                    </div>
                  </div>
                </div>

              </div>
            </div>

            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Any Other Reason</strong></label>
              <input type="text" [value]="selectedProduct.other_reason" disabled>
            </div>

            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Recalled Product to be received at</strong></label>
              <input type="text" [value]="selectedProduct.product_receive" disabled>
            </div>

            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Quantities received against distributed location-wise </strong></label>
              <a [href]="selectedProduct.received_quantity">FILE</a>
            </div>

            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Recalled goods received examination report</strong></label>
              <a [href]="selectedProduct.examination_report">FILE</a>
            </div>

            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Recalled goods destruction report as per current SOP for Destruction of Finished Products</strong></label>
              <a [href]="selectedProduct.destruction_report">FILE</a>
            </div>

          </div>
        </form>
        
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-danger" (click)="isView = false">{{'common.close' | translate}}</button>
    </div>
  </div>
</div>
