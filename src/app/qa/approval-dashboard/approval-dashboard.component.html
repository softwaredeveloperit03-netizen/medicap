<div class="component">
  <div class="subsection">
    <div class="purchase-block">
      <div class="exit-section">
        <div class="header-block" *ngIf="showTiles" style="margin:10px 0px">
          <h3>Approval</h3>
          <div routerLink="/qa" class="name-board2"><i class="fas fa-times"></i></div>
        </div>

        <div class="main-section approval-main-section">
          <!-- Submodule tiles: only on /qa/approval -->
          <div class="category" *ngIf="showTiles">
            <div class="line-section">
              <div class="header-div">
                <h3>Approval Section</h3>
              </div>
            </div>
            <div class="block-container approval-block-container">
              <div class="item-block" routerLink="sampling" routerLinkActive="item-block--active">
                <i class="fas fa-flask"></i>
                <span>Sampling Approvals</span>
              </div>
              <div class="item-block" routerLink="fgProductApproval" routerLinkActive="item-block--active">
                <i class="fas fa-clipboard-check"></i>
                <span>Finished Product Approval</span>
              </div>
              <div class="item-block" routerLink="materialApproval" routerLinkActive="item-block--active">
                <i class="fas fa-vial"></i>
                <span>RM/PM Material Approval</span>
              </div>
            </div>
          </div>

          <!-- Child submodule content opens here (replaces tiles) -->
          <div class="approval-child-outlet" [class.approval-child-outlet--open]="!showTiles">
            <router-outlet></router-outlet>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
