<div class="container-fluid" *ngIf="!isNew">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Stability Chamber Log</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/qa/stability" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
  </div>
    <div class="card-block">
      <div class="card-text">
        <button class="btn btn-sm btn-info" *ngIf="isuser == 'Yes'" (click)="isNew = true">NEW TEMP / HUMIDITY ENTRY</button>
        <table class="table table-border">
          <tr>
            <th style="background-color: aquamarine; font-weight: bolder;text-align: left;">Sr.</th>
            <th style="background-color: aquamarine; font-weight: bolder;text-align: left;">Chamber No.</th>
            <th style="background-color: aquamarine; font-weight: bolder;text-align: left;">Usages For</th>
            <th style="background-color: aquamarine; font-weight: bolder;text-align: left;">Temperature</th>
            <th style="background-color: aquamarine; font-weight: bolder;text-align: left;">Humidity</th>
            <th style="background-color: aquamarine; font-weight: bolder;text-align: left;">Entry By</th>
            <th style="background-color: aquamarine; font-weight: bolder;text-align: left;">Entry Date</th>
          </tr>
          <tr *ngFor="let result of results; let i = index">
            <td style="font-weight: bolder;text-align: left;">{{ i + 1 }}</td>
            <td style="font-weight: bolder;text-align: left;">{{ result.chember_no }}</td>
            <td style="font-weight: bolder;text-align: left;">{{ result.usages }}</td>
            <td style="font-weight: bolder;text-align: left;">{{ result.temp }}</td>
            <td style="font-weight: bolder;text-align: left;">{{ result.humidity }}</td>
            <td style="font-weight: bolder;text-align: left;">{{ result.entry_by }}</td>
            <td style="font-weight: bolder;text-align: left;">{{ result.entry_date | date: 'dd-MM-yyyy'}}</td>
          </tr>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid" *ngIf="isNew">
  <div class="card">
    <div class="card-header">Daily Temperature Entry</div>
    <div class="card-block">
      <div class="card-text">
        <form #tempForm="ngForm">
          <div class="clr-row">
            <div class="clr-col-4">
              <label>Chember No.:</label>
              <select name="chember_no" ngModel required>
                <option></option>
                <option>test</option>
              </select>
            </div>
            <div class="clr-col-4">
              <label>Temperature:</label>
              <input type="text" name="temperature" ngModel required>
            </div>
            <div class="clr-col-4">
              <label>Humidity:</label>
              <input type="text" name="humidity" ngModel required>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="saveChemberTemperature(tempForm)">{{'common.submit' | translate}}</button>
      <button class="btn btn-danger" (click)="isNew = false">{{'common.close' | translate}}</button>
    </div>
  </div>
</div>
