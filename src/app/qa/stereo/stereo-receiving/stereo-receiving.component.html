<div class="container-fluid" *ngIf="isNew">
  <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
    <div class="card">
      <div class="card-header">Stereo Issuance Form</div>
      
      <div class="card-block">
        <div class="card-text">
          <form #Stereo="ngForm">

            <div class="clr-row">
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Stereo Issue From:</strong></label>
                <input type="text" name="issue_from" ngModel required>
              </div>

              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Stereo Issue By:</strong></label>
                <input type="text" name="issue_by" ngModel required>
              </div>

              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong>No of Stereo Issued:</strong></label>
                <input type="text" name="stereo_no" ngModel required>
              </div>

              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Issue Date:</strong></label>
                <input type="date" name="issue_date" ngModel required>
              </div>

            </div>
          </form>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="Stereo.form.valid && saveForm(Stereo)" [disabled]="Stereo.form.invalid">{{'common.submit' | translate}}</button>
        <button class="btn btn-danger" (click)="isNew = false">{{'common.close' | translate}}</button>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid" *ngIf="!isNew">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Stereo Issuance</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/qa/stereo" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>

    <div class="card-block">
      <div class="card-text">
        <button class="btn btn-sm" *ngIf="isuser == 'Yes'" (click)="isNew = true">New Stereo Issuance Form</button>
        <table class="table table-border">
          <tr>
            <th style="width: 40px; background-color: rgb(14, 67, 112); color: white;">Sr.</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">ID</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Issue Form</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Issued By</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Issued Date</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">No of Stereo</th>
          </tr>
          <tr *ngFor="let entry of entries; let i = index">
            <td>{{ i + 1 }}</td>
            <td style="text-align: left;">{{ entry.stereo_id }}</td>
            <td style="text-align: left;">{{ entry.issue_from }}</td>
            <td style="text-align: left;">{{ entry.issue_by }}</td>
            <td style="text-align: left;">{{ entry.issue_date | date: 'dd-MM-yyyy'}}</td>
            <td style="text-align: left;">{{ entry.stereo_no }}</td>
          </tr>
          <tr *ngIf="entries?.length == 0">
            <td colspan="6" style="text-align: center;">{{'common.noRecords' | translate}}</td>
          </tr>
        </table>
      </div>
    </div>
  </div>
</div>
