<div class="container-fluid">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Stereo Issuance Log</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/qa/stereo" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <table class="table table-border">
          <tr>
            <th style="width: 40px; text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr.</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">ID</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Issue From</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Issued By</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Issued Date</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">No of Stereo Issued</th>
          </tr>
          <tr *ngFor="let entry of entries; let i = index">
            <td>{{ i + 1 }}.</td>
            <td style="text-align: left;">{{ entry.stereo_id }}</td>
            <td style="text-align: left;">{{ entry.issue_from }}</td>
            <td style="text-align: left;">{{ entry.issue_by }}</td>
            <td style="text-align: left;">{{ entry.issue_date | date: 'dd-MM-yyyy'}}</td>
            <td style="text-align: left;">{{ entry.stereo_no }}</td>
          </tr>
          <tr *ngIf="entries?.length == 0">
            <td colspan="6" style="text-align: center;">{{'common.noRecords' | translate}}</td>
          </tr>
        </table>
      </div>
    </div>
  </div>
</div>
