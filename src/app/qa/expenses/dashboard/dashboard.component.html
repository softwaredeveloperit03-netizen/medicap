<div class="card">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-lg-3" style="color: aliceblue;margin-top: -2px;text-align: left;">Expenses Log </div>
      <div class="clr-col-lg-9" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        <button class="btn btn-sm btn-success" routerLink="categories">EXPENSES CATEGORIES</button>
        <button class="btn btn-sm btn-success" routerLink="new">NEW EXPENSES ENTRY</button>
        <button class="btn btn-sm btn-danger" routerLink="/qa">{{'common.close' | translate}}</button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <div class="card-text">
      <table class="table table-border">
        <tr>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr.</th>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.date' | translate}}</th>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.category' | translate}}</th>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Pay mode</th>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.amount' | translate}}</th>
        </tr>
        <tr *ngFor="let result of results; let i = index">
          <td style="text-align: left;">{{ i + 1 }}.</td>
          <td style="text-align: left;">{{result.entry_date | date: 'dd-MM-yyyy'}}</td>
          <td style="text-align: left;">{{result.category }}</td>
          <td style="text-align: left;">{{result.pay_mode}}</td>
          <td style="text-align: left;">{{result.amount}}</td>
        </tr>
        <tr *ngIf="results?.length == 0">
          <td colspan="6">No. Records Found!</td>
        </tr>
      </table>
    </div>
  </div>
  <div class="card-footer">
    <button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button>
  </div>
</div>
