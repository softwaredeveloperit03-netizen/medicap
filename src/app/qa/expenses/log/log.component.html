<div class="card" *ngIf="!isView">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Expenses Log </div>
      <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        <button class="btn btn-sm btn-danger" routerLink="/account/expenses">{{'common.close' | translate}}</button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <div class="card-text">
      <table class="table">
        <tr>
          <th style="text-align:left;">Sr.</th>
          <th style="text-align:left;">{{'common.date' | translate}}</th>
          <th style="text-align:left;">{{'common.category' | translate}}</th>
          <th style="text-align:left;">Pay mode</th>
          <th style="text-align:left;">{{'common.amount' | translate}}</th>
          <th style="text-align:left;">{{'common.status' | translate}}</th>
        </tr>
        <tr *ngFor="let result of results; let i = index">
          <td style="text-align: left;">{{ i + 1 }}.</td>
          <td style="text-align: left;">{{result.entry_date }}</td>
          <td style="text-align: left;">{{result.category }}</td>
          <td style="text-align: left;">{{result.pay_mode}}</td>
          <td style="text-align: left;">{{result.amount}}</td>
          <td style="text-align: left;">{{result.status}}</td>
        </tr>
        <tr *ngIf="results?.length == 0">
          <td colspan="6">No. Records Found!</td>
        </tr>
      </table>
    </div>
  </div>
  <div class="card-footer">
    <button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button>
  </div>
</div>
