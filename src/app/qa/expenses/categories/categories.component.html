<div class="container-fluid">
  <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Expenses Categories </div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/qa/expenses" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
      <div class="card-block">
          <form #exp="ngForm">
            <div class="clr-row">
              <div class="clr-col-lg-10 clr-col-md-10 clr-col-sm-12 clr-col-xs-12">
                <label>Categories:</label>
                <input type="text" name="category" ngModel required>
              </div>
              <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
              <button class="btn btn-primary" (click)="save(exp)" style="margin-top:30px;">{{'common.save' | translate}}</button>
              </div>
            </div>
          </form>
          <table class="table">
            <tr>
              <th style="text-align: left;;">Sr</th>
              <th style="text-align: left;">Categories</th>
            </tr>
            <tr *ngFor="let print of results;let i=index">
              <td style="text-align: left;">{{i+1}}</td>
              <td style="text-align: left;">{{print.category}}</td>
            </tr>
          </table> 
      </div>
      <div class="card-footer">
      </div>
  </div>
</div>
