<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Expense Entry Form</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-danger" routerLink="/account/expenses">{{'common.close' | translate}}</button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #dataAdd="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Category:</label>
                        <select name="category" ngModel required style="height: 35px;"> 
                            <option></option>
                            <option *ngFor="let cat of categories">{{cat.category}}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Payment Mode:</label>
                        <select name="pay_mode" ngModel required style="height: 35px;">
                            <option></option>
                            <option>Credit card</option>
                            <option>Debit card</option>
                            <option>net Banking</option>
                            <option>Cash</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12">
                        <label>Amount:</label>
                        <input type="text" name="amount" ngModel required >
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                        <label>Notes(Optional):</label> 
                        <textarea rows="2" name="note" ngModel></textarea>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)='saveExpenses(dataAdd)'>{{'common.save' | translate}}</button>
    </div>
</div>
