<div class="card" *ngIf="!isview">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Important Document Log</div>
            <div class="clr-col-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
              
                <button class="btn btn-sm"  (click)="isview = true" style="background-color: rgb(22, 161, 45);color: white;">
                      Add New Document
                </button>
                <button class="btn btn-sm" routerLink="/qa" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
                
            </div>
        </div>
    </div>
<div class="card-block">
    <!-- <div class="card-title">Document:</div> -->
        <div class="card-text">
        <table class="table table-border">
        <tr>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Document Name</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Document Type</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Document Description</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Effective Date</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Validity</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.table.action' | translate}}</th>
        </tr>

            <tr *ngFor="let doc of documentlist; let i = index" >
                <td style="text-align:left">{{ doc.d_name}}</td>
                <td style="text-align:left" *ngIf="doc.d_type != 'Other'">{{ doc.d_type }}</td>
                <td style="text-align:left" *ngIf="doc.d_type == 'Other'">{{ doc.other_doc }}</td>
                <td style="text-align:left">{{ doc.d_description }}</td>
                <td style="text-align:left">{{ doc.effective_date }}</td>
                <td style="text-align:left">{{ doc.validity }}</td>
                
                <td style="text-align: center;">
                    <button class="btn btn-info btn-sm"(click)="viewChallan(doc.doc)">View Photo</button>
                </td>
            </tr>
            <tr *ngIf="documentlist.length == 0">
                <td colspan="6" style="height: 40px;">No Record found</td>
            </tr>

        </table>
    </div>
</div>
<div class="card-footer">
 </div>
</div>






<div class="card" *ngIf="isview">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Add New Important Document</div>
            <div class="clr-col-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
              
                <button class="btn btn-sm" (click)="isview=false" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
                
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form  #documentForm="ngForm" >
                <div class="clr-row">
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Document Name:</label>
                        <input type="text" name="d_name" ngModel required>
                    </div>

                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Document Type:<span style="color: red">*</span></label>
                        <select name="d_type" [(ngModel)]="d_type" required>
                            <option></option>
                            <option>Licence</option>
                            <option>Agreement</option>
                            <option>Contract</option>
                            <option>Certificate</option>
                            <option>Legal</option>
                            <option>Employement</option>
                            <option>Service Letter</option>
                            <option>Letter</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div *ngIf="d_type == 'Other'" class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Other Document Type:<span style="color: red">*</span></label>
                        <input type="text" name="other_doc"  ngModel  required>
                           
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Document Description:<span style="color: red">*</span></label>
                        <input type="text" name="d_description"  ngModel  required>
                           
                    </div>
 
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Effective Date:<span style="color:red">*</span></label>
                        <input type="date" name="effective_date" ngModel required>
                      </div>

                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Validity:<span style="color: red">*</span></label>
                        <input type="date" name="validity" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Upload Documents:</label>
                        <input type="file" name="document" ngModel
                            (change)="onFileChanged8($event)" required>
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <br>  
                        <button class="btn btn-primary" (click)="addForm(documentForm)">{{'common.save' | translate}}</button>

                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
