<div class="card">
  <div class="card-header">
    <div class="row-flex">
      <div>Receiving Form Customisation - Approval</div>
      <button class="btn btn-sm btn-danger" (click)="back()">Close</button>
    </div>
  </div>

  <div class="card-block">
    <div class="datagrid-wrapper">
      <clr-datagrid [clrDgLoading]="loading" >
        <clr-dg-column>Sr. No.</clr-dg-column>
        <clr-dg-column>Request No.</clr-dg-column>
        <clr-dg-column>Revision No.</clr-dg-column>
        <clr-dg-column>Entry By/On</clr-dg-column>
        <clr-dg-column>Action</clr-dg-column>

        <clr-dg-row *clrDgItems="let row of pending; let i = index" [clrDgItem]="row">
          <clr-dg-cell>{{ i + 1 }}</clr-dg-cell>
          <clr-dg-cell>{{ row.request_no }}</clr-dg-cell>
          <clr-dg-cell>{{ row.revision_number || '-' }}</clr-dg-cell>
          <clr-dg-cell>{{ row.entry_by || '-' }} / {{ row.entry_date | date:'dd-MM-yyyy' }}</clr-dg-cell>
          <clr-dg-cell>
            <button class="btn btn-sm btn-info-outline" [routerLink]="['/qa/soft-restriction/receiving-form-customisation/view', row.id]">View</button>
            <button class="btn btn-sm btn-success" (click)="approve(row)">Approve</button>
            <button class="btn btn-sm btn-danger" (click)="reject(row)">Reject</button>
          </clr-dg-cell>
        </clr-dg-row>
      </clr-datagrid>
    </div>
  </div>
</div>
