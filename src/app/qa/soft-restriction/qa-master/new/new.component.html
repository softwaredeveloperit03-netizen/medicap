<!--  -->
<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Select Fields</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm btn-danger" routerLink="/qa/soft-restriction/qa-master">{{'common.close' | translate}}</button>
              </div>
        </div>
    </div>
    <div class="card-block" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <input type="checkbox" name="product" [(ngModel)]="pro" (change)="!pro">&nbsp;
                <label>Product</label>
                
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <input type="checkbox" name="raw" [(ngModel)]="raw" (change)="!raw">&nbsp;
                <label>Raw Material</label>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <input type="checkbox" name="packing" [(ngModel)]="packing" (change)="!packing">&nbsp;
                <label>Packing Material</label>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <input type="checkbox" name="testC" [(ngModel)]="testC" (change)="!testC">&nbsp;
                <label>Test</label>
            </div>
        </div>
    </div>
    <!--  -->
    <form #productForm="ngForm">

<!-- Product -->
<div *ngIf="pro" >
    <div class="card-block">
      <div class="card-text">
            <div class="clr-row">
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <input type="checkbox" name="product_type" ngModel>&nbsp;
                    <label>Finished Goods Type:<span style="color: red">*</span></label>
                </div>

                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <input type="checkbox"  name="product_code" ngModel   > &nbsp;
                  <label>Product Code:<span style="color: red">*</span></label>
                 </div>

                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <input type="checkbox"  name="product_name" ngModel>&nbsp; 
                    <label>Product Name:<span style="color: red">*</span></label>
                </div>
            
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <input type="checkbox" name="grade_p" ngModel>&nbsp;
                    <label>Grade:<span style="color: red">*</span></label>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <input type="checkbox" name="product_apperance" ngModel>&nbsp;
                    <label>Product Appearance:<span style="color: red">*</span></label>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <input  type="checkbox" name="storage_condition" ngModel>&nbsp;
                    <label>Storage Condition:<span style="color: red">*</span></label>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <input type="checkbox" name="manufactured_under" ngModel>&nbsp;
                    <label>Manufactured Under:<span style="color: red">*</span> </label>
                </div>  
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <input type="checkbox" name="typeVal" ngModel>&nbsp;
                    <label>Type:<span style="color: red">*</span> </label>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <input type="checkbox" name="manufactured_for" ngModel>&nbsp;
                    <label>Manufactured For Client:<span style="color: red">*</span></label>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <input type="checkbox" name="micro" ngModel>&nbsp;
                    <label>Microbiology:<span style="color: red">*</span></label>
                </div>
            </div>
      </div>
    </div>
</div>
<!-- Product -->

<!-- Raw Materal -->
<div *ngIf="raw">
    <div  class="card-block">
      <div class="card-text">
          <div class="clr-row">
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <input type="checkbox" name="material_subtype" ngModel>&nbsp;
              <label>Material Type:<span style="color: red">*</span></label>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-4 clr-col-xs-4">
                <input type="checkbox"name="material_nature" ngModel>&nbsp;
              <label>Nature of Material:<span style="color: red">*</span></label>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <input  type="checkbox" name="material_name" ngModel>&nbsp;
                <label>Material Name:<span style="color: red">*</span></label>
            </div>
          
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <input type="checkbox" name="density" ngModel>&nbsp;
                <label>Density:<span style="color: red">*</span></label>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <input type="checkbox" name="grade_r" ngModel>&nbsp;
                <label>Single Grade:<span style="color: red">*</span></label>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <input type="checkbox" name="grade_r" ngModel>&nbsp;
                <label>Multi Grade:<span style="color: red">*</span></label>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <input type="checkbox" name="order_qty" ngModel>&nbsp;
                <label>Min. Order Qty:<span style="color: red">*</span><br></label>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <input type="checkbox" name="inventory" ngModel   >&nbsp;
                <label>Min.Inventory Level:<br></label>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6 clr-col-xs-12">
                <input type="checkbox" name="location" ngModel>&nbsp;
                <label>Storage Location:</label>
            </div>
          </div>
      </div>
    </div>
</div>
<!-- Raw Materal -->

<!-- Packing Material -->
<div *ngIf="packing">

    <div   class="card-block">
      <div class="card-text">
          <div class="clr-row">
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <input type="checkbox" name="material_subtype" ngModel>&nbsp;
                <label>Material Type:<span style="color: red">*</span></label>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <input type="checkbox" name="category" ngModel>&nbsp;
              <label>Category:<span style="color: red">*</span></label>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <input  type="checkbox" name="material_name" ngModel>&nbsp;
                <label>Material Name:<span style="color: red">*</span></label>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <input type="checkbox" name="grade_pack" ngModel>&nbsp;
              <label>Grade:</label>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <input type="checkbox" name="order_qty"ngModel>&nbsp;
              <label>Min. Order Qty:<span style="color: red">*</span><br></label>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <input type="checkbox" name="inventory" ngModel>&nbsp;
              <label>Min.Inventory Level:<span style="color: red">*</span><br></label>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6 clr-col-xs-12">
                <input type="checkbox" name="location" ngModel >&nbsp;
              <label>Storage Location:</label>
            </div>
          </div>
      </div>
    </div>
</div>
<!-- Packing Material -->

<!-- Test -->
<div *ngIf="testC">

    <div  class="card-block">
      <div class="card-text">
          <div class="clr-row">
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6 clr-col-xs-12">
                <input type="checkbox" name="test_type" ngModel>&nbsp;
              <label>Test Type:<span style="color: red;">*</span></label>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6 clr-col-xs-12">
                <input  type="checkbox" name="test" ngModel >&nbsp;
              <label>Test:<span style="color: red;">*</span></label>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6 clr-col-xs-12">
                <input type="checkbox" name="grade_t" ngModel>&nbsp;
              <label>Pharmacopoeia:</label>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6 clr-col-xs-12">
                <input type="checkbox"   name="sample_qty" ngModel>&nbsp;
              <label>Sample Quantity:</label>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6 clr-col-xs-12">
                <input type="checkbox" name="unit" ngModel>&nbsp;
              <label>Unit:</label>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6 clr-col-xs-12">
                <input type="checkbox" ngModel name="maxlead_time">&nbsp;
              <label>Lead Time(min):</label>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6 clr-col-xs-12">
                <input type="checkbox" ngModel   name="minlead_time">&nbsp;
                <label>Lead Time(max):</label>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6 clr-col-xs-12">
                <input type="checkbox" ngModel name="sub_test">&nbsp;
                <label>SubTest:</label>
            </div>
          </div>
          
        </div>
    </div>
</div>
<!-- Test -->
<div class="card-footer">
    <button type="button" class="btn btn-primary" (click)="save(productForm)"
    >{{'common.submit' | translate}}</button>
</div>

</form>
</div>
