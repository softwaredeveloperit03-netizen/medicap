<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Software Restriction</div>
          <div class="clr-col-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/qa/soft-restriction" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
          </div>
        </div>
      </div>
      <div class="card-block">
        <div class="card-text" >
          <form #softwareType="ngForm">
            <div class="clr-row">
              
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Software Type:</strong></label>
                <select name="software_type" ngModel required>
                    <option></option>
                    <option>API</option>
                    <option>Formulation</option>
                </select>
              </div>
            </div>
          </form>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="saveSoftwareType(softwareType)">{{'common.submit' | translate}}</button>
        <button class="btn btn-danger" routerLink="/qa/soft-rest">{{'common.close' | translate}}</button>
      </div>
    </div>
  </div>
