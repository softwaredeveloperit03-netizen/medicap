<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Software-Restriction Form
        </div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-danger" routerLink="/qa/soft-restriction">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #restrictionForm="ngForm">
          <div class="clr-row">
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Departments<sup style="color: red">*</sup>:</strong></label>
                <select name="department" [(ngModel)]="department"  required>
                    <option></option>
                    <option *ngFor="let dept of departments">{{ dept.department_name }}</option>
                  </select>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Module<sup style="color: red">*</sup></strong></label>
                <select name="module" [(ngModel)]="module" required>
                    <option></option>
                    <option  *ngIf="department=='Quality Control'">Sampling</option>
                    <option  *ngIf="department=='Quality Control'">Testing</option>
                    <option  *ngIf="department=='Quality Control'">FG</option>
                    <option  *ngIf="department=='Quality Control'">Expirey Date</option>
                  </select>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>param_label<sup style="color: red">*</sup></strong></label>
                <select name="param_label" [(ngModel)]="param_label"  required>
                    <option></option>
                    <option  *ngIf="department=='Quality Control' && module=='Testing'">Testing Type</option>
                   
                  </select>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label><strong>restriction<sup style="color: red">*</sup>:</strong></label>
              <select name="restriction" [(ngModel)]="restriction" required>
                  <option></option>
                  <option *ngIf="module=='Sampling'">Fixed Qty</option>
                  <option *ngIf="module=='Sampling'">Specification Qty</option>
                  <option *ngIf="param_label=='Testing Type'">With RDS</option>
                  <option *ngIf="param_label=='Testing Type'">Without RDS</option>
                  <option *ngIf="param_label=='Testing Type'">Both</option>
                  <option *ngIf="module=='FG'">Based on Dispensing</option>
                  <option *ngIf="module=='FG'">Based on Planning</option>
                  <option *ngIf="module=='FG'">Based on Mfg Start</option>
                  <option *ngIf="module=='FG'">Based on Complition Date</option>
                  <option *ngIf="module=='Expirey Date'">API Addition Date</option>
                  <option *ngIf="module=='Expirey Date'">Based on Complete Shelf Date</option>
                  <option *ngIf="module=='Expirey Date'">Depend on API Expirey</option>
              </select>
          </div>
          


          </div> 
  
  
          
          
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="saveSoftware_restrication(restrictionForm)">{{'common.save' | translate}}</button>
    </div>
  </div>
