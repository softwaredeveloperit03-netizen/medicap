<div class="card">
  <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Standard Responsibilities Form </div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
              <button class="btn btn-sm" routerLink="/qa/responsibility" style="background-color: red;color: white;">
                  <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
              </button>
          </div>
      </div>
  </div>
  <div class="card-block">
    <form #newForm="ngForm">   
      <div class="card-text">
          <h4>Employee Details</h4>
              <div class="clr-row">
                <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <label> Department:<span style="color: red;">*</span></label>
                    <select name="dept" [(ngModel)]="department" (change)="getEmployees($event.target.value)">
                          <option></option>
                          <option *ngFor="let dept of departments">{{ dept.department_name }}</option>
                    </select>
                </div>
                  <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                      <label>Employee Name :<span style="color: red;">*</span></label>
                      <select name="emp_name" [(ngModel)]="emp"  (change)="selectEmp($event.target.selectedIndex)" required>
                        <option></option>
                        <option *ngFor="let emp of employees" [value]="emp.emp_id">{{ emp.firstname }} {{ emp.lastname }}</option>
                    </select>
                  </div>
                  <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                      <label>Employee ID:<span style="color: red;">*</span></label>
                      <input type="text" name="emp_id" [(ngModel)]="empId" required>
                  </div>
                  <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                      <label>Position/Job Title:<span style="color: red;">*</span></label>
                      <input type="date" name="job_title" ngModel required>
                  </div>
              </div>
          </div>
          <div class="card">
              <div class="card-header" style="text-align: left; color: black; background-color: lightgreen;">Standard Responsibilities</div>
              <div class="card-block">
                  <div class="clr-row">
                      <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                          <label><strong>responsibility1:<sup style="color: red">*</sup></strong></label>
                          <input type="text" name="responsibility1" ngModel required>
                      </div>
                      <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>responsibility2:<sup style="color: red">*</sup></strong></label>
                        <input type="text" name="responsibility2" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                      <label><strong>responsibility3:<sup style="color: red">*</sup></strong></label>
                      <input type="text" name="responsibility3" ngModel required>
                  </div>
                  </div>
              </div>
              <div class="card-header" style="text-align: left; color: white; background-color: rgb(154, 107, 230);"> Additional Responsibilities</div>
              <div class="card-block">
                  <div class="clr-row">
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                      <label><strong> Additional Responsibility1:<sup style="color: red">*</sup></strong></label>
                      <input type="text" name="add_responsibility1" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                      <label><strong> Additional Responsibility2:<sup style="color: red">*</sup></strong></label>
                      <input type="text" name="add_responsibility2" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                      <label><strong> Additional Responsibility3:<sup style="color: red">*</sup></strong></label>
                      <input type="text" name="add_responsibility3" ngModel required>
                  </div>
                  </div>
              </div>   
              <div class="card-header" style="text-align: left; color: white; background-color: rgb(16, 123, 43);"> Performance Metrices</div>
              <div class="card-block">
                  <div class="clr-row">
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                      <label><strong>Performance Metrices1:<sup style="color: red">*</sup></strong></label>
                      <input type="text" name="per_metrices1" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                      <label><strong>Performance Metrices2:<sup style="color: red">*</sup></strong></label>
                      <input type="text" name="per_metrices2" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                      <label><strong> Performance Metrices3:<sup style="color: red">*</sup></strong></label>
                      <input type="text" name="per_metrices3" ngModel required>
                  </div>
                  </div>
              </div>  
          </div>
          <div class="card">
              <div class="card-header" style="text-align: left;color: black; background-color: rgb(212, 103, 14);"> Review & Approval</div>
              <div class="card-block">
                  <div class="clr-row">
                      <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                          <label><strong>Reviewed By:<sup style="color: red">*</sup></strong></label>
                          <input type="text" name="review_by" ngModel required>
                      </div>
                      <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                          <label><strong>Review Date :<sup style="color: red">*</sup></strong></label>
                          <input type="date" name="review_date" ngModel required>
                      </div>
                      <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                          <label><strong>Approval Status:<sup style="color: red">*</sup></strong></label>
                          <select type="text" name="approval_status" ngModel required>
                              <option></option>
                              <option>{{'common.approved' | translate}}</option>
                              <option>{{'common.pending' | translate}}</option>
                              <option>{{'common.rejected' | translate}}</option>
                          </select> 
                      </div>
                      <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                          <label><strong>Supporting Documents:<sup style="color: red">*</sup></strong></label>
                          <input type="file" name="supporting_doc" ngModel (change)="onFileChanged3($event)">
                      </div>
                  </div>
              </div>
          </div>
        </form>
  </div>
      <div class="card-footer">
        <button class="btn btn-primary"(click)="save(newForm)">{{'common.save' | translate}}</button>
    </div>
</div>
