<div class="container-fluid">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Document Requisition</div>
              <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qa/document" style="background-color: red;color: white;">
                   <!-- <clr-icon shape="window-close" class="is-solid"></clr-icon>CLOSE  -->
                </button>
              </div>
            </div>
          </div>
        <div class="card-block">
            <div class="card-text">
                <div class="clr-row">
                    <div class="clr-col-12">
                        <label>Department:</label>
                        <select name="department" ngModel required>
                            <option></option>
                            <option *ngFor="let department of departments; let i = index">{{ department.department_name }}</option>
                        </select>
                    </div>
                    <div class="clr-col-12">
                        <label>Name of Document:</label>
                        <input type="text" name="document_name" ngModel required>
                    </div> 
                    <div class="clr-col-12">
                        <label>Document Type:</label>
                        <input type="text" name="document_type" ngModel required>
                    </div>
                    <div class="clr-col-12">
                        <label>Format No:</label>
                        <input type="text" name="format_no" ngModel required>
                    </div>
                    <div class="clr-col-12">
                        <label>Required Copies:</label>
                        <input type="text" name="copies" ngModel required>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary">PROCESS</button>
        </div>
    </div>
</div>
