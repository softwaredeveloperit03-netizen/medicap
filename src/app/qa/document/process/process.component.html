<div class="container-fluid">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Process & Analytical Documents</div>
              <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qa/document" style="background-color: red;color: white;">
                  <!-- <clr-icon shape="window-close" class="is-solid"></clr-icon> -->CLOSE 
                </button>
              </div>
            </div>
          </div>
        <div class="card-block">
            <div class="card-text">
                <table class="table">
                    <tr>
                        <th>Req. No.</th>
                        <th>{{'common.department' | translate}}</th>
                        <th>Name of Product</th>
                        <th>Document Type</th>
                        <th>Document No.</th>
                        <th>Required Copies</th>
                        <th>View</th>
                    </tr>
                    <tr *ngFor="let process of processes; let i = index">
                        <td>{{ process.req_no }}</td>
                        <td>{{ process.department }}</td>
                        <td>{{ process.product_name }}</td>
                        <td>{{ process.document_type }}</td>
                        <td>{{ process.document_no }}</td>
                        <td>{{ process.copies }}</td>
                        <td>
                            <button class="btn btn-sm btn-info">PROCEED</button>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</div>
