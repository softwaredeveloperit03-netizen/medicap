<div class="card">
    <div class="card-header">Market Complaint</div>
    
    <div class="card-block">
        <div class="card-text">
            <form #marketForm="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Type of Complainant:<span style="color: red">*</span></label>
                        <select name="complaintent_type" required ngModel>
                            <option></option>
                            <option>Distributor</option>
                            <option>Company</option>
                            <option>Customer</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Complaint Received From:</label>
                        <input type="text" name="received_from" ngModel>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Contact No:</label>
                        <input type="text" name="contact_no" ngModel>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Email:</label>
                        <input type="text" name="email" ngModel>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Complaint Receive Date:</label>
                        <input type="date" name="received_date" ngModel>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Type of Complaint:<span style="color: red">*</span></label>
                        <select name="complaint_type" [(ngModel)]="complaint_type" required>
                            <option>Medical</option>
                            <option>Non Medical</option>
                            <option>Packing</option>
                            <option>Product</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="complaint_type=='Medical'">
                        <label>Nature of Complaint:<span style="color: red">*</span></label>
                        <select name="complaint_nature" ngModel required>
                            <option>Adverse reaction/Toxic Reaction</option>
                            <option>Death</option>
                            <option>Severe Allergy</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="complaint_type=='Medical'">
                        <label>Forward Complaint to Physcian/Pharmacologist:<span style="color: red">*</span></label>
                        <input type="checkbox" name="forward" [(ngModel)]="forward">
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="forward">
                        <label>Email:<span style="color: red">*</span></label>
                        <input type="text" name="physcian_email" required ngModel>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="complaint_type=='Non Medical'">
                        <label>Nature of Complaint:<span style="color: red">*</span></label>
                        <select name="complaint_nature" ngModel required>
                            <option>Product Related Complaint</option>
                            <option>Missing Quantity</option>
                            <option>Product Color Change</option>
                            <option>Analytical Result Related</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" >
                        <label>Severity:<span style="color: red">*</span></label>
                        <select name="severity" ngModel required>
                            <option>Minor</option>
                            <option>Major</option>
                            <option>Critical</option>
                            <option>Need Immediate Action</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12" *ngIf="complaint_type=='Packing'">
                        <label>Nature of Complaint:<span style="color: red">*</span></label>
                        <select name="complaint_nature" ngModel required>
                            <option>Missing Quantity</option>
                            <option>Broken Pack</option>
                            <option>Priting Related</option>
                            <option>Wrong Packing</option>
                        </select>
                    </div>
                </div>

                <h3>Complaint Details:</h3>
                <div class="clr-row">
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Name of Product:<span style="color: red">*</span></label>
                        <select name="product_name" ngModel (change)="getProdctCodes($event.target.selectedIndex)" required>
                            <option></option>
                            <option *ngFor="let product of products">{{product.product_name}}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Product Code:<span style="color: red">*</span></label>
                        <input type="text" name="product_code" readonly [(ngModel)]="selectedCode['product_code']" required> 
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Mfg Date:<span style="color: red">*</span></label>
                        <input type="month" name="mfg_date" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Medicap Lot No:<span style="color: red">*</span></label>
                          <input type="text" name="batch_no" ngModel>
                        <!-- <select name="batch_no" required >
                            <option></option>
                        </select> -->
                    </div>
                     <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Exp. Date:<span style="color: red">*</span></label>
                        <input type="month" name="exp_date" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Complaint Sample Receive:<span style="color: red">*</span></label>
                        <select name="complaint_sample" [(ngModel)]="complaint_sample"   required>
                            <option>Yes</option>
                            <option>No</option>
                        </select>
                    </div>
                    <table class="table" *ngIf="complaint_sample=='Yes'">
                        <tr>
                            <th>Sr</th>
                            <th style="text-align: left;">Upload</th>
                            <th>Add</th>
                        </tr>
                        <tr>
                            <td>0.</td>
                            <td style="padding: 0px;"><input type="file" name="photograph" accept="application/*" style="margin: 0px;"></td>
                            <td><button class="btn btn-sm">{{'common.add' | translate}}</button></td>
                        </tr>
                    </table>
                </div>
                <h3>Inspection of Complaint and Control Sample:</h3>
                <div class="clr-row">
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-4">
                        <label>Inspection Remark:</label>
                        <input type="text" name="control_remark" ngModel>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-4">
                        <label>Send Sample To:</label>
                        <select name="sendsample_to" ngModel>
                            <option *ngFor="let employee of employees" [value]="employee.emp_id">{{employee.firstname}}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-4">
                        <label>CAPA:</label>
                        <select name="capa" [(ngModel)]="capa" required>
                            <option>Yes</option>
                            <option>No</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-4">
                        <label>Send Acknowledgement To Complainant:</label>
                        <button class="btn btn-sm btn-info">Send Email</button>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-3 clr-col-sm-4 clr-col-xs-3 " *ngIf="plant_id=='59'">
                         <button class="btn btn-sm btn-info">Send Email</button>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-3"*ngIf="plant_id=='59'">
                        <button class="btn btn-sm btn-info">Send Email</button>
                    </div>
                    
                </div>


                <div class="clr-row">
                    <div class="clr-col-md-12 clr-col-12">
                        <label>Departments:</label>
                        <div class="clr-control-container clr-control-inline">
                            <div class="clr-checkbox-wrapper" *ngFor="let order of departments; let i = index">
                                <input class="clr-checkbox" id="{{order.department_name}}" type="checkbox" name="{{order.department_name}}" [(ngModel)]="order.value" (change)="updateDept($event.target.checked, i)">
                                <label for="{{order.department_name}}" class="clr-control-label">{{order.department_name}}</label>
                            </div>
                        </div>
                    </div>
                  </div>


            </form> 
        </div>
    </div>
    <div class="card-footer" style="text-align: right;">
        <button class="btn btn-primary" (click)="savemarketComplaint(marketForm)">LogIn Complaint</button>
        <button class="btn btn-danger" (click)="closeForm()">{{'common.close' | translate}}</button>
    </div>
</div>
