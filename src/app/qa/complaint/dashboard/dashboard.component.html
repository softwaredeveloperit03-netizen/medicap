 
<!-- =============================== -->
<div class="component qa-legacy-dash">
  <div class="subsection">
    <div class="purchase-block">
      <div style="text-align:end" class="exit-section">
        <div class="header-block" style="margin:10px 0px">
          <h3>Complaint Management</h3>
          <div routerLink="/qa" class="name-board2"><i class="fas fa-times"></i>
          </div>
        </div>

        <div class="main-section" style="margin: 0px 10px 10px 10px !important;">
          <div class="clr-row" style="margin: 8px 0 18px 0;">
            <div class="clr-col-lg-3 clr-col-md-6 clr-col-sm-12">
              <div class="card" style="padding: 10px;">
                <div style="font-size: 12px;">Pending Review</div>
                <div style="font-size: 22px; font-weight: 700;">{{ summary.pending }}</div>
              </div>
            </div>
            <div class="clr-col-lg-3 clr-col-md-6 clr-col-sm-12">
              <div class="card" style="padding: 10px;">
                <div style="font-size: 12px;">Pending Approval</div>
                <div style="font-size: 22px; font-weight: 700;">{{ summary.approval }}</div>
              </div>
            </div>
            <div class="clr-col-lg-3 clr-col-md-6 clr-col-sm-12">
              <div class="card" style="padding: 10px;">
                <div style="font-size: 12px;">Approved</div>
                <div style="font-size: 22px; font-weight: 700;">{{ summary.approved }}</div>
              </div>
            </div>
            <div class="clr-col-lg-3 clr-col-md-6 clr-col-sm-12">
              <div class="card" style="padding: 10px;">
                <div style="font-size: 12px;">Total</div>
                <div style="font-size: 22px; font-weight: 700;">{{ summary.total }}</div>
              </div>
            </div>
          </div>

          <div class="category">
            <div class="line-section">
              <div class="header-div">
                <h3>Complaint Management Section</h3>
              </div>
            </div>
    
            <div class="block-container" style="display: grid;grid-gap: 35px;overflow-x: auto;max-width: 100%;">
              <div class="clr-row line-section">
                <div class="item-block  " *ngIf="isuser == 'Yes'" routerLink="../medical-complaint">
                  <i class="fas fa-exclamation-triangle"></i>
                  <span>Log In New Complaint</span>
                </div>
                <!-- <div class="item-block  " *ngIf="isuser == 'Yes'" routerLink="../receive_comp">
                  <i class="fas fa-file-signature"></i>
                  <span>Receive Complaint Form</span>
                </div> -->

                <div class="item-block " *ngIf="qms_approver=='Yes'" routerLink="../sample">
                  <i class="fas fa-exclamation-triangle"></i>
                  <span>Sample Review</span>
                </div>

                <div class="item-block " *ngIf="qms_approver=='Yes'" routerLink="../medical-inspection">
                  <i class="fas fa-exclamation-triangle"></i>
                  <span>Complaint Review</span>
                </div>

                <div class="item-block " *ngIf="isapprover=='Yes'" routerLink="../head">
                  <i class="fas fa-exclamation-triangle"></i>
                  <span>Approval</span>
                </div>

                <div class="item-block " routerLink="../medical-log">
                  <i class="fas fa-book"></i>
                  <span>Complaint Logbook</span>
                </div>
              </div>
            </div>

            <div class="block-container "  style="display: grid;grid-gap: 35px;overflow-x: auto;max-width: 100%;">

              <div class="clr-row" >
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12">
            <div id="chart1" style="margin: 20px auto 0 auto; width: 520px; max-width: 100%;"></div>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
