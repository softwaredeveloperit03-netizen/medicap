<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-6" style="color: aliceblue;margin-top: -2px;text-align: left;"> Initiate CC</div>
          <div class="clr-col-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/qa/cctemporary" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #changecontrol="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-6">
                        <label>Document Type:</label>
                        <select name="document_type" ngModel>
                            <option></option>
                            <option>Document To Be changed</option>
                            <option>New Document</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-12">
                        <label>Change Control Related:</label>
                        <select name="cc_related" ngModel required>
                            <option></option>
                            <option>Product</option>
                            <option>Facility</option>
                            <option>SOP</option>
                            <option>Document</option>
                            <option>Batch Size</option>
                            <option>Eshedule</option>
                            <option>Equipment/ Instrument</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-12">
                        <label>Title Of Change</label>
                    <textarea name="change_title" rows="2" ngModel required></textarea>
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-12">
                        <label>Medicap Lot No/ Equipment ID/ Instrument ID/ Document No./No. Of Days</label>
                     <input type="text" name="document_no" ngModel required>
                    </div>
                    <div class="clr-col-lg-6">
                        <label>Current / Existing Procedure</label>
                        <textarea name="existing_procedure" rows="3" ngModel required></textarea>
                    </div>
                    <div class="clr-col-lg-6">
                        <label>Proposed Change</label>
                        <textarea name="proposed_change" rows="3" ngModel required></textarea>
                    </div>
                    <div class="clr-col-lg-12">
                        <label> Reason / Justification Of each Proposed Change</label>
                        <textarea name="change_reason" rows="3" ngModel required></textarea>
                    </div>
                    <div class="clr-col-lg-12">
                        <label>Affected LMR / BMR version No/Other Document(specify)</label>
                        <textarea name="affected_for" rows="2" ngModel required></textarea>
                    </div>
                </div>
            </form>

            <h3>Attributes:</h3>
            <form #actiondata="ngForm">
                <table class="table">
                    <tr>
                        <th>Sr.</th>
                        <th style="text-align: left;">Attribute</th>
                        <th style="text-align: left;">Yes/No</th>
                        <th style="text-align: left;">Work Description</th>
                        <th style="text-align: left;">Responsibility for Action</th>
                        <th>{{'common.table.action' | translate}}</th>
                    </tr>
                    <tr *ngFor="let attr of attributes;let i = index" style="margin: 0px;">
                        <td>{{ i+1 }}</td>
                        <td style="text-align: left;">{{attr.attribute}}</td>
                        <td style="text-align:left;padding: 0px;">
                            <select name="status{{i}}" [(ngModel)]="attr['status']" style="margin: 0px;"  required >
                            <option></option>
                            <option>Yes</option>
                            <option>No</option>
                            </select>
                        </td>
                        <td style="padding: 0px;"> 
                            <input type="text" name="description{{i}}" style="margin: 0px;" [(ngModel)]="attr['description']" required>
                        </td>
                        <td style="padding: 0px;"> 
                            <input type="text" name="responsibility{{i}}" [(ngModel)]="attr['responsibility']" required  style="margin: 0px;">
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td style="padding: 0px;text-align:left"><input type="text" name="attribute" style="margin: 0px;" [(ngModel)]="attributess" required></td>
                        <td style="text-align:left;padding: 0px;">
                            <select name="status" ngModel style="margin: 0px;"  required >
                            <option></option>
                            <option>Yes</option>
                            <option>No</option>
                            </select>
                        </td>
                        <td style="padding: 0px;"> 
                            <input type="text" name="description" style="margin: 0px;" ngModel required>
                        </td>
                        <td style="padding: 0px;"> 
                            <input type="text" name="responsibility" ngModel required  style="margin: 0px;">
                        </td>
                        <td><button class="btn btn-sm" (click)="add(actiondata)">{{'common.add' | translate}}</button></td>
                    </tr>
                </table>
            </form>
        </div>
    </div>
    <div class="card-block">
        <button class="btn btn-primary" (click)="saveData(changecontrol)"> save</button>
    </div>
</div>
