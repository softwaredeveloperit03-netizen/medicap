<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> OOS Trend</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qa/oos" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <form #oos_trendform="ngForm">

          <div class="card-text">
             <h4>Identification Details</h4>
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Report ID:<span style="color: red;">*</span></label>
                            <input type="text" name="report_id" ngModel required>
                        </div>
        
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Date Of Report:<span style="color: red;">*</span></label>
                            <input type="date" name="report_date" ngModel required>
                        </div>
                   </div>
             <div class="card">
                <div class="card-header" style="text-align: left; color: black; background-color: lightgreen;">Product/Process & Specification Details</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Product/Process Name:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="product_name" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Batch/Lot No:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="batch_no" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Parameter/Specification :<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="parameter" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Specification Limit :<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="specification_limit" ngModel required>
                        </div>
                    </div>
                </div>
                <div class="card-header" style="text-align: left; color: white; background-color: rgb(154, 107, 230);"> OOS Incident Details</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Date Of OOS :<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="oss_date" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Time Of OOS :<sup style="color: red">*</sup></strong></label>
                            <input type="time" name="oss_time" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Location/Equipment :<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="location" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Description Of OOS :<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="oss_description" ngModel required>
                        </div>
                    </div>
                </div>
                <div class="card-header" style="text-align: left; color: black; background-color: rgb(216, 230, 107);"> Analysis & Investigation</div>
                <div class="card-block">
                 <div class="clr-row">
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Root Cause Analysis:<span style="color: red;">*</span></label>
                        <input type="text" name="cause_analysis" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Corrective Actions Taken:<span style="color: red;">*</span></label>
                        <input type="text" name="action_taken" ngModel required>
                    </div>
                 </div>
                </div>
             </div>
             <div class="card">
                <div class="card-header" style="text-align: left;color: black; background-color: rgb(14, 163, 212);">Trend Analysis</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>No Of Previous OOS Incident:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="previous_oos_no" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Trend Status:<sup style="color: red">*</sup></strong></label>
                            <select type="text" name="trend_status" ngModel required>
                                <option></option>
                                <option>Incresing</option>
                                <option>Decreasing</option>
                                <option>Stable</option>
                            </select>
                        </div>
                        <!-- <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Attachment(If Any):<sup style="color: red">*</sup></strong></label>
                            <input type="file" name="attachment" ngModel required>
                        </div> -->
                        <div class="clr-col-lg-6">
                            <label>Attachment:</label>
                            <input type="file" name="attachment" ngModel (change)="onFileChanged($event)">
                        </div>
                    </div>
                </div>
             </div>
             <div class="card">
                <div class="card-header" style="text-align: left;color: black; background-color: rgb(212, 14, 113);">Review & Approval </div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Reviewing Officer:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="review_officer" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Reviewed Date:<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="review_date" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Approval Status:<sup style="color: red">*</sup></strong></label>
                            <select type="text" name="approval_status" ngModel required>
                                <option></option>
                                <option>Approve</option>
                                <option>{{'common.pending' | translate}}</option>
                                <option>{{'common.rejected' | translate}}</option>
                            </select>
                        </div>
                    </div>
                </div>
              </div>
          </div>
        </form>
    </div>
        <div class="card-footer">
            <button class="btn btn-primary"(click)="save(oos_trendform)">{{'common.save' | translate}}</button>
        </div>
</div>
