<div class="component">
  <div class="subsection">
    <div class="purchase-block" >
      <div style="text-align:end" class="exit-section">
        <div class="header-block" style="margin:10px 0px">
          <h3>OOS</h3>
        <div routerLink="/qa" class="name-board2"><i class="fas fa-times"></i>
        </div>
      </div>

      <div class="main-section" style="margin: 0px 10px 10px 10px !important;">
        <div class="category">
          <div class="line-section">
            <div class="header-div">
              <h3>OOS Section</h3>
            </div>
          </div>
          <div class="block-container" style="    
          display: grid;
          grid-template-columns: repeat(6, 150px);
          grid-gap: 35px;
          overflow-x: auto;
          max-width: 100%;">
            <div class="item-block" *ngIf="isuser == 'Yes'" routerLink="../checklist">
            <i class="fas fa-clipboard-check"></i>
            <span>Master OOS checklist</span>
          </div>
          
          <div class="item-block" *ngIf="isapprover == 'Yes'" routerLink="../oos-approved">
            <i class="fas fa-thumbs-up"></i>
            <span>OOS Approval</span>
          </div>
          
          <div class="item-block" *ngIf="ischecker == 'Yes'" routerLink="../oos-log">
            <i class="fas fa-file-alt"></i>
            <span>OOS Report</span>
          </div>
          
          <!-- <div class="item-block" *ngIf="isuser == 'Yes'" routerLink="../trend">
            <i class="fas fa-chart-line"></i>
            <span>OOS Trend</span>
          </div> -->
          

          
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
