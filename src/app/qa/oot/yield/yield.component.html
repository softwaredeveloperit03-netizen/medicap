<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Yield</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/qa" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon>CLOSE
            </button>
          </div>
        </div>
      </div>
      <div class="card-block">
        <div class="card-text">
          <div class="clr-row">
            <div class="clr-col-lg-4">
              <label>From Date:</label>
              <input type="date" name="from_date" [(ngModel)]="from_date" required>
            </div>
            <div class="clr-col-lg-4">
              <label>To Date:</label>
              <input type="date" name="to_date" [(ngModel)]="to_date" required>
            </div>
            <div class="clr-col-lg-2" style="padding: 0px;">
              <button class="btn btn-danger" (click)="getYields()" style="margin-top: 30px;">{{'common.search' | translate}}</button>
            </div>
          </div>
          <br>
          <div id="chart"></div>
        </div>
      </div>
</div>
