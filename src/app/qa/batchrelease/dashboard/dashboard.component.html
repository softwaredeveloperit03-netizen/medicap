<div class="component qa-legacy-dash">
  <div class="subsection">
    <div class="purchase-block" >
      <div style="text-align:end" class="exit-section">
        <div class="header-block" style="margin:10px 0px">
          <h3>Batch Release</h3>
        <div routerLink="/qa" class="name-board2"><i class="fas fa-times"></i>
        </div>
      </div>

      <div class="main-section" style="margin: 0px 10px 10px 10px !important;">
        <div class="category">
          <div class="line-section">
            <div class="header-div">
              <h3>Batch Release Section</h3>
            </div>
          </div>
          <div class="block-container">
            <div class="item-block" *ngIf="ischecker=='Yes' || isapprover=='Yes'" routerLink="new-checklist">
              <i class="fas fa-tasks"></i>
              <span>Batch Rel. CheckList</span>
            </div>
            
            <div class="item-block" *ngIf="ischecker=='Yes' || isapprover=='Yes'" routerLink="checklist-approve">
              <i class="fas fa-clipboard-check"></i>
              <span>Checklist Approval</span>
            </div>
            
            <div class="item-block" routerLink="checklist-log">
              <i class="fas fa-book"></i>
              <span>Checklist Log</span>
            </div>
            
            <div class="item-block" routerLink="new">
              <i class="fas fa-plus-circle"></i>
              <span>New Batch Rel.</span>
            </div>
            
            <div class="item-block" *ngIf="ischecker=='Yes' || isapprover=='Yes'" routerLink="discripancy">
              <i class="fas fa-tasks"></i>
              <span>Batch Rel. Apprvl</span>
            </div>
            
            <div class="item-block" routerLink="record">
              <i class="fas fa-file-alt"></i>
              <span>Batch Rel. Record</span>
            </div>                      
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
