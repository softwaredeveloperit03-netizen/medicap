<div class="container-fluid" *ngIf="isView">
    <div class="card">
        <div class="card-header">Revise Batch Release Checklist</div>
        <div class="card-block">
            <div class="card-text">
                <div class="clr-row">
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Dosage Form:</label>
                        <input type="text" name="dosage_form" [ngModel]="result['dosage_form']" readonly tabindex="-1">
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Product Name:</label>
                        <input type="text" name="product_code" [ngModel]="result['product_name']" readonly tabindex="-1">
                    </div>
                </div>
                <h3>Checkpoints:</h3>
                <form #checkpoint="ngForm">
                    <table class="table">
                        <tr>
                            <th>Sr.</th>
                            <th>Checkpoints</th>
                            <th>Add</th>
                        </tr>
                        <tr>
                            <td>0.</td>
                            <td style="padding: 0px;">
                                <input type="text" name="checkpoint" ngModel required style="margin: 0px;height: 33px;">
                            </td>
                            <td style="padding: 0px; vertical-align: middle;">
                                <button class="btn btn-sm btn-info" (click)="add(checkpoint)">{{'common.add' | translate}}</button>
                            </td>
                        </tr>
                        <tr *ngFor="let checkpoint of result['checkpoints']; let i = index">
                            <td>{{ i + 1 }}.</td>
                            <td style="text-align: left;">{{ checkpoint }}</td>
                            <td>
                                <button class="btn btn-sm btn-danger-outline btn-icon" (click)="del(i)"><clr-icon shape="trash" class="is-error"></clr-icon></button>
                            </td>
                        </tr>
                        <tr *ngIf="result['checkpoints']?.length == 0">
                            <td colspan="3">{{'common.noRecords' | translate}}</td>
                        </tr>
                    </table>
                </form>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="update()">{{'common.update' | translate}}</button>
            <button class="btn btn-danger" routerLink="/batchrelease/">{{'common.close' | translate}}</button>
        </div>
    </div>
</div>
