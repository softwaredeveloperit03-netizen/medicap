<div class="component qa-legacy-dash">
  <div class="subsection">
    <div class="purchase-block">
      <div style="text-align:end" class="exit-section">
        <div class="header-block" style="margin:10px 0px">
          <h3>Conditional Release of Material or Product (SOP-QA-020)</h3>
          <div routerLink="/qa" class="name-board2"><i class="fas fa-times"></i></div>
        </div>
      </div>

      <div class="main-section" style="margin: 0px 10px 10px 10px !important;">
        <div class="category">
          <div class="line-section">
            <div class="header-div">
              <h3>Request, Tracking &amp; QA Approval</h3>
            </div>
          </div>
          <div class="block-container">
            <div class="item-block" *ngFor="let form of forms" [routerLink]="form.route">
              <i class="fas" [ngClass]="form.icon"></i>
              <span>{{ form.label }}</span>
              <span>{{ form.formNo }}</span>
            </div>
            <div class="item-block" *ngIf="dept_head === 'Yes'" [routerLink]="approvalCard.route">
              <i class="fas" [ngClass]="approvalCard.icon"></i>
              <span>{{ approvalCard.label }}</span>
              <span>{{ approvalCard.formNo }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
