<div class="container-fluid">
    <div class="card" *ngIf="isForm">
        <div class="card-header">Destruction Report</div>
        <div class="card-block">
            <div class="card-text">
                <form #dataForm="ngForm">
                    <h3 style="text-align: center;">Details of Product</h3>
                    <div class="clr-row">
                        <div class="clr-col-lg-4 clr-col-sm-12 clr-col-xs-12">
                            <label><b>Material Type:</b> {{selectedreport['material_type']}}</label>
                        </div>
                        <div class="clr-col-lg-4 clr-col-sm-12 clr-col-xs-12">
                            <label><b>Name of Product:</b> {{selectedreport['product_name']}}</label>
                        </div>
                        <div class="clr-col-lg-4 clr-col-sm-12 clr-col-xs-12">
                            <label><b>Quantity of Rejection :</b> {{selectedreport['rejected_quantity']}}</label>
                        </div>
                    </div>
                    <h3>Destruction Steps</h3>
                    <div class="clr-row">
                        <div class="clr-col-lg-10 clr-col-md-10 clr-col-sm-12 clr-col-xs-12">
                            <input type="text" name="step" ngModel required>
                        </div>
                        <div class="clr-col-md-2 clr-col-sm-12">
                            <button style="margin-top: 5px;" class="btn btn-primary">ADD MORE</button>
                        </div>
                        <div class="clr-col-12">
                            <table class="table" border="1" style="width: 100%;">
                                <tr style="background-color: rgb(241, 241, 241);">
                                    <td style="width:10%;">{{'common.table.srNo' | translate}}</td>
                                    <td style="width:80%;">Detail</td>
                                    <td style="width:10%;"></td>
                                </tr>
                            </table>
                        </div>
                        <div class="clr-col-lg-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Equipment Used for Destruction</label>
                            <input type="text" name="step" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Location of Destruction</label>
                            <input type="text" name="step" ngModel required>
                        </div>
                        <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                            <label>Details of Chemical treatment if destroyed in ETP tank</label>
                            <input type="text" name="step" ngModel required>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="card-footer" style="text-align: right;">
            <button class="btn btn-primary" (click)="destroyrejection(dataForm)">{{'common.submit' | translate}}</button>
            <button class="btn btn-danger" (click)="isForm = false;">{{'common.close' | translate}}</button>
        </div>
    </div>
    <div class="card" *ngIf="!isForm">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Destruction Report</div>
              <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qa/rejection" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
              </div>
            </div>
          </div>
        <div class="card-block">
            <div class="card-text">
                <table class="table">
                    <tr>
                        <th>Material Type</th>
                        <th>Product Name</th>
                        <th>Quantity of Rejection</th>
                        <th>View</th>
                    </tr>
                    <tr *ngFor="let result of datalist; let i = index">
                        <td>{{ result.material_type }}</td>
                        <td>{{ result.product_name }}</td>
                        <td>{{ result.rejected_quantity }}</td>
                        <td>
                            <button class="btn btn-sm btn-info" (click)="viewreport(i)">{{'common.view' | translate}}</button>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</div>
