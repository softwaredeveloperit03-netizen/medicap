<div class="container-fluid" *ngIf="!isNew">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
                <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Domestic Approval
                    Licences</div>
                <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                    <button class="btn btn-sm btn-success" style="background-color: rgb(10, 114, 83);color: white;"
                        (click)="new()"> NEW </button>
                    <button class="btn btn-sm" (click)="handleClick()" routerLink="/regulatory-new/approvalLicences"
                        style="background-color: red;color: white;">
                        <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                    </button>
                </div>
            </div>
        </div>
        <div class="card-block">
            <div class="card-text">

                <clr-datagrid [clrDgLoading]="loading">

                    <clr-dg-column>Product</clr-dg-column>
                    <clr-dg-column>Licence Type</clr-dg-column>
                    <clr-dg-column>Approval From</clr-dg-column>
                    <clr-dg-column>Grant Date</clr-dg-column>
                    <clr-dg-column>Valid Till</clr-dg-column>
                    <!-- <clr-dg-column>SFDA Central</clr-dg-column> -->
                    <clr-dg-column>View</clr-dg-column>
          
                    <clr-dg-row *ngFor="let res of finalResults">
                      <clr-dg-cell>{{res.Product}}</clr-dg-cell>
                      <clr-dg-cell>{{res.licence_type}}</clr-dg-cell>
                      <clr-dg-cell>{{res.approval_form}}</clr-dg-cell>
                      <clr-dg-cell>{{ res.grant_date | date:'dd-MM-yy' }}</clr-dg-cell>
                      <clr-dg-cell>{{ res.valid_till | date:'dd-MM-yy' }}</clr-dg-cell>
                      <!-- <clr-dg-cell>{{res.sfda_central}}</clr-dg-cell> -->
                      <clr-dg-cell>
                        <button class="btn btn-sm btn-info btn-icon" (click)="view(res.id)">
                          <clr-icon shape="eye" class="is-warning">
                          </clr-icon></button>
                      </clr-dg-cell>
                    </clr-dg-row>
                  </clr-datagrid>
            </div>
            <!-- <div class="card-footer">
          <button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button>
        </div> -->
        </div>
    </div>
</div>

<div class="card" *ngIf="isNew">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Domestic Approval
                Licences</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" (click)="isNew = false" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <form #licenceApprovalForm="ngForm" (ngSubmit)="submit()">
            <div class="card-text">
                <div class="clr-row">
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Product<sup style="color: red">*</sup>:</strong></label>
                        <select name="product" ngModel required>
                            <option></option>
                            <option *ngFor="let res of results">{{res.product_name}}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Licence Type<sup style="color: red">*</sup>:</strong></label>
                        <select name="licence_type" [(ngModel)]="licence_type"
                            (change)="onLicenceTypeChange($event.target.value)" ngModel required>
                            <option value="Product Permission">Product Permission</option>
                            <option value="Test Licence">Test Licence</option>
                            <option value="Free Sale Certificate">Free Sale Certificate</option>
                            <option value="Halal Certificate">Halal Certificate</option>
                            <option value="COPP">COPP</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div *ngIf="licence_type === 'other'" class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Other Licence Type:</strong></label>
                        <input type="text" name="other_licence_type" ngModel>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Approval From<sup style="color: red">*</sup>:</strong></label>
                        <select name="approval_from" required ngModel>
                            <option value="state">State</option>
                            <option value="central">Central</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Grant Date<sup style="color: red">*</sup>:</strong></label>
                        <input type="date" name="grant_date" required ngModel>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Valid Till<sup style="color: red">*</sup>:</strong></label>
                        <input type="date" name="valid_till" required ngModel>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Upload Document:</label>
                        <input type="file" (change)="onFileChanged4($event)" name="document" ngModel
                            accept="application/pdf">
                    </div>
                </div>
            </div>

            <div class="card-footer" style="padding: 10px 0px;">
                <button class="btn btn-primary" type="submit" (click)="Submit(licenceApprovalForm)">{{'common.submit' | translate}}</button>
            </div>
        </form>
    </div>
</div>
