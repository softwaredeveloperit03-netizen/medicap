<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Control Sample Entry  </div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/controlsample" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #newForm="ngForm">
          <div class="clr-row">

            <div class="clr-col-lg-8 clr-col-md-8 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Material Name:<span style="color: red">*</span></strong></label>
              <select name="material_code"ngModel required>
                <option disabled></option>
                <option *ngFor="let material of materials; let i = index" [value]="material.material_code">{{ material.material_name }} - {{ material.grade }}</option>
              </select>
            </div>

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Medicap Lot No:<span style="color: red">*</span></strong></label>
              <input type="text" name="batch_no" ngModel required>
            </div>

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>A. R No:<span style="color: red">*</span></strong></label>
              <input type="text" name="ar_no" ngModel required>
            </div>

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Analysis Date:<span style="color: red">*</span></strong></label>
              <input type="date" name="analysis_date" ngModel required>
            </div>

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Release Date:<span style="color: red">*</span></strong></label>
              <input type="date" name="release_date" ngModel required>
            </div>

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Sampling Done By:<span style="color: red">*</span></strong></label>
              <select name="sample_by" ngModel required>
                <option disabled> </option>
                <option *ngFor="let item of employees" [value]="item.emp_id">{{item.emp_name}} </option>
              </select>
            </div>

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Sampling Date:<span style="color: red">*</span></strong></label>
              <input type="date" name="sampling_date" ngModel required>
            </div>

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Manufacturing Date:<span style="color: red">*</span></strong></label>
              <input type="month" name="mfg_date" ngModel required>
            </div>

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Expiry Date:<span style="color: red">*</span></strong></label>
              <input type="month" name="exp_date" ngModel required>
            </div>

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Quantity Of Sample (Units):<span style="color: red">*</span></strong></label>
              <input type="text" name="sample_quantity" ngModel required>
            </div>

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Units:<span style="color: red">*</span></strong></label>
                <select name="unit" ngModel required>
                  <option></option>
                  <option *ngFor="let unit of units">{{ unit.unit }}</option>
                </select>
            </div>

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>No of Packs:</strong></label>
              <input type="text" name="pack_no"ngModel>
            </div>

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Kept in Rack No:</strong></label>
              <input type="text" name="rack_no"ngModel>
            </div>

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Room Temperature( ℃):</strong></label>
              <input type="text" name="room_temp"ngModel>
            </div>

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Humidity (% RH):</strong></label>
              <input type="text" name="humidity"ngModel>
            </div>

          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="saveForm(newForm)">{{'common.submit' | translate}}</button>
    </div>
</div>
