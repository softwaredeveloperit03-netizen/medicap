<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Control Sample Charge  </div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/controlsample" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #newForm="ngForm">
          <div class="clr-row">

            <div class="clr-col-lg-8 clr-col-md-8 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Material Name:<span style="color: red">*</span></strong></label>
              <select name="material_code"ngModel required>
                <option disabled></option>
                <option *ngFor="let material of materials; let i = index" [value]="material.material_code">{{ material.material_name }} - {{ material.grade }}</option>
              </select>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="saveForm(newForm)">{{'common.submit' | translate}}</button>
    </div>
</div>
