<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Distruction Timeline</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/qa/controlsample/masters/destruction" style="background-color: red;color: white;"> CLOSE
            </button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #changeform="ngForm">
                <div class="clr-row">
                    <div class="clr-col-xl-3 clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>{{'common.type' | translate}}<span style="color: red;">*</span></label>
                        <select name="type" ngModel required>
                            <option>Raw Material</option>
                            <option>Packing Material</option>
                            <option>Finish Material</option>
                        </select>
                    </div>
                    <div class="clr-col-xl-3 clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Destroy After<span style="color: red;">*</span></label>
                        <input type="text" name="destroy_after" ngModel required oninput="this.value = this.value.replace(/[a-zA-Z]/g, '') ">
                     </div>
                     <div class="clr-col-xl-3 clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>{{'common.unit' | translate}}<span style="color: red;">*</span></label>
                       <select name="unit" ngModel="Month">
                           <option>Month</option>
                       </select>
                     </div>
                </div>   
            </form>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" type="button" (click)="save(changeform)">{{'common.save' | translate}}</button>
    </div>
</div>
