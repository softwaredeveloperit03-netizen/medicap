<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Frequency Master</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/qa/controlsample/masters/frequency" style="background-color: red;color: white;"> CLOSE
            </button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #changeform="ngForm">
                <div class="clr-row">
                    <div class="clr-col-xl-3 clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Type Of Control Sample<span style="color: red;">*</span></label>
                        <select name="type" ngModel required>
                            <option>Raw Material</option>
                            <option>Packing Material</option>
                            <option>Finish Material</option>
                        </select>
                    </div>
                    <div class="clr-col-xl-3 clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Frequency<span style="color: red;">*</span></label>
                        <input type="text" name="frequency" ngModel required  oninput="this.value = this.value.replace(/[a-zA-Z]/g, '') ">
                     </div>
                     <div class="clr-col-xl-3 clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>{{'common.unit' | translate}}<span style="color: red;">*</span></label>
                       <select name="unit" ngModel>
                        <option></option>
                        <option>Hertz (Hz)</option>
                        <option>Kilohertz (kHz)</option>
                        <option>Megahertz (MHz)</option>
                        <option>Cycles per minute (cpm)</option>

                       </select>
                     </div>
                     <div class="clr-col-xl-3 clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Deviation After (Days)<span style="color: red;">*</span></label >
                        <input type="text" name="deviation_after" ngModel required  maxlength="3" minlength="3" oninput="this.value = this.value.replace(/[a-zA-Z]/g, '') ">



                        
                        <span *ngIf="flag" style="color:red;">invalid input</span>
                     </div>
                </div>   
            </form>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" type="button" (click)="save(changeform)">{{'common.save' | translate}}</button>
    </div>
</div>
