<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Control Sample New Rack Entry  </div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/qa/controlsample/masters/rack" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
      <div class="card-block">
        <div class="card-text">
          <form #newForm="ngForm">
            <div class="clr-row">
              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label>Rack Type:</label>
                <select name="material_type" [(ngModel)]="material_type" required>
                  <option></option>
                  <option value="Raw Material">Raw Material</option>
                  <option value="Packing Material">Packing Material</option>
                  <option value="Finished Product">Finished Product</option>
                </select>
              </div>
  
              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label>Rack No.:</label>
               <input type="text" name="rack_no" ngModel required>
              </div>

              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <h3>Sub Racks:</h3>
                <form #rackForm="ngForm">
                    <table class="table">
                        <tr>
                            <th>Sr</th>
                            <th>Sub Rack</th>
                            <th>{{'common.table.action' | translate}}</th>
                        </tr>
                        <tr>
                            <td></td>
                            <td style="padding: 0px;">
                                <input type="text" name="sub_rack" ngModel required style="margin: 0px; height: 33px;">
                            </td>
                            <td style="padding: 0px; vertical-align: middle;">
                                <button class="btn btn-sm btn-info" (click)="addRack(rackForm)">{{'common.add' | translate}}</button>
                            </td>
                        </tr>
                        <tr *ngFor="let list of rackList; let i = index">
                            <td style="text-align: left;">{{ i+1 }}.</td>
                            <td style="text-align: left;">{{ list.sub_rack }}</td>
                            <td>
                                <clr-icon shape="trash" class="is-error" (click)="deleteRack(i)"></clr-icon>
                            </td>
                        </tr>
                        <tr *ngIf="rackList?.length == 0">
                            <td colspan="3">{{'common.noRecords' | translate}}</td>
                        </tr>
                    </table>
                </form>
            </div>
  
            </div>
          </form>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="saveRack(newForm)">{{'common.save' | translate}}</button>
      </div>
    </div>
  </div>
