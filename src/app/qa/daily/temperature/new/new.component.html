<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Temperature Form</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/qa/daily/temperature" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
    <div class="card-block">
        <div class="card-text">
            <form #temp="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-6 clr-col-xs-12">
                        <label>Department:</label>
                        <select name="department" (change)="getSections($event.target.selectedIndex)" ngModel required>
                            <option></option>
                            <option *ngFor="let de of depart;let i =index;" value="{{de.department_name}}">{{de.department_name}}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-6 clr-col-xs-12">
                        <label>Room Name:</label>
                        <select name="section" ngModel required >
                            <option></option>
                            <option *ngFor="let section of sections" value="{{section.section_code}}">{{ section.section_name }}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-6 clr-col-xs-12">
                        <label>Temperature:</label>
                        <input type="text" name="temperature" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-6 clr-col-xs-12">
                        <label> Humidity:</label>
                        <input type="text" name="humidity" ngModel required>
                    </div>
                </div>
            </form> 
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="save(temp)">{{'common.save' | translate}}</button>
    </div>
</div>
