<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Microbial Monitoring
            </div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qa/daily" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <form #microbialForm="ngForm">
            <div class="card-text">
                <h4>Monitoring Details</h4>
                <div class="clr-row">
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Monitoring ID :<span style="color: red;">*</span></label>
                        <input type="text" name="monitoring_id" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Date Of Monitoring:<span style="color: red;">*</span></label>
                        <input type="date" name="monitoring_date" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Location/Room:<span style="color: red;">*</span></label>
                        <input type="text" name="location" ngModel required>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left; color: black; background-color: lightgreen;">
                    Environmental Condition</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Temperature (c):<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="temperature" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Pressure Differential (Pa):<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="Pressure_diffrential" ngModel required>
                        </div>
                    </div>
                </div>
                <div class="card-header" style="text-align: left; color: white; background-color: rgb(154, 107, 230);">
                    Microbiological Sampling</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Sampling Method:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="shipping_method" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Sampling Start Time:<sup style="color: red">*</sup></strong></label>
                            <input type="time" name="shipping_start_time" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Sampling End Time:<sup style="color: red">*</sup></strong></label>
                            <input type="time" name="shipping_end_time" ngModel required>
                        </div>
                    </div>
                    <h4>Microbial Count</h4>
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Total Microbial Count:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="total_microbial_cout" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Identified Microorganisms:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="identified_microorganisms" ngModel required>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left; color: white; background-color: rgb(16, 123, 43);">
                    Personal Details</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Personal Conducting Monitoring:<sup
                                        style="color: red">*</sup></strong></label>
                            <input type="text" name="p_cunducting_monitoring" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Supervisor Name:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="supervisor_name" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Observations & Comments:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="observations" ngModel required>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left;color: black; background-color: rgb(212, 103, 14);">
                    Review & Approval</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Reviewing Officer:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="reviewing_officer" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Review Date :<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="review_date" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Approval Status:<sup style="color: red">*</sup></strong></label>
                            <select type="text" name="shipping_method" ngModel required>
                                <option></option>
                                <option>{{'common.approved' | translate}}</option>
                                <option>{{'common.pending' | translate}}</option>
                                <option>{{'common.rejected' | translate}}</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Supporting Documents:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="supporting_doc" ngModel required>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="save(microbialForm)">{{'common.save' | translate}}</button>
    </div>
</div>
