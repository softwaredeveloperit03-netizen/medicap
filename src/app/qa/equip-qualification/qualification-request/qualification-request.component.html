<div class="container-fluid" *ngIf="!isNew">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Equipment Qualification Request</div>
              <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                
                <button class="btn btn-success" routerLink="/qa/equip-qualification/allocation">Allocation</button>
                <button class="btn btn-success" (click)="isNew = true">New Qualification Request</button>

                <button class="btn btn-sm" routerLink="/qa/equip-qualification" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
              </div>
            </div>
          </div>
        <div class="card-block">
            <div class="card-text">
                <table class="table">
                    <tr>
                        <th>{{'common.department' | translate}}</th>
                        <th>Room Name</th>
                        <th>Equipment Name</th>
                        <th>Make</th>
                        <th>Capacity</th>
 
                    </tr>
                    <tr *ngFor="let res of results;let i=index">
                        <td>{{ res.department_name}}</td>
                        <td>{{ res.section_name}}</td>
                        <td>{{ res.equip_name}}</td>
                        <td>{{ res.make}}</td>
                        <td>{{ res.capacity}}</td>
                     
                    </tr>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="container-fluid" *ngIf="isNew">
    <div class="card">
        <div class="card-header">Equipment Qualification Request</div>
        <div class="card-block">
            <div class="card-text">
                <form #reportForm="ngForm">
                     <div class="clr-row">

                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                            <label>Department:</label>
                            <select name="department_name" ngModel (change)="getSection($event.target.value)" required>
                                <option></option>
                                <option *ngFor="let dept of dept" [value]="dept.department_name">{{dept.department_name}}</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                            <label>Equipment Name:</label>
                            <select name="equip_name" ngModel (change)="selectEquipment($event.target.selectedIndex)" required>
                                <option></option>
                                <option *ngFor="let dept of equipments" >{{dept.equipment_name}}</option>
                            </select>
                        </div>
                
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                            <label>Equipment Code :</label>
                            <input type="text" name="equipment_code" [(ngModel)]="selectedEquip['equipment_code']" readonly>
                        </div>
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                            <label>Section :</label>
                            <input type="text" name="section_name" [(ngModel)]="selectedEquip['location']" readonly>
                        </div>
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                            <label>Make:</label>
                            <input type="text" name="make" [(ngModel)]="selectedEquip['make']" readonly>
                        </div>
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                            <label>Capacity:</label>
                            <input type="text" name="capacity" [(ngModel)]="selectedEquip['capacity']" readonly>
                        </div>     
                    </div>
                </form>     
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="saveRequest(reportForm)">{{'common.submit' | translate}}</button>
            <button class="btn btn-danger" (click)="isNew = false">{{'common.close' | translate}}</button>
        </div>
    </div>
</div>
