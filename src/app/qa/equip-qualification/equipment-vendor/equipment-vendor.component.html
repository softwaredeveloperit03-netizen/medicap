<div class="container-fluid">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Equipment Vendor</div>
              <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qa/equip-qualification" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
              </div>
            </div>
          </div>
        <div class="card-block">
            <div class="card-text">
                <table class="table">
                    <tr>
                        <th>Vendor</th>
                        <th>Equipment Name</th>
                        <th>Capacity</th>
                        <th>Make</th>
                        <th>Model</th>
                        <th>{{'common.type' | translate}}</th>
                    </tr>
                    <tr *ngFor="let equipment of records; let i = index">
                        <td>{{ equipment.vendor }}</td>
                        <td>{{ equipment.equipment_name }}</td>
                        <td>{{ equipment.capacity }}</td>
                        <td>{{ equipment.make }}</td>
                        <td>{{ equipment.model }}</td>
                        <td>{{ equipment.type }}</td>
                    </tr>
                    <tr *ngIf="records?.length == 0">
                        <td colspan="6">{{'common.noRecords' | translate}}</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</div>
