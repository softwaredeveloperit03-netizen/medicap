<div class="container-fluid" *ngIf="!isNew">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Equipment Qualification Allocation</div>

              <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm btn-info" style="background-color: rgb(6, 134, 16);color: white;" (click)="isNew = true">{{'common.new' | translate}}</button>

                <button class="btn btn-sm" routerLink="/qa/equip-qualification/qualification-request" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
              </div>
            </div>
          </div>
        <div class="card-block">
            <div class="card-text">
                  <table class="table">
                    <tr>
                        <th>{{'common.department' | translate}}</th>
                        <th>Room Name</th>
                        <th>Equipment Name</th>
                        <th>Make</th>
                        <th>Capacity</th>
                        <!-- <th>Po. No.</th>
                        <th>Received At Site</th>
                        <th>DQ. No.</th> -->
                    </tr>
                    <tr *ngFor="let res of results;let i=index">
                        <td>{{ res.department_name}}</td>
                        <td>{{ res.section_name}}</td>
                        <td>{{ res.equip_name}}</td>
                        <td>{{ res.make}}</td>
                        <td>{{ res.capacity}}</td>
                     
                    </tr>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="container-fluid" *ngIf="isNew">
    <div class="card">
        <div class="card-header">Equipment Qualification Allocation</div>
        <div class="card-block">
            <div class="card-text">
                <form #reportForm="ngForm">
                     <div class="clr-row">

                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                            <label>Department:</label>
                            <select name="department_name" ngModel (change)="getemployeeByDept($event.target.value)" required>
                                <option></option>
                                <option *ngFor="let dept of dept" [value]="dept.department_name">{{dept.department_name}}</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                            <label>Employee Name:</label>
                            <select name="employee_name" ngModel (change)="selectEmployee($event.target.selectedIndex)" required>
                                <option></option>
                                <option *ngFor="let dept of employees" [value]="dept.emp_id">{{dept.firstname}} {{dept.lastname}}</option>
                            </select>
                        </div>
                
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                            <label>Employee Id :</label>
                            <input type="text" name="equipment_code" [(ngModel)]="selectedEmp['emp_id']" readonly>
                        </div>
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                            <label>Designation :</label>
                            <input type="text" name="equipment_code" [(ngModel)]="selectedEmp['designation']" readonly>
                        </div>


                         
                    </div>
                </form>     
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="saveRequest(reportForm)">{{'common.submit' | translate}}</button>
            <button class="btn btn-danger" (click)="isNew = false">{{'common.close' | translate}}</button>
        </div>
    </div>
</div>
