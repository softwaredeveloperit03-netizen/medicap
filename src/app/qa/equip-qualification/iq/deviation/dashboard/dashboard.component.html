
 <div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> DEVIATION dumy IQ </div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/qa/equip-qualification/iq" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #checkForm="ngForm">
            <table class="table table-border">
                <tr>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr.</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.description' | translate}}</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Deviation raised by</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Closing by</th>   
                   <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Checked By</th>
                    <!-- <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.table.action' | translate}}</th> -->
                </tr>
                <tr>
                    <td></td>
                    <td style="padding:0px;">
                        <input type="text" name="description" ngModel required style="margin:0px;">
                    </td>
                    <td style="padding:0px;">
                        <input type="text" name="deviation" ngModel required style="margin:0px;">
                    </td>
                    <td style="padding:0px;">
                        <input type="text" name="close_by" ngModel required style="margin:0px;">
                    </td>
                    <td style="padding:0px;">
                        <input type="text" name="check_by" ngModel required style="margin:0px;">
                    </td>
                 
                    <!-- <td style="padding: 0px; vertical-align: middle;">
                        <button class="btn btn-sm btn-info" (click)="addData(checkForm)">{{'common.add' | translate}}</button>
                    </td> -->
                </tr>
                <tr *ngFor="let result of checkList; let i = index">
                    <td>{{i+1}}.</td>
                    <td>{{result.description}}</td>
                    <td>{{result.deviation}}</td>
                    <td>{{result.close_by}}</td>
                    <td>{{result.check_by}}
                 <!-- <td>
                    <clr-icon shape="trash" class="is-error" (click)="delData(i)"></clr-icon>
                </td> -->
                </tr>
                <tr *ngIf="results?.length == 0">
                    <td colspan="6">{{'common.noRecords' | translate}}</td>
                </tr>
            </table>
        </form>
        </div>
    </div>
    <div class="card-footer">
        <div class="card-footer"><button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button></div>
      </div>
</div>
