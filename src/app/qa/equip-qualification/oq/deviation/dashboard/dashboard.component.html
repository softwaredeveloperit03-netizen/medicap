<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Deviation OQ </div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qa/equip-qualification/oq"
                    style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #reviewForm="ngForm">
                <label for="">Total No. Deviation</label>
                <input type="text" name="deviation_no" id="">
                <table class="table table-border">
                    <tr>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr.</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Deviation No.
                        </th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Deviation Title
                        </th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Status
                        </th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Comments
                        </th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Reviewed By
                        </th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.date' | translate}}</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.table.action' | translate}}</th>
                    </tr>
                    <tr>
                        <td></td>
                        <td style="padding:0px;">
                            <input type="text" name="deviation_no" ngModel required style="margin:0px;">
                        </td>
                        <td style="padding:0px;">
                            <input type="text" name="Deviation_title" ngModel required style="margin:0px;">
                        </td>
                        <td style="padding:0px;">
                            <input type="text" name="Status" ngModel required style="margin:0px;">
                        </td>
                        <td style="padding:0px;">
                        <input type="text" name="Comments" ngModel required style="margin:0px;">
                        </td>
                        <td style="padding:0px;">
                            <input type="text" name="Reviewed_by" ngModel required style="margin:0px;">

                        </td>
                        <td style="padding:0px;">
                            <input type="date" name="date" ngModel required style="margin:0px;">
                        </td>
                        <td style="padding: 0px; vertical-align: middle;">
                            <button class="btn btn-sm btn-info" (click)="addData(reviewForm)">{{'common.add' | translate}}</button>
                        </td>
                    </tr>
                    <tr *ngFor="let result of DevList; let i = index">
                        <td>{{i+1}}.</td>
                        <td>{{result.deviation_no}}</td>
                        <td>{{result.Deviation_title}}</td>
                        <td>{{result.Status}}</td>
                        <td>{{result.Comments}}</td>
                        <td>{{result.Reviewed_by}}</td>
                        <td>{{result.date}}</td>
                        <td>
                            <clr-icon shape="trash" class="is-error" (click)="delData(i)"></clr-icon>
                        </td>
                    </tr>
                </table>
            </form>
        </div>
        <button class="btn btn-primary" (click)="save(reviewForm)">{{'common.save' | translate}}</button>
    </div>
    <div class="card-footer">
        <div class="card-footer"><button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button></div>
    </div>
</div>
