<div class="container-fluid">
  <div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Upload Existing SOP </div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/qa/sops" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
      <div class="card-block">
          <div class="card-text">
              <form #sopForm="ngForm">
                  <div class="clr-row">
                      <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                          <label>SOP Title:<span class="required">*</span></label>
                          <input type="text" name="sop_title" ngModel required>
                      </div>
                      <div class="clr-col-lg-6 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                          <label>SOP For:<span class="required">*</span></label>
                          <input type="text" name="sop_for" ngModel required>
                      </div>
                      <div class="clr-col-lg-6 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                          <label>Version No:<span class="required">*</span></label>
                          <input type="text" name="version_no" ngModel required>
                      </div>
                      <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                          <label>Upload SOP:<span class="required">*</span></label>
                          <input type="file" name="upload_sop"  ngModel required accept="pdf/*" style="height: auto;"  (change)="onFileChanged1($event)">
                      </div>
                  </div>
              </form>
          </div>
      </div>
      <div class="card-footer">
          <button class="btn btn-primary" (click)="submitSOP(sopForm)">{{'common.save' | translate}}</button>
      </div>
  </div>
</div>
