<div class="container-fluid">
  <div class="card">
    <div class="card-header">SOP LIST</div>
    <div class="card-block">
      <div class="card-text">
        <button class="btn btn-sm btn-info" routerLink='/sops/new-sop'>Prepare New SOP</button>
        <clr-datagrid>
          <clr-dg-column>SOP No.</clr-dg-column>
          <clr-dg-column>Title</clr-dg-column>
          <clr-dg-column>{{'common.department' | translate}}</clr-dg-column>
          <clr-dg-column>Version No.</clr-dg-column>
          <clr-dg-column>{{'common.status' | translate}}</clr-dg-column>
          <clr-dg-column>{{'common.table.action' | translate}}</clr-dg-column>
          
          <clr-dg-row *ngFor="let item of soplist; let i = index">
            <clr-dg-cell>{{item.sop_no}}</clr-dg-cell>
            <clr-dg-cell>{{item.title}}</clr-dg-cell>
            <clr-dg-cell>{{item.department}}</clr-dg-cell>
            <clr-dg-cell>{{item.version_no}}</clr-dg-cell>

            <clr-dg-cell [ngClass]="{
                'positive' : item.status == 'approve',
                'negative' : item.status == 'pending'}">{{ item.status }}
            </clr-dg-cell>

            <clr-dg-cell>
              <button *ngIf="item.status == 'approve'" class="btn btn-sm btn-info btn-icon"
                (click)="downloadsop(item.file)">
                <clr-icon shape="download"></clr-icon>
              </button>
            </clr-dg-cell>

          </clr-dg-row>
        </clr-datagrid>
      </div>
    </div>
  </div>
</div>
