<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Obsolete SOP </div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qa/sops" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid" ></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <form #obsoleteSOPForm="ngForm">
         <div class="card-text">
            <h4>Identification Details</h4>
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>SOP ID:<span style="color: red;">*</span></label>
                            <input type="text" name="sop_id" ngModel required>
                        </div>
        
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Date Of Obsolescence:<span style="color: red;">*</span></label>
                            <input type="text" name="obsolete_date" ngModel>
                        </div>
                    </div>
            <div class="card">
                <div class="card-header" style="text-align: left; color: black; background-color: lightgreen;">SOP Details </div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>SOP Title:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="sop_title" ngModel>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Version No:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="version_no" ngModel>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Reason For Obsolescence:<sup style="color: red">*</sup></strong></label>
                            <select type="text" name="reason_for_obsol" ngModel>
                                <option></option>
                                <option>Updated Version</option>
                                <option>Process Change</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left;color: black; background-color: rgb(14, 163, 212);"> Review & Approval </div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Reviewing Officer:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="reviewing_officer" ngModel>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Reviewing Date:<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="reviewing_date" ngModel>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Approval Status:<sup style="color: red">*</sup></strong></label>
                            <select type="text" name="approval_status" ngModel>
                                <option></option>
                                <option>{{'common.approved' | translate}}</option>
                                <option>{{'common.pending' | translate}}</option>
                                <option>{{'common.rejected' | translate}}</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card">
            <div class="card-text">
                <div class="card-header" style="text-align: left;color: black; background-color: rgb(30, 212, 14);"> Documentation & Archive </div>
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>obsolete SOP Document :<span style="color: red;">*</span></label>
                            <input type="file" name="sop_doc" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Archive Date:<span style="color: red;">*</span></label>
                            <input type="date" name="archiv_date" ngModel required>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
     </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="save(obsoleteSOPForm)">{{'common.save' | translate}}</button>
        </div>
</div>
