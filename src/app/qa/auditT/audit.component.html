<div class="container-fluid">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Audit Trails</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/it" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
      <div class="card-block">
          <div class="card-text">
              <div class="clr-row">
                  <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                      <label>Department:</label>
                      <select name="department" [(ngModel)]="department" (change)="getAuditTrails()" required>
                          <option></option>
                          <option *ngFor="let department of departments">{{ department.department_name }}</option>
                      </select>
                  </div>
              </div>
              <table class="table">
                  <tr>
                      <th>DATE / TIME</th>
                      <th>Employee ID</th>
                      <th>Employee Name</th>
                      <th style="text-align: left;">REQUEST</th>
                      <th style="text-align: left;">Form</th>
                      <th>REMOTE ADDR</th>
                  </tr>
              
                  <tr *ngFor="let user of logs">
                      <td>{{user.actiontime | date:'dd-MM-yyyy:hh-mm'}}</td>
                      <td>{{user.emp_id}}</td>
                      <td>{{user.firstname}}</td>
                      <td style="text-align: left;">{{user.action}}</td>
                      <td style="text-align: left;"><span *ngIf="user.action=='getAuditTrails'">Audit Trails</span>
                        <span *ngIf="user.action=='getChallansLog'">Challans Log</span></td>
                      <td>{{user.REMOTE_ADDR}}</td>
                  </tr>
              </table>
          </div>
      </div>
  </div>
</div>
