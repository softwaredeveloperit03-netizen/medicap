<div class="card" *ngIf="!isView">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-lg-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Artwork Devloper Log</div>
          <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-success" routerLink="/qa/artwork/registration/new" >New Registration</button>
            <button class="btn btn-sm btn-danger" routerLink="/qa/artwork" >{{'common.close' | translate}}</button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            
            <table class="table table-border">
                <tr>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">ID</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Artwork Devloper Name</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Mobile No.</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Email Id</th>
                 </tr>
                <tr *ngFor="let result of results; let i = index">
                     <td style="text-align: left;">{{ result.emp_id }}</td>
                    <td style="text-align: left;">{{ result.firstname }} {{ result.lastname }}</td>
                    <td style="text-align: left;">{{ (result.contact_no  | canadianPhone)}}</td>
                    <td style="text-align: left;">{{ result.emp_email}}</td>
                
                </tr>
                <tr *ngIf="results?.length == 0">
                    <td colspan="4">{{'common.noRecords' | translate}}</td>
                </tr>
            </table>
        </div>
    </div>
</div>
