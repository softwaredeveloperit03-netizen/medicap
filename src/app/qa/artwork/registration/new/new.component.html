<div class="container-fluid">
    <div class="card"> 
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
                <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Devloper / Artist Registration </div>
                <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                    <button class="btn btn-sm" routerLink="/qa/artwork/registration/log" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                    </button>
                </div>
            </div>
        </div>
        <div class="card-block">
            <form #devloperForm="ngForm">
                <div class="card-text">
                    <div class="clr-row">
                        <div class="card" style="margin-bottom: 30px;">

                            <div class="card-block">
                                <div class="card-text">
                                    <div class="clr-row">

                                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                            <label><strong>First Name:<sup style="color: red">*</sup>:</strong></label>
                                            <input  type="text" name="firstname" ngModel required>
                                       
                                        </div>
                              
                                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                            <label><strong>Last Name:<sup style="color: red">*</sup>:</strong></label>
                                            <input type="text"  name="lastname" ngModel required>
                                        </div>

                                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                            <label><strong>Contact No:</strong></label>
                                            <input type="text" #contact_no="ngModel" name="contact_no" minlength="10"
                                                maxlength="10" ngModel pattern="[0-9]+" >
                                        </div>
                                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                            <label><strong>Email Id:</strong></label>
                                            <input #email="ngModel" type="email" name="emp_email" ngModel
                                                pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$">
                                            <span style="color: red;" *ngIf="email.invalid && email.touched">Please
                                                Enter Valid Email
                                                Id!</span>
                                        </div>

                                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                            <label><strong>Gender:<sup style="color: red">*</sup>:</strong></label>
                                            <select name="gender" ngModel="Male" required style="height: 33px;">
                                                <option>Male</option>
                                                <option>Female</option>
                                            </select>
                                        </div>
                                 
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="card-footer">
            <button   class="btn btn-primary" (click)="saveEmployee(devloperForm)">{{'common.save' | translate}}</button>
            <button    class="btn btn-danger" routerLink="/qa/artwork/registration/log">{{'common.close' | translate}}</button>
           </div>
    </div>
</div>
