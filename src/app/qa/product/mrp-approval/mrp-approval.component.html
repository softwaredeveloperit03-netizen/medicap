<div class=card>
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Product MRP Approval</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/product" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <table class="table">
                <tr>
                    <th style="text-align: left;">Sr.</th>
                    <th style="text-align: left;">Product Code</th>
                    <th style="text-align: left;">MRP</th>
                    <th style="text-align: left;">Entry By</th>
                    <th style="text-align: left;">Entry Date</th>
                    <th style="text-align: left;">{{'common.status' | translate}}</th>
                    <th>{{'common.table.action' | translate}}</th>
                </tr>
                <tr *ngFor="let result of results; let i = index">
                    <td style="text-align: left;">{{ i + 1 }}.</td>
                    <td style="text-align: left;">{{ result.product_code }}</td>
                    <td style="text-align: left;">{{ result.mrp }}</td>
                    <td style="text-align: left;width: 7%;">{{ result.entry_by }}</td>
                    <td style="text-align: left;">{{ result.entry_date }}</td>
                    <td style="text-align: left;">{{ result.status }}</td>
                    <td>
                        <button class="btn btn-sm btn-primary"  (click)="approveMRP('approve',result)">{{'common.approve' | translate}}</button>
                        <button class="btn btn-sm btn-danger" (click)="approveMRP('reject',result)">{{'common.reject' | translate}}</button>
                    </td>
                </tr>
                <tr *ngIf="results?.length == 0">
                    <td colspan="7">{{'common.noRecords' | translate}}</td>
                </tr>
            </table>
        </div>
    </div>
</div>
