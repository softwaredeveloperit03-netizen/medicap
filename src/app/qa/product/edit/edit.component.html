<div *ngIf="!isView">Loading Data...</div>
<div class="card" *ngIf="isView">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Update Product Details</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/product/log" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #productForm="ngForm">
            <div class="clr-row">
                <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <label>Product Name / Brand Name:</label>
                    <input type="text" name="product_name" [(ngModel)]="result['product_name']" required>
                </div>
                <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                    <label>Grade:</label>
                    <select name="grade" [(ngModel)]="result['grade']">
                        <option></option>
                        <option *ngFor="let grade of grades">{{ grade.grade }}</option>
                    </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Type of Dose:</label>
                    <select name="dosage_type" [(ngModel)]="result['dosage_type']" (change)="getDosages($event.target.value)">
                    <option>SOLID</option>
                    <option>LIQUID</option>
                    <option>SEMI SOLID</option>
                    </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Dosage Form:</label>
                    <select name="dosage_form" [(ngModel)]="result['dosage_form']">
                    <option></option>
                    <option *ngFor="let dosage of dosages">{{ dosage.dosage_form }}</option>
                    </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Packing Style:</label>
                    <input type="text" name="packing_style" [(ngModel)]="result['packing_style']">
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Shelf Life:</label>
                    <input type="text" name="shelf_life" [(ngModel)]="result['shelf_life']">
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Excipients:</label>
                    <select name="excipient" [(ngModel)]="result['excipient']">
                    <option></option>
                    <option>Color</option>
                    <option>Additives</option>
                    </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Manufactured Under: </label>
                    <select name="manufactured_under" [(ngModel)]="result['manufactured_under']">
                    <option></option>
                    <option>Self</option>
                    <option>LL</option>
                    <option>Contract Mfg.</option>
                    </select>
                </div>
                <div class="clr-col-lg-6 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Manufactured For Client: </label>
                    <select name="manufactured_for" [(ngModel)]="result['manufactured_for']">
                    <option></option>
                    <option *ngFor="let client of clients">{{ client.company_name }}</option>
                    </select>
                </div>
                <div class="clr-col-lg-6 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Manufactured For: </label>
                    <select name="manufactured_type" [(ngModel)]="result['manufactured_type']">
                    <option></option>
                    <option>Export</option>
                    <option>Domestic</option>
                    </select>
                </div>
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                    <label>Label Claim:</label>
                    <textarea rows="2" name="label_claim" [(ngModel)]="result['label_claim']"></textarea>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Category:</label>
                    <input type="text" name="category" [(ngModel)]="result['category']">
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Mfg Lic No.:</label>
                    <input type="text" name="mfg_lic" [(ngModel)]="result['mfg_lic']">
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Market:</label>
                    <select name="market" [(ngModel)]="result['market']">
                        <option></option>
                        <option>Export</option>
                        <option>Domestic</option>
                    </select>
                </div>
                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>MRP:</label>
                    <input type="text" name="mrp" [(ngModel)]="result['mrp']">
                </div>
                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>GST:</label>
                    <input type="text" name="gst" [(ngModel)]="result['gst']">
                </div>
                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>HSN:</label>
                    <input type="text" name="hsn" [(ngModel)]="result['hsn']">
                </div>
                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>GTIN:</label>
                    <input type="text" name="gtin" [(ngModel)]="result['gtin']">
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Approximate Testing Time:</label>
                    <input type="number" name="tesing_time" [(ngModel)]="result['tesing_time']">
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Retest After(Months):</label>
                    <input type="text" name="retest_period" [(ngModel)]="result['retest_period']">
                </div>
                <div class="clr-col-lg-4 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <label>Sale TS:</label>
                    <input type="text" name="sale_ts" [(ngModel)]="result['sale_ts']">
                </div>
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                    <label>Primary Pack Description:</label>
                    <textarea rows="2" name="pack_desc" [(ngModel)]="result['pack_desc']"></textarea>
                </div>
                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Minimum Shelf Life:</label>
                    <input type="text" name="min_shelf" [(ngModel)]="result['min_shelf']">
                </div>
                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Packing Mode:</label>
                    <input type="text" name="packing_mode" [(ngModel)]="packing_mode">
                </div>
                <div class="clr-col-lg-3 clr-col-md-6 clr-col-sm-12">
                    <label>Division :</label>
                    <select name="division" [(ngModel)]="result['division']">
                        <option></option>
                        <option>General</option>
                        <option>Cefazolin</option>
                        <option>Betaceum</option>
                    </select>
                </div>
                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Therapetic Category:</label>
                    <input type="text" name="thera" [(ngModel)]="result['thera']">
                </div>
                <div class="clr-col-lg-6 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Storage Condition:</label>
                    <input type="text" name="storage_condition" [(ngModel)]="result['storage_condition']">
                </div>
                <div class="clr-col-lg-6 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Product Apperance:</label>
                    <input type="text" name="apperance" [(ngModel)]="result['apperance']">
                </div>
            </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button type="button" class="btn btn-primary" (click)="update(productForm)">{{'common.update' | translate}}</button>
    </div>
</div>
