<div class="dashboard-shell" style="background: linear-gradient(135deg, #eef2ff 0%, #f5f7fa 100%)">
  <div class="dash-header">
    <div class="title-block">
      <h2>{{ pageTitle }}</h2>
      <small>SOP-QA-042 | Prepare → MRT Review → Log</small>
    </div>
    <div class="header-actions">
      <a class="close-btn" [routerLink]="closeLink"><i class="fas fa-times"></i> Close</a>
    </div>
  </div>
  <h3 class="section-label">Assessment Flow</h3>
  <div class="tiles-grid">
    <a *ngFor="let card of cards" class="tile-card" [routerLink]="card.route">
      <div class="icon-wrap" [style.background]="card.gradient"><i class="fas" [ngClass]="card.icon"></i></div>
      <div class="tile-body">
        <div class="tile-title">{{ card.title }}</div>
        <p class="tile-description">{{ card.description }}</p>
      </div>
    </a>
  </div>
</div>
