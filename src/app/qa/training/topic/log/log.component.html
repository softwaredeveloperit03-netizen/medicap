<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Training Topics</div>
          <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-success" routerLink="new" >{{'common.new' | translate}}</button>
              <button class="btn btn-sm" routerLink="/qa/training" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>  
    </div>
    <div class="card-block">
        <div class="card-text">
            <div class="clr-row">
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
 
                    <table class="table table-border">
                        <tr>
                            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr. </th>
                             <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Training Category</th>
                             <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Training Topic</th>
                               <!-- <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.description' | translate}}</th> -->
                           </tr>
                         <tr *ngFor="let result of subject_list; let i=index">
                            <td style="text-align: left;">{{ i+1 }}</td>
                             <td style="text-align: left;">{{ result.training_category}}</td>
                             <td style="text-align: left;">{{ result.subject}}</td>
                            <!-- <td style="text-align: left;">{{ result.training_desc }}</td>                          -->
                        </tr>
                    </table> 
                </div>
            </div>
        </div>
    </div>
</div>
