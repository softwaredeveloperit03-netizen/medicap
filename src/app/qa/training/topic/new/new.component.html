<div class="container-fluid">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Training Topic</div>
              <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qa/training/topic" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
              </div>
            </div>
        </div>
        <div class="card-block">
            <div class="card-text">
                <form #externalForm="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12">
                            <label>Grade / Level:<sup style="color: red">*</sup></label>
                            <select name="training_category"   ngModel (change)="addCat($event.target.value)" required>
                                <option></option>
                                <option>Level 1 ( Read a Document )</option>
                                <option>Level 2 ( Attend a Training/Information Seminar )</option>
                                <option>Level 4 ( Formal Training and Assessment )</option>
                                <option>cGMP Training</option>
                              </select>
                        </div>
                        <div   class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12">
                            <label>Topic Title: <sup style="color: red">*</sup></label>
                            <input type="text" name="subject" ngModel required>
                        </div>
                      
                        <!-- <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12">
                            <label>Description:</label>
                            <input type="text" name="training_desc" ngModel >
                        </div> -->
        
                    </div>
                </form>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="save(externalForm)">{{'common.save' | translate}}</button>
        </div>
    </div>
</div>

<clr-modal [(clrModalOpen)]="isCategory" [clrModalClosable]="true">
    <h3 class="modal-title">Add Training Category</h3>
    <div class="modal-body">
      <div class="card">
        <div class="card-block">
          <div class="card-text">
            <form #addMaterialForm="ngForm">
              <div class="modal-body">
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                  <label>Training Category :<span style="color: red">*</span></label>
                  <input type="text" name="training_category" ngModel required >
                </div>
              </div>
            </form>
          </div>
        </div>
        <div class="card-footer">
          <button class="btn btn-success" (click)="saveCategory(addMaterialForm)">Add Training Category</button>
         </div>
      </div>
    </div>
  </clr-modal>
