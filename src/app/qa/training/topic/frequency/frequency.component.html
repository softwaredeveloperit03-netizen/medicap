<div class="container-fluid">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Set Frequency</div>
              <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qa/training" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
              </div>
            </div>
        </div>
        <div class="card-block">
            <div class="card-text">
                <form #externalForm="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12">
                            <label>Employee Level:<sup style="color: red">*</sup></label>
                            <select name="emp_level"   ngModel   required>
                                <option></option>
                                <option>Level 1</option>
                                <option>Level 2</option>
                                <option>Level 3</option>
                              </select>
                        </div>
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12">
                            <label>Frequency : <sup style="color: red">*</sup></label>
                            <select name="frequency" ngModel  required >
                                <option></option>
                                <option value="1">1 Month</option>
                                <option value="2">2 Month</option>
                                <option value="3">3 Month</option>
                                <option value="4">4 Month</option>
                                <option value="5">5 Month</option>
                                <option value="6">6 Month</option>
                                <option value="7">7 Month</option>
                                <option value="8">8 Month</option>
                                <option value="9">9 Month</option>
                                <option value="10">10 Month</option>
                                <option value="11">11 Month</option>
                                <option value="12">12 Month</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12">
                           <br> <button class="btn btn-primary" (click)="save(externalForm)">{{'common.save' | translate}}</button>

                        </div>
                    </div>
                </form>
            </div>
            <div class="card-text">
                <div class="clr-row">

                    <table class="table table-border">
                        <tr>
                            <td style="background-color: aquamarine;font-weight: bolder;text-align: left;">{{'common.table.srNo' | translate}}</td>
                            <td style="background-color: aquamarine;font-weight: bolder;text-align: left;">Emp. Level</td>
                            <td style="background-color: aquamarine;font-weight: bolder;text-align: left;">Frequency</td>
                        </tr>
                        <tr *ngFor="let item of levelData; let i = index;">
                            <td style="font-weight: bolder;text-align: left;">{{i+1}}</td>
                            <td style="font-weight: bolder;text-align: left;">{{item.emp_level}}</td>
                            <td style="font-weight: bolder;text-align: left;">{{item.frequency}} Month</td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn  btn-danger" routerLink="/qa/training"  >{{'common.close' | translate}}</button>
        </div>
    </div>
</div>
