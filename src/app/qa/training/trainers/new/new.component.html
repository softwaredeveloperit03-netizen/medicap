<div class="container-fluid">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Trainers Registration</div>
              <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qa/training/trainers" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
              </div>
            </div>
        </div>
        <div class="card-block">
            <div class="card-text">
                <form #externalForm="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12">
                            <label>Trainer Type:<sup style="color: red">*</sup></label>
                            <select name="trainer_type"  [(ngModel)]="trainer_type"  required>
                                <option></option>
                                <option>Inhouse</option>
                                <option>External</option>
                             </select>
                        </div>

                        <div *ngIf="trainer_type == 'Inhouse'"  class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12">
                            <label>Departments:<sup style="color: red">*</sup></label>
                            <select name="department"   ngModel (change)="getEmployees($event.target.value)" required>
                                <option></option>
                                <option *ngFor="let dept of departments">{{ dept.department_name }}</option>
                            </select>
                        </div>

                        <div *ngIf="trainer_type == 'Inhouse'" class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12">
                            <label>Employee Name :<sup style="color: red">*</sup></label>
                            <select name="trainer_name"  ngModel (change)="getempdetails($event.target.selectedIndex)" required>
                                <option></option>
                                <option *ngFor="let dept of employees"  >{{ dept.firstname }} {{ dept.lastname }}</option>
                              </select>
                        </div>

                        <div *ngIf="trainer_type == 'External'" class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12">
                            <label>Trainer Name:</label>
                            <input type="text" name="trainer_name" ngModel required>
                        </div>
                     
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12">
                            <label>Designation:<sup style="color: red">*</sup></label>
                            <input type="text" name="designation" [(ngModel)]="designation" required>
                        </div>
                        <div *ngIf="trainer_type == 'External'" class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12">
                            <label>Organization:<sup style="color: red">*</sup></label>
                            <input type="text" name="organisation" ngModel required>
                        </div>
                        
                        <div *ngIf="trainer_type == 'External'" class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12">
                            <label>Qualification:</label>
                            <input type="text" name="qualification" ngModel required>
                        </div> 

                        <div *ngIf="trainer_type == 'External'" class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12">
                            <label>Work Experience (In Years):</label>
                            <input type="text" name="experience" ngModel required>
                        </div>

                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12">
                            <label>Contact No.:</label>
                            <input type="text" name="contact_no" [(ngModel)]="contact_no" required>
                        </div>

                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12">
                            <label>Email ID:</label>
                            <input type="text" name="email" [(ngModel)]="email" required>
                        </div>

                        <div *ngIf="trainer_type == 'External'"  class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                            <label>Upload Certificate</label>
                            <input type="file" name="certificate" ngModel (change)="onFileChanged($event)">
                          </div>

                        <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12">

                            <form #skilssForm="ngForm">
                                <table class="table table-border">
                                    <tr>
                                        <td style="background-color: gray;color: white;"><b>Skills & Expertise</b></td>
                                        <td style="background-color: gray;color: white;"><b>{{'common.table.action' | translate}}</b></td>
                                    </tr>
                                    <tr>
                                        <td style="margin: 0;padding: 0;">
                                            <input type="text" name="Skills" ngModel required>
                                        </td>
                                        <td style="margin: 0;padding: 0;">
                                            <button class="btn btn-sm btn-success" (click)="addSkilss(skilssForm)">{{'common.add' | translate}}</button>
                                        </td>
                                    </tr>
                                    <tr *ngFor="let skill of skills_data; let i = index;">
    
                                        <td style="margin: 0;padding: 0;">{{skill.Skills}}</td>
                                        <td style="margin: 0;padding: 0;">
                                            <button class="btn btn-sm btn-danger" (click)="delSkills(i)">Del</button>
                                        </td>
                                    </tr>
                                 </table>
                            </form>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="save(externalForm)">{{'common.save' | translate}}</button>
        </div>
    </div>
</div>
