<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Trainers Master</div>
          <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-success" routerLink="newinhouse" >New Trainer</button>
            <button class="btn btn-sm btn-primary" routerLink="inhouse" >Approval</button>
             <button class="btn btn-sm" routerLink="/qa/training" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>  
    </div>
    <div class="card-block">
        <div class="card-text">
            <div class="clr-row">
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
 
                    <table class="table table-border">
                        <tr>
                            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr. </th>
                             <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Trainer Type</th>
                             <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Trainer Name</th>
                               <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.status' | translate}}</th>
                               <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Entry By</th>
                               <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.table.action' | translate}}</th>
                           </tr>
                         <tr *ngFor="let result of Trainers_data; let i=index">
                            <td style="text-align: left;">{{ i+1 }}</td>
                             <td style="text-align: left;">{{ result.trainer_type}}</td>
                             <td style="text-align: left;">{{ result.trainer_name}}</td>
                            <td style="text-align: left;">{{ result.status }}</td>                      
                            <td style="text-align: left;">{{ result.entry_by }}</td>                      
                            <td style="text-align: left;">
                                <button type="button" class="btn btn-sm btn-success" (click)="view(i)">{{'common.view' | translate}}</button>
                            </td>                      
                        </tr>
                    </table> 
                </div>
            </div>
        </div>
    </div>
</div>



<clr-modal [(clrModalOpen)]="isQuatation" [clrModalSize]="'xl'">
    <h3 class="modal-title">Trainer Details</h3>
    <div class="modal-body">
        
        <div class="clr-row">
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12">
                <label>Trainer Type: </label>
                <input type="text" name="trainer_type" [(ngModel)]="selectedResult['trainer_type']" readonly>
            </div>

            <div *ngIf="selectedResult['trainer_type'] == 'External'" class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12">
                <label>Trainer Name:</label>
                <input type="text" name="trainer_name" [(ngModel)]="selectedResult['trainer_name']" readonly>
            </div>
         
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12">
                <label>Designation: </label>
                <input type="text" name="designation" [(ngModel)]="selectedResult['designation']" readonly>
            </div>
            <div *ngIf="selectedResult['trainer_type'] == 'External'" class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12">
                <label>Orgnization: </label>
                <input type="text" name="organisation" [(ngModel)]="selectedResult['organisation']" readonly>
            </div>
            
            <div *ngIf="selectedResult['trainer_type'] == 'External'" class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12">
                <label>Qualification:</label>
                <input type="text" name="qualification" [(ngModel)]="selectedResult['qualification']" readonly>
            </div> 

            <div *ngIf="selectedResult['trainer_type'] == 'External'" class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12">
                <label>Work Experience (in Years):</label>
                <input type="text" name="experience" [(ngModel)]="selectedResult['experience']" readonly>
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12">
                <label>Contact No.:</label>
                <input type="text" name="contact_no" [(ngModel)]="selectedResult['contact_no']" readonly>
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12">
                <label>Email ID:</label>
                <input type="text" name="email" [(ngModel)]="selectedResult['email']" readonly>
            </div>

            <div *ngIf="selectedResult['trainer_type'] == 'External'"  class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Certificate</label><br>
                <button type="button" class="btn btn-success" (click)="ViewCertificate()">{{'common.view' | translate}}</button>              
            </div>

            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12">
                <table class="table table-border">
                    <tr>
                        <td style="background-color: gray;color: white;text-align:left;"><b>Skills & Expertise</b></td>
                    </tr>
                    <tr *ngFor="let skill of selectedResult['skills_data']; let i = index;">
                        <td style="text-align:left;"> {{skill.Skills}}</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-danger" (click)="isQuatation = false">{{'common.close' | translate}}</button>
    </div>
</clr-modal>
