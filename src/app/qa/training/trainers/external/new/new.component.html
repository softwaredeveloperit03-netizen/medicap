<div class="container-fluid">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">External Trainer Registration</div>
              <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qa/training/trainers/external" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
              </div>
            </div>
        </div>
        <div class="card-block">
            <div class="card-text">
                <form #externalForm="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12">
                            <label>Trainer Name:</label>
                            <input type="text" name="trainer_name" ngModel required>
                        </div>
                        <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12">
                            <label>Organisation Name:</label>
                            <input type="text" name="organisation" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12">
                            <label>Departments:<sup style="color: red">*</sup></label>
                            <select name="department" #dept="ngModel" ngModel (change)="getDesignation(dept)" required>
                                <option></option>
                                <option *ngFor="let dept of departments">{{ dept.department_name }}</option>
                              </select>
                        </div>


                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12">
                            <label>Designation:<sup style="color: red">*</sup></label>
                            <select name="designation" ngModel (change)="getEmployees(dept.value, $event.target.value)" required>
                                <option></option>
                                <option *ngFor="let designation of designations">{{ designation.designation }}</option>
                              </select>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12">
                            <label>Qualification:</label>
                            <select name="qualification" ngModel style="height: 33px;">
                                <option></option>
                                <option *ngFor="let qualification of Qualifications">{{ qualification.qualification }}
                                </option>
                            </select>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12">
                            <label>No. of years Experience:</label>
                            <input type="text" name="experience" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12">
                            <label>Contact No.:</label>
                            <input type="text" name="contact_no" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12">
                            <label>Email ID:</label>
                            <input type="text" name="email" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12">
                            <label>Upload Certificate:</label>
                            <input type="file" name="certificate" ngModel required style="height: auto;" (change)="onFileChanged1($event)" accept="application/pdf">
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12">
                            <label>Upload Resume:</label>
                            <input type="file" name="resume" ngModel required style="height: auto;" (change)="onFileChanged2($event)" accept="application/pdf">
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="save(externalForm)">{{'common.save' | translate}}</button>
        </div>
    </div>
</div>
