<div class="container-fluid" *ngIf="!isNewTraining && !isView">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Identification of Training Needs</div>
              <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qa/training/daily/annoucement" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
              </div>
            </div>
        </div>
        <div class="card-block">
            <div class="card-text">
                <form #trainingForm="ngForm">
                    <div class="clr-row">
                      
                        <div class="clr-col-12">
                            <label>Training Subject:</label>
                            <input type="text" name="subject" ngModel required>
                        </div>
                        <!-- <div class="clr-col-12">
                            <label>Description For Subject:</label>
                            <input type="text" name="reference_document" ngModel required>
                        </div> -->
                        <!-- <div class="clr-col-12">
                            <label>Justification for Training Needs:</label>
                            <textarea name="training_needs" rows="3" ngModel required></textarea>
                        </div> -->
                    </div>
    
                    <table class="table table-border">
                        <thead>
                            <tr>
                                <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Name of Labour</th>
                                <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">labour Code</th>
                                <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Add</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td style="padding: 0px;vertical-align: middle;">
                                    <select name="employee" [(ngModel)]="emp" style="margin:0px;height:auto;" (change)="selectEmp($event.target.selectedIndex)" required>
                                        <option></option>
                                        <option *ngFor="let emp of labours" [value]="emp.labour_no">{{ emp.labour_name }}  - ({{ emp.labour_no }})</option>
                                    </select>
                                </td>
                                 <td>{{ selectedEmp['labour_no'] }}</td>
                                 <td style="padding: 0px;vertical-align: middle;">
                                    <button class="btn btn-sm btn-info" (click)="addEmployees()">{{'common.add' | translate}}</button>
                                </td>
                            </tr>
                            <tr *ngFor="let emp of participants">
                                <td style="text-align: left;">{{ emp.labour_name }}</td>
                                <td style="text-align: left;">{{ emp.labour_no }}</td>
                                <td>#</td>
                            </tr>
                        </tbody>
                    </table>
                    <br>
                    <div class="clr-row">
                        <div class="clr-col-6">
                            <label>Proposed Trainer:</label>
                            <select name="trainer" ngModel required>
                                <option></option>
                                <option *ngFor="let trainer of trainers" [value]="trainer.id">{{ trainer.trainer_name }} ( {{ trainer.trainer_type }} )</option>
                            </select>
                        </div>
                        <div class="clr-col-6">
                            <label>Training Time:</label>
                            <input type="time" name="training_time" ngModel required>
                        </div>
                        
                    </div>
                </form>
            </div>
        </div>
        <div class="card-footer" style="text-align: right;">
            <button class="btn btn-primary" (click)="save(trainingForm)">{{'common.submit' | translate}}</button>
            <button class="btn btn-danger" routerLink="/qa/training/daily/annoucement" >{{'common.close' | translate}}</button>
        </div>
    </div>
</div>
