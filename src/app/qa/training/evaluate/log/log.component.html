<div class="container-fluid">
    <div class="card" *ngIf="!isView">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Induction Training Status Log</div>
              <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qa/training" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
              </div>
            </div>
        </div>
      <div class="card-block">
        <div class="card-text">
             <table class="table table-border">
                <tr>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Tranining No.</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Employees</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Human Resource</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Quality Assurance</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Quality Control</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Production</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Store</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Engineering</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">IT</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Quality Head</th>
                </tr>
  
                <tr *ngFor="let user of trainings; let i = index">
                     <td style="text-align: left;">{{user.tnNo}}</td>
                     <td style="text-align: left;">
                        <ul>
                            <li *ngFor="let item of user.employees; let i = index">  {{ item.firstname }} {{ item.lastname }}</li>
                        </ul>
                     </td>
                    <td style="text-align: left;" > 
                        <button [disabled]="user.admin == 'Done'" *ngIf="user.admin == 'Pending' && user.status == 'TO_HR'" (click)="skipButton('TO_QA','admin',user.tnNo)" class="btn btn-sm btn-danger">Skip</button>
                        <button [disabled]="user.admin == 'Done'" *ngIf="user.admin == 'Pending1' && user.status != 'TO_HR'" (click)="performButton('TO_HR','admin',user.tnNo)" class="btn btn-sm btn-success">Perform</button>
                        <button [disabled]="user.admin == 'Done'" *ngIf="user.admin == 'Done' "   class="btn btn-sm btn-success">Complete</button>
                    </td> 
                    <td style="text-align: left;" > 
                        <button [disabled]="user.qa == 'Done'" *ngIf="user.qa == 'Pending' && user.status == 'TO_QA'" (click)="skipButton('TO_QC','qa',user.tnNo)"  class="btn btn-sm btn-danger">Skip</button>
                        <button [disabled]="user.qa == 'Done'" *ngIf="user.qa == 'Pending1' && user.status != 'TO_QA'" (click)="performButton('TO_QA','qa',user.tnNo)"  class="btn btn-sm btn-success">Perform</button>
                        <button [disabled]="user.qa == 'Done'" *ngIf="user.qa == 'Done'"   class="btn btn-sm btn-success">Complete</button>
                    </td>
                    <td style="text-align: left;" > 
                        <button [disabled]="user.qc == 'Done'" *ngIf="user.qc == 'Pending' && user.status == 'TO_QC'" (click)="skipButton('TO_PROD','qc',user.tnNo)"  class="btn btn-sm btn-danger">Skip</button>
                        <button [disabled]="user.qc == 'Done'" *ngIf="user.qc == 'Pending1' && user.status != 'TO_QC'" (click)="performButton('TO_QC','qc',user.tnNo)"  class="btn btn-sm btn-success">Perform</button>
                        <button [disabled]="user.qc == 'Done'" *ngIf="user.qc == 'Done'"   class="btn btn-sm btn-success">Complete</button>
                    </td>
                    <td style="text-align: left;" > 
                        <button [disabled]="user.production == 'Done'" *ngIf="user.production == 'Pending' && user.status == 'TO_PROD'" (click)="skipButton('TO_STORE','production',user.tnNo)"  class="btn btn-sm btn-danger">Skip</button>
                        <button [disabled]="user.production == 'Done'" *ngIf="user.production == 'Pending1' && user.status != 'TO_PROD'" (click)="performButton('TO_PROD','production',user.tnNo)"  class="btn btn-sm btn-success">Perform</button>
                        <button [disabled]="user.production == 'Done'" *ngIf="user.production == 'Done' "   class="btn btn-sm btn-success">Complete</button>
                    </td>
                    <td style="text-align: left;" > 
                        <button [disabled]="user.store == 'Done'" *ngIf="user.store == 'Pending' && user.status == 'TO_STORE'" (click)="skipButton('TO_ENGG','store',user.tnNo)"  class="btn btn-sm btn-danger">Skip</button>
                        <button [disabled]="user.store == 'Done'" *ngIf="user.store == 'Pending1' && user.status != 'TO_STORE'" (click)="performButton('TO_STORE','store',user.tnNo)"  class="btn btn-sm btn-success">Perform</button>
                        <button [disabled]="user.store == 'Done'" *ngIf="user.store == 'Done' "   class="btn btn-sm btn-success">Complete</button>

                    </td>
                    <td style="text-align: left;" > 
                        <button [disabled]="user.engineering == 'Done'" *ngIf="user.engineering == 'Pending' && user.status == 'TO_ENGG'" (click)="skipButton('TO_IT','engineering',user.tnNo)"  class="btn btn-sm btn-danger">Skip</button>
                        <button [disabled]="user.engineering == 'Done'" *ngIf="user.engineering == 'Pending1' && user.status != 'TO_ENGG'" (click)="performButton('TO_ENGG','engineering',user.tnNo)"  class="btn btn-sm btn-success">Perform</button>
                        <button [disabled]="user.engineering == 'Done'" *ngIf="user.engineering == 'Done' "   class="btn btn-sm btn-success">Complete</button>

                    </td>
                    <td style="text-align: left;" > 
                        <button [disabled]="user.it == 'Done'" *ngIf="user.it == 'Pending' && user.status == 'TO_IT'" (click)="skipButton('TO_QHEAD','it',user.tnNo)"  class="btn btn-sm btn-danger">Skip</button>
                        <button [disabled]="user.it == 'Done'" *ngIf="user.it == 'Pending1' && user.status != 'TO_IT'" (click)="performButton('TO_IT','it',user.tnNo)"  class="btn btn-sm btn-success">Perform</button>
                        <button [disabled]="user.it == 'Done'" *ngIf="user.it == 'Done'"   class="btn btn-sm btn-success">Complete</button>
                    </td>
                    <td style="text-align: left;" > 
                         <button *ngIf="user.quality_head == 'Pending1' && user.status != 'TO_QHEAD'" (click)="skipButton('TO_QHEAD','quality_head',user.tnNo)"  class="btn btn-sm btn-success">Perform</button>
                    </td>
                  
                     
                </tr>
            </table>
        </div>
 

      </div>
    </div>
