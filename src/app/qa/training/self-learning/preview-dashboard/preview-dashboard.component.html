<div class="module">
    <div class="subdiv">
        <div class="test-timer">
            <div class="timer-display">
                {{ formatTime(remainingTime) }}
            </div>
            <div class="controls">
                <button (click)="startTimer()" class="btn btn-success btn-sm" [disabled]="isTimerRunning">Start</button>
                <button class="btn btn-success btn-sm" *ngIf="isTimeDeviationAllowed" (click)="stopTimer()">Stop</button>
            </div>
        </div>
        <div class="purchase-container">
            <div style="text-align:end" class="close-block">
                <div routerLink="/employee-dashboard/training/self_learning" class="name-board1"><i class="fas fa-times"></i>
                </div>
            </div>
            <div class="master-block">
                <div class="section">
                    <div class="pdf-view-container">
                        <app-preview [pdfUrl]="currentPdfUrl"></app-preview>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
