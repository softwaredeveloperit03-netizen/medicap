<!---Content Master - DashBoard -->

<div class="card" *ngIf="!isView">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Content Master Log</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-success" (click)="isView = true">NEW </button>
          <button class="btn btn-sm btn-danger" routerLink="/qa/training">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">


      <div class="clr-row">
        <div class="clr-col-lg-5">
          <label>Search </label>
          <input type="text" placeholder="Search..."   [(ngModel)]="searchQuery">
         </div>
      </div>

      <clr-datagrid [clrDgLoading]="loading" [clrDgFilter]="searchQuery">
      
         <clr-dg-column>{{'common.table.srNo' | translate}}</clr-dg-column>
         <clr-dg-column>{{'common.department' | translate}}</clr-dg-column>
          <clr-dg-column>Name of Document</clr-dg-column>
          <clr-dg-column>Entry By</clr-dg-column>
         <clr-dg-column>Entry Date</clr-dg-column>
         <clr-dg-column  >View</clr-dg-column>

        <clr-dg-row *ngFor="let item of filteredMaterials; let i = index" [clrDgItem]="result">
          <clr-dg-cell>{{i+1}}</clr-dg-cell>
          <clr-dg-cell>{{item.department_name}}</clr-dg-cell>
           <clr-dg-cell>{{item.document_name}}</clr-dg-cell>
            <clr-dg-cell>{{item.entry_by}}</clr-dg-cell>
          <clr-dg-cell>{{item.entry_date | date: 'dd-MM-yyyy'}}</clr-dg-cell>
          <clr-dg-cell>
            <button class="btn btn-sm btn-info" (click)="viewDoc(item.upload)">{{'common.view' | translate}}</button>
          </clr-dg-cell>
        </clr-dg-row>
      </clr-datagrid>
 
    </div>
    <div class="card-footer">
    </div>
  </div>




  <!---Content Master - DashBoard -->
  <div class="card"  *ngIf="isView">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Content Master Entry
          Form
        </div>
        <div class="clr-col-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" (click)="isView = false" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>

    <div class="card-block">
      <div class="card-text">
        <form #doc_management="ngForm">
          <div class="clr-row">
            
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <label>Department:</label>
                  <select name="department_name" ngModel required>
                      <option></option>
                      <option *ngFor="let department of departments; let i = index">{{ department.department_name }}</option>
                  </select>
              </div>

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label> Document Type:</label>
                <select name="document_type" ngModel required>
                  <option></option>
                  <option>SOP</option>
                  <option>Protocol</option>
                  <option>Formats</option>
                  <option>Flow Chart</option>
                  <option>Master Validation Plan</option>
                  <option>Site Master File</option>
                  <option>Layout And Diagram</option>
                  <option>Others</option>
                </select>                  
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <label>Name of Document:</label>
                  <input type="text" name="document_name" ngModel required>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <label>Document No:</label>
                  <input type="text" name="document_no" ngModel required>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <label>Document Version:</label>
                  <input type="text" name="document_version" ngModel required>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <label>Effective Date:</label>
                  <input type="date" name="effective_date" ngModel required>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <label>Next Review Date:</label>
                  <input type="date" name="next_review_date" ngModel required>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Upload Copy:</label>
                <input type="file" name="document" ngModel (change)="onFileChanged($event)" accept="application/pdf">
            </div>
        
            
          </div>
        </form>
      </div>
  </div>
  <div class="card-footer">
      <button class="btn btn-primary" (click)="saveForm(doc_management)">{{'common.submit' | translate}}</button>
   
  </div>


  </div>
