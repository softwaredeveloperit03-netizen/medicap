<div class="pdf-container">
    <!-- <ul class="pagination-list"> -->
      <!-- <li *ngFor="let visiblePage of visiblePages">
        <a (click)="goToPage(visiblePage)">{{ visiblePage }}</a>
      </li> -->
  
    <!-- </ul> -->
    <div class="pagination">
      <button class="btn btn-success btn-sm" (click)="previousPage()" [disabled]="page === 1">Previous</button>
        <clr-dropdown>
          <button clrDropdownTrigger class="btn btn-success btn-sm" aria-haspopup="true">
            {{ currentPage }}
            <clr-icon shape="caret down"></clr-icon>
          </button>
          <clr-dropdown-menu *clrIfOpen>
            <a clrDropdownItem *ngFor="let visiblePage of visiblePages" (click)="goToPage(visiblePage)">Goto {{ visiblePage }}</a>
          </clr-dropdown-menu>
        </clr-dropdown>
   
      <button class="btn btn-success btn-sm" (click)="nextPage()" [disabled]="page === totalPages">Next</button>
      <p>Page {{ page }} / {{ totalPages }}</p>
    </div>
    <div class="pdf-page">
      <pdf-viewer [(page)]="page" [src]="urlPath" [render-text]="true" 
        (after-load-complete)="afterLoadComplete($event)"></pdf-viewer>
        <!-- [show-all]="false" -->
    </div>
    <!-- <div class="pdf-page"  *ngIf="urlPath">
      <iframe [src]="urlPath" style="width: 100%; height: 600px;"></iframe>
    </div> -->
  </div>
