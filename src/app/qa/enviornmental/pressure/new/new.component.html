<div class="card"*ngIf="!isView">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Pressure Differential Record</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/qa/enviornmental/pressure" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
    <div class="card-block">
        <div class="card-text">
            <table class="table">
                <tr>
                    <th style="text-align: left;">Sr</th>
                     <th style="text-align: left;">{{'common.department' | translate}}</th>
                     <th style="text-align: left;">Room Name</th>
                     <th style="text-align: left;">{{'common.status' | translate}}</th>
                     
                     <th style="text-align: left;">{{'common.table.action' | translate}}</th>
                </tr>
                <tr *ngFor="let result of results;let i=index" >
                    <td style="text-align:left">{{i+1}}</td>
                    <td style="text-align:left">{{result.department}}</td>
                    <td style="text-align:left">{{result.section_name}}</td>
                    <td style="text-align:left">{{result.status}}</td>
                     <td style="text-align:left"><button class="btn btn-sm btn-info"(click)="proceed(i)">Proceed</button></td>
                </tr>
            </table>
        </div>
    </div>
</div>



<div class="card"*ngIf="isView">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Pressure Differential Record</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm"(click)="isView=false" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
    <div class="card-block">
        <div class="card-text">
            <form #pressure="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                        <label>Department:</label>
                        <input type="text" name="department" [ngModel]="selectedResults['department']" readonly tabindex="-1">
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                        <label>Room Number:</label>
                        <input type="text" name="section_code"  [ngModel]="selectedResults['section_code']" readonly tabindex="-1">
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                        <label>Room Name:</label>
                        <input type="text" name="section_name"  [ngModel]="selectedResults['section_name']" readonly tabindex="-1">
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                        <h4>Pressure Differential:</h4> 
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                        <label>Lower Limit:</label>
                        <input type="text" name="lower_limit" ngModel required>
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                        <label>Upper Limit:</label>
                        <input type="text" name="upper_limit" ngModel required>
                    </div>
                </div>
            </form> 
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="save(pressure)">{{'common.submit' | translate}}</button>
    </div>
</div>
