<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Pending Areas For Temperature Range</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/qa/enviornmental/temperature" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #temperatureForm="ngForm">
          <div class="clr-row">
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-5 clr-col-xs-5">
              <label><strong>Department:<span style="color: red">*</span></strong></label>
              <select name="department" ngModel required (change)="getSections($event.target.selectedIndex)">
                <option *ngFor="let dept of departments" [value]="dept.department_name">{{ dept.department_name }}</option>
              </select>
            </div>
             <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Room Name:<span style="color: red">*</span></strong></label>
              <select name="section" ngModel required>
                <option *ngFor="let sect of sections" [value]="sect.section_code">{{ sect.section_name }}</option>
              </select>
            </div>
            <div class="clr-col-md-3 clr-col-sm-3 clr-col-sm-3 clr-col-lg-3">
              <label><strong>Min Temperature</strong></label>
              <input type="text" name="min_temp" ngModel required>
            </div>
            <div class="clr-col-md-3 clr-col-sm-3 clr-col-sm-3 clr-col-lg-3">
              <label><strong>Maximum Temperture</strong></label>
              <input type="text" name="max_temp" ngModel required>
            </div>
            <div class="clr-col-md-3 clr-col-sm-3 clr-col-sm-3 clr-col-lg-3">
              <label><strong>Minimum Humidity</strong></label>
              <input type="text" name="min_humidity" ngModel required>

            </div>
            <div class="clr-col-md-3 clr-col-sm-3 clr-col-sm-3 clr-col-lg-3">
              <label><strong>Maximum Humidity</strong></label>
              <input type="text" name="max_humidity" ngModel required>
            </div>
          </div>
        </form>
      </div>
    </div>
  
    <div class="card-footer">
      <button class="btn btn-primary" (click)="save(temperatureForm)">{{'common.save' | translate}}</button>
    </div>
</div>
