<div class="container-fluid">
    <div class="card">
        <div class="card-header">New Temperature Humidity Form</div>
        <div class="card-block">
            <div class="card-text">
                <form #NewForm="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12" style="padding: 20px;">
                            <label><strong>Room Name</strong></label>
                            <select name="section" ngModel required>
                            <option *ngFor="let sect of sections" [value]="sect.section_name">{{ sect.section_name }}</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-6 clr-col-sm-12 clr-col-md-6 clr-col-sm-12"style="padding: 20px;">
                            <label><strong>Temperature</strong></label>
                            <input type="text" name="temp" ngModel required>
                        </div>
                        <div class="clr-col-md-12 clr-col-sm-12 clr-col-sm-12 clr-col-lg-12" style="padding: 20px;">
                            <label><strong>Humidity</strong></label>
                            <input type="text" name="humidity" ngModel required>
                        </div>
                    </div>   
                </form>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="save(NewForm)">{{'common.save' | translate}}</button>
          </div>
    </div>
</div>

<div class="container-fluid">
    <div class="card">
        <div class="card-header">Temparature Humidity Log</div>
        <div class="card-block">
            <div class="card-text">
                <div class="clr-row">
                    <table class="table">
                        <tr>
                            <th>{{'common.date' | translate}}</th>
                            <th>Entry By</th>
                            <th>Room Name</th>
                            <th>Temperature</th>
                            <th>Humidity</th>
                            <th>{{'common.status' | translate}}</th>
                        </tr>
                        <tr *ngFor="let result of results; let i=index" >
                            <td>{{result.entry_date}}</td>
                            <td>{{ result.entry_by}}</td>
                            <td>{{result.section}}</td>
                            <td>{{result.temp}}</td>
                            <td>{{result.humidity}}</td>
                            <td>{{result.status}}</td>
                        </tr>   
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
