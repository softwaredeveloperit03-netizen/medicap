<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Qualification & Certified Document</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qa/personal" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block"> 
        <form #newForm="ngForm">        
            <div class="card">
                <div class="card-header" style="text-align: left; color: black; background-color: rgb(221, 96, 96);">Personal Details </div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Department:<sup style="color: red">*</sup></strong></label>
                            <select name="dept" [(ngModel)]="department" (change)="getEmployees($event.target.value)" readonly>
                                <option></option>
                                <option *ngFor="let dept of departments">{{ dept.department_name }}</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Full Name :<sup style="color: red">*</sup></strong></label>
                            <select name="emp_name" [(ngModel)]="emp"  (change)="selectEmp($event.target.selectedIndex)" readonly>
                                <option></option>
                                <option *ngFor="let emp of employees" [value]="emp.emp_id">{{ emp.firstname }} {{ emp.lastname }}</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Employee ID:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="emp_id" [(ngModel)]="empId" readonly>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>DOB:<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="dob" [(ngModel)]="birthdate" readonly>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Phone No.:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="mo_no" [(ngModel)]="contact_no" readonly>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Email:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="email" [(ngModel)]="emp_email" readonly>
                        </div>
                    </div>
                </div>
                <div class="card-header" style="text-align: left; color: white; background-color: rgb(154, 107, 230);"> Qualification Details</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Qualification Title:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="q_title" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Certificated Number(If Applicable):<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="c_number" ngModel>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Date Of Qualification:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="date_quali" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Issuing Authority:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="isue_authority" ngModel >
                        </div>
                        <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Qualification Description:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="q_description" ngModel>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Qualification Validity Period:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="validity" ngModel>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Renewal Requirement (If Applicable):<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="renewal" ngModel>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Skills & competencies:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="skills" ngModel>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Qualification Documentation:<sup style="color: red">*</sup></strong></label>
                            <input type="file" name="q_document" ngModel (change)="onFileChanged3($event)" required>
                        </div>
                    </div>
                </div>
                <div class="card-header" style="text-align: left; color: black; background-color: rgb(216, 230, 107);"> Certificate Issued By</div>
                <div class="card-block">
                 <div class="clr-row">
                    <div class="clr-col-lg-4 clr-col-md- clr-col-sm-12 clr-col-xs-12">
                        <label>Organization Department Name:<span style="color: red;">*</span></label>
                        <input type="text" name="org_name" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md- clr-col-sm-12 clr-col-xs-12">
                        <label>Signature of Issuing Authority<span style="color: red;">*</span></label>
                        <input type="text" name="sign_authority" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md- clr-col-sm-12 clr-col-xs-12">
                        <label>Date Of Issuance :<span style="color: red;">*</span></label>
                        <input type="date" name="date_issuance" ngModel required>
                    </div>
                 </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left;color: black; background-color: rgb(14, 163, 212);">Review & Approval</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Prepared By:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="prepared_by" ngModel>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Prepared Date:<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="prepared_date" ngModel>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Reviewed By:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="review_by" ngModel>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Reviewed Date:<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="review_date" ngModel>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="save(newForm)">{{'common.save' | translate}}</button>    
        </div>
</div>
