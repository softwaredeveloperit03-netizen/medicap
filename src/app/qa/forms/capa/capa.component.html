<div class="container-fluid">
    <div class="card">
        <div class="card-header">Corrective Action / Preventive Action Form</div>
        <div class="card-block">
            <div class="card-text">
                <form #dataForm="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>CAPA No.:</label>
                            <input type="text" name="capa_no" ngModel>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Request By:</label>
                            <input type="text" name="capa_no" ngModel="{{ request_by }}">
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Date:</label>
                            <input type="date" name="request_date" ngModel="{{ request_date }}">
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Related Department:</label>
                            <select name="department" ngModel required>
                                <option></option>
                                <option *ngFor="let department of departments">{{ department.department_name }}</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>CAPA required in-System</label>
                            <select name="capa_required" ngModel required>
                                <option>Process</option>
                                <option>Documents</option>
                                <option>Equipment</option>
                                <option>vendor</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Category:</label>
                            <select name="category" ngModel required>
                                <option>Temporary</option>
                                <option>Permanent</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                            <label>Details of Incident/Non conformity/Deviation/Market Complaint:</label>
                            <textarea rows="3" name="details" ngModel required></textarea>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="saveCAPA(dataForm)">{{'common.submit' | translate}}</button>
        </div>
    </div>
</div>
