<div class="container">
    <div class="row">
      <div class="collg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="card">
          <div class="card-header">Deviation Form</div>
          <div class="card-block">
            <div class="card-text">
              <form #deviationUserForm="ngForm">
                    <div class="form-group row">
                      <div class="col-lg-8 col-md-12 col-sm-12 col-xs-12">
                        <label><strong>Deviation No:</strong></label>
                        <input type="text" name="chn_ctrl_no" [ngModel]="report_no" readonly="true" required>
                      </div>
                      <div class="col-lg-4 col-md-12 col-sm-12 col-xs-12">
                        <label><strong>Received Date:</strong></label>
                        <input type="date" name="received_date" [ngModel]="reporting_date" [max]="reporting_date" required>
                      </div>
                      <input type="hidden" name="reporting_date" [ngModel]="reporting_date" required>
                    </div>
                    <div class="form-group row">
                      <div class="col-lg-8 col-md-12 col-sm-12 col-xs-12">
                        <label><strong>Name of Product:</strong></label>
                        <input type="text" name="product_name" ngModel required>
                      </div>
                      <div class="col-lg-4 col-md-12 col-sm-12 col-xs-12">
                        <label><strong>Mfg. Date:</strong></label>
                        <input type="date" name="mfg_date" [max]="reporting_date" ngModel required>
                      </div>
                    </div>
                    <div class="form-group row">
                      <div class="col-lg-8 col-md-12 col-sm-12 col-xs-12">
                        <label><strong>Medicap Lot No:</strong></label>
                        <input type="text" name="batch_no" ngModel required>
                      </div>
                      <div class="col-lg-4 col-md-12 col-sm-12 col-xs-12">
                        <label><strong>Exp. Date:</strong></label>
                        <input type="date" name="exp_date" ngModel [min]="reporting_date" required>
                      </div>
                    </div>
                    <div class="form-group row">
                      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                          <fieldset style="border: solid; border-width: thin; border-color: #a8a8a8;">
                              <legend style="width:auto; margin-bottom: 0px; font-size: 12px; font-weight: bold; color: #1f497d;">Deviation Detail:</legend>
                        <div class="form-group row">
                          <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                            <label><strong>The system should be under hold for QA decision:</strong></label>
                            <div style="margin-right: 20px; margin-left: 20px;">
                            <div class="clr-radio-wrapper">
                              <input type="radio" id="vertical-radio3" name="qa_decision" ngModel value="Recommended" class="clr-radio">
                              <label for="vertical-radio3" class="clr-control-label">Yes</label>
                            </div>
                            <div class="clr-radio-wrapper">
                              <input type="radio" id="vertical-radio4" name="qa_decision" ngModel value="Not Recommended" class="clr-radio">
                              <label for="vertical-radio4" class="clr-control-label">No</label>
                            </div>
                          </div>
                          </div>
                        </div>
                      </fieldset>
                      </div>
                    </div>
              </form>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn btn-primary" (click)="deviationUserForm.form.valid">SUBMIT & SEND FOR APPROVAL</button>
          </div>
        </div>
      </div>
    </div>
  </div>
