 <div class="container-fluid">
   <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">GMP Monitoring Memo</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/qa/monitoring" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
     <div class="card-block">
       <div class="card-text">
         <form [formGroup]="reactiveForm">
           <div class="clr-row">

             <div class="clr-col-12 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
               <label>{{'common.department' | translate}}</label>
               <select (change)="getSection()" formControlName="department">
                <option *ngFor="let dpt of departments" [value]="dpt.department_name">{{ dpt.department_name }}</option>
               </select>
             </div>

             <div class="clr-col-12 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
               <label>Area</label>
               <input type="text" formControlName="area"/>
             </div>

             <div class="clr-col-12 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Room Name</label>
              <select formControlName="section">
               <option *ngFor="let item of sections" [value]="item.section_name">{{ item.section_name }}</option>
             </select>
             </div>

             <div class="clr-col-12 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
               <label>Employee Name</label>
               <select (change)="onEmployeeChange($event.target.value)" formControlName="employee">
                <option *ngFor="let item of employees; let i = index" [value]="i">{{ item.emp_name }}</option>
               </select>
             </div>

             <div class="clr-col-12 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
               <label>{{'common.designation' | translate}}</label>
               <input type="text" formControlName="designation" />
             </div>

             <div class="clr-col-12 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
               <label>Shift</label>
               <input type="text" formControlName="shift"/>
             </div>

             <div class="clr-col-12 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Repeated Failure</label>
              <clr-radio-wrapper>
                <input type="radio" clrRadio value="yes" formControlName="repeated_failure" />
                <label>Yes</label>
              </clr-radio-wrapper>
              <clr-radio-wrapper>
                <input type="radio" clrRadio value="no" formControlName="repeated_failure" />
                <label>No</label>
              </clr-radio-wrapper>
             </div>

             <div class="clr-col-12 clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>Description of Failure</label>
            </div>

            <div class="clr-col-12 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Title</label>
              <input type="text" formControlName="failure_title"/>
            </div>

            <div class="clr-col-12 clr-col-lg-8 clr-col-md-8 clr-col-sm-12 clr-col-xs-12">
              <label>{{'common.description' | translate}}</label>
              <input type="text" formControlName="failure_description"/>
            </div>

            <div class="clr-col-12 clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>Remark for Improvement</label>
              <input type="text" formControlName="remark"/>
            </div>

           </div>
         </form>
       </div>
     </div>

     <div class="card-footer">
       <button class="btn btn-primary" (click)="submit()">{{'common.submit' | translate}}</button>
       <button class="btn btn-danger" (click)="close()">{{'common.close' | translate}}</button>
     </div>
   </div>
 </div>
