<div class="container-fluid">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">GMP Monitoring Report</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/qa/monitoring" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">

        <clr-datagrid>
          <clr-dg-column>Sr No</clr-dg-column>
          <clr-dg-column>Checkpoint</clr-dg-column>
          <clr-dg-column>Observations</clr-dg-column>
          <clr-dg-column>{{'common.table.remark' | translate}}</clr-dg-column>
          <clr-dg-column>Informed to</clr-dg-column>
          <clr-dg-column>Comment</clr-dg-column>
          <clr-dg-column>{{'common.status' | translate}}</clr-dg-column>

          <clr-dg-row *ngFor="let item of checkLists; let i = index;">
            <clr-dg-cell>{{ i + 1 }}</clr-dg-cell>
            <clr-dg-cell>{{ item.checkpoint }}</clr-dg-cell>
            <clr-dg-cell>{{ item.observation }}</clr-dg-cell>
            <clr-dg-cell>{{ item.remark }}</clr-dg-cell>
            <clr-dg-cell>{{ item.informed_to }}</clr-dg-cell>
            <clr-dg-cell>{{ item.comment }}</clr-dg-cell>
            <clr-dg-cell>{{ item.status }}</clr-dg-cell>
          </clr-dg-row>

        </clr-datagrid>

      </div>
    </div>
  </div>
</div>
