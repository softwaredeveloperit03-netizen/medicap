<div class="container-fluid">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">GMP Monitoring Compliance</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/qa/monitoring" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form [formGroup]="reactiveForm">
          <div class="clr-row">

            <div class="clr-col-12 clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
             <label><strong>Department: </strong></label>
             <select (change)="getSection()" formControlName="department">
               <option *ngFor="let dpt of departments" [value]="dpt.department_name">{{ dpt.department_name }}</option>
             </select>
            </div>

            <div class="clr-col-12 clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
              <label>Room Name</label>
              <select (change)="getGMPMonitoringChecklist()" formControlName="section">
               <option *ngFor="let item of sections" [value]="item.section_name">{{ item.section_name }}</option>
             </select>
            </div>

          </div>
        </form>

        <clr-datagrid>
          <clr-dg-column>Sr No</clr-dg-column>
          <clr-dg-column>Checkpoint</clr-dg-column>
          <clr-dg-column>Observations</clr-dg-column>
          <clr-dg-column>{{'common.table.remark' | translate}}</clr-dg-column>
          <clr-dg-column>Informed to</clr-dg-column>
          <clr-dg-column>Comment</clr-dg-column>
          <clr-dg-column>Add</clr-dg-column>

          <clr-dg-row *ngFor="let item of checkLists; let i = index;">
            <clr-dg-cell>{{ i + 1 }}</clr-dg-cell>
            <clr-dg-cell>{{ item.checkpoint }}</clr-dg-cell>

            <clr-dg-cell>
              <input type="text" [(ngModel)]="observations[i]" [value]="item.observation" style="margin: 0px; height: 25px;">
            </clr-dg-cell>

            <clr-dg-cell>
              <input type="text" [(ngModel)]="remark[i]" [value]="item.remark" style="margin: 0px; height: 25px;">
            </clr-dg-cell>

            <clr-dg-cell>
              <select [(ngModel)]="informed_to[i]" [value]="item.informed_to" style="margin: 0px; min-width: 130px; height: 25px;">
                <option *ngFor="let item of employees" [value]="item.emp_id">{{ item.emp_name }}</option>
              </select>
            </clr-dg-cell>

            <clr-dg-cell>
              <input type="text" [(ngModel)]="comment[i]" [value]="item.comment" style="margin: 0px; height: 25px;">
            </clr-dg-cell>

            <clr-dg-cell>
              <button class="btn btn-sm btn-info" (click)="add(i)">{{'common.add' | translate}}</button>
            </clr-dg-cell>
          </clr-dg-row>

        </clr-datagrid>

      </div>
    </div>
  </div>
</div>
