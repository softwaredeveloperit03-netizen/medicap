<div class="component qa-legacy-dash">
  <div class="subsection">
    <div class="purchase-block" >
      <div style="text-align:end" class="exit-section">
        <div class="header-block" style="margin:10px 0px">
          <h3>Risk Management </h3>
        <div routerLink="/qa" class="name-board2"><i class="fas fa-times"></i>
        </div>
      </div>

      <div class="main-section" style="margin: 0px 10px 10px 10px !important;">
        <div class="category">
          <div class="line-section">
            <div class="header-div">
              <h3>Risk Management Section</h3>
            </div>
          </div>
          <div class="block-container"  style="    
          display: grid;
          grid-template-columns: repeat(6, 150px);
          grid-gap: 35px;
          overflow-x: auto;
          max-width: 100%;">
            <div class="item-block" routerLink="identification">
              <i class="fas fa-id-card"></i>
              <span>Risk Identification</span>
            </div>
            
            <div class="item-block" routerLink="assessment">
              <i class="fas fa-chart-line"></i>
              <span>Risk Assessment</span>
            </div>
            
            <div class="item-block" routerLink="analysis">
              <i class="fas fa-chart-bar"></i>
              <span>Risk Analysis</span>
            </div>
            
            <div class="item-block" routerLink="evaluation">
              <i class="fas fa-clipboard-check"></i>
              <span>Risk Evaluation</span>
            </div>
            
            <div class="item-block" routerLink="control">
              <i class="fas fa-shield-alt"></i>
              <span>Risk Control</span>
            </div>
            
            <div class="item-block" *ngIf="qms_approver=='Yes'" routerLink="review">
              <i class="fas fa-search"></i>
              <span>Risk Review</span>
            </div>
            
            <div class="item-block" *ngIf="qms_approver=='Yes'" routerLink="approval">
              <i class="fas fa-clipboard-check"></i>
              <span>Close Risk Review</span>
            </div>
            
            <div class="item-block" routerLink="depreview">
              <i class="fas fa-wrench"></i>
              <span>Send For </span>
                <span>Department Review</span>
            </div>
            
            <div class="item-block" routerLink="log">
              <i class="fas fa-book"></i>
              <span>Risk Log</span>
            </div>
            

          
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
