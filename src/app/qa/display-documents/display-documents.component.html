<div class="card display-docs-card">
  <div class="card-header">
    <div class="card-header-row">
      <div class="card-title-block">
        <div class="icon-wrap" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
          <i class="fas fa-folder-open"></i>
        </div>
        <h2>Display Documents</h2>
      </div>
      <button class="btn btn-sm btn-danger" routerLink="/qa">{{'common.close' | translate}}</button>
    </div>
  </div>
  <div class="card-block">
    <clr-tabs>
      <clr-tab-link [clrTabLinkActive]="activeTab === 'upload'" (click)="setTab('upload')">Document Upload</clr-tab-link>
      <clr-tab-link [clrTabLinkActive]="activeTab === 'log'" (click)="setTab('log')">Log</clr-tab-link>

      <clr-tab-content [clrTabContentActive]="activeTab === 'upload'">
        <div class="tab-upload">
          <button type="button" class="btn btn-primary" (click)="openNewForm()" *ngIf="!showNewForm">
            <i class="fas fa-plus"></i> New
          </button>

          <div class="upload-form-wrap" *ngIf="showNewForm">
            <h4>New Document Upload</h4>
            <form #f="ngForm" class="clr-form">
              <div class="clr-form-control">
                <label class="clr-control-label">Document Name <span class="required">*</span></label>
                <input type="text" class="clr-input" [(ngModel)]="form.documentName" name="documentName" required placeholder="Document Name">
              </div>
              <div class="clr-form-control">
                <label class="clr-control-label">Document No <span class="required">*</span></label>
                <input type="text" class="clr-input" [(ngModel)]="form.documentNo" name="documentNo" required placeholder="Document No">
              </div>
              <div class="clr-form-control">
                <label class="clr-control-label">Effective Date</label>
                <input type="date" class="clr-input" [(ngModel)]="form.effectiveDate" name="effectiveDate">
              </div>
              <div class="clr-form-control">
                <label class="clr-control-label">Version No</label>
                <input type="text" class="clr-input" [(ngModel)]="form.versionNo" name="versionNo" placeholder="e.g. 1.0">
              </div>
              <div class="clr-form-control">
                <label class="clr-control-label">Upload (Multiple files)</label>
                <input type="file" class="clr-input" multiple (change)="onFileSelect($event)" accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg">
                <div class="file-list" *ngIf="selectedFiles.length">
                  <span class="file-item" *ngFor="let f of selectedFiles; let i = index">
                    {{ f.name }} <button type="button" class="btn btn-sm btn-link remove-file" (click)="removeFile(i)"><i class="fas fa-times"></i></button>
                  </span>
                </div>
              </div>
              <div class="form-actions">
                <button type="button" class="btn btn-primary" (click)="uploadDocuments()">
                  <i class="fas fa-upload"></i> Upload
                </button>
                <button type="button" class="btn btn-outline" (click)="cancelNewForm()">{{'common.cancel' | translate}}</button>
              </div>
            </form>
          </div>
        </div>
      </clr-tab-content>

      <clr-tab-content [clrTabContentActive]="activeTab === 'log'">
        <div class="tab-log">
          <div class="table-wrapper">
            <table class="table table-compact docs-log-table">
              <thead>
                <tr>
                  <th>Sr No</th>
                  <th>Document Name</th>
                  <th>Document No</th>
                  <th>Effective Date</th>
                  <th>Version No</th>
                  <th>View Document</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let row of logList">
                  <td>{{ row.srNo }}</td>
                  <td>{{ row.documentName }}</td>
                  <td>{{ row.documentNo }}</td>
                  <td>{{ row.effectiveDate }}</td>
                  <td>{{ row.versionNo }}</td>
                  <td>
                    <button type="button" class="btn btn-sm btn-primary" (click)="viewDocument(row)" [disabled]="!row.filePath">
                      <i class="fas fa-eye"></i> View
                    </button>
                  </td>
                </tr>
                <tr *ngIf="!logList.length">
                  <td colspan="6" class="text-center">No documents in log.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </clr-tab-content>
    </clr-tabs>
  </div>
</div>
