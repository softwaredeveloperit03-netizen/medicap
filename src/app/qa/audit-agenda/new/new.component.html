<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Vendor Agenda</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/qa/audit-agenda" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #vendor = "ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-6">
                        <label>Name Of Vandor</label>
                        <select name="vendor_no" ngModel required>
                            <option></option>
                            <option *ngFor="let res of vendors" [value]="res.vendor_no">{{ res.vendor_name }}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-6">
                        <label>{{'common.address' | translate}}</label>
                        <input type="text" name="address" ngModel required>
                    </div>
                    <div class="clr-col-lg-4">
                        <label>Tentitive Audit From Date:</label>
                        <input type="date" name="from_date" ngModel required>
                    </div>
                    <div class="clr-col-lg-4">
                        <label>Tentitive Audit To Date:</label>
                        <input type="date" name="to_date" ngModel required>
                    </div>
                    <div class="clr-col-lg-4">
                        <label>Audit For</label>
                        <select name="audit for" ngModel required>
                            <option></option>
                            <option>General Vendor Approval</option>
                            <option>Product Material Specific</option>
                            <option>Investigation Audit</option>
                            <option>Compliences Audit</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-6">
                        <label>Auditors:</label>
                        <select name="emp_id" ngModel required>
                            <option></option>
                            <option *ngFor="let emp of person" [value]="emp.emp_id">{{ emp.firstname }}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-6">
                        <label>Auditors Role:</label>
                        <input type="text" name="audit_role" ngModel required>
                    </div>
                    <!-- <form #auditor="ngForm">
                        <div class="clr-col-lg-12">
                            <table class="table">
                                <tr>
                                    <th>Auditors Role</th>
                                    <th>Add</th>
                                </tr>
                                <tr>
                                    <td><input type="text" name="audit_role" ngModel required></td>
                                    <td><Button class="btn btn-info" (click)="add(auditor)">{{'common.add' | translate}}</button></td>
                                </tr>
                                <tr *ngFor="let res of roleList">
                                    <td>{{ res.audit_role }}</td>
                                    <td>#</td>
                                </tr>
                            </table>
                        </div>
                    </form> -->
                </div>
            </form>  
        </div>
    </div>
    <div class="card-block">
        <button class="btn btn-primary">{{'common.save' | translate}}</button>
        <!-- <button class="btn btn-primary">Send To Vendor</button> -->
    </div>
</div>
