<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Extension Of Change Control</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qa/ccpermanant" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <form #newForm="ngForm">    
        <div class="card-text">
            <h4>Change Control Details</h4>
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Change Control ID:<span style="color: red;">*</span></label>
                            <input type="text" name="changeId" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Change Title:<span style="color: red;">*</span></label>
                            <input type="text" name="changeTitle" ngModel>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Current End Date:<span style="color: red;">*</span></label>
                            <input type="date" name="currentEndDate" ngModel>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Reason For Extension:<span style="color: red;">*</span></label>
                            <select type="text" name="extReason" ngModel>
                                <option></option>
                                <option>Unforeseen Delays</option>
                                <option>Scope Expansion</option>
                            </select>
                        </div>
                    </div>
            <div class="card">
                <div class="card-header" style="text-align: left; color: black; background-color: lightgreen;">Extension Details </div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Requested Extension End Date:<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="extEndDate" ngModel>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Summary Of Changes Due Extension:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="changeSummary" ngModel>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left;color: black; background-color: rgb(14, 163, 212);"> Review & Approval </div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Requesting Officer:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="requestOfficer" ngModel>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Reviewing Officer:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="reviewing_officer" ngModel>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Review Date:<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="reviewDate" ngModel>
                        </div>
                        <!-- <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Approval Status:<sup style="color: red">*</sup></strong></label>
                            <select type="text" name="approval_status" ngModel>
                                <option></option>
                                <option>{{'common.approved' | translate}}</option>
                                <option>{{'common.rejected' | translate}}</option>
                            </select>
                        </div> -->
                    </div>
                </div>
            </div>
            <div class="card">
            <div class="card-text">
                <div class="card-header" style="text-align: left;color: black; background-color: rgb(212, 14, 106);"> Documentation </div>
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Revised Change Control Document :<span style="color: red;">*</span></label>
                            <input type="file" name="changeControl" ngModel (change)="onFileChanged3($event)">
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Reviewer's Comments:<span style="color: red;">*</span></label>
                            <input type="text" name="reviewComments" ngModel required>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
    </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="save(newForm)">{{'common.save' | translate}}</button>    
        </div>
</div>
