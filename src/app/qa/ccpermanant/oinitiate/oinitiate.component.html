<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-6" style="color: aliceblue;margin-top: -2px;text-align: left;"> Initiate CC</div>
          <div class="clr-col-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/qa/ccpermanant" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #changecontrol="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Departments:<sup style="color: red">*</sup>:</strong></label>
                        <select name="department" #dept="ngModel" ngModel (change)="getDesignation(dept)" required>
                            <option></option>
                            <option *ngFor="let dept of departments">{{ dept.department_name }}</option>
                          </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3">
                        <label>Issue Code :</label>
                        <input type="text" name="issue_code" ngModel required>
                    </div>
                    <div class="clr-col-lg-4">
                        <label>Reference:</label>
                        <select name="reference" [(ngModel)]="reference">
                            <option></option>
                            <option>Yes</option>
                            <option>No</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3" *ngIf="reference=='Yes'">
                        <label>Refrence Issue :</label>
                        <input type="text" name="ref_issue" ngModel required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3" >
                        <label>Date of Initiation :</label>
                        <input type="date" name="date_initiation" ngModel required>
                    </div>
                    <div class="clr-col-lg-4">
                        <label>Market:</label>
                        <select name="market" [(ngModel)]="market">
                            <option></option>
                            <option>Domestic</option>
                            <option>Export</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6 clr-col-xs-12" >
                        <label>Customer Name:<span style="color: red">*</span></label>
                        <select name="client_code" ngModel  >
                            <option></option>
                            <option *ngFor="let client of clients" [value]="client.client_code">{{ client.c_name }}
                            </option>
                        </select>
                    </div>

                    <div class="clr-col-lg-4">
                        <label>Document Type:</label>
                        <select name="document_type" ngModel>
                            <option></option>
                            <option>Document To Be changed</option>
                            <option>New Document</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-8 clr-col-md-12">
                        <label>Change Releted To.</label>
                        <!-- <label>CHANGE INITIATION: (Part A: To be completed by change initiator)</label> -->
                        <select name="cc_related" [(ngModel)]="cc_related" required>
                            <option></option>
                            <option>Product</option>
                            <option>Material</option>
                            <option>Equipment</option>
                            <option>Document</option>
                            <option>Stage</option>
                            <option>Facility</option>
                            <option>System</option>
                            <!-- <option>Equipment / Instrument</option> -->
                            <!-- <option>Process / Product</option> -->
                            <option>Other</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6 clr-col-xs-12" *ngIf="cc_related=='Product'">
                        <label>Product Name:<span style="color: red">*</span></label>
                        <select name="product_code" ngModel  >
                            <option></option>
                            <option *ngFor="let result of results1" [value]="result.product_code">{{ result.product_name }}
                            </option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6 clr-col-xs-12" *ngIf="cc_related=='Material'">
                        <label>Material Name:<span style="color: red">*</span></label>
                        <select name="product_code" ngModel  >
                            <option></option>
                            <option *ngFor="let result of materials" [value]="result.material_code">{{ result.material_name }}
                            </option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6 clr-col-xs-12" *ngIf="cc_related=='Equipment'">
                        <label>Equipment Name:<span style="color: red">*</span></label>
                        <select name="product_code" ngModel  >
                            <option></option>
                            <option *ngFor="let result of Equipments" [value]="result.equipment_code">{{ result.equipment_name }}
                            </option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="cc_related=='Stage'">
                        <label>Process Stage:</label>
                        <select name="stage" ngModel>
                          <option *ngFor="let stage of products" value="{{stage.production_stages}}">{{stage.packing_stages}}</option>
                        </select>
                      </div>

                    <div class="clr-col-lg-12 clr-col-md-12">
                        <label>Title Of Change</label>
                    <textarea name="change_title" rows="2" ngModel required></textarea>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6">
                        <label> Document No :</label>
                        <input type="text" name="document_no" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6">
                        <label>Revision No :</label>
                        <input type="text" name="revision_no" ngModel required>
                    </div>
                    <div class="clr-col-lg-4">
                        <label>Current / Existing Procedure</label>
                        <textarea name="existing_procedure" rows="3" ngModel required></textarea>
                    </div>
                    <div class="clr-col-lg-4">
                        <label>Proposed Change</label>
                        <textarea name="proposed_change" rows="3" ngModel required></textarea>
                    </div>
                    <div class="clr-col-lg-4">
                        <label> Reason / Justification Of each Proposed Change</label>
                        <textarea name="change_reason" rows="3" ngModel required></textarea>
                    </div>
                    <div class="clr-col-lg-4">
                        <label>Upload Attachment </label>
                        <input type="file" name="photo" rows="3" ngModel (change)="onFileChanged3($event)">
                    </div>
                    <div class="clr-col-lg-4">
                        <label>Final Target completion date of change control.</label>
                       
                            <input type="date" name="final_completion_date" [(ngModel)]="final_completion_date">
                       
                    </div>
                </div>
            </form>

    </div>
    <div class="card-block">
        <button class="btn btn-primary" (click)="saveData(changecontrol)"> save</button>
