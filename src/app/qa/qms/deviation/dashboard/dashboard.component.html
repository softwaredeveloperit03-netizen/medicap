 
<div class="module">
  <div class="subdiv">
    <div class="purchase-container">
      <div style="text-align:end" class="close-block">
        <div class="heading-container" style="margin:10px 0px">
          <h3>Deviation</h3>
        </div>
        <div routerLink="/qa/qms" class="name-board1"><i class="fas fa-times"></i>
        </div>
      </div>

      <div class="master-block" style="margin: 0px 10px 10px 10px !important;">
        <div class="section">
          <div class="line-container">
            <div class="heading">
              <h3>Deviation Section</h3>
            </div>
          </div>
          <!-- Main-dashboard -->
          <div class="card-block" style="    
            display: grid;
            grid-template-columns: repeat(6, 150px);
            grid-gap: 35px;
            overflow-x: auto;
            max-width: 100%;">
            <div class="icon-container" *ngIf="isuser == 'Yes'" routerLink="new">
              <i class="fa fa-file-text"></i> <!-- Font Awesome icon for New Deviation -->
              <span>New Deviation</span>
            </div>
            
            <div class="icon-container" *ngIf="qms_approver=='Yes' || isapprover=='Yes'" routerLink="review">
              <i class="fas fa-tasks"></i> 
              <span>Deviation Consent &</span>
              <span>Review By Dept.</span>
            </div>  

            <div class="icon-container" *ngIf="(qms_approver=='Yes' || isapprover=='Yes' ) && Department == 'Quality Assurance'" 
            routerLink="reviewQa">
              <i class="fas fa-tasks"></i> 
              <span>Review & Approval</span>
              <span>Of QA</span>
             </div>  

             <div class="icon-container" *ngIf="(qms_approver=='Yes' || isapprover=='Yes' ) && Department == 'Quality Assurance'"  routerLink="ClosureByQA">
              <i class="fas fa-tasks"></i> 
              <span>Deviation Closure</span>
              <span>By QA</span>
            </div>  

            <!-- <div class="icon-container" *ngIf="(qms_approver=='Yes' || isapprover=='Yes' ) && Department == 'Quality Assurance'" 
            routerLink="rootcause">
              <i class="fas fa-tasks"></i> 
              <span>Corrective And </span>
              <span>Priventive Actions</span>
             </div>  
           
             <div class="icon-container" routerLink="Review_qa" *ngIf="(qms_approver=='Yes' || isapprover=='Yes' ) && Department == 'Quality Assurance'" >
              <i class="fas fa-file-alt"></i>  
              <span>QA Review On CAPA</span>
            </div>
             <div class="icon-container" routerLink="monitoringFollowup" *ngIf="(qms_approver=='Yes' || isapprover=='Yes' ) && Department == 'Quality Assurance'" >
              <i class="fas fa-file-alt"></i>  
              <span>Monitoring, Follow Up &</span>
              <span>Closure Of Deviation </span>
            </div> -->

             <div class="icon-container" routerLink="log">
              <i class="fas fa-file-alt"></i>  
              <span>Log</span>
            </div>

            <div class="icon-container" routerLink="delay">
              <i class="fas fa-clock"></i>  
              <span>Justification For Delay</span>
              <span>(after closure date passed)</span>
            </div>

            <div
              class="icon-container"
              *ngIf="Department == 'Quality Assurance' && (qms_approver=='Yes' || isapprover=='Yes')"
              routerLink="delay_approval"
            >
              <i class="fas fa-check-circle"></i>
              <span>Delay Approval</span>
              <span>(approve/reject)</span>
            </div>

            <div
              class="icon-container"
              *ngIf="Department == 'Quality Assurance' "
              routerLink="/qa/qms/deviation/qa_manager_delay_approval"
            >
              <i class="fas fa-user-check"></i>
              <span>QA Manager</span>
              <span>Delay Approval</span>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
