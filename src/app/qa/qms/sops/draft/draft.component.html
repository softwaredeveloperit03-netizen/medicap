<div class="container-fluid">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Upload Existing SOP</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/qa/qms/sops" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #prepareForm="ngForm">
          <div class="clr-row">
            <div class="clr-col-3">
              <label>SOP No. : <span style="color: red;"><b>*</b></span></label>
              <input type="text" name="sopNo" ngModel required>
            </div>
            <div class="clr-col-3">
              <label>Version No. : <span style="color: red;"><b>*</b></span></label>
              <input type="text" name="version_no" ngModel required>
            </div>
            <div class="clr-col-3">
              <label>Supersedes No. : <span style="color: red;"><b>*</b></span></label>
              <input type="text" name="supersedNo" ngModel required>
            </div>
            <div class="clr-col-3">
              <label>Name Of Sop : <span style="color: red;"><b>*</b></span></label>
              <input type="text" name="sopName" ngModel required>
            </div>
            <div class="clr-col-3">
              <label>SOP Type : <span style="color: red;"><b>*</b></span></label>
              <select name="sopType" ngModel required  >
                <option>Cleaning</option>
                <option>Operation</option>
                <option>General</option>
                <option>Calibration</option>
                <option>System</option>
                <option>Process</option>
                <option>Other</option>
              </select>
            </div>
            <div class="clr-col-3" *ngIf="department == 'Quality Assurance'">
              <label>Department : <span style="color: red;"><b>*</b></span></label>
              <select name="department" ngModel required >
                <option></option>
                <option *ngFor="let data of departments;">{{data.department_name}}</option>
              </select>
            </div>
            <div class="clr-col-3" *ngIf="department != 'Quality Assurance'">
              <label>Department : <span style="color: red;"><b>*</b></span></label>
              <input  type="text" name="department"   required [(ngModel)]="department" readonly>
            </div>
            <div class="clr-col-3">
              <label>Revision Date : <span style="color: red;"><b>*</b></span></label>
              <input type="date" name="revisionDate" ngModel required>
            </div>
            <div class="clr-col-3">
              <label>Effective Date : <span style="color: red;"><b>*</b></span></label>
              <input type="date" name="effectiveDate" ngModel required>
            </div>
            <div class="clr-col-3">
              <label>SOP File  : <span style="color: red;"><b>*</b></span></label>
              <input  type="file" name="sopFile" (change)="onFileChanged($event)" required ngModel>
            </div>
            
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="save(prepareForm)">{{'common.save' | translate}}</button>
      <button class="btn btn-danger" routerLink="/qa/qms/sops" >CLOSE </button>
    </div>
  </div>
</div>
