<div class="card inc-form">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px">
      <div class="clr-col-9" style="color: aliceblue; margin-top: -2px; text-align: left">New Incident</div>
      <div class="clr-col-lg-3" style="text-align: right; padding-right: 0; margin-top: -7px">
        <button class="btn btn-sm" routerLink="/qa/qms/incident" style="background-color: red; color: white">
          <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
        </button>
      </div>
    </div>
  </div>

  <div class="card-block">
    <form #FormData="ngForm">
      <div class="inc-form__section">
        <div class="inc-form__section-head">Incident Details</div>
        <div class="inc-form__section-body">
          <div class="inc-form__grid">
            <div class="inc-form__field">
              <label>Date Of INR <span class="inc-form__required">*</span></label>
              <input class="inc-form__input" type="date" name="Date_Of_INR" ngModel required />
            </div>
            <div class="inc-form__field">
              <label>Name Of Department <span class="inc-form__required">*</span></label>
              <input class="inc-form__input" type="text" name="Name_of_Department" [(ngModel)]="Name_of_Department" readonly required />
            </div>
            <div class="inc-form__field">
              <label>INR No <span class="inc-form__required">*</span></label>
              <input class="inc-form__input" type="text" name="INR_No" ngModel required />
            </div>
            <div class="inc-form__field">
              <label>CAPA Ref No. <span class="inc-form__required">*</span></label>
              <input class="inc-form__input" type="text" name="CAPA_Ref_No" ngModel required />
            </div>
            <div class="inc-form__field">
              <label>Ref QMS Document No. <span class="inc-form__required">*</span></label>
              <input class="inc-form__input" type="text" name="Ref_QMS_Document_No" ngModel required />
            </div>
            <div class="inc-form__field">
              <label>Target Date <span class="inc-form__required">*</span></label>
              <input class="inc-form__input" type="date" name="Target_Date" ngModel required />
            </div>
            <div class="inc-form__field">
              <label>Incident Related To <span class="inc-form__required">*</span></label>
              <select class="inc-form__select" name="incident_relateds" [(ngModel)]="selectedIncidentRelated" required>
                <option value="">Select</option>
                <option *ngFor="let order of incident_relateds" [value]="order.origin">{{ order.origin }}</option>
              </select>
            </div>
            <div class="inc-form__field">
              <label>Classification Of INR <span class="inc-form__required">*</span></label>
              <select class="inc-form__select" name="classification_inr" [(ngModel)]="selectedClassificationInr" required>
                <option value="">Select</option>
                <option *ngFor="let order of classification_inr" [value]="order.origin">{{ order.origin }}</option>
              </select>
            </div>
            <div class="inc-form__field inc-form__full">
              <label>Potential Impact On <span class="inc-form__required">*</span></label>
              <select class="inc-form__select" name="potential_impact" [(ngModel)]="selectedPotentialImpact" required>
                <option value="">Select</option>
                <option *ngFor="let order of potential_impact" [value]="order.origin">{{ order.origin }}</option>
              </select>
            </div>
            <div class="inc-form__field inc-form__full">
              <label>INR Details <span class="inc-form__required">*</span></label>
              <textarea class="inc-form__textarea" name="INR_Details" rows="3" ngModel required></textarea>
            </div>
            <div class="inc-form__field inc-form__full">
              <label>Supportive Evidence / Document (PDF)</label>
              <input class="inc-form__file" type="file" name="incident_supportive_document" (change)="onFileChanged($event)" accept="application/pdf" />
              <div class="inc-form__note" *ngIf="selectedFile">Selected: {{ selectedFile.name }}</div>
            </div>
          </div>
        </div>
      </div>

      <div class="inc-form__section">
        <div class="inc-form__section-head">Cause &amp; Actions</div>
        <div class="inc-form__section-body">
          <div class="inc-form__grid">
            <div class="inc-form__field inc-form__full">
              <label>Probable Cause / Root Cause <span class="inc-form__required">*</span></label>
              <textarea class="inc-form__textarea" name="Probable_Cause_Root_Cause_for_Incidence" rows="3" ngModel required></textarea>
            </div>
            <div class="inc-form__field inc-form__full">
              <label>Corrective Action <span class="inc-form__required">*</span></label>
              <textarea class="inc-form__textarea" name="Corrective_Action" rows="3" ngModel required></textarea>
            </div>
            <div class="inc-form__field inc-form__full">
              <label>Corrective Reference Document (PDF)</label>
              <input class="inc-form__file" type="file" name="Corrective_Reference_Document" (change)="onFileChanged1($event)" accept="application/pdf" />
              <div class="inc-form__note" *ngIf="selectedFile1">Selected: {{ selectedFile1.name }}</div>
            </div>
            <div class="inc-form__field inc-form__full">
              <label>Preventive Action <span class="inc-form__required">*</span></label>
              <textarea class="inc-form__textarea" name="Preventive_Action" rows="3" ngModel required></textarea>
            </div>
            <div class="inc-form__field inc-form__full">
              <label>Preventive Reference Document (PDF)</label>
              <input class="inc-form__file" type="file" name="Preventive_Reference_Document" (change)="onFileChanged2($event)" accept="application/pdf" />
              <div class="inc-form__note" *ngIf="selectedFile2">Selected: {{ selectedFile2.name }}</div>
            </div>
            <div class="inc-form__field inc-form__full">
              <label>Root Cause Identified <span class="inc-form__required">*</span></label>
              <textarea class="inc-form__textarea" name="Root_Cause_Identified" rows="2" ngModel required></textarea>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>

  <div class="card-footer">
    <button class="btn btn-primary btn-sm" [disabled]="!saveBtn" (click)="save(FormData)">{{ 'common.save' | translate }}</button>
  </div>
</div>
