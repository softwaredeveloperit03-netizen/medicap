<div class="component">
  <div class="subsection">
    <div class="purchase-block">
      <div style="text-align:end" class="exit-section">
        <div class="header-block" style="margin:10px 0px">
          <h3>CAPA</h3>
          <div routerLink="/" class="name-board2">
            <i class="fas fa-times"></i>
          </div>
        </div>

        <div class="main-section" style="margin: 0px 10px 10px 10px !important;">
          <div class="category">
            <div class="line-section">
              <div class="header-div">
                <h3>CAPA Section</h3>
              </div>
            </div>

            <div class="block-container" style="
              display: grid;
              grid-template-columns: repeat(6, 150px);
              grid-gap: 35px;
              overflow-x: auto;
              max-width: 100%;
            ">

              <div class="item-block" *ngIf="isuser == 'Yes'" routerLink="/qa/qms/capa/new">
                <i class="fas fa-plus-circle"></i>
                <span>New CAPA</span>
              </div>

              <div class="item-block" *ngIf="ischecker == 'Yes'" routerLink="/qa/qms/capa/SSProcedure">
                <i class="fas fa-check-circle"></i>
                <span>Seven Step Procedure</span>
              </div>

              <div class="item-block" *ngIf="ischecker == 'Yes'" routerLink="/qa/qms/capa/task">
                <i class="fas fa-check-circle"></i>
                <span>Capa Task Dept</span>
              </div>

                <div class="item-block" *ngIf="ischecker == 'Yes'" routerLink="/qa/qms/capa/followUp">
                  <i class="fas fa-check-circle"></i>
                  <span>Follow up </span>
                </div>

              <div class="item-block" routerLink="/qa/qms/capa/log">
                <i class="fas fa-check-circle"></i>
                <span>Log</span>
              </div>

            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
