<div class="card">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-9" style="color: aliceblue; margin-top: -2px; text-align: left;">
        NEW CAPA INITIATE
      </div>
      <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px;">
        <button class="btn btn-sm" routerLink="/qa/qms/capa" style="background-color: red; color: white;">CLOSE</button>
      </div>
    </div>
  </div>

  <div class="card-block">
    <form #capa="ngForm">
      <div class="clr-row" style="margin-bottom: -10px;">

        <div class="clr-col-4">
          <label>CAPA Occurred In Dept.</label>
          <input type="text" name="CapaOccuredDept" [(ngModel)]="department_name" readonly>
        </div>

        <div class="clr-col-4">
          <label>Initiate Date</label>
          <input type="date" name="Initiate_date" ngModel required #initiateDate="ngModel">
          <div *ngIf="initiateDate.invalid && initiateDate.touched" class="text-danger">
            Initiate Date is required
          </div>
        </div>
      </div><br><br>
      <hr class="clr-divider">
      <div class="clr-row">

        <div class="clr-col-4">
          <label> <b>Request Source:</b> </label>
        </div>
        <div class="clr-col-6">
          <div class="clr-control-container">
            <select style="margin: 4px;padding: 4px;width: 140%;" id="categorySelect" class="clr-select" name="selectedCategory"
              [(ngModel)]="selectedCategory" required #category="ngModel">
              <option *ngFor="let category of categories" [value]="category.origin">
                {{ category.origin }}
              </option>
            </select>
            <div *ngIf="category.invalid && category.touched" class="text-danger">
              Please select a category
            </div>
          </div>
        </div>
      </div>

      <div class="clr-col-6">
        <label>Source Document No</label>
        <input type="text" name="Source_doc" ngModel required #sourceDoc="ngModel">
        <div *ngIf="sourceDoc.invalid && sourceDoc.touched" class="text-danger">
          Source Document No is required
        </div>
      </div>

      <div class="clr-col-12">
        <label>Description of the Non-Conformity</label>
        <textarea rows="2" name="DesNonConformity" ngModel required #description="ngModel"></textarea>
        <div *ngIf="description.invalid && description.touched" class="text-danger">
          Please provide a description
        </div>
      </div>


      <div class="clr-col-12">
        <label>Preliminary Assessment of Potential Impact and/or Risk</label>
        <textarea rows="2" name="AssessmentImpact" ngModel required #impact="ngModel"></textarea>
        <div *ngIf="impact.invalid && impact.touched" class="text-danger">
          Please provide an assessment
        </div>
      </div>

    </form>
  </div>

  <div class="card-footer">
    <button class="btn btn-primary" (click)="save(capa)" [disabled]="capa.invalid">Save</button>
  </div>
</div>
