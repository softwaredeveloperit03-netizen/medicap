<div class="container-fluid">
  <div class="card">
    <div class="card-header">Change Control</div>
    <div class="card-block">
      <div class="card-text">
        <table class="table">
          <tr>
            <th style="width: 40px;">Sr.</th>
            <th style="text-align: left;">No.</th>
            <th style="text-align: left;">Change Title</th>
            <th style="text-align: left;">{{'common.status' | translate}}</th>
            <th style="text-align: left;">Entry By</th>
            <th style="text-align: left;">Entry Date</th>
          </tr>
          <tr *ngFor="let entry of entries; let i = index">
            <td>{{ i + 1 }}.</td>
            <td style="text-align: left;">{{ entry.ctrl_no }}</td>
            <td style="text-align: left;">{{ entry.change_title }}</td>
            <td style="text-align: left;">{{ entry.status }}</td>
            <td style="text-align: left;">{{ entry.entry_by }}</td>
            <td style="text-align: left;">{{ entry.entry_date }}</td>
          </tr>
          <tr *ngIf="entries?.length == 0">
            <td colspan="6" style="text-align: center;">{{'common.noRecords' | translate}}</td>
          </tr>
        </table>
      </div>
    </div>
  </div>
</div>
