<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
                <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Maintenance Note</div>
                <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qms/maintenance" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
                </div>
            </div>
      </div>
      <div class="card-block">
        <div class="card-text">
          <form #dataForm="ngForm">
            <div class="clr-row">
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Area:<span style="color:red;">*</span></label>
                <select name="section" ngModel required #section="ngModel">
                  <option></option>
                  <option *ngFor="let section of sections">{{ section.section_name }}</option>
                </select>
                <span style="color: red;" *ngIf="section.invalid && section.touched">Please Select Area</span>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Maintenance Type:<span style="color:red;">*</span></label>
                <select name="maintenance_type" ngModel required #maintenance_type="ngModel">
                  <option>Type 1</option>
                  <option>Type 2</option>
                </select>
                <span style="color: red;" *ngIf="maintenance_type.invalid && maintenance_type.touched">Please Select Maintenance Type</span>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Urgency Level:<span style="color:red;">*</span></label>
                <select name="urgency_level" ngModel required #urgency_level="ngModel">
                  <option>Urgent</option>
                  <option>Normal</option>
                </select>
                <span style="color: red;" *ngIf="urgency_level.invalid && urgency_level.touched">Please Select Urgency level</span>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Equipement Name:<span style="color:red;">*</span></label>
                <select name="equipment_name" ngModel (change)="getEquipmentsDetails($event.target.selectedIndex)" required #equipment_name="ngModel">
                  <option></option>
                  <option *ngFor="let equipment of equipments">{{ equipment.equipment_name }}</option>
                </select>
                <span style="color: red;" *ngIf="equipment_name.invalid && equipment_name.touched">Please Select Equipment Name</span>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Equipement ID:<span style="color:red;">*</span></label>
                <select name="equipment_code" ngModel required #equipment_code="ngModel">
                  <option></option>
                  <option *ngFor="let result of selectedEquipment['equipments']">{{ result.equipment_code }}</option>
                </select>
                <span style="color: red;" *ngIf="equipment_code.invalid && equipment_code.touched">Please Select Equipment ID</span>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Problem:<span style="color:red;">*</span></label>
                <select name="problem" ngModel required #problem="ngModel">
                  <option>Electrical</option>
                  <option>Mechanical</option>
                  <option>Other</option>
                </select>
                <span style="color: red;" *ngIf="problem.invalid && problem.touched">Please Select Problem</span>
              </div>
              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label>Description of Problem:</label>
                <textarea name="description" rows="2" ngModel></textarea>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Breakdown Time:<span style="color:red;">*</span></label>
                <input type="time" name="breakdown_time" ngModel required #breakdown_time="ngModel">
                <span style="color: red;" *ngIf="breakdown_time.invalid && breakdown_time.touched">Please Select Breakdown Time</span>
              </div>
            </div>
          </form>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="saveMaintenanceNote(dataForm)">{{'common.submit' | translate}}</button>
      </div>
    </div>
  </div>
