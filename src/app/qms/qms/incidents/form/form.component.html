<div class="container-fluid">
  <div class="card">
    <div class="card-header" style="text-align: center;">
      <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Incident</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/qms/incidents" style="background-color: red;color: white;">CLOSE
          </button>
          </div>
      </div>
    </div>
      <div class="card-block">
          <div class="card-text">
            <form #inciForm="ngForm">
              <div class="clr-row">
                <div class="clr-col-md-4 clr-col-12">
                  <label><strong>Incident Related To:<span style="color:red;">*</span></strong></label>
                  <select ngModel name="related_to" required #related_to="ngModel">
                    <option value="Equipment">Equipment</option>
                    <option value="Product">Product</option>
                    <option value="Process">Process</option>
                    <option value="Procedure">Procedure</option>
                    <option value="Document">Document</option>
                  </select>
                  <span style="color: red;" *ngIf="related_to.invalid && related_to.touched">Please Select The Incident Related</span>
                </div>
                <div class="clr-col-md-4 clr-col-12">
                  <label><strong>Type Of Incident:<span style="color:red;">*</span></strong></label>
                  <select ngModel name="type" required #type="ngModel">
                    <option value="Minor">Minor</option>
                    <option value="Major">Major</option>
                    <option value="Critical">Critical</option>
                  </select>
                  <span style="color: red;" *ngIf="type.invalid && type.touched">Please Select Incident Type</span>
                </div>
                <div class="clr-col-md-4 clr-col-12">
                  <label><strong>Date Of Incident:<span style="color:red;">*</span></strong></label>
                  <input ngModel name="incident_date" type="date" [max]="today" required #incident_date="ngModel">
                  <span style="color: red;" *ngIf="incident_date.invalid && incident_date.touched">Please Select Incident Date</span>
                </div>
                <div class="clr-col-md-4 clr-col-12">
                  <label><strong>Justification for type:<span style="color:red;">*</span></strong></label>
                  <textarea ngModel name="justification" required #justification="ngModel">
                    <span style="color: red;" *ngIf="justification.invalid && justification.touched"></span>
                  </textarea>
                  
                </div>
                <div class="clr-col-md-4 clr-col-12">
                  <label><strong>Cause of Incident:<span style="color:red;">*</span></strong></label>
                  <textarea ngModel name="cause"></textarea>
                </div>
                <div class="clr-col-md-4 clr-col-12">
                  <label><strong>Description of Incident:<span style="color:red;">*</span></strong></label>
                  <textarea ngModel name="description"></textarea>
                </div>
                <div class="clr-col-md-4 clr-col-12">
                  <label><strong>Affecting Product / Material:<span style="color:red;">*</span></strong></label>
                  <select [(ngModel)]="affecting_product" name="affecting_product">
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                  </select>
                </div>
                <div class="clr-col-md-4 clr-col-12">
                  <label><strong>Affecting Equipment:<span style="color:red;">*</span></strong></label>
                  <select [(ngModel)]="affecting_equipment" name="affecting_equipment">
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                  </select>
                </div>
              </div>
              <div class="clr-row" *ngIf="affecting_product == 'yes'">
                <div class="clr-col-md-4 clr-col-12">
                  <label><strong>Name of Product:<span style="color:red;">*</span></strong></label>
                  <input ngModel type="text" name="product_name" required #product_name="ngModel">
                  <span style="color: red;" *ngIf="product_name.invalid && product_name.touched">Please Enter Product Name</span>
                </div>
                <div class="clr-col-md-2 clr-col-12">
                  <label><strong>Medicap Lot No:<span style="color:red;">*</span></strong></label>
                  <input ngModel type="text" name="batch_no" required #batch_no="ngModel">
                  <span style="color: red;" *ngIf="batch_no.invalid && batch_no.touched">Please Enter Medicap Lot No</span>
                </div>
                <div class="clr-col-md-3 clr-col-12">
                  <label><strong>Mfg. Date:<span style="color:red;">*</span></strong></label>
                  <input ngModel type="month" name="mfg_date" required #mfg_date="ngModel">
                  <span style="color: red;" *ngIf="mfg_date.invalid && mfg_date.touched">Please Select MFG Date</span>
                </div>
                <div class="clr-col-md-3 clr-col-12">
                  <label><strong>Exp. Date:<span style="color:red;">*</span></strong></label>
                  <input ngModel type="month" name="exp_date" required #exp_date="ngModel">
                  <span style="color: red;" *ngIf="exp_date.invalid && exp_date.touched">Please Select EXP Date</span>
                </div>
              </div>
              <div class="clr-row" *ngIf="affecting_equipment == 'yes'">
                <div class="clr-col-md-4 clr-col-12">
                  <label><strong>Name of Equipment:<span style="color:red;">*</span></strong></label>
                  <input ngModel type="text" name="equipment_name" required #equipment_name="ngModel">
                  <span style="color: red;" *ngIf="equipment_name.invalid && equipment_name.touched">Please Enter Equipment Name</span>
                </div>
              </div>

            </form>
          </div>
      </div>
      <div class="card-footer">
          <button class="btn btn-primary" (click)="saveUserForm(inciForm)">{{'common.submit' | translate}}</button>
      </div>
  </div>
</div>
