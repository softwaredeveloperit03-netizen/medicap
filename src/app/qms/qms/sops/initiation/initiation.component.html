<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Initiate New SOP</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/qms/sops" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
      <div class="card-block">
        <div class="card-text">
          <form #prepareForm="ngForm">
            <div class="clr-row">
              <div class="clr-col-12">
                <label>SOP Title:<span style="color:red;">*</span></label>
                <input type="text" name="title" ngModel required #title="ngModel">
                <span style="color: red;" *ngIf="title.invalid && title.touched">Please Enter SOP Title</span>
              </div>
              <div class="clr-col-12">
                <label>SOP For:<span style="color:red;">*</span></label>
                <select name="sop_for" ngModel required (change)="checkFor($event.target.value)" #sop_for="ngModel">
                  <option>Product</option>
                  <option>Equipment</option>
                  <option>QMS</option>
                  <option>System</option>
                  <option>Process</option>
                  <option>Procedure</option>
                  <option>Other</option>
                </select>
                <span style="color: red;" *ngIf="sop_for.invalid && sop_for.touched">Please Select SOP For</span>
              </div>
              <div class="clr-col-12" *ngIf="isEquipment">
                <label>Equipment Name:</label>
                <select name="equipment_code" ngModel required #equipment_code="ngModel">
                  <option></option>
                  <option *ngFor="let equipment of equipments" [value]="equipment.equipment_code">{{ equipment.equipment_code }} - {{ equipment.equipment_name }}</option>
                </select>
                <span style="color: red;" *ngIf="equipment_code.invalid && equipment_code.touched">Please Select Equipment Name</span>
              </div>
              <div class="clr-col-12" *ngIf="isOther">
                <label>Other:</label>
                <input type="text" name="other" ngModel required #other="ngModel">
                <span style="color: red;" *ngIf="other.invalid && other.touched">Please Enter The Name</span>
              </div>
            </div>
          </form>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="save(prepareForm)">{{'common.save' | translate}}</button>
      </div>
    </div>
</div>
