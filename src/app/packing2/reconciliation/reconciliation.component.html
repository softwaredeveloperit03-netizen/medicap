<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue; margin-top: -2px; text-align: left;"> Packing Material Reconciliation</div>
            <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/packing" style="background-color: red; color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
<div>
 <form #Reconciliationform="ngForm">
    <div class="card-block">
        <div class="card-text">
            <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Date:</b><span style="color: red;">*</span></label>
                    <input type="date" name="date" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Department:</b><span style="color: red;">*</span></label>
                    <input type="text" name="department" ngModel required>
                </div>
            </div>
        </div>
    </div>
    <div class="card">
     <div class="card-header" style="text-align: left; color: black; background-color: rgb(96, 189, 212);">Material Details</div>
        <div class="card-block">
          <div class="clr-row">
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Material Name/Type:</b></strong></label>
                <input type="text" name="material_name" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Material ID/Code:</b></strong></label>
                <input type="text" name="material_id" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Batch/Lot Number :</b></strong></label>
                <input type="text" name="batch_no" ngModel >
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Supplier Name :</b></strong></label>
                <input type="text" name="supplier" ngModel >
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><b>Unit of Mesurment:</b></label>
                <select type="text" name="unit" ngModel required>
                    <option></option>
                    <option>Boxes</option>
                    <option> Rolls</option>
                    <option>Sheets</option>
                </select>
            </div>
        </div>
      </div>
    </div>
    <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(96, 193, 223);">Opnig Stock(At Begining of Period)</div>
           <div class="card-block">
             <div class="clr-row">
                
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Date:</b></strong></label>
                   <input type="date" name="date_stock" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Quantity:</b></strong></label>
                   <input type="text" name="quantity" ngModel required>
               </div>
           </div>
         </div>
       </div>
       <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(96, 193, 223);">Recepte During the Period</div>
           <div class="card-block">
             <div class="clr-row">
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Date of Recipt:</b></strong></label>
                   <input type="date" name="date_recipt" ngModel required >
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Quantity Received:</b></strong></label>
                   <input type="text" name="quantity_received" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Supplier Name(If Applicable):</b></strong></label>
                <input type="text" name="supplier" ngModel required>
            </div>
           </div>
         </div>
       </div>
       <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(96, 189, 212);">Issues/Consumption During the Period</div>
           <div class="card-block">
             <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><strong><b>Date of Issue:</b><sup style="color: red;">*</sup></strong></label>
                    <input type="date" name="issue_date" ngModel required>
                </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Quantity Issued:</b><sup style="color: red;">*</sup></strong></label>
                   <input type="text" name="user_name" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Purpose/Usase:</b><sup style="color: red;">*</sup></strong></label>
                <input type="text" name="purpose" ngModel required>
               </div>
           </div>
         </div>
       </div>
       <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(96, 189, 212);">Closing Stock(At the end of the Period)</div>
           <div class="card-block">
             <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><strong><b>Date :</b><sup style="color: red;">*</sup></strong></label>
                    <input type="date" name="losing_date" ngModel required>
                </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Quantity :</b><sup style="color: red;">*</sup></strong></label>
                   <input type="text" name="quantity_name" ngModel required>
               </div>
           </div>
         </div>
       </div>
       <div class="card" >
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(96, 189, 212);">Reconcilition Summary</div>
           <div class="card-block">
             <div class="clr-row">
               <div  class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Total Receipts:</b></strong></label>
                   <input type="text" name="receipts" ngModel required>
               </div>
               <div  class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Total Issues/Consumption:</b></strong></label>
                <input type="date" name="total_issues" ngModel required>
               </div>
               <div  class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Closing Stock:</b></strong></label>
                <input type="text" name="closing_stock" ngModel required >
               </div>
               <div  class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Discrepancy Explanation (if any):</b></strong></label>
                <input type="text" name="discrepancy" ngModel required >
               </div>
           </div>
         </div>
       </div>
       <div class="card" >
        <div class="card-header" style="text-align: left; color: black; background-color:rgb(96, 189, 212);">Reviewer/Approver</div>
           <div class="card-block">
             <div class="clr-row">
               <div  class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b> Reviewer/Approver Name :</b></strong></label>
                   <input type="text" name="approver_name" ngModel required>
               </div>
               <div  class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Date:</b></strong></label>
                <input type="date" name="approve_date" ngModel required>
               </div>
           </div>
         </div>
       </div>
</form>
</div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="save(Reconciliationform)">{{'common.submit' | translate}}</button>
    </div>
</div>
