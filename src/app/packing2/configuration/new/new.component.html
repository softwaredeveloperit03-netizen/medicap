<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-lg-6" style="color: aliceblue;margin-top: -2px;text-align: left;">New Packing Configuration</div>
          <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-danger" routerLink="/packing/configuration">{{'common.close' | translate}}</button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #conf="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-md-6 clr-col-sm-6">
                       <label>Dosage Form:</label>
                       <select name="dosage_form" ngModel required>
                           <option></option>
                           <option *ngFor="let dos of dosages" [value]="dos.dosage_form">{{dos.dosage_form}} </option>
                       </select>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-md-6 clr-col-sm-6">
                        <label>Configuration Title:(e.g:Alu-Alu-Mono):</label>
                        <input type="text" name="configuration">
                     </div>
                    <div class="clr-col-lg-3 clr-col-md-6 clr-col-md-6 clr-col-sm-6">
                        <label>Primary Packing</label>
                        <select name="packing_style" ngModel (change)="getSubtype($event.target.value)" required>
                            <option></option>
                            <option value="Blister">Blister </option>
                            <option value="Strip">Strip </option>
                            <option value="Bottle">Bottle </option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-6 clr-col-md-6 clr-col-sm-6" *ngIf="isBlister">
                        <label> Primary packing subtype</label>
                        <select name="primary_subtype" ngModel  required>
                            <option></option>
                            <option>Alu - Alu</option>
                            <option>Alu - PVC </option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-6 clr-col-md-6 clr-col-sm-6" *ngIf="isBottel">
                        <label>Primary packing subtype</label>
                        <select name="primary_subtype" ngModel  required>
                            <option></option>
                            <option>HPPL</option>
                            <option>Glass</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-6 clr-col-md-6 clr-col-sm-6">
                        <label>Mono Carton Packing</label>
                        <select name="ismono" ngModel (change)="getMono($event.target.value)" required>
                            <option></option>
                            <option value="yes">Yes</option>
                            <option value="no">No</option>
                        </select>
                    </div>
                    
                    <div class="clr-col-lg-3" *ngIf="isBlister">
                        <label> No. of units in one Blister</label>
                        <input type="text" name="primary_qty" ngModel required>
                    </div>
                    <div class="clr-col-lg-3" *ngIf="isStrip">
                        <label> No. of units in one Strip</label>
                        <input type="text" name="primary_qty" ngModel required>
                    </div>
                    <div class="clr-col-lg-3" *ngIf="isBottel">
                        <label> No. of units in one Bottel</label>
                        <input type="text" name="primary_qty" ngModel required>
                    </div>

                    <div class="clr-col-lg-3 clr-col-md-6 clr-col-md-6 clr-col-sm-6">
                        <label>Unit Weight</label>
                        <input type="text" name="unit" ngModel required>
                    </div>

                    <div class="clr-col-lg-3" *ngIf="isyes && isBlister">
                        <label> No. of Blister in one Mono carton</label>
                        <input type="text" name="mono_qty" ngModel required>
                    </div>
                    <div class="clr-col-lg-3" *ngIf="isyes && isBottel">
                        <label> No. of Bottel in one Mono carton</label>
                        <input type="text" name="mono_qty" ngModel required>
                    </div>
                    <div class="clr-col-lg-3" *ngIf="isyes && isStrip">
                        <label> No. of Strip in one Mono carton</label>
                        <input type="text" name="mono_qty" ngModel required>
                    </div>
                
                    <div class="clr-col-lg-3 clr-col-md-6 clr-col-md-6 clr-col-sm-6">
                        <label> Outer Carton Packing</label>
                        <select name="isouter" ngModel (change)="getOuter($event.target.value)" required>
                            <option></option>
                            <option value="yes">Yes</option>
                            <option value="no">No</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3" *ngIf="isyesouter">
                        <label> No. of Mono carton in one Outer carton</label>
                        <input type="text" name="outer_qty" ngModel required>
                    </div>
                    <div class="clr-col-lg-3" *ngIf="isyesouter">
                        <label> No. of outer carton in one shipper</label>
                        <input type="text" name="shipper_qty" ngModel required>
                    </div>

                    <div class="clr-col-lg-3" *ngIf="isNoouter && isyes" >
                        <label> No. of mono carton in one shipper</label>
                        <input type="text" name="shipper_qty" ngModel required>
                    </div>
                    <div class="clr-col-lg-3" *ngIf="isNoouter && isNo && isBlister" >
                        <label> No. of Blister in one shipper</label>
                        <input type="text" name="shipper_qty" ngModel required>
                    </div>
                    <div class="clr-col-lg-3" *ngIf="isNoouter && isNo && isStrip" >
                        <label> No. of Strip in one shipper</label>
                        <input type="text" name="shipper_qty" ngModel required>
                    </div>
                    <div class="clr-col-lg-3" *ngIf="isNoouter && isNo && isBottel" >
                        <label> No. of Bottle in one shipper</label>
                        <input type="text" name="shipper_qty" ngModel required>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="save(conf)">{{'common.save' | translate}}</button>
    </div>
</div>
