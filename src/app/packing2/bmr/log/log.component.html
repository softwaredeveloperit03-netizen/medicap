<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;"> Packing Step Master</div>
        <div class="clr-col-lg-5" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-success" routerLink="/packing/bmr/master">NEW </button>
          <button class="btn btn-sm btn-danger" routerLink="/packing/bmr">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <table class="table">
          <tr>
              <th style="text-align:left">Sr</th>
              <th style="text-align:left">Dosage Form</th>
              <th style="text-align:left">Process Type</th>
          </tr>
          <tr *ngFor='let result of results;let i=index'>
              <td style="text-align:left">{{i + 1}}</td>
              <td style="text-align:left">{{result.dosage_form}}</td>
              <td style="text-align:left">
                <table class="table" style="margin-top: 0px;">                
                  <tr *ngFor="let process of result['process_types']">
                    <td style="text-align: left;">{{ process.process_type }}</td>
                     <td>
                      <table class="table" style="margin-top: 0px;"> 
                        <tr *ngFor="let stage of process['stages']">
                          <td style="text-align: left;">{{ stage.stage }}</td> 
                          <td>
                            <table class="table" style="margin-top: 0px;"> 
                              <tr *ngFor="let stage of stage['steps']"> 
                                <td style="text-align: left;">{{ stage.step }}</td>
                              </tr>
                            </table>
                          </td>
                        </tr>
                      </table>
                     </td> 
                  </tr>
                </table>
              </td>
          </tr>
          <tr *ngIf="results?.length == 0">
            <td colspan="8">{{'common.noRecords' | translate}}</td>
          </tr>
        </table>
      </div>
    </div>
  </div>
