<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Packing Type Master</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-danger" routerLink="/packing/bmr/log">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <div class="clr-row">
            <div class="clr-col-lg-4 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label>Dosage Form: <span style="color: red">*</span></label>
                <select name="dosage_form" [(ngModel)]="dosage_form" required>
                    <option></option>
                    <option *ngFor="let dosage of dosages">{{ dosage.dosage_form }}</option>
                </select>
            </div>
            <div class="clr-col-lg-4 clr-col-md-6 clr-col-sm-12 clr-col-xs-12" *ngIf="dosage_form !== 'TABLET'">
                <label>Process Type: <span style="color: red">*</span></label>
                <input type="text" name="process_type" [(ngModel)]="process_type" required>
            </div>
        </div>
        <h3>New Process:</h3>
        <form #processForm="ngForm">
            <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Stage: <span style="color: red">*</span></label>
                    <input type="text" name="stage" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Step:</label>
                    <input type="text" name="step" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <button class="btn btn-primary" (click)="addnewProcess(processForm)" style="margin-top:30px;">{{'common.add' | translate}}</button>
                </div>
            </div>
        </form>
        <table class="table">
            <tr>
                <th>Stage</th>
                <th>Step</th>
            </tr>
            <tr *ngFor="let result of processes">
                <td>{{ result.stage }}</td>
                <td>{{ result.step }}</td>
            </tr>
        </table>        
      </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="saveProcess()">{{'common.save' | translate}}</button>
    </div>
  </div>
