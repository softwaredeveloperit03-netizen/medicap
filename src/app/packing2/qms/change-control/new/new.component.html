<div class="container-fluid">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Change Control Form</div>
        <div class="clr-col-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/packing/qms/change-control" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #changecontrol="ngForm">
          <div class="clr-row">
            <div class="clr-col-md-12 clr-col-12">
              <label><strong>Change Classification:</strong></label>
              <div class="clr-control-container clr-control-inline">
                <div class="clr-checkbox-wrapper" *ngFor="let class of classifications; let i = index">
                  <input class="clr-checkbox" id="{{class.particular}}" [(ngModel)]="class.value"   (change)="updateClass($event.target.checked, i)" type="checkbox" name="{{class.particular}}">
                  <label for="{{class.particular}}" class="clr-control-label">{{class.particular}}</label>
                </div>
              </div>
            </div>
            <div class="clr-col-md-12 clr-col-12">
              <label><strong>Change Related To:</strong></label>
              <div class="clr-control-container clr-control-inline">
                <div class="clr-checkbox-wrapper" *ngFor="let change of change_related; let i = index">
                  <input class="clr-checkbox" id="{{change.particular}}" [(ngModel)]="change.value"   (change)="updateChange($event.target.checked, i)" type="checkbox" name="change.particular">
                  <label for="{{change.particular}}" class="clr-control-label">{{change.particular}}</label>
                </div>
              </div>
            </div>
            <div class="clr-col-lg-4 clr-col-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Change Title:</strong></label>
              <input type="text" name="change_title" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Existing Procedure:</strong></label>
              <input type="text" name="existing_procedure" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Proposed Change:</strong></label>
              <input type="text" name="proposed_change" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Reason For Changes:</strong></label>
              <input type="text" name="reason_for_changes" ngModel required>
            </div>

            <div class="clr-col-lg-4 clr-col-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Change in Interlinked Documents:</strong></label>
              <input type="text" name="change_interlinked" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Product Name:</strong></label>
              <input type="text" name="product_name" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Medicap Lot No:</strong></label>
              <input type="text" name="batch_no" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Market Details:</strong></label>
              <div class="clr-control-container clr-control-inline">
                <div class="clr-checkbox-wrapper" *ngFor="let market of market_details ; let i = index">
                  <input class="clr-checkbox" id="{{market.particular}}" [(ngModel)]="market.value"   (change)="updateMarket($event.target.checked, i)" type="checkbox" name="market.particular">
                  <label for="{{market.particular}}" class="clr-control-label">{{market.particular}}</label>
                </div>
              </div>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Probable Impact on Quality of Product:</strong></label>
              <select name="impact_quality" ngModel="No" (change)="checkImpactQuality($event.target.value)" required>
                <option>Yes</option>
                <option>No</option>
              </select>
            </div>
            <div class="clr-col-lg-4 clr-col-4 clr-col-sm-12 clr-col-xs-12" *ngIf="isImpactQuality">
              <label><strong>Description:</strong></label>
              <textarea rows="2" name="description" ngModel required></textarea>
            </div>
            <div class="clr-col-lg-4 clr-col-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Department Head Comment:</strong></label>
              <input type="text" name="da_comment" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Proposal:</strong></label>
              <select name="proposal" ngModel required>
                <option></option>
                <option>Recommended</option>
                <option>non Recommended </option>
              </select>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Category of the Changes:</strong></label>
              <select name="changes_category" ngModel required>
                <option></option>
                <option>Major</option>
                <option>Minor</option>
                <option>Critical</option>
              </select>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Level of CC for Approval:</strong></label>
              <select name="cc_level" ngModel required>
                <option></option>
                <option>Level 1</option>
                <option>Level 2</option>
                <option>Level 3</option>
              </select>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Information Send to Customer:</strong></label>
              <select name="information_customer" ngModel required>
                <option></option>
                <option>Yes</option>
                <option>No</option>
                <option>NA</option>
              </select>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Market Approval Required:</strong></label>
              <select name="market_approval" ngModel required>
                <option></option>
                <option>Yes</option>
                <option>No</option>
                <option>NA</option>
              </select>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Validation Required:</strong></label>
              <select name="validation_required" ngModel required>
                <option></option>
                <option>Yes</option>
                <option>No</option>
                <option>NA</option>
              </select>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Review & Comments:</strong></label>
              <input type="text" name="comments" ngModel required>
            </div>
          </div>
        </form>
        <div class="clr-row">
          <div class="clr-col-md-12 clr-col-12">
            <label>Departments for Review:</label>
            <div class="clr-control-container clr-control-inline">
              <div class="clr-checkbox-wrapper" *ngFor="let order of departments; let i = index">
                <input class="clr-checkbox" id="{{order.department_name}}" type="checkbox"
                  name="{{order.department_name}}" [(ngModel)]="order.value"
                  (change)="updateDept($event.target.checked, i)">
                <label for="{{order.department_name}}" class="clr-control-label">{{order.department_name}}</label>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="saveForm(changecontrol)">{{'common.submit' | translate}}</button>
      <button class="btn btn-danger" routerLink="../dashboard">{{'common.close' | translate}}</button>
    </div>
  </div>
</div>
