<div class="card" > 
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> New Water Tank Sanitization</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-danger" routerLink="/engineering/water">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
   <div class="card-block">
    <form #sanetization="ngForm">
        <div class="clr-row">
            <div class="clr-col-lg-4 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                <label>Area:</label>
                <select name="location" ngModel required  (change)="getTankName($event.target.selectedIndex)" > 
                    <option></option>
                    <option *ngFor="let res of results">{{res.location}}</option>
                </select>
            </div>
            <div class="clr-col-lg-4 clr-col-md-5 clr-col-sm-12 clr-col-xs-12">
                <label>Tank No:</label>
                <select name="tank_no" ngModel required (change)="getCapacity($event.target.selectedIndex)" >
                    <option></option>
                    <option *ngFor="let name of tank_names">{{name.tank_name}}</option>
                </select>
            </div>
            <div class="clr-col-lg-4 clr-col-md-2 clr-col-sm-12 clr-col-xs-12" >
                <label>Sanetization Frequency:</label>
                <input type="text" name="sanetization_frequency" [(ngModel)]="sanitization_frequency" readonly required>
            </div>
            <div class="clr-col-lg-4 clr-col-md-2 clr-col-sm-12 clr-col-xs-12" >
                <label>Capacity:</label>
                <input type="text" name="Capacity" [(ngModel)]="capacity" readonly required>
            </div>
            <div class="clr-col-lg-4 clr-col-md-5 clr-col-sm-12 clr-col-xs-12">
                <label>Cleaning Done By:</label>
                <select name="cleaning_by" [(ngModel)]="cleaning_by" required>
                    <option></option>
                    <option *ngFor="let labour of labours">{{labour.labour_name}}</option>
                </select>
            </div>  
            <div class="clr-col-lg-4 clr-col-md-5 clr-col-sm-12 clr-col-xs-12">
                <label>Supervised By:</label>
                <select name="supervised_by" ngModel required>
                    <option></option>
                    <option *ngFor="let emp of persons">{{emp.firstname}}</option>
                </select>
            </div>
            <div class="clr-col-lg-4 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                <label>Cleaning Agent Used:</label>
                <input type="text" name="cleaning_agent" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                <label>Cleaning Start Time:</label>       
                <button style="margin-left: 20px;" (click)="startTime()" class="btn btn-primary">Start</button>
                <input type="time" name="start_time"  [(ngModel)]="start" required>
                
            </div>
            <div class="clr-col-lg-4 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                <label>Cleaning Stop Time:</label>       
                <button style="margin-left: 20px;"  (click)="stopTime()"  class="btn btn-primary">Stop</button>
                <input type="time" name="stop_time" [(ngModel)]="stop" required>

            </div>
        </div>
        <table class="table">
            <tr>
                <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr</th>
                <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.description' | translate}}</th>
                <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.status' | translate}}</th>
                <th>Done By</th>
                
            </tr>
            <tr *ngFor="let list of descriptions;let i = index">
                <td style="text-align: left;">{{i+1}}</td>
                <td style="text-align: left;">{{list.description}}</td>
                <td style="text-align:left;padding: 0px;width:25%"><input type="text" name="status{{i}}" [(ngModel)]="list.status" style="margin: 0px;" required></td>
                <td style="width:25%">{{ sanetization.value.cleaning_by }}</td>
            </tr>
        </table>
    </form> 
    </div> 
    <div class="card-footer"><!-- (click)="saveTankSanitization()" -->
    <button class="btn btn-primary" (click)="saveTankSanitization(sanetization)">{{'common.save' | translate}}</button>
    </div>
</div>
