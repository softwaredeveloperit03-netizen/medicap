<div class="card">
    <div class="card-header">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-8" style="color: aliceblue;margin-top: -2px;text-align: left;">Wfi system Logbook</div>
            <div class="clr-col-lg-4" style="text-align: right;padding-right: 0px;margin-top: -7px;">
              <!-- <button *ngIf="isuser == 'Yes'" class="btn btn-sm" (click)="isNew=true" style="background-color: green;color: white;">
                New
              </button> -->
              <button class="btn btn-sm" routerLink="/engineering/water" style="background-color: red;color: white;">
                <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
              </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #temp="ngForm">
                <table class="table table-border">
                    <tr>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr No</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.date' | translate}}</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Time</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Activity/Comments</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Checked By</th>

                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.table.action' | translate}}</th>
                    </tr>
                    <tr>
                        <th style="padding: 0px;vertical-align: middle;">0</th>
                        <th style="padding: 0px;vertical-align: middle;">
                            <input   ngModel required name="date" type="date" >

                        </th>
                        <th> 
                            <input ngModel required name="time" type="time">
                        </th>
                        <th> 
                            <input ngModel required name="activity" type="text">


                     </th>  
                     <th></th>                   
                        <th style="padding: 0px;vertical-align: middle;">
                        <button  class="btn btn-sm btn-info"  (click)="add(temp)">{{'common.add' | translate}}</button></th>
                    </tr>
                    <tr *ngFor="let checkpoint of result; let i = index">
                        <td>{{i+1}}.</td>
                        <td  style="text-align: left;">{{checkpoint.date }}</td>
                        <td style="text-align: left;">{{checkpoint.time }}</td>
                        <td style="text-align: left;">{{checkpoint.activity }}</td>
                         <td style="text-align: left;">{{checkpoint.entry_by }}</td>
                         <td>
                            <button class="btn btn-sm btn-danger-outline btn-icon" (click)="del(i)">
                                <clr-icon shape="trash" class="is-error"></clr-icon>
                            </button>
                        </td>
  
                    </tr>
                </table>
            </form>
        </div>
     </div>
</div>
