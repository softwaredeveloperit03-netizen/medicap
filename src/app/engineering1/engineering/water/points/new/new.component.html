<div class="container-fluid">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Water Points </div>
              <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/engineering/water/points" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
              </div>
            </div>
          </div>
        <div class="card-block">
            <div class="card-text">
                <form #waterForm="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-6 clr-col-xs-12">
                            <label>Point Type:</label>
                            <select name="point_type" ngModel required>
                                <option></option>
                                <option >Description Point</option>
                                <option >System Point</option>
                                <option >User Point</option>
                               
                            </select>
                        </div>
                        <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-6 clr-col-xs-12">
                            <label>Point Name:</label>
                            <input type="text" name="point_name" ngModel required>
                        </div>
                        <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-6 clr-col-xs-12">
                            <label>Point no:</label>
                            <input type="text" name="point_no" ngModel required>
                        </div>
                        <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-6 clr-col-xs-12">
                            <label>Department:</label>
                            <select name="department" ngModel (change)="getDetails($event.target.selectedIndex)" required>
                                <option></option>
                                <option *ngFor="let result of results; let i = index">{{result.department_name}}</option>       
                            </select>
                        </div>
                        <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-6 clr-col-xs-12">
                            <label>Room Name:</label>
                            <select name="section" ngModel required>
                                <option></option>
                                <option *ngFor="let result of selectedResult['sections']; let i = index">{{result.section_name}}</option>      
                            </select>
                        </div>
                        <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-6 clr-col-xs-12">
                            <label>Water For:</label>
                            <select name="water_for" ngModel required>
                                <option></option>
                                <option>Process</option>
                                <option>Cleaning</option>
                              
                               
                            </select>
                        </div>
                        <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-6 clr-col-xs-12">
                            <label>Water Type:</label>
                            <select name="water_type" ngModel required>
                                <option>Non-potable water</option>
                                <option>Potable water</option>
                                <option>Water For Injection</option>
                                <option>Sterile water for injection</option>
                                <option>Bacteriostatic Water For Injection</option>
                                <option>Sterile water for Irrigations</option>
                                <option>Purified water</option>
                                <option>Raw water</option>
                                <option> RO water</option>
                                <option>Potable water</option>
                                <option>Boiled feed water</option>
                            </select>
                            <!-- <select name="water_type" ngModel (change)="add_waterType($event.target.value)">
                                <option></option>
                                <option *ngFor="let dustNO of waterTYPE">{{dustNO.floor}} </option>
                                <option style="color:red">Add New </option>
                            </select> -->
                        </div>

                            <label>Frequency:</label>
                            <select name="frequency" [(ngModel)]="frequency" required>

                            </select>
                        </div> -->

                            </select>
                        </div>
                        <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-6 clr-col-xs-12" *ngIf="frequency == 'once in a month'">

                            <select name="day" ngModel required>
                                <option>1</option>

                        <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-6 clr-col-xs-12">
                            <label>testing Type:</label>
                            <select name="testing_type" ngModel required>
                                <option>Chemical</option>
                                <option>Microbiology</option>       
                            </select>
                        </div>
                    
                     
                    </div>
                </form>    
            </div>
        </div>
       <div class="card-footer">
         <button class="btn btn-primary"(click)='save(waterForm)'>{{'common.save' | translate}}</button>
    </div>
</div>
