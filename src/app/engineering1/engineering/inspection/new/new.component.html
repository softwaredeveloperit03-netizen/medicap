<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
                <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Ongoing Inspection  </div>
                <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/engineering/inspection" style="background-color: red;color: white;">
                    <!-- <clr-icon shape="window-close" class="is-solid"></clr-icon>--> CLOSE 
                </button>
                </div>
            </div>
      </div>
      <div class="card-block">
        <div class="card-text">
          <form #inspection="ngForm">
            <div class="clr-row">
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Department:</label>
                <select name="department" ngModel required (change)="getEquipments($event.target.value)">
                  <option></option>
                  <option *ngFor="let department  of departments">{{ department.department_name }}</option>
                </select>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Equipment Type:</label>
                <select name="equipment_type" ngModel required (change)="getEquipmentNames($event.target.selectedIndex)">
                  <option></option>
                  <option *ngFor="let equipment of equipment_types">{{ equipment.equipment_type }}</option>
                </select>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Equipment   Name:</label>
                <select name="equipment_name" ngModel (change)="getEquipmentIds($event.target.selectedIndex)" required>
                  <option></option>
                  <option *ngFor="let equipment of equipment_names">{{ equipment.equipment_name }}</option>
                </select>
              </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <label>Equipment ID:</label>
                  <select name="equipment_code" ngModel required>
                    <option></option>
                    <option *ngFor="let equipment of equipments">{{ equipment.equipment_code }}</option>
                  </select>
                </div>
                <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-6 clr-col-xs-12">
                  <label>Done By:</label>
                  <select name="done_by" ngModel required>
                    <option></option>
                    <option *ngFor="let person of persons" [value]="person.emp_id">{{ person.emp_name}}</option>
                  </select>
                </div>
            </div>
          </form>
            <h4>Checkpoints:</h4>
            <form #checkpoint="ngForm">
              <table class="table">
                <tr>
                  <th style="text-align: left;">Sr</th>
                  <th style="text-align: left;">CheckPoint</th>
                  <th style="text-align: left;">{{'common.status' | translate}}</th>
                  <th style="text-align: left;">{{'common.table.remark' | translate}}</th>
                  <th style="text-align: left;">{{'common.table.action' | translate}}</th>
                </tr>
                <tr>
                  <th style="text-align: left;">0.</th>
                  <td style="text-align: left;padding:0px;">
                    <input type="text" name="checkpoint" ngModel required style="margin: 0px;height:33px">
                  </td>
                  <td style="text-align: left;padding:0px;">
                    <select name="status" ngModel required  style="margin: 0px;">
                      <option>Ok</option>
                      <option>Not Ok</option>
                    </select>
                  </td>
                  <td style="text-align: left;padding:0px;">
                    <input type="text" name="remark" ngModel required style="margin: 0px;height:33px">
                  </td>
                  <td style="text-align: left;padding:0px;">
                    <button class="btn btn-info btn-sm"(click)="add(checkpoint)">{{'common.add' | translate}}</button>
                  </td>
                </tr>
                <tr *ngFor="let result of checkpoints;let i=index">
                  <td style="text-align: left;">{{i+1}}</td>
                  <td style="text-align: left;">{{result.checkpoint}}</td>
                  <td style="text-align: left;">{{result.status}}</td>
                  <td style="text-align: left;">{{result.remark}}</td>
                  <td style="text-align: left;padding:0px;"><button class="btn btn-sm"(click)="del(i)">{{'common.delete' | translate}}</button></td>
                </tr>
              </table>
            </form>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary"(click)="save(inspection)">{{'common.save' | translate}}</button>
      </div>
    </div>
  </div>
