<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
                <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Insectocutor Cleaning Record </div>
                <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/engineering/insectocutor" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
                </div>
            </div>
      </div>
      <div class="card-block">
        <div class="card-text">
          <form #insecure="ngForm">
            <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Date:</label>
                    <input type="date" name="date" ngModel required >
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Department:</label>
                    <select name="department" [(ngModel)]="departments" (change)="newSection($event.target.value)">
                    <option></option>
                    <option *ngFor="let section of departments">{{ section.department_name }}</option>
                    </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Area:</label>
                    <select name="section" [(ngModel)]="section" (change)="newSection($event.target.value)">
                    <option></option>
                    <option *ngFor="let section of sections">{{ section.section_name }}</option>
                    <option style="color:red">ADD NEW</option>
                    </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-6">
                    <label> Equipment Type</label>
                    <select name="equipment_type" ngModel  (change)="getEquipment($event.target.selectedIndex)" required>
                        <option></option>
                        <option *ngFor="let eq of equipments;" value="eq.equipment_type">{{ eq.equipment_type}}</option>
                    </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-6">
                    <label> Equipment Name</label>
                    <select name="equipment_name" (change)="getEquipmentId($event.target.selectedIndex)" ngModel required>
                        <option></option>
                        <option *ngFor="let product of equipment_names;">{{product.equipment_name}}</option>
                    </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-6">
                    <label> Equipment Code</label>
                    <select name="equipment_code" ngModel  required>
                        <option></option>
                        <option *ngFor="let product of equipment_ids;">{{ product.equipment_code }}</option>
                    </select>   
                </div>
                <div class="clr-col-lg-6 clr-col-md-6">
                    <label>Start Time:</label>
                    <button class="btn btn-sm" (click)="getCurrentTime()">START</button>
                    <input type="time" name="dispensing_from" [(ngModel)]="start_time"  style="width: 50%;padding: 0px;" readonly tabindex="-1">
                </div>
                <div class="clr-col-lg-6 clr-col-md-6">
                    <label>End Time:</label>
                    <button class="btn btn-sm btn-danger-outline" (click)="getEndTime()">STOP</button>
                    <input type="time" name="dispensing_to" [(ngModel)]="end_time" style="width: 50%;padding: 0px;" readonly tabindex="-1">
                </div>
                <div class="clr-col-lg-4 clr-col-md-6">
                    <label>Cleaned By:</label>
                    <select name="cleaned by" ngModel  required>
                        <option></option>
                        <option></option>
                    </select>
                </div>
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                    <label>Observation:</label>
                    <textarea name="observation" ngModel required></textarea>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Insect Count:</label>
                    <input type="number" name="count" ngModel required>
                </div>
            </div>
          </form>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="saveInsecure(insecure)">{{'common.submit' | translate}}</button>
      </div>
    </div>
  </div>
  
  
    
<clr-modal [(clrModalOpen)]="isNewLocation">
  <h3 class="modal-title">Add New Area</h3>
  <div class="modal-body">
    <form #areaForm="ngForm">
      <div class="clr-row">
        <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
          <label>Area Name:</label>
          <input type="text" name="area" [(ngModel)]="area" required>
        </div>
      </div>
    </form>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline" (click)="saveArea(areaForm)">{{'common.save' | translate}}</button>
  </div>
</clr-modal>
