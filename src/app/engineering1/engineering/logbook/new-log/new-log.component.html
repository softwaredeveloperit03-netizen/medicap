
<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Reports</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-danger" routerLink="/engineering/logbook"> {{'common.close' | translate}} </button>
        </div>
      </div>
    </div>
 

<div class="card-block">
    <div class="card-text">
      <div class="clr-row">
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
          <label>Department Name:</label>
          <select name="dept_report" [(ngModel)]="dept_report" required>
            <option></option>
            
          </select>
          </div>
          <div class="clr-col-lg-3">
            <label>Equipment Name:</label>
            <select name="equip_report" [(ngModel)]="equip_report">
              <option></option>
              
            </select>
          </div>
       </div>
    </div>  
</div> 
</div>
