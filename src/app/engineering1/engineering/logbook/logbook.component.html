<div class="card">
    <div class="card-header">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-8" style="color: aliceblue;margin-top: -2px;text-align: left;">Engineering Logbook</div>
            <div class="clr-col-lg-4" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button *ngIf="isuser == 'Yes'" class="btn btn-sm" routerLink="../newlog"
                    style="background-color: green;color: white;">
                    New
                </button>
                <button class="btn btn-sm" routerLink="/engineering" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <div class="card-text">
                <!-- <div class="clr-row">
                    <div class="clr-clo-lg-4 clr-col-md-4 clr-col-sm-4">
                        <label>From Date:</label>
                        <input type="date" name="from_date" [max]="to_date" [(ngModel)]="from_date">
                    </div>
                    <div class="clr-clo-lg-4 clr-col-md-4 clr-col-sm-4">
                        <label>To Date:</label>
                        <input type="date" name="to_date" [(ngModel)]="to_date" [min]="from_date" [max]="today">
                    </div>
                    <div class="clr-clo-lg-4 clr-col-md-4 clr-col-sm-4">
                        <button class="btn btn-danger" (click)="getHdpe()" style="margin-top: 27px;">{{'common.search' | translate}}</button>
                    </div>
                </div> -->
                <form #formData="ngForm">
                    <clr-datagrid [clrDgLoading]="loading">

                        <clr-dg-column clrDgField="department">{{'common.department' | translate}}</clr-dg-column>
                        <clr-dg-column clrDgField="equip_name">Equipment Name</clr-dg-column>
                        <clr-dg-column clrDgField="id">ID</clr-dg-column>
                        <clr-dg-column>View</clr-dg-column>
                        <!-- <clr-dg-column>{{'common.table.remark' | translate}}</clr-dg-column> -->



                        <clr-dg-row *clrDgItems="let result of results; let i = index" [clrDgItem]="result">
                            <clr-dg-cell>{{result.department}}</clr-dg-cell>
                            <clr-dg-cell>{{result.equip_name}}</clr-dg-cell>
                            <clr-dg-cell>{{result.id}}</clr-dg-cell>
                            <clr-dg-cell>{{result.view}}</clr-dg-cell>
                            <!-- <clr-dg-cell style="text-align:left;">{{result.remark}}</clr-dg-cell> -->
                            <clr-dg-cell>
                                <button class="btn btn-sm btn-info" (click)="view(i)">{{'common.view' | translate}}</button>
                            </clr-dg-cell>
                        </clr-dg-row>

                        <clr-dg-footer>
                            <clr-dg-pagination #pagination [clrDgPageSize]="10">
                                <clr-dg-page-size [clrPageSizeOptions]="[10,20,50,100]">Users per page
                                </clr-dg-page-size>
                                {{pagination.firstItem + 1}} - {{pagination.lastItem + 1}}
                                of {{pagination.totalItems}}Digital
                            </clr-dg-pagination>
                        </clr-dg-footer>
                    </clr-datagrid>
                </form>
            </div>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button>
    </div>
</div>
