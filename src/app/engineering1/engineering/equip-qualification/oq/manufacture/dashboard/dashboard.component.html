<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue; margin-top: -2px; text-align: left;">
                Utility Functions
            </div>
            <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/engineering/equip-qualification/oq"
                    style="background-color: red; color: white;">
                    CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #utilityForm="ngForm">
                <table class="table table-border">
                    <thead>
                        <tr>
                            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr.</th>
                            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Utility
                                Supplied</th>
                            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Function
                                Assigned</th>
                            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Actual
                                Observation</th>
                            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.table.remark' | translate}}</th>
                            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.table.action' | translate}}</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td></td>
                            <td style="padding: 0px;">
                                <input type="text" name="utility" ngModel required style="margin: 0px;" />
                            </td>
                            <td style="padding: 0px;">
                                <input type="text" name="fun_ass" ngModel required style="margin: 0px;" />
                            </td>
                            <td style="padding: 0px;">
                                <input type="text" name="actual_obs" ngModel required style="margin: 0px;" />
                            </td>
                            <td style="padding: 0px;">
                                <input type="text" name="remark" ngModel required style="margin: 0px;" />
                            </td>
                            <td style="padding: 0px; vertical-align: middle;">
                                <button class="btn btn-sm btn-info" (click)="addData(utilityForm)"
                                    [disabled]="!utilityForm.valid">
                                    Add
                                </button>
                            </td>
                        </tr>
                        <tr *ngFor="let result of utilityList; let i = index">
                            <td>{{ i + 1 }}.</td>
                            <td>{{ result.utility }}</td>
                            <td>{{ result.fun_ass }}</td>
                            <td>{{ result.actual_obs }}</td>
                            <td>{{ result.remark }}</td>
                            <td>
                                <clr-icon shape="trash" class="is-error" (click)="delData(result.id)" title="Delete"></clr-icon>
                            </td>
                        </tr>
                        <tr *ngIf="utilityList.length === 0">
                            <td colspan="6" style="text-align: center;">{{'common.noRecords' | translate}}</td>
                        </tr>
                    </tbody>
                </table>
            </form>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="download()" [disabled]="utilityList.length === 0">
            Download
        </button>
    </div>
</div>
