<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">System Description</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qa/equip-qualification/iq/documentation"
                    style="background-color: red;color: white;">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #systemForm="ngForm">
                <table class="table table-border">
                    <tr>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr.</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Document List</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">File Upload</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.table.action' | translate}}</th>
                    </tr>
                    <tr>
                        <td></td>
                        <td style="padding:0px;">
                            <!-- <input type="text" name="document_list" ngModel required style="margin:0px;"> -->
                            <select name="document_name" ngModel required style="margin:0px;">
                                <option ></option>
                                <option >Operation and Maintenance Manual</option>
                                <option >MOC certificate </option>
                                <option >Operating Manual</option>
                                <option >Drawings</option>
                                <option >Electrical Wiring Diagram</option>
                                <option >AHU Drawing</option>
                                <option >Test report and certificates </option>
                                <option >GA drawing</option>
                                <option >Calibration certificates</option>
                                <option >Ducting Drawing</option>
                                <option >Air Flow Schematic</option>


                            </select>
                        </td>
                        <td style="padding:0px;">
                            <input type="file" name="file_upload" ngModel required style="margin:0px;">
                        </td>

                        <td style="padding: 0px; vertical-align: middle;">
                            <button class="btn btn-sm btn-info" (click)="addData(systemForm)">{{'common.add' | translate}}</button>
                        </td>
                    </tr>
                    <tr *ngFor="let result of documentList; let i =  index;">
                        <td>{{i+1}}.</td>
                        <td>{{result.document_name}}</td>
                        <td>{{result.file_upload}}</td>
                        <td>
                            <clr-icon shape="trash" class="is-error" (click)="delData(i)"></clr-icon>
                        </td>
                    </tr>
                    <tr *ngIf="results?.length == 0">
                        <td colspan="3">{{'common.noRecords' | translate}}</td>
                    </tr>
                </table>
            </form>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="save()">{{'common.save' | translate}}</button>
            <button class="btn btn-danger" routerLink="/qa/equip-qualification/iq/documentation">{{'common.close' | translate}}</button>
        </div>
</div>
