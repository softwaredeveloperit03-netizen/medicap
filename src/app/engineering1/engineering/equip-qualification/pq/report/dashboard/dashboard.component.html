


 <div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Performance Report </div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/engineering/equip-qualification/pq" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #reportForm="ngForm">
            <table class="table table-border">
                <tr>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr.</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Test</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Observation</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Checked By Engg.</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Verified By QA</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Reports</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.table.action' | translate}}</th>

                </tr>
                <tr>
                    <td></td>
                    <td style="padding:0px;">
                        <input type="text" name="text" ngModel required style="margin:0px;">
                    </td>
                    <td style="padding:0px;">
                        <input type="text" name="observation" ngModel required style="margin:0px;">
                    </td>
                    <td style="padding:0px;">
                        <input type="text" name="check" ngModel required style="margin:0px;">
                    </td>
                    <td style="padding:0px;">
                        <input type="text" name="verified" ngModel required style="margin:0px;">
                    </td>
                    <td style="padding:0px;">
                        <input type="text" name="report" ngModel required style="margin:0px;">
                    </td>
                    <td style="padding: 0px; vertical-align: middle;">
                        <button class="btn btn-sm btn-info" (click)="addData(reportForm)">{{'common.add' | translate}}</button>
                    </td>
                </tr>
                <tr *ngFor="let result of reportList; let i = index">
                    <td>{{i+1}}.</td>
                    <td>{{result.text}}</td>
                    <td>{{result.observation}}</td>
                    <td>{{result.check}}</td>
                    <td>{{result.verified}}</td>
                    <td>{{result.report}}</td>
                 <td>
                    <clr-icon shape="trash" class="is-error" (click)="delData(result.id)"></clr-icon>
                </td>
                </tr>
                <tr *ngIf="reportList?.length == 0">
                    <td colspan="6">{{'common.noRecords' | translate}}</td>
                </tr>
            </table>
        </form>
        </div>
    </div>
    <div class="card-footer">
        <div class="card-footer"><button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button></div>
      </div>
</div>
