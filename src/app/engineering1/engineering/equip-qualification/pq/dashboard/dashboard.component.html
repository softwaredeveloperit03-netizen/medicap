<div class="component eng-legacy-dash">
    <div class="subsection">
      <div class="purchase-block" >
        <div style="text-align:end" class="exit-section">
          <div class="header-block" style="margin:10px 0px">
            <h3>Performance Qualification</h3>
          <div routerLink="/engineering/equip-qualification" class="name-board2"><i class="fas fa-times"></i>
          </div>
        </div>
  
        <div class="main-section" style="margin: 0px 10px 10px 10px !important;">
          <div class="category">
            <div class="line-section">
              <div class="header-div">
                <h3>Performance Qualification Section</h3>
              </div>
            </div>
            <div class="block-container" style="    
            display: grid;
            grid-template-columns: repeat(6, 150px);
            grid-gap: 35px;
            overflow-x: auto;
            max-width: 100%;">
                <div class="item-block" *ngIf="ischecker == 'Yes'" routerLink="checklist">
                    <i class="fas fa-clipboard-check"></i> <!-- Font Awesome icon for Performance Check -->
                    <span>Performance Check</span>
                </div>
                
                <div class="item-block" routerLink="performace">
                    <i class="fas fa-chart-line"></i> <!-- Font Awesome icon for Performance Criteria -->
                    <span>Performance Criteria</span>
                </div>
                
                <div class="item-block" *ngIf="ischecker == 'Yes'" routerLink="environment">
                    <i class="fas fa-globe"></i> <!-- Font Awesome icon for Environment Checks -->
                    <span>Environment Checks</span>
                </div>
                
                <div class="item-block" routerLink="variable">
                    <i class="fas fa-balance-scale"></i> <!-- Font Awesome icon for Variable To Be Met -->
                    <span>Variable To Be Met</span>
                </div>
                
                <div class="item-block" routerLink="documents">
                    <i class="fas fa-file-alt"></i> <!-- Font Awesome icon for Material Use -->
                    <span>Material Use</span>
                </div>
                
                <div class="item-block" routerLink="procedure">
                    <i class="fas fa-tasks"></i> <!-- Font Awesome icon for Procedure -->
                    <span>Procedure</span>
                </div>
                
                <div class="item-block" routerLink="report">
                    <i class="fas fa-file-chart-line"></i> <!-- Font Awesome icon for Performance Report -->
                    <span>Performance Report</span>
                </div>
                
                
                        
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
