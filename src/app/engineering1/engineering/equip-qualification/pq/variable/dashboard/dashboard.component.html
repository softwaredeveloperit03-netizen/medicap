


 <div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Variable To Be Met </div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/engineering/equip-qualification/pq" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #metForm="ngForm">
            <table class="table table-border">
                <tr>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr.</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Variables </th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Acceptance criteria</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Observation</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.table.action' | translate}}</th>
                </tr>
                <tr>
                    <td></td>
                    <td style="padding:0px;">
                        <input type="text" name="variable" ngModel required style="margin:0px;">
                    </td>
                    <td style="padding:0px;">
                        <input type="text" name="criteria" ngModel required style="margin:0px;">
                    </td>
                    <td style="padding:0px;">
                        <input type="text" name="observation" ngModel required style="margin:0px;">
                    </td>
                    <td style="padding: 0px; vertical-align: middle;">
                        <button class="btn btn-sm btn-info" (click)="addData(metForm)">{{'common.add' | translate}}</button>
                    </td>
                </tr>
                <tr *ngFor="let result of metList; let i = index">
                    <td>{{i+1}}.</td>
                    <td>{{result.variable}}</td>
                    <td>{{result.criteria}}</td>
                    <td>{{result.observation}}</td>
                 <td>
                    <clr-icon shape="trash" class="is-error" (click)="delData(result.id)"></clr-icon>
                </td>
                </tr>
                <tr *ngIf="metList?.length == 0">
                    <td colspan="6">{{'common.noRecords' | translate}}</td>
                </tr>
            </table>
        </form>
        </div>
    </div>
    <div class="card-footer">
        <div class="card-footer"><button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button></div>
      </div>
</div>
