<div class="card" *ngIf="!isView">
    <div class="card-header">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-8" style="color: aliceblue;margin-top: -2px;text-align: left;">Eurotherm Database Log</div>
            <div class="clr-col-lg-4" style="text-align: right;padding-right: 0px;margin-top: -7px;">
              <button  class="btn btn-sm"  *ngIf="isuser == 'Yes'" (click)="isNew=true" style="background-color: green;color: white;">
                New
              </button>
              <button class="btn btn-sm" routerLink="/engineering" style="background-color: red;color: white;">
                <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
              </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #formData="ngForm">
                
                <table class="table table-border">
                    <tr>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr No</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.date' | translate}}</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Recorder</th> 
                    </tr>
                    <tr *ngFor="let checkpoint of result; let i = index">
                       
                   
                        <td>{{i+1}} </td>
                        <td  style="text-align: left;">{{ checkpoint.date }}</td>
                        <td style="text-align: left;">{{ checkpoint.recorder }}</td> 

                       
                    
  
                    </tr>
                </table>
                

            </form>
        </div>
        </div>
     </div>

     <clr-modal [(clrModalOpen)]="isNew" [clrModalSize]="'xl'" >
        <h3 class="modal-title">Eurotherm Database</h3>
        <div class="modal-body">
            <form #temp="ngForm">
                <div class="clr-row">
                    <div class="clr-col-4">
                        <label>{{'common.date' | translate}}</label>
                       <input type="date" name="date"  ngModel required> 
                    </div>
                    <div class="clr-col-4">
                        <label>Recorder</label>

                        <select  name="recorder" [(ngModel)]="selectedRecord" ngModel>
                            <option>Wfi</option>
                            <option>Stability Chamber</option>
                            </select>
                    </div>
                </div>
                    <div class="clr-row" *ngIf="selectedRecord=='wfi'">
                        <div class="clr-col-4">
                          <label>Wfi Weekly Date</label>
                
                           <input type="date" name="wfi_date" ngModel required> 
                        </div>

                        <div class="clr-col-4">
                         <label>Wfi Weekly Time</label>
                         <input type="time" name="wfi_time" ngModel required> 
                        </div>

                        <div class="clr-col-4">
                          <label>wfi latest date</label>
                         <input type="date" name="wfi_latest_data" ngModel required>
                        </div>

                      <div class="clr-col-4">
                        <label>wfi latest time</label>
                        <input type="time" name="wfi_latest_time" ngModel required> 
                      </div>

                      <div class="clr-col-4">
                        <label>wfi latest data 24old</label>
                        <input type="text" name="wfi_old_data" ngModel required>
                      </div>


                      <div class="clr-col-4">
                        <label>wfi Chart Continuous Since Last Check?</label>
                         <select  name="check"  ngModel>
                            <option>yes</option>
                            <option>no</option>
                            </select> 
        
                       </div>
                    </div>
                    <div *ngIf="selectedRecord=='wfi'">
                        <label>wfi comment:</label>
                        <textarea name="wfi_comment" rows="3" ngModel ></textarea>

                    </div>

                    <div class="clr-row" *ngIf="selectedRecord=='Stability chamber'">
                        <div class="clr-col-4">
                            <label>stability weekly date</label>
                            <input type="date" name="stability_data" ngModel required> 
                        </div>
                    
                        <div class="clr-col-4">
                            <label>stability weekly time</label>
                            <input type="time" name="stability_time" ngModel required> 
                        </div>
                    
                        <div class="clr-col-4">
                            <label>stability latest date</label>
                            <input type="date" name="stability_latest_data" ngModel required>
                        </div>
                    
                        <div class="clr-col-4">
                            <label>stability latest time</label>
                            <input type="time" name="stability_latest_time" ngModel required> 
                        </div>
                    
                        <div class="clr-col-4">
                            <label>stability latest data 24 old</label>
                            <input type="text" name="stability_old_data" ngModel required>
                        </div>
                    
                        <div class="clr-col-4">
                            <label>stability Chart Continuous Since Last Check?</label>
                            <select name="remark" ngModel>
                                <option>yes</option>
                                <option>no</option>
                            </select> 
                            <!-- <textarea name="Procedure" rows="3" ngModel ></textarea> -->
                        </div>
                    </div>
                    <div *ngIf="selectedRecord=='Stability chamber'">
                        <label>wfi comment:</label>
                        <textarea name="stabilty_comment" rows="3" ngModel ></textarea>

                    </div>
                    


                    
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-primary" (click)="save(temp)">{{'common.save' | translate}}</button>
            <button type="button" class="btn btn-danger" (click)="isNew = false">{{'common.close' | translate}}</button>
          </div>
    </clr-modal>

    <div class="card" *ngIf="isView">
        <div class="card-header">
            <div class="clr-row" style="margin-bottom: -10px;">
                <div class="clr-col-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Eurotherm database log</div>
                <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                  <button class="btn btn-sm btn-danger" (click)="isView = false">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                  </button>
                </div>
            </div>
        </div>
    
    
        <div class="card-block">
            <div class="card-text">
                <div class="clr-row">
                    <div class="clr-col-4">
                        <label>{{'common.date' | translate}}</label>
                       <input type="date" name="date"  ngModel="{{selectedResult['Date']}}" > 
                    </div>
                    <div class="clr-col-4">
                        <label>Recorder Type</label>

                            <input type="text" name="date"  ngModel="{{selectedResult['recorder']}}" > 
                    </div>
                </div>
                    <div class="clr-row" *ngIf="selectedResult['recorder']=='wfi'">
                        <div class="clr-col-4">
                          <label>wfi weekly date</label>
                
                           <input type="date" name="wfi_date" ngModel="{{selectedResult['Wfi_Weekly_date']}}" required> 
                        </div>

                        <div class="clr-col-4">
                         <label>wfi weekly time</label>
                         <input type="time" name="wfi_time" ngModel="{{selectedResult['Wfi_Weekly_time']}}" required> 
                        </div>

                        <div class="clr-col-4">
                          <label>wfi latest date</label>
                         <input type="date" name="wfi_latest_data" ngModel="{{selectedResult['wfi_latest_data']}}" required>
                        </div>

                      <div class="clr-col-4">
                        <label>wfi latest time</label>
                        <input type="time" name="wfi_latest_time" ngModel="{{selectedResult['Wfi_latest_data_time']}}" required> 
                      </div>

                      <div class="clr-col-4">
                        <label>wfi latest data 24old</label>
                        <input type="text" name="wfi_old_data" ngModel="{{selectedResult['Wfi_latest_data_24old']}}" required>
                      </div>


                      <div class="clr-col-4">
                        <label>wfi Chart Continuous Since Last Check?</label>
                        <input type="text" name="wfi_date" ngModel="{{selectedResult['Wfi_chart_check']}}" required> 

        
                       </div>
                    </div>
                    <div  *ngIf="selectedResult['recorder']=='wfi'">
                        <label>wfi comment:</label>
                        <textarea name="wfi_comment" rows="3" ngModel="{{selectedResult[' wfi_comments ']}}" ></textarea>

                    </div>

                    <div class="clr-row"  *ngIf="selectedResult['recorder']=='Stability chamber'">
                        <div class="clr-col-4">
                            <label>stability weekly date</label>
                            <input type="date" name="stability_data"  ngModel="{{selectedResult['stability_weekly_data']}}" required> 
                        </div>
                    
                        <div class="clr-col-4">
                            <label>stability weekly time</label>
                            <input type="time" name="stability_time"  ngModel="{{selectedResult['stability_weekly_time']}}" required> 
                        </div>
                    
                        <div class="clr-col-4">
                            <label>stability latest date</label>
                            <input type="date" name="stability_latest_data"  ngModel="{{selectedResult['stability_latest_data']}}" required>
                        </div>
                    
                        <div class="clr-col-4">
                            <label>stability latest time</label>
                            <input type="time" name="stability_latest_time" ngModel="{{selectedResult['stability_latest_time']}}" required> 
                        </div>
                    
                        <div class="clr-col-4">
                            <label>stability latest data 24 old</label>
                            <input type="text" name="stability_old_data"  ngModel="{{selectedResult['stability_latest_data_24old']}}" required>
                        </div>
                    
                        <div class="clr-col-4">
                            <label>stability Chart Continuous Since Last Check?</label>
                            <input type="text" name="wfi_date" ngModel="{{selectedResult['stability_chart_check']}}" required> 

                            
                            <!-- <textarea name="Procedure" rows="3" ngModel ></textarea> -->
                        </div>
                    </div>
                    <div  *ngIf="selectedResult['recorder']=='Stability chamber'">
                        <label>wfi comment:</label>
                        <textarea name="stabilty_comment" rows="3"  ngModel="{{selectedResult['stabilty_comment']}}"></textarea>

                    </div>
                    
               
                
              
            </div>
        </div>
    </div>
