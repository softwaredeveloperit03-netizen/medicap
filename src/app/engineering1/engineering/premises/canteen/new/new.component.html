<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Canteen Form
            </div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm btn-danger" routerLink="/engineering/premises/canteen">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #canteen="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-12 clr-col-md-12">
                        <label>Floor:</label>
                        <input type="text" name="floor" ngModel required>
                    </div>
                </div>
                <table class="table">
                    <tr>
                        <th style="text-align: left;">Sr</th>
                        <th style="text-align: left;">CheckPoints</th>
                        <th style="text-align: left;">Observation</th>
                        <th style="text-align: left;">Compliance</th>
                        <th style="text-align: left;">Work Completion Date</th>
                    </tr>
                    <tr *ngFor="let list of checkpoints;let i = index">
                        <td style="text-align: left;">{{i+1}}</td>
                        <td style="text-align: left;">{{list.CheckPoints}}</td>
                        <td style="text-align:left;padding: 0px;"><input type="text" name="observation{{i}}" [(ngModel)]="list.observation" style="margin: 0px;" required></td>
                        <td style="text-align:left;padding: 0px;"><input type="text" name="compliance{{i}}" [(ngModel)]="list.compliance" style="margin: 0px;" required></td>
                        <td style="text-align:left;padding: 0px;"><input type="date" name="completion_date{{i}}" [(ngModel)]="list.completion_date" style="margin: 0px;" required></td>
                    </tr>
                </table>
            </form>
        </div>
    </div>
    <div class="card-footer"><button class="btn btn-primary" (click)="saveData(canteen)">{{'common.submit' | translate}}</button></div>
</div>
