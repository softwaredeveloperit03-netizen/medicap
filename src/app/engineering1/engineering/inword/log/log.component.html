<div class="container-fluid" *ngIf="!isView">
    <div class="card">
        <div class="card-header">Inword Log</div>
        <div class="card-block">
            <div class="card-text">
                <table class="table">
                    <tr>
                        <th>Po No</th>
                        <th>Vendor Name</th>
                        <th>Transport Company</th>
                        <th>Vehicle No</th>
                        <th>Packaging Slip</th>
                        <th>{{'common.table.action' | translate}}</th>
                    </tr>
                    <tr *ngFor='let item of inwordlog; let i = index'>
                        <td>{{item.po_no}}</td>
                        <td>{{item.vendor_no}}</td>
                        <td>{{item.transport_company}}</td>
                        <td>{{item.vehicle_no}}</td>
                        <td>{{item.challan_no}}</td>
                        <td>
                            <button class="btn btn-sm btn-info" (click)="view(i)">{{'common.view' | translate}}</button>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</div>


<div class="container-fluid" *ngIf="isView">
    <div class="card">
        <div class="card-header">Inword Log</div>
        <div class="card-block">
            <div class="card-text">
                <div class="clr-row">
                    <div class="clr-col-lg-3">
                        <label>Packaging Slip</label>
                        <input type="text" name="challan_no" [ngModel]="Results['challan_no']" readonly tabindex="-1">
                    </div>
                    <div class="clr-col-lg-3">
                        <label>Challn Date</label>
                        <input type="text" name="challan_date" [ngModel]="Results['challan_date']" readonly tabindex="-1">
                    </div>
                    <div class="clr-col-lg-3">
                        <label>Tax Invoice No</label>
                        <input type="text" name="tax_invoice_no" [ngModel]="Results['tax_invoice_no']" readonly tabindex="-1">
                    </div>
                    <div class="clr-col-lg-3">
                        <label>Driver Name</label>
                        <input type="text" name="driver_name" [ngModel]="Results['driver_name']" readonly tabindex="-1">
                    </div>
                    <div class="clr-col-lg-3">
                        <label>Driver Mobile No</label>
                        <input type="text" name="driver_mobile" [ngModel]="Results['driver_mobile']" readonly tabindex="-1">
                    </div>
                    <div class="clr-col-lg-3">
                        <label>{{'common.status' | translate}}</label>
                        <input type="text" name="status" [ngModel]="Results['status']" readonly tabindex="-1">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
