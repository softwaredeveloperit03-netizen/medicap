<div class="card" >     
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Magnetic Field Monitoring Schedule</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/engineering/gaussmeter" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <form #newForm="ngForm">           
        <div class="card-text">
            <h4>Facility Information</h4>
                <div class="clr-row">
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>facility Name:<span style="color: red;">*</span></label>
                        <input type="text" name="facility_name" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label>Location:<span style="color: red;">*</span></label>
                        <input type="text" name="location" ngModel required>
                </div>
            </div>
        </div>
            <div class="card">
                <div class="card-header" style="text-align: left; color: black; background-color: lightgreen;">Monitoring Schedule</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Schedule Code/ID:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="schedule_id" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Date Of Schedule:<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="schedule_date" ngModel required>
                        </div>
                    </div>
                </div>
                <div class="card-header" style="text-align: left; color: white; background-color: rgb(154, 107, 230);"> Gaussmeter Details </div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Gaussmeter Code/ID:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="gaussmeter_id" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Model:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="model" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Calibration Status:<sup style="color: red">*</sup></strong></label>
                            <select type="text" name="cali_status" ngModel required>
                                <option></option>
                                <option>Calibrated </option>
                                <option>Not Calibrated</option>
                                <option>Calibration Due</option>
                            </select> 
                        </div>
                    </div>
                </div>        
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left;color: black; background-color: rgb(182, 212, 14);"> Monitoring Points</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Point ID/Location:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="point_id" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Equipment/Source:<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="equipment" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Magnetic Field Limit:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="mgnetic_field" ngModel required>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left;color: white; background-color: rgb(212, 103, 14);"> Monitoring Details</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Monitoring Start Time:<sup style="color: red">*</sup></strong></label>
                            <input type="time" name="moni_start_time" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Monitoring End Time:<sup style="color: red">*</sup></strong></label>
                            <input type="time" name="moni_end_time" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Actual Magnetic Field Reading:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="mgnetic_field_reding" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Comments/Notes:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="comments" ngModel required>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header" style="text-align: left;color: white; background-color: rgb(194, 65, 111);"> Review & Approval</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Name Of personnel:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="personnel_name" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Personnel ID/Code:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="personnel_id" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Reviewed By Supervisor/Manager:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="review_by" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Date Of Review:<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="review_date" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Approved By:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="approve_by" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Date Of Approval:<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="approve_date" ngModel required>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
        <div class="card-footer">
            <button class="btn btn-primary"(click)="save(newForm)">{{'common.submit' | translate}}</button>
            <!-- <button class="btn btn-danger"(click)="isNew=false">{{'common.close' | translate}}</button> -->
        </div>
</div>
