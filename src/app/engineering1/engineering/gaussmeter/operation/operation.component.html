<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Test Record</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-danger" routerLink="/engineering/gaussmeter">{{'common.close' | translate}}</button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
    
            <form #report="ngForm">
                <table class="table">
                    <tr>
                        <th>Sr.</th>
                        <!-- <th>Plant Name</th> -->
                        <th>Equipment Code</th>
                        <th>Rod ID.</th>
                        <th> Magnetic field in Gauss</th>
                        <th> Done by   (Engg. Dept.) </th>
                        <th>Checked by (User Dept.)  </th>
                        <th>{{'common.table.action' | translate}}</th>
                    </tr>
                    <tr>
                        <td style="padding: 0px;">1.</td>
                       <!--  <td style="padding: 0px;">
                            <select name="plant_name" [(ngModel)]="plant_name" required style="margin: 0px;">
                                <option> </option>
                                <option *ngFor="let res of plants" [value]="res.unit">{{ res.unit}} </option>
                            </select>
                        </td> -->
                        <td style="padding: 0px;"> <input type="text" name="equipment_code" style="margin: 0px;" ngModel required></td>
                        <td style="padding: 0px;"><input type="text" name="rod_id" ngModel style="margin: 0px;"></td>
                        <td style="padding: 0px;"><input type="text" name="magnetic_field" ngModel style="margin: 0px;"></td>
                        <td style="padding: 0px;"><input type="text" name="done_by" ngModel style="margin: 0px;"></td>
                        <td style="padding: 0px;"><input type="text" name="check_by" ngModel style="margin: 0px;"></td>
                        <td style="padding: 0px;"><button class="btn btn-sm btn-primary" (click)="add(report)" style="margin: 0px;">{{'common.add' | translate}}</button></td>
                    </tr>
                   <tr *ngFor="let res of tests;let i=index">
                        <td> {{ i+1 }}</td>
                        <!-- <td>{{ res.plant_name }} </td> -->
                        <td>{{ res.equipment_code }} </td>
                        <td>{{ res.rod_id }} </td>
                        <td>{{ res.magnetic_field }} </td>
                        <td>{{ res.entry_by}} </td>
                        <td></td>
                        <td>#</td>
                   </tr>
                </table>
            </form>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button>
    </div>
</div>
