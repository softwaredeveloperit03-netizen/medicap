<div class="container-fluid" *ngIf="!isView">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
                <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">List Of Earthing PIT</div>
                <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/engineering/earthing" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
                </div>
            </div>
        </div>
        <div class="card-block">
            <div class="card-text">
                <table class="table">
                    <tr>
                        <th>Sr.</th>
                        <th style="text-align: left;">Id No</th>
                        <th style="text-align: left;">Location</th>
                    </tr>
                    <tr *ngFor="let result of lists; let i = index">
                        <td>{{ i+1 }}.</td>
                        <td style="text-align: left;">{{ result.id_no }}</td>
                        <td style="text-align: left;">{{ result.location}}</td>
                    </tr>
                    <tr *ngIf="lists?.length == 0">
                        <td colspan="9">{{'common.noRecords' | translate}}</td>
                    </tr>
                </table>
            </div>
        </div>
        <div class="card-footer"><button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button></div>
    </div>
</div>
