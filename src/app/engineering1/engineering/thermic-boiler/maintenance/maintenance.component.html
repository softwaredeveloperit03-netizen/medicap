<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Boiler Location</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/engineering" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <form #newForm="ngForm">   
        <div class="card-text">
            <h4>Boiler Details</h4>
           
                <div class="clr-row">
                  <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <label> Boiler Id/Code:<span style="color: red;">*</span></label>
                    <input type="text" name="boiler_code" ngModel required>
                </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label> Location  Name /Identifire:<span style="color: red;">*</span></label>
                        <input type="text" name="l_name" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label> Facility /Building Name:<span style="color: red;">*</span></label>
                        <input type="text" name="f_name" ngModel required>
                    </div>
                    
                     
                </div>
            </div>
            <div class="card">
              <div class="card-header" style="text-align: left; color: black; background-color: lightskyblue;">Boiler Specification</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                          <label><strong> Boiler Type:<sup style="color: red">*</sup></strong></label>
                          <select type="text" name="boiler_type" ngModel>
                              <option></option>
                              <option>Fluid Boiler</option>
                              <option>Steam Boiler</option>
                              <option>Hot Water Boiler</option>
                          </select> 
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Capacity:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="capcity" ngModel>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Manufacturer:<sup style="color: red">*</sup></strong></label>
                            <input type="text" name="mfg" ngModel>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Installation Date:<sup style="color: red">*</sup></strong></label>
                            <input type="date" name="install_date" ngModel>
                        </div>
                    </div>
                </div>
                <div class="card-header" style="text-align: left; color: black; background-color: lightskyblue;"> Safety Feature</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Emergency ShutDown:<sup style="color: red">*</sup></strong></label>
                            <input type="checkbox" name="emg_shutdown" ngModel>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Safecty Value:<sup style="color: red">*</sup></strong></label>
                            <input type="checkbox" name="safty_value" ngModel class="larger-checkbox">
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> Pressure Relief Value:<sup style="color: red">*</sup></strong></label>
                            <input type="checkbox" name="relief_value" ngModel  class="larger-checkbox">
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong> other Safety Features:<sup style="color: red">*</sup></strong></label>
                            <input type="checkbox" name="safty_features" ngModel  class="larger-checkbox">
                        </div>
                    </div>
                </div>         
            </div>
            <div class="card">
              <div class="card-header" style="text-align: left; color: black; background-color: lightskyblue;">operational Status</div>
                <div class="card-block">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>operational:<sup style="color: red">*</sup></strong></label>
                            <input type="checkbox" name="operational" ngModel  class="larger-checkbox">
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Out Of Services:<sup style="color: red">*</sup></strong></label>
                            <input type="checkbox" name="out_service" ngModel  class="larger-checkbox">
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label><strong>Under Maintenance:<sup style="color: red">*</sup></strong></label>
                            <input type="checkbox" name="mentance" ngModel  class="larger-checkbox">
                        </div>
                       
                    </div>
                </div>
                <h4> Inspection & Compliences</h4>
                <div class="clr-row">
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label><strong> Last Inspection Date:<sup style="color: red">*</sup></strong></label>
                        <input type="date" name="inspection_date" ngModel>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Next Inspection Due Date:<sup style="color: red">*</sup></strong></label>
                        <input type="date" name="inspection_due_date" ngModel (change)="onFileChanged3($event)">                    
                      </div>
                      <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                          <label><strong> Compliences Status:<sup style="color: red">*</sup></strong></label>
                          <select type="text" name="compilance_status" ngModel>
                              <option></option>
                              <option> Compilant</option>
                              <option> Non-Compilant</option>
                           </select> 
                        </div>
                        <div *ngIf="compilance_status === 'Compilant'" class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                          <label><strong> Reason:<sup style="color: red">*</sup></strong></label>
                          <input type="text" name="reson" ngModel (change)="onFileChanged3($event)">
                      </div>
                      
                </div>
                <h4> Additional Notes</h4>
  
                <div class="clr-row">
                  <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                      <label><strong>Attachment:<sup style="color: red">*</sup></strong></label>
                      <input type="file" name="file" ngModel (change)="onFileChanged($event)">
                  </div>
                  
                  
                  
              </div>
            </div>
        </form>
    </div>
  
        <div class="card-footer">
            <button class="btn btn-primary" (click)="save(newForm)">{{'common.submit' | translate}}</button>
        </div>
  </div>
