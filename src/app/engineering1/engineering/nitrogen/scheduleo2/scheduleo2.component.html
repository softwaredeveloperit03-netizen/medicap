<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">SCHEDULE FOR OXYGEN
                SENSOR REPLACEMENT RECORD
            </div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/engineering/nitrogen"
                    style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #formData="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3 clr-col-xs-3">
                        <label>From Date</label>
                        <input type="date" name="from_date" [(ngModel)]="from_date" [max]="to_date">
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3 clr-col-xs-3">
                        <label>To Date</label>
                        <input type="date" name="to_date" [(ngModel)]="to_date" [max]="today" [min]="from_date">
                    </div>
                    <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-4 clr-col-xs-6">
                        <button class="btn btn-danger" (click)="getPRAcross()" style="margin-top: 31px;">{{'common.search' | translate}}</button>
                    </div>
                </div>
                <table class="table table-border">
                    <tr>
                        <th style="text-align:center; vertical-align: middle;" colspan="13">Dept. / Plant No.</th>
                        <th style="text-align:center; vertical-align: middle;" colspan="3">Year</th>
                    </tr>
                    <tr>
                        <th style="text-align:center; vertical-align: middle;" rowspan="2">Sr. No.</th>
                        <th style="text-align:center; vertical-align: middle;" rowspan="2"> Location</th>
                        <th style="text-align:center; vertical-align: middle;" rowspan="2"> I.D. No.</th>
                        <th style="text-align:center; vertical-align: middle;" rowspan="2"> Status</th>
                        <th style="text-align:center; vertical-align: middle;" colspan="12"> Schedule as per Month</th>
                    </tr>
                    <tr>
                        <th>JAN</th>
                        <th>FEB</th>
                        <th>MAR</th>
                        <th>APR</th>
                        <th>MAY</th>
                        <th>JUN</th>
                        <th>JUL</th>
                        <th>AUG</th>
                        <th>SEP</th>
                        <th>OCT</th>
                        <th>NOV</th>
                        <th>DEC</th>
                    </tr>
                    <tr>
                        <td style="text-align:center; vertical-align: middle;" rowspan="3">01</td>
                        <td style="text-align:center; vertical-align: middle;" rowspan="3">Nitrogen Plant</td>
                        <td style="text-align:center; vertical-align: middle;" rowspan="3">NT-01</td>
                        <td>Planned</td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td>Execute</td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>

                    </tr>
                    <tr>
                        <td>Engg.Sign/ Date</td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>

                    </tr>
                </table>
            </form>
        </div>
    </div>
    <div class="card-footer"> <button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button></div>
</div>
