<div class="component eng-legacy-dash">
  <div class="subsection">
    <div class="purchase-block" >
      <div style="text-align:end" class="exit-section">
        <div class="header-block" style="margin:10px 0px">
          <h3>Maintenance Note</h3>
        <div routerLink="/engineering" class="name-board2"><i class="fas fa-times"></i>
        </div>
      </div>

      <div class="main-section" style="margin: 0px 10px 10px 10px !important;">
        <div class="category">
          <div class="line-section">
            <div class="header-div">
              <h3>Maintenance Note Section</h3>
            </div>
          </div>
          <div class="block-container">
            <div class="item-block" routerLink="inprocess" *ngIf="isuser == 'Yes'">
              <i class="fas fa-wrench"></i>
              <span>Breakdown Maint.</span>
          </div>
          <div class="item-block" routerLink="repairDesc">
            <i class="fas fa-cog"></i>
            <span>Repair Description</span>
        </div>
        
          
          <div class="item-block" routerLink="new">
              <i class="fas fa-tools"></i>
              <span>Equipment Replac.</span>
          </div>
          
          <div class="item-block" routerLink="approval" *ngIf="isapprover == 'Yes'">
              <i class="fas fa-check-circle"></i>
              <span>EBM Approval</span>
          </div>
          
          <div class="item-block" routerLink="log">
              <i class="fas fa-book"></i>
              <span>EBM Log</span>
          </div>
          
                      
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
