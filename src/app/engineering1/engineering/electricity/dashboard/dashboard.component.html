<div class="card" > 
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Electricity Consumption</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button *ngIf="isuser == 'Yes'" class="btn btn-sm btn-success" routerLink="new">NEW </button>
          <button class="btn btn-sm btn-danger" routerLink="/engineering">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
   <div class="card-block">
        <div class="clr-row">
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3 clr-col-xs-3">
              <label>From Date</label>
              <input type="date" name="from_date" [(ngModel)]="from_date" required>
          </div>
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3 clr-col-xs-3">
              <label>To Date</label>
              <input type="date" name="to_date" [(ngModel)]="to_date" required>
          </div>
          <div class="clr-col-lg-2 clr-col-md-4 clr-col-sm-4 clr-col-xs-6">
              <button class="btn btn-danger" (click)="getTankSanitizationLog()" style="margin-top: 31px;">{{'common.search' | translate}}</button>
          </div>
        </div>
      <div class="card-text">
        <table class="table">
          <tr>
              <th style="text-align: left;">Sr.</th>
              <th style="text-align: left;">{{'common.date' | translate}}</th>
              <th style="text-align: left;">Meter Reading</th>
              <th style="text-align: left;">Last Reading </th>
              <th style="text-align: left;">Total Difference </th>
              <th style="text-align: left;">Maximum Demand </th>
              <th style="text-align: left;">Power Factor</th>
              
          </tr>
          <tr *ngFor="let res of results;let i=index">
            <td style="text-align: left;">{{i+1}}</td>
            <td style="text-align: left;">{{res.entry_date}}</td>
            <td style="text-align: left;">{{res.meter_reading}}</td>
            <td style="text-align: left;">{{res.last_reading}}</td>
            <td style="text-align: left;">{{res.difference}}</td>
            <td style="text-align: left;">{{res.max_demand }}</td>
            <td style="text-align: left;">{{res.power_factor }}</td>
           
       <!--      <td>
              <button class="btn btn-sm btn-info" (click)="view(i)">{{'common.view' | translate}}</button>
            </td>
        -->  </tr> 
         <tr *ngIf="results?.length==0">
           <td colspan="10">No Record Found!</td>
         </tr>
        </table>
      </div> 
    </div> 
    <div class="card-footer">
    <button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button> 
    </div>
  </div>
