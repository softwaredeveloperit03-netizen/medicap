<div class="card"> 
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Electricity Consumption</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-danger" routerLink="/engineering/electricity">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
   <div class="card-block">
    <form #reading="ngForm">
        <div class="clr-row">
            <div class="clr-col-lg-4 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                <label>Meter Reading:</label>
                <input type="number" name="meter_reading" (input)="checkValue($event)" (keyup)="getDifference()" [(ngModel)]="meter_reading" required>
            </div>
            <div class="clr-col-lg-4 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                <label>Last Reading:</label>
                <input type="number" name="last_reading" (input)="checkValue($event)" (keyup)="getDifference()" [(ngModel)]="last_reading" required>
            </div>  
            <div class="clr-col-lg-4 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                <label>Total Difference Of Reading:</label>
                <input type="text" name="difference"   [(ngModel)]="difference" readonly required>
            </div> 
             <div class="clr-col-lg-4 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                <label>Maximum Demand :</label>
                <input type="number" name="max_demand" (input)="checkValue($event)"  ngModel required>
            </div> 
            <div class="clr-col-lg-4 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                <label>Power Factor :</label>
                <input type="number" name="power_factor"  (input)="checkValue($event)" ngModel required>
            </div>
        </div>
    </form> 
    </div> 
    <div class="card-footer"> 
    <button class="btn btn-primary" (click)="saveReading(reading)">{{'common.save' | translate}}</button>
    </div>
  </div>
