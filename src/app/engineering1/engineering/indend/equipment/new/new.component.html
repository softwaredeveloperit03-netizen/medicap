<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-6" style="color: aliceblue;margin-top: -2px;text-align: left;">New Equipment Purchase Requisition
            </div>
            <div class="clr-col-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/engineering/indend/equipment"
                    style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #indendForm="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-5 clr-col-md-5 clr-col-sm-12 clr-col-xs-12">
                        <label>Equipment Name:</label>
                        <select name="equipment_name" [(ngModel)]="equipment_name" required>
                            <option></option>
                            <option *ngFor="let e of equipments">{{ e.equipment_name}}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                        <label>Required Qty:</label>
                        <input type="text" name="qty" ngModel required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Capacity:<span style="color: red">*</span><br></label>
                        <input type="text" name="capacity" ngModel required style="width: 60%;">
                        <select name="unit" ngModel style="width: 40%;padding: 1px;">
                            <option></option>
                            <option *ngFor="let unit of units">{{unit.unit}}</option>
                        </select>
                      </div>
                    <div class="clr-col-lg-3 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                        <label>Requirement</label>
                        <select name="requirement" ngModel required>
                            <option>Urgent</option>
                            <option>Regular</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Vendor:</label>
                        <select name="vendor" ngModel required>
                            <option></option>
                            <option *ngFor="let vendor of vendors" [value]="vendor.vendor_no">{{ vendor['vendor_name']
                                }}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                        <label>Purpose:</label>
                        <select name="purpose" ngModel required>
                            <option>Production</option>
                            <option>Testing</option>
                            <option>Trial</option>
                            <option>Other</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="add(indendForm)">ADD TO LIST</button>
    </div>
    <div class="card-block">
        <div class="card-title">Equipment List:</div>
        <div class="card-text">
            <clr-datagrid>
                <clr-dg-column>Equipment For</clr-dg-column>
                <!--  <clr-dg-column>Equipment Code</clr-dg-column> -->
                <clr-dg-column>Equipment Name</clr-dg-column>
                <clr-dg-column>Req. Qty</clr-dg-column>
                <clr-dg-column>Capacity</clr-dg-column>
                <clr-dg-column>Requirement</clr-dg-column>
                <clr-dg-column>Vendor No.</clr-dg-column>
                <clr-dg-column>Purpose</clr-dg-column>

                <clr-dg-row *ngFor="let user of equipmentList; let i = index">
                    <clr-dg-cell>{{ user.equipment_for }}</clr-dg-cell>
                    <!--   <clr-dg-cell>{{user.equipment_code}}</clr-dg-cell> -->
                    <clr-dg-cell>{{user.equipment_name}}</clr-dg-cell>
                    <clr-dg-cell>{{user.qty}} </clr-dg-cell>
                    <clr-dg-cell>{{user.capacity}} {{user.unit}}</clr-dg-cell>
                    <clr-dg-cell>{{user.requirement}}</clr-dg-cell>
                    <clr-dg-cell>{{user.vendor}}</clr-dg-cell>
                    <clr-dg-cell>{{user.purpose}}</clr-dg-cell>
                    <clr-dg-cell>
                        <clr-icon shape="trash" class="is-error" (click)="del(i)"></clr-icon>
                    </clr-dg-cell>
                </clr-dg-row>
            </clr-datagrid>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="save()">{{'common.save' | translate}}</button>
    </div>
</div>
