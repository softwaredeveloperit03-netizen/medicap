<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Instrument Measuring
                Devices</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/engineering/instrument/master"
                    style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #instrumentDate="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3 clr-col-sm-3 clr-col-xs-12">
                        <label>Department :</label>
                        <select name="department" ngModel required (change)="getLocation($event.target.selectedIndex)">
                            <option></option>
                            <option *ngFor="let dept of departments">{{dept.department_name}}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3 clr-col-sm-3 clr-col-xs-12">
                        <label>Instrument Name :</label>
                        <input type="text" name="instrument_name" ngModel required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3 clr-col-sm-3 clr-col-xs-12">
                        <label>Location :</label>
                        <select name="location" ngModel >
                            <option></option>
                            <option *ngFor="let s of section">{{s.section_name}}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3 clr-col-sm-3 clr-col-xs-12">
                        <label>Tag No :</label>
                        <input type="text" name="tag_no" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-3 clr-col-sm-3 clr-col-xs-6">
                        <label>Instrument Range :</label>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-3 clr-col-sm-3 clr-col-xs-3">
                        <label>Operating Range :</label>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3 clr-col-sm-3 clr-col-xs-12">
                        <label>From : </label>
                        <input type="text" name="instrument_from" ngModel required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3 clr-col-sm-3 clr-col-xs-12">
                        <label>to: </label>
                        <input type="text" name="instrument_to" ngModel required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3 clr-col-sm-3 clr-col-xs-3">
                        <label>From : </label>
                        <input type="text" name="operating_from" ngModel required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3 clr-col-sm-3 clr-col-xs-3">
                        <label>to: </label>
                        <input type="text" name="operating_to" ngModel required>
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-3 clr-col-sm-3 clr-col-xs-12">
                        <label>Tolerance Range :</label>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3 clr-col-sm-3 clr-col-xs-12">
                        <label>From : </label>
                        <input type="text" name="tolerance_from" ngModel required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3 clr-col-sm-3 clr-col-xs-12">
                        <label>to: </label>
                        <input type="text" name="tolerance_to" ngModel required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3 clr-col-sm-3 clr-col-xs-12">
                        <label>Calibration Frequency :</label>
                        <select name="frequency" ngModel required>
                            <option>Daily</option>
                            <option>Weekly</option>
                            <option>Monthly</option>
                            <option>Quaterly</option>
                            <option>Yearly</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-3 clr-col-sm-3 clr-col-xs-12">
                        <label>Calibration Mode :</label>
                        <input type="text" name="calibration_mode" ngModel required>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="card-footer"><button class="btn btn-primary" (click)="saveData(instrumentDate)">{{'common.save' | translate}}</button></div>
</div>
