<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue; margin-top: -2px; text-align: left;"> Cleaning Schedule </div>
            <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/engineering/ahu" style="background-color: red; color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
<div>
 <form #cleaning_seheaduleform="ngForm">
    <div class="card-block">
        <h4><b>Facility Information</b></h4>
        <div class="card-text">
            <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Facility Name:</b><span style="color: red;">*</span></label>
                    <input type="text" name="facility_name" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Department Location:</b><span style="color: red;">*</span></label>
                    <input type="text" name="dept_location" ngModel required>
                </div>
            </div>
        </div>
    </div>
    <div class="card">
     <div class="card-header" style="text-align: left; color: black; background-color: rgb(212, 208, 96);">Equipment Details</div>
        <div class="card-block">
          <div class="clr-row">
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><b>Equipment Type</b></label>
                <select type="text" name="equipment_type" ngModel required>
                    <option></option>
                    <option>AHU</option>
                    <option>LAF</option>
                    <option>RLAF</option>
                    <option>Other</option>
                </select>
                </div>
           
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Equipment ID/Code:</b></strong></label>
                <input type="text" name="eqp_id" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Model:</b></strong></label>
                <input type="text" name="model" ngModel >
            </div>
        </div>
      </div>
    </div>
    <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(96, 193, 223);">Filter Details</div>
           <div class="card-block">
             <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Filter Type</b></label>
                    <select type="text" name="filter_type" [(ngModel)]="filter_type" required>
                        <option></option>
                        <option>HEPA Filter</option>
                        <option>pre-Filter</option>
                        <option>ULPA Filter</option>
                    </select>
                    </div>
                    <div *ngIf="filter_type=='Other'" class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label><strong><b>Other:</b></strong></label>
                        <input type="text" name="other_eqp" ngModel required>
                    </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Filter ID/Code:</b></strong></label>
                   <input type="text" name="filter_id" ngModel required>
               </div>
           </div>
         </div>
       </div>
       <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(84, 224, 199);">Cleaning Schedule</div>
           <div class="card-block">
             <div class="clr-row">
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Schedule ID:</b></strong></label>
                   <input type="text" name="schedule_id" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Last Cleaning Date:</b></strong></label>
                <input type="date" name="last_cleaning_date" ngModel required>
            </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Next Cleaning Date:</b></strong></label>
                <input type="date" name="next_cleaning_date" ngModel required>
            </div>
           </div>
         </div>
       </div>
       <div class="card">
         <div class="card-header" style="text-align: left; color: black; background-color: rgb(224, 84, 194);">Cleanins Frequency</div>
           <div class="card-block">
                 <div class="clr-row">
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label><strong><b>Cleanins Interval:</b></strong></label>
                        <input type="text" name="c_interval" ngModel required>
                    </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label><b>Cleanins Frequency:</b></label>
                            <select type="text" name="c_frequency" ngModel required>
                                <option></option>
                                <option>Daily</option>
                                <option>Weekly</option>
                                <option>Monthly</option>
                                <option>Quarterly</option>
                                <option>Semi-Annually</option>
                                <option>Annually</option>
                            </select>
                        </div>
                  </div>
            </div>
        </div>
       <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: lightgreen;">Responsible Personnel </div>
        <div class="card-block">
             <div class="clr-row">
               <div  class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Cleaning Assigned :</b></strong></label>
                   <input type="text" name="c_accigned" ngModel required>
               </div>
               <div  class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Superviser/Manager Approval:</b></strong></label> 
                <input type="text" name="s_approval" ngModel required>
               </div>
           </div>
         </div>
       </div>
  </form>
</div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="save(cleaning_seheaduleform)">{{'common.submit' | translate}}</button>
    </div>
</div>
