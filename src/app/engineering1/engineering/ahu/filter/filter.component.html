<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue; margin-top: -2px; text-align: left;"> Filter Cleaning Record </div>
            <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/engineering/ahu" style="background-color: red; color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
<div>
 <form #fliter_cleaning_form="ngForm">
    <div class="card-block">
        <h4><b>Facility Information</b></h4>
        <div class="card-text">
            <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Facility Name:</b><span style="color: red;">*</span></label>
                    <input type="text" name="facility_name" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Department Location:</b><span style="color: red;">*</span></label>
                    <select name="dept_location" ngModel required>
                        <option></option>
                        <option *ngFor="let dept of departments" [value]="dept.department_name">{{ dept.department_name }}</option>
                    </select>
                </div>
                
            </div>
        </div>
    </div>
    <div class="card">
     <div class="card-header" style="text-align: left; color: black; background-color: rgb(212, 208, 96);">Equipment Details</div>
        <div class="card-block">
          <div class="clr-row">
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><b>Equipment Type</b></label>
                <select type="text" name="equipment_type" [(ngModel)]="equipment_type" required>
                    <option></option>
                    <option>AHU</option>
                    <option>LAF</option>
                    <option>RLAF</option>
                    <option>Other</option>
                </select>
                </div>
           <div *ngIf="equipment_type=='Other'" class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
               <label><strong><b>Other:</b></strong></label>
               <input type="text" name="other_eqp" ngModel required>
           </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Equipment ID/Code:</b></strong></label>
                <input type="text" name="eqp_id" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Model:</b></strong></label>
                <input type="text" name="model" ngModel >
            </div>
        </div>
      </div>
    </div>
    <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(96, 193, 223);">Filter Details</div>
           <div class="card-block">
             <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Filter Type</b></label>
                    <select type="text" name="filter_type" [(ngModel)]="filter_type" required>
                        <option></option>
                        <option>HEPA Filter</option>
                        <option>pre-Filter</option>
                        <option>ULPA Filter</option>
                        <option>Other</option>
                    </select>
                    </div>
               <div *ngIf="filter_type=='Other'" class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Other:</b></strong></label>
                   <input type="text" name="other_filter" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Filter ID/Code:</b></strong></label>
                   <input type="text" name="filter_id" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Replacement Date:</b></strong></label>
                   <input type="date" name="replacement_date" ngModel required>
               </div>
           </div>
         </div>
       </div>
       <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(84, 224, 199);">Cleaning Details</div>
           <div class="card-block">
             <div class="clr-row">
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Cleaning Date:</b></strong></label>
                   <input type="date" name="cleaning_date" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Cleaning Time:</b></strong></label>
                <input type="time" name="cleaning_time" ngModel required>
            </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Cleaning Method:</b></strong></label>
                <input type="text" name="cleaning_method" ngModel required>
            </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Cleaning Solution Used:</b></strong></label>
                <input type="text" name="cleaning_solution" ngModel required>
            </div>
           </div>
         </div>
       </div>
       <div class="card">
         <div class="card-header" style="text-align: left; color: black; background-color: rgb(224, 84, 194);">Filter Preference Check</div>
           <div class="card-block">
                 <div class="clr-row">
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label><strong><b>Initial Pressure Drop(H2O) :</b></strong></label>
                        <input type="text" name="initial_pressure" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label><strong><b>Final Pressure Drop(H2O):</b></strong></label>
                        <input type="text" name="final_pressure" ngModel required>
                    </div>
                </div>
            </div>
            <div class="card-block">
              <h4>Observation:</h4>
                <div class="clr-row">
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label><strong><b>Visual Inspection Observation:</b></strong></label>
                        <input type="text" name="visual_inspection" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label><strong><b>Any Observation Details :</b></strong></label>
                        <input type="text" name="observation" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label><strong><b>Add Action Required :</b></strong></label>
                        <input type="text" name="add_action" ngModel required>
                    </div>
              </div>
           </div>
       </div>
       <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: lightgreen;">Review & Approval</div>
        <div class="card-block">
            <h4>Performed By</h4>
             <div class="clr-row">
               <div  class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Name of Personnel :</b></strong></label>
                   <select name="personnel_name" ngModel required>
                       <option></option>
                       <option *ngFor="let emp of enggEmployees" [value]="emp.display_name">
                         {{ emp.display_name }}
                       </option>
                   </select>
               </div>
               <div *ngIf="approvel_requird=='Yes'" class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Personnel ID/Code:</b></strong></label>
                <input type="date" name="personnel_id" ngModel required>
               </div>
               <div  class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Reviewed by Superviser/Manager:</b></strong></label>
                <input type="text" name="reviewed_by" ngModel required >
               </div>
               <div  class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Date of Review:</b></strong></label>
                <input type="date" name="date_review" ngModel required >
               </div>
               <div  class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Approval By:</b></strong></label>
                <input type="text" name="approval_by" ngModel required >
               </div>
               <div  class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Date of Approval By:</b></strong></label>
                <input type="date" name="ap_date" ngModel required >
               </div>
           </div>
         </div>
       </div>
  </form>
</div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="save(fliter_cleaning_form)">{{'common.submit' | translate}}</button>
    </div>
</div>
