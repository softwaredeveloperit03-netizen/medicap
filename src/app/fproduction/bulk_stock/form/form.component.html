<div class="container-fluid">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
                <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Bulk Stock Entry</div>
                <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                    <button class="btn btn-sm" routerLink="/fproduction/bulk_stock" style="background-color: red;color: white;">
                        CLOSE
                    </button>
                </div>
            </div>
        </div>
        <div class="card-block">
            <div class="card-text">
                <table class="table table-border">
                    <tr>
                        <td style="text-align: left;"><b>Bulk Name : <span style="color: red;"><b>*</b></span></b></td>
                        <td style="text-align: left; margin: 0;padding: 0;">
                            <select name="bulkname" [(ngModel)]="bulkname" (change)="onBulkNameChange()" required>
                                <option value="">Select Bulk Name</option>
                                <option *ngFor="let bulk of bulkMasterList" [value]="bulk.bulkName || bulk.bulk_name || bulk.bulkname">
                                    {{ bulk.bulkName || bulk.bulk_name || bulk.bulkname }}
                                </option>
                            </select>
                        </td>
                        <td style="text-align: left;"><b>Bulk Code : <span style="color: red;"><b>*</b></span></b></td>
                        <td style="text-align: left; margin: 0;padding: 0;">
                            <input type="text" name="bulkcode" [(ngModel)]="bulkcode" readonly required>
                        </td>
                    </tr>
                    <tr>
                        <td style="text-align: left;"><b>Medicap lot no : <span style="color: red;"><b>*</b></span></b></td>
                        <td style="text-align: left; margin: 0;padding: 0;">
                            <input type="text" name="arno" [(ngModel)]="arno" required>
                        </td>
                        <td style="text-align: left;"><b>Mfg. Date : <span style="color: red;"><b>*</b></span></b></td>
                        <td style="text-align: left; margin: 0;padding: 0;">
                            <input type="date" name="mfg_date" [(ngModel)]="mfg_date" required>
                        </td>
                    </tr>
                    <tr>
                        <td style="text-align: left;"><b>Exp. Date : <span style="color: red;"><b>*</b></span></b></td>
                        <td style="text-align: left; margin: 0;padding: 0;">
                            <input type="date" name="exp_date" [(ngModel)]="exp_date" required>
                        </td>
                        <td style="text-align: left;"><b>Mfg. Qty : <span style="color: red;"><b>*</b></span></b></td>
                        <td style="text-align: left; margin: 0;padding: 0;">
                            <input type="number" name="mfg_qty" [(ngModel)]="mfg_qty" oninput="this.value = this.value.replace(/[^0-9.]/g, '')" required>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="saveForm()">{{'common.save' | translate}}</button>
            <button class="btn btn-danger" (click)="close()">{{'common.close' | translate}}</button>
        </div>
    </div>
</div>
