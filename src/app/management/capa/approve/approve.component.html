<div class="container-fluid" *ngIf="!formview">
  <div class="card">
    <div class="card-header">CAPA Approval</div>
    <div class="card-block">
      <div class="card-text">
        <clr-datagrid>
            <clr-dg-column>No</clr-dg-column>
            <clr-dg-column>Request Date</clr-dg-column>
            <clr-dg-column>Request By</clr-dg-column>
            <clr-dg-column>Required In System</clr-dg-column>
            <clr-dg-column>view</clr-dg-column>
        
            <clr-dg-row *clrDgItems="let user of data; let i = index">
                <clr-dg-cell>{{user.capa_no}}</clr-dg-cell>
                <clr-dg-cell>{{user.entry_date}}</clr-dg-cell>
                <clr-dg-cell>{{user.entry_by}}</clr-dg-cell>
                <clr-dg-cell>{{user.required_in_system}}</clr-dg-cell>
                <clr-dg-cell>
                  <button class="btn btn-sm btn-info" (click)="viewForm(i)">{{'common.view' | translate}}</button>
                </clr-dg-cell>
            </clr-dg-row>

            <clr-dg-footer>
                <clr-dg-pagination #pagination [clrDgPageSize]="10">
                    <clr-dg-page-size [clrPageSizeOptions]="[10,20,50,100]">forms per page</clr-dg-page-size>
                    {{pagination.firstItem + 1}} - {{pagination.lastItem + 1}}
                    of {{pagination.totalItems}} forms
                </clr-dg-pagination>
            </clr-dg-footer>
          </clr-datagrid>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid" *ngIf="formview">
  <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
    <div class="card">
      <div class="card-header">CAPA Approval</div>
      <div class="card-block">
        <div class="card-text">
          <form #changecontrol="ngForm">
            <div class="clr-row">
              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Department:</strong></label>
                <input type="text" name="department" ngModel="{{ selectedForm['department'] }}" readonly required>
              </div>
              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label><strong>CAPA required in-System</strong></label>
                <input type="text" name="change_title" ngModel="{{ selectedForm['required_in_system'] }}" readonly>
              </div>
              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Category:</strong></label>
                <input type="text" name="existing_procedure" ngModel="{{ selectedForm['category'] }}" readonly>
              </div>
              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Details of Incident/Non conformity/Deviation/Market Complaint:</strong></label>
                <input type="text" name="proposed_change" ngModel="{{ selectedForm['detail'] }}">
              </div>
            </div>
          </form>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="approve()">{{'common.approve' | translate}}</button>
        <button class="btn btn-warning" (click)="reject()">{{'common.reject' | translate}}</button>
      </div>
    </div>
  </div>
</div>
