<div class="container-fluid">
    <div class="card">
        <div class="card-header">GMP Inspection Report</div>
        <div class="card-block">
          <div class="card-text">
            <div class="clr-row">
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label>From Date:</label>
                <input type="date" name="from_date" ngModel required>
              </div>
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label>To Date:</label>
                <input type="date" name="to_date" ngModel required>
              </div>
            </div>
            <clr-datagrid>
                <clr-dg-column>{{'common.date' | translate}}</clr-dg-column>
                <clr-dg-column>Report No.</clr-dg-column>
                <clr-dg-column>No. of Failure Observation</clr-dg-column>
                <clr-dg-column>Prepared By</clr-dg-column>
                <clr-dg-column>Compliance Done</clr-dg-column>
                <clr-dg-column>View</clr-dg-column>
                <clr-dg-row *ngFor="let user of datalist">
                    <clr-dg-cell>{{user.entry_date}}</clr-dg-cell>
                    <clr-dg-cell>{{user.report_no}}</clr-dg-cell>
                    <clr-dg-cell>{{user.failures}}</clr-dg-cell>
                    <clr-dg-cell>{{user.entry_by}}</clr-dg-cell>
                    <clr-dg-cell>{{user.compliance}}</clr-dg-cell>
                    <clr-dg-cell>
                      <button class="btn btn-sm btn-info">{{'common.view' | translate}}</button>
                    </clr-dg-cell>
                </clr-dg-row>
            </clr-datagrid>
          </div>
        </div>
    </div>
  </div>
