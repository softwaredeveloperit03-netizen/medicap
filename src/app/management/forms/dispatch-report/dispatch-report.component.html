<div class="card" *ngIf="!isView">
  <div class="card-header" style="text-align: center">
         <div class="clr-row" style="margin-bottom: -10px;">
           <div class="clr-col-lg-3" style="color: aliceblue;margin-top: -2px;text-align: left;">Dispatch Report</div>
           <div class="clr-col-lg-9" style="text-align: right;padding-right: 0px;margin-top: -7px;">
              <button class="btn btn-sm" routerLink="/" style="background-color: red;color: white;">
               <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
             </button>
           </div>
         </div>
   </div>
   <div class="card-block">
      <div class="clr-row">
          <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Client Name:</label>
              <select name="client_code" [(ngModel)]="client_code" required>
              <option></option>
              <option *ngFor="let res of client" [value]="res.client_code">{{ res.company }}</option>
              </select>
          </div>
          <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>From date</label>
              <input  type="date" name="from_date" [(ngModel)]="from_date">
          </div>
          <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>To Date</label>
              <input  type="date" name="to_date" [(ngModel)]="to_date">
          </div>
          <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12" style="margin-top: 33px;">
              <Button class="btn btn-danger" (click)="getInvoicesLog()">
                  search
              </Button>
          </div>
      </div>
      <div class="card-text">
          <table class="table">
              <tr>
                  <th>Sr.</th>
                  <th style="text-align: left;">Invoice No.</th>
                  <th style="text-align: left;">Invoice Date</th>
                  <th style="text-align: left;">Client name</th>
                  <th>Invoice Amt</th>
                  <th>view</th>
              </tr>
              <tr *ngFor="let res of results;let i=index">
                  <td>{{ i+1}}</td>
                  <td style="text-align: left;">{{ res.invoice_no}}</td>
                  <td style="text-align: left;">{{ res.entry_date}}</td>
                  <td style="text-align: left;">{{ res.company}}</td>
                  <td style="text-align: left;"> {{ res.TotInvVal }}</td>
                  <td>
                      <button class="btn btn-sm btn-info" (click)="view(i)">{{'common.view' | translate}}</button>
                  </td>
              </tr>
              <tr *ngIf="results?.length==0">
                  <td colspan="10">No Record Found!</td>
              </tr>
          </table>
      </div>
  </div>
  <div class="card-footer">
     <button class="btn btn-primary" (click)="pdfUpload()">{{'common.download' | translate}}</button>
  </div>
</div>
