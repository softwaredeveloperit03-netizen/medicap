<div class="container-fluid">
    <div class="card">
        <div class="card-header">Employee Entry / Exit Log</div>
        <div class="card-block">
          <div class="card-text">
            <form #employeeForm="ngForm">
              <div class="clr-row">
                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                  <label>Employee:</label>
                  <select name="emp_id" [(ngModel)]="emp_id">
                    <option></option>
                    <option *ngFor="let employee of candidates" [value]="employee.emp_id">{{ employee.emp_name }}</option>
                  </select>
                </div>
                <div class="clr-col-lg-3 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                  <label>From Date:</label>
                  <input type="date" name="fromdate" [(ngModel)]="fromdate">
                </div>
                <div class="clr-col-lg-3 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                  <label>To Date:</label>
                  <input type="date" name="todate" [(ngModel)]="todate">
                </div>
                <div class="clr-col-lg-3 clr-col-md-2 clr-col-sm-12 cl-col-xs-12" style="margin-top:30px;">
                  <button class="btn btn-primary" (click)="getEmployeeDetails(employeeForm)">procced</button>&nbsp;
                  <button class="btn btn-warning" (click)="clear()">{{'common.clear' | translate}}</button>
                </div>
              </div>
            </form>
            <clr-datagrid>
                <clr-dg-column>Employee</clr-dg-column>
                <clr-dg-column>In Date</clr-dg-column>
                <clr-dg-column>In Time</clr-dg-column>
                <clr-dg-column>Out Date</clr-dg-column>
                <clr-dg-column>Out Time</clr-dg-column>
  
                <clr-dg-row *ngFor="let user of employees">
                    <clr-dg-cell>{{user.emp_id}}</clr-dg-cell>
                    <clr-dg-cell>{{user.indate | date}}</clr-dg-cell>
                    <clr-dg-cell>{{user.intime}}</clr-dg-cell>
                    <clr-dg-cell>{{user.outdate | date}}</clr-dg-cell>
                    <clr-dg-cell>{{user.outtime}}</clr-dg-cell>
                </clr-dg-row>
            </clr-datagrid>
          </div>
        </div>
    </div>
  </div>
