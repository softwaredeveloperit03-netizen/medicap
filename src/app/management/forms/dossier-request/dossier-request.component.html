<div class="container-fluid">
    <div class="card">
        <div class="card-header">Dossier Request Report</div>
        <div class="card-block">
          <div class="card-text">
            <clr-datagrid>
                <clr-dg-column>{{'common.date' | translate}}</clr-dg-column>
                <clr-dg-column>PO Number</clr-dg-column>
                <clr-dg-column>GST Type</clr-dg-column>
                <clr-dg-column>Requirement Days</clr-dg-column>
                <clr-dg-column>General</clr-dg-column>
                <clr-dg-column>Transport company</clr-dg-column>
                <clr-dg-row *ngFor="let user of datalist">
                    <clr-dg-cell>{{user.entry_date | date}}</clr-dg-cell>
                    <clr-dg-cell>{{user.po_no}}</clr-dg-cell>
                    <clr-dg-cell>{{user.gst_type}}</clr-dg-cell>
                    <clr-dg-cell>{{user.requirement_days}}</clr-dg-cell>
                    <clr-dg-cell>{{user.isgeneral}}</clr-dg-cell>
                    <clr-dg-cell>{{user.transport_company}}</clr-dg-cell>
                </clr-dg-row>
            </clr-datagrid>
          </div>
        </div>
    </div>
  </div>
