<div class="container-fluid">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Meeting Announcement & Agenda</div>
              <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/management/meeting" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
              </div>
            </div>
          </div>
        <div class="card-block">
            <div class="card-text">
                <form #annoucementForm="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-4">
                            <label>Meeting In:<span style="color:red;">*</span></label>
                            <select name="meeting_in" ngModel required>
                                <option></option>
                                <option *ngFor="let department of departments">{{ department.department_name }}</option>
                            </select>
                        </div>
                        <div class="clr-col-4">
                            <label>Meeting Date:<span style="color:red;">*</span></label>
                            <input type="date" name="meeting_date" ngModel required>
                        </div>
                        <div class="clr-col-4">
                            <label>Meeting Time:<span style="color:red;">*</span></label><br>
                            <input type="time" name="meeting_time" ngModel required>
                        </div>
                        <div class="clr-col-4">
                            <label>Meeting Representative:<span style="color:red;">*</span></label>
                            <input type="text" name="representative" ngModel required>
                        </div>
                    </div>
                </form>
                <h4>Managers:</h4>
                <table class="table">
                    <tr>
                        <th style="width: 50px;">Sr.</th>
                        <th>Name of Manager</th>
                        <th style="width: 15%;">ADD</th>
                    </tr>
                    <tr>
                        <td>0.</td>
                        <td style="padding: 0px;">
                            <select name="manager_name" style="margin: 0px;" ngModel (change)="selectManager($event.target.selectedIndex)" required>
                                <option></option>
                                <option *ngFor="let employee of employees; let i = index" [value]="employee.emp_id">{{ employee.department }} - {{ employee.firstname }}</option>
                            </select>
                        </td>
                        <td style="padding: 0px;vertical-align: middle;">
                            <button class="btn btn-sm btn-info" (click)="addManager()">{{'common.add' | translate}}</button>
                        </td>
                    </tr>
                    <tr *ngFor="let manager of managers; let i = index">
                        <td>{{ i + 1 }}</td>
                        <td style="text-align: left;">{{ manager.department }} - {{ manager.firstname }}</td>
                        <td>#</td>
                    </tr>
                    <tr>
                        <td colspan="3">No Records in List!</td>
                    </tr>
                </table>

                <h4>Meeting Agenda:</h4>
                <table class="table">
                    <tr>
                        <th style="width: 50px;">Sr.</th>
                        <th>Agenda</th>
                        <th>Details</th>
                        <th>ADD</th>
                    </tr>
                    <tr>
                        <td>0.</td>
                        <td style="padding: 0px;">
                            <select name="agenda" style="margin: 0px;" [(ngModel)]="agenda" required>
                                <option>Quality Failure</option>
                                <option>Incidence</option>
                                <option>Deviations</option>
                                <option>Change Control</option>
                                <option>CAPA</option>
                                <option>Risk Assessment</option>
                                <option>Market Complaint</option>
                                <option>Medical Complaint</option>
                                <option>Other</option>
                            </select>
                        </td>
                        <td style="padding: 0px;">
                            <input type="text" name="detail" style="margin: 0px;height:37px;" [(ngModel)]="detail" required>
                        </td>
                        <td style="padding: 0px;vertical-align: middle;">
                            <button class="btn btn-sm btn-info" (click)="addAgenda()">{{'common.add' | translate}}</button>
                        </td>
                    </tr>
                    <tr *ngFor="let agenda of agendas; let i = index">
                        <td>{{ i + 1 }}</td>
                        <td style="text-align: left;">{{ agenda.agenda }}</td>
                        <td style="text-align: left;">{{ agenda.detail }}</td>
                        <td>#</td>
                    </tr>
                    <tr>
                        <td colspan="4">No Records in List!</td>
                    </tr>
                </table>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="saveManagementMeetingAnnoucement(annoucementForm)" [disabled]="annoucementForm.form.invalid">{{'common.submit' | translate}}</button>
            <button class="btn btn-danger" routerLink="/meeting">{{'common.close' | translate}}</button>
        </div>
    </div>
</div>
