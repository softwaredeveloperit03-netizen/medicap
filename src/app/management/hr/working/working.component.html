<div class="card">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Total Man Working Hours</div>
      <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        <button class="btn btn-sm" routerLink="/management/hr"
          style="background-color: red;color: white;">{{'common.close' | translate}}</button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <div class="card-text">
      <div class="clr-row">
        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
          <label>Employee:</label>
          <select name="emp_id" [(ngModel)]="emp_code" required (change)="getDepartmentByEmployee($event.target.value)">
            <option></option>
            <option *ngFor="let employee of employeeList" [value]="employee.emp_id">{{ employee.firstname}}-{{
              employee.emp_id}}</option>
          </select>
        </div>



        <!-- <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
          <label>Department:</label>
          <select name="department" [(ngModel)]="department_name"
            (change)="getDepartmentsEmployee($event.target.value)">
            <option></option>
            <option *ngFor="let dpt of departments" [value]="dpt.department_name">{{ dpt.department_name }}</option>
          </select>
        </div> -->
<!--  -->
                 

         <div class="clr-col-lg-3 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
          <label>Department:</label>
          <input type="text"  name="department" [(ngModel)]="department_name">
        </div>
<!--  -->


        <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
          <label>From Date:</label>
          <input type="date" name="from_date" [(ngModel)]="from_date" style="padding-left: 1px; padding-right: 1px;">
        </div>
        <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
          <label>To Date:</label>
          <input type="date" name="to_date" [(ngModel)]="to_date" style="padding-left: 1px; padding-right: 1px;">
        </div>
        <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
          <button [clrLoading]="validateBtnState" class="btn btn-danger" (click)="getIndividualAttendace()" style="margin-top:30px;">{{'common.search' | translate}}</button>
        </div>

        <!-- <input type="file" (change)="onFileChange($event)" /> -->
      </div>
    <clr-datagrid [clrDgLoading]="loading"   >
      <div class="card-block" style="color: rgb(96, 96, 236);" >
      <clr-dg-column clrDgField="Department">{{'common.department' | translate}}</clr-dg-column>
      <clr-dg-column clrDgField="emp_id">Employee ID</clr-dg-column>
      <clr-dg-column clrDgField="firstname">Employee</clr-dg-column>
      <clr-dg-column clrDgField="designation">{{'common.designation' | translate}}</clr-dg-column>
      <clr-dg-column clrDgField="working_hrs">Working Hrs</clr-dg-column>
    
    <clr-dg-row *clrDgItems="let user of employees"  [clrDgItem]="user">
      <clr-dg-cell>{{user.department}}</clr-dg-cell>
      <clr-dg-cell>{{user.emp_id}}</clr-dg-cell>
      <clr-dg-cell>{{user.firstname}}</clr-dg-cell>
      <clr-dg-cell>{{user.designation}}</clr-dg-cell>
      <clr-dg-cell>{{user.working_hrs}}</clr-dg-cell>
    </clr-dg-row>
  </div>
 </clr-datagrid>
  </div>
</div>
<!-- <div class="card-footer">
  <button class="btn btn-primary" (click)="downloadReport()">DOWNLOAD EXCEL</button>
</div> -->
</div>
