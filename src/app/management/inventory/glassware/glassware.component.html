<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Glassware </div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/management/inventory" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
    <div class="card-block">
        <div class="card-text">
            <!-- <table class="table table-border">
                <tr>
                    <th style="background-color: rgb(14, 67, 112); color: white;">Sr.</th>
                    <th style="background-color: rgb(14, 67, 112); color: white;">{{'common.type' | translate}}</th>
                    <th style="background-color: rgb(14, 67, 112); color: white;">Code</th>
                    <th style="background-color: rgb(14, 67, 112); color: white;">{{'common.name' | translate}}</th>
                    <th style="background-color: rgb(14, 67, 112); color: white;">Available Qty.</th>
                </tr>
                <tr *ngFor="let result of results; let i = index">
                    <td>{{ i + 1 }}.</td>
                    <td>{{ result.type }}</td>
                    <td>{{ result.code }}</td>
                    <td>{{ result.name }}</td>
                    <td>{{ result.available_qty }}</td>
                </tr>
                <tr *ngIf="results?.length == 0">
                    <td colspan="5">{{'common.noRecords' | translate}}</td>
                </tr>
            </table> -->
            <clr-datagrid [clrDgLoading]="loading">
               
              <clr-dg-column clrDgField="emp_id">Sr.</clr-dg-column>
              <clr-dg-column clrDgField="result.type">{{'common.type' | translate}}</clr-dg-column>
              <clr-dg-column clrDgField="result.code">Code</clr-dg-column>
              <clr-dg-column clrDgField="result.name">{{'common.name' | translate}}</clr-dg-column>
              <clr-dg-column clrDgField="available_qty">Available Qty.</clr-dg-column>
        
          <clr-dg-row *clrDgItems="let result of stocks; let i = index" [clrDgItem]="result">
              <clr-dg-cell>{{ i + 1 }}.</clr-dg-cell>
              <clr-dg-cell>{{ result.type }}</clr-dg-cell>
              <clr-dg-cell>{{ result.code }}</clr-dg-cell>
              <clr-dg-cell>{{ result.name }}</clr-dg-cell>
              <clr-dg-cell>{{ result.available_qty }}</clr-dg-cell>
          </clr-dg-row>
   <clr-dg-footer>
       <clr-dg-pagination #pagination [clrDgPageSize]="10">
           <clr-dg-page-size [clrPageSizeOptions]="[10,20,50,100]">Users per page</clr-dg-page-size>
           {{pagination.firstItem + 1}} - {{pagination.lastItem + 1}}
           of {{pagination.totalItems}} user
       </clr-dg-pagination>
  </clr-dg-footer>
</clr-datagrid>
        </div>
    </div>
</div>
