<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Holidays</div>
          <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
             <button class="btn btn-sm" routerLink="/plant_head/hr" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
      <div class="card-block">
        <div class="card-title">
         </div>
        <div class="card-text">
          
            <table class="table table-border">
              
                  <tr>
                    <th style="background-color: rgb(0, 0, 0);color: white; font-weight: bolder;text-align: left;">Sr. No</th>
                    <th style="background-color: rgb(0, 0, 0);color: white; font-weight: bolder;text-align: left;">Holiday Date</th>
                    <th style="background-color: rgb(0, 0, 0);color: white; font-weight: bolder;text-align: left;">Holiday Name</th>
                  </tr>
 
                  <tr *ngFor="let user of filteredMaterials; let i = index" 
                      [ngClass]="{'past-date': isPastDate(user.holiday_date), 'upcoming-date': !isPastDate(user.holiday_date)}">
                    <td style="text-align: left;font-weight: bolder;">{{ i + 1 }}</td>
                    <td style="text-align: left;font-weight: bolder;">{{ user.holiday_date | date: 'dd-MM-yyyy' }}</td>
                    <td style="text-align: left;font-weight: bolder;">{{ user.holiday_name }}</td>
                  </tr>
           
              </table>
        
        </div>
      </div>
    </div>
    </div>
