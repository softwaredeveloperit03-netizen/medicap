<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Outdoor Duty Form</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-success"  routerLink="/plant_head/security/duty/new" >NEW </button>
            <button class="btn btn-sm" routerLink="/plant_head/security" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
      <div class="card-block">
        <div class="card-text">
            <clr-datagrid [clrDgLoading]="loading">
            <clr-dg-column clrDgField="emp_id">Employee ID</clr-dg-column>
            <clr-dg-column clrDgField="department">{{'common.department' | translate}}</clr-dg-column>
             <clr-dg-column clrDgField="duty_details">Outstation Duty Details</clr-dg-column>
            <clr-dg-column clrDgField="from_date">From Date</clr-dg-column>
            <clr-dg-column clrDgField="to_date">To Date</clr-dg-column>
            <clr-dg-column>{{'common.table.action' | translate}}</clr-dg-column>

            <clr-dg-row *clrDgItems="let user of item; let i = index" [clrDgItem]="user"> 
               
               <clr-dg-cell>{{user.emp_id}}</clr-dg-cell>
               <clr-dg-cell>{{user.department}}</clr-dg-cell>
                <clr-dg-cell>{{user.duty_details}}</clr-dg-cell>
               <clr-dg-cell>{{user.from_date | date: 'dd-MM-yyyy'}}</clr-dg-cell>
               <clr-dg-cell>{{user.to_date | date: 'dd-MM-yyyy'}}</clr-dg-cell>
               <clr-dg-cell>
                <button type="button" class="btn btn-primary" (click)="update(user.id,'Checked')"> Check</button>
                <button type="button" class="btn btn-danger" (cluser.cdk)="update(user.id,'Reject')"> Reject</button>
               </clr-dg-cell>
            </clr-dg-row>
   
            </clr-datagrid>
        </div>
      </div>
      <div class="card-footer">
        <!-- <button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button> -->
      </div>
    </div>
  </div>
