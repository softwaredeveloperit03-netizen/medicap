<footer class="app-footer">
  <div class="footer-main">
    <div class="footer-row">
      <!-- Brand -->
      <div class="footer-col brand-col">
        <div class="brand-box">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          <span class="brand-text">PaperLess GMP</span>
        </div>
      </div>
 
      <!-- Client (single line) -->
      <div class="footer-col footer-client">
        <div class="info-box">
          <span class="label">Client</span>
          <span class="value" title="{{ plant_name }}">{{ plant_name }}</span>
        </div>
      </div>
 
      <!-- License -->
      <div class="footer-col">
        <div class="info-box">
          <span class="label">Software Licence No</span>
          <span class="value">{{ software_license_no }}</span>
        </div>
      </div>
 
      <!-- Version -->
      <div class="footer-col">
        <div class="info-box">
          <span class="label">Version No</span>
          <span class="value">00 (MASTER COPY)</span>
        </div>
      </div>
    </div>
  </div>
</footer>
