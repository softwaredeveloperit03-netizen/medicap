<div class="container-fluid">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue; margin-top: -2px; text-align: left;">
          Purchase Rate Contract
        </div>
        <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/accounts/prc" style="background-color: red; color: white;">
            CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #contractForm="ngForm">
          <div class="clr-row">
            <!-- Group Dropdown -->
            <div class="clr-col-lg-6 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" >
                <label>Main Group  : <span style="color: red">*</span></label>
                <select name="mainGroup" [(ngModel)]="mainGroup"  required (change)="getSubGroup($event.target.selectedIndex)">
                <option></option>
                <option *ngFor="let cli of groups;"  >{{ cli.LglNm }}-{{cli.client_code}}</option>
                </select>
            </div>
            <div class="clr-col-lg-6 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" >
                <label>Sub Group : </label>
                <select name="subClient" [(ngModel)]="subClient"    >
                <option></option>
                <option>NA</option>
                <option *ngFor="let cli of subGroupSeris;" >{{ cli.LglNm }}-{{cli.client_code}}</option>
                </select>
            </div>
        </div>
          <div class="clr-row">
            <!-- Vendor Dropdown -->
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
              <label>Vendor: <span style="font-weight: bolder; color: red;">*</span></label>
              <clr-dropdown style="border: 1px solid black; padding: 5px; width: 100%;">
                <button style="width: 100%;" clrDropdownTrigger class="custom-dropdown-toggle" aria-label="Toggle Dropdown">
                  {{ selectedVendor.vendor_name || selectedVendor.name || 'Select Vendor' }}
                  <clr-icon shape="caret down" class="dropdown-icon"></clr-icon>
                </button>
                <clr-dropdown-menu *clrIfOpen>
                  <input type="text" class="dropdown-search" placeholder="Search Vendor" [(ngModel)]="searchTermVendor">
                  <div class="dropdown-items" style="max-height: 200px; overflow-y: auto;">
                    <div class="dropdown-item" *ngFor="let item of filteredVendors" (click)="onVendorSelect(item)">
                      {{ item.vendor_name || item.name }}
                    </div>
                  </div>
                </clr-dropdown-menu>
              </clr-dropdown>
            </div>

            <!-- Vendor Mapped Material Dropdown -->
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
              <label>Vendor Mapped Material: <span style="font-weight: bolder; color: red;">*</span></label>
              <clr-dropdown style="border: 1px solid black; padding: 5px; width: 100%;" [class.disabled]="!vendor">
                <button style="width: 100%;" clrDropdownTrigger class="custom-dropdown-toggle" aria-label="Toggle Dropdown" [disabled]="!vendor">
                  {{ selectedMaterial.material_name || selectedMaterial.name || 'Select Material' }}
                  <clr-icon shape="caret down" class="dropdown-icon"></clr-icon>
                </button>
                <clr-dropdown-menu *clrIfOpen>
                  <input type="text" class="dropdown-search" placeholder="Search Material" [(ngModel)]="searchTermMaterial">
                  <div class="dropdown-items" style="max-height: 200px; overflow-y: auto;">
                    <div class="dropdown-item" *ngFor="let item of filteredMaterials" (click)="onMaterialSelect(item)">
                      {{ item.material_name || item.name }} - ( {{ item.material_code || item.code }} )
                    </div>
                  </div>
                </clr-dropdown-menu>
              </clr-dropdown>
            </div>
          </div>

          <div class="clr-row">
            <!-- Rate -->
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Rate: <span style="font-weight: bolder; color: red;">*</span></label>
              <input type="number" name="rate" [(ngModel)]="rate" required min="0" step="0.01" placeholder="Enter Rate">
            </div>

            <!-- Rate UOM -->
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Rate UOM: <span style="font-weight: bolder; color: red;">*</span></label>
              <select name="rateUOM" [(ngModel)]="rateUOM" required>
                <option value="">Select UOM</option>
                <option *ngFor="let uom of uomList" [value]="uom.unit || uom.unit_name || uom.name">
                  {{ uom.unit || uom.unit_name || uom.name }}
                </option>
              </select>
            </div>

            <!-- Delivery Delay Time -->
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Delivery Delay Time (Days):</label>
              <input type="number" name="deliveryDelayTime" [(ngModel)]="deliveryDelayTime" min="0" placeholder="Enter Days">
            </div>
          </div>

          <div class="clr-row">
            <!-- Valid From Date -->
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
              <label>Valid From Date: <span style="font-weight: bolder; color: red;">*</span></label>
              <input type="date" name="validFromDate" [(ngModel)]="validFromDate" required>
            </div>

            <!-- Valid To Date -->
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
              <label>Valid To Date: <span style="font-weight: bolder; color: red;">*</span></label>
              <input type="date" name="validToDate" [(ngModel)]="validToDate" required>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer" style="text-align: left;">
      <button class="btn btn-primary" (click)="saveForm(contractForm)">{{'common.save' | translate}}</button>
      <button class="btn btn-danger" routerLink="/accounts/prc">{{'common.close' | translate}}</button>
    </div>
  </div>
</div>
