<div class="card" *ngIf="!isNew">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-lg-6" style="color: aliceblue;margin-top: -2px;text-align: left;">User Request Form for IT Privileges</div>
            <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm btn-primary" (click)="isNew=true">{{'common.new' | translate}}</button>
                <button class="btn btn-sm btn-danger" routerLink="/it/itpolicies">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">


            <h1>Testing</h1>



        </div>
    </div>
</div>

<div class="card" *ngIf="isNew">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-lg-6" style="color: aliceblue;margin-top: -2px;text-align: left;">New User Request Form for IT Privileges</div>
            <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm btn-primary" (click)="isNew=true">{{'common.new' | translate}}</button>
                <button class="btn btn-sm btn-danger" routerLink="/it/itpolicies">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <div class="clr-row">

                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">

                    <h3>1. Details</h3>
                    <table style="width: 100%; border-collapse: collapse;" border="1">
                        <tr>
                            <td style="width: 50%; padding: 8px;">
                                Department:<br><input type="text" name="department" ngModel style="width: 95%;">
                            </td>
                            <td style="width: 50%; padding: 8px;">
                                Date:<br><input type="date" name="date" ngModel style="width: 95%;"></td>
                        </tr>
                        <tr>
                            <td style="padding: 8px;">
                                Full Name:<br><input type="text" name="fullName" ngModel style="width: 95%;"></td>
                            <td style="padding: 8px;">
                                Employee Code:<br><input type="text" name="empCode" ngModel style="width: 95%;"></td>
                        </tr>
                    </table>

                </div>

            </div>
        </div>
    </div>
</div>
