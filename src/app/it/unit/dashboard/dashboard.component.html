<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-lg-3" style="color: aliceblue;margin-top: -2px;text-align: left;">IT Consumable Log</div>
        <div class="clr-col-lg-9" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-success" routerLink="new" *ngIf="isuser == 'Yes'">{{'common.new' | translate}}</button>
          <button class="btn btn-sm btn-danger" routerLink="/it">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
         
          
      <div class="clr-row">
        <div class="clr-col-lg-5">
          <label>Search </label>
          <input type="text" placeholder="Search..."   [(ngModel)]="searchQuery">
         </div>
      </div>
  
      <clr-datagrid [clrDgLoading]="loading" [clrDgFilter]="searchQuery">
        <clr-dg-column>Sr. No.</clr-dg-column>
        <clr-dg-column>User</clr-dg-column>
        <clr-dg-column>{{'common.department' | translate}}</clr-dg-column>
        <clr-dg-column>{{'common.type' | translate}}</clr-dg-column>
        <clr-dg-column>Make</clr-dg-column>
        <clr-dg-column>IP Series</clr-dg-column>
        
  
        <clr-dg-row *clrDgItems="let result of filteredMaterials; let i = index" [clrDgItem]="result">
          <clr-dg-cell>{{ i+1}}</clr-dg-cell>
          <clr-dg-cell>{{ result.user_loc || 'N/A' }}</clr-dg-cell>  
          <clr-dg-cell>{{ result.department || 'N/A'}}</clr-dg-cell>
          <clr-dg-cell>{{ result.types || 'N/A' }}</clr-dg-cell>  
          <clr-dg-cell>{{ result.make || 'N/A' }}</clr-dg-cell> 
          <clr-dg-cell>{{ result.ip_series || 'N/A' }}</clr-dg-cell>
         </clr-dg-row>
 
      </clr-datagrid>

      </div>
    </div>
    <div class="card-footer"><button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button></div>
</div>
