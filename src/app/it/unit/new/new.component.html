<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">IT Consumables</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-danger" routerLink="/it/unit">{{'common.close' | translate}}</button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #unit="ngForm">
                <div class="clr-row">
               
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>User Type : <sup style="color: red">*</sup></label>
                        <select name="u_type" [(ngModel)]="u_type"  required>
                            <option>User</option>
                            <option>Location</option>
                        </select>
                    </div>
                    <div  class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Departments :<sup style="color: red">*</sup></strong></label >
                        <select  name="department"  [(ngModel)]="department"  (change)="getEmployees($event.target.value,$event.target.selectedIndex)" required >
                          <option></option>
                          <option *ngFor="let dept of departments">  {{ dept.department_name }} </option>
                        </select>
                      </div>
                    <div  *ngIf="u_type == 'User'" class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>User :<sup style="color: red">*</sup></strong></label >
                        <select  name="user_loc"  ngModel (change)="selectedEmployees($event.target.selectedIndex)" required >
                          <option></option>
                          <option *ngFor="let dept of employees"  >  {{ dept.emp_name }} </option>
                        </select>
                    </div>
                    <div  *ngIf="u_type == 'Location'"  class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                      <label>Location : <sup style="color: red">*</sup></label>
                      <select name="user_loc" ngModel="user_loc">
                        <option></option>
                        <option *ngFor="let section of sections">{{ section.section_name }}</option>
                      </select>
                    </div>
                    <div   class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                      <label>Type : <sup style="color: red">*</sup></label>
                      <select name="types" ngModel="types" required (change)="selectedEquipment($event.target.selectedIndex)" >
                        <option></option>
                        <option *ngFor="let section of equipments">{{ section.equipment_name }}</option>
                      </select>
                    </div>

                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Make : <sup style="color: red">*</sup></label>
                         <input type="text" name="make" [(ngModel)]="selectedEqp['make']" readonly>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>IP Series :</label>
                         <input type="text" name="ip_series" ngModel  >
                    </div>

                </div>
            </form>
        </div>
    </div>
    <div class="card-footer">
      <button type="button" class="btn btn-primary" (click)="save(unit)">{{'common.submit' | translate}}</button>
    </div>
</div>
