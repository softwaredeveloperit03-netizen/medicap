<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue; margin-top: -2px; text-align: left;"> Software Change Request </div>
            <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/it" style="background-color: red; color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
<div>
 <form #changerequestform="ngForm">
    <div class="card-block">
        <h4><b>Request Details</b></h4>
        <div class="card-text">
            <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Requester Name:</b><span style="color: red;">*</span></label>
                    <input type="text" name="request_name" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Requester Email:</b><span style="color: red;">*</span></label>
                    <input type="text" name="request_email" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Request Date:</b><span style="color: red;">*</span></label>
                    <input type="date" name="request_date" ngModel required>
                </div>
            </div>
        </div>
    </div>
    <div class="card">
     <div class="card-header" style="text-align: left; color: black; background-color: rgb(212, 208, 96);">Software Details</div>
        <div class="card-block">
          <div class="clr-row">
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Software Title:</b></strong></label>
                <input type="text" name="sw_name" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Module/Feature:</b></strong></label>
                <input type="text" name="module" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Current Version:</b></strong></label>
                <input type="text" name="version" ngModel >
            </div>
        </div>
      </div>
    </div>
    <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(96, 193, 223);">Proposed Change</div>
           <div class="card-block">
             <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Type of change:</b></label>
                    <select type="text" name="change" ngModel required>
                        <option></option>
                        <option>Bug Fix</option>
                        <option>Configration Change</option>
                        <option>Security Update</option>
                        <option>Feature Enhance</option>
                    </select>
                </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Description of Change:</b></strong></label>
                   <input type="text" name="description" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Justification for Change:</b></strong></label>
                   <input type="text" name="justification" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><b>Urgency:</b></label>
                <select type="text" name="urgency" ngModel required>
                    <option></option>
                    <option>Low</option>
                    <option>Medium</option>
                    <option>High</option>
                    <option>Critical</option>
                </select>
                </div>
           </div>
         </div>
       </div>
       <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(84, 224, 199);">Additional Information</div>
           <div class="card-block">
             <div class="clr-row">
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Attachment:</b></strong></label>
                   <input type="file" name="attachment_doc1" ngModel (change)="onFileChanged3($event)">
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Testing Plan:</b></strong></label>
                   <input type="text" name="test_plan" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Rebatch Plan:</b></strong></label>
                <input type="text" name="rebatch_plan" ngModel required>
            </div>
           </div>
         </div>
       </div>
       <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: lightgreen;">Approvel</div>
           <div class="card-block">
             <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Approval Required:</b></label>
                    <select type="text" name="approvel_requird" [(ngModel)]="approvel_requird" required>
                        <option></option>
                        <option>Yes</option>
                        <option>No</option>
                    </select>
                    </div>
               <div *ngIf="approvel_requird=='Yes'" class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Approver Name:</b></strong></label>
                   <input type="text" name="approver_name" ngModel required>
               </div>
               <div *ngIf="approvel_requird=='Yes'" class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Date of Approval:</b></strong></label>
                <input type="date" name="approval_date" ngModel required>
               </div>
               <div  class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Comments:</b></strong></label>
                <input type="text" name="comments" ngModel required >
               </div>
           </div>
         </div>
       </div>
       <div class="card">
          <div class="card-header" style="text-align: left; color: white; background-color:rgb(203, 71, 71);"> Declaration</div>
          <div class="card-block">
          <div class="clr-row">
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
             <p><b> I havemy acknowledge that the information provided in this change request is accurate to the best my knowledge.  Date:</b> <input type="date" name="declaration_date"  style="width: 200px;"/> </p>
           </div>
           </div>
          </div>
        </div>
      
</form>
</div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="save(changerequestform)">{{'common.submit' | translate}}</button>
    </div>
</div>
