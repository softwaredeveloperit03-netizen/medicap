<div class="card" *ngIf="!isNew">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-lg-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Work Order Request Form</div>
        <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-danger" routerLink="/it">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><b>To: It Department</b></label>
            </div>
            <form #secureAccCtrl="ngForm"  class="clr-row">
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Work Order: </label>
                    <input type="date" name="wkOrder" ngModel required>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>From: </label>
                    <input type="text" name="frm" ngModel required>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Requested By: <span style="color: red;"><b>*</b></span></label>
                    <input type="text" name="reqBy" ngModel required>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Date: <span style="color: red;"><b>*</b></span></label>
                    <input type="date" name="dt" ngModel required>
                </div>
                <div class="card">
                    <div class="card-header" style="text-align: center">
                        <div class="clr-row" style="margin-bottom: -10px;">
                            <div class="clr-col-lg-6" style="color: aliceblue;margin-top: -2px;text-align: left;">
                                To be filled by User department
                            </div>
                        </div>
                    </div>
                    <div class="card-block">
                        <div class="card-text">
                            <div class="clr-row">
                                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                    <label>Computer Id: <span style="color: red;"><b>*</b></span></label>
                                    <input type="text" name="compId" ngModel required>
                                </div>

                                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                    <label>Block/Area: <span style="color: red;"><b>*</b></span></label>
                                    <input type="text" name="blockArea" ngModel required>
                                </div>

                                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                    <label>Type Of Work: <span style="color: red;"><b>*</b></span></label>
                                    <input type="text" name="workType" ngModel required>
                                </div>

                                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                    <label>Description Of Job/Problem:<span style="color: red;"><b>*</b></span></label>
                                    <textarea name="jobPrblmDesc" rows="2" cols="100" ngModel required></textarea>
                                </div>

                                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                    <label>Requesting department (Sign): <span style="color: red;"><b>*</b></span></label>
                                    <input type="text" name="reqDept" ngModel required>
                                </div>

                                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                    <label>Requesting department (Date): <span style="color: red;"><b>*</b></span></label>
                                    <input type="date" name="deptDate" ngModel required>
                                </div>

                                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                    <label>Comment by QA/IPQA Dept. (will this repair affect the critical process)<span style="color: red;"><b>*</b></span></label>
                                    <div class="margin-right: 20px;">
                                        <input type="radio" name="option" value="yes">
                                        <label>Yes</label>
                                        <input type="radio" name="option" value="no">
                                        <label>No</label>
                                    </div>
                                </div>

                                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                    <label>QA/IPQA department (Sign): <span style="color: red;"><b>*</b></span></label>
                                    <input type="text" name="deptSign" ngModel required>
                                </div>

                                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                    <label>QA/IPQA department (Date): <span style="color: red;"><b>*</b></span></label>
                                    <input type="date" name="deptDate" ngModel required>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header" style="text-align: center">
                        <div class="clr-row" style="margin-bottom: -10px;">
                            <div class="clr-col-lg-6" style="color: aliceblue;margin-top: -2px;text-align: left;">To be filled by IT department</div>
                        </div>
                    </div>
                    <div class="card-block">
                        <div class="card-text">
                            <div class="clr-row">
                                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                    <label>Request received by: <span style="color: red;"><b>*</b></span></label>
                                    <input type="text" name="reqRecBy" ngModel required>
                                </div>

                                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                    <label>Date: <span style="color: red;"><b>*</b></span></label>
                                    <input type="date" name="itDate" ngModel required>
                                </div>

                                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                    <label>Time: <span style="color: red;"><b>*</b></span></label>
                                    <input type="time" name="itTime" ngModel required>
                                </div>

                                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                    <label>Sign: <span style="color: red;"><b>*</b></span></label>
                                    <input type="text" name="sign" ngModel required>
                                </div>

                                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                    <label>Summary of Repair Work Done:<span style="color: red;"><b>*</b></span></label>
                                    <textarea name="repWkSum" rows="2" cols="100" ngModel required></textarea>
                                </div>

                                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                    <label>Weather additional slips attached with this work order?<span style="color: red;"><b>*</b></span></label>
                                    <div style="gap: 20px;">
                                        <input type="radio" name="option" value="yes">
                                        <label>Yes</label>
                                        <input type="radio" name="option" value="no">
                                        <label>No</label>
                                    </div>
                                </div>

                                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                    <label>Completed By: <span style="color: red;"><b>*</b></span></label>
                                    <input type="text" name="compBy" ngModel required>
                                </div>

                                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                    <label>Time: <span style="color: red;"><b>*</b></span></label>
                                    <input type="time" name="wOTime" ngModel required>
                                </div>

                                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                    <label>Date: <span style="color: red;"><b>*</b></span></label>
                                    <input type="date" name="wODate" ngModel required>
                                </div>

                                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                    <label>Sign: <span style="color: red;"><b>*</b></span></label>
                                    <input type="text" name="wOSign" ngModel required>
                                </div>

                                <div class="card-block">
                                    <div class="clr-row">
                                        <label><b>Acceptance Note: Filled by User Department</b></label>
                                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                            <label>The computer is available for routine use:<span style="color: red;"><b>*</b></span></label>
                                            <div class="margin-right: 20px;">
                                                <input type="radio" name="option" value="yes">
                                                <label>Yes</label>
                                                <input type="radio" name="option" value="no">
                                                <label>No</label>
                                            </div>
                                        </div>

                                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                            <label>Checked By (User Department (Sign))</label>
                                            <input type="text" name="chckByUserSign" ngModel required>
                                        </div>

                                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                            <label>Checked By (User Department (Date))</label>
                                            <input type="date" name="chckByUserDate" ngModel required>
                                        </div>

                                    </div>
                                </div>

                                 <div class="card-block">
                                    <div class="clr-row">
                                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                            <label>Evaluation by Quality Assurance: Requalification of computer equired-<span style="color: red;"><b>*</b></span></label>
                                            <div class="margin-right: 20px;">
                                                <input type="radio" name="option" value="yes">
                                                <label>Yes</label>
                                                <input type="radio" name="option" value="no">
                                                <label>No</label>
                                            </div>
                                        </div>

                                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                            <label>User Department (Sign)</label>
                                            <input type="text" name="UserSign" ngModel required>
                                        </div>

                                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                            <label>User Department (Date)</label>
                                            <input type="date" name="UserDate" ngModel required>
                                        </div>

                                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                            <label>(QA/IPQA department) (Sign)</label>
                                            <input type="text" name="ipQASign" ngModel required>
                                        </div>

                                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                            <label>(QA/IPQA department) (Date)</label>
                                            <input type="date" name="ipQADate" ngModel required>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
