<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue; margin-top: -2px; text-align: left;"> Desktop Application Form </div>
            <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/it" style="background-color: red; color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
<div>
 <form #desktopapplicationform="ngForm">
    <div class="card-block">
        <h4><b>Request Details</b></h4>
        <div class="card-text">
            <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Requester Name:</b><span style="color: red;">*</span></label>
                    <input type="text" name="request_name" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Requester Email:</b><span style="color: red;">*</span></label>
                    <input type="text" name="request_email" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Request Date:</b><span style="color: red;">*</span></label>
                    <input type="date" name="request_date" ngModel required>
                </div>
            </div>
        </div>
    </div>
    <div class="card">
     <div class="card-header" style="text-align: left; color: black; background-color: rgb(212, 208, 96);">Application Details</div>
        <div class="card-block">
          <div class="clr-row">
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Application Title:</b></strong></label>
                <input type="text" name="apl_title" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Application Version:</b></strong></label>
                <input type="text" name="apl_reviev" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Application Vender:</b></strong></label>
                <input type="text" name="apl_vender" ngModel >
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Purpose of Application:</b></strong></label>
                <input type="text" name="apl_purpose" ngModel >
            </div>
        </div>
      </div>
    </div>
    <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(96, 193, 223);">Licence Information</div>
           <div class="card-block">
             <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Licence Type:</b></label>
                    <select type="text" name="licence_type" [(ngModel)]="licence_type" required>
                        <option></option>
                        <option>Single User</option>
                        <option> Multi User</option>
                        <option> Enterprises</option>
                        <option> Open Source</option>
                        <option> Other</option>
                    </select>
                </div>
               <div *ngIf="licence_type == 'Other'" class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Other:</b></strong></label>
                   <input type="text" name="other_lic" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Licence Key:</b></strong></label>
                   <input type="text" name="licence_key" ngModel required>
               </div>
           </div>
         </div>
       </div>
       <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(84, 224, 199);">Installation Details</div>
           <div class="card-block">
             <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Installation Details:</b></label>
                    <select type="text" name="licence_type" ngModel required>
                        <option></option>
                        <option> Local Machine</option>
                        <option> Network </option>
                        <option> Server</option>
                        <option> Cloud </option>
                    </select>
                </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Installation Path:</b></strong></label>
                   <input type="text" name="instol_path" ngModel required >
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Installation Configration Requirement:</b></strong></label>
                   <input type="text" name="requirement" ngModel required>
               </div>
           </div>
         </div>
       </div>
       <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: lightgreen;">User Access</div>
           <div class="card-block">
             <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><strong><b>User ID:</b><sup style="color: red;">*</sup></strong></label>
                    <input type="text" name="user_id" ngModel required>
                </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>User Name:</b><sup style="color: red;">*</sup></strong></label>
                   <input type="text" name="user_name" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Accsess Permission:</b><sup style="color: red;">*</sup></strong></label>
                <input type="text" name="acc_permisstion" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Integration Requirements:</b><sup style="color: red;">*</sup></strong></label>
                <input type="text" name="integ_requirement" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Dependencies:</b><sup style="color: red;">*</sup></strong></label>
                <input type="text" name="depandancy" ngModel required>
               </div>
           </div>
         </div>
       </div>
       <div class="card" >
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(219, 118, 163);">Approval</div>
           <div class="card-block">
             <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Approval Required:</b><span style="color: red;">*</span></label>
                    <select type="text" name="approvel_requird" [(ngModel)]="approvel_requird" required >
                        <option></option>
                        <option>Yes</option>
                        <option>No</option>
                    </select>
                    </div>
               <div *ngIf="approvel_requird == 'Yes'" class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Approver Name:</b></strong></label>
                   <input type="text" name="approver_name" ngModel required>
               </div>
               <div *ngIf="approvel_requird == 'Yes'" class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Date of Approval:</b></strong></label>
                <input type="date" name="approval_date" ngModel required>
               </div>
               <div  class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Comments:</b></strong></label>
                <input type="text" name="comments" ngModel required >
               </div>
           </div>
         </div>
       </div>
       <div class="card">
          <div class="card-header" style="text-align: left; color: white; background-color: rgb(203, 71, 71);"> Declaration</div>
          <div class="card-block">
          <div class="clr-row">
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
             <p><b> I hearby acknowledge that the information provided in this desktop application request is accurate to the best my knowledge.  Date:</b> <input type="date" name="declaration_date"  style="width: 200px;"/> </p>
           </div>
           </div>
          </div>
        </div>
      
</form>
</div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="save(desktopapplicationform)">{{'common.submit' | translate}}</button>
    </div>
</div>
