<div class="card" *ngIf="!isNew">
  <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-lg-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Template of List of Equipment/Instruments Required Backup</div>
        <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-primary" (click)="equipInst()">{{'common.new' | translate}}</button>
          <button class="btn btn-sm btn-danger" routerLink="/it/backuprestore">{{'common.close' | translate}}</button>
        </div>
      </div>
  </div>
  <div class="card-block">
      <div class="card-text">
        <label>Department: <input type="text" class="small-input" style="width: 200px;"></label>
        <clr-datagrid>
           <clr-dg-column>{{'common.table.srNo' | translate}}</clr-dg-column>
           <clr-dg-column style="text-align: left;">Name of Instrument/Equipment</clr-dg-column>
           <clr-dg-column style="text-align: left;">ID No.</clr-dg-column>
           <clr-dg-column style="text-align: left;">Software Name</clr-dg-column>
           <clr-dg-row *clrDgItems="let res of results; let i = index">
             <clr-dg-cell>{{i + 1}}.</clr-dg-cell>
             <clr-dg-cell style="text-align: left;">{{res.equipment_name}}</clr-dg-cell>
             <clr-dg-cell style="text-align: left;">{{res.equipment_code}}</clr-dg-cell>
             <clr-dg-cell style="text-align: left;">{{res.softwareName}}</clr-dg-cell>
              <clr-dg-cell></clr-dg-cell>
          </clr-dg-row>
         </clr-datagrid>
        </div>
    </div>
</div>

<div class="container-fluid" *ngIf="isNew">
  <div class="card">
    <div class="card-header" style="text-align: left;" >
      <div class="clr-row" style="margin-bottom: -10px">
      <div
        class="clr-col-lg-6"
        style="color: aliceblue; margin-top: -2px; text-align: left">
        Template of List of Equipment Instrument Required Backup
      </div>
      <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px">
      </div>
      <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px">
        <button class="btn btn-sm btn-danger" routerLink="/it/backuprestore">{{'common.close' | translate}}</button>
      </div>
    </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #equipbackupform="ngForm" class="clr-row">
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>
              Department Name<span style="color: red"><b>*</b></span>
            </label>
            <select name="depart" [(ngModel)]="depart" (change)="get_Equipments($event.target.value)">
              <option ></option>
              <option *ngFor="let data of departments;">{{data.department_name}}</option>
            </select>

          </div>
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>
                Name of Equipment/Instrument<span style="color: red"><b>*</b></span>
            </label>
            <select name="equipInst" ngModel required (change)="GetQuipData($event.target.selectedIndex)">
              <option  ></option>
          <option *ngFor="let data of equipments;">{{data.equipment_name}}</option>
            </select>
          </div>
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>
                ID No.<span style="color: red"><b>*</b></span>
            </label>
            <input type="text" name="idNo" [(ngModel)]="selectedEquip['equipment_code']" required />
          </div>
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>
              Software Name<span style="color: red"><b>*</b></span>
            </label>
            <input type="text" name="softwareName" ngModel required>

          </div>
        </form>
        <button class="btn btn-danger" (click)="save(equipbackupform)">{{'common.submit' | translate}}</button>
      </div>
    </div>

      </label>
    </div> -->
  </div>
</div>
