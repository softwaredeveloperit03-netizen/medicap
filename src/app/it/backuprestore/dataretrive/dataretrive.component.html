<div class="card" *ngIf="!isNew">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-lg-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Data Restore Retrieve Form</div>
        <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-danger" routerLink="/it/backuprestore">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <clr-datagrid>
           <clr-dg-column>{{'common.table.srNo' | translate}}</clr-dg-column>
           <clr-dg-column style="text-align: left;">Date of Restoration</clr-dg-column>
           <clr-dg-column style="text-align: left;">Data Restored By</clr-dg-column>
           <clr-dg-column style="text-align: left;">Data Verified By</clr-dg-column>
           <clr-dg-column style="text-align: left;">Status (OK/Not OK/NA)</clr-dg-column>
           <clr-dg-column style="text-align: left;">{{'common.remarks' | translate}}</clr-dg-column>
           <clr-dg-row *clrDgItems="let res of results; let i = index">
             <clr-dg-cell>{{i + 1}}.</clr-dg-cell>
             <clr-dg-cell style="text-align: left;">{{res.equipDate}}</clr-dg-cell>
             <clr-dg-cell style="text-align: left;">{{res.backupFrom}}</clr-dg-cell>
             <clr-dg-cell style="text-align: left;">{{res.backupTo}}</clr-dg-cell>
             <clr-dg-cell style="text-align: left;">{{res.cdNo}}</clr-dg-cell>
             <clr-dg-cell style="text-align: left;">{{res.performedBy}}</clr-dg-cell>
              <clr-dg-cell style="text-align: left;">{{res.varifiedBy}}</clr-dg-cell>
              <clr-dg-cell></clr-dg-cell>
          </clr-dg-row>
         </clr-datagrid>
        </div>
    </div>
</div>
