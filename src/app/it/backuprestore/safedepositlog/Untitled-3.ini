1. Equipment/work area Inspected
2. Equipment/Pipelines have been:-
a. Depressurized, Drained, Free from sludge & washed with water and brought to room temperature.
b. Free from any extraneous matter-gas, fumes and dangerous liquid or any form of energy and is cleaned by disconnection & blinding.
c. Steamed and purged with inert gas, if required.
d. Tags and cautionary notices displayed and Area is barricaded.
3.  Proper means of entry and exit are made available at all times.
4. Equipment venting into the building is shut off.
5. Arrangements made for sufficient ventilation.
6. Use of Personal Protective Equipments:	 Helmets	 Safety Goggle	 Safety Shoes	 Apron	Face Shield	Ear Plug/ Muff
 Pressure suit	Gas/Dust Mask	Airline Respirator	Hand gloves	Safety belts Full Body harness	Fall Arrester	Life Line
