<div class="card" *ngIf="!isNew">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-lg-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Monitoring of Temperature of Server Room</div>
        <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-primary" (click)="isNew=true">{{'common.new' | translate}}</button>
          <button class="btn btn-sm btn-danger" routerLink="/it">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <clr-datagrid>
           <clr-dg-column style="text-align: left;">{{'common.date' | translate}}</clr-dg-column>
           <clr-dg-column style="text-align: left;">Time</clr-dg-column>
           <clr-dg-column style="text-align: left;">Temperature</clr-dg-column>
           <clr-dg-column style="text-align: left;">Observed By</clr-dg-column>
           <clr-dg-column style="text-align: left;">Checked By</clr-dg-column>
           <clr-dg-column style="text-align: left;">{{'common.table.remark' | translate}}</clr-dg-column>
           <clr-dg-row *clrDgItems="let res of results; let i = index">
                <clr-dg-cell>{{i + 1}}.</clr-dg-cell>
                <clr-dg-cell style="text-align: left;">{{res.recDate}}</clr-dg-cell>
                <clr-dg-cell style="text-align: left;">{{res.recTime}}</clr-dg-cell>
                <clr-dg-cell style="text-align: left;">{{res.temp}}</clr-dg-cell>
                <clr-dg-cell style="text-align: left;">{{res.observedBy}}</clr-dg-cell>
                <clr-dg-cell style="text-align: left;">{{res.chkBy}}</clr-dg-cell>
                <clr-dg-cell style="text-align: left;">{{res.remark}}</clr-dg-cell>
          </clr-dg-row>
         </clr-datagrid>
        </div>
    </div>
</div>

<div class="card" *ngIf="isNew">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-lg-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Monitoring of Temperature of Server Room</div>
        <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-danger" routerLink="/it">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
        <div class="card-text">
              <form #tempMonit="ngForm"  class="clr-row">
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Date: <span style="color: red;"><b>*</b></span></label>
                        <input type="date" name="recDate" ngModel required>
                  </div>
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Time: <span style="color: red;"><b>*</b></span></label>
                        <input type="time" name="recTime" ngModel required>
                  </div>
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Temperature: <span style="color: red;"><b>*</b></span></label>
                        <input type="text" name="temp" ngModel required>
                  </div>
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Observed By: <span style="color: red;"><b>*</b></span></label>
                        <input type="text" name="observedBy" ngModel required>
                  </div>
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Checked By: </label>
                        <input type="text" name="chkBy" ngModel required>
                  </div>
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Remark: </label>
                        <input type="text" name="remark" ngModel required>
                  </div>
              </form>
        </div>
    </div>
</div>
