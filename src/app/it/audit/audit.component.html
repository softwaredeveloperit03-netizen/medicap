<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue; margin-top: -2px; text-align: left;"> Audit Trial </div>
            <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/it" style="background-color: red; color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
<div>
 <form #auditform="ngForm">
    <div class="card-block">
        <h4>Audit Details</h4>
        <div class="card-text">
            <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Date of Audit:</b></label>
                    <input type="date" name="audit_date" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Audited System :</b></label>
                    <input type="text" name="audit_system" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Audited Module/Feature:</b></label>
                    <input type="text" name="feature" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Audited By:</b></label>
                    <input type="text" name="audit_by" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Audit Type:</b></label>
                    <select type="text" name="audit_type" [(ngModel)]="audit_type" required>
                        <option></option>
                        <option>Security Audit</option>
                        <option>Compliance Audit</option>
                        <option>Performance Audit</option>
                        <option>Configuration Audit</option>
                        <option>Other</option>
                    </select>
                </div>
                <div *ngIf="audit_type == 'Other'" class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Other:</b></label>
                    <input type="text" name="other_audit_type" ngModel required>
                </div>
            </div>
        </div>
    </div>
    <div class="card">
     <div class="card-header" style="text-align: left; color: black; background-color: lightgreen;">Changes & Action Taken</div>
        <div class="card-block">
          <div class="clr-row">
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Date/Time of Change:</b></strong></label>
                <input type="date" name="date_change" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>User Responsible:</b></strong></label>
                <input type="text" name="user_esponce" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><b>Type of Change:</b></label>
                <select type="text" name="type_change" ngModel required>
                    <option></option>
                    <option>Configuration Change</option>
                    <option> Data Modification </option>
                    <option>User Access Change</option>
                    <option>System Update/Patch</option>
                </select>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Description of Change:</b></strong></label>
                <input type="text" name="description_change" ngModel >
            </div>
        </div>
      </div>
    </div>
</form>
</div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="save(auditform)">{{'common.submit' | translate}}</button>
    </div>
</div>
