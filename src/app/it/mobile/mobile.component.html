<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue; margin-top: -2px; text-align: left;"> Mobile Application Form </div>
            <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/it" style="background-color: red; color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
            </div>
        </div>
    </div>
<div>
 <form #mobileapplicationform="ngForm">
    <div class="card-block">
        <h4><b>Request Details</b></h4>
        <div class="card-text">
            <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Requester Name:</b><span style="color: red;">*</span></label>
                    <input type="text" name="request_name" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Requester Email:</b><span style="color: red;">*</span></label>
                    <input type="text" name="request_email" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Request Date:</b><span style="color: red;">*</span></label>
                    <input type="date" name="request_date" ngModel required>
                </div>
            </div>
        </div>
    </div>
    <div class="card">
     <div class="card-header" style="text-align: left; color: black; background-color: rgb(212, 208, 96);">Application Details</div>
        <div class="card-block">
          <div class="clr-row">
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Application Title:</b><sup style="color: red;">*</sup></strong></label>
                <input type="text" name="apl_title" ngModel required>
            </div>
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><b>Application Platform:</b><span style="color: red;">*</span></label>
                <select type="text" name="apl_platform" ngModel required>
                    <option></option>
                    <option>iOS</option>
                    <option>Android</option>
                </select>
            </div>
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Application Version:</b><sup style="color: red;">*</sup></strong></label>
                <input type="text" name="apl_version" ngModel required>
            </div>
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Purpose of Application:</b><sup style="color: red;">*</sup></strong></label>
                <input type="text" name="apl_purpose" ngModel >
            </div>
        </div>
      </div>
    </div>
    <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(96, 193, 223);">Licence Information</div>
           <div class="card-block">
             <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Licence Type:</b><span style="color: red;">*</span></label>
                    <select type="text" name="licence_type" ngModel required>
                        <option></option>
                        <option>Free</option>
                        <option>Paid</option>
                        <option>Premium</option>
                        <option>Open Source</option>
                    </select>
                </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Other:</b><sup style="color: red;">*</sup></strong></label>
                   <input type="text" name="other" ngModel required>
               </div>
           </div>
         </div>
       </div>
       <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(84, 224, 199);">Installation Details</div>
           <div class="card-block">
             <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Distribution Method:</b><span style="color: red;">*</span></label>
                    <select type="text" name="dist_method" ngModel required>
                        <option></option>
                        <option> App</option>
                        <option> Store </option>
                        <option> In House</option>
                        <option> Open </option>
                    </select>
                </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Target devices:</b><sup style="color: red;">*</sup></strong></label>
                   <input type="text" name="target_dev" ngModel required >
               </div>
           </div>
         </div>
       </div>
       <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: lightgreen;">User Access</div>
           <div class="card-block">
             <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><strong><b>User ID:</b><sup style="color: red;">*</sup></strong></label>
                    <input type="text" name="user_id" ngModel required>
                </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>User Name:</b><sup style="color: red;">*</sup></strong></label>
                   <input type="text" name="user_name" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Accsess Permission:</b><sup style="color: red;">*</sup></strong></label>
                <input type="text" name="acc_permisstion" ngModel required>
               </div>
           </div>
         </div>
       </div>
       <div class="card">
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(209, 228, 114);">Integration Requirement</div>
           <div class="card-block">
             <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><strong><b>Integration With Other System:</b><sup style="color: red;">*</sup></strong></label>
                    <input type="text" name="integration_sys" ngModel required>
                </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Dependencies:</b><sup style="color: red;">*</sup></strong></label>
                   <input type="text" name="dependancies" ngModel required>
               </div>
               <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Security Requirement:</b><sup style="color: red;">*</sup></strong></label>
                <input type="text" name="security_requir" ngModel required>
               </div>
           </div>
         </div>
       </div>
       <div class="card" >
        <div class="card-header" style="text-align: left; color: black; background-color: rgb(219, 118, 163);">Approval</div>
           <div class="card-block">
             <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><b>Approval Required:</b><span style="color: red;">*</span></label>
                    <select type="text" name="approvel_requird" [(ngModel)]="approvel_requird" required >
                        <option></option>
                        <option>Yes</option>
                        <option>No</option>
                    </select>
                    </div>
               <div *ngIf="approvel_requird == 'Yes'" class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                   <label><strong><b>Approver Name:</b><sup style="color: red;">*</sup></strong></label>
                   <input type="text" name="approver_name" ngModel required>
               </div>
               <div *ngIf="approvel_requird == 'Yes'" class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Date of Approval:</b><sup style="color: red;">*</sup></strong></label>
                <input type="date" name="approval_date" ngModel required>
               </div>
               <div  class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong><b>Comments:</b><sup style="color: red;">*</sup></strong></label>
                <input type="text" name="comments" ngModel required >
               </div>
           </div>
         </div>
       </div>
       <div class="card">
          <div class="card-header" style="text-align: left; color: white; background-color: rgb(203, 71, 71);"> Declaration</div>
          <div class="card-block">
          <div class="clr-row">
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
             <p><b> I hearby acknowledge that the information provided in this Mobile application request is accurate to the best my knowledge.  Date:</b> <input type="date" name="declaration_date"  style="width: 200px;"/> </p>
           </div>
           </div>
          </div>
        </div>
      
</form>
</div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="save(mobileapplicationform)">{{'common.submit' | translate}}</button>
    </div>
</div>
