<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Goods Receipt Notes label Printing</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/godownStore/raw/grn" style="background-color: red;color: white;"> {{'common.close' | translate}} </button>
          </div>
        </div>
      </div>
      <div class="card-block">
        <div class="clr-row">
          <div class="clr-col-lg-5">
            <label>Search </label>
            <input type="text" placeholder="Search..."   [(ngModel)]="searchQuery">
           </div>
        </div>
        <div class="card-text">
          <div class="datagrid-wrapper">
      
            <clr-datagrid  [clrDgLoading]="loading" [clrDgFilter]="searchQuery">
              
                <clr-dg-column>Sr.</clr-dg-column>
                <clr-dg-column clrDgField="batch_no">Medicap Lot No</clr-dg-column>
                <clr-dg-column clrDgField="material_name">Material Name</clr-dg-column>
                <clr-dg-column clrDgField="material_code">Material Code</clr-dg-column>
                <clr-dg-column >Grade</clr-dg-column>
                <clr-dg-column clrDgField="grn_no">Receiving no</clr-dg-column>
                <clr-dg-column>Containers</clr-dg-column>
                <clr-dg-column>Label</clr-dg-column>
                <clr-dg-column>Barcode</clr-dg-column>
            
              <clr-dg-row *clrDgItems="let result of filteredMaterials; let i = index" [clrDgItem]="result" >
                <clr-dg-cell>{{i+1}}</clr-dg-cell>
                <clr-dg-cell>{{ result.batch_no }}</clr-dg-cell>
                <clr-dg-cell>{{ result.material_name }}</clr-dg-cell>
                <clr-dg-cell>{{ result.material_code }}</clr-dg-cell>
                <clr-dg-cell>{{ result.gradeName }}</clr-dg-cell>
                <clr-dg-cell>{{ result.grn_no }}</clr-dg-cell>
                <clr-dg-cell>{{ result.containers }}</clr-dg-cell>
                <clr-dg-cell><button class="btn btn-sm btn-info" (click)="printLabel(i)">Print Label</button></clr-dg-cell>
                <clr-dg-cell><button class="btn btn-sm btn-info" (click)="printBarcode(i)">Print Barcode</button></clr-dg-cell>
              </clr-dg-row>
            </clr-datagrid>
      
          </div>
          <div class="card-footer">
            <button class="btn btn-sm" routerLink="/godownStore/raw/grn/label/" style="background-color: red;color: white;"> {{'common.close' | translate}} </button>
          </div>
        </div>
      </div>
    </div>
</div>
