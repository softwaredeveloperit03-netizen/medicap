<div class="container-fluid" *ngIf="!isShow">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Resignation Requested Employees</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/hr/resignation" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
      <div class="card-block">
        <div class="card-text">
          <div class="clr-row">
            <div class="clr-col-lg-5 clr-col-md-5 clr-col-sm-12 clr-col-xs-12">
              <label>Department:</label>
              <select name="department" [(ngModel)]="department_name" required style="height: 33px;">
                <option></option>
                <option *ngFor="let department of departments">{{ department.department_name }}</option>
              </select>
            </div>
           
            <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
              <button class="btn btn-danger" style="margin-top:30px;" (click)="getPendingExitInterview()">{{'common.search' | translate}}</button>
            </div>
          </div>
          <table class="table">
              <th  style="background-color: rgb(14, 67, 112); color: white;">Emp ID</th>
              <th  style="background-color: rgb(14, 67, 112); color: white;">{{'common.department' | translate}}</th>
              <th  style="background-color: rgb(14, 67, 112); color: white;">Releaving Date</th>
              <th  style="background-color: rgb(14, 67, 112); color: white;">Subject</th>
              <th  style="background-color: rgb(14, 67, 112); color: white;">view</th>
          
              <tr *ngFor="let user of resignations; let i = index">
                  <td>{{user.emp_id}}</td>
                  <td>{{user.department}}</td>
                  <td>{{user.releaving_date}}</td>
                  <td>{{user.subject}}</td>
                  <td>
                    <button class="btn btn-sm" (click)="showResignation(i)">{{'common.view' | translate}}</button>
                  </td>
              </tr>
          </table>
        </div>
      </div>
    </div>
  </div>
  
  <div class="container-fluid" *ngIf="isShow">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Exit Interview</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/resignation-dashboard" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
      <div class="card-block">
        <div class="card-text">
          <form class="clr-row" #exitForm="ngForm">
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Employee Id</label>
              <input type="text" name="employee_id" ngModel="{{ selectedResignation['emp_id'] }}" readonly >
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>{{'common.department' | translate}}</label>
              <input type="text" name="department" ngModel="{{ selectedResignation['department'] }}" readonly>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Resignation Date</label>
              <input type="date" name="resignation_date" ngModel="{{ selectedResignation['entry_date'] | date }}" readonly>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Releaving Date</label>
              <input type="date" name="releaving_date" ngModel="{{ selectedResignation['releaving_date'] }}" readonly >
            </div>
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>Reason for Resignation</label>
              <textarea rows="3" name="resignation_reason" ngModel="{{ selectedResignation['reason'] }}" readonly required></textarea>
            </div>
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>What is Real Reason?</label><br>
              <div class="form-inline">
                <input type="radio" id="is_real_reason1" name="is_real_reason" ngModel value="Same as Above">
                <label for="is_real_reason1">Same as Above</label> &nbsp;&nbsp;&nbsp;
                <input type="radio" id="is_real_reason2" name="is_real_reason" ngModel value="Other">
                <label for="is_real_reason2">Other</label>
              </div>
            </div>
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>Any Interpersonal disputes</label>
              <div class="form-inline">
              <input type="radio" id="interpersonal_disputes3" name="interpersonal_disputes" ngModel value="Yes">
              <label for="interpersonal_disputes3">Yes</label> &nbsp;&nbsp;&nbsp;
              <input type="radio" id="interpersonal_disputes4" name="interpersonal_disputes" ngModel value="No">
              <label for="interpersonal_disputes4">No</label>
              </div>
            </div>
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>Any Other Reason</label>
              <textarea rows="3" name="other_reason" ngModel required></textarea>
            </div>
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>If company resolves issue can you retain your service</label>
              <div class="form-inline">
              <input type="radio" id="retain_service3" name="retain_service" ngModel value="Yes">
              <label for="retain_service3">Yes</label> &nbsp;&nbsp;&nbsp;
              <input type="radio" id="retain_service4" name="retain_service" ngModel value="No">
              <label for="retain_service4">No</label>
              </div>
            </div>
          </form>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="exitForm.form.valid && saveExitInterview(exitForm)">{{'common.submit' | translate}}</button>
      </div>
    </div>
  </div>
