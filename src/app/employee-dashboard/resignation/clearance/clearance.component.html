<div class="container-fluid" *ngIf="!isSelectedResignation">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Department Clearence</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/hr/resignation" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <div class="clr-row">
          <div class="clr-col-lg-5 clr-col-md-5 clr-col-sm-12 clr-col-xs-12">
            <label>Employee Name:</label>
            <select name="employee" ngModel required style="height: 33px;">
              <option></option>
              <option *ngFor="let list of employeeList" [value]="list.emp_id">{{ list.firstname }}</option>
          </select>
          </div>
         
          <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
            <button class="btn btn-danger" style="margin-top:30px;" (click)="getPendingResignations()">{{'common.search' | translate}}</button>
          </div>
        </div>
        <table class="table">
          <tr>
            <th style="background-color: rgb(14, 67, 112); color: white;">Emp ID</th>
            <th style="background-color: rgb(14, 67, 112); color: white;">{{'common.name' | translate}}</th>
            <th style="background-color: rgb(14, 67, 112); color: white;">Subject</th>
            <th style="background-color: rgb(14, 67, 112); color: white;">Request Date</th>
            <th style="background-color: rgb(14, 67, 112); color: white;">view</th>
          <tr>

          <tr *ngFor="let user of resignations; let i = index">
            <td>{{user.emp_id}}</td>
            <td>{{user.emp_name}}</td>
            <td>{{user.subject}}</td>
            <td>{{user.entry_date}}</td>
            <td>
              <button class="btn btn-sm" (click)="DepartmentClearence(user)">{{'common.approve' | translate}}</button>
            </td>
          </tr>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid" *ngIf="isSelectedResignation">
  <div class="card">
    <div class="card-header">Resignation Acceptance</div>
    <div class="card-block">
      <div class="card-text">
        <form class="clr-row" #reportForm="ngForm">
          <input type="hidden" name="resignation_id" ngModel="{{ selectedResignation['id'] }}" required>
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Employee Id:</label>
            <input type="text" name="emp_id" ngModel="{{ selectedResignation['emp_id'] }}" readonly>
          </div>
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Employee Name:</label>
            <input type="text" name="emp_name" ngModel="{{ selectedResignation['emp_name'] }}" readonly>
          </div>
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Department:</label>
            <input type="text" name="department" ngModel="{{ selectedResignation['department'] }}" readonly>
          </div>
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Designation:</label>
            <input type="text" name="designation" ngModel="{{ selectedResignation['designation'] }}" readonly>
          </div>
          <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
            <label>Subject:</label>
            <input type="text" name="subject" ngModel="{{ selectedResignation['subject'] }}" readonly>
          </div>
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label>Expected Notice Period:</label>
            <input type="text" name="expected_notice" ngModel="{{ selectedResignation['expected_notice'] }}" readonly>
          </div>
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label>Expected Releaving Date:</label>
            <input type="text" name="expected_releaving" ngModel="{{ selectedResignation['expected_releaving'] }}"
              readonly>
          </div>
          <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
            <label>Reason for Resignation:</label>
            <textarea rows="5" name="reason" ngModel="{{ selectedResignation['reason'] }}" readonly></textarea>
          </div>
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label>Reasignation Status:</label>
            <select name="resignation_status" ngModel="Accepted">
              <option>Accepted</option>
              <option>{{'common.rejected' | translate}}</option>
            </select>
          </div>
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label>Releaving On Date:</label>
            <input type="date" name="releaving_date" ngModel required>
          </div>
          <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
            <label>Remark:</label>
            <textarea rows="2" name="resignation_remark" ngModel required></textarea>
          </div>
          <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12" ngModelGroup="clerance_department">
            <label>Clerance Departments:</label>
            <div class="clr-row">
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12" *ngFor="let department of departments">
                <input type="checkbox" id="{{ department.department_name }}" name="{{ department.department_name }}"
                  value="{{ department.department_name }}" ngModel />
                <label for="{{ department.department_name }}">{{ department.department_name }}</label>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="DepartmentClearence(reportForm)">{{'common.submit' | translate}}</button>
      <button class="btn btn-danger" (click)="closeform(reportForm)">{{'common.close' | translate}}</button>
    </div>
  </div>
</div>
