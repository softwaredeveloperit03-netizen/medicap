<div class="card">
  <div class="card-header">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-lg-9 clr-col-md-9 clr-col-sm-12" style="color: aliceblue; margin-top: -2px; text-align: left;">
        My Outpass
      </div>
      <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12" style="text-align: right; padding-right: 0px; margin-top: -7px;">
        <button class="btn btn-sm btn-success" routerLink="new">NEW OUTPASS</button>
        <button class="btn btn-sm btn-danger" routerLink="/employee-dashboard/dashboard">{{'common.close' | translate}}</button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <div class="clr-row" style="margin-bottom: 1rem; align-items: flex-end;">
      <div class="clr-col-lg-5">
        <label>Search</label>
        <input type="text" placeholder="Search..." [(ngModel)]="searchQuery">
      </div>
    </div>
    <div class="card-text">
      <div class="datagrid-wrapper" style="overflow-x: auto;">
        <clr-datagrid [clrDgFilter]="searchQuery" >
          <clr-dg-column style="width: 40px;">#</clr-dg-column>
          <clr-dg-column>Pass No</clr-dg-column>
          <clr-dg-column>Employee</clr-dg-column>
          <clr-dg-column>{{'common.department' | translate}}</clr-dg-column>
          <clr-dg-column>Reason</clr-dg-column>
          <clr-dg-column>Created On</clr-dg-column>
          <clr-dg-column>{{'common.status' | translate}}</clr-dg-column>

          <clr-dg-row *clrDgItems="let r of filteredResults; let i = index" [clrDgItem]="r">
            <clr-dg-cell>{{ i + 1 }}</clr-dg-cell>
            <clr-dg-cell>{{ r.pass_no }}</clr-dg-cell>
            <clr-dg-cell>{{ r.emp_name }}</clr-dg-cell>
            <clr-dg-cell>{{ r.department }}</clr-dg-cell>
            <clr-dg-cell>
              <div>{{ r.reason }}</div>
              <div class="reason-details" *ngIf="r.reason_details">{{ r.reason_details }}</div>
            </clr-dg-cell>
            <clr-dg-cell>{{ r.createdOn | date:'dd-MM-yyyy HH:mm' }}</clr-dg-cell>
            <clr-dg-cell>{{ getStatusLabel(r.status) }}</clr-dg-cell>
          </clr-dg-row>
        </clr-datagrid>
      </div>
    </div>
  </div>
  <div class="card-footer">
    <button type="button" class="btn btn-primary" (click)="download()">{{'common.download' | translate}} PDF</button>
  </div>
</div>
