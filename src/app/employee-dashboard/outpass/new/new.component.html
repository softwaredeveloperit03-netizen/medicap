<div class="container-fluid">
  <div class="card">
    <div class="card-header">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue; margin-top: -2px; text-align: left;">New Outpass</div>
        <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/employee-dashboard/outpass" style="background-color: red; color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #outpassForm="ngForm">
          <div class="clr-row">
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Employee ID <span style="color: red">*</span></label>
              <input type="text" name="emp_id" [(ngModel)]="emp_id" required readonly>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Employee Name <span style="color: red">*</span></label>
              <input type="text" name="emp_name" [(ngModel)]="emp_name" required readonly>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Department <span style="color: red">*</span></label>
              <input type="text" name="department" [(ngModel)]="department" required readonly>
            </div>
          </div>
          <div class="clr-row">
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Reason for Outpass <span style="color: red">*</span></label>
              <select name="reason" [(ngModel)]="reason" required>
                <option value=""></option>
                <option *ngFor="let r of reasons" [value]="r">{{ r }}</option>
              </select>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12" *ngIf="reason">
              <label>Details (if any)</label>
              <input type="text" name="reason_details" [(ngModel)]="reason_details" placeholder="Additional details">
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button type="button" class="btn btn-success" (click)="saveOutpass(outpassForm)">{{'common.save' | translate}}</button>
      <button type="button" class="btn btn-outline" routerLink="/employee-dashboard/outpass">{{'common.cancel' | translate}}</button>
    </div>
  </div>
</div>
