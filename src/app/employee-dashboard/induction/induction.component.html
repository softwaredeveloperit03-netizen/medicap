  <div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Induction Training Form</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-danger" routerLink="/employee-dashboard/dashboard">{{'common.close' | translate}}</button>
          </div>
        </div>
      </div>
      <div class="card-block">
        <div class="card-text">
          <form #inductionForm="ngForm">
            <table class="table">
              <tr>
                <th>Sr</th>
                <th>Visiting Department</th>
                <th>Activity</th>
                <th>Person Contacted</th>
                <th>Equipment Seen</th>
                <th>Start Time</th>
                <th>End Time</th>
              </tr>
              <tr>
                <td>0.</td>
                <td style="padding: 0px;">
                  <select name="department" ngModel required style="margin: 0px;" (change)="getAllEmployee($event.target.value)">
                    <option></option>
                    <option *ngFor="let department of departments">{{department.department_name}}</option>
                  </select>
                </td>
                <td style="padding:0px"><input type="text" name="activity" ngModel style="margin: 0px;"></td>
                <td style="padding: 0px;">
                  <select name="person" ngModel required style="margin: 0px;">
                    <option></option>
                    <option *ngFor="let emp of employees" [value]="emp.emp_id">{{emp.firstname}}</option>
                  </select>
                </td>
                <td style="padding: 0px;">
                  <select name="equipment_code" ngModel  style="margin: 0px;">
                    <option></option>
                    <option>Not Applicable</option>
                    <option *ngFor="let emp of equipments">{{emp.equipment_name}}</option>
                  </select>
                </td>
                <td style="padding:0px;">
                  <input type = "time" name="start_time" ngModel required style="margin: 0px;"></td>
                <td style="padding:0px;">
                  <input type = "time" name="end_time" ngModel required style="margin: 0px;"
                  ></td>
                <td style="padding:0px"><button class="btn btn-sm btn-info"(click)="AddEquipment(inductionForm)">{{'common.add' | translate}}</button></td>
              </tr>
              <tr *ngFor ="let trainig of activities;let i=index">
                <td>{{i+1}}</td>
                <td>{{trainig.department}}</td>
                <td>{{trainig.activity}}</td>
                <td>{{trainig.person}}</td>
                <td>{{trainig.start_time}}</td>
                <td>{{trainig.end_time}}</td>
                <td><clr-icon class="is-error" shape="trash" (click)="delEquipment(i)"></clr-icon></td>
              </tr>
            </table>
          </form>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="save()">{{'common.save' | translate}}</button>
      </div>
    </div>
  </div>
