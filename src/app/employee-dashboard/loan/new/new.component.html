<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> Personal Loan Form </div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/employee-dashboard/loan" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon>{{'common.close' | translate}}</button>
          </div>
        </div>
      </div>
      <div class="card-block">
        <div class="card-text">
          <form #Form="ngForm">
            <div class="clr-row">

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Employee ID:<sup style="color: red">*</sup></strong></label>
                <input type="text" name="emp_id" [(ngModel)]="emp_id" required> 
            </div>
              
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Employee Name:<sup style="color: red">*</sup></strong></label>
                <input type="text" name="emp_name" [(ngModel)]="emp_name" required> 
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Departments:<sup style="color: red">*</sup></strong></label>
                <select name="department" ngModel
                    (change)="getDesignation($event.target.selectedIndex)" required
                    style="height: 33px;">
                    <option></option>
                    <option *ngFor="let department of departments">{{
                        department.department_name }}</option>
                </select>
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Designation:<sup style="color: red">*</sup>:</strong></label>
                <select name="designation" ngModel required style="height: 33px;">
                    <option></option>
                    <option *ngFor="let designation of designations">{{
                        designation.designation }}</option>
                </select>
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Loan Amount:<span style="color: red;">*</span> </label>
                <input type="number" name="amount" ngModel required>
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Date Of Joining:<span style="color: red;">*</span> </label>
                <input type="date" name="entry_date" [(ngModel)]="entry_date" required>
            </div>

            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Return Tensure:<span style="color: red;">*</span> </label>
                <select name="return_tensure" ngModel required>
                    <option>3 Months</option>
                    <option>6 Months</option>
                    <option>9 Months</option>
                    <option>12 Months</option>
                    <option>15 Months</option>
                  </select>
            </div>
  
            <div class="clr-col-lg-3 clr-col-md-2 clr-col-sm-6 clr-col-xs-6">
                <label>Installment:<span style="color: red;">*</span></label>
                <input type="number" name="installment" ngModel required>
              </div>

              <div class="clr-col-lg-3 clr-col-md-2 clr-col-sm-6 clr-col-xs-6">
                <label>Deduct From:<span style="color: red;">*</span></label>
                <input type="date" name="deduct" ngModel required>
              </div>

              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Checker:<span style="color: red;">*</span> </label>
                <select name="checker" ngModel required>
                    <option>Id: 170</option>
                    <option>ID: 171</option>
                    <option>ID: 172</option>
                    <option>ID: 173</option>
                    <option>ID: 174</option>
                    <option>ID: 175</option>
                  </select>
            </div>
  
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Approver:<span style="color: red;">*</span> </label>
                <select name="approver" ngModel required>
                    <option>Id: 170</option>
                    <option>ID: 171</option>
                    <option>ID: 172</option>
                    <option>ID: 173</option>
                    <option>ID: 174</option>
                    <option>ID: 175</option>
                  </select>
            </div>
                           
            </div>
          </form>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="saveloan(Form)">{{'common.save' | translate}}</button>
      </div>
    </div>
  </div>
