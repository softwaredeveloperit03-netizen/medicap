<div class="container-fluid">
  <div class="card">
    <div class="card-header">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue; margin-top: -2px; text-align: left;">New Outdoor Duty</div>
        <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/employee-dashboard/duty" style="background-color: red; color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #dutyForm="ngForm">
          <div class="clr-row">
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Employee ID <span style="color: red">*</span></label>
              <input type="text" name="emp_id" [(ngModel)]="emp_id" required readonly>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Employee Name <span style="color: red">*</span></label>
              <input type="text" name="emp_name" [(ngModel)]="emp_name" required readonly>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Department <span style="color: red">*</span></label>
              <input type="text" name="department" [(ngModel)]="department" required readonly>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Designation <span style="color: red">*</span></label>
              <input type="text" name="designation" [(ngModel)]="designation" required readonly>
            </div>
          </div>
          <div class="clr-row">
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Outstation Duty Details <span style="color: red">*</span></label>
              <input type="text" name="duty_details" [(ngModel)]="duty_details" required>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>From Date <span style="color: red">*</span></label>
              <input type="date" name="from_date" [(ngModel)]="from_date" (ngModelChange)="onDatesChange()" required>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>To Date <span style="color: red">*</span></label>
              <input type="date" name="to_date" [(ngModel)]="to_date" (ngModelChange)="onDatesChange()" required>
            </div>
            <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
              <label>Total Days <span style="color: red">*</span></label>
              <input type="text" name="total_days" [(ngModel)]="total_days" required readonly>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button type="button" class="btn btn-success" (click)="saveduty(dutyForm)">{{'common.save' | translate}}</button>
      <button type="button" class="btn btn-outline" routerLink="/employee-dashboard/duty">{{'common.cancel' | translate}}</button>
    </div>
  </div>
</div>
