
<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Pending leave</div>
        <div class="clr-col-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/employee-dashboard/pending" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
  <div class="card-block">
    <div class="card-text">
       <table class=" table table-border">
            <tr>
                <th style="text-align: left;">Sr.</th>
                <th style="text-align: left;">Leave type</th>
                <th style="text-align: left;">Leave Available</th>
                <th style="text-align: left;">Leave Form date</th>
                <th style="text-align: left;">Leave To date</th>
                <th style="text-align: left;">{{'common.status' | translate}}</th>
            </tr>

            <tr *ngFor="let user of results; let i = index">
                <td style="text-align: left;">{{ i + 1 }}.</td>
                <td style="text-align: left;">{{user.leave_type}}</td>
                <td style="text-align: left;">{{user.leave_available}}</td>
                <td style="text-align: left;">{{user.leave_from}}</td>
                <td style="text-align: left;">{{user.leave_to}}</td>
                <td style="text-align: left;">{{user.status}}</td>
            </tr>
        </table>
    </div>
  </div>
</div>
