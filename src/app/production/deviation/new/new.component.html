<div class="container">
    <div class="card">
         <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Deviation Form</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/production/deviation" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
       </div>
      <div class="card-block">
        <div class="card-text">
            <form #FormData="ngForm">
                <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Deviation Related To:</strong></label>
                    <select name="related_to" ngModel required>
                    <option value="Process">Process</option>
                    <option value="Procedure">Procedure</option>
                    <option value="Document">Document</option>
                    </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Deviation Category:</strong></label>
                    <select name="category" ngModel required>
                    <option value="Planned Deviation">Planned Deviation</option>
                    <option value="Unplanned Deviation">Unplanned Deviation</option>
                    </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Type Of Deviation:</strong></label>
                    <select name="type" ngModel required>
                    <option value="Minor">Minor</option>
                    <option value="Major">Major</option>
                    <option value="Critical">Critical</option>
                    </select>
                </div>
                <!-- <div class="clr-col-md-3 clr-col-12">
                    <label><strong>Date Of Deviation</strong></label>
                    <input ngModel name="deviation_date" type="date">
                </div> -->
                <div class="clr-col-12">
                    <label><strong>Justification for type:</strong></label>
                    <textarea ngModel name="justification"></textarea>
                </div>
                <div class="clr-col-12">
                    <label><strong>Cause of Deviation:</strong></label>
                    <textarea ngModel name="cause"></textarea>
                </div>
                <div class="clr-col-12">
                    <label><strong>Description of Deviation:</strong></label>
                    <textarea ngModel name="description"></textarea>
                </div>
                <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Affecting Product / Material:</strong></label>
                    <select [(ngModel)]="affecting_product" name="affecting_product">
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                    </select>
                </div>
                <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <label><strong>Affecting Equipment</strong></label>
                    <select [(ngModel)]="affecting_equipment" name="affecting_equipment">
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                    </select>
                </div>
                </div>
                <div class="clr-row" *ngIf="affecting_product == 'yes'">
                <div class="clr-col-md-4 clr-col-12">
                    <label><strong>Name of Product:</strong></label>
                    <input ngModel type="text" name="product_code" required>
                </div>
                <div class="clr-col-md-2 clr-col-12">
                    <label><strong>Medicap Lot No:</strong></label>
                    <input ngModel type="text" name="batch_no" required>
                </div>
                <div class="clr-col-md-3 clr-col-12">
                    <label><strong>Mfg. Date:</strong></label>
                    <input ngModel type="month" name="mfg_date" required>
                </div>
                <div class="clr-col-md-3 clr-col-12">
                    <label><strong>Exp. Date:</strong></label>
                    <input ngModel type="month" name="exp_date" required>
                </div>
                </div>
                <div class="clr-row" *ngIf="affecting_equipment == 'yes'">
                <div class="clr-col-md-4 clr-col-12">
                    <label><strong>Name of Equipment:</strong></label>
                    <input ngModel type="text" name="equipment_name" required>
                </div>
                </div>
            </form>
            <div class="clr-row">
                <div class="clr-col-md-12 clr-col-12">
                    <label>Departments for Review:</label>
                    <div class="clr-control-container clr-control-inline">
                        <div class="clr-checkbox-wrapper" *ngFor="let order of departments; let i = index">
                            <input class="clr-checkbox" id="{{order.name}}" type="checkbox" name="{{order.name}}" [(ngModel)]="order.value" (change)="updateDept($event.target.checked, i)">
                            <label for="{{order.name}}" class="clr-control-label">{{order.name}}</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
      </div>
      <div class="card-footer" style="text-align: right;">
        <button class="btn btn-primary" [disabled]="FormData.invalid" (click)="saveDeviation(FormData)">{{'common.submit' | translate}}</button>
        <button class="btn btn-warning" routerLink="/production/deviation">{{'common.close' | translate}}</button>
      </div>
    </div>
</div>
