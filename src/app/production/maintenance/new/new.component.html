<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
                <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Maintenance Note</div>
                <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/production/maintenance" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
                </div>
            </div>
      </div>
      <div class="card-block">
        <div class="card-text">
          <form #maintainanceForm="ngForm">
            <div class="clr-row">
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Area:</label>
                <select name="section" ngModel required>
                  <option></option>
                  <option *ngFor="let section of sections" [value]="section.section_code">{{ section.section_name }}</option>
                </select>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Maintenance Type:</label>
                <select name="maintenance_type" ngModel required>
                  <option>Type 1</option>
                  <option>Type 2</option>
                </select>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Urgency Level:</label>
                <select name="urgency_level" ngModel="Urgent" required>
                  <option>Urgent</option>
                  <option>Normal</option>
                </select>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Equipement Name:</label>
                <select name="equipment_name" ngModel (change)="getEquipmentsDetails($event.target.selectedIndex)" required>
                  <option></option>
                  <option *ngFor="let equipment of equipments">{{ equipment.equipment_name }}</option>
                </select>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Equipement ID:</label>
                <select name="equipment_code" ngModel required>
                  <option></option>
                  <option *ngFor="let result of selectedEquipment['equipments']">{{ result.equipment_code }}</option>
                </select>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Problem:</label>
                <select name="problem" ngModel required>
                  <option>Electrical</option>
                  <option>Mechanical</option>
                  <option>Other</option>
                </select>
              </div>
              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label>Description of Problem:</label>
                <textarea name="description" rows="2" ngModel required></textarea>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Breakdown Time:</label>
                <input type="time" name="breakdown_time" ngModel required>
              </div>
            </div>
          </form>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="saveMaintenanceNote(maintainanceForm)">{{'common.submit' | translate}}</button>
      </div>
    </div>
  </div>
