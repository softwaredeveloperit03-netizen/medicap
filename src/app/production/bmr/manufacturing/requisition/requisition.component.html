<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Addition Material Requisition</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-danger" routerLink="/production/bmr/manufacturing">{{'common.close' | translate}}</button>
          </div>
        </div>  
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #reqForm="ngForm">
            <div class="clr-row">
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Material Type:<span style="color: red">*</span></label>
                    <select name="material_type" [(ngModel)]="material_type" required>
                        <option>Raw Material</option>
                        <option>Packing Material</option>
                    </select>
                </div>
                <!-- <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Material Subtype:<span style="color: red">*</span></label>
                    <select name="material_subtype" ngModel required>
                        <option *ngIf="let data of ">API</option>
                    </select>
                </div> -->
                <div *ngIf="material_type=='Raw Material'" class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <label>Material SubType:<span style="color: red">*</span></label>
                  <select name="material_subtype" ngModel required (change)="getMaterials($event.target.value)">
                    <option></option>
                    <option *ngFor="let type of types">{{type.material_subtype}}</option>
                  </select> 
              </div>
                <div *ngIf="material_type=='Packing Material'" class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <label>Material SubType:<span style="color: red">*</span></label>
                  <select name="material_subtype" ngModel required (change)="getMaterials($event.target.value)">
                    <option></option>
                    <option >Primary</option>
                    <option >Secondary</option>
                    <option >Tertiary</option>
                  </select>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <label>Material Name:<span style="color: red">*</span></label>
                  <select name="material_code" ngModel required>
                      <option></option>
                      <option *ngFor="let material of materials" [value]="material.material_code">{{
                          material['material_name'] }} - {{ material.grade }}</option>
                  </select>
              </div>
                <!-- <div *ngIf="material_type=='Packing Material'" class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <label>Material SubType:<span style="color: red">*</span></label>
                  <select name="material_subtype" ngModel required (change)="getMaterials($event.target.value)">
                    <option></option>
                    <option *ngFor="let type of types">{{type.material_subtype}}</option>
                  </select>
              </div>
              <div *ngIf="material_type=='Packing Material'" class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <label>Material Name:<span style="color: red">*</span></label>
                  <select name="material_code" ngModel required>
                      <option></option>
                      <option *ngFor="let material of materials" [value]="material.material_code">{{
                          material['material_name'] }} - {{ material.grade }}</option>
                  </select>
              </div> -->
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Grade:</label>
                    <input type="text" name="grade" readonly>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <label>Available Qty:</label>
                  <input type="number"  name="available_qty" ngModel readonly> 
                 </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                  <label>Required Qty:<span style="color: red">*</span></label>
                  <input type="number" name="required_qty" ngModel required > 
                 </div>
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                  <label>Reason for Addition:<span style="color: red">*</span></label>
                  <textarea name="reason" ngModel required colspan="12"></textarea> 
                 </div>
            
            </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button type="button" class="btn btn-primary" (click)="save(reqForm)" [disabled]="reqForm.invalid">{{'common.submit' | translate}}</button>
    </div>
</div>
