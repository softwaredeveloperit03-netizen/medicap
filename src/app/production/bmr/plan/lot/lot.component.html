<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-lg-4" style="color: aliceblue;margin-top: -2px;text-align: left;">Convert lots to Batch</div>
          <div class="clr-col-lg-8" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-danger" routerLink="/production/bmr/plan">{{'common.close' | translate}}</button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #batchForm="ngForm">
                <div class="clr-row">       
                  <div class="clr-col-lg-4 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                      <label>Unit:</label>
                      <select name="company_unit" [(ngModel)]="company_unit">
                          <option></option>
                          <option *ngFor="let unit of units" [value]="unit.unit">{{unit.unit}}</option>
                      </select>
                   </div>
                   
                    <div class="clr-col-lg-4 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Product Type:</label>
                        <select name="product_type" ngModel (change)="getProducts($event.target.value)">
                            <option></option>
                            <option>API</option>
                            <option>Excipient</option>
                            <option>Liquid</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-4 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Product Name:</label>
                        <select name="product_code" [(ngModel)]="product_code" (change)="getPendingLotsforConvert()" required>
                            <option></option>
                            <option *ngFor="let product of products;let i = index" [value]="product.product_code">{{ product.product_name }}</option>
                        </select>
                    </div>
                </div>
            </form>

                    <tr>

                        <th>Complete Date</th>
                    </tr>
                    <tr >
                        <td>                             
                            <input type="checkbox" name="check" (change)="onChange($event.target.checked, i)">
                        </td>
                        <td> {{ res.lmr_no }}</td>
                        <td> {{ res.batch_size }}</td>
                        <td> {{ res.batch_qty }}</td>
                        <td> {{ res.unit }}</td>
                        <td> {{ res.start_date }}</td>
                        <td> {{ res.complete_date }}</td>
                    </tr>
                </table> -->
            </div>       
        </div>
    </div>
</div>
