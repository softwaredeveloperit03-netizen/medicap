<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Technical Info</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/production/technical" style="background-color: red;color: white;">
          close  </button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #technical="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-12 clr-col-md-12">
                        <label>{{'common.unit' | translate}}</label>
                        <select name="company_unit" ngModel>
                            <option></option>
                            <option *ngFor="let product of company;" [value]=product.unit >{{ product.unit}}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-12">
                        <label> Product Name</label>
                        <select name="product_code" ngModel required>
                            <option></option>
                            <option *ngFor="let product of products;" [value]=product.product_code >{{ product.product_name}}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6">
                        <label> Medicap Lot No</label>
                       <input type="text" name="batch_no" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6">
                        <label> Stage</label>
                       <input type="text" name="stage" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6">
                        <label>Step</label>
                       <input type="text" name="step" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6">
                        <label> Equipment Type</label>
                        <select name="equipment_type" ngModel  (change)="getEquipment($event.target.selectedIndex)" required>
                            <option></option>
                            <option *ngFor="let eq of equipments;" value="eq.equipment_type">{{ eq.equipment_type}}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6">
                        <label> Equipment Name</label>
                        <select name="equipment_name" (change)="getEquipmentId($event.target.selectedIndex)" ngModel required>
                            <option></option>
                            <option *ngFor="let product of equipment_names;">{{product.equipment_name}}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6">
                        <label> Equipment Code</label>
                        <select name="equipment_code" ngModel  required>
                            <option></option>
                            <option *ngFor="let product of equipment_ids;">{{ product.equipment_code }}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6">
                        <label> Samlple Qty</label>
                       <input type="text" name="sample_qty" ngModel required>
                    </div>
                    <div class="clr-col-lg-6 clr-col-md-6">
                        <label>{{'common.unit' | translate}}</label>
                        <select name="unit" ngModel required>
                            <option></option>
                            <option *ngFor="let unit of units;" >{{ unit.unit}}</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="saveData(technical)">Send Sample</button>
    </div>
</div>
