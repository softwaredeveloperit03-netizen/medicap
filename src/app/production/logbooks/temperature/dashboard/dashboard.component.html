<div class="container-fluid">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Temperature/Humidity Log</div>
              <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="new" style="background-color: green;color: white;">{{'common.new' | translate}}</button>

                <button class="btn btn-sm" routerLink="/production/logbooks" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
              </div>
            </div>
        </div>
        <div class="card-block">
            <div class="card-text">
                <div class="clr-row">
                    <div class="clr-col-lg-4">
                        <label>From Date:</label>
                        <input type="date" name="from_date" [(ngModel)]="from_date" required>
                    </div>
                    <div class="clr-col-lg-4">
                        <label>To Date:</label>
                        <input type="date" name="to_date" [(ngModel)]="to_date" required>
                    </div>
                    <div class="clr-col-lg-2" style="padding: 0px;">
                        <button class="btn btn-danger" (click)="getTemperatureLog()" style="margin-top: 30px;">{{'common.search' | translate}}</button>
                    </div>
                </div>
                <table class="table">
                    <tr>
                        <th>Sr.</th>
                        <th style="text-align:left">Section.</th>
                        <th>Temperature</th>
                        <th>Humidity</th>
                        <th>{{'common.date' | translate}}</th>
                        <th>Time</th>
                    </tr>
                    <tr *ngFor="let result of results;let i = index">
                        <td>{{ i+1 }}.</td>
                        <td style="text-align:left">{{ result.section }}</td>
                        <td>{{ result.temperature  | number:'1.0-0' }}° C</td>
                        <td>{{ result.humidity  | number:'1.0-0' }}%</td>
                        <td>{{ result.entry_date }}</td>
                        <td>{{ result.entry_time }}</td>
                    </tr>
                    <tr *ngIf="results?.length == 0">
                        <td colspan="7">No Record Found!</td>
                    </tr>
                </table>
            </div>
        </div>
        <div class="card-footer">
           <button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button>
        </div>
    </div>
</div>
