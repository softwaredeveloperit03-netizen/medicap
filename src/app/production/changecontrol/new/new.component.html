<div class="container-fluid">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Change Control Form</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/production/changecontrol" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #changecontrol="ngForm">
          <div class="clr-row">
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Change Related to:</strong></label>
              <select name="change_related" ngModel="Master Formula Card/Record" required>
                <option>Master Formula Card/Record</option>
                <option>Batch Numbering System</option>
                <option>SOPs</option>
                <option>Cleaning Validation</option>
                <option>Batch Manufacturing Record</option>
                <option>Raw Material Active</option>
                <option>Format</option>
                <option>Process Validation</option>
                <option>Master Packing Card/Record</option>
                <option>Raw Material Excipients</option>
                <option>Equipment</option>
                <option>Analytical Method Validation</option>
                <option>Batch Packing Card/Record</option>
                <option>Vendor</option>
                <option>Process</option>
                <option>Master Validation Plan</option>
                <option>Packing Primary</option>
                <option>Specification</option>
                <option>Utilities</option>
                <option>Site Master File</option>
                <option>Packing Secondary</option>
                <option>Standard Analytical Specification</option>
                <option>Equipment Qualification</option>
                <option>Computer System</option>
                <option>Artwork</option>
                <option>Stability</option>
                <option>Utilities Qualification</option>
                <option>Regulatory Filling</option>
                <option>Shelf life</option>
                <option>Area Qualification</option>
                <option>Others</option>
              </select>
            </div>
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Change Title:</strong></label>
              <input type="text" name="change_title" ngModel required>
            </div>
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Existing Procedure:</strong></label>
              <textarea rows="2" name="existing_procedure" ngModel required></textarea>
            </div>
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Proposed Change:</strong></label>
              <textarea rows="2" name="proposed_change" ngModel required></textarea>
            </div>
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Reason For Changes:</strong></label>
              <textarea rows="2" name="reason_for_changes" ngModel required></textarea>
            </div>
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Market Details:</strong></label>
              <div class="clr-row">
                <div class="clr-col-lg-3 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                  <div class="clr-form-control" style="margin-top: 0px;">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox="" ngModel name="export" type="checkbox" value="Export" id="market_details1" />
                        <label class="clr-control-label" for="market_details1">Export</label>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="clr-col-lg-3 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                  <div class="clr-form-control" style="margin-top: 0px;">
                    <div class="clr-control-container">
                      <div class="clr-checkbox-wrapper">
                        <input clrcheckbox="" ngModel name="domastic" type="checkbox" value="Domastic" id="market_details2" />
                        <label class="clr-control-label" for="market_details2">Domastic</label>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Probable Impact on Quality of Product:</strong></label>
              <select name="impact_quality" ngModel="No" (change)="checkImpactQuality($event.target.value)" required>
                <option>Yes</option>
                <option>No</option>
              </select>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12" *ngIf="isImpactQuality">
              <label>Product Name:</label>
              <input type="text" name="product_name" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12" *ngIf="isImpactQuality">
              <label>Medicap Lot No:</label>
              <input type="text" name="batch_no" ngModel required>
            </div>
          </div>
        </form>
        <div class="clr-row">
          <div class="clr-col-md-12 clr-col-12">
              <label>Departments for Review:</label>
              <div class="clr-control-container clr-control-inline">
                  <div class="clr-checkbox-wrapper" *ngFor="let order of departments; let i = index">
                      <input class="clr-checkbox" id="{{order.department_name}}" type="checkbox" name="{{order.department_name}}" [(ngModel)]="order.value" (change)="updateDept($event.target.checked, i)">
                      <label for="{{order.department_name}}" class="clr-control-label">{{order.department_name}}</label>
                  </div>
              </div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="saveForm(changecontrol)">{{'common.submit' | translate}}</button>
      <button class="btn btn-danger" routerLink="../dashboard">{{'common.close' | translate}}</button>
    </div>
  </div>
</div>
