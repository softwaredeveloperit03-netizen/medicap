<div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Additional Material Requistion Slip</div>
              <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/production/additional" style="background-color: red;color: white;">
                    <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
                </button>
              
              </div>
            </div>
          </div>
    <div class="card-block">
        <div class="card-text">
            <form class="clr-row" #Form="ngForm">
                <div class="clr-col-lg-6 clr-col-sm-6 clr-col-sm-12">
                    <label>Material Type:</label>
                    <select name="material_type" [(ngModel)]="material_type" (change)="initCategory()" required>
                        <option>API</option>
                        <option>Raw Material</option>
                        <option>Packing Material</option>
                        <option>General Material</option>
                        <option>Services</option>
                    </select>
                </div>
                <div class="clr-col-lg-6 clr-col-sm-6 clr-col-sm-12">
                    <label>Material Name:</label>
                    <input type="text" name="material_name" ngModel required>
                    <!-- <select name="material_name" ngModel required>
                        <option></option>
                    </select> -->
                </div>
               
                <div class="clr-col-lg-6 clr-col-sm-6 clr-col-sm-12">
                    <label>Material Code:</label>
                    <input type="text" name="material_code" ngModel required>
                </div>
                <div class="clr-col-lg-3 clr-col-sm-3 clr-col-sm-12">
                    <label>Required Qty:</label>
                    <input type="text" name="qty" ngModel required>
                </div>
                <div class="clr-col-lg-3 clr-col-sm-3 clr-col-sm-12">
                    <label>Purpose:</label>
                    <select name="purpose" ngModel required>
                        <option>Online Rejection</option>
                        <option>Process Rejection</option>
                        <option>Process Loss</option>
                        <option>Additional Material</option>
                    </select>
                </div>
                <div class="clr-col-lg-3 clr-col-sm-3 clr-col-sm-12">
                    <label>Justification:</label>
                    <input type="text" name="justification" ngModel required>
                </div>
                <div class="clr-col-lg-3 clr-col-sm-3 clr-col-sm-12">
                    <label>For Product:</label>
                    <select name="product" [(ngModel)]="product" required
                    >
                        <option>Applicable</option>
                        <option>Not Applicable</option>
                    </select>
                </div>
                <div class="clr-col-lg-3 clr-col-sm-3 clr-col-sm-12" *ngIf="product=='Applicable'">
                    <label>Product Name :</label>
                    <select name="product_name" ngModel required>
                        <option></option>
                        <option *ngFor="let prod of products;">{{prod.product_name}},{{prod.batch_number}}</option>
                       
                    </select>
                </div>
            </form>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="saveform(Form)">{{'common.save' | translate}}</button>
    </div>
</div>
