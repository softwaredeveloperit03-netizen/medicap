<div class="container-fluid">
    <div class="card" *ngIf="isNew">
        <div class="card-header">New Online Rejection</div>
        <div class="card-block">
            <div class="card-text">
                <form #dataForm="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Material Type:</label>
                            <select name="material_type" ngModel required>
                                <option>Packing Material</option>
                                <option>Inprocess Powder</option>
                                <option>Tables</option>
                                <option>Capsule</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Name of Product:</label>
                            <input name="product_name" type="text" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Grade:</label>
                            <input name="grade" type="text" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Medicap Lot No:</label>
                            <input name="batch_no" type="text" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Batch Size:</label>
                            <input name="batch_size" type="text" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Lot No:</label>
                            <input name="lot_no" type="text" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Stage Of Manufacturing</label>
                            <input name="manufacturing_store" type="text" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Equipment Name</label>
                            <input name="equipment_name" type="text" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Equipment Id</label>
                            <input name="enqipment_id" type="text" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Quantity of Rejection</label>
                            <input name="rejected_quantity" type="text" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Rejection Type</label>
                            <select name="rejection_type" ngModel>
                                <option>Process Rejection</option>
                                <option>Analytical Failure</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Description of Rejection</label>
                            <textarea name="description" type="text" ngModel required></textarea>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="card-footer" style="text-align: right;">
            <button class="btn btn-primary" (click)="saverejection(dataForm)">{{'common.submit' | translate}}</button>
            <button class="btn btn-danger" (click)="closeform()">{{'common.close' | translate}}</button>
        </div>
    </div>
    <div class="card" *ngIf="!isNew">
       <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Online Rejection</div>
              <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm btn-danger" routerLink="/production/rejection">{{'common.close' | translate}}</button>
              </div>
            </div>
          </div>
        <div class="card-block">
        <div class="card-text" style="overflow-x:auto;">
            <button class="btn btn-sm btn-info" (click)="isNew = true">NEW REJECTION</button>
            <table class="table">
                <thead>
                    <tr>
                    <th>Rejected Date</th>
                    <th>Material Type</th>
                    <th>product Name</th>
                    <th>Rejected Quantity</th>
                    <th>Department Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let list of rejectionlist">
                    <td>{{ list.entry_date | date }}</td>
                    <td>{{ list.material_type }}</td>
                    <td>{{ list.product_name }}</td>
                    <td>{{ list.rejected_quantity }}</td>
                    <td>{{ list.dep_status }}</td>
                    </tr>
                    <tr *ngIf="rejectionlist?.length == 0">
                    <td colspan="8">{{'common.noRecords' | translate}}</td>
                    </tr>
                </tbody>
            </table>
        </div>
        </div>
    </div>
</div>
