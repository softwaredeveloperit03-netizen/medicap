<div class="container-fluid" *ngIf="!isView">
    <div class="card">
        <div class="card-header">SOP Revision Request</div>
        <div class="card-block">
            <div class="card-text">
                <table class="table">
                    <tr>
                        <th>Sr.</th>
                        <th>SOP No.</th>
                        <th>Title</th>
                        <th>SOP For</th>
                        <th>Effective Date</th>
                        <th>{{'common.table.action' | translate}}</th>
                    </tr>
                    <tr *ngFor="let result of results; let i = index">
                        <td>{{ i + 1 }}.</td>
                        <td>{{ result.sop_no }}</td>
                        <td>{{ result.title }}</td>
                        <td>{{ result.sop_for }}</td>
                        <td>{{ result.effective_date }}</td>
                        <td>
                            <button class="btn btn-sm btn-info" (click)="view(i)">REVISE</button>
                        </td>
                    </tr>
                    <tr *ngIf="results?.length == 0">
                        <td colspan="6">{{'common.noRecords' | translate}}</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="container-fluid" *ngIf="isView">
    <div class="card">
        <div class="card-header">SOP Revision Request</div>
        <div class="card-block">
            <div class="card-text">
                <pdf-viewer [src]="url" [render-text]="true" style="display: block;"></pdf-viewer>

                <form #revisionForm="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-lg-12">
                            <label>Justification of Revision:</label>
                            <textarea rows="2" name="description" ngModel required></textarea>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="revise(revisionForm)">REVISE</button>
            <button class="btn btn-danger" (click)="isView = false">{{'common.close' | translate}}</button>
        </div>
    </div>
</div>
