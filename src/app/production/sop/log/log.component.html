<div class="container-fluid" *ngIf="!isView">
    <div class="card">
        <div class="card-header" style="text-align: center">
          <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">SOP Log</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
              <button class="btn btn-sm" routerLink="/production/sop" style="background-color: red;color: white;">
                CLOSE
              </button>
            </div>
          </div>
        </div>
        <div class="card-block">
            <div class="card-text">
                <table class="table">
                    <tr>
                        <th>Sr.</th>
                        <th>SOP No.</th>
                        <th>SOP Title</th>
                        <th>SOP For</th>
                        <th>{{'common.status' | translate}}</th>
                        <th>Prepared By</th>
                        <th>{{'common.table.action' | translate}}</th>
                    </tr>
                    <tr *ngFor="let result of results; let i = index">
                        <td>{{ i + 1 }}.</td>
                        <td>{{ result.sop_no }}</td>
                        <td>{{ result.title }}</td>
                        <td>{{ result.sop_for }}</td>
                        <td>{{ result.status }}</td>
                        <td>{{ result.entry_by }}</td>
                        <td>
                            <button class="btn btn-sm btn-info" (click)="view(i)">PROCEED</button>
                        </td>
                    </tr>
                    <tr *ngIf="results?.length == 0">
                        <td colspan="7">No. Records Found!</td>
                    </tr>
                </table>
            </div>
        </div>
        <div class="card-footer" style="text-align: right;">
          <button class="btn btn-primary" (click)="download('log')">{{'common.download' | translate}}</button>
        </div>
    </div>
  </div>
  
  <div class="container-fluid" *ngIf="isView">
    <div class="card">
        <div class="card-header">SOPs Log</div>
        <div class="card-block">
            <div class="card-text">
              <pdf-viewer [src]="url" [render-text]="true" style="display: block;"></pdf-viewer>
            </div>
        </div>
        <div class="card-footer">
          <button class="btn btn-primary" (click)="download('manual')">DOWNLOAD MANUAL SIGN PDF</button>
          <button class="btn btn-success" (click)="download('digital')">DOWNLOAD DIGITAL SIGN PDF</button>
          <button class="btn btn-danger" (click)="isView = false">{{'common.close' | translate}}</button>
        </div>
    </div>
</div>
