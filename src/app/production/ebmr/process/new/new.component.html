<div class="card">
    <div class="card-header">NEW PROCESS STEP FORM</div>
    <div class="card-block">
        <div class="card-text">
            <div class="clr-row">
                <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <label>Dosage Form: <span style="color: red">*</span></label>
                    <select name="dosage_form" [(ngModel)]="dosage_form" required>
                        <option></option>
                        <option *ngFor="let dosage of dosages">{{ dosage.dosage_form }}</option>
                    </select>
                </div>
                <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12" *ngIf="dosage_form !== 'TABLET'">
                    <label>Process Type: <span style="color: red">*</span></label>
                    <input type="text" name="process_type" [(ngModel)]="process_type" required>
                </div>
                <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12" *ngIf="dosage_form == 'TABLET'">
                    <label>Process Type: <span style="color: red">*</span></label>
                    <select name="process_type" [(ngModel)]="process_type" required>
                        <option>WET GRANULATION</option>
                        <option>DRY GRANULATION</option>
                    </select>
                </div>
            </div>

            <h3>New Process:</h3>
            <form #processForm="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Stage: <span style="color: red">*</span></label>
                        <input type="text" name="stage" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Step:</label>
                        <input type="text" name="step" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <button class="btn btn-primary" (click)="add(processForm)" style="margin-top:30px;">{{'common.add' | translate}}</button>
                    </div>
                </div>
            </form>

            <table class="table">
                <tr>
                    <th>Stage</th>
                    <th>Step</th>
                    <!-- <th>General Instructions</th>
                    <th>Line Clearance</th>
                    <th>Procedures</th>
                    <th>Equipments</th>
                    <th>Weighing of Material</th>
                    <th>Inprocess Checks</th>
                    <th>Environmental Checks</th>
                    <th>Inprocess Testing</th>
                    <th>Reconciliation</th> -->
                </tr>
                <tr *ngFor="let result of processes">
                    <td>{{ result.stage }}</td>
                    <td>{{ result.step }}</td>
                    <!-- <td>{{ result.instruction }}</td>
                    <td>{{ result.line_clearance }}</td>
                    <td>{{ result.procedure }}</td>
                    <td>{{ result.equipment }}</td>
                    <td>{{ result.weighing }}</td>
                    <td>{{ result.ischeck }}</td>
                    <td>{{ result.isenvironment }}</td>
                    <td>{{ result.istesting }}</td>
                    <td>{{ result.reconciliation }}</td> -->
                </tr>
            </table>

        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="saveProcess()">{{'common.save' | translate}}</button>
