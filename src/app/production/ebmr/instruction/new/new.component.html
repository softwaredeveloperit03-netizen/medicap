<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Manufacturing Instructions</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/production/ebmr/instruction" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
          <form #productForm="ngForm">
            <div class="clr-row">
              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label>Product Name:<span style="color: red;"><b>*</b></span></label>
                <select name="product_code" ngModel required>
                  <option></option>
                  <option *ngFor="let product of products" value="{{ product.product_code }}">{{ product.product_name }}</option>
                </select>
              </div>
            </div>
          </form>

            <h3>Instructions:</h3>
            <form #instructionForm="ngForm">
              <table class="table">
                <tr>
                  <th>Sr.</th>
                  <th>Instructions</th>
                  <th>{{'common.table.action' | translate}}</th>
                </tr>
                <tr>
                  <td>1.</td>
                  <td style="padding: 0px;">
                    <input type="text" name="instruction" ngModel required style="margin: 0px;">
                  </td>
                  <td style="padding: 0px;">
                    <button class="btn btn-sm btn-info" (click)="add(instructionForm)" style="margin: 0px;">{{'common.add' | translate}}</button>
                  </td>
                </tr>
                <tr *ngFor="let user of instructionList;let i = index">
                  <td>{{ i+1 }}.</td>
                  <td style="text-align: left;">{{ user.instruction }}</td>
                  <td>  <td><clr-icon shape="trash" class="is-error" (click)="delData(i)"></clr-icon>
                  </td>
                </tr>
                <tr *ngIf="instructionList?.length == 0">
                  <td colspan="3">NO Record Found!</td>
                </tr>
              </table>
            </form>
      </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="save(productForm)">{{'common.save' | translate}}</button>
      </div>
</div>
