<div class="container-fluid" >
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Master Documents</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
              <button class="btn btn-sm btn-danger"  routerLink="/regulatory-new/masterDoc">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
      <div class="card-block">
        <div class="card-text">

            <form #documentForm="ngForm">
                <div class="clr-row" >
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Product Name:<span style="color:red;">*</span></label>
                        <select name="product_code" ngModel required >
                            <option></option>
                            <option *ngFor="let product of products; " [value]="product.product_code">{{product.product_name }}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3">
                        <label>Type : <span style="font-weight: bold;color: red;">*</span></label>
                        <select  name="doc_type" ngModel required>
                            <option value="Protocol">Protocol</option>
                            <option value="Report">Report</option>
                            <option value="Stability">Stability</option>
                            <option value="COA">COA</option>
                            <option value="BMR">BMR</option>
                            <option value="Formula">Formula</option>
                            <option value="AMV">AMV</option>
                            <option value="PV Protocol">PV Protocol</option>
                            <option value="PV Report">PV Report</option>
                            <option value="Specification">Specification</option>
                            <option value="MOA">MOA</option>
                            <option value="Other">Other</option>
                          </select>
                    </div>
                    <div class="clr-col-lg-3">
                        <label>Document Name : <span style="font-weight: bold;color: red;">*</span></label>
                        <input type="text" name="doc_name" ngModel required>
                    </div>
                    <div class="clr-col-lg-3">
                        <label>Document No. : <span style="font-weight: bold;color: red;">*</span></label>
                        <input type="text" name="doc_no" ngModel required>
                    </div>
                    <div class="clr-col-lg-3">
                        <label>Version No. : <span style="font-weight: bold;color: red;">*</span></label>
                        <input type="text" name="ver_no" ngModel required>
                    </div>
                    <div class="clr-col-lg-3">
                        <label>Valid Till : <span style="font-weight: bold;color: red;">*</span></label>
                        <input type="date" name="valid_till" ngModel required>
                    </div>
                    <div class="clr-col-lg-3">
                        <label>Requirement : <span style="font-weight: bold;color: red;">*</span></label>
                        <select  name="requirement" [(ngModel)]="requirement" required>
                            <option >Upload</option>
                            <option >Request To QA</option>
                        </select>
                    </div>
                    <div  *ngIf="requirement == 'Upload'" class="clr-col-lg-3">
                        <label>Upload Document : <span style="font-weight: bold;color: red;">*</span></label>
                        <input type="file" name="document" ngModel (change)="onFileChanged($event)">
                    </div>
                    <div class="clr-col-lg-3">
                       <br>
                        <button class="btn btn-success" (click)="saveDocuments(documentForm)">{{'common.save' | translate}}</button>
                    </div>
                </div>

            </form>
 

        </div>
      </div>
    </div>
  </div>
