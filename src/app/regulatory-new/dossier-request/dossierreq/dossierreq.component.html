<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Dossier Requisition Form </div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="../dossierNew" style="background-color: red;color: white;">CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #dossier="ngForm">
  
          <div class="clr-row">



            
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Product Type : &nbsp;&nbsp;<span style="color: red">*</span></label>
              <select name="pType" [(ngModel)]="pType" required   >
                   <option>Existing Product</option>
                  <option>New Product</option>
               </select>
          </div>

          <div *ngIf="pType == 'Existing Product'" class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Product Name<sup style="color: red">*</sup>:</strong></label>
              <select name="generic_name" ngModel required (change)="selectProduct($event.target.selectedIndex)">
                  <option></option>
                  <option *ngFor="let res of products" value="{{res.product_name}}">{{res.product_name}} ( {{res.plant_name}} )</option>
              </select>
          </div>
 
            <div  *ngIf="pType == 'New Product'"  class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Brand Name</strong></label>
              <input type="text" name="brand_name" ngModel  required />
            </div>
  
            <div  *ngIf="pType == 'New Product'"  class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Generic Name</strong></label>
              <input type="text" name="generic_name" ngModel  required />
            </div>
  
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
           
          <form [formGroup]="DossierForm">
            <table class="table table-border"  *ngIf="pType == 'New Product'">
  
              <tr>
                <th style="text-align:left; background-color: rgb(14,67,112); color: white;">Name of API</th>
                <th style="text-align:left; background-color: rgb(14,67,112); color: white;">Strength</th>
                <th style="text-align:left; background-color: rgb(14,67,112); color: white;">Grade of API</th>
                <th style="background-color: rgb(14,67,112); color: white;">ADD</th>
              </tr>
              <tr>
  
                <td style="padding: 0px;">
                  <input type="text" style="margin: 0px; height: 33px;" formControlName="api_name">
                </td>
  
                <td style="padding: 0px;">
                  <input type="text" style="margin: 0px; height: 33px;" formControlName="strength">
                </td>
  
                <td style="padding: 0px;">
                  <input type="text" style="margin: 0px; height: 33px;" formControlName="api_grade">
                </td>
  
                <td style="padding: 0px;vertical-align: middle;">
                  <button class="btn btn-sm btn-info" (click)="addDossiers()">{{'common.add' | translate}}</button>
                </td>
              </tr>
  
              <tr *ngFor="let item of Dossiers; let i = index">
                <td style="text-align:left;">{{ item.api_name }}</td>
                <td style="text-align:left;">{{ item.strength }}</td>
                <td style="text-align:left;">{{ item.api_grade }}</td>
                <td>
                  <clr-icon shape="trash" class="is-error" (click)="deleteDossiers(i)"></clr-icon>
                </td>
              </tr>
  
            </table>
          </form>
              
          </div>
          <!-- <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12" *ngIf="pType == 'Existing Product'" >
            
              <table class="table ">
                  <tr *ngFor="let label of selectedProduct['label_claim']; let i = index;">
                      <td style="text-align: left;">
                        
                        <span>Each {{ label.dose_unit_type}} Contains</span> <br>
                        
                        {{ label.material_name}}  {{label.grade}} <br>

                          <span *ngIf="label.equivalent_to!==''">equivalent to <br>
                              {{ label.equivalent_to }} {{ label.strength }} {{ label.unit
                              }} -------- ({{label.apperance}})
                          </span>

                      </td>
                  </tr>
                
              </table>
        
              
          </div> -->
  
          <div  class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12" >
            <label><strong>Label Claim</strong></label>
            <input type="text" name="label_claim"  [(ngModel)]="label_claim"  required />
          </div>
  
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label><strong>Shelf Life of finished product</strong></label>
            <input type="text" name="finished_product_life"  [(ngModel)]="selectedProduct['shelf_life']"  required />
          </div>
  
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label><strong>Packing Style</strong></label>
            <input type="text" name="packing_style" ngModel  required />
          </div>
  
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label><strong> Country</strong></label>
            <input type="text" name="country" ngModel  required />
          </div>
  
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label><strong>  Upload Format  :</strong>  </label>
            <input type="file" (change)="onFileChange($event)" name="file" ngModel accept="application/pdf" required>
          </div>
  
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label><strong> Manufactured By</strong></label>
            <input type="text" name="mfg_by" ngModel  required />
          </div>
  
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label><strong>Marketed By</strong></label>
            <input type="text" name="marketed_by" ngModel  required />
          </div>
  
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label><strong>Manufacturer Address</strong></label>
            <input type="text" name="mfg_address" ngModel  required />
          </div>
  
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label><strong> Marketing Authorization Address</strong></label>
            <input type="text" name="marketing_address" ngModel  required />
          </div>
  
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label><strong> Dossier Applicant Name</strong></label>
            <input type="text" name="applicant_name" ngModel  required />
          </div>
  
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label><strong>Ref. Market Product</strong></label>
            <input type="text" name="market_product" ngModel  required />
          </div>
  
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label><strong>Dossier in Language</strong></label>
            <input type="text" name="dossier_lang" ngModel  required />
          </div>
  
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label><strong>Registered Product (If Any)</strong></label>
            <input type="text" name="registered_product" ngModel  required />
          </div>
  
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label><strong>Client Name</strong></label>
            <input type="text" name="client_name" ngModel  required />
          </div>
  
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label><strong>Document Checklist</strong></label>
            <input type="text" name="document_checklist" ngModel  required />
          </div>
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label><strong>Expected Date for Dossier</strong></label>
            <input type="date" name="expected_date" ngModel  required />
          </div>
        </div>
          <div class="clr-row">
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label> <strong>Special Remark(If Any):</strong></label>
                <textarea name="special_remark" [(ngModel)]="special_remark" required rows="2"></textarea>
            </div>
        </div>
        </form>
      </div>
    </div>
  
    <div class="card-footer">
        <button class="btn btn-primary" (click)="saveForm(dossier)">{{'common.submit' | translate}}</button>
        <!-- <button class="btn btn-danger" (click)="isNew = false">{{'common.close' | translate}}</button> -->
    </div>
  </div>
