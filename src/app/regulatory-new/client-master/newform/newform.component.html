<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> New Sample Form</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="../samplereq" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #sampleForm="ngForm">
          <div class="clr-row">
            <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-6 clr-col-xs-6">
              <label><strong>Client Name: <span style="color: red;">*</span></strong></label>
              <select name="client_code" [(ngModel)]="client_code" required >
                   <option></option>
                  <option *ngFor="let cli of clients" [value]="cli.client_code">{{cli.TrdNm }}</option>
              </select>
          </div>
 
       
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Sample Requirement:<span style="color:red">*</span></label>
            <select name="requirement" [(ngModel)]="requirement" required>
              <option></option>
              <option>Fresh</option>
              <option>AVD</option>
            </select>
          </div>
          
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12" *ngIf="requirement=='AVD'">
            <label><strong>Type:</strong></label>
            <select name="type" [(ngModel)]="type" required>
              <option></option>
              <option>Expert</option>
              <option>Domestic</option>
            </select>
          </div>


          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12" *ngIf="requirement=='AVD'">
            <label><strong>Country:</strong></label>
              <input type="text" name="avd_country" ngModel required>
          </div>
        </div>

          
          <div class="clr-row" *ngIf="requirement=='AVD'">
            <h3>Upload Document:</h3>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Vendor COA with Q&Q:</label>
              <input type="file" name="vendor_coa" ngModel (change)="onFileChanged1($event)">
            </div>     
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>STP/Specs From Constent:</label>
              <input type="file" name="stp" ngModel (change)="onFileChanged2($event)">
            </div>
          </div>
          
          <div class="clr-row">
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Grade:</label>
              <input type="text" name="grade" ngModel>
            </div>

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Qtesting:</label>
              <input type="text" name="testing" ngModel>
            </div>

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Unit:<span style="color: red">*</span></label>
               <select name="unit" ngModel required>
                  <option></option>
                  <option *ngFor="let unit of units">{{ unit.unit }}</option>
              </select>
          </div>

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Solvent System:</label>
              <select name="solvent_system" [(ngModel)]="solvent_system" required>
                <option></option>
                <option>Aqueous</option>
                <option>Hydro Alchoride</option>
                <option>Organic</option>
              </select>
            </div>

            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Colorent:</label>
              <input type="text" name="color" ngModel>
            </div>
         
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12" *ngIf="enter == 'Yes'">
              <label>STP:</label>
              <input type="file" name="enter_stp" ngModel (change)="onFileChanged($event)">
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Equipment Available:</label>
              <input type="text" name="equip_avail" ngModel>
            </div>   
          </div>
 

       
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="save(sampleForm)">{{'common.submit' | translate}}</button>
    </div>
  </div>
