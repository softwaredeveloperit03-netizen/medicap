<div class="container-fluid"  >
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Equipment Usage Section</div>
          <div class="clr-col-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            
            <button class="btn btn-sm" routerLink="/equipmentusage/temprature" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
      <div class="card-block">
       
        <div class="card-text">
                  <clr-datagrid [clrDgLoading]="loading">
  <clr-dg-column>Sr.</clr-dg-column>
  <clr-dg-column>Room Name</clr-dg-column>
  <clr-dg-column>Room Number</clr-dg-column>
 
  <clr-dg-column>Print Barcode</clr-dg-column>

  <clr-dg-row *clrDgItems="let result of data; let i = index" [clrDgItem]="result">
    <clr-dg-cell>{{ i + 1 }}</clr-dg-cell>
    <clr-dg-cell>{{ result.section_name }}</clr-dg-cell>
    <clr-dg-cell>{{ result.section_code }}</clr-dg-cell>
 
    <clr-dg-cell>
      <button class="btn btn-sm btn-info" (click)="PrintBarcode(result.section_code)">{{'common.print' | translate}}</button>
    </clr-dg-cell>
  </clr-dg-row>
</clr-datagrid>


        </div>
      </div>
      <div class="card-footer">
         <!-- <button class="btn btn-primary"(click)="download()">{{'common.download' | translate}}</button> -->
      </div>
    </div>
  </div>
