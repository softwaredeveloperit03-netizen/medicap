 

<div class="card"  >
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-lg-6" style="color: aliceblue;margin-top: -2px;text-align: left;">TEMPERATURE AND HUMIDITY MONITORING RECORD  
            </div>
            <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm btn-danger" routerLink="/equipmentusage/temprature">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #temprecForm="ngForm">
                <table style="width: 100%; border-collapse: collapse; "  >
                    <tr>
                        <td style="width: 50%; padding: 8px;">
                            Area / Room No. :
                                <input
                                type="text"
                                [(ngModel)]="barcodeValue"
                                name="barcodeValue"
                                (keyup.enter)="onScanBarcode(barcodeValue); barcodeValue='';"
                                placeholder="Scan barcode here"
                                autofocus
                            />
                        </td>
                        <td style="width: 50%; padding: 8px;">
                            Area / Room No. :
                               <select [(ngModel)]="selectedEquipmentCode" name="selectedEquipment" (change)="onSelect()">
                            <option value="" disabled selected>Select Equipment</option>
                            <option *ngFor="let d of data"  >
                            {{ d.section_name }} 
                            </option>
                        </select>
                        </td>
                       
                        <td style="width: 50%; padding: 8px;">
                            Month:
                            <input type="month" name="tempmon" [(ngModel)]="tempmon" style="width: 95%;">
                        </td>
                    </tr>
                </table>
                   <br>
                <clr-datagrid>
                    <!-- Headers -->
                    <clr-dg-column>{{'common.date' | translate}}</clr-dg-column>
                    <clr-dg-column>Time</clr-dg-column>
                    <clr-dg-column>Temp C</clr-dg-column>
                    <clr-dg-column>Humidity %R.H.</clr-dg-column>
                    <clr-dg-column>Done By (Sign/Date)</clr-dg-column>
                     <clr-dg-column>{{'common.remarks' | translate}}</clr-dg-column>
                    <clr-dg-column>{{'common.table.action' | translate}}</clr-dg-column>

                    <!-- Row -->
                    <clr-dg-row>
                        <clr-dg-cell><input type="date" name="date"  [(ngModel)]="date"></clr-dg-cell>
                        <clr-dg-cell><input type="time" name="timeinhr" [(ngModel)]="timeinhr"></clr-dg-cell>
                        <clr-dg-cell><input type="text" name="temp" [(ngModel)]="temp"></clr-dg-cell>
                        <clr-dg-cell><input type="text" name="humidity" [(ngModel)]="humidity"></clr-dg-cell>
                        <clr-dg-cell>   <select name="done_by" class="form-control" [(ngModel)]="done_by">
                                <option disabled selected> </option>
                                <option *ngFor="let data of emps;let  i = index " [value]="data.emp_id"> {{ data.emp_name}}</option>
                     </select>
                                <br>
                            <input type="date" name="donebyDate" [(ngModel)]="donebyDate"></clr-dg-cell>
                         <clr-dg-cell><input type="text" name="remark" [(ngModel)]="remark"></clr-dg-cell>
                        <clr-dg-cell><button type="button" class="btn btn-primary" (click)="addtemprec(temprecForm)">{{'common.add' | translate}}</button></clr-dg-cell>
                    </clr-dg-row>


                  
                </clr-datagrid>
            </form>
        </div>
    </div>
</div>
