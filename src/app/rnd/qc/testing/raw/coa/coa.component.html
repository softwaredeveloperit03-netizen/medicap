<div class="container-fluid">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">CERTIFICATE OF ANALYSIS</div>
              <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/qc/testing/raw" style="background-color: red;color: white;">
                  CLOSE
                </button>
              </div>
            </div>
        </div>
      <div class="card-block">
        <div class="card-text">
            <table class="table">
                <tr>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr.</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Testing No</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sampling No</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Specification No</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Material Name</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Material Code</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.status' | translate}}</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">view</th>
                </tr>
        
                <tr *ngFor="let user of results; let i = index">
                    <td style="text-align: left;">{{i+1}}</td>
                    <td style="text-align: left;">{{user.testing_no}}</td>
                    <td style="text-align: left;">{{user.sampling_no}}</td>
                    <td style="text-align: left;">{{user.specification_no}}</td>
                    <td style="text-align: left;">{{user.material_name}}</td>
                    <td style="text-align: left;">{{user.material_code}}</td>
                    <td style="text-align: left;">{{user.status}}</td>
                    <td>
                        <button class="btn btn-sm btn-info" (click)="viewCOA(user.testing_no)">{{'common.view' | translate}}</button>
                    </td>
                </tr>
            </table>
        </div>
      </div>
    </div>
</div>
