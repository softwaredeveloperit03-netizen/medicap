<div class="container-fluid" *ngIf="isNew">
    <div class="card">
        <div class="card-header">
            <div class="clr-row" style="margin-bottom: -10px;">
                <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Goods Receipt Note for Sampling</div>
                <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                  <button class="btn btn-sm" (click)="isNew = false" style="background-color: red;color: white;">
                    CLOSE
                  </button>
                </div>
            </div>
        </div>
        <div class="card-block">
            <div class="card-text">
                <form #requestForm="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Material Name:</label>
                            <select name="material_code" ngModel required>
                                <option></option>
                                <option *ngFor="let material of materials" [value]="material.material_code">{{ material.material_name }} - {{ material.grade }}</option>
                            </select>
                        </div>
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                            <label>Medicap Lot No:</label>
                            <input type="text" name="batch_no" ngModel required>
                        </div>
                        <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                            <label>No. of Containers:</label>
                            <input type="text" name="containers" ngModel required>
                        </div>
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                            <label>Receiving no:</label>
                            <input type="text" name="grn_no" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Date:</label>
                            <input type="date" name="grn_date" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Mfg. Date:</label>
                            <input type="date" name="mfg_date" ngModel required>
                        </div>
                        <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                            <label>Exp. Date:</label>
                            <input type="date" name="exp_date" ngModel required>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="saveSamplingRequest(requestForm)">{{'common.submit' | translate}}</button>
        </div>
    </div>
</div>

<div class="container-fluid" *ngIf="!isNew">
    <div class="card">
        <div class="card-header">
            <div class="clr-row" style="margin-bottom: -10px;">
                <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Goods Receipt Note for Sampling</div>
                <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                  <button class="btn btn-sm" (click)="new()" style="background-color: aliceblue;">
                    <clr-icon shape="plus-circle" class="is-solid"></clr-icon> New GRN
                  </button>
                </div>
            </div>
        </div>
        <div class="card-block">
            <div class="card-text">
                <table class="table">
                    <tr>
                        <th>Material Code</th>
                        <th>Medicap Lot No</th>
                        <th>Containers</th>
                        <th>Receiving no</th>
                        <th>Date</th>
                    </tr>
                    <tr *ngFor="let result of results; let i = index">
                        <td>{{ result.material_code }}</td>
                        <td>{{ result.batch_no }}</td>
                        <td>{{ result.containers }}</td>
                        <td>{{ result.grn_no }}</td>
                        <td>{{ result.grn_date }}</td>
                    </tr>
                    <tr *ngIf="results?.length == 0">
                        <td colspan="5">{{'common.noRecords' | translate}}</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</div>
