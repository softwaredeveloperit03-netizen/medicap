<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Volumetric Solution Master Log</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/rnd/volumetric/master" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
          </div>
        </div>
      </div>
    <div class="card-block">
        <div class="card-text">
            <table class="table">
                <tr>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Solution Name</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Percentage</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Strength</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Standard Type</th>
                </tr>
                <tr *ngFor="let result of results; let i = index">
                    <td style="text-align: left;">{{ result.solution_name }}</td>
                    <td style="text-align: left;">{{ result.percentage }}</td>
                    <td style="text-align: left;">{{ result.strength }}</td>
                    <td style="text-align: left;">{{ result.standard_type }}</td>
                </tr>
                <tr *ngIf="results?.length == 0">
                    <td colspan="4">{{'common.noRecords' | translate}}</td>
                </tr>
            </table>
        </div>
    </div>
</div>
