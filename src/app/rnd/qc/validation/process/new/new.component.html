<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Validation Form</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/rnd/qc/validation/process" style="background-color: red;color: white;"> CLOSE
            </button>
          </div>
        </div>
      </div>
        <div class="card-block">
            <div class="card-text">
              <form #FormData="ngForm">
                <div class="clr-row">
                  <div class="clr-col-md-12 clr-col-12">
                    <label><strong>Doseage Form</strong></label>
                    <select ngModel name="dosage_form" required (change)="getProducts($event.target.selectedIndex) ">
                     <option></option>
                     <option *ngFor="let result of dosage; let i= index" value="{{result.dosage_form}}">{{result.dosage_form}}</option>
                    </select>
                  </div>
                  <div class="clr-col-md-12 clr-col-12">
                    <label><strong>Product Name</strong></label>
                    <select ngModel name="product_code" required (change)="getDetails($event.target.selectedIndex)">
                        <option></option>
                      <option *ngFor="let product of productslist; let i=index" value={{product.product_code}}>{{product.product_name}}</option>
                    </select>
                  </div>
                  <div class="clr-col-md-12 clr-col-12"*ngIf="isView">
                    <table class="table">
                        <tr>
                            <td style="text-align: left;">Genric Name:</td>
                            <td style="text-align: left;">{{detailslist['generic_name']}}</td>
                        </tr>
                        <tr>
                            <td style="text-align: left;">grade:</td>
                            <td style="text-align: left;">{{detailslist['grade']}}</td>
                        </tr>
                        <tr>
                            <td style="text-align: left;" >product code:</td>
                            <td style="text-align: left;" >{{detailslist['product_code']}}</td>
                            <td style="text-align: left;">Manfactures for:</td>
                            <td style="text-align: left;">{{detailslist['manufactured_for']}}</td>
                        </tr>       
                    </table>
                  </div>
                  <div class="clr-col-md-6 clr-col-12">
                    <label><strong> No of Batches to Be planned:</strong></label>
                    <input ngModel name="batches" type="text">
                  </div>
                  <div class="clr-col-md-6 clr-col-12">
                    <label><strong>Reason for Process Validation </strong></label>
                    <textarea ngModel name="reason"></textarea>
                  </div>
                  <div class="clr-col-md-12 clr-col-12">
                    <h4>Regulatory Impact:</h4>  
                  </div>
                  <div class="clr-col-md-6 clr-col-12">
                    <label><strong>Change required to file</strong></label>
                    <select ngModel name="change_required" required>
                      <option value="yes">Yes</option>
                      <option value="no">No</option>
                    </select>
                  </div>
                  <div class="clr-col-md-6 clr-col-12">
                    <label><strong>Batch size for process validation</strong></label>
                    <select ngModel name="batch_size" required>
                      <option  *ngFor="let batches of batchlist; let i=index" value={{batches.batch_size}}>{{batches.batch_size}}</option> 
                    </select>
                  </div>
                </div>
              </form>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-denger"(click)="save(FormData)">{{'common.save' | translate}}</button>
        </div>
    </div>
</div>
