<div class="card">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Water Sampling Plan</div>
      <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        <button class="btn btn-sm" routerLink="/rnd/qc/water" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <div class="card-text" style="overflow-x:scroll; overflow-y: scroll;">
      <table class="table">
        <tr>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Point No.</th>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Point Name</th>
          <th *ngFor="let key of keys">{{ key }}</th>
        </tr>
        <tr *ngFor="let result of results; let i = index">
          <td style="text-align: left;">{{ result['point_no'] }}</td>
          <td style="text-align: left;">{{ result['point_name'] }}</td>
          <td *ngFor="let key of keys">{{ result[key] }}</td>
        </tr>
        <tr *ngIf="results?.length == 0">
          <td colspan="3">{{'common.noRecords' | translate}}</td>
        </tr>
      </table>
    </div>
  </div>
</div>
