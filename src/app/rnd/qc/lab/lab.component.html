  <div class="container-fluid" *ngIf="!isNew">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-8" style="color: aliceblue;margin-top: -2px;text-align: left;">Laboratory Master</div>
              <div class="clr-col-lg-4" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" style="background-color: green;color: white;" (click)="new()" *ngIf="isuser == 'Yes'"> New Laboratory Master
                </button>
                <button class="btn btn-sm" routerLink="/rnd/qc" style="background-color: red;"> CLOSE
                </button>
              </div>
            </div>
        </div>
      <div class="card-block">
        <div class="card-text">
          <clr-datagrid>
            <clr-dg-column style="text-align: left; background-color: rgb(14, 67, 112); "> Lab Name</clr-dg-column>
            <clr-dg-column style="text-align: left; background-color: rgb(14, 67, 112); ">Capacity</clr-dg-column>
            <clr-dg-column style="text-align: left; background-color: rgb(14, 67, 112); ">{{'common.unit' | translate}}</clr-dg-column>
            <clr-dg-column style="text-align: left; background-color: rgb(14, 67, 112); ">Laboratory Class</clr-dg-column>
            <clr-dg-column style="text-align: left; background-color: rgb(14, 67, 112); ">{{'common.description' | translate}}</clr-dg-column>
        
            <clr-dg-row *ngFor="let user of glasswares">
                <clr-dg-cell style="text-align: left;">{{user.name}}</clr-dg-cell>
                <clr-dg-cell style="text-align: left;">{{user.capacity}}</clr-dg-cell>
                <clr-dg-cell style="text-align: left;">{{user.unit}}</clr-dg-cell>
                <clr-dg-cell style="text-align: left;">{{user.glassware_class}}</clr-dg-cell>
                <clr-dg-cell style="text-align: left;">{{user.description}}</clr-dg-cell>
            </clr-dg-row>
  
            <!-- <clr-dg-footer>
              <clr-dg-pagination #pagination [clrDgPageSize]="10">
                  <clr-dg-page-size [clrPageSizeOptions]="[10,20,50,100]">glasswares per page</clr-dg-page-size>
                  {{pagination.firstItem + 1}} - {{pagination.lastItem + 1}}
                  of {{pagination.totalItems}} glasswares
              </clr-dg-pagination>
            </clr-dg-footer> -->
          </clr-datagrid>
        </div>
      </div>
    </div>
  </div>

  <div class="container-fluid" *ngIf="isNew">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Laboratory Master</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          
            <button class="btn btn-sm" routerLink="/rnd/qc" style="background-color: red;color: white;"> CLOSE
            </button>
          </div>
        </div>
      </div>
      <div class="card-block">
        <div class="card-text">
          <form #glasswareForm="ngForm">
            <div class="clr-row">
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label> Lab Name:</label>
                <input type="text" name="name" #glassware_name="ngModel" ngModel required>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Capacity:</label>
                <input type="text" name="capacity" #capacity="ngModel" ngModel required>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Unit:</label>
                <select name="unit" #unit="ngModel" ngModel required>
                  <option>ML</option>
                  <option>Liter</option>
                  <option>Microliter</option>
                  <option>L / cm</option>
                </select>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Laboratory Type:</label>
                <select name="glassware_class" ngModel required>
                  <option>Product Development   (R&D) Labs</option>
                  <option>Analytical and Quality Control Labs</option>
                  <option>Clinical Labs</option>
                  <option>Toxicology Labs</option>
                </select>
              </div>
              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label>{{'common.description' | translate}}</label>
                <input type="text" name="description" ngModel="{{ glassware_name.value }} {{ capacity.value }} {{ unit.value }}" required>
              </div>
            </div>
          </form>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="saveGlasswares(glasswareForm)">{{'common.submit' | translate}}</button>
      </div>
    </div>
  </div>
