<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New HPLC Column</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/rnd/qc/master/hplc" style="background-color: red;color: white;">
              CLOSE
            </button>
          </div>
        </div>
      </div>

    <div class="card-block">
        <div class="card-text">
          <form #hplcForm="ngForm">
            <div class="clr-row">
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Name:</label>
                <input type="text" name="name" #name="ngModel" ngModel required>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Packing:</label>
                <input type="text" name="packing" #packing="ngModel" ngModel required>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Brand:</label>
                <input type="text" name="brand" ngModel required>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Particle Size:</label>
                <input type="text" name="particle_size" ngModel required>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Type:</label>
                <input type="text" name="type" ngModel required>
              </div>
            </div>
          </form>
          </div>
        </div>
        <div class="card-footer">
          <button class="btn btn-primary" (click)="save(hplcForm)">{{'common.save' | translate}}</button>
        </div>
    </div>
</div><p>new works!</p>
