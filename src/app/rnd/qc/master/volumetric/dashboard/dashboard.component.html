<div class="container-fluid" *ngIf="!isView">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-8" style="color: aliceblue;margin-top: -2px;text-align: left;">Volumetric Solution Log</div>
              <div class="clr-col-lg-4" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="new" style="background-color: green;color: white;" *ngIf="isuser == 'Yes'">
                    New Volumetric Form
                  </button>
                <button class="btn btn-sm" routerLink="/rnd/qc" style="background-color: red;color: white;">
                  CLOSE
                </button>
              </div>
            </div>
          </div>
        <div class="card-block">
            <div class="card-text">
                <table class="table">
                    <tr>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr.</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Solution Name.</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Percentage</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Unit.</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">strength</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Make Standard Type</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.status' | translate}}</th>
                    </tr>
                    <tr *ngFor="let result of results; let i = index">
                        <td style="text-align: left;">{{ i+1 }}</td>
                        <td style="text-align: left;">{{ result.solution_name }}</td>
                        <td style="text-align: left;">{{ result.percentage }}</td>
                        <td style="text-align: left;">{{ result.unit }}</td>
                        <td style="text-align: left;">{{result.strength}}</td>
                        <td style="text-align: left;">{{ result.standard_type }}</td>
                        <td style="text-align: left;">{{result.status}}</td>
                    </tr>
                    <tr *ngIf="results?.length == 0">
                        <td colspan="6">{{'common.noRecords' | translate}}</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</div>
