<div class="container-fluid">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Volumetric Solution Master</div>
              <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/rnd/qc/master/volumetric" style="background-color: red;color: white;">
                  CLOSE
                </button>
              </div>
            </div>
          </div> 
        <div class="card-block">
            <div class="card-text">
                <form #volumetricForm="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-12">
                            <label>Name of Volumetric / Standard Solution:</label>
                            <input type="text" name="solution_name" ngModel required>
                        </div>
                        <div class="clr-col-4">
                            <label>Percentage:</label>
                            <input type="text" name="percentage" ngModel required>
                        </div>
                        <div class="clr-col-2">
                            <label>Unit:</label>
                            <select name="unit" ngModel required>
                                <option>w/v</option>
                                <option>w/w</option>
                                <option>v/v</option>
                            </select>
                        </div>
                        <div class="clr-col-6">
                            <label>Strength:</label>
                            <input type="text" name="strength" ngModel required>
                        </div>
                        <div class="clr-col-12">
                            <label>Type of Standard:</label>
                            <select name="standard_type" ngModel required>
                                <option>Primary</option>
                                <option>Secondary</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="saveVolumetricMaster(volumetricForm)">{{'common.save' | translate}}</button>
        </div>
    </div>
</div>
