<div class="container-fluid">    
    <div class="card">
            <div class="card-header" style="text-align: center">
                <div class="clr-row" style="margin-bottom: -10px;">
                  <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Chemical Log</div>
                  <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                    <button class="btn btn-sm" routerLink="new" style="background-color: green;color: white;" *ngIf="isuser == 'Yes'"> New Chemical</button>
                    <button class="btn btn-sm" routerLink="/rnd/qc" style="background-color: red;color: white;"> CLOSE
                    </button>
                  </div>
                </div>
              </div>
            <div class="card-block">
                <div class="card-text">
                    <table class="table">
                        <tr>
                            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr</th>
                            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Chemical No</th>
                            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Chemical Name</th>
                            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Modecular Weight</th>
                            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Pack Size</th>
                            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">CAS No</th>
                            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Grade</th> 
                            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.status' | translate}}</th>
                        </tr>
                        <tr *ngFor="let item of resuls;let i = index">
                            <td style="text-align: left;">{{ i+1 }}.</td>
                            <td style="text-align: left;">{{item.chemical_no}}</td>
                            <td style="text-align: left;">{{item.chemical_name}}</td>
                   
                            <td style="text-align: left;">{{item.molecular_wt}}</td>
                            <td style="text-align: left;">{{item.pack_size}}</td>
                            <td style="text-align: left;">{{item.cas_name}}</td>
                            <td style="text-align: left;">{{item.grade}}</td>
                            <td style="text-align: left;">{{item.status}}</td>
                        </tr>
                    </table>
                </div>
            </div>
    </div>
</div>
