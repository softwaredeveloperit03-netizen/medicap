<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Glassware Master</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          
            <button class="btn btn-sm" routerLink="/rnd/qc/master/glassware" style="background-color: red;color: white;"> CLOSE
            </button>
          </div>
        </div>
      </div>
      <div class="card-block">
        <div class="card-text">
          <form #glasswareForm="ngForm">
            <div class="clr-row">
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Name:</label>
                <input type="text" name="name" #glassware_name="ngModel" ngModel required>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Capacity:</label>
                <input type="text" name="capacity" #capacity="ngModel" ngModel required>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Unit:</label>
                <select name="unit" #unit="ngModel" ngModel required>
                  <option>ML</option>
                  <option>Liter</option>
                  <option>Microliter</option>
                  <option>L / cm</option>
                </select>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Class:</label>
                <select name="glassware_class" ngModel required>
                  <option>Type A</option>
                  <option>Type B</option>
                  <option>Borosil</option>
                </select>
              </div>
              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label>{{'common.description' | translate}}</label>
                <input type="text" name="description" ngModel="{{ glassware_name.value }} {{ capacity.value }} {{ unit.value }}" required>
              </div>
            </div>
          </form>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="saveGlasswares(glasswareForm)">{{'common.submit' | translate}}</button>
      </div>
    </div>
  </div>
