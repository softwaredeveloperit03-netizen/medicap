
  
  <div class="container-fluid">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-8" style="color: aliceblue;margin-top: -2px;text-align: left;">Glassware Master</div>
              <div class="clr-col-lg-4" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="new" style="background-color: green;color: white;" *ngIf="isuser == 'Yes'"> New Glassware Master</button>
                <button class="btn btn-sm" routerLink="/rnd/qc" style="background-color: red;"> CLOSE
                </button>
              </div>
            </div>
        </div>
      <div class="card-block">
        <div class="card-text">
          <clr-datagrid>
            <clr-dg-column style="text-align: left; background-color: rgb(14, 67, 112); ">{{'common.name' | translate}}</clr-dg-column>
            <clr-dg-column style="text-align: left; background-color: rgb(14, 67, 112); ">Capacity</clr-dg-column>
            <clr-dg-column style="text-align: left; background-color: rgb(14, 67, 112); ">{{'common.unit' | translate}}</clr-dg-column>
            <clr-dg-column style="text-align: left; background-color: rgb(14, 67, 112); ">Glassware Class</clr-dg-column>
            <clr-dg-column style="text-align: left; background-color: rgb(14, 67, 112); ">{{'common.description' | translate}}</clr-dg-column>
        
            <clr-dg-row *ngFor="let user of glasswares">
                <clr-dg-cell style="text-align: left;">{{user.name}}</clr-dg-cell>
                <clr-dg-cell style="text-align: left;">{{user.capacity}}</clr-dg-cell>
                <clr-dg-cell style="text-align: left;">{{user.unit}}</clr-dg-cell>
                <clr-dg-cell style="text-align: left;">{{user.glassware_class}}</clr-dg-cell>
                <clr-dg-cell style="text-align: left;">{{user.description}}</clr-dg-cell>
            </clr-dg-row>
  
            <!-- <clr-dg-footer>
              <clr-dg-pagination #pagination [clrDgPageSize]="10">
                  <clr-dg-page-size [clrPageSizeOptions]="[10,20,50,100]">glasswares per page</clr-dg-page-size>
                  {{pagination.firstItem + 1}} - {{pagination.lastItem + 1}}
                  of {{pagination.totalItems}} glasswares
              </clr-dg-pagination>
            </clr-dg-footer> -->
          </clr-datagrid>
        </div>
      </div>
    </div>
  </div>
