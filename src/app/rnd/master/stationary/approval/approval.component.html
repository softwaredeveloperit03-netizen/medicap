<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-lg-3" style="color: aliceblue;margin-top: -2px;text-align: left;">  Stationary Approval</div>
          <div class="clr-col-lg-9" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-danger" routerLink="/rnd/master/stationary">{{'common.close' | translate}}</button>
          </div>
        </div>
      </div>
    <div class="card-block">
        <div class="card-text">
           <table class="table">
               <tr>
                   <th style="text-align: left;">Sr</th>
                   <th style="text-align: left;">Material Code </th>
                   <th style="text-align: left;">Material Name</th>
                   <th style="text-align: left;">Gst</th>
                   <th style="text-align: left;">Hsn</th>
                   <th style="text-align: left;">{{'common.status' | translate}}</th>
                   <th>{{'common.table.action' | translate}}</th>
               </tr>
               <tr *ngFor="let result of results;let i=index">
                   <td style="text-align: left;">{{i+1}}</td>
                   <td style="text-align: left;">{{result.material_code}}</td>
                   <td style="text-align: left;">{{result.material_name}}</td>
                   <td style="text-align: left;">{{result.gst}}</td>
                   <td style="text-align: left;">{{result.hsn}}</td>
                   <td style="text-align: left;">{{result.status}}</td>
                    <td>
                       <button class="btn btn-sm btn-primary"(click)="update('approve',result.id)">{{'common.approve' | translate}}</button>
                       <button class="btn btn-sm btn-danger"(click)="update('reject',result.id)">{{'common.reject' | translate}}</button>
                   </td>
               </tr>
               <tr *ngIf="results?.length==0">
                   <td colspan="6">No Record Found!</td>
               </tr>
           </table> 
        </div>
    </div>
    <div class="card-footer">
    </div>
</div>
