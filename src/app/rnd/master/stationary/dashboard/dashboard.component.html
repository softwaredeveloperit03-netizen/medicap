<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-lg-3" style="color: aliceblue;margin-top: -2px;text-align: left;">Stationary Master</div>
        <div class="clr-col-lg-9" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-success" routerLink="new" *ngIf="isuser == 'Yes'" >New Stationary</button>
          <!-- <button class="btn btn-sm btn-success" routerLink="approval">Stationary for Approval</button> -->
          <button class="btn btn-sm btn-danger" routerLink="/rnd/master">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <table class="table">
          <tr>
              <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr</th>
              <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Material Type</th>
              <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Material Code </th>
              <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Material Name</th>
              <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Gst</th>
              <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Hsn</th>
              <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Entry By</th>
              <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Entry Date</th>
             <!--  <th style="text-align: left;">{{'common.status' | translate}}</th> -->
          </tr>
          <tr *ngFor="let result of results;let i=index">
              <td style="text-align: left;">{{i+1}}</td>
              <td style="text-align: left;">{{result.material_type}}</td>
              <td style="text-align: left;">{{result.material_code}}</td>
              <td style="text-align: left;">{{result.material_name}}</td>
              <td style="text-align: left;">{{result.gst}}</td>
              <td style="text-align: left;">{{result.hsn}}</td>
              <td style="text-align: left;">{{result.entry_by}}</td>
              <td style="text-align: left;">{{result.entry_date | date: 'dd-MM-YYYY'}}</td>
         <!--      <td style="text-align: left;">{{result.status}}</td> -->
          </tr>
          <tr *ngIf="results?.lenght==0">
              <td colspan="6">No Record Found!</td>
          </tr>
      </table> 
    </div>
    <div class="card-footer"><button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button></div>
  </div>
