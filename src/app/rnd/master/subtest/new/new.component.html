<div class="container-fluid">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Subtest Master</div>
              <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/rnd/master/subtest" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
              </div>
            </div>
        </div>
      <div class="card-block">
        <div class="card-text">
        <form #testForm="ngForm" class="clr-row">
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Classification:<span style="color: red;">*</span></label>
              <select name="classification" [(ngModel)]="classification" (change)="checkClassification($event.target.value)" required>
                  <option></option>
                  <option>Raw Material</option>
                  <option>Packing Material</option>
                  <option>Finish Product</option>
                  <option>Inprocess</option>
                </select>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Type:<span style="color: red;">*</span></label>
              <select name="dosage_form" [(ngModel)]="dosage_form" (change)="getTests()" required>
                <option></option>
                <option *ngIf="isRawMaterial">Powder</option>
                <option *ngIf="isRawMaterial || isPackingMaterial">Liquid</option>
                <option *ngIf="isRawMaterial || isPackingMaterial">Solid</option>
                <option *ngIf="isFinishProduct">Injection</option>
                <option *ngIf="isRawMaterial">Semi Solid</option>
                <option *ngIf="isPackingMaterial">Primary</option>
                <option *ngIf="isPackingMaterial">Secondary</option>
                <option *ngIf="isPackingMaterial">Tertiary</option>
                <option *ngIf="isFinishProduct">Tablet</option>
                <option *ngIf="isFinishProduct">Capsule</option>
                <option *ngIf="isFinishProduct">Ointment</option>
                <option *ngIf="isFinishProduct">Cream</option>
                <option *ngIf="isFinishProduct">Pellets</option>
                <option *ngIf="isFinishProduct">Gel</option>
                <option *ngIf="isFinishProduct">Suspension</option>
                <option *ngIf="isFinishProduct">Syrup</option>
                <option *ngIf="isInprocess">Pallets</option>
              </select>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Test:<span style="color: red;">*</span></label>
              <select name="test" ngModel required #test="ngModel" required>
                <option></option>
                <option *ngFor="let val of tests">{{ val.test }}</option>
              </select>
              <div class="alert alert-danger alert-sm" *ngIf="test.invalid && (test.dirty || test.touched)">
                Test Name is Required.
              </div>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Test Type:</label>
              <select name="test_type" [(ngModel)]="test_type"  required>
                <option>Chemical</option>
                <option>Microbiology</option>
              </select>
            </div>
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>Subtest:<span style="color: red;">*</span></label>
              <input type="text" required name="subtest" ngModel #subtest="ngModel">
              <div class="alert alert-danger alert-sm" *ngIf="subtest.invalid && (subtest.dirty || subtest.touched)">
                Subtest Test Name is Required.
              </div>
            </div>
          </form>
        </div>
      </div>
      <div class="card-footer">
        <button type="button" class="btn btn-primary" (click)="testForm.form.valid && addTest(testForm.value)" [disabled]="testForm.form.invalid">{{'common.submit' | translate}}</button>
      </div>
    </div>
</div>
