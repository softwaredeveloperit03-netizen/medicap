<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;">SubTest Master</div>
          <div class="clr-col-lg-5" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="new" style="background-color:green;color: white;" *ngIf="isuser == 'Yes'">
              New
            </button>
            <button class="btn btn-sm" routerLink="approval" style="background-color:green;color: white;" *ngIf="isapprover == 'Yes'">
                Approval
              </button>
            <button class="btn btn-sm" routerLink="/rnd/master" style="background-color: red;color: white;">
             {{'common.close' | translate}} </button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
          <div class="clr-row">
            <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-3 clr-col-xs-3">
              <label>Classification:<span style="color: red;">*</span></label>
              <select name="classification" [(ngModel)]="classification" (change)="checkClassification($event.target.value)" required>
                  <option></option>
                  <option>Raw Material</option>
                  <option>Packing Material</option>
                  <option>Finish Product</option>
                  <option>Inprocess</option>
                </select>
            </div>
            <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-3 clr-col-xs-3">
              <label>Type:<span style="color: red;">*</span></label>
              <select name="dosage_form" [(ngModel)]="dosage_form" (change)="getTests()" required>
                <option></option>
                <option *ngIf="isRawMaterial">Powder</option>
                <option *ngIf="isRawMaterial || isPackingMaterial">Liquid</option>
                <option *ngIf="isRawMaterial || isPackingMaterial">Solid</option>
                <option *ngIf="isFinishProduct">Injection</option>
                <option *ngIf="isRawMaterial">Semi Solid</option>
                <option *ngIf="isPackingMaterial">Primary</option>
                <option *ngIf="isPackingMaterial">Secondary</option>
                <option *ngIf="isPackingMaterial">Tertiary</option>
                <option *ngIf="isFinishProduct">Tablet</option>
                <option *ngIf="isFinishProduct">Capsule</option>
                <option *ngIf="isFinishProduct">Ointment</option>
                <option *ngIf="isFinishProduct">Cream</option>
                <option *ngIf="isFinishProduct">Pellets</option>
                <option *ngIf="isFinishProduct">Gel</option>
                <option *ngIf="isFinishProduct">Suspension</option>
                <option *ngIf="isFinishProduct">Syrup</option>
                <option *ngIf="isInprocess">Pallets</option>
              </select>
            </div>
            <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-3 clr-col-xs-3">
              <label>Test:<span style="color: red;">*</span></label>
              <select name="test" [(ngModel)]="test" required  required>
                <option></option>
                <option *ngFor="let val of tests" value="{{val.test}}">{{ val.test }}</option>
              </select>
            </div>
            <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
              <label>Test Type:</label>
              <select name="test_type" [(ngModel)]="test_type"  required>
                <option>Chemical</option>
                <option>Microbiology</option>
              </select>
            </div>
    <!--         <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-3 clr-col-xs-3">
             <label>Status:</label>
             <select name="status" [(ngModel)]="status">
               <option></option>
               <option>{{'common.pending' | translate}}</option>
               <option>Approve</option>
               <option>Reject</option>
             </select>
            </div> -->
            <div class="clr-col-lg-1 clr-col-md-2 clr-col-sm-2 clr-col-xs-2">
              <button class="btn btn-danger"(click)="getSubtests()"style="margin-top:30px">{{'common.search' | translate}}</button>
            </div>
          </div>
            <table class="table">
                <tr>
                  <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr</th>
                  <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Classfication</th>
                  <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.type' | translate}}</th>
                  <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Test</th>
                  <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Test Type</th>
                  <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Subtest</th><!-- 
                  <th style="text-align: left;">{{'common.status' | translate}}</th> -->
                </tr>
                <tr *ngFor="let user of subtests;let i=index">
                  <td style="text-align: left;">{{i+1}}</td>
                  <td style="text-align: left;">{{user.classification}}</td>
                  <td style="text-align: left;">{{user.dosage_form}}</td>
                  <td style="text-align: left;">{{user.test}}</td>
                  <td style="text-align: left;">{{user.test_type}}</td>
                  <td style="text-align: left;">{{user.subtest}}</td><!-- 
                  <td style="text-align: left;">{{user.status}}</td> -->
                </tr>
                <tr *ngIf="subtests?.length==0">
                  <td colspan="7">No Record Founde</td>
                </tr>
            </table>
        </div>
    </div>
    <div class="card-footer"><button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button></div>
</div>
