<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-3" style="color: aliceblue;margin-top: -2px;text-align: left;">Test Master</div>
          <div class="clr-col-lg-9" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/rnd/master/test" style="background-color: red;color: white;">
             {{'common.close' | translate}} </button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <table class="table">
                <tr>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Classfication</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.type' | translate}}</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Test</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Test Type</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;"> Status</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.table.action' | translate}}</th>
                </tr>
                <tr *ngFor="let user of tests;let i=index">
                    <td>{{i+1}}</td>
                    <td style="text-align: left;">{{user.classification}}</td>
                    <td style="text-align: left;">{{user.dosage_form}}</td>
                    <td style="text-align: left;">{{user.test}}</td>
                    <td style="text-align: left;">{{user.test_type}}</td>
                    <td style="text-align: left;">{{user.status}}</td>
                    <td>
                        <button class="btn btn-primary btn-sm"(click)="update('approve',user.id)">{{'common.approved' | translate}}</button>
                        <button class="btn btn-danger btn-sm"(click)="update('reject',user.id)">{{'common.reject' | translate}}</button>
                    </td>
                </tr>
                <tr *ngIf="tests?.length==0">
                    <td colspan="5"> No Record found</td>
                </tr>
            </table>
        </div>
    </div>
</div>
