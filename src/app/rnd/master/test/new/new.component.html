<div class="card">
  <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-3" style="color: aliceblue;margin-top: -2px;text-align: left;">New Test Master</div>
        <div class="clr-col-lg-9" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/rnd/master/test" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
        </div>
      </div>
  </div>
  <div class="card-block">
    <div class="card-text">
    <form #testForm="ngForm" class="clr-row">
        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
          <label>Classification:</label>
          <select name="classification" [(ngModel)]="classification" (change)="checkClassification($event.target.value)" required>
              <option>Raw Material</option>
              <option>Packing Material</option>
              <option>Finish Product</option>
              <option>Inprocess</option>
            </select>
        </div>
        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
          <label>Type:</label>
          <select name="dosage_form" [(ngModel)]="dosage_form" required>
            <option></option>
            <option *ngIf="isRawMaterial">Powder</option>
            <option *ngIf="isRawMaterial">Liquid</option>
            <option *ngIf="isRawMaterial">Solid</option>
            <option *ngIf="isRawMaterial">Semi Solid</option>
            <option *ngIf="isPackingMaterial">Primary</option>
            <option *ngIf="isPackingMaterial">Secondary</option>
            <option *ngIf="isPackingMaterial">Tertiary</option>
            <option *ngIf="isFinishProduct">Injection</option>
            <option *ngIf="isFinishProduct">Tablet</option>
            <option *ngIf="isFinishProduct">Capsule</option>
            <option *ngIf="isFinishProduct">Ointment</option>
            <option *ngIf="isFinishProduct">Cream</option>
            <option *ngIf="isFinishProduct">Pellets</option>
            <option *ngIf="isFinishProduct">Gel</option>
            <option *ngIf="isFinishProduct">Suspension</option>
            <option *ngIf="isFinishProduct">Syrup</option>
            <option *ngIf="isInprocess">Pallets</option>
          </select>
        </div>
        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
          <label>Test Type:</label>
          <select name="test_type" [(ngModel)]="test_type" required>
            <option value="Chemical">Chemical</option>
            <option value="Microbiology">Microbiology</option>
            <option value="Chemical / Micro">Chemical / Micro</option>
          </select>
        </div>
        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
          <label>Test:</label>
          <input type="text" required name="test" [(ngModel)]="test" (keyup)="filterTable($event.target.value)">
        </div>
      </form>
    </div>
  </div>
  <div class="card-footer">
    <button type="button" class="btn btn-primary" (click)="addTest(testForm.value)" [disabled]="testForm.form.invalid">{{'common.submit' | translate}}</button>
  </div>
</div>
