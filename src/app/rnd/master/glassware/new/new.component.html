<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Glassware Master</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/rnd/master/glassware" style="background-color: red;color: white;"> CLOSE
            </button>
          </div>
        </div>
      </div>
      <div class="card-block">
        <div class="card-text">
            <form #glasswareForm="ngForm">
                <div class="clr-row">
                  <div class="clr-col-lg-4 clr-col-md-4 clr-col-lm-4 clr-col-xs-4">
                        <label><strong>Name:<span style="color: red;">*</span></strong></label>
                        <input type = "text" name="name" ngModel required>
                  </div>
                  <div class="clr-col-lg-4 clr-col-md-4 clr-col-lm-4 clr-col-xs-4">
                    <label><strong>Capacity:<span style="color: red;">*</span></strong></label>
                    <input type = "text" name="capacity" ngModel required>
                  </div>
                  <div class="clr-col-lg-4 clr-col-md-4 clr-col-lm-4 clr-col-xs-4">
                        <label><strong>Unit:<span style="color: red;">*</span></strong></label>
                        <select name="unit" ngModel required>
                        <option value="ml">ML</option>
                        <option value="liter">Liter</option>
                        </select>
                  </div>
                  <div class="clr-col-lg-4 clr-col-md-4 clr-col-lm-4 clr-col-xs-4">
                        <label><strong>Class:<span style="color: red;">*</span></strong></label>
                        <select name="glassware_class" ngModel required>
                         <option value="type A">Type A</option>
                        <option value="type B">Type B</option>
                         <option value="type C">Type C</option>
                         </select>
                  </div>
                  <div class="clr-col-12">
                        <label><strong>Description:<span style="color: red;">*</span></strong></label>
                        <textarea ngModel name="description"></textarea>
                  </div>   
              </div>
              </form>
        </div>
        <div class="card-footer" style="text-align: right;">
          <button class="btn btn-primary" (click)="saveGlassware(glasswareForm)">{{'common.save' | translate}}</button>
         </div>
            
      </div>
    </div>
</div>
