<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Product Entry Form </div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-danger" routerLink="/rnd/master/product">{{'common.close' | translate}}</button>
          </div>
        </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #productForm="ngForm">
            <div class="clr-row">
                <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <label>Manufactured Under:<span style="color: red">*</span> </label>
                    <select name="manufactured_under" [(ngModel)]="manufactured_under" required>
                    <option></option>
                    <option value="Contract Mfg. / LL">Contract Mfg. / LL</option>
                    <option value="Third Party">Third Party</option>
                    <option>Own</option>
                    </select>
                </div>
                <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12" *ngIf="manufactured_under == 'Contract Mfg. / LL'|| manufactured_under == 'Third Party' ">
                    <label>Manufactured For Client:<span style="color: red">*</span></label>
                    <select name="manufactured_for" [(ngModel)]="manufactured_for" required>
                    <option></option>
                    <option *ngFor="let client of clients">{{ client.company }}</option>
                    </select>
                </div>
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                    <label>Product Name:<span style="color: red">*</span></label>
                    <textarea rows="2" name="product_name" [(ngModel)]="product_name" required></textarea>
                </div>

                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                    <label>Brand Name:<sub>(optional)</sub></label>
                    <textarea rows="2" name="brand_name" ngModel required></textarea>
                </div>
               
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-4 clr-col-xs-4">
                    <label>Grade:<span style="color: red">*</span></label>
                    <select name="grade" [(ngModel)]="grade" required>
                        <option></option>
                        <option *ngFor="let grade of grades">{{ grade.grade }}</option>
                    </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Type of Product:<span style="color: red">*</span></label>
                    <select name="product_type" [(ngModel)]="product_type" required>
                        <option>API</option>
                        <option>Intermediate</option>
                        <option>Excipient</option>
                    </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <label>Nature of Product:</label>
                    <select name="product_nature" ngModel>
                      <option>SOLID</option>
                      <option>LIQUID</option>
                      <option>SEMI-SOLID</option>
                      <option>GAS</option>
                    </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Packing Style:</label>
                    <select name="packing_style" [(ngModel)]="packing_style" (change)="checkStyle($event.target.value)">
                        <option></option>
                        <option *ngFor="let style of styles">{{ style.style }}</option>
                        <option style="color: red;">ADD NEW</option>
                    </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12 remove-side-arrow-container">
                    <label>Minimum Shelf Life: (Months)<span style="color: red">*</span></label>
                    <input type="number" name="min_shelf" [(ngModel)]="min_shelf" required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12 remove-side-arrow-container">
                    <label>Shelf Life: (Months)<span style="color: red">*</span></label>
                    <input type="number" name="shelf_life"[(ngModel)]="shelf_life" required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12 remove-side-arrow-container">
                    <label>Approximate Testing Time:</label>
                    <input type="number" name="testing_time" ngModel>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12 remove-side-arrow-container">
                    <label>Retest After(Months):</label>
                    <input type="number" name="retest_period" ngModel>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12" *ngIf="product_type == 'API'">
                    <label>Therapeutic Category:</label>
                    <input type="text" name="thera" ngModel>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Storage Condition:</label>
                    <input type="text" name="storage_condition" ngModel>
                </div>
                <div class="clr-col-lg-5 clr-col-md-5 clr-col-sm-12 clr-col-xs-12">
                    <label>CAS Name:</label>
                    <input type="text" name="cas_name" ngModel>
                </div>
                <div class="clr-col-lg-5 clr-col-md-5 clr-col-sm-12 clr-col-xs-12">
                    <label>IUPAC Name:</label>
                    <input type="text" name="upac_name" ngModel>
                </div>
                <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                    <label>Molecular Weight:</label>
                    <input type="text" name="molicular_wt" ngModel>
                </div>
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                    <label>Product Appearance:</label>
                    <input type="text" name="product_apperance" ngModel required placeholder="e.g. amorphous, crystal">
                </div>
            </div>
            <h4>Accounting Details:</h4>
            <div class="clr-row">
                <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                    <label>Mfg.Lic.no:</label>
                    <input type="text" name="mfg_lic" ngModel>
                </div>
                <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                    <label>HSN/SAC CODE:</label>
                    <input type="text" name="hsn" ngModel>
                </div>
                <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                    <label>GTIN:</label>
                    <input type="text" name="gtin" ngModel>
                </div>
                <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                    <label>MRP:</label>
                    <input type="text" name="mrp" ngModel>
                </div>
                <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12">
                    <label>GST:</label>
                    <select name="gst" ngModel>
                        <option></option>
                        <option *ngFor="let gs of gst">{{gs.description}}</option>   
                    </select>
                </div>
                <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12">
                    <label>Cess %:</label>
                    <select name="cess" ngModel>
                        <option></option>
                        <option *ngFor="let ce of cess">{{ce.cess}}</option>   
                    </select>
                </div>
            </div>
            <h4>Documents:</h4>
            <div class="clr-row">
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Product License:</label>
                    <input type="file" (change)="onFileChanged1($event)" name="product_lic" ngModel accept="application/pdf">
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>FSC:</label>
                    <input type="file" (change)="onFileChanged2($event)" name="fsc" ngModel accept="application/pdf">
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>COPP:</label>
                    <input type="file" (change)="onFileChanged3($event)" name="copp" ngModel accept="application/pdf">
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Chemical Structure:</label>
                    <input type="file" (change)="onFileChanged4($event)" name="structure" ngModel accept="application/pdf">
                </div>
            </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button type="button" class="btn btn-primary" (click)="save(productForm)">{{'common.submit' | translate}}</button>
    </div>
</div>


<clr-modal [(clrModalOpen)]="isStyle" clrModalClosable="false">
    <h3 class="modal-title">New Packing Style</h3>
    <div class="modal-body">
      <div class="clr-row">
          <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label>Packing Style:</label>
              <input type="text" name="style" [(ngModel)]="style" required>
          </div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-primary" (click)="saveStyle()">{{'common.save' | translate}}</button>
      <button type="button" class="btn btn-danger" (click)="close('style')">{{'common.close' | translate}}</button>
    </div>
  </clr-modal>
