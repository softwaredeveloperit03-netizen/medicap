<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Chemical Master</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/rnd/master/chemical" style="background-color: red;color: white;"> CLOSE
            </button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #changeform="ngForm">
                <div class="clr-row">
                    <div class="clr-col-xl-4 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Chemical Name<span style="color: red;">*</span></label>
                        <input type="text" name="chemical_name" ngModel required>
                    </div>
                    <div class="clr-col-xl-4 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Molecular Weight<span style="color: red;">*</span></label>
                        <input type="text" name="molecular_wt" ngModel required>
                    </div>
                    <div class="clr-col-xl-4 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Pack Size<span style="color: red;">*</span></label>
                        <input type="text" name="pack_size" ngModel required>
                    </div>
                    <div class="clr-col-xl-4 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>CAS No<span style="color: red;">*</span></label>
                        <input type="text" name="cas_name" ngModel required>
                    </div>
                    <div class="clr-col-xl-4 clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Grade:<span style="color: red">*</span></label>
                        <select name="grade"  [(ngModel)]="grade" required>
                          <option> </option>
                           <option  *ngFor="let grade of grades" [ngValue]="grade.grade">
                            {{grade.grade}}
                          </option>
                        </select>
                    </div>  
                    <div class="clr-col-lg-12">
                        <form #makeform ="ngForm">
                            <table class="table">
                                <tr>
                                    <th>Sr.</th>
                                    <th style="text-align: left;">Make</th>
                                    <th>{{'common.table.action' | translate}}</th>
                                </tr>
                                <tr>
                                    <td>1.</td>
                                    <td style="padding: 0px;">
                                        <input type="text" name="make" ngModel required style="margin: 0px;height: 33px;">
                                    </td> 
                                    <td style="padding: 0px; vertical-align: middle;"><button class="btn btn-sm  btn-info" (click)="adddata(makeform)">{{'common.add' | translate}}</button></td>  
                                </tr>
                                <tr *ngFor="let me of productList;let i=index">
                                    <td>{{i+1}}</td>
                                    <td style="text-align: left;">{{me.make}}</td>
                                    <td><clr-icon shape="trash" class="is-error" (click)="delData(i)"></clr-icon></td>
                                </tr>
                            </table>
                        </form> 
                    </div>
                </div>
            </form>
          
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" type="button" (click)="save(changeform)">{{'common.save' | translate}}</button>
    </div>
</div>
