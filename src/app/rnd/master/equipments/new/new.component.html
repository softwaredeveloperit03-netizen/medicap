<div class="card">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Equipment Form</div>
      <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        <button class="btn btn-sm" routerLink="/rnd/master/equipments" style="background-color: red;color: white;">
          <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
        </button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <div class="card-text">
      <form #equipmentForm="ngForm">
        <div class="clr-row">
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Equipment Type:<span style="color: red">*</span></label>
            <select name="equipment_type" [(ngModel)]="equipment_type" (change)="getEquipmentNames()" required>
              <option>Vacuum Cleaner</option>
              <option>Balance</option>
              <option>LAF</option>
              <option>STABILITY CHEMBER</option>
              <option>General</option>
              <option>Other</option>
            </select>
          </div>
          <div class="clr-col-lg-8 clr-col-md-8 clr-col-sm-12 clr-col-xs-12">
            <label>Equipment Name:<span style="color: red">*</span></label>
            <select name="equipment_name" ngModel required>
              <option></option>
              <option *ngFor="let equipment of equipments">{{ equipment.equipment_name }}</option>
            </select>
          </div>
          <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Equipment Code:<span style="color: red">*</span></label>
            <input type="text" name="equipment_code" ngModel required>
          </div>
         
          <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Min. Capacity:</label>
            <input type="text" name="min_capacity" ngModel>
          </div>
         
          <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Max. Capacity:<span style="color: red">*</span></label>
            <input type="text" name="capacity" [(ngModel)]="capacity" required>
          </div>
          <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Unit:<span style="color: red">*</span></label>
            <select name="unit" [(ngModel)]="unit"  required>
              <option></option>
              <option *ngFor="let unit of units" >{{unit.unit}}</option>
            </select>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Make:</label>
            <input type="text" name="make" ngModel>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Type:</label>
            <select name="category" ngModel>
              <option>Fix</option>
              <option>Portable</option>
              <option>Movable</option>
            </select>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Department of Installation:<span style="color: red">*</span></label>
            <select name="department" (change)="getSections($event.target.selectedIndex)" ngModel required>
              <option></option>
              <option *ngFor="let department of departments">{{ department.department_name }}</option>
            </select>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Room Name:<span style="color: red">*</span></label>
            <select name="section" ngModel required>
              <option></option>
              <option *ngFor="let section of sections">{{ section.section_name }}</option>
            </select>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Model:</label>
            <input type="text" name="model" ngModel>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Purchase Date:</label>
            <input type="date" name="purchase_date" ngModel>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Installation Date:</label>
            <input type="date" name="installation_date" ngModel>
          </div>
        </div>
        <h3>Working Range:</h3>
        <div class="clr-row">
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label>From:<span style="color: red">*</span><br></label>
            <input type="text" name="from_range" ngModel required style="width: 80%;">
            <select name="from_range_uom" ngModel="Kg" required style="width: 20%;">
              <option>Kg</option>
              <option>Mg</option>
              <option>Gram</option>
            </select>
          </div>
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label>To:<span style="color: red">*</span><br></label>
            <input type="text" name="to_range" ngModel required style="width: 80%;">
            <select name="to_range_uom" ngModel="Kg" required style="width: 20%;">
              <option>Kg</option>
              <option>Mg</option>
              <option>Gram</option>
            </select>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Calibration Required:<span style="color: red">*</span></label>
            <select name="calibration" [(ngModel)]="calibration" required>
              <option>Yes</option>
              <option>No</option>
            </select>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12" *ngIf="calibration=='Yes'">
            <label>Calibration Frequency:<span style="color: red">*</span></label>
            <select name="calibration_frequency" ngModel required>
              <option>Daily</option>
              <option>Weekly</option>
              <option>Monthly</option>
              <option>Quaterly</option>
              <option>Yearly</option>
            </select>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12" *ngIf="calibration=='Yes' && equipment_type=='Balance'">
            <label>Split into:</label>
            <select name="split_into" [(ngModel)]="split_into" required (change)="checkWeights()">
              <option>3</option>
              <option>4</option>
              <option>5</option>
              <option>6</option>
            </select>
          </div>
          <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12" *ngIf="calibration == 'Yes' && equipment_type=='Balance'">
            <h3>Standard Weights Applicable:</h3>
            <table class="table">
              <tr>
                <th rowspan="2" style="vertical-align: middle;">Standard Weight</th>
                <th colspan="2">Acceptance Limit</th>
              </tr>
              <tr>
                <th>From</th>
                <th>To</th>
              </tr>
              <tr *ngFor="let weight of weights">
                <td style="padding: 0px;">
                  <input type="text" name="standard_weight{{i}}" [(ngModel)]="weight['standard_weight']" style="margin: 0px; height: 33px;">
                </td>
                <td style="padding: 0px;">
                  <input type="text" name="limit_from{{i}}" [(ngModel)]="weight['limit_from']" style="margin: 0px; height: 33px;">
                </td>
                <td style="padding: 0px;">
                  <input type="text" name="limit_to{{i}}" [(ngModel)]="weight['limit_to']" style="margin: 0px; height: 33px;">
                </td>
              </tr>
            </table>
          </div>
        </div>
      </form>
    </div>
  </div>
  <div class="card-footer">
    <button class="btn btn-primary" (click)="saveEquipment(equipmentForm)">{{'common.save' | translate}}</button>
  </div>
</div>
