<div class="card" *ngIf="!isNew">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-8" style="color: aliceblue;margin-top: -2px;text-align: left;">Equipment Name List</div>
          <div class="clr-col-lg-4" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-success" (click)="isNew = true" *ngIf="isuser == 'Yes'" style="background-color: rgb(4, 68, 36);color: white;">ADD NEW EQUIPMENT</button>
            <button class="btn btn-sm" routerLink="/rnd/master/equipments" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
    <div class="card-block">
        <div class="card-text">
            <table class="table">
                <tr>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr.</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Equipment Type</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Equipment Name</th>
                </tr>
                <tr *ngFor="let result of results; let i = index">
                    <td style="text-align: left;">{{ i + 1 }}.</td>
                    <td style="text-align: left;">{{ result.equipment_type }}</td>
                    <td style="text-align:left;">{{ result.equipment_name }}</td>
                </tr>
            </table>
        </div>
    </div>
</div>

<div class="card" *ngIf="isNew">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">
          Add New Equipment Name to List
        </div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" (click)="isNew=false" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #equipmentForm="ngForm">
          <div class="clr-row">
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Equipment Type:</label>
              <select name="equipment_type" ngModel required>
                <option>Vacuum Cleaner</option>
                <option>Balance</option>
                <option>LAF</option>
                <option>STABILITY CHEMBER</option>
                <option>General</option>
                <option>Other</option>
              </select>
            </div>
            <div class="clr-col-lg-4 clr-col-md-8 clr-col-sm-12 clr-col-xs-12">
              <label>Equipment Name:</label>
              <input type="text" name="equipment_name" ngModel required>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="save(equipmentForm)">{{'common.save' | translate}}</button>
      <button class="btn btn-danger" (click)="isNew = false">{{'common.close' | translate}}</button>
    </div>
  </div>
