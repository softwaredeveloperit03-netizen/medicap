<div *ngIf="!isView">Loading Data...</div>
<div class="card" *ngIf="isView">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Update Equipment</div>
      <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        <button class="btn btn-sm" routerLink="/rnd/master/equipments/log" style="background-color: red;color: white;">
          <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
        </button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <div class="card-text">
      <form #equipmentForm="ngForm">
        <div class="clr-row">
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Equipment Type:</label>
            <select name="equipment_type" [(ngModel)]="equipment_type" (change)="getEquipmentNames()" required>
              <option>Vaccume Cleaner</option>
              <option>Balance</option>
              <option>LAF</option>
              <option>General</option>
              <option>Other</option>
            </select>
          </div>
          <div class="clr-col-lg-8 clr-col-md-8 clr-col-sm-12 clr-col-xs-12">
            <label>Equipment Name:</label>
            <select name="equipment_name" [(ngModel)]="result['equipment_name']" required>
              <option></option>
              <option *ngFor="let equipment of equipments">{{ equipment.equipment_name }}</option>
            </select>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Equipment Code:</label>
            <input type="text" name="equipment_code" [(ngModel)]="result['equipment_code']" required>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Min. Capacity:</label>
            <input type="text" name="min_capacity" [(ngModel)]="result['min_capacity']" required>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Capacity:</label>
            <input type="text" name="capacity" [(ngModel)]="result['capacity']" required>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Make:</label>
            <input type="text" name="make" [(ngModel)]="result['make']" required>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Type:</label>
            <select name="category" [(ngModel)]="result['category']" required>
              <option>Fix</option>
              <option>Portable</option>
              <option>Movable</option>
            </select>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Department of Installation:</label>
            <select name="department" (change)="getSections($event.target.selectedIndex)" [(ngModel)]="department" required>
              <option></option>
              <option *ngFor="let department of departments">{{ department.department_name }}</option>
            </select>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Room Name:</label>
            <select name="section" [(ngModel)]="section">
              <option></option>
              <option *ngFor="let section of sections">{{ section.section_name }}</option>
            </select>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Model:</label>
            <input type="text" name="model" [(ngModel)]="result['model']" required>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Purchase Date:</label>
            <input type="date" name="purchase_date" [(ngModel)]="result['purchase_date']" required>
          </div>
          <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Installation Date:</label>
            <input type="date" name="installation_date" [(ngModel)]="result['installation_date']" required>
          </div>
        </div>
      </form>
    </div>
  </div>
  <div class="card-footer">
    <button class="btn btn-primary" (click)="saveEquipment(equipmentForm)">{{'common.update' | translate}}</button>
  </div>
</div>
