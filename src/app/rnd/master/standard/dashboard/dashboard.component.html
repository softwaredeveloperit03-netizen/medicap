<div class="card">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Standard Master</div>
      <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        <button class="btn btn-sm btn-success" routerLink="new"  *ngIf="isuser == 'Yes'">NEW STANDARD</button>
        <button class="btn btn-sm btn-danger" routerLink="/rnd/master">{{'common.close' | translate}}</button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <div class="card-text">
      <table class="table">
        <tr>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr</th>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Material Type</th>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Material Name</th>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Material Subtype</th>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Standard</th>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Grade</th>
      <!--     <th>{{'common.status' | translate}}</th> -->
        </tr>
        <tr *ngFor="let standard of standards; let i = index">
          <td>{{ i+1 }}.</td>
          <td style="text-align: left;">{{ standard.material_type }}</td>
          <td style="text-align: left;">{{ standard.material_name }}</td>
          <td style="text-align: left;">{{ standard.material_subtype }}</td>
          <td style="text-align: left;">{{ standard.standard }}</td>

          <td>{{ standard.grade }}</td>
          <!-- <td>{{ standard.status }}</td> -->
        </tr>
      </table>
    </div>
  </div>
  <div class="card-footer">  
      <button class="btn  btn-info" (click)="download()">{{'common.download' | translate}}</button>
  </div>
</div>
