<div class="container-fluid">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Reagents/Indicator Form</div>
              <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/rnd/master/indicator" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
              </div>
            </div>
          </div>
        <div class="card-block">
            <div class="card-text">
                <form #regents="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Indicator:<span style="color: red;">*</span></label>
                            <input type="text" name="indicator" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Acid Color:<span style="color: red;">*</span></label>
                            <input type="text" name="acid_color" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Base Color:<span style="color: red;">*</span></label>
                            <input type="text" name="base_color" ngModel required>
                        </div>
                        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                            <label>Ph Range:<span style="color: red;">*</span></label>
                            <input type="text" name="ph_range" ngModel required>
                        </div>
                        <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                            <label>Pka:<span style="color: red;">*</span></label>
                            <input type="text" name="pka" ngModel required>
                        </div>
                    </div>
                </form>    
            </div>
        </div>
       <div class="card-footer">
         <button class="btn btn-primary"(click)="save(regents)">{{'common.save' | translate}}</button>
    </div>
</div>
