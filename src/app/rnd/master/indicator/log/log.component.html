<div class="card">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Regents/Indicator Log</div>
      <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        <button class="btn btn-sm" routerLink="/rnd/master/indicator" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
      </div>
    </div>
  </div>
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
      </div>
    </div>
  <div class="card-block">
    <div class="card-text">
      <table class="table">
        <tr>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr</th>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">indicator</th>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Acid Color</th>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">base Color</th>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Ph Range</th>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Pka</th><!-- 
          <th style="text-align: left;">{{'common.status' | translate}}</th> -->
        </tr>
        <tr *ngFor="let result of results; let i = index">
          <td style="text-align: left;">{{ i+1 }}.</td>
          <td style="text-align: left;">{{ result.indicator}}</td>
          <td style="text-align: left;">{{ result.acid_color}}</td>
          <td style="text-align: left;">{{ result.base_color}}</td>
          <td style="text-align: left;">{{ result.ph_range}}</td>
          <td style="text-align: left;">{{ result.pka}}</td><!-- 
          <td style="text-align: left;">{{ result.status}}</td> -->
        </tr>
        <tr *ngIf="results?.length == 0">
          <td colspan="7">{{'common.noRecords' | translate}}</td>
        </tr>
      </table>
    </div>
  </div>
  <div class="card-footer"><button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button></div>
</div>
