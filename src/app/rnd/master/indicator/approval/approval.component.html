<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Regents/Indicator Approval</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/rnd/master/indicator" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
          </div>
        </div>
      </div>
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          </div>
        </div>
      <div class="card-block">
        <div class="card-text">
          <table class="table">
            <tr>
              <th>Sr</th>
              <th style="text-align: left;">indicator</th>
              <th style="text-align: left;">Acid Color</th>
              <th style="text-align: left;">base Color</th>
              <th style="text-align: left;">Ph Range</th>
              <th style="text-align: left;">Pka</th>
              <th style="text-align: left;">{{'common.status' | translate}}</th>
            </tr>
            <tr *ngFor="let result of results; let i = index">
              <td>{{ i+1 }}.</td>
              <td style="text-align: left;">{{ result.indicator}}</td>
              <td style="text-align: left;">{{ result.acid_color}}</td>
              <td style="text-align: left;">{{ result.base_color}}</td>
              <td style="text-align: left;">{{ result.ph_range}}</td>
              <td style="text-align: left;">{{ result.pka}}</td>
              <td style="text-align: left;"><button class=" btn-sm btn btn-primary" (click)="action(result.id,'approve')">{{'common.approve' | translate}}</button>
              <button class="btn-sm btn btn-danger" (click)="action(result.id,'reject')">{{'common.reject' | translate}}</button></td>
            </tr>
          </table>
        </div>
      </div>
    </div>
  </div>
