            <div routerLink="/rnd/store/raw" class="name-board2"><i class="fas fa-times"></i>
            </div>
          </div>

          <div class="main-section" style="margin: 0px 10px 10px 10px !important;"><!-- Repeate this container -->

                </div>
              </div>
              <div class="block-container" style="    
              display: grid;
              grid-template-columns: repeat(6, 150px);
              grid-gap: 35px;
              overflow-x: auto;
              max-width: 100%;">

                  <i class="fas fa-hourglass-start"></i>
                  <span>Awaiting</span>
                </div>
                
                <div class="item-block" routerLink="approval" *ngIf="ischecker == 'Yes'">
                  <i class="fas fa-check"></i>
                  <span>Checking</span>
                </div>
                
                <div class="item-block" routerLink="log">
                  <i class="fas fa-book"></i>
                  <span>Log Book</span>
                </div>
                

              </div>
            </div>
          </div>
          <!-- section1 -->
  
  
        </div>
      </div>
