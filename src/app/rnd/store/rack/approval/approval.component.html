<div class="container-fluid" *ngIf="!isView">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Rack of Approval</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/rnd/store/rack" style="background-color: red;color: white;">
            CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <table class="table">
          <tr>
            <th>Sr.</th>
            <th>Room Name</th>
            <th>Rack No.</th>
            <th>Rack Name</th>
            <th>Capacity</th>
            <th>{{'common.table.action' | translate}}</th>
          </tr>
          <tr *ngFor="let result of results; let i = index">
            <td>{{ i+1 }}</td>
            <td>{{result.section_name}}</td>
            <td>{{result.rack_no}}</td>
            <td>{{result.rack_name}}</td>
            <td>{{result.capacity}} {{result.unit}}</td>
            <td>
              <button class="btn btn-sm btn-info" (click)="view(i)">{{'common.view' | translate}}</button>
            </td>
          </tr>
          <tr *ngIf="results?.length == 0">
            <td colspan="7">{{'common.noRecords' | translate}}</td>
          </tr>
        </table>
      </div>
    </div>
  </div>
</div>
  

<div class="container-fluid" *ngIf="isView">
    <div class="card">
      <div class="card-header">Rack of Approval</div>
      <div class="card-block">
        <div class="card-text">
            <div class="card-block">
                <div class="card-text">
                    <form #rackForm="ngForm">
                        <div class="clr-row">
                            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                <label>Room Name:</label>
                                <input type="text" name="section" ngModel="{{ selectedRack['section_name'] }}" readonly>
                            </div>
                            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                <label>Rack Name:</label>
                                <input type="text" name="rack_name" ngModel="{{ selectedRack['rack_name'] }}" readonly>
                            </div>
                            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                <label>Capacity:</label>
                                <input type="text" name="capacity" ngModel="{{ selectedRack['capacity'] }} " readonly>
                            </div>
                            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                                <label>Unit:</label>
                                <input type="text" name="unit" ngModel="{{ selectedRack['unit'] }} " readonly>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="updateRack('approve')">{{'common.approve' | translate}}</button>
        <button class="btn btn-danger" (click)="updateRack('reject')">{{'common.reject' | translate}}</button>
        <button class="btn btn-danger" (click)="isView = false">{{'common.close' | translate}}</button>
      </div>
    </div>
</div>
