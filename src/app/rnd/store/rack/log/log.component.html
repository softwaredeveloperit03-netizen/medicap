<div class="container-fluid" *ngIf="!isView">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Racks List</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/rnd/store/rack" style="background-color: red;color: white;">
              CLOSE
            </button>
          </div>
        </div>
      </div>
      <div class="card-block">
          <div class="card-text">
            <table class="table">
              <tr>
                <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr.</th>
                <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Room Name</th>
                <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Rack No.</th>
                <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Rack Name</th>
                <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Capacity</th>
              </tr>
              <tr *ngFor="let result of results; let i = index">
                <td style="text-align: left;">{{ i+1 }}</td>
                <td style="text-align: left;">{{result.section_name}}</td>
                <td style="text-align: left;">{{result.rack_no}}</td>
                <td style="text-align: left;">{{result.rack_name}}</td>
                <td style="text-align: left;">{{result.capacity}} {{result.unit}}</td>
              </tr>
              <tr *ngIf="results?.length == 0">
                <td colspan="7">{{'common.noRecords' | translate}}</td>
              </tr>
              <tr *ngIf="results?.length == 0">
                <td colspan="7"><button>{{'common.download' | translate}}</button></td>
              </tr>
            </table>
          </div>
        </div>
    </div>
</div>
