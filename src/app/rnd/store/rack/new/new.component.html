<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Rack</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm btn-danger" routerLink="/rnd/store/rack">{{'common.close' | translate}}</button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <form #rackForm="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Room Name:</label>
                        <select name="section" style="margin-top:8px;" ngModel required>
                            <option></option>
                            <option *ngFor="let section of sections;" value="{{section.section_code}}">{{ section.section_name }}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Rack Name:</label>
                        <input type="text" name="rack_name" ngModel required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Capacity:</label>
                        <input type="text" name="capacity" ngModel required>
                    </div>
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label>Unit:</label>
                        <select name="unit" style="margin-top:8px;" ngModel required>
                            <option></option>
                            <option *ngFor="let unit of units" [value]="unit.unit">{{ unit.unit }}</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="saveRack(rackForm)">{{'common.save' | translate}}</button>
    </div>
</div>
