<div class="container-fluid"  >
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-3" style="color: aliceblue;margin-top: -2px;text-align: left;">Stability Study</div>
              <div class="clr-col-lg-9" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <!-- <button class="btn btn-sm btn-info" routerLink="new" style="background-color: green;color: white;">Initiate New Stability Study</button> -->
                <!-- <button class="btn btn-sm btn-info" routerLink="batch" style="background-color: green;color: white;">Stability From Production Batch</button> -->
                <button class="btn btn-sm" routerLink="/rnd/qa/stability" style="background-color: red;color: white;">{{'common.close' | translate}}</button>
              </div>
            </div>
        </div>
        <div class="card-block">
            <div class="card-text">
                <table class="table table-border">
                    <tr>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Stability No.</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Dosage Form</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Product</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">No. of Batches</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Date of Initiate</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Initated By</th>
                        <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">View Protocol</th>
                    </tr>
                    <tr >
                        <td style="text-align: left;">{{ i + 1 }}</td>
                        <td style="text-align: left;">{{ result.dosage_form }}</td>
                        <td style="text-align: left;">{{ result.product_name }}</td>
                        <td style="text-align: left;">{{ result.batches.length }}</td>
                        <td style="text-align: left;">{{ result.entry_date | date: 'dd/MM/yyyy' }}</td>
                        <td style="text-align: left;">{{ result.entry_by }}</td>
                        <td>
                            <button class="btn btn-sm btn-info" >view Protocol</button>
                        </td>
                    </tr>
                    <!-- <tr *ngIf="results?.length == 0">
                        <td colspan="7">{{'common.noRecords' | translate}}</td>
                    </tr> -->
                </table>
            </div>
        </div>
    </div>
</div>
