<div class="container">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Incident</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/rnd/qa/incident" style="background-color: red;color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #FormData="ngForm">
          <div class="clr-row">
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Incident Related To:<span style="color: red">*</span></strong></label>
              <select name="related_to" ngModel required>
                <option value="Process">Process</option>
                <option value="Procedure">Procedure</option>
                <option value="Document">Document</option>
                <option value="Typographical Mistake">Typographical Mistake</option>
              </select>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Incident Category:<span style="color: red">*</span></strong></label>
              <select name="category" ngModel required>
                <option value="Planned Incident">Planned Incident</option>
                <option value="Unplanned Incident">Unplanned Incident</option>
              </select>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Type Of Incident:<span style="color: red">*</span></strong></label>
              <select name="type" ngModel required>
                <option value="Minor">Minor</option>
                <option value="Major">Major</option>
                <option value="Critical">Critical</option>
              </select>
            </div>
            <!-- <div class="clr-col-md-3 clr-col-12">
              <label><strong>Date Of Deviation</strong></label>
              <input ngModel name="deviation_date" type="date">
            </div> -->
            <div class="clr-col-12">
              <label><strong>Justification for type:</strong></label>
              <textarea ngModel name="justification"></textarea>
            </div>
            <div class="clr-col-12">
              <label><strong>Cause of Incident:</strong></label>
              <textarea ngModel name="cause"></textarea>
            </div>
            <div class="clr-col-12">
              <label><strong>Description of Incident:</strong></label>
              <textarea ngModel name="description"></textarea>
            </div>
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Affecting Product / Material:</strong></label>
              <select [(ngModel)]="affecting_product" name="affecting_product">
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </div>
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Affecting Equipment</strong></label>
              <select [(ngModel)]="affecting_equipment" name="affecting_equipment">
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </div>
          </div>
          <div class="clr-row" *ngIf="affecting_product == 'yes'">
            <div class="clr-col-md-4 clr-col-12">
              <label><strong>Name of Product:<span style="color: red">*</span></strong></label>
              <input ngModel type="text" name="product_code" required>
            </div>
            <div class="clr-col-md-2 clr-col-12">
              <label><strong>Medicap Lot No:<span style="color: red">*</span></strong></label>
              <input ngModel type="text" name="batch_no" required>
            </div>
            <div class="clr-col-md-3 clr-col-12">
              <label><strong>Mfg. Date:<span style="color: red">*</span></strong></label>
              <input ngModel type="date" name="mfg_date" required>
            </div>
            <div class="clr-col-md-3 clr-col-12">
              <label><strong>Exp. Date:<span style="color: red">*</span></strong></label>
              <input ngModel type="date" name="exp_date" required>
            </div>
          </div>
          <div class="clr-row" *ngIf="affecting_equipment == 'yes'">
            <div class="clr-col-md-4 clr-col-12">
              <label><strong>Name of Equipment:<span style="color: red">*</span></strong></label>
              <input ngModel type="text" name="equipment_name" required>
            </div>
          </div>
          <div class="clr-row">
            <div class="clr-col-md-12 clr-col-12">
              <fieldset style="border: solid 1px #a8a8a8;">
                <legend style="width:auto; margin-bottom: 0px; font-size: 12px; font-weight: bold; color: #1f497d;">Cross Functional Departments Remark</legend>
                <div class="clr-row" style="padding-left: 15px;">
                  <div class="clr-control-container clr-control-inline">
                    <div class="clr-checkbox-wrapper" *ngFor="let order of departments; let i = index">
                        <input class="clr-checkbox" id="{{order.department_name}}" type="checkbox" name="{{order.department_name}}" [(ngModel)]="order.value" (change)="updateDept($event.target.checked, i)">
                        <label for="{{order.department_name}}" class="clr-control-label">{{order.department_name}}</label>
                    </div>
                  </div>
                </div>
              </fieldset>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer" style="text-align: right;">
      <button class="btn btn-primary" [disabled]="FormData.invalid" (click)="saveUserForm(FormData)">{{'common.submit' | translate}}</button>
      <button class="btn btn-warning" (click)="close()">{{'common.close' | translate}}</button>
    </div>
  </div>
</div>
