<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Material Entry Form</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/rnd/qa/master/material" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
      <div class="card-block">
        <div class="card-text">
            <form #materialForm="ngForm">
              <div class="clr-row">
                <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <label>Material Type:<span style="color: red">*</span></label>
                    <select name="material_type" [(ngModel)]="material_type" (change)="checkMaterialType($event.target.value)" required>
                      <option>Raw Material</option>
                      <option>Packing Material</option>
                    </select>
                </div>
                <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12" *ngIf="isRawMaterial">
                    <label>Material subtype:<span style="color: red">*</span></label>
                    <select name="material_subtype" ngModel="API" required>
                      <option>API</option>
                      <option>Excipient</option>
                      <option>Liquid</option>
                      <option>SOLVENTS</option>
                      <option>COLOUR</option>
                      <option>FLAVOUR</option>
                      <option>READY COAT SOLUTION</option>
                    </select>
                </div>
                <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12" *ngIf="isPackingMaterial">
                    <label>Material subtype:<span style="color: red">*</span></label>
                    <select name="material_subtype" ngModel required>
                      <option>Primary</option>
                      <option>Secondary</option>
                      <option>Tertiary</option>
                    </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12" *ngIf="material_type == 'Packing Material'">
                  <label>Category:<span style="color: red">*</span></label>
                  <select name="isprinted" [(ngModel)]="isprinted" required>
                    <option>Printed Foil</option>
                    <option>Base Foil</option>
                    <option>PVC</option>
                    <option>PLAIN FOIL</option>
                    <option>BOTTLE</option>
                    <option>CARTON</option>
                    <option>LABELS</option>
                    <option>SHRINK</option>
                    <option>CORRUGATED BOX</option>
                    <option>STRAPPING ROLL</option>
                    <option>CAP</option>
                    <option>MEASURING CUP</option>
                    <option>DROPPER</option>
                    <option>INSERTS</option>
                    <option>BARCODE</option>
                  </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12" *ngIf="material_type == 'Packing Material' && isprinted =='Printed Foil'">
                  <label>For Product:<span style="color: red">*</span></label>
                  <select name="for_product" [(ngModel)]="for_product" required>
                    <option>Yes</option>
                    <option>No</option>
                  </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12" *ngIf="material_type == 'Packing Material' && isprinted =='Printed Foil' && for_product=='Yes'">
                  <label>Product Name:<span style="color: red">*</span></label>
                  <select name="product_code" ngModel required>
                    <option></option>
                    <option *ngFor="let product of products" [value]="product.product_code">{{ product.product_name }} - {{ product.grade }}</option>
                  </select>
                </div>
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                  <label>Material Name:<span style="color: red">*</span></label>
                  <input type="text" name="material_name" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                  <label>Minimum Order Qty:<span style="color: red">*</span> </label>
                  <input type="text" name="order_qty" ngModel required>
                </div>
                <div class="clr-col-lg-8 clr-col-md-8 clr-col-sm-12 clr-col-xs-12" *ngIf="isRawMaterial">
                  <label>CAS Name: </label>
                  <input type="text" name="cas_name" ngModel>
                </div>
                <div class="clr-col-lg-8 clr-col-md-6 clr-col-sm-12 clr-col-xs-12" *ngIf="isRawMaterial">
                  <label>IUPAC Name: </label>
                  <input type="text" name="upac_name" ngModel>
                </div>
                <div class="clr-col-lg-4 clr-col-md-6 clr-col-sm-12 clr-col-xs-12" *ngIf="isRawMaterial">
                  <label>Grade:<span style="color: red">*</span></label>
                  <select name="grade" ngModel required>
                    <option></option>
                    <option>IP</option>
                    <option>EP</option>
                    <option>BP</option>
                    <option>USP</option>
                    <option>IHS</option>
                    <option>JP</option>
                    <option>CP</option>
                    <option>Commercial</option>
                    <option>Analytical</option>
                  </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-6 clr-col-sm-12 clr-col-xs-12" *ngIf="isRawMaterial">
                  <label>Special Grade:</label>
                  <select name="special_grade" ngModel>
                    <option></option>
                    <option>Injectable</option>
                    <option>Ordinary</option>
                    <option>Steroid</option>
                    <option>Compacted</option>
                    <option>Micronized</option>
                  </select>
                </div>
                
                <div class="clr-col-lg-4 clr-col-md-6 clr-col-sm-12 clr-col-xs-12" *ngIf="isRawMaterial">
                  <label>Nature of Material:</label>
                  <select name="material_nature" ngModel>
                    <option>SOLID</option>
                    <option>LIQUID</option>
                    <option>SEMI-SOLID</option>
                    <option>GAS</option>
                  </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-6 clr-col-sm-12 clr-col-xs-12" *ngIf="isRawMaterial">
                  <label>Minimum Inventory Level: </label>
                  <input type="text" name="inventory" ngModel>
                </div>
                <div class="clr-col-lg-4 clr-col-md-6 clr-col-sm-12 clr-col-xs-12" *ngIf="isRawMaterial">
                  <label>Category: </label>
                  <input type="text" name="category" ngModel>
                </div>
                <div class="clr-col-lg-4 clr-col-md-6 clr-col-sm-12 clr-col-xs-12" *ngIf="isRawMaterial">
                  <label>Unit of Measurement: </label>
                  <select name="unit" ngModel>
                    <option></option>
                    <option *ngFor="let unit of units">{{ unit.unit }}</option>
                </select>
                </div>
                <!-- HSN Code (hidden)
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>HSN Code:</label>
                    <input type="text" name="hsn" ngModel>
                </div>
                -->
                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                  <label>GST:</label>
                  <select name="gst" ngModel="0">
                    <option>0</option>
                    <option>5</option>
                    <option>12</option>
                    <option>18</option>
                    <option>28</option>
                  </select>
                </div>
                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-6 clr-col-xs-12">
                  <label>Storage Location:</label>
                  <input type="text" name="location" ngModel>
                </div>
                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-6 clr-col-xs-12">
                  <label>Storage Condition:</label>
                  <select name="storage_condition" [(ngModel)]="storage_condition">
                    <option value="">Select</option>
                    <option value="NA">NA</option>
                    <option *ngFor="let item of storage_conditions" [value]="item.storage_condition">
                      {{ item.storage_display_name || item.storage_condition }}
                    </option>
                  </select>
                  <small *ngIf="storage_conditions.length === 0" style="color:#b45309;">
                    No storage conditions in master. Add them under Master → Quality Assurance → Storage Condition.
                  </small>
                </div>
                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-6 clr-col-xs-12" *ngIf="isRawMaterial">
                  <label>Therapeutic:</label>
                  <input type="text" name="thera" ngModel required>
                </div>
                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-6 clr-col-xs-12">
                  <label>Shelf Life: (Months)<span style="color: red">*</span></label>
                  <!-- <input type="text" name="Shelf_life" ngModel required> -->
                  <select name="shelf_life" ngModel required>
                    <option value="12">12 Month</option>
                    <option value="18">18 Month</option>
                    <option value="24">24 Month</option>
                    <option value="36">36 Month</option>
                    <option value="48">48 Month</option>
                    <option value="60">60 Month</option>
                  </select>
                </div>  
                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-6 clr-col-xs-12">
                  <label>Minimum Shelf Life: (Months)<span style="color: red">*</span></label>
                  <select name="min_shelf" ngModel required>
                    <option value="12">12 Month</option>
                    <option value="18">18 Month</option>
                    <option value="24">24 Month</option>
                    <option value="36">36 Month</option>
                    <option value="48">48 Month</option>
                    <option value="60">60 Month</option>
                  </select>
                </div>
                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-6 clr-col-xs-12">
                  <label>Retest: (Months)</label>
                  <select name="retest" ngModel>
                    <option value="12">12 Month</option>
                    <option value="18">18 Month</option>
                    <option value="24">24 Month</option>
                    <option value="36">36 Month</option>
                    <option value="48">48 Month</option>
                  </select>
                </div>
                <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-6 clr-col-xs-12">
                  <label>QC Lead Time (days):</label>
                  <input type="text" name="lead_time" ngModel required>
                </div>
                
              </div>
            </form>
            <form #materialadd="ngForm" *ngIf="isRawMaterial">
                <table class="table">
                    <tr>
                        <th>Equivalent To </th>
                        <th>Factor</th>
                        <th>Add</th>
                    </tr>
                    <tr>
                        <td style="padding:0px;">
                          <input type="text" name="material_name" ngModel required style="margin:0px;height: 33px;">
                        </td>
                        <td style="padding:0px;">
                            <input type="text" name="factor" ngModel required style="margin:0px;height: 33px;">
                        </td>
                        <td style="padding:0px; vertical-align:left;">
                          <button class="btn btn-sm btn-info" (click)="addEquivalent(materialadd)"> ADD </button>
                        </td>
                    </tr>
                    <tr *ngFor="let list of materialList; let j = index">
                      <td style="text-align: left;">{{ list.material_name }}</td>
                      <td style="text-align: left;">{{ list.factor }}</td>
                      <td>
                        <clr-icon shape="trash" class="is-error" (click)="del(j)"></clr-icon>
                      </td>
                    </tr>
                </table>
            </form>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="addMaterial(materialForm)">{{'common.save' | translate}}</button>
      </div>
    </div>
  </div>
