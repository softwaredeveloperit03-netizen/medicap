<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Product Entry Form</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/rnd/qa/master/product" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #productForm="ngForm">
            <div class="clr-row">
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                    <label>Item/Generic Name:<span style="color: red">*</span></label>
                    <textarea rows="2" name="generic_name" ngModel required></textarea>
                </div>
                <div class="clr-col-lg-8 clr-col-md-8 clr-col-sm-12 clr-col-xs-12">
                    <label>Brand Name:<span style="color: red">*</span></label>
                    <input type="text" name="product_name" ngModel required>
                </div>
                <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                    <label>Grade:<span style="color: red">*</span></label>
                    <select name="grade" ngModel required>
                        <option></option>
                        <option *ngFor="let grade of grades">{{ grade.grade }}</option>
                    </select>
                </div>
                <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                    <label>Manufactured Under:<span style="color: red">*</span> </label>
                    <select name="manufactured_under" [(ngModel)]="manufactured_under" required>
                    <option></option>
                    <option>Contract Mfg.</option>
                    <option>LL</option>
                    <option>Self</option>
                    </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12" *ngIf="manufactured_under == 'LL' || manufactured_under == 'Contract Mfg.'">
                    <label>Manufactured For Client:<span style="color: red">*</span></label>
                    <select name="manufactured_for" ngModel required>
                    <option></option>
                    <option *ngFor="let client of clients">{{ client.company }}</option>
                    </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Type of Dose:<span style="color: red">*</span></label>
                    <select name="dosage_type" ngModel (change)="getDosages($event.target.value)" required>
                    <option>LIQUID</option>
                    <option>SEMI SOLID</option>
                    <option>SOLID</option>
                    </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Product Type:<span style="color: red">*</span></label>
                    <select name="dosage_form" ngModel required>
                    <option></option>
                    <option *ngFor="let dosage of dosages">{{ dosage.dosage_form }}</option>
                    </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Packing Style:</label>
                    <input type="text" name="packing_style" ngModel>
                </div>
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                    <label>Label Claim:<span style="color: red">*</span></label>
                    <textarea rows="2" name="label_claim" ngModel required></textarea>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12 remove-side-arrow-container">
                    <label>Minimum Shelf Life: (Months)<span style="color: red">*</span></label>
                    <input type="number" name="min_shelf" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12 remove-side-arrow-container">
                    <label>Shelf Life: (Months)<span style="color: red">*</span></label>
                    <input type="number" name="shelf_life" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12 remove-side-arrow-container">
                    <label>Approximate Testing Time:</label>
                    <input type="number" name="testing_time" ngModel>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12 remove-side-arrow-container">
                    <label>Retest After(Months):</label>
                    <input type="number" name="retest_period" ngModel>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Therapetic Category:</label>
                    <input type="text" name="thera" ngModel>
                </div>
                <!-- <div class="clr-col-lg-4 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                    <label>Category:</label>
                    <input type="text" name="category" ngModel>
                </div> -->
                <!-- <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12">
                    <label>Division:<span style="color: red">*</span></label>
                    <select name="division" ngModel required>
                        <option></option>
                        <option>Betaceum</option>
                        <option>Cefazolin</option>
                        <option>General</option>
                    </select>
                </div> -->
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label> Storage Condition:</label>
                    <input type="text" name="storage_condition" ngModel>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label> Product Apperance:</label>
                    <input type="text" name="apperance" ngModel>
                </div>
            </div>
            <h4>Accounting Details:</h4>
            <div class="clr-row">
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Mfg.Lic.no:</label>
                    <input type="text" name="mfg_lic" ngModel>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>HSN/SAC CODE:</label>
                    <input type="text" name="hsn" ngModel>
                </div>
                <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                    <label>GTIN:</label>
                    <input type="text" name="gtin" ngModel>
                </div>
                <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                    <label>MRP:</label>
                    <input type="text" name="mrp" ngModel>
                </div>
                <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12">
                    <label>GST:</label>
                    <select name="gst" ngModel>
                        <option></option>
                        <option>0</option>
                        <option>5</option>
                        <option>12</option>
                        <option>18</option>
                        <option>28</option>
                    </select>
                </div>
            </div>
            <h4>Documents:</h4>
            <div class="clr-row">
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Product License:</label>
                    <input type="file" (change)="onFileChanged1($event)" name="product_lic" ngModel accept="application/pdf">
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>FSC:</label>
                    <input type="file" (change)="onFileChanged2($event)" name="fsc" ngModel accept="application/pdf">
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>COPP:</label>
                    <input type="file" (change)="onFileChanged3($event)" name="copp" ngModel accept="application/pdf">
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Artwork:</label>
                    <input type="file" (change)="onFileChanged4($event)" name="artwork" ngModel accept="application/pdf">
                </div>
            </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button type="button" class="btn btn-primary" (click)="save(productForm)">{{'common.submit' | translate}}</button>
    </div>
</div>
