<div class="card" *ngIf="!isView"> 
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-lg-4" style="color: aliceblue;margin-top: -2px;text-align: left;">Plan From Marketing Po</div>
        <div class="clr-col-lg-8" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-danger" routerLink="/planning/production">CLOSE</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <table class="table" >
            <tr>
                <th style="text-align:left">Sr.</th>
                <th style="text-align:left">Order No</th>
                <th style="text-align:left">Product Name</th>
                <th style="text-align:left">Product Code</th>
                <th style="text-align:left">Dosage Form</th>
                <th style="text-align:left">Plan For Market</th>
                <th style="text-align:left">Proceed</th>
              
             </tr>
            <tr *ngFor='let pending of results;let i=index'>
                <td style="text-align:left">{{i + 1}}.</td>
                <td style="text-align:left">{{pending.order_no}}</td>
                <td style="text-align:left">{{pending.product_name}}</td>
                <td style="text-align:left">{{pending.product_code}}</td>
                <td style="text-align:left">{{pending.dosage_form}}</td>
                <td style="text-align:left">{{pending.plan_for_market}}</td>
                <td style="text-align:left">
                    <button class="btn btn-sm btn-success" (click)="transfer(pending)">Procced</button>
                </td>
            </tr>
            <tr *ngIf="pendingpo?.length == 0">
                <td colspan="8">No Records Found!</td>
            </tr>
        </table>
      </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-sm btn-danger" routerLink="/planning/production">CLOSE</button>
    </div>
  </div>
