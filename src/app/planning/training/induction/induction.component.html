<div class="container-fluid">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
              <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Induction Training </div>
              <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm" routerLink="/admin/training" style="background-color: red;color: white;">CLOSE</button>
              </div>
            </div>
        </div>
      <div class="card-block">
        <div class="card-text">
            <button class="btn btn-sm btn-info" (click)="downloadreport()">Download Log</button>
            <table class="table table-border">
                <tr>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr.</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Employee</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Learning</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Equipment Seen</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Training Start Date</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Training End Date</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">status</th>
                </tr>

                <tr *ngFor="let user of trainings; let i = index">
                    <td style="text-align: left;">{{ i + 1 }}.</td>
                    <td style="text-align: left;">{{user.emp_name}}</td>
                    <td style="text-align: left;">{{user.learning}}</td>
                    <td style="text-align: left;">{{user.equipmentseen}}</td>
                    <td style="text-align: left;">{{user.trainingfrom | date: 'dd-MM-yyyy'}}</td>
                    <td style="text-align: left;">{{user.trainingto | date: 'dd-MM-yyyy'}}</td>
                    <td *ngIf="user.status == 'pending'">
                        <button class="btn btn-sm btn-primary-outline" (click)="approveTraining(user.id)">Approve</button>
                    </td>
                    <td *ngIf="user.status !== 'pending'">
                        {{user.status}}
                    </td>
                </tr>
            </table>
        </div>
      </div>
    </div>
  </div>
