<div class="wo-hub-shell">
  <div class="wo-hub-tabs">
    <button type="button" class="btn btn-sm"
      [ngClass]="activeTab === 'confirm-indent' ? 'btn-primary' : 'btn-outline-primary'"
      (click)="navigateTab('confirm-indent')">
      Confirm Indent
    </button>
    <button type="button" class="btn btn-sm"
      [ngClass]="activeTab === 'indent-log' ? 'btn-primary' : 'btn-outline-primary'"
      (click)="navigateTab('indent-log')">
      Indent Log
    </button>
    <button type="button" class="btn btn-sm"
      [ngClass]="activeTab === 'can-plan' ? 'btn-primary' : 'btn-outline-primary'"
      (click)="navigateTab('can-plan')">
      Can Plan Work Order
    </button>
    <div class="wo-hub-tabs-spacer"></div>
    <button class="btn btn-sm btn-danger" routerLink="/planning/stplan" [queryParams]="{ returnUrl: '/planning' }">CLOSE</button>
  </div>
  <div class="wo-hub-content">
    <router-outlet></router-outlet>
  </div>
</div>
