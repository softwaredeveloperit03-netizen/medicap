<div class="container"*ngIf="!isProceed">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Induction Training</div>
          <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/hr" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
      <div class="card-block">
        <div class="card-text">
         <div class="clr-row">
           <!-- <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
             <label><strong>HOD:</strong></label>
             <select name="department" [value]="department" [(ngModel)]="department">
               <option></option>
               <option *ngFor="let hod of departments">{{hod.department}}</option>
             </select>
           </div> -->
  
          <table class="table">
            <tr>
            <th style="text-align: left;">Employee Id</th>
            <th style="text-align: left;">Employee Name</th>
            <th style="text-align: left;">Joined In Department</th>
            <th style="text-align: left;">Joining Date</th>
            <th>Proceed</th>
            <!-- <th>View</th> -->
            </tr>
            <tr *ngFor="let user of inductions;let i= index">
                <td style="text-align: left;">{{user.emp_id}}</td>
                <td style="text-align: left;">{{user.firstname}} {{user.middlename}} {{user.lastname}}</td>
                <td style="text-align: left;">{{user.learning}}</td>
                <td style="text-align: left;">{{user.start_time | date:'dd-MM-yyyy'}}</td>
                <td><button class="btn btn-sm btn-info"(click)="proceed(i)">Proceed</button></td>
                <!-- <td><button class="btn btn-sm btn-info"(click)="view(i)">View</button></td> -->
            </tr>
          </table>
         </div>
           
        </div>
      </div>
      <div class="card-footer"><button class="btn btn-primary" (click)="download()">Download</button></div>
    </div>
   
  </div>
