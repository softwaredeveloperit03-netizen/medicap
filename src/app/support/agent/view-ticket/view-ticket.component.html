

<div class="card">
    <div class="card-header">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue; margin-top: -2px; text-align: left;">Raise Ticket</div>
            <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px;">
                <button routerLink="/support" class="btn btn-sm btn-danger">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
        <form #FormData="ngForm">
            <div class="clr-row">
                <div class="title"><b>New Ticket</b></div>
                <div class="clr-col-lg-8 clr-col-md-8 clr-col-sm-12 clr-col-xs-12">
                    <label>Ticket Subject:*</label>
                    <input type="text" name="client_name" ngModel="Bajaj Healthcare Ltd." readonly tabindex="-1">
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Email adress:*</label>
                    <input type="text" name=software_type ngModel="Corporate" readonly>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Ticket Category:*</label>
                    <select name="department" ngModel required>
                        <option></option>
                        <option></option>
                        <option>Marketing</option>
                        <option>Dispatch</option>
                        <option>Human Resource</option>
                        <option>Account</option>
                        <option>Purchase</option>
                        <option>Vendor</option>
                        <option>IT</option>
                        <option>Other</option>
                    </select>
                </div>
                
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                    <label>Ticket Descrtiption:*</label>
                    <textarea rows="5" name="description" ngModel required></textarea>
                </div>
                
            </div>
        </form>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="save(FormData)">{{'common.save' | translate}}</button>
    </div>
</div>
