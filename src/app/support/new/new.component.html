<div class="card">
    <div class="card-header">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue; margin-top: -2px; text-align: left;">Raise Ticket</div>
            <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px;">
                <button routerLink="/support" class="btn btn-sm btn-danger">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
        <form #FormData="ngForm">
            <div class="clr-row">
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Client Name : <span style="color: red;"><b>*</b></span></label>
                    <input type="text" name="clientName" [(ngModel)]="plant_name" readonly tabindex="-1">
                </div>
             
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Query Type : <span style="color: red;"><b>*</b></span></label>
                    <select name="queryType" ngModel required>
                        <option>Error</option>
                        <option>Form Not Getting Submitted</option>
                        <option>Software Not Loading</option>
                        <option>Login Issue</option>
                        <option>Data Not Loading</option>
                        <option>Data Missing</option>
                        <option>Data Mismatch</option>
                        <option>New Customization</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Form Name : <span style="color: red;"><b>*</b></span></label>
                    <input type="text" name="formName" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Paste Url : <span style="color: red;"><b>*</b></span></label>
                    <input type="text" name="errorUrl" ngModel required>
                </div>
                <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                    <label>Upload Screenshot : </label>
                    <input type="file" name="photo" ngModel   (change)="onFileChanged($event)">
                </div>
                <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                    <label>Description : <span style="color: red;"><b>*</b></span></label>
                    <textarea rows="5" name="errordescription" ngModel required></textarea>
                </div>
          
            </div>
        </form>
        </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-primary" (click)="save(FormData)">{{'common.save' | translate}}</button>
    </div>
</div>
