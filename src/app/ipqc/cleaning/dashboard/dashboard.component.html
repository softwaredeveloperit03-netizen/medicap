<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue; margin-top: -2px; text-align: left;">Cleaning In-Process Record</div>
        <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/ipqc" style="background-color: red; color: white;">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <form #CleaningreportForm="ngForm">
        <div class="card-text">
          <h4>Area/Equipment Information</h4>
          <div class="clr-row">
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Area/Equipment Name:<span style="color: red;">*</span></label>
              <input type="text" name="area_name" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>Location:<span style="color: red;">*</span></label>
              <input type="text" name="ipqc_location" ngModel required>
            </div>
            <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
              <label>IPQC Inspector:<span style="color: red;">*</span></label>
              <input type="text" name="ipqc_inspector" ngModel required>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-header" style="text-align: left; color: white; background-color: rgb(230, 107, 158);">Cleaning Details</div>
          <div class="card-block">
            <div class="clr-row">
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Cleaning Start Time:<sup style="color: red;">*</sup></strong></label>
                <input type="time" name="cle_start_time" ngModel required>
              </div>
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Cleaning End Time:<sup style="color: red;">*</sup></strong></label>
                <input type="time" name="cle_end_time" ngModel required>
              </div>
              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Cleaning Procedure:<sup style="color: red;">*</sup></strong></label>
                <input type="text" name="cle_procedure" ngModel required>
              </div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-header" style="text-align: left; color: black; background-color: rgb(216, 230, 107);">Cleaning verification</div>
          <div class="card-block">
            <div class="clr-row">
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Visual Inspection:<sup style="color: red;">*</sup></strong></label>
                <input type="text" name="visual_inspection" ngModel required>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Chemical Testing(If Applicable):<sup style="color: red;">*</sup></strong></label>
                <input type="text" name="chemical_testing" ngModel required>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Microbial Testing(If Applicable):<sup style="color: red;">*</sup></strong></label>
                <input type="text" name="microbil_test" ngModel required>
              </div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-header" style="text-align: left; color: black; background-color: rgb(230, 107, 210);">Cleaning & IPQC Inspection</div>
          <div class="card-block">
            <div class="clr-row">
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Cleaned By:<sup style="color: red;">*</sup></strong></label>
                <input type="text" name="cleaned_by" ngModel required>
              </div>
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Cleaning Date:<sup style="color: red;">*</sup></strong></label>
                <input type="date" name="cle_date" ngModel required>
              </div>
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Inspected By:<sup style="color: red;">*</sup></strong></label>
                <input type="text" name="inspect_by" ngModel required>
              </div>
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Inspecting Date:<sup style="color: red;">*</sup></strong></label>
                <input type="date" name="inspecting_date" ngModel required>
              </div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-header" style="text-align: left;color: black; background-color: rgb(14, 163, 212);">Review & Approval</div>
          <div class="card-block">
            <div class="clr-row">
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Prepared By:<sup style="color: red">*</sup></strong></label>
                <input type="text" name="prepared_by" ngModel required>
              </div>
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Prepared Date:<sup style="color: red">*</sup></strong></label>
                <input type="date" name="prepared_date" ngModel required>
              </div>
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong>Reviewed By:<sup style="color: red">*</sup></strong></label>
                <input type="text" name="review_by" ngModel required>
              </div>
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label><strong> Reviewed Date:<sup style="color: red">*</sup></strong></label>
                <input type="date" name="review_date" ngModel required>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  
    <div class="card-footer">
      <button class="btn btn-primary" (click)="save(CleaningreportForm)">{{'common.save' | translate}}</button>
    </div>
  </div>
