<div class="wof">
  <div class="wof__card">
    <header class="wof__header">
      <h1 class="wof__title">New Work Order — {{ department }}</h1>
      <a class="wof__btn wof__btn--close" routerLink="/equipment-work-order">Close</a>
    </header>

    <div class="wof__body">
      <p class="wof__meta">
        EQUIPMENT &amp; FACILITY WORK ORDER &nbsp;|&nbsp; Form No: FEN-001-01-B &nbsp;|&nbsp; Ref: WI-EN-001-01
      </p>

      <form #partA="ngForm">
        <div class="wof__subheader">
          <h2 class="wof__subtitle">The Initiator</h2>
        </div>

        <div class="wof__grid">
          <div class="wof__field wof__field--span2">
            <label class="wof__label">Select Type <span class="wof__asterisk">*</span></label>
            <div class="wof__check-row" style="padding-top: 0.35rem;">
              <label class="wof__check">
                <input type="radio" name="asset_type" value="Equipment" [(ngModel)]="form.asset_type"
                  (ngModelChange)="onAssetTypeChange()" required />
                Equipment
              </label>
              <label class="wof__check">
                <input type="radio" name="asset_type" value="Area" [(ngModel)]="form.asset_type"
                  (ngModelChange)="onAssetTypeChange()" required />
                Area
              </label>
            </div>
          </div>

          <div class="wof__field wof__field--span2" *ngIf="form.asset_type === 'Equipment'">
            <label class="wof__label">Equipment Name <span class="wof__asterisk">*</span></label>
            <select class="wof__input" name="equipSelect" required [(ngModel)]="equipIndex"
              (ngModelChange)="onEquipmentChange($event)">
              <option [ngValue]="''">Select Equipment ({{ department }}) — {{ equipments?.length || 0 }} found</option>
              <option *ngFor="let eq of equipments; let i = index" [ngValue]="i">
                {{ eq.equipment_name }}<ng-container *ngIf="eq.equipment_code || eq.tag_no"> ({{ eq.equipment_code || eq.tag_no }})</ng-container>
              </option>
            </select>
          </div>

          <div class="wof__field wof__field--span2" *ngIf="form.asset_type === 'Area'">
            <label class="wof__label">Area Name <span class="wof__asterisk">*</span></label>
            <select class="wof__input" name="areaSelect" [(ngModel)]="areaIndex"
              (ngModelChange)="onAreaChange($event)" [required]="!form.equipment_name">
              <option [ngValue]="''">Select Area ({{ department }}) — {{ areas?.length || 0 }} found</option>
              <option *ngFor="let ar of areas; let i = index" [ngValue]="i">{{ ar.area_name }}</option>
            </select>
            <input
              *ngIf="!areas?.length"
              class="wof__input"
              style="margin-top: 0.35rem;"
              type="text"
              name="area_name_manual"
              [(ngModel)]="form.equipment_name"
              (ngModelChange)="onManualAreaName($event)"
              required
              placeholder="Type area name for {{ department }}"
            />
          </div>

          <div class="wof__field wof__field--span2">
            <label class="wof__label">Sub-Component ID#</label>
            <input
              class="wof__input"
              type="text"
              name="sub_component_id"
              [(ngModel)]="form.sub_component_id"
              readonly
              placeholder="Auto-filled from selected Equipment / Area"
            />
          </div>

          <div class="wof__field wof__field--full">
            <label class="wof__label">Is this <span class="wof__asterisk">*</span></label>
            <div class="wof__check-row">
              <div class="wof__check-group">
                <span>Breakdown</span>
                <label class="wof__check"><input type="radio" name="is_breakdown" value="Yes" [(ngModel)]="form.is_breakdown" required /> Yes</label>
                <label class="wof__check"><input type="radio" name="is_breakdown" value="No" [(ngModel)]="form.is_breakdown" required /> No</label>
              </div>
              <div class="wof__check-group">
                <span>Repair</span>
                <label class="wof__check"><input type="radio" name="is_repair" value="Yes" [(ngModel)]="form.is_repair" required /> Yes</label>
                <label class="wof__check"><input type="radio" name="is_repair" value="No" [(ngModel)]="form.is_repair" required /> No</label>
              </div>
              <div class="wof__check-group">
                <span>Priority</span>
                <label class="wof__check"><input type="radio" name="priority" value="1" [(ngModel)]="form.priority" required /> 1</label>
                <label class="wof__check"><input type="radio" name="priority" value="2" [(ngModel)]="form.priority" required /> 2</label>
                <label class="wof__check"><input type="radio" name="priority" value="3" [(ngModel)]="form.priority" required /> 3</label>
              </div>
            </div>
          </div>

          <div class="wof__field wof__field--span2">
            <label class="wof__label">Available for maintenance <span class="wof__asterisk">*</span></label>
            <input class="wof__input" type="datetime-local" name="available_for_maintenance"
              [(ngModel)]="form.available_for_maintenance" required />
          </div>

          <div class="wof__field wof__field--span2">
            <label class="wof__label">Required for use <span class="wof__asterisk">*</span></label>
            <input class="wof__input" type="datetime-local" name="required_for_use"
              [(ngModel)]="form.required_for_use" required />
          </div>

          <div class="wof__field wof__field--full">
            <label class="wof__label">Describe the problem <span class="wof__asterisk">*</span></label>
            <textarea class="wof__input" name="problem_description" [(ngModel)]="form.problem_description"
              required placeholder="Describe the problem"></textarea>
          </div>

          <div class="wof__field wof__field--span2">
            <label class="wof__label">Ref NCR # (if applicable)</label>
            <input class="wof__input" type="text" name="ref_ncr_no" [(ngModel)]="form.ref_ncr_no" />
          </div>

          <div class="wof__field">
            <label class="wof__label">Submitted By <span class="wof__asterisk">*</span></label>
            <input class="wof__input" type="text" name="submitted_by" [(ngModel)]="form.submitted_by" required />
          </div>

          <div class="wof__field">
            <label class="wof__label">Date <span class="wof__asterisk">*</span></label>
            <input class="wof__input" type="date" name="submitted_date" [(ngModel)]="form.submitted_date" required />
          </div>
        </div>
      </form>
    </div>

    <div class="wof__footer">
      <button type="button" class="wof__btn wof__btn--success" (click)="save(partA)">Submit to Engineering</button>
      <a class="wof__btn wof__btn--close" routerLink="/equipment-work-order">Close</a>
    </div>
  </div>
</div>
