<div class="container-fluid">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue; margin-top: -2px; text-align: left;">
          Export Authorization Management
        </div>
        <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/Exports" style="background-color: red; color: white;">
            CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #authorizationForm="ngForm">
          
          <!-- Section 1: Authorization Type -->
          <div class="section-header">
            <h4>1. Authorization Type</h4>
          </div>
          <div class="clr-row">
            <div class="clr-col-lg-12">
              <label>Authorization Type: <span style="font-weight: bolder; color: red;">*</span></label>
              <select name="authorizationType" [(ngModel)]="authorizationType" required>
                <option value="">Select Authorization Type</option>
                <option value="Export License">Export License</option>
                <option value="Import License">Import License</option>
                <option value="NOC / Permit">NOC / Permit</option>
                <option value="Restricted Goods Approval">Restricted Goods Approval</option>
                <option value="Customs Clearance Authorization">Customs Clearance Authorization</option>
                <option value="Drug Control Authorization">Drug Control Authorization (if pharma)</option>
              </select>
            </div>
          </div>

          <!-- Section 2: Applicant / Holder Details -->
          <div class="section-header" style="margin-top: 20px;">
            <h4>2. Applicant / Holder Details</h4>
          </div>
          <div class="clr-row">
            <div class="clr-col-lg-6">
              <label>Company Name: <span style="font-weight: bolder; color: red;">*</span></label>
              <input type="text" name="companyName" [(ngModel)]="companyName" required placeholder="Auto from profile">
            </div>
            <div class="clr-col-lg-6">
              <label>Authorization Holder Name: <span style="font-weight: bolder; color: red;">*</span></label>
              <input type="text" name="authorizationHolderName" [(ngModel)]="authorizationHolderName" required>
            </div>
          </div>
          <div class="clr-row">
            <div class="clr-col-lg-6">
              <label>Designation: <span style="font-weight: bolder; color: red;">*</span></label>
              <input type="text" name="designation" [(ngModel)]="designation" required>
            </div>
            <div class="clr-col-lg-6">
              <label>Contact Number: <span style="font-weight: bolder; color: red;">*</span></label>
              <input type="text" name="contactNumber" [(ngModel)]="contactNumber" required>
            </div>
          </div>
          <div class="clr-row">
            <div class="clr-col-lg-6">
              <label>Email ID: <span style="font-weight: bolder; color: red;">*</span></label>
              <input type="email" name="emailId" [(ngModel)]="emailId" required>
            </div>
            <div class="clr-col-lg-6">
              <label>IEC Code (Importer Exporter Code): <span style="font-weight: bolder; color: red;">*</span></label>
              <input type="text" name="iecCode" [(ngModel)]="iecCode" required>
            </div>
          </div>
          <div class="clr-row">
            <div class="clr-col-lg-6">
              <label>GST / Tax ID: <span style="font-weight: bolder; color: red;">*</span></label>
              <input type="text" name="gstTaxId" [(ngModel)]="gstTaxId" required>
            </div>
            <div class="clr-col-lg-6">
              <label>Company Address: <span style="font-weight: bolder; color: red;">*</span></label>
              <textarea name="companyAddress" [(ngModel)]="companyAddress" required rows="2"></textarea>
            </div>
          </div>

          <!-- Section 3: Authorization Document Details -->
          <div class="section-header" style="margin-top: 20px;">
            <h4>3. Authorization Document Details</h4>
          </div>
          <div class="clr-row">
            <div class="clr-col-lg-6">
              <label>Authorization / License Number: <span style="font-weight: bolder; color: red;">*</span></label>
              <input type="text" name="authorizationLicenseNumber" [(ngModel)]="authorizationLicenseNumber" required>
            </div>
            <div class="clr-col-lg-6">
              <label>Issuing Authority: <span style="font-weight: bolder; color: red;">*</span></label>
              <select name="issuingAuthority" [(ngModel)]="issuingAuthority" required>
                <option value="">Select Issuing Authority</option>
                <option value="DGFT">DGFT</option>
                <option value="CDSCO">CDSCO</option>
                <option value="State FDA">State FDA</option>
                <option value="Customs">Customs</option>
                <option value="Port Authority">Port Authority</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>
          <div class="clr-row">
            <div class="clr-col-lg-4">
              <label>Issue Date: <span style="font-weight: bolder; color: red;">*</span></label>
              <input type="date" name="issueDate" [(ngModel)]="issueDate" required>
            </div>
            <div class="clr-col-lg-4">
              <label>Valid From Date: <span style="font-weight: bolder; color: red;">*</span></label>
              <input type="date" name="validFromDate" [(ngModel)]="validFromDate" required>
            </div>
            <div class="clr-col-lg-4">
              <label>Valid Till Date: <span style="font-weight: bolder; color: red;">*</span></label>
              <input type="date" name="validTillDate" [(ngModel)]="validTillDate" required>
            </div>
          </div>
          <div class="clr-row">
            <div class="clr-col-lg-6">
              <label>Status: <span style="font-weight: bolder; color: red;">*</span></label>
              <select name="status" [(ngModel)]="status" required>
                <option value="Pending">{{'common.pending' | translate}}</option>
                <option value="Active">Active</option>
                <option value="Expired">Expired</option>
                <option value="Suspended">Suspended</option>
                <option value="Revoked">Revoked</option>
                <option value="Renewed">Renewed</option>
              </select>
            </div>
          </div>

          <!-- Section 4: Shipment / Product Scope -->
          <div class="section-header" style="margin-top: 20px;">
            <h4>4. Shipment / Product Scope</h4>
          </div>
          <div class="clr-row">
            <div class="clr-col-lg-6">
              <label>Product Category: <span style="font-weight: bolder; color: red;">*</span></label>
              <select name="productCategory"  [(ngModel)]="productCategory" required (change)="getMaterialByType($event.target.value)">
                <option></option>
                <!-- <option>Pharma</option> -->
                <option value="Raw Material">Raw Material</option>
                <option value="Packing Material">Packing Material</option>
            </select>
             
            </div>
            <div class="clr-col-lg-6">
              <label>Product Name: <span style="font-weight: bolder; color: red;">*</span></label>
              <select name="productName" [(ngModel)]="productName" required>
                <option></option>
                <option *ngFor="let product of productCategories"  >{{product.material_name}} ({{product.material_code}})</option>
              </select>
             
            </div>
          </div>
          <div class="clr-row">
            <div class="clr-col-lg-6">
              <label>HS Code / ITC Code: <span style="font-weight: bolder; color: red;">*</span></label>
              <input type="text" name="hsCode" [(ngModel)]="hsCode" required placeholder="HS Code">
            </div>
            <div class="clr-col-lg-6">
              <label>ITC Code:</label>
              <input type="text" name="itcCode" [(ngModel)]="itcCode" placeholder="ITC Code">
            </div>
          </div>
          <div class="clr-row">
            <div class="clr-col-lg-6">
              <label>Drug License No (if pharma):</label>
              <input type="text" name="drugLicenseNo" [(ngModel)]="drugLicenseNo">
            </div>
            <div class="clr-col-lg-6">
              <label>Controlled Substance Check: <span style="font-weight: bolder; color: red;">*</span></label>
              <select name="controlledSubstanceCheck" [(ngModel)]="controlledSubstanceCheck" required>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>
          </div>
          <div class="clr-row">
            <div class="clr-col-lg-6">
              <label>Country of Origin: <span style="font-weight: bolder; color: red;">*</span></label>
              <select name="countryOfOrigin" [(ngModel)]="countryOfOrigin" required>
                <option value="">Select Country</option>
                <option *ngFor="let country of countries" [value]="country">{{ country }}</option>
              </select>
            </div>
            <div class="clr-col-lg-6">
              <label>Country of Destination: <span style="font-weight: bolder; color: red;">*</span></label>
              <select name="countryOfDestination" [(ngModel)]="countryOfDestination"  required>
                <option value="">Select Country</option>
                <option *ngFor="let country of countries" [value]="country">{{ country }}</option>
              </select>
            </div>
          </div>
          <div class="clr-row">
            <div class="clr-col-lg-4">
              <label>Port of Entry / Exit: <span style="font-weight: bolder; color: red;">*</span></label>
              <input type="text" name="portOfEntryExit" [(ngModel)]="portOfEntryExit" required>
              <!-- <select name="portOfEntryExit" [(ngModel)]="portOfEntryExit" required>
                <option value="">Select Port</option>
                <option *ngFor="let port of filteredPorts" [value]="port">{{ port }}</option>
              </select> -->
            </div>
            <div class="clr-col-lg-2">
              <label>Authorized Quantity: <span style="font-weight: bolder; color: red;">*</span></label>
              <input type="number" name="authorizedQuantity" [(ngModel)]="authorizedQuantity" required min="0" (change)="calculateRemainingQuantity()">
            </div>
            <div class="clr-col-lg-2">
              <label>Unit: <span style="font-weight: bolder; color: red;">*</span></label>
              <select name="unit" [(ngModel)]="unit" required>
                <option value="">Select Unit</option>
                <option value="Kg">Kg</option>
                <option value="Liters">Liters</option>
                <option value="Units">Units</option>
                <option value="Packs">Packs</option>
                <option value="Boxes">Boxes</option>
              </select>
            </div>
            
          </div>

          <!-- Section 5: Compliance & Restrictions -->
          <div class="section-header" style="margin-top: 20px;">
            <h4>5. Compliance & Restrictions</h4>
          </div>
          <div class="clr-row">
            <div class="clr-col-lg-6">
              <label>Is Product Restricted?: <span style="font-weight: bolder; color: red;">*</span></label>
              <select name="isProductRestricted" [(ngModel)]="isProductRestricted" required>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>
            <div class="clr-col-lg-6">
              <label>Storage Requirement:</label>
              <select name="storageRequirement" [(ngModel)]="storageRequirement">
                <option value="">Select Storage Requirement</option>
                <option value="Controlled Temp">Controlled Temp</option>
                <option value="Ambient">Ambient</option>
                <option value="Cold Chain">Cold Chain</option>
              </select>
            </div>
          </div>
          <div class="clr-row">
            <div class="clr-col-lg-6">
              <label>Hazardous Material Declaration: <span style="font-weight: bolder; color: red;">*</span></label>
              <select name="hazardousMaterialDeclaration" [(ngModel)]="hazardousMaterialDeclaration" required>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>
            <div class="clr-col-lg-6">
              <label>Schedule Drug Category:</label>
              <select name="scheduleDrugCategory" [(ngModel)]="scheduleDrugCategory">
                <option value="">Select Category</option>
                <option value="H">H</option>
                <option value="H1">H1</option>
                <option value="X">X</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>
          <div class="clr-row">
            <div class="clr-col-lg-12">
              <label>Special Conditions / Notes:</label>
              <textarea name="specialConditions" [(ngModel)]="specialConditions" rows="3"></textarea>
            </div>
          </div>

          <!-- Section 6: Authorization Upload -->
          <div class="section-header" style="margin-top: 20px;">
            <h4>6. Authorization Upload</h4>
          </div>
          <div class="clr-row">
            <div class="clr-col-lg-4">
              <label>Upload Authorization Copy (PDF): <span style="font-weight: bolder; color: red;">*</span></label>
              <input type="file" accept=".pdf" (change)="onAuthorizationCopyChange($event)" required>
            </div>
            <div class="clr-col-lg-4">
              <label>Upload Annexures (if any):</label>
              <input type="file" accept=".pdf,.doc,.docx" (change)="onAnnexuresChange($event)">
            </div>
            <div class="clr-col-lg-4">
              <label>Upload Digital Signature File (optional):</label>
              <input type="file" accept=".pdf,.jpg,.png" (change)="onDigitalSignatureChange($event)">
            </div>
          </div>

          <!-- Section 8: Renewal & Alerts -->
          <div class="section-header" style="margin-top: 20px;">
            <h4>8. Renewal & Alerts</h4>
          </div>
          <div class="clr-row">
            <div class="clr-col-lg-6">
              <label>Auto Renewal Reminder Before (days):</label>
              <select name="autoRenewalReminderBefore" [(ngModel)]="autoRenewalReminderBefore">
                <option value="30">30 days</option>
                <option value="60">60 days</option>
                <option value="90">90 days</option>
              </select>
            </div>
            <div class="clr-col-lg-6">
              <label>Expiry Alert Toggle:</label>
              <select name="expiryAlertToggle" [(ngModel)]="expiryAlertToggle">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>
          </div>

          <div class="clr-row">
            <div class="clr-col-lg-4">
              <label>Approver 1:</label>
              <select name="approver1" [(ngModel)]="approver1" class="form-control">
                <option value="">Select Employee</option>
                <option *ngFor="let user of users" [value]="user.emp_id ">
                  {{ user.firstname  }}  {{ user.lastname  }}
                </option>
              </select>
            </div>
            <div class="clr-col-lg-4">
              <label>Approver 2:</label>
              <select name="approver2" [(ngModel)]="approver2" class="form-control">
                <option value="">Select Employee</option>
                <option *ngFor="let user of users" [value]="user.emp_id ">
                  {{ user.firstname  }}  {{ user.lastname  }}
                </option>
              </select>
            </div>
            <div class="clr-col-lg-4">
              <label>Approver 3:</label>
              <select name="approver3" [(ngModel)]="approver3" class="form-control">
                <option value="">Select Employee</option>
                <option *ngFor="let user of users" [value]="user.emp_id ">
                  {{ user.firstname  }}  {{ user.lastname  }}
                </option>
              </select>
            </div>
          </div>

          <div class="clr-row">
            <div class="clr-col-lg-12">
              <label>Notify To (Multiple users):</label>
              <div class="clr-row">
                <div class="clr-col-lg-8">
                  <select name="notifyUser" [(ngModel)]="notifyUser" class="form-control">
                    <option value="">Select User</option>
                    <option *ngFor="let user of users" [value]="user.emp_id || user.id">
                      {{ user.emp_name || user.name }} - {{ user.email || user.emp_email }}
                    </option>
                  </select>
                </div>
                <div class="clr-col-lg-4">
                  <button type="button" class="btn btn-sm btn-primary" (click)="addNotifyUser(notifyUser); notifyUser = ''">
                    Add User
                  </button>
                </div>
              </div>
              <div *ngIf="selectedNotifyUsers.length > 0" style="margin-top: 10px;">
                <div *ngFor="let userId of selectedNotifyUsers; let i = index" class="badge badge-info" style="margin: 5px;">
                  {{ getUserName(userId) }}
                  <span (click)="removeNotifyUser(i)" style="cursor: pointer; margin-left: 5px;">×</span>
                </div>
              </div>
            </div>
          </div>

 

        </form>
      </div>
    </div>
    <div class="card-footer" style="text-align: left;">
      <button class="btn btn-primary" (click)="saveForm(authorizationForm)">{{'common.save' | translate}}</button>
      <button class="btn btn-danger" routerLink="/Exports">{{'common.close' | translate}}</button>
    </div>
  </div>
</div>
