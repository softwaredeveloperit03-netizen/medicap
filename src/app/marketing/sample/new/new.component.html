<div class="card">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;"> New Sample Form</div>
      <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        <button class="btn btn-sm" routerLink="/marketing/sample" style="background-color: red;color: white;">
          <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
        </button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <div class="card-text">
      <form #sampleForm="ngForm">
        <div class="clr-row">
          <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label><strong>Client Name: <span style="color: red;">*</span></strong></label>
            <select name="client_code" [(ngModel)]="client_code" required (change)="onClientChange($event)">
              <option></option>
              <option *ngFor="let cli of clients" [value]="cli.client_code">{{cli.TrdNm }}</option>
            </select>
          </div>

          <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Sample Requirement:<span style="color:red">*</span></label>
            <select name="requirement" [(ngModel)]="requirement" required (change)="onRequirementChange()">
              <option></option>
              <option value="fresh">Fresh</option>
              <option value="existing product">Existing Product</option>
            </select>
          </div>
          
          <div *ngIf="requirement == 'existing product'" class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Finished Product <span style="color:red">*</span></label>
            <select name="product_code" [(ngModel)]="product_code" required (change)="onProductChange()" style="margin: 0px;height: 33px;">
              <option value=""></option>
              <option *ngFor="let product of products" [value]="product.product_code">{{ product.displayLabel }}</option>
            </select>
          </div>

          <div *ngIf="requirement == 'fresh'" class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Product Name <span style="color:red">*</span></label>
            <input type="text" [(ngModel)]="product_name" name="product_name" required>
          </div>
          <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12 remove-side-arrow-container">
            <label>Quantity Required <span style="color:red">*</span></label>
            <input type="number" name="quantity_required" [(ngModel)]="quantity_required" required>
          </div>
          <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Unit <span style="color:red">*</span></label>
            <select name="unit" [(ngModel)]="unit" required style="margin: 0px;height: 33px;">
              <option value=""></option>
              <option *ngFor="let u of units" [value]="u.unit">{{ u.unit }}</option>
            </select>
          </div>
          <div class="clr-col-lg-3 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
            <label>Purpose<span style="color:red">*</span></label>
            <select name="purpose"  [(ngModel)]="purpose" required style="margin: 0px;height: 33px;">
              <option value="marketing_sample">Marketing Sample</option>
              <option value="registeration_sample">Registeration Sample</option>
            </select>
          </div>
        </div>
      </form>
    </div>
  </div>
  <div class="card-footer">
    <button class="btn btn-primary" [disabled]="isSubmitting" (click)="save(sampleForm)">{{'common.submit' | translate}}</button>
  </div>
</div>
