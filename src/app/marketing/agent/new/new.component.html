<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Agent Form</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/marketing/agent/log" style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
    <div class="card-block">
        <div class="card-text">
            <form #clientform="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-4 clr-col-sm-4 clr-col-md-12 clr-col-sm-12">
                        <label>Agent Name:<span style="color: red;">*</span></label>
                        <input type="text" name="agent_name" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Contact Person Name : <span style="color: red;">*</span></label>
                        <input type="text" name="contact_person" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Contact No: <span style="color: red;">*</span></label>
                        <input
                          type="text"
                          name="phone"
                          ngModel
                          required
                          placeholder="e.g. 416-555-1234"
                          title="Enter a valid Canadian phone number (10 digits, e.g. 416-555-1234).">
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Email ID: <span style="color: red;">*</span></label>
                        <input type="email" name="email" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Percentage On: <span style="color: red;">*</span></label>
                        <select name="percentage_on" [(ngModel)]="percentage_on" required>
                            <option value="" disabled>Select</option>
                            <option value="Gross Value">Gross Value</option>
                            <option value="Net Value">Net Value</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12 remove-side-arrow-container" >
                        <label>Percentage(%):<span style="color: red;">*</span></label>
                        <input type="text" name="percentage" inputmode="decimal" pattern="^[0-9]+(\.[0-9]{1,2})?$" ngModel required>
                    </div>
                   <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>TAX Type:<span style="color: red;">*</span></label>
                        <select name="gst_type" [(ngModel)]="gst_type" required>
                            <option value="VAT">VAT</option>
                            <option value="HST">HST</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12" >
                        <label>TAX No:<span style="color: red;">*</span></label>
                        <input type="text" name="gst_no" ngModel required>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>State Name:<span style="color: red;">*</span></label>
              
                        <select name="state_code" [(ngModel)]="state_code" required>
                            <option value="" disabled>Select Province / Territory</option>
                            <option *ngFor="let province of canadianProvinces" [value]="province">{{ province }}</option>
                        </select>
                    </div>
                    <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                        <label>Pan No :<span style="color: red;">*</span></label>
                        <input type="text" name="pan_no" ngModel required>
                    </div>
                    <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                        <label>Address :<span style="color: red;">*</span></label>
                        <textarea name="address" rows="2" ngModel required></textarea>
                    </div>
                </div>
            </form>
        </div>
    </div>
  <div class="card-footer">
        <button class="btn btn-primary" type="button" [disabled]="isSubmitting" (click)="submit(clientform)">
            {{ isSubmitting ? 'Saving...' : ('common.submit' | translate) }}
        </button>
    </div>
</div>
