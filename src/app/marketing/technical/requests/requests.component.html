<div class="card">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Technical Document  Request</div>
      <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        <button class="btn btn-sm" routerLink="/marketing/technical" style="background-color: red;color: white;">
          <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
        </button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <div class="card-text">
      <form #document="ngForm">
        <div class="clr-row">
          <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label><strong>Request From Client</strong></label>
            <select name="client_code" ngModel required>
              <option disabled> </option>
              <option *ngFor ="let item of clientlist" value="{{item.client_code}}"> {{item.TrdNm}} </option>
            </select>
          </div> 
        </div>
      </form>
      <h4>Document Names:</h4>
      <form #docData="ngForm">
      <table class="table table-border">
        <tr>
            <th style="text-align:left; background-color: rgb(14,67,112); color: white;">Document Type</th>
            <th style="text-align:left; background-color: rgb(14,67,112); color: white;">Required in Form of</th>
            <th style="text-align:left; background-color: rgb(14,67,112); color: white;">Document Name</th>
            <th style="background-color: rgb(14,67,112); color: white; margin-top: 10px;">ADD</th>
        </tr>
        <tr>
            <td style="padding: 0px;">
              <select name = "document_type" ngModel required>
                <option disabled> </option>
                <option>Analytical</option>
                <option>Process</option>
                <option>QMS</option>
                <option>Other</option>
              </select>
            </td>
            <td style="padding: 0px;">
              <select name = "required_in" ngModel required>
                <option disabled> </option>
                <option>Hard Copy</option>
                <option>PDF</option>
              </select>
            </td>
            <td style="padding: 0px;">
                <input type="text"  name="document_name" [(ngModel)]="document_name" required>
            </td>
            <td style="padding: 0px;">
                <button class="btn btn-sm btn-info" (click)="addDocument(docData)">{{'common.add' | translate}}</button>
            </td>
        </tr>
        <tr *ngFor="let doc of documents; let i = index">
            <td style="text-align: left;">{{ doc.document_type }}</td>
            <td style="text-align: left;">{{ doc.required_in}}</td>
            <td style="text-align: left;">{{ doc.document_name }}</td>
             <td><clr-icon shape="trash" class="is-error" (click)="deleteDocument(i)"></clr-icon></td>
        </tr>
      </table>
    </form>
    </div>
  </div>
  <div class="card-footer">
      <button class="btn btn-primary" [disabled]="documents.length === 0" (click)="saveForm(document)">SEND REQUEST</button>
  </div>
</div>
