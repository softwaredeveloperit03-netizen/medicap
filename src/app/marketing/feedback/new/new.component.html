<div class="container-fluid">
  <div class="card feedback-new-card">
    <div class="card-header">
      <div class="clr-row header-row">
        <div class="clr-col-9 title-col">Client Feedback</div>
        <div class="clr-col-lg-3 action-col">
          <button type="button" class="btn btn-sm btn-close" routerLink="/marketing/feedback/log">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #feedbackForm="ngForm" class="feedback-form">
          <div class="clr-row">
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Client Name <span class="required-asterisk">*</span></strong></label>
              <select name="client_code" [(ngModel)]="client_code" required aria-label="Client Name">
                <option value=""></option>
                <option *ngFor="let client of clients" [value]="client.client_code">
                  {{ client.LglNm || client.TrdNm }} ({{ client.client_code }})
                </option>
              </select>
              <span class="field-hint" *ngIf="clients?.length === 0">No active clients found.</span>
            </div>
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Feedback through <span class="required-asterisk">*</span></strong></label>
              <select name="feedback_by" ngModel required aria-label="Feedback through">
                <option value="">Select</option>
                <option value="email">{{'common.email' | translate}}</option>
                <option value="mobile">Mobile</option>
                <option value="web portal">Web portal</option>
                <option value="personal meeting">Personal meeting</option>
              </select>
            </div>
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
              <label><strong>Feedback <span class="required-asterisk">*</span></strong></label>
              <textarea name="feedback" rows="4" ngModel required placeholder="Enter feedback..."></textarea>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button type="button" class="btn btn-primary" (click)="savefeedback(feedbackForm)">Save Feedback</button>
    </div>
  </div>
</div>
