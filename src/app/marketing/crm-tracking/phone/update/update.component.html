<div class="container-fluid">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue; margin-top: -2px; text-align: left;">
          Update Phone Call Details
        </div>
        <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px;">
          <button class="btn btn-sm btn-primary" routerLink="/marketing/crmTracking/phone/new2" style="margin-right: 5px;">
            <i class="fas fa-arrow-left"></i> Back
          </button>
          <button class="btn btn-sm" routerLink="/marketing/crmTracking" style="background-color: red; color: white;">
            CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #updateForm="ngForm" (ngSubmit)="updateCallDetails(updateForm)">
          
          <!-- Section 3: Call Details -->
          <div class="section-header">
            <h4>3. Call Details</h4>
          </div>
          <div class="clr-row">
            <div class="clr-col-lg-4">
              <label>Call Type: <span style="font-weight: bolder; color: red;">*</span></label>
              <select name="callType" [(ngModel)]="callType" required>
                <option value="Incoming">Incoming</option>
                <option value="Outgoing">Outgoing</option>
              </select>
            </div>
            <div class="clr-col-lg-4">
              <label>Call Date: <span style="font-weight: bolder; color: red;">*</span></label>
              <input type="date" name="callDate" [(ngModel)]="callDate" required style="background-color: #f5f5f5;">
            </div>
            <div class="clr-col-lg-4">
              <label>Call Time: <span style="font-weight: bolder; color: red;">*</span></label>
              <input type="time" name="callTime" [(ngModel)]="callTime" required style="background-color: #f5f5f5;">
            </div>
          </div>
          <div class="clr-row" style="margin-top: 10px;">
            <div class="clr-col-lg-6">
              <label>Call Duration (minutes):</label>
              <input type="number" name="callDuration" [(ngModel)]="callDuration" min="0" style="background-color: #f5f5f5;">
            </div>
            <div class="clr-col-lg-6">
              <label>Status: <span style="font-weight: bolder; color: red;">*</span></label>
              <select name="status" [(ngModel)]="status" required>
                <option value="Completed">{{'common.completed' | translate}}</option>
                <option value="Missed">Missed</option>
                <option value="No Answer">No Answer</option>
                <option value="Busy">Busy</option>
              </select>
            </div>
          </div>

          <!-- Section 4: Response Details -->
          <div class="section-header" style="margin-top: 20px;">
            <h4>4. Response Details</h4>
          </div>
          <div class="clr-row">
            <div class="clr-col-lg-6">
              <label>Response Received: <span style="font-weight: bolder; color: red;">*</span></label>
              <select name="responseReceived" [(ngModel)]="responseReceived" required>
                <option value="No">No</option>
                <option value="Yes">Yes</option>
              </select>
            </div>
          </div>
          <div class="clr-row" style="margin-top: 10px;" *ngIf="responseReceived === 'Yes'">
            <div class="clr-col-lg-12">
              <label>Response Details:</label>
              <textarea name="responseDetails" [(ngModel)]="responseDetails" rows="3" style="background-color: #f5f5f5;"></textarea>
            </div>
          </div>

          <!-- Section 5: Followup Details -->
          <div class="section-header" style="margin-top: 20px;">
            <h4>5. Followup Details</h4>
          </div>
          <div class="clr-row">
            <div class="clr-col-lg-6">
              <label>Followup Required: <span style="font-weight: bolder; color: red;">*</span></label>
              <select name="followupRequired" [(ngModel)]="followupRequired" required>
                <option value="No">No</option>
                <option value="Yes">Yes</option>
              </select>
            </div>
            <div class="clr-col-lg-3" *ngIf="followupRequired === 'Yes'">
              <label>Followup Date:</label>
              <input type="date" name="followupDate" [(ngModel)]="followupDate" style="background-color: #f5f5f5;">
            </div>
            <div class="clr-col-lg-3" *ngIf="followupRequired === 'Yes'">
              <label>Followup Time:</label>
              <input type="time" name="followupTime" [(ngModel)]="followupTime" style="background-color: #f5f5f5;">
            </div>
          </div>
          <div class="clr-row" style="margin-top: 10px;">
            <div class="clr-col-lg-12">
              <label>Remarks:</label>
              <textarea name="remarks" [(ngModel)]="remarks" rows="3" style="background-color: #f5f5f5;"></textarea>
            </div>
          </div>

          <!-- Submit Buttons -->
          <div class="clr-row" style="margin-top: 30px; text-align: right;">
            <div class="clr-col-lg-12">
              <button type="button" class="btn btn-outline" (click)="cancel()">{{'common.cancel' | translate}}</button>
              <button type="submit" class="btn btn-primary" style="margin-left: 10px;">{{'common.update' | translate}}</button>
            </div>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
