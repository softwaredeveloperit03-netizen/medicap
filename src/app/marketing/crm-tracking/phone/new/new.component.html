<div class="container-fluid">
  <div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue; margin-top: -2px; text-align: left;">
          New Phone Call Tracking
        </div>
        <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/marketing/crmTracking" style="background-color: red; color: white;">
            CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #phoneForm="ngForm" (ngSubmit)="saveBasicInfo(phoneForm)">
          
          <!-- Section 1: Classification -->
          <div class="section-header">
            <h4>1. Classification</h4>
          </div>
          <div class="clr-row">
            <div class="clr-col-lg-12">
              <label>Classification: <span style="font-weight: bolder; color: red;">*</span></label>
              <select name="classification" [(ngModel)]="classification" required>
                <option value="">Select Classification</option>
                <option value="Domestic">Domestic</option>
                <option value="Export">Export</option>
              </select>
            </div>
          </div>

          <!-- Section 2: Client Details -->
          <div class="section-header" style="margin-top: 20px;">
            <h4>2. Client Details</h4>
          </div>
          <div class="clr-row">
            <div class="clr-col-lg-6">
              <label>Client Name: <span style="font-weight: bolder; color: red;">*</span></label>
              <input type="text" name="clientName" [(ngModel)]="clientName" required style="background-color: #f5f5f5;">
            </div>
            <div class="clr-col-lg-6">
              <label>Contact Person: <span style="font-weight: bolder; color: red;">*</span></label>
              <input type="text" name="contactPerson" [(ngModel)]="contactPerson" required style="background-color: #f5f5f5;">
            </div>
          </div>
          <div class="clr-row" style="margin-top: 10px;">
            <div class="clr-col-lg-6">
              <label>Phone Number: <span style="font-weight: bolder; color: red;">*</span></label>
              <input type="tel" name="phoneNumber" [(ngModel)]="phoneNumber" required style="background-color: #f5f5f5;">
            </div>
            <div class="clr-col-lg-6">
              <label>Email ID:</label>
              <input type="email" name="emailId" [(ngModel)]="emailId" style="background-color: #f5f5f5;">
            </div>
          </div>
          <div class="clr-row" style="margin-top: 10px;">
            <div class="clr-col-lg-6">
              <label>Website:</label>
              <input type="url" name="website" [(ngModel)]="website" placeholder="https://example.com" style="background-color: #f5f5f5;">
            </div>
            <div class="clr-col-lg-6">
              <label>Country:</label>
              <select name="country" [(ngModel)]="country">
                <option value="">Select Country</option>
                <option *ngFor="let country of countries" [value]="country">{{ country }}</option>
              </select>
            </div>
          </div>
          <div class="clr-row" style="margin-top: 10px;">
            <div class="clr-col-lg-6">
              <label>State:</label>
              <input type="text" name="state" [(ngModel)]="state" style="background-color: #f5f5f5;">
            </div>
            <div class="clr-col-lg-6">
              <label>Place:</label>
              <input type="text" name="place" [(ngModel)]="place" style="background-color: #f5f5f5;">
            </div>
          </div>

          <!-- Submit Buttons -->
          <div class="clr-row" style="margin-top: 30px; text-align: right;">
            <div class="clr-col-lg-12">
              <button type="button" class="btn btn-outline" (click)="cancel()">{{'common.cancel' | translate}}</button>
              <button type="submit" class="btn btn-primary" style="margin-left: 10px;">Save & Continue</button>
            </div>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
