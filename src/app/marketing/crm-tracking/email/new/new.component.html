<div class="container-fluid email-new-page">
  <div class="card email-new-card">
    <div class="card-header">
      <div class="clr-row header-row">
        <div class="clr-col-9 title-col">New Email Tracking</div>
        <div class="clr-col-lg-3 action-col">
          <button type="button" class="btn btn-sm btn-close" routerLink="/marketing/crmTracking">CLOSE</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #emailForm="ngForm" class="email-form" (ngSubmit)="saveEmail(emailForm)">

          <section class="form-section">
            <h4 class="section-title">1. Classification</h4>
            <div class="clr-row">
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 form-field">
                <label for="classification">Classification <span class="required-asterisk">*</span></label>
                <select id="classification" name="classification" [(ngModel)]="classification" required>
                  <option value="">Select Classification</option>
                  <option value="Domestic">Domestic</option>
                  <option value="Export">Export</option>
                </select>
              </div>
            </div>
          </section>

          <section class="form-section">
            <h4 class="section-title">2. Client Details</h4>
            <div class="clr-row">
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 form-field">
                <label for="clientName">Client Name <span class="required-asterisk">*</span></label>
                <input id="clientName" type="text" name="clientName" [(ngModel)]="clientName" required>
              </div>
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 form-field">
                <label for="contactPerson">Contact Person <span class="required-asterisk">*</span></label>
                <input id="contactPerson" type="text" name="contactPerson" [(ngModel)]="contactPerson" required>
              </div>
            </div>

            <div class="clr-row">
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 form-field">
                <label for="emailId">Email ID <span class="required-asterisk">*</span></label>
                <input id="emailId" type="email" name="emailId" [(ngModel)]="emailId" required>
              </div>
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 form-field">
                <label for="alternateEmail">Alternate Email</label>
                <input id="alternateEmail" type="email" name="alternateEmail" [(ngModel)]="alternateEmail" placeholder="Optional alternate email">
              </div>
            </div>

            <div class="clr-row">
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 form-field">
                <label for="phoneNumber">Phone Number</label>
                <input id="phoneNumber" type="tel" name="phoneNumber" [(ngModel)]="phoneNumber" placeholder="Primary phone number">
              </div>
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 form-field">
                <label for="alternatePhone">Alternate Phone</label>
                <input id="alternatePhone" type="tel" name="alternatePhone" [(ngModel)]="alternatePhone" placeholder="Optional alternate phone">
              </div>
            </div>

            <div class="clr-row">
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 form-field">
                <label for="website">Website</label>
                <input id="website" type="url" name="website" [(ngModel)]="website" placeholder="https://example.com">
              </div>
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 form-field">
                <label for="country">Country</label>
                <select id="country" name="country" [(ngModel)]="country">
                  <option value="">Select Country</option>
                  <option *ngFor="let c of countries" [value]="c">{{ c }}</option>
                </select>
              </div>
            </div>

            <div class="clr-row">
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 form-field">
                <label for="state">State</label>
                <input id="state" type="text" name="state" [(ngModel)]="state">
              </div>
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 form-field">
                <label for="place">Place</label>
                <input id="place" type="text" name="place" [(ngModel)]="place">
              </div>
            </div>
          </section>

          <section class="form-section">
            <h4 class="section-title">3. HR Remark</h4>
            <div class="clr-row">
              <div class="clr-col-lg-12 form-field">
                <label for="hrRemark">HR Remark</label>
                <textarea
                  id="hrRemark"
                  name="hrRemark"
                  rows="4"
                  [(ngModel)]="hrRemark"
                  placeholder="Enter HR remark or internal notes (optional)"
                ></textarea>
              </div>
            </div>
          </section>

          <div class="form-actions">
            <button type="button" class="btn btn-outline" (click)="cancel()">{{ 'common.cancel' | translate }}</button>
            <button type="submit" class="btn btn-primary">{{ 'common.save' | translate }}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
