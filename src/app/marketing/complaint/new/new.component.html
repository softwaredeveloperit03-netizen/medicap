<div class="container-fluid complaint-new">
  <div class="card complaint-card">
    <div class="card-header">
      <div class="clr-row header-row">
        <div class="clr-col-9 title-col">New Complaint</div>
        <div class="clr-col-lg-3 action-col">
          <button type="button" class="btn btn-sm btn-close" routerLink="/marketing/complaint">
            <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #FormData="ngForm" class="complaint-form">
          <div class="clr-row form-row">
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12 form-col">
              <label for="complaint-plant">Plant Name <span class="required-asterisk">*</span></label>
              <select id="complaint-plant" name="plantID" [(ngModel)]="plantID" required (change)="getproductlist()" aria-label="Plant Name">
                <option value=""></option>
                <option *ngFor="let plant of plants" [value]="plant.plant_id">{{ plant.display_name }}</option>
              </select>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12 form-col">
              <label for="complaint-client">Client Name <span class="required-asterisk">*</span></label>
              <select id="complaint-client" name="client_code" [(ngModel)]="client_code" required aria-label="Client Name">
                <option value=""></option>
                <option *ngFor="let client of clients" [value]="client.client_code">
                  {{ client.LglNm || client.TrdNm }} ({{ client.client_code }})
                </option>
              </select>
              <span class="field-hint" *ngIf="clients?.length === 0">No active clients found.</span>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12 form-col">
              <label for="complaint-nature">Nature Of Complaint <span class="required-asterisk">*</span></label>
              <select id="complaint-nature" [(ngModel)]="complaint" name="complaint_nature" required aria-label="Nature Of Complaint">
                <option value=""></option>
                <option value="Product Related complaint">Product Related complaint</option>
                <option value="Packing Related complaint">Packing Related complaint</option>
                <option value="Quantity Missing">Quantity Missing</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12 form-col">
              <label for="complaint-date">Date Of Complaint <span class="required-asterisk">*</span></label>
              <input id="complaint-date" ngModel name="complaint_date" type="date" required aria-label="Date Of Complaint">
            </div>
          </div>
          <div class="clr-row form-row" *ngIf="complaint === 'Product Related complaint'">
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12 form-col">
              <label for="complaint-product">Name Of Product <span class="required-asterisk">*</span></label>
              <select id="complaint-product" name="product_name" [(ngModel)]="product_name" required aria-label="Name Of Product">
                <option value=""></option>
                <option *ngFor="let cli of products" [value]="cli.product_name">{{ cli.product_name }} ( {{ cli.plant_name }} )</option>
              </select>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12 form-col">
              <label for="complaint-batch">Medicap Lot No <span class="required-asterisk">*</span></label>
              <input id="complaint-batch" type="text" name="batch_no" ngModel required aria-label="Medicap Lot No">
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12 form-col">
              <label for="complaint-mfg">Mfg Date</label>
              <input id="complaint-mfg" ngModel name="mfg_date" type="date" aria-label="Mfg Date">
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12 form-col">
              <label for="complaint-exp">Expiry Date</label>
              <input id="complaint-exp" ngModel name="exp_date" type="date" aria-label="Expiry Date">
            </div>
          </div>
          <div class="clr-row form-row">
            <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12 form-col">
              <label for="complaint-desc">Complaint Description</label>
              <textarea id="complaint-desc" name="complaint_description" rows="3" ngModel aria-label="Complaint Description"></textarea>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button type="button" class="btn btn-primary" (click)="saveComplaint(FormData)">{{'common.submit' | translate}}</button>
    </div>
  </div>
</div>
