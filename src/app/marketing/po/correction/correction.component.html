<div class="card">
  <div class="card-header">
    <div class="clr-row header-row">
      <div class="clr-col-lg-6 header-title">FO Status Log</div>
      <div class="clr-col-lg-6 header-actions">
        <button type="button" class="btn btn-sm btn-close" routerLink="/marketing/po">CLOSE</button>
      </div>
    </div>
  </div>
  
  <div class="card-block">
    <!-- Status Log Table -->
    <div class="section-card">
        <div class="section-body">
            <div class="table-responsive">
              <table class="table table-border status-log-table">
                <thead>
                  <tr>
                    <th>Sr</th>
                    <th>Order No</th>
                    <th>Client Name</th>
                    <th>PO No</th>
                    <th>Product Name</th>
                    <th>Exp. Shipment Date</th>
                    <th>Order Status</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let pending of pendingpo; let i = index" [ngStyle]="{'background-color': materialCodeColors[pending.product_code]}">
                    <td class="font-bold">{{ i + 1 }}</td>
                    <td class="font-bold">{{ pending.order_no }}</td>
                    <td class="font-bold">{{ pending.TrdNm }}</td>
                    <td class="font-bold">{{ pending.po_no }}</td>
                    <td class="font-bold">{{ pending.product_name }}</td>
                    <td class="font-bold">
                      <span class="status-badge" [ngClass]="getStatusClass(pending.rem_days)">
                        {{ getStatusText(pending.rem_days) }}
                      </span>
                    </td>
                    <td class="font-bold">{{ pending.orderStatus || 'Pending' }}</td>
                  </tr>
                  <tr *ngIf="pendingpo?.length === 0">
                    <td colspan="7" class="no-records">No Records Found!</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
    
    </div>
  </div>
</div>
