<div class="dashboard-shell" [style.background]="selectedPalette.background">
  <div class="dash-header">
    <div class="title-block">
      <h2>Revision</h2>
      <p class="subtitle">Test Master – Revision concept applies to all master specifications.</p>
    </div>
    <div class="header-actions">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input
          type="text"
          [(ngModel)]="searchQuery"
          placeholder="Search by name"
          aria-label="Search revision modules"
        />
      </div>
      <a class="close-btn" routerLink="/master/test">
        <i class="fas fa-times"></i>
        Close
      </a>
    </div>
  </div>

  <h3 class="section-label">Revision Section</h3>
  <div class="tiles-grid">
    <a
      *ngFor="let card of filteredCards; trackBy: trackByCardId"
      class="tile-card"
      [routerLink]="card.route"
      [ngStyle]="{'box-shadow': selectedPalette.cardShadow}"
    >
      <div class="icon-wrap" [style.background]="card.gradient">
        <i class="fas" [ngClass]="card.icon"></i>
      </div>
      <div class="tile-body">
        <div class="tile-title">{{ card.title }}</div>
        <p class="tile-description" *ngIf="card.description">{{ card.description }}</p>
      </div>
    </a>

    <div class="empty-state" *ngIf="filteredCards.length === 0">
      <i class="fas fa-search"></i>
      <p>No modules match your search.</p>
    </div>
  </div>

  <button class="palette-fab" type="button" (click)="togglePalette()" title="Change theme" aria-label="Change theme">
    <i class="fas fa-palette"></i>
  </button>

  <div class="palette-drawer" *ngIf="showPalette">
    <div
      *ngFor="let palette of paletteOptions"
      class="palette-chip"
      [class.active]="palette === selectedPalette"
      [style.background]="palette.background"
      (click)="setPalette(palette)"
    >
      <span>{{ palette.name }}</span>
    </div>
  </div>
</div>
