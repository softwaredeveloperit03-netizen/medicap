<div class="container-fluid qc-master-page">
<div class="card test-form-card qc-master-dashboard-card">
  <div class="card-header">
    <div class="test-form-header-row">
      <div class="test-form-title">New Test Master</div>
      <div class="test-form-header-actions">
        <button type="button" class="btn btn-sm btn-danger" routerLink="/master/test">{{'common.close' | translate}}</button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <div class="card-text">
      <div class="test-form-section">
        <label for="standard-template">Load Standard Template</label>
        <select id="standard-template" class="test-form-control" [(ngModel)]="selectedTemplateIndex" (ngModelChange)="applyStandardTemplate($event)" name="standardTemplate">
          <option [ngValue]="-1">— Select a standard test —</option>
          <option *ngFor="let tpl of standardTemplates; let idx = index" [ngValue]="idx">
            {{ tpl.testCode }} — {{ tpl.test }} ({{ tpl.subtestList.length }} subtests)
          </option>
        </select>
      </div>

      <form #testForm="ngForm" class="test-form-grid">
        <div class="test-form-field">
          <label for="test-type">Test Type <span class="req">*</span></label>
          <select id="test-type" name="test_type" [(ngModel)]="formModel.test_type" required class="test-form-control">
            <option *ngFor="let type of testType" [value]="type.value">{{ type.label }}</option>
          </select>
        </div>
        <div class="test-form-field">
          <label for="test-name">Test <span class="req">*</span></label>
          <input id="test-name" type="text" name="test" [(ngModel)]="formModel.test" required class="test-form-control" placeholder="Enter test name">
        </div>
        <div class="test-form-field">
          <label for="test-code">Test Code <span class="req">*</span></label>
          <input id="test-code" type="text" name="testCode" [(ngModel)]="formModel.testCode" required class="test-form-control" placeholder="e.g. TM-001">
        </div>
      </form>

      <div class="test-subtest-section">
        <h4 class="test-subtest-heading">Subtests</h4>
        <form #data="ngForm" class="test-subtest-add-row">
          <input type="text" name="subtest" ngModel required class="test-form-control" placeholder="Enter subtest name">
          <button type="button" class="btn btn-sm btn-success" (click)="addSubtest(data)">{{'common.add' | translate}}</button>
        </form>
        <table class="test-subtest-table">
          <thead>
            <tr>
              <th>{{'common.table.srNo' | translate}}</th>
              <th>Subtest</th>
              <th>{{'common.table.action' | translate}}</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of subtestList; let i = index">
              <td>{{ i + 1 }}</td>
              <td>{{ item.subtest }}</td>
              <td>
                <button type="button" class="btn btn-sm btn-link test-trash-btn" (click)="deletesubtest(i)" title="Remove">
                  <clr-icon shape="trash" class="is-error"></clr-icon>
                </button>
              </td>
            </tr>
            <tr *ngIf="!subtestList.length">
              <td colspan="3" class="test-empty-row">Add at least one subtest.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="card-footer test-form-footer">
    <button type="button" class="btn btn-success" (click)="addTest(testForm)">{{'common.submit' | translate}}</button>
    <button type="button" class="btn btn-danger" routerLink="/master/test">{{'common.close' | translate}}</button>
  </div>
</div>
</div>
