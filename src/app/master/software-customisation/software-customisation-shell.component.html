<div class="sc-shell">
  <header class="sc-header">
    <div class="sc-header__title-block">
      <h2 class="sc-header__title">Software Customisation</h2>
      <p class="sc-header__subtitle">Material master, specifications, receiving forms, software type and MOA type</p>
    </div>
    <button
      class="btn btn-sm btn-danger sc-header__close"
      type="button"
      [routerLink]="['/master']"
      [queryParams]="{ dept: deptId }"
    >
      CLOSE
    </button>
  </header>

  <nav class="sc-tabs" aria-label="Software customisation sections">
    <a
      *ngFor="let tab of tabs; trackBy: trackByTabId"
      class="sc-tab"
      [routerLink]="tab.route"
      routerLinkActive="sc-tab--active"
      [routerLinkActiveOptions]="{ exact: false }"
    >
      <i class="fas" [ngClass]="tab.icon" aria-hidden="true"></i>
      <span>{{ tab.label }}</span>
    </a>
  </nav>

  <section class="sc-content">
    <router-outlet></router-outlet>
  </section>
</div>
