<div class="card softtype-card">
  <div class="card-header softtype-header">
    <div class="softtype-header__row">
      <div class="softtype-header__title">Form Customisation — Software Type</div>
      <button class="btn btn-sm btn-danger" routerLink="/master">CLOSE</button>
    </div>
  </div>

  <div class="card-block softtype-block">
    <div class="card-text">
      <form class="softtype-form">
        <div class="clr-row">
          <div class="clr-col-lg-4 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
            <label>Select Type <span style="color: red">*</span></label>
            <select
              [(ngModel)]="selectedType"
              (ngModelChange)="onTypeChange($event)"
              name="software_type"
              [disabled]="isLocked || loading"
              required
            >
              <option value=""></option>
              <option *ngFor="let opt of typeOptions" [value]="opt">{{ opt }}</option>
            </select>
            <small class="softtype-note" *ngIf="isLocked">Selection is frozen. Use Change Type with password to modify.</small>
            <small class="softtype-note" *ngIf="!isLocked">Selecting Formulation/API will auto-freeze the value.</small>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="card-footer softtype-footer">
    <button class="btn btn-warning" (click)="openUnlockPopup()" [disabled]="loading || !isLocked">CHANGE TYPE</button>
    <button class="btn btn-danger" routerLink="/master">CLOSE</button>
  </div>
</div>

<clr-modal [(clrModalOpen)]="isPasswordModalOpen" [clrModalClosable]="false">
  <h3 class="modal-title">Verify Password</h3>
  <div class="modal-body">
    <label>User Password <span style="color: red">*</span></label>
    <input type="password" [(ngModel)]="password" name="password_verify" autocomplete="off" />
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-primary" (click)="verifyAndUnlock()">VERIFY</button>
    <button type="button" class="btn btn-outline" (click)="isPasswordModalOpen = false">CANCEL</button>
  </div>
</clr-modal>
