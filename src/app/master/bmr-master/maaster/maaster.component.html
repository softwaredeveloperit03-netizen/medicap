<div class="dashboard-shell">
  <div class="dash-header">
    <div class="title-block">
      <h2>BMR Master</h2>
      <p class="subtitle">Select a section to continue</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-sm btn-close" type="button" routerLink="/master">CLOSE</button>
    </div>
  </div>

  <div class="tiles-grid">
    <a class="tile-card" routerLink="/master/bmr-master/process">
      <div class="icon-wrap">
        <i class="fas fa-project-diagram" aria-hidden="true"></i>
      </div>
      <div class="tile-body">
        <div class="tile-title">Process Type Master</div>
        <p class="tile-description">Manage process types and stage mapping</p>
      </div>
    </a>

    <a class="tile-card" routerLink="/master/bmr-master/bmrdash">
      <div class="icon-wrap">
        <i class="fas fa-clipboard-list" aria-hidden="true"></i>
      </div>
      <div class="tile-body">
        <div class="tile-title">BMR/PI Master</div>
        <p class="tile-description">Open BMR and PI master dashboard</p>
      </div>
    </a>
  </div>
</div>
