<div class="card" *ngIf="!isView">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;"> Process Step Master</div>
      <div class="clr-col-lg-5" style="text-align: right;padding-right: 0px;margin-top: -7px;">
         <button class="btn btn-sm btn-success" routerLink="new"    *ngIf="isuser == 'Yes'">NEW PROCESS STEP</button>
        <button class="btn btn-sm btn-danger" routerLink="/master/bmr-master">CLOSE</button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <div class="card-text">
      <table class="table">
        <tr>
            <th style="text-align:left">Sr</th>
            <th style="text-align:left">Dosage Form</th>
            <th style="text-align:left">Process Type</th>
            <!-- <th style="text-align:left">Stage</th> -->
            <th style="text-align:left">Action</th>
        </tr>
        <tr *ngFor='let result of results;let i=index'>
            <td style="text-align:left">{{i + 1}}</td>
            <td style="text-align:left">{{result.dosage_form}}</td>
            <td style="text-align:left">{{result.process_type}}</td>
            <!-- <td style="text-align:left">{{result.stage}}</td> -->
            <!-- <td style="padding: 0px;">
              <table class="table" style="margin-top: 0px;">
                <th style="text-align: left;">Stage</th>
                <th style="text-align: left;">Step</th>
                <tr *ngFor="let stage of result['stages']">
                  <td style="text-align: left;">{{ stage.stage }}</td>
                  <td style="text-align: left;">{{ stage.step }}</td>
                </tr>
              </table>
            </td> -->
            <td style="text-align:left">
              <button class="btn btn-sm btn-info" (click)="view(i)">View</button>
            </td>
        </tr>

      </table>
    </div>
  </div>
</div>

<div class="card" *ngIf="isView">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Process Step Master</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm"(click)="isView=false"style="background-color: red;color: white;">
              <clr-icon shape="window-close" class="is-solid"></clr-icon> CLOSE
            </button>
          </div>
        </div>
      </div>
    <div class="card-block">
      <div class="pdf-container" *ngFor="let data of selectresult['stages']; let i = index">
        <div class="stage-block">
          <h3 class="stage-title">Stage {{ i + 1 }}: {{ data.stage }}</h3>

          <div class="step-list">
            <div *ngFor="let res of data['steps']; let j = index">
              <div class="step-title">Step {{ j + 1 }}: {{ res.step }}</div>

              <div class="substep-list">
                <div *ngFor="let sub of res['Substeps']; let k = index">
                  {{ j + 1 }}.{{ k + 1 }} {{ sub.Substep }}
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>


    </div>

</div>
