<div class="full-page-container">
  <div class="card">
    <div class="card-header" style="display:flex; align-items:center; justify-content:space-between;">
  <h4 style="color:white; margin:0;">Line Master</h4>
  <button class="btn btn-sm btn-danger"
          routerLink="/master/linemaster"
          style="display:inline-flex; align-items:center; justify-content:center;">
    CLOSE
  </button>
</div>
    <div class="card-body">
      <form (ngSubmit)="saveLine()" #lineForm="ngForm">
        <div class="form-group">
          <label for="lineName">Line</label>
          <input 
            type="text" 
            class="form-control" 
            id="lineName" 
            name="lineName"
            [(ngModel)]="lineName"
            required
            placeholder="Enter line name">
        </div>
        <button 
          type="submit" 
          class="btn btn-primary"
          [disabled]="!lineForm.valid || !lineName.trim() || isLoading">
          <span *ngIf="!isLoading">Save</span>
          <span *ngIf="isLoading">Saving...</span>
        </button>
      </form>

      <div class="table-container" *ngIf="savedLines.length > 0 || isLoading">
        <div *ngIf="isLoading && savedLines.length === 0" class="loading-message">
          Loading lines...
        </div>
        <table *ngIf="savedLines.length > 0" class="table table-bordered table-striped">
          <thead>
            <tr>
              <th>Sr. No.</th>
              <th>Line Name</th>
              <th>{{'common.table.action' | translate}}</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let line of savedLines; let i = index">
              <td>{{ i + 1 }}</td>
              <td>{{ line.line_name || line.name }}</td>
              <td>
                <button 
                  class="btn btn-sm btn-danger" 
                  (click)="deleteLine(line)"
                  [disabled]="isLoading">
                  Delete
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
