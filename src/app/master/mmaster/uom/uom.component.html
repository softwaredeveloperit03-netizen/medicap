<div class="card" >
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;">Unit Of Measurement</div>
        <div class="clr-col-lg-5" style="text-align: right;padding-right: 0px;margin-top: -7px;">
           <button class="btn btn-sm btn-danger" routerLink="/master">Close </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #uomForm="ngForm">
            <table class="table table-border">
                <tr>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.table.srNo' | translate}}</th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Unit Of Measurement <span style="color: red;"><strong>*</strong></span></th>
                    <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.table.action' | translate}}</th>
                </tr>
                <tr>
                    <td>1.</td>
                    <td style="padding: 0px;">
                        <input type="text" name="unit" [(ngModel)]="unit" required (input)="unit = unit.toUpperCase()">
                    </td>
                    <td style="padding: 0px; vertical-align: middle;">
                        <button class="btn btn-sm  btn-info" (click)="saveUnit(uomForm)">{{'common.save' | translate}}</button>
                    </td>
                </tr>
            </table>
        </form>
        <div class="datagrid-wrapper">
            <clr-datagrid [clrDgLoading]="loading" >
                <clr-dg-column>{{'common.table.srNo' | translate}}</clr-dg-column>
                <clr-dg-column clrDgField="unit">{{'common.unit' | translate}}</clr-dg-column>
                <clr-dg-row *clrDgItems="let result of units; let i = index" [clrDgItem]="result">
                    <clr-dg-cell>{{i+1}}</clr-dg-cell>
                    <clr-dg-cell>{{result.unit }}</clr-dg-cell>
                </clr-dg-row>
            </clr-datagrid>
        </div>
      </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-danger" routerLink="/master">{{'common.close' | translate}}</button> 
    </div>
</div>
