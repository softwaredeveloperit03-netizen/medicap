<div class="card" >
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;">FG Type</div>
        <div class="clr-col-lg-5" style="text-align: right;padding-right: 0px;margin-top: -7px;">
           <button class="btn btn-sm" routerLink="/master/product/new-formulation-list" style="background-color: red;color: white;">
            {{'common.close' | translate}} </button>
        </div>
      </div>
    </div>
    <div class="card-block">
  
            <div  class="card-text">
                <form #fgStockForm="ngForm">
                    <div class="clr-row">
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                            <label>Product Nature : <span style="color: red;"><b>*</b></span></label>
                            <select name="product_nature" ngModel required>
                                <option>SOLID</option>
                                <option>LIQUID</option>
                                <option>SEMI SOLID</option>
                                <option>GASES</option>
                            </select>
                        </div>
        
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                            <label>Dosage Form : <span style="color: red;"><b>*</b></span></label>
                            <input type="text" name="dosage_form_type" ngModel required>
                        </div>

                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                            <label>Category Code : <span style="color: red;"><b>*</b></span></label>
                            <input type="text" name="catCode" ngModel required>
                        </div>
        
                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                            <label>Sampling Qty : <span style="color: red;"><b>*</b></span></label>
                            <select name="fg_sampling_qty" ngModel required>
                                <option>Test Specific</option>
                                <option>Fixed</option>
                            </select>
                        </div>

                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                            <label>Control/ Reserve Sample : <span style="color: red;"><b>*</b></span></label>
                            <select name="fg_control_reserve_type" [(ngModel)]="fg_control_reserve_type" required>
                                <option>Applicable</option>
                                <option>Not Applicable</option>
                            </select>
                        </div>

                        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="fg_control_reserve_type=='Applicable'">
                            <label>Control/ Reserve Sample Criteria : <span style="color: red;"><b>*</b></span></label>
                            <select name="fg_control_sample_criteria" ngModel required>
                                <option>Two Times (of single analysis)</option>
                                <option>Three Times (of single analysis)</option>
                            </select>
                        </div>

                    </div>
                </form>
                <div class="card-footer"><button class="btn btn-primary" (click)="saveFgData(fgStockForm)">{{'common.save' | translate}}</button>
                </div>
            </div>

            <div  class="card-text datagrid-wrapper">
                <clr-datagrid [clrDgLoading]="loading" >
        
                    <clr-dg-column>Sr No. </clr-dg-column>
                    <clr-dg-column >Product Nature</clr-dg-column>
                    <clr-dg-column >Dosage Form </clr-dg-column>
                    <clr-dg-column>Category Code </clr-dg-column>
                    <clr-dg-column >Sampling Qty.</clr-dg-column>
                    <clr-dg-column >Control/Reserve Sample </clr-dg-column>
                    <clr-dg-column>Action</clr-dg-column>
                    <clr-dg-row *clrDgItems="let crit of fg_api_products;let i=index" [clrDgItem]="crit">
                        <clr-dg-cell>{{i+1}}</clr-dg-cell>
                        <clr-dg-cell>{{crit.product_nature}}</clr-dg-cell>
                        <clr-dg-cell>{{crit.dosage_form_type}}</clr-dg-cell>
                        <clr-dg-cell>{{crit.catCode}}</clr-dg-cell>
                        <clr-dg-cell>{{crit.fg_sampling_qty || 'NA'}}</clr-dg-cell>
                        <clr-dg-cell>{{crit.fg_control_reserve_type || 'NA'}}</clr-dg-cell>
                        <clr-dg-cell>
                          <button type="button" class="btn btn-sm btn-danger" (click)="deleteFgType(crit)">Delete</button>
                        </clr-dg-cell>
                     </clr-dg-row>
                </clr-datagrid>
            </div>
         
    </div>
    <div class="card-footer">
        <button class="btn btn-danger" routerLink="/master/product/new-formulation-list">{{'common.close' | translate}}</button> 
    </div>
</div>
