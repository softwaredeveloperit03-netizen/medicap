<div class="card" >
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;">Grade</div>
        <div class="clr-col-lg-5" style="text-align: right;padding-right: 0px;margin-top: -7px;">
           <button class="btn btn-sm" routerLink="/master" style="background-color: red;color: white;">
            {{'common.close' | translate}} </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">


        
    <form #makeform="ngForm">
        <div class="unique-table-wrapper">
        <table class="table table-border unique-table">
            <tr>
                <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">
                    Sr.No.</th>

                <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">
                    Grade</th>
                <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">
                    Pharmacopoeia  Name</th>
                <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">
                    Grade Code</th>
                <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">
                    Action</th>
            </tr>
            <tr>
                <td>1.</td>
                <td style="padding: 0px;">
                    <input type="text" name="grade" ngModel required #grade="ngModel"
                        style="margin: 0px;height: 33px;">
                </td>
                <td style="padding: 0px;">
                    <input type="text" name="phamacopoeia_name" ngModel #phamacopoeia_name="ngModel"
                        style="margin: 0px;height: 33px;">
                </td>
                <td style="padding: 0px;">
                    <input type="text" name="grade_code" ngModel #phamacopoeia_name="ngModel"
                        style="margin: 0px;height: 33px;">
                </td>

                <td style="padding: 0px; vertical-align: middle;"><button class="btn btn-sm  btn-info"
                        (click)="saveGrade(makeform)">{{'common.save' | translate}}</button></td>
            </tr>

        </table>
    </div>
    </form>

    <div class="datagrid-wrapper">
            <clr-datagrid [clrDgLoading]="loading" >

                <clr-dg-column>{{'common.table.srNo' | translate}}</clr-dg-column>
                <clr-dg-column clrDgField="grade">Grade</clr-dg-column>
                <clr-dg-column clrDgField="phamacopoeia_name">Phamacopoeia Name</clr-dg-column>
                <clr-dg-row *clrDgItems="let result of grades; let i = index" [clrDgItem]="result">
                    <clr-dg-cell>{{i+1}}</clr-dg-cell>
                    <clr-dg-cell>{{result.grade}}</clr-dg-cell>
                    <clr-dg-cell>{{result.phamacopoeia_name || 'NA'}}</clr-dg-cell>

                </clr-dg-row>
                <!-- <clr-dg-footer>
                    <clr-dg-pagination #pagination [clrDgPageSize]="10">
                        <clr-dg-page-size [clrPageSizeOptions]="[10,20,50,100]">Users per page
                        </clr-dg-page-size>
                        {{pagination.firstItem + 1}} - {{pagination.lastItem + 1}}
                        of {{pagination.totalItems}} users
                    </clr-dg-pagination>
                </clr-dg-footer> -->
            </clr-datagrid>
    
        </div>
 
 
      
      </div>
    </div>
    <div class="card-footer">
        <button class="btn btn-danger" routerLink="/master">{{'common.close' | translate}}</button> 
    </div>
</div>
