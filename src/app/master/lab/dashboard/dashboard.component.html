<div class="container-fluid qc-master-page">
  <div class="card qc-master-dashboard-card lab-master-dashboard-card">
    <div class="card-header">
      <div class="qc-dash-header-row">
        <div class="qc-dash-title">Lab Master</div>
        <div class="qc-dash-header-actions lab-dash-header-actions">
          <app-master-excel-provision
            configId="LAB"
            buttonClass="btn btn-sm qc-dash-btn btn-primary"
            (uploaded)="onExcelUploaded()"
          ></app-master-excel-provision>
          <a class="btn btn-sm qc-dash-btn lab-dash-btn-new" routerLink="new">
            <i class="fas fa-plus" aria-hidden="true"></i>
            {{ 'common.new' | translate }}
          </a>
          <button type="button" class="btn btn-sm qc-dash-btn qc-dash-btn-close" routerLink="/master">
            {{ 'common.close' | translate }}
          </button>
        </div>
      </div>
    </div>

    <div class="qc-dash-tabs lab-dash-tabs-line" role="navigation" aria-label="Lab Master actions">
      <div class="lab-dash-tabs-links">
        <a class="qc-dash-tab" routerLink="new" routerLinkActive="qc-dash-tab--active">New</a>
        <a class="qc-dash-tab" routerLink="approval" routerLinkActive="qc-dash-tab--active">Approval</a>
        <a class="qc-dash-tab" routerLink="revision-history" routerLinkActive="qc-dash-tab--active">Revision History</a>
      </div>
      <div class="lab-dash-tabs-tools">
        <div class="lab-dash-search-wrap">
          <i class="fas fa-search" aria-hidden="true"></i>
          <input
            type="search"
            class="lab-dash-search"
            [(ngModel)]="searchTerm"
            (ngModelChange)="onSearchChange($event)"
            placeholder="Search…"
            aria-label="Search labs"
          />
        </div>
        <span class="lab-dash-count">{{ recordCount }} record(s)</span>
      </div>
    </div>

    <div class="card-block qc-master-dashboard-body lab-master-dashboard-body">
      <app-log
        #labLog
        [embedded]="true"
        [externalSearch]="searchTerm"
        (recordCountChange)="recordCount = $event"
      ></app-log>
    </div>
  </div>
</div>
