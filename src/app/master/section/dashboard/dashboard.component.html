<div class="card" *ngIf="!isView">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-lg-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Section Log</div>
      <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        <button class="btn btn-sm btn-success" routerLink="new">{{'common.new' | translate}}</button>
        <button class="btn btn-sm btn-danger" routerLink="/master">{{'common.close' | translate}}</button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <div class="card-text">
      <table class="table table-border">
        <tr>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr.</th>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.department' | translate}}</th>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Room Name</th>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Room Number</th>
        </tr>
        <tr *ngFor="let result of results; let i = index">
          <td style="text-align: left;">{{ i + 1 }}.</td>
          <td style="text-align: left;">{{ result.department }}</td>
          <td style="text-align: left;">{{ result.section_name }}</td>
          <td style="text-align: left;">{{ result.section_number }}</td>
        </tr>
        <tr *ngIf="results?.length == 0">
          <td colspan="4">{{'common.noRecords' | translate}}</td>
        </tr>
      </table>
    </div>
  </div>
  <div class="card-footer"><button class="btn btn-primary" (click)="download()">{{'common.download' | translate}}</button></div>
</div>
