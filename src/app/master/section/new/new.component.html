<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Section</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-danger" routerLink="/master/section">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #sectionForm="ngForm">
          <div class="clr-row">
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Department Name:<span style="color: red">*</span></label>
              <select name="department" ngModel required>
                <option></option>
                <option>Account</option>
                <option>Admin</option>
                <option>Business Development</option>
                <option>EHS</option>
                <option>Engineering</option>
                <option>Human Resource</option>
                <option>IT</option>
                <option>Maintenance</option>
                <option>Production</option>
                <option>Purchase</option>
                <option>Quality Assurance</option>
                <option>Quality Control</option>
                <option>Regulatory</option>
                <option>Product Development</option>
                <option>Material Management</option>
                <option>Management</option>
                <!-- <option *ngFor="let de of departments">{{de.department_name}}</option> -->
              </select>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Floor:<span style="color: red">*</span></label>
              <select name="floor" ngModel required>
                <option></option>
                <option value="Ground">Ground</option>
                <!-- <option value="First">First</option>
                <option value="Second">Second</option>
                <option value="Third">Third</option>
                <option value="Forth">Forth</option> -->
              </select>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Room Name:<span style="color: red">*</span></label>
              <input type="text" name="section_name" ngModel required>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Room detail:<span style="color: red">*</span></label>
              <input type="text" name="room_name" ngModel required>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Room Number:<span style="color: red">*</span></label>
              <input type="text" name="section_number" ngModel required>
            </div>
          </div>
         
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="save(sectionForm)">{{'common.save' | translate}}</button>
    </div>
  </div>
