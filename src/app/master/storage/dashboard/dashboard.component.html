<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-lg-3" style="color: aliceblue;margin-top: -2px;text-align: left;">Storage Condition
                Master</div>
            <div class="clr-col-lg-9" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm btn-danger" routerLink="/master">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <div class="clr-row">
                <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                    <label>Storage Condition:</label>
                        <select name="storage_condition" [(ngModel)]="storage_condition" required (change)="addStorage()">
                            <option></option>
                            <option *ngFor="let storage of storages">{{storage.storage_condition}}</option>
                            <option style="color: red;">Add New</option>
                        </select>
                </div>
            </div>
        </div>
    </div>

    <clr-modal [(clrModalOpen)]="isStorage">
        <h3 class="modal-title">Add New Storage Condtition:</h3>
        <div class="modal-body">
            <form #storageForm="ngForm">
                <div class="clr-row">
                    <div class="clr-col-lg-12">
                        <label>Storage Condition:</label>
                        <input type="text" name="storage_condition" ngModel>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-outline" (click)="saveStorageCondition(storageForm)">{{'common.save' | translate}}</button>
            <button type="button" class="btn btn-danger" (click)="isProductgroup = false">{{'common.close' | translate}}</button>
        </div>
    </clr-modal>
