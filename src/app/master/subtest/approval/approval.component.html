<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-lg-3" style="color: aliceblue;margin-top: -2px;text-align: left;">SubTest For Approval</div>
          <div class="clr-col-lg-9" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/master/subtest" style="background-color: red;color: white;">
             {{'common.close' | translate}} </button>
          </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
            <table class="table">
                <tr>
                  <th style="text-align: left;">Classfication</th>
                  <th style="text-align: left;">{{'common.type' | translate}}</th>
                  <th style="text-align: left;">Test</th>
                  <th style="text-align: left;">Test Type</th>
                  <th style="text-align: left;">Subtest</th>
                  <th style="text-align: left;">{{'common.status' | translate}}</th>
                  <th>{{'common.table.action' | translate}}</th>
                </tr>
                <tr *ngFor="let user of subtests;let i=index">
                  <td style="text-align: left;">{{user.classification}}</td>
                  <td style="text-align: left;">{{user.dosage_form}}</td>
                  <td style="text-align: left;">{{user.test}}</td>
                  <td style="text-align: left;">{{user.test_type}}</td>
                  <td style="text-align: left;">{{user.subtest}}</td>
                  <td style="text-align: left;">{{user.status}}</td>
                  <td>
                    <button class="btn btn-primary btn-sm"(click)="update('approve',user.id)">{{'common.approved' | translate}}</button>
                    <button class="btn btn-danger btn-sm"(click)="update('reject',user.id)">{{'common.reject' | translate}}</button>
                </td>
                </tr>
                <tr *ngIf="subtests?.length==0">
                  <td colspan="7"> No Record found</td>
              </tr>
            </table>
        </div>
    </div>
</div>
