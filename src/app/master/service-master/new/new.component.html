<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Service Entry Form</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm btn-danger" routerLink="/master/service-master">{{'common.close' | translate}}</button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #serviceForm="ngForm">
          <div class="clr-row">
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Department:<span style="color: red">*</span></label>
              <select name="department" ngModel required>
                <option></option>
                <option *ngFor="let data of departments">{{data.department_name}}</option>
              </select>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Service Type : <span style="color: red">*</span></label>
              <select name="service_type" [(ngModel)]="service_type" (change)="editType($event.target.value)" required>
                <option *ngFor="let data of types">{{data}}</option>
                <!-- <option  style="color: red;">ADD NEW</option> -->
              </select>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-4 clr-col-xs-4">
              <label>Service Title : <span style="color: red">*</span></label>
              <input type="text" name="service_title" ngModel required>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Service Code : <span style="color: red">*</span></label>
              <input type="text" name="service_code" ngModel required  >
              </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Service Description : </label>
              <input type="text" name="service_desp" ngModel>
            </div>
            <!-- <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>SAC Code : </label>
              <input type="text" name="sac_code" ngModel required>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>GST :<span style="color: red">*</span></label>
                <select name="tax" ngModel required>
                    <option></option>
                    <option *ngFor="let unit of gsts" value="{{unit.gst}}">{{ unit.gst }} %</option>
                </select>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Entry By:</label>
              <input type="text" name="entry_by" [ngModel]="entryBy" readonly>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Entry Date:</label>
              <input type="date" name="entry_date" [ngModel]="entryDate" readonly>
            </div> -->
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="addService(serviceForm)">{{'common.save' | translate}}</button>
    </div>
  </div>


  <clr-modal [(clrModalOpen)]="isEdit"  [clrModalSize]="'md'">
    <h3 class="modal-title">Add Service Type</h3>
    <div class="modal-body">
        <form #test="ngForm">
            <div class="clr-row">
              <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
                <label>New Type:<span style="color: red">*</span></label>
                <input type="text" name="typeField" ngModel>
              </div>
            </div>
          </form>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-primary" (click)="newType(test)">{{'common.update' | translate}}</button>
      <button type="button" class="btn btn-danger" (click)="isEdit = false">{{'common.cancel' | translate}}</button>
  
    </div>
  </clr-modal>
