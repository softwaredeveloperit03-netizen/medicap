<div class="card">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px">
      <div class="clr-col-9" style="color: aliceblue; margin-top: -2px; text-align: left">
        New Equipment/Instrument Form
      </div>
      <div class="clr-col-lg-3" style="text-align: right; padding-right: 0px; margin-top: -7px">
        <button class="btn btn-sm btn-danger" routerLink="/master/equipments">
          CLOSE
        </button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <div class="card-text">
      <form #equipmentForm="ngForm">
        <div class="clr-row">


          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Equipment/Instrument Category:<sup style="color: red">*</sup></label>
            <select name="equipment_category" [(ngModel)]="equipment_category" required>
              required style="height: 33px;">
              <option></option>
              <option value="Existing">Existing</option>
              <option value="New">New Arrival</option>
              <option value="New Purchase">New Purchase</option>
            </select>
          </div>

          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Equipment/Instrument Type:<span style="color: red">*</span></label>
            <select name="equipment_type" [(ngModel)]="equipment_type" (change)="addNewWquipType($event.target.value)"
              required>
              <option></option>
              <!-- <option>Process Equipment</option>
              <option>Analytical /QC</option>            
              <option>Balance(Weighing)</option>       
              <option>Computers/Printers</option>
              <option>Microscope</option>
              <option>Autoclave</option>
              <option>Sampler</option>
              <option>LAF</option>
              <option>Packaging</option>
              <option>Engineering</option>
              <option>Sampling Equipment</option>
              <option>STABILITY CHEMBER</option>
              <option>Storage</option>
              <option>Vaccum</option>
              <option>Incubator</option> -->
              <option *ngFor="let type of equipment_type_data">{{ type.equipment_type }}</option>

              <option style="color: red;">ADD NEW</option>
            </select>
          </div>

          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Equipment/Instrument Name:<span style="color: red">*</span></label>
            <input type="text" name="equipment_name" ngModel required>
          </div>
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Equipment/Instrument Id:<span style="color: red">*</span></label>
            <input type="text" name="equipment_code" ngModel required>
          </div>


          <!-- <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Select Facility:<sup style="color: red">*</sup></label>
            <select name="facilityCode" ngModel required>
              <option></option>
              <option value="PFS">Pre-filled syringes line</option>
              <option value="LYO">Vial line (solutions and lyophilized products in vial)</option>
              <option value="WH">Warehouse</option>
              <option value="GEN">Admin Block</option>
              <option value="AL">Quality Control (Analytical laboratory)</option>
              <option value="ML">Quality Control (Microbiological laboratory)</option>
              <option value="UT">Engineering / Utility block’s</option>
              <option value="GH">Guest Houses</option>
            </select>
          </div> -->

          <!--
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>3-digit Alphabetic Equipment Code:<span style="color: red">*</span></label>
            <input type="text" name="threeDigitAlphaCode" ngModel required>
          </div>
          -->




          <div *ngIf="equipment_category != 'New Purchase'"
            class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Serial No :</label>
            <input type="text" name="serial_no" ngModel >
          </div>



          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Make:</label>
            <input type="text" name="make" ngModel>
          </div>
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Model:</label>
            <input type="text" name="model" ngModel>
          </div>


          <!-- <div *ngIf="equipment_category != 'New Purchase'"
            class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Department:<sup style="color: red">*</sup></label>
            <select name="department" [(ngModel)]="department" (change)="getSectionsByDept($event.target.selectedIndex)"
              required style="height: 33px">
              <option></option>
              <option *ngFor="let dept of departments">
                {{ dept.department_name }}
              </option>
            </select>
          </div>

          <div *ngIf="equipment_category != 'New Purchase'"
            class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Location:</label>
            <select name="location" ngModel="location">
              <option></option>
              <option *ngFor="let section of sections">
                {{ section.section_name }}
              </option>
            </select>
          </div> -->
          <div *ngIf="equipment_category !== 'New Purchase'"
            class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Department:<sup style="color: red">*</sup></label>
            <select name="department" [(ngModel)]="department" (change)="getSectionsByDept()"
              required style="height: 33px">
              <option [ngValue]="''"></option>
              <option *ngFor="let deptName of allowedDepartmentNames" [ngValue]="deptName">
                {{ deptName }}
              </option>
            </select>
          </div>

          <div *ngIf="equipment_category !== 'New Purchase'"
            class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Location:</label>
            <select name="location" [(ngModel)]="location" required style="height: 33px">
              <option [ngValue]="''"></option>
              <option *ngFor="let section of sections" [ngValue]="section.section_name">
                {{ section.section_name }}
              </option>
            </select>
          </div>


          <div *ngIf="equipment_type == 'Balance(Weighing)'"
            class="clr-col-lg-3 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
            <label>Least Count </label>
            <input type="text" name="least_count" [(ngModel)]="least_count">
          </div>

          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Capacity Applicable:</label>
            <select name="capacity_applicable" [(ngModel)]="capacity_applicable">
              <option>Yes</option>
              <option>No</option>
            </select>
          </div>


          <div *ngIf="capacity_applicable == 'Yes'" class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Min.Capacity:</label>
            <input class="hide-arrow" type="number" name="min_capacity" ngModel  min="0" max="9999" step="0.01">
          </div>
          <div *ngIf="capacity_applicable == 'Yes'" class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Max.Capacity:</label>
            <input class="hide-arrow" type="number" name="capacity" [(ngModel)]="capacity"  min="0" max="9999"
              step="0.01">
          </div>

          <div *ngIf="capacity_applicable == 'Yes'" class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Capacity Unit:</label>
            <select name="capacityUnit" ngModel >
              <option></option>
              <option *ngFor="let unit of units">{{ unit.unit }}</option>
            </select>
          </div>

          <div *ngIf="capacity_applicable == 'Yes'" class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Working From Range:<br></label>
            <input class="hide-arrow" type="number" name="from_range" ngModel="0" max="9999">
          </div>

          <div *ngIf="capacity_applicable == 'Yes'" class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Working To Range:<br></label>
            <input class="hide-arrow" type="number" name="to_range" ngModel="0" max="9999">
          </div>

          <div *ngIf="capacity_applicable == 'Yes'" class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Unit:<span style="color: red">*</span></label>
            <select name="unit" ngModel required>
              <option></option>
              <option *ngFor="let unit of units">{{ unit.unit }}</option>
            </select>
          </div>


          <div *ngIf="equipment_category != 'New Purchase'"
            class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Purchase Date:</label>
            <input type="date" name="purchase_date" [(ngModel)]="purchase_date" [max]="today">
          </div>
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="equipment_category == 'Existing'">
            <label>Installation Date:</label>
            <input type="date" name="installation_date" ngModel [min]="installation_date">
          </div>

          <div *ngIf="equipment_category != 'New Purchase'"
            class="clr-col-lg-3 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
            <label>Date Released for Use:<span style="color: red">*</span></label>
            <input type="date" name="relese_date" [(ngModel)]="relese_date">
          </div>

          <!--
          <div class="clr-col-lg-3 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
            <label>Dimension :</label>
            <input type="text" name="dimension" ngModel>
          </div>
          <div class="clr-col-lg-3 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
            <label>Weight :</label>
            <input type="text" name="weight" ngModel>
          </div>
          -->



        </div>



        <div *ngIf="equipment_category != 'New Purchase'" class="card-header" style="text-align: center">
          <div class="clr-row" style="display: flex; align-items: center;">
            <div class="clr-col-9" style="color: aliceblue; margin-top: -2px; text-align: left">
              Others Information:
            </div>
          </div>
        </div>
        <div *ngIf="equipment_category != 'New Purchase'" class="card-block">
          <div class="card-text">

            <div class="clr-row">
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Preventive Maintenance:</label>
                <select name="preventive_maintenance" [(ngModel)]="preventive_maintenance">
                  <option></option>
                  <option>Applicable</option>
                  <option>Not Applicable</option>
                </select>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Calibration Required:</label>
                <select name="calibration_required" [(ngModel)]="calibration_required">
                  <option></option>
                  <option>Applicable</option>
                  <option>Not Applicable</option>
                </select>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Calibration Type:</label>
                <select name="calibration_type" [(ngModel)]="calibration_type">
                  <option></option>
                  <option>Inhouse</option>
                  <option>External</option>
                </select>
              </div>
              <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Requalification:</label>
                <select name="reqv_required" [(ngModel)]="reqv_required">
                  <option></option>
                  <option>Applicable</option>
                  <option>Not Applicable</option>
                </select>
              </div>
              <div *ngIf="equipment_category != 'New Purchase'"
                class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>SOP No.:</label>
                <input type="text" name="sop_no" ngModel maxlength="40">
              </div>

              <div *ngIf="equipment_category != 'New Purchase'"
                class="clr-col-lg-3 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                <label>Description:</label>
                <input type="text" name="description" [(ngModel)]="description" >
              </div>

              <div *ngIf="equipment_category != 'New Purchase'"
                class="clr-col-lg-3 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                <label>Qualification Status : </label>
                <select name="qualification_status" [(ngModel)]="qualification_status" >
                  <option></option>
                  <option>Applicable</option>
                  <option>Not Applicable</option>
                  <!-- <option>Completed</option>
              <option>Under Qualification</option> -->
                </select>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>


  <div class="card-footer">
    <button class="btn btn-primary" (click)="saveEquipment(equipmentForm)" [disabled]="clicked">
      save
    </button>
  </div>
</div>




<clr-modal [(clrModalOpen)]="isEquipment" [clrModalClosable]="true">
  <h3 class="modal-title">Add New Equipment/Instrument. Type</h3>
  <div class="modal-body">
    <div class="card">
      <div class="card-block">
        <div class="card-text">
          <form #addMaterialForm="ngForm">
            <div class="modal-body">
              <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                <label>Equipment/Instrument. Type<span style="color: red">*</span></label>
                <input type="text" name="equipment_type" ngModel required>
              </div>
            </div>
          </form>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-success" (click)="saveEquipmentType(addMaterialForm)">Submit</button>
      </div>
    </div>
  </div>
</clr-modal>
