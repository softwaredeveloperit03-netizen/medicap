<div class="card">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Change Part</div>
      <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        <button class="btn btn-sm" routerLink="/master/blister" style="background-color: red;color: white;">
          CLOSE
        </button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <div class="card-text">
      <form #blisterForm="ngForm">
        <div class="clr-row">
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>For Equipment : <span style="color: red;"><b>*</b></span></label>
            <select name="machine_name" ngModel required>
              <option></option>
              <option *ngFor="let unit of equipments; let i = index;" [value]="unit.equipment_code">{{ unit.equipment_name }} - {{unit.equipment_code}}</option>
            </select>
          </div>
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Change Part Id : <span style="color: red;"><b>*</b></span></label>
            <input type="text" name="change_part" ngModel required>
          </div>

          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Change Part Name : <span style="color: red;"><b>*</b></span></label>
            <input type="text" name="item_name" ngModel required>
          </div>
     
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Product Specific : <span style="color: red;"><b>*</b></span></label>
                <select name="prodSpecific" [(ngModel)]="prodSpecific" required>
                    <option></option>
                    <option>YES</option>
                    <option>NO</option>
                </select>
          </div>
          
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-4 clr-col-xs-4" *ngIf="prodSpecific == 'YES'">
            <label>Product List : <span style="color: red">*</span></label>
            <select name="product_code" ngModel required>
              <option></option>
              <option *ngFor="let unit of products; let i = index;" [value]="unit.product_code">{{ unit.product_name }} {{ unit.product_code }}</option>
            </select>
          </div>

          <div class="clr-col-12">
            <label>Specification : </label>
            <textarea type="text" name="specification" ngModel></textarea>
          </div>
          <div class="clr-col-12">
            <label>Remark : </label>
            <textarea type="text" name="remark" ngModel></textarea>
          </div>
        </div>
      </form>
    </div>
  </div>
  <div class="card-footer">
    <button class="btn btn-primary" (click)="save(blisterForm)">{{'common.submit' | translate}}</button>
  </div>
</div>
