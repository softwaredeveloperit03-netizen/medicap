<div class="card">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-lg-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Finished Product Entry
        Form </div>
      <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        <button class="btn btn-sm btn-danger" routerLink="/master/product">CLOSE</button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <div class="card-text">
      <form #productForm="ngForm">
        <div class="clr-row">
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Finished Goods Type:<span style="color: red">*</span></label>
            <select name="product_type" ngModel="API" required>
              <option *ngFor="let p of products" [value]="p.dosage_form_type">{{p.dosage_form_type}}
             
            </select>
          </div>
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Product Nature:<span style="color: red">*</span></label>
            <select name="product_nature" ngModel required>
              <option>SOLID</option>
              <option>LIQUID</option>
              <option>SEMI SOLID</option>
              <option>GASES</option>
            </select>
          </div>
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Product Name:<span style="color: red">*</span></label>
            <input type="text" name="product_name" ngModel required #product_name="ngModel" >
            <span style="color: red;" *ngIf="product_name.invalid && product_name.touched">Please Enter Product
              Name!</span>
          </div>
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Product Code:<span style="color: red">*</span></label>
            <input type="text" name="product_code1" ngModel required #product_code="ngModel" >
            <span style="color: red;" *ngIf="product_code.invalid && product_code.touched">Please Enter Product
              Code!</span>
          </div>

          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Grade:<span style="color: red">*</span></label>
            <select name="grade" ngModel required>
              <option></option>
              <option *ngFor="let grade of grades">{{ grade.grade }}</option>
            </select>
          </div>


          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
            <label>Manufactured Under:</label>
            <select name="manufactured_under" ngModel="Own" required (change)="getClients($event.target.value)">
              <option>Own</option>
              <option>Client</option>
            </select>
          </div>

          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12"
            *ngIf="productForm.value.manufactured_under == 'Client'">
            <label>Manufactured For Client:<span style="color: red">*</span></label>
            <select name="manufactured_for" ngModel required>
              <option></option>
              <option *ngFor="let client of clients" value="{{client.client_code}}">{{ client.TrdNm }}</option>
            </select>
          </div>
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12"
            *ngIf="productForm.value.manufactured_under == 'Client'">
            <label>MOQ:<span style="color: red">*</span></label>
            <input type="text" name="moq" [(ngModel)]="moq">

          </div>

          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-4 clr-col-xs-4">
            <label>UOM:<span style="color: red">*</span></label>
            <select name="uom" ngModel required>
              <option></option>
              <option *ngFor="let unit of units">{{ unit.unit }}</option>
            </select>
          </div>
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-4 clr-col-xs-4">
            <label>Alternate UOM:<span style="color: red">*</span></label>
            <select name="alt_uom" ngModel required>
              <option></option>
              <option *ngFor="let unit of units">{{ unit.unit }}</option>
            </select>
          </div>
        </div>
        <div class="clr-row">
          <div class="card">
            <div class="card-header" style="text-align: center">
              <div class="clr-row" style="margin-bottom: -10px;">
                <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;">
                  Other Information</div>
                <div class="clr-col-lg-5" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                  <button class="btn btn-sm btn-info btn-icon" (click)="toggleShow()">
                    <clr-icon shape="eye" class="is-warning"></clr-icon>
                  </button>
                </div>
              </div>
            </div>
            <div class="card-block">
              <div class="row container-fluid">
                <div class="clr-row">
                  <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12" *ngIf="plant_id !=72">
                    <label>CAS Number:</label>
                    <input #cas="ngModel" type="text" name="cas_number" [(ngModel)]="cas_number">
                  </div>
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="plant_id !=72">
                    <label>Structure:</label>
                    <input type="file" [(ngModel)]="structure_file_path" name="structure_file_path" (change)="onFileChanged4($event)"accept="application/pdf">
                  </div>


                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="plant_id !=72">
                    <label>Molecular Weight (gm/mole):</label>
                    <input type="text" name="molecular_weight" [(ngModel)]="molecular_weight">
                  </div>

                  <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12" *ngIf="plant_id !=72">
                    <label>Molecular Formula:</label>
                    <input type="text" name="molecular_formula" [(ngModel)]="molecular_formula" >
                  </div>

                  <div class="clr-col-lg-2 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                    <label>Storage Condition:</label>
                    <select name="storage_condition" [(ngModel)]="storage_condition">
                      <option> </option>
                      <option *ngFor="let s of storage_conditions">{{ s.storage_condition }}</option>
                    </select>
                    <!-- <input type="text" name="storage_condition" [(ngModel)]="storage_condition"> -->
                  </div>



                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Safety Instructions:</label>
                    <input type="text" name="safety_instructions" [(ngModel)]="safety_instructions">
                  </div>

                  <div class="clr-col-lg-3 clr-col-md-2 clr-col-sm-12 clr-col-xs-12">
                    <label>Product Appearance:</label>
                    <select name="product_apperance" [(ngModel)]="product_apperance">
                      <option>Amorphous</option>
                      <option>Crystaline</option>
                      <option>Hydroscopic</option>
                      <option>Inflamable</option>
                      <option>Light Sensitive</option>
                      <option>Other</option>
                    </select>
                  </div>
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Other Description:</label>
                    <input type="text" name="other_description" [(ngModel)]="other_description">
                  </div>
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="plant_id !=72">
                    <label>CE Number:</label>
                    <input type="text" name="ce_number" [(ngModel)]="ce_number">
                  </div>
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Color :</label>
                    <input type="text" name="color_index" [(ngModel)]="color_index">
                  </div>
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>MSDS Upload:</label>
                    <input type="file" name="msds_file_path" [(ngModel)]="msds_file_path"
                      (change)="onFileChanged2($event)" accept="application/pdf">
                  </div>
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Product License :</label>
                    <input type="file" name="product_license_path" [(ngModel)]="product_license_path"
                      (change)="onFileChanged3($event)" accept="application/pdf">
                  </div>
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>who_copp_file:</label>
                    <input type="file" name="who_copp_path" [(ngModel)]="who_copp_path"
                      (change)="onFileChanged4($event)" accept="application/pdf">
                  </div>
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="plant_id !=72">
                    <label>CE Certificate :</label>
                    <input type="file" name="ce_certificate_path" [(ngModel)]="ce_certificate_path"
                      (change)="onFileChanged5($event)" accept="application/pdf">
                  </div>
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Upload Photo:</label>
                    <input type="file" name="photo" [(ngModel)]="photo"
                      (change)="onFileChanged6($event)" accept="application/pdf">
                  </div>


                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6 clr-col-xs-12">
                    <label>QC Lead Time(Days)</label>
                    <input type="number" min="0" name="qc_lead_time" ngModel>
                  </div>
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" *ngIf="plant_id !=72">
                    <label>PKA Value:</label>
                    <input type="text" name="pka_value" [(ngModel)]="pka_value">
                  </div>
                  <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Market Type: </label>
                    <select name="market_type" [(ngModel)]="market_type">
                      <option>Regulatory</option>
                      <option>Non Regulatory</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

  <div class="card-footer">

<clr-modal [(clrModalOpen)]="isGrades" [clrModalSize]="'xl'">
  <h3 class="modal-title">Add Grade</h3>
  <div class="modal-body">
    <form #gradeForm="ngForm">
      <div class="clr-row">
        <div class="clr-col-lg-6 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
          <label>Grade:<span style="color: red">*</span></label>
          <input type="text" name="grade" ngModel required maxlength="15">
        </div>
      </div>
    </form>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-primary" (click)="saveGrades(gradeForm)">Save</button>
    <button type="button" class="btn btn-danger" (click)="isGrades = false">Cancel</button>
  </div>
</clr-modal>
