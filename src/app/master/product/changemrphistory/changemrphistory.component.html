<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;">Change MRP History</div>
        <div class="clr-col-lg-5" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        
          <button class="btn btn-sm" routerLink="/master/product/new-formulation-list" style="background-color: red;color: white;">
            Close </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12" >        
        <input type="text"  name="product_name" ngModel required (input)="getSearchMrp($event.target.value)" placeholder="Enter Product Name or Client Name">         
    </div>
        <table class="table table-border">
          <tr>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Sr No.</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Client Code</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Product Code</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Product Name</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Manufacture Under</th>
            <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">MRP</th>
          </tr>
          <tr *ngFor="let mrp of results; let i=index">
            <td style="text-align: left;">{{i+1}}</td>
            <td style="text-align: left;">{{mrp.client_code || 'NA'}}</td>
            <td style="text-align: left;">{{mrp.product_code}}</td>
            <td style="text-align: left;">{{mrp.product_name}}</td>
            <td style="text-align: left;">{{mrp.manufactured_under}}</td>
            <td style="text-align: left;">{{mrp.mrps}}</td>

  

          </tr>
        </table>
  
      </div>
    </div>
  </div>
