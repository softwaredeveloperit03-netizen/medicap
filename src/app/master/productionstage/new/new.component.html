        <div class="card">
          <div class="card-header" style="background-color: #483285; color: black;">Step</div>
          <div class="card-block">
            <div class="card-text">
              <form #StepForm="ngForm">
                <div class="clr-row">
                  <div class="clr-col-lg-12 clr-col-md-12 clr-col-sm-12 clr-col-xs-12">
                    <label>Step:</label>
                    <input type="text" name="step" [(ngModel)]="step" required>
                  </div>
                </div>
              </form>
              <button class="btn btn-primary" (click)="addStepForm(StepForm)" style="margin-top:30px;background-color: #483285; color: black;">ADD Step</button>

              <div class="card-block" *ngFor="let data of processesSteps; let i = index">
                <div class="card-text">
                  <b>{{ i + 1 }}: {{ data?.step }}</b>
                  <clr-icon
                    shape="trash"
                    class="is-danger cursor-pointer ml-2"
                    (click)="deleteStep(i)">
                  </clr-icon>
                </div>
              </div>
            </div>
          </div>
        </div>



            <button class="btn btn-primary" (click)="add1()" style="margin-top:30px;">ADD Stage</button>


        </div>
    </div>
    <div class="card-block" *ngFor="let data of stageprocesses; let i = index">
      <div class="card-text">
        <b>{{ i + 1 }}: {{ data.stage }}</b>
        <ol>
          <li *ngFor="let res of data.steps; let j = index">
            {{ j + 1 }}: {{ res.step }}
            <clr-icon
              shape="trash"
              class="is-danger cursor-pointer ml-2"
              (click)="deleteStageStep(i, j)">
            </clr-icon>
          </li>
        </ol>
      </div>
    </div>

    
    <div class="card-footer">

      <button class="btn btn-primary" (click)="undo()">
        <clr-icon shape="undo" class="mr-2"></clr-icon> Undo
      </button>

      <button class="btn btn-primary" (click)="redo()">
        <clr-icon shape="redo" class="mr-2"></clr-icon> Redo
      </button>


        <button class="btn btn-primary" (click)="saveProcess()">{{'common.save' | translate}}</button>
        <button class="btn   btn-danger" routerLink="/master/productionstage">{{'common.close' | translate}}</button>
    </div>
</div>
