<div class="card">
    <div class="card-header" style="text-align: center">
      <div class="clr-row" style="margin-bottom: -10px;">
        <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New Standard Master</div>
        <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
          <button class="btn btn-sm" routerLink="/master/standard" style="background-color: red;color: white;">
            CLOSE
          </button>
        </div>
      </div>
    </div>
    <div class="card-block">
      <div class="card-text">
        <form #standardForm="ngForm">
          <div class="clr-row">
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                <label>Material Type:<span style="color: red">*</span></label>
                  <select name="material_type" [(ngModel)]="formData.material_type" required>
                <option>Raw Material</option>
                <option>Packing Material</option>
                <option>Testing Standard</option>
                <option>Microbiology Standard</option>
                <option>Reference Marker</option>
              </select>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Material SubType:<span style="color: red">*</span></label>
              <input type="text" name="material_subtype" [(ngModel)]="formData.material_subtype" required>
          </div>
          <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Standard Name:<span style="color: red">*</span></label>
              <input type="text" name="standard_name" [(ngModel)]="formData.standard_name" required>
          </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Standard Category:<span style="color: red">*</span></label>
              <select name="standard_category" [(ngModel)]="formData.standard_category" required>
                <option>Primary Standard</option>
                <option>Secondary Standard</option>
                <option>Working Standard</option>
                <option>Reference Standard</option>
                <option>Impurity Standard</option>
                <option>Marker Standard</option>
                <option>Culture Standard</option>
              </select>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Material Name:</label>
              <input type="text" name="material_name" [(ngModel)]="formData.material_name">
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Grade:<span style="color: red">*</span></label>
              <select name="grade" [(ngModel)]="formData.grade" required>
                <option> </option>
                 <option  *ngFor="let grade of grades" [ngValue]="grade.grade">
                  {{grade.grade}}
                </option>
              </select>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Marker/Analyte:</label>
              <input type="text" name="analyte_marker" [(ngModel)]="formData.analyte_marker">
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Pharmacopoeia Reference:<span style="color: red">*</span></label>
              <input type="text" name="pharmacopeia_reference" [(ngModel)]="formData.pharmacopeia_reference" required>
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>CAS No:</label>
              <input type="text" name="cas_no" [(ngModel)]="formData.cas_no">
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Potency:</label>
              <input type="text" name="potency" [(ngModel)]="formData.potency">
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Purity:</label>
              <input type="text" name="purity" [(ngModel)]="formData.purity">
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Manufacturer:</label>
              <input type="text" name="manufacturer" [(ngModel)]="formData.manufacturer">
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Catalog No:</label>
              <input type="text" name="catalog_no" [(ngModel)]="formData.catalog_no">
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Medicap Lot No:</label>
              <input type="text" name="batch_no" [(ngModel)]="formData.batch_no">
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Storage Condition:</label>
              <input type="text" name="storage_condition" [(ngModel)]="formData.storage_condition">
            </div>
            <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
              <label>Valid Upto:</label>
              <input type="date" name="valid_upto" [(ngModel)]="formData.valid_upto">
            </div>
            <div class="clr-col-lg-6 clr-col-md-6 clr-col-sm-12 clr-col-xs-12">
              <label>Remarks:</label>
              <textarea name="remarks" [(ngModel)]="formData.remarks"></textarea>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn btn-primary" (click)="saveStandardMaster(standardForm)" [disabled]="standardForm.invalid">{{'common.submit' | translate}}</button>
     <!--  <button class="btn btn-danger" (click)="isNewForm = false">{{'common.close' | translate}}</button> -->
    </div>
  </div>
