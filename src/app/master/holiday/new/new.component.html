<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;">New Holiday Form</div>
            <div class="clr-col-lg-5" style="text-align: right;padding-right: 0px;margin-top: -7px;">

                <button class="btn btn-sm" routerLink="/master/holiday" style="background-color: red;color: white;">
                    {{'common.close' | translate}} </button>
            </div>
        </div>
    </div>
<div class="card-block">
    <div class="card-text">
        <form #holidayForm="ngForm">
            <div class="clr-row">
                
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Holiday Name<span style="color: red;">*</span> </label>
                    <input type="text" name="holiday_name" ngModel required>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Holiday Date<span style="color: red;">*</span></label>
                    <input type="date" name="holiday_date" ngModel required>
                </div>
                <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                    <label>Holiday Type<span style="color: red;">*</span></label>
                    <select name="holiday_type" ngModel required>
                        <option></option>
                        <option>National Holiday</option>
                        <option>Religious Holiday</option>
                    </select>
                </div>
            </div>
        </form>
    </div>
</div>
<div class="card-footer">
    <button class="btn btn-primary" (click)="save(holidayForm)">{{'common.save' | translate}}</button>
    <button class="btn btn-danger" routerLink="/master/holiday">{{'common.close' | translate}}</button>
</div>
</div>
