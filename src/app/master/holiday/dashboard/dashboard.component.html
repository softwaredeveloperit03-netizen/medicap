<div class="card">
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;">Holiday Master</div>
      <div class="clr-col-lg-5" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        <button class="btn btn-sm" routerLink="new" style="background-color:green;color: white;">
          New
        </button>
        <button class="btn btn-sm" routerLink="/master" style="background-color: red;color: white;">
          {{'common.close' | translate}} </button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <div class="card-text">
      <table class="table table-border">
        <tr>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.table.srNo' | translate}}</th>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Holiday Name</th>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Holiday Date</th>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">Holiday Type</th>
          <th style="text-align: left; background-color: rgb(14, 67, 112); color: white;">{{'common.table.action' | translate}}</th>
        </tr>
        <tr *ngFor="let holi of holidays; let i=index">
          <td style="text-align: left;">{{i+1}}</td>
          <td style="text-align: left;">{{holi.holiday_name}}</td>
          <td style="text-align: left;">{{holi.holiday_date |date:'dd-MM-yyyy'}}</td>
          <td style="text-align: left;">{{holi.holiday_type}}</td>


          <td style="text-align: left;">
            <button class="btn btn-sm btn-warning-outline btn-icon" (click)="edit(i)">
              <clr-icon shape="pencil" class="is-warning"></clr-icon>
            </button>
            <button class="btn btn-sm btn-danger-outline btn-icon">
              <clr-icon shape="trash" class="is-error" (click)="delHoliday(holi.id)"></clr-icon>
            </button>
          </td>
        </tr>
      </table>

    </div>
  </div>
  <div class="card-footer"><button class="btn btn-primary" (click)="close()">{{'common.close' | translate}}</button></div>
</div>

<clr-modal [(clrModalOpen)]="isEdit" [clrModalSize]="'xl'">
  <h3 class="modal-title">Edit Holiday List</h3>
  <div class="modal-body">
    <form #holidayForm="ngForm">
      <div class="clr-row">
        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-6 clr-col-xs-12">
          <label>Holiday Name <span style="color: red">*</span></label>
          <input type="text" name="holiday_name" [(ngModel)]="selectedResult['holiday_name']" required>
        </div>
        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
          <label>Holiday Date:<span style="color: red">*</span></label>
          <input type="date" name="holiday_date" [(ngModel)]="selectedResult['holiday_date']" required>
        </div>
        <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
          <label>Holiday Type:<span style="color: red">*</span></label>
          <select name="holiday_type" [(ngModel)]="selectedResult['holiday_type']">
            <option>National Holiday</option>
            <option>Religious Holiday</option>
          </select>
        </div>
      </div>
    </form>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-primary" (click)="editHoliday()">{{'common.update' | translate}}</button>
    <button type="button" class="btn btn-outline" (click)="isEdit = false">{{'common.cancel' | translate}}</button>

  </div>
</clr-modal>
