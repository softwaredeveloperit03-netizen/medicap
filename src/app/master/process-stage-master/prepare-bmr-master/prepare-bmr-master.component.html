<section class="pbmr-page" aria-label="Prepare BMR Master">
  <header class="pbmr-header">
    <div class="pbmr-header__titles">
      <h1 class="pbmr-title">Prepare BMR Master</h1>
      <p class="pbmr-subtitle">Prepare batch manufacturing record templates and prerequisite master data.</p>
    </div>
    <div class="pbmr-header__tools">
      <button type="button" class="btn btn-outline btn-sm" routerLink="/master/process-stage-master">Back</button>
      <button
        type="button"
        class="btn btn-danger btn-sm"
        routerLink="/master"
        [queryParams]="{ dept: deptId }"
      >
        Close
      </button>
    </div>
  </header>

  <div class="pbmr-panel">
    <p class="pbmr-placeholder">Further preparation workflows can be wired here.</p>
  </div>
</section>
