<div class="ep-hub-shell ep-hub-shell--process">
  <div class="ep-hub-panel">
    <header class="ep-hub-header">
      <div class="title-block">
        <h2>Process and Stage Master</h2>
        <p class="subtitle">Select a section to continue</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-sm btn-close ep-btn-close" type="button" (click)="closeFromMasterHub()">
          {{ 'common.close' | translate }}
        </button>
      </div>
    </header>

    <div class="ep-hub-tiles-grid">
      <a
        class="tile-card"
        routerLink="/master/bmr-master/bmrdash"
        (click)="registerReturn()"
      >
        <div class="icon-wrap">
          <i class="fas fa-clipboard-check" aria-hidden="true"></i>
        </div>
        <div class="tile-body">
          <div class="tile-title">Prepare BMR Master</div>
          <p class="tile-description">Open BMR/PI Master with seeded product templates</p>
        </div>
      </a>

      <a
        class="tile-card"
        routerLink="/master/process-stage-master/configure-bmr"
        (click)="registerReturn()"
      >
        <div class="icon-wrap">
          <i class="fas fa-sitemap" aria-hidden="true"></i>
        </div>
        <div class="tile-body">
          <div class="tile-title">Configure BMR</div>
          <p class="tile-description">Map product to process stages and steps</p>
        </div>
      </a>

      <a class="tile-card" routerLink="/master/process-type-master" (click)="registerReturn()">
        <div class="icon-wrap">
          <i class="fas fa-project-diagram" aria-hidden="true"></i>
        </div>
        <div class="tile-body">
          <div class="tile-title">Process Type Master</div>
          <p class="tile-description">Manage process types and stage mapping</p>
        </div>
      </a>

      <a class="tile-card" routerLink="/master/productionstage" (click)="registerReturn()">
        <div class="icon-wrap">
          <i class="fas fa-layer-group" aria-hidden="true"></i>
        </div>
        <div class="tile-body">
          <div class="tile-title">Stage Master</div>
          <p class="tile-description">Configure production stages</p>
        </div>
      </a>
    </div>
  </div>
</div>
