<div class="container-fluid qc-master-page">
  <div class="card qc-master-dashboard-card">
    <div class="card-header">
      <div class="qc-dash-header-row">
        <div class="qc-dash-title">MOA Master</div>
        <button type="button" class="btn btn-sm qc-dash-btn qc-dash-btn-close" routerLink="/master">
          {{ 'common.close' | translate }}
        </button>
      </div>
    </div>

    <div class="card-block qc-master-dashboard-body">
      <div class="qc-hub-tiles-grid">
        <a
          *ngFor="let c of cards"
          class="qc-hub-tile"
          [routerLink]="c.route"
          [queryParams]="c.queryParams || null"
        >
          <div class="icon-wrap" [style.background]="c.gradient">
            <i class="fas" [ngClass]="c.icon" aria-hidden="true"></i>
          </div>
          <div class="tile-body">
            <div class="tile-title">{{ c.title }}</div>
          </div>
        </a>
      </div>
    </div>
  </div>
</div>
