<div class="revision-shell">
  <div class="revision-header">
    <div class="title-block">
      <h2>MOA/STP Revision</h2>
      <p>Manage revision status and revision history logs</p>
    </div>

    <div class="actions">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input
          type="text"
          [(ngModel)]="searchQuery"
          placeholder="Search revision modules"
          aria-label="Search revision modules"
        />
      </div>
      <button class="btn btn-sm btn-primary" routerLink="/master/moa-stp-copy">
        Back To MOA/STP
      </button>
      <button class="btn btn-sm btn-danger" routerLink="/master/moa-stp-copy">
        Close
      </button>
    </div>
  </div>

  <div class="cards-grid">
    <a
      *ngFor="let card of filteredCards; trackBy: trackByCardId"
      class="revision-card"
      [routerLink]="card.route"
    >
      <div class="icon-wrap">
        <i class="fas" [ngClass]="card.icon"></i>
      </div>
      <div class="content">
        <h3>{{ card.title }}</h3>
        <p>{{ card.description }}</p>
      </div>
    </a>

    <div class="empty-state" *ngIf="filteredCards.length === 0">
      No revision modules found for this search.
    </div>
  </div>
</div>
