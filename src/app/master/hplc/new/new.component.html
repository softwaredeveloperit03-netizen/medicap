<div class="container-fluid">
    <div class="card">
      <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
          <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New HPLC / GC Column Master</div>
          <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
            <button class="btn btn-sm" routerLink="/master/hplc" style="background-color: red;color: white;">
              CLOSE
            </button>
          </div>
        </div>
        
      </div>

    <div class="card-block">
        <div class="card-text">
          <form #hplcForm="ngForm">
            <div class="clr-row">
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Technique:<span style="color: red;">*</span></label>
                <select name="technique" #technique="ngModel" ngModel required>
                  <option value="HPLC">HPLC</option>
                  <option value="GC">GC</option>
                </select>
                <span style="color: red;" *ngIf="technique.invalid && technique.touched">Please select technique</span>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Column Name:<span style="color: red;">*</span></label>
                <input type="text" name="column_name" #column_name="ngModel" ngModel required>
                <span style="color: red;" *ngIf="column_name.invalid && column_name.touched">Please enter column name</span>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>USP L Code:</label>
                <input type="text" name="usp_l_code" ngModel placeholder="e.g. L1, L7, G1">
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Pharmacopoeia Reference:<span style="color: red;">*</span></label>
                <input type="text" name="pharmacopoeia_reference" #pharmacopoeia_reference="ngModel" ngModel required placeholder="USP / IP / Ph. Eur. / JP">
                <span style="color: red;" *ngIf="pharmacopoeia_reference.invalid && pharmacopoeia_reference.touched">Please enter pharmacopoeia reference</span>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Stationary Phase:<span style="color: red;">*</span></label>
                <input type="text" name="stationary_phase" #stationary_phase="ngModel" ngModel required placeholder="e.g. C18, C8, Phenyl, DB-5">
                <span style="color: red;" *ngIf="stationary_phase.invalid && stationary_phase.touched">Please enter stationary phase</span>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Dimensions (L x ID, mm):<span style="color: red;">*</span></label>
                <input type="text" name="dimensions_mm" #dimensions_mm="ngModel" ngModel required placeholder="e.g. 250 x 4.6">
                <span style="color: red;" *ngIf="dimensions_mm.invalid && dimensions_mm.touched">Please enter dimensions</span>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Particle Size (um):</label>
                <input type="text" name="particle_size_um" ngModel placeholder="e.g. 5">
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Pore Size (A):</label>
                <input type="text" name="pore_size_a" ngModel placeholder="e.g. 100">
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>End Capped:</label>
                <select name="end_capped" ngModel>
                  <option value="Yes">Yes</option>
                  <option value="No">No</option>
                </select>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Manufacturer / Brand:<span style="color: red;">*</span></label>
                <input type="text" name="manufacturer" #manufacturer="ngModel" ngModel required>
                <span style="color: red;" *ngIf="manufacturer.invalid && manufacturer.touched">Please enter manufacturer</span>
              </div>
              <div class="clr-col-lg-4 clr-col-md-4 clr-col-sm-12 clr-col-xs-12">
                <label>Catalog No:</label>
                <input type="text" name="catalog_no" ngModel>
              </div>
            </div>
          </form>
          </div>
        </div>
        <div class="card-footer">
          <button class="btn btn-primary" (click)="save(hplcForm)">{{'common.save' | translate}}</button>
        </div>
    </div>
</div>
