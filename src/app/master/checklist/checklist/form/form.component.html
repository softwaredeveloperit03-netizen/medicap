<!-- *ngIf="!isView" -->
<div class="card" >
  <div class="card-header" style="text-align: center">
    <div class="clr-row" style="margin-bottom: -10px;">
      <div class="clr-col-lg-6" style="color: aliceblue;margin-top: -2px;text-align: left;">Checklist Master</div>
      <div class="clr-col-lg-6" style="text-align: right;padding-right: 0px;margin-top: -7px;">
        <button class="btn btn-sm btn-success" routerLink="/master/checklist/new">New</button>
        <button class="btn btn-sm btn-danger" routerLink="/master/checklist">CLOSE</button>
      </div>
    </div>
  </div>
  <div class="card-block">
    <div class="card-text datagrid-wrapper">
      <clr-datagrid [clrDgLoading]="loading" [clrDgStickyHeader]="true">
         <clr-dg-column>Sr.</clr-dg-column>
         <!-- <clr-dg-column>Chklist ID</clr-dg-column> -->
         <clr-dg-column>Checklist Heading</clr-dg-column>
         <clr-dg-column>Department</clr-dg-column>
         <clr-dg-column>Module</clr-dg-column>
         <clr-dg-column>Form Name</clr-dg-column>
        
         <clr-dg-column>view</clr-dg-column>
 
         <clr-dg-row *clrDgItems="let user of checkListData; let i = index">
           <clr-dg-cell>{{i+1}}</clr-dg-cell>
           <!-- <clr-dg-cell>{{user.ch_id}}</clr-dg-cell> -->
           <clr-dg-cell>{{user.heading}}</clr-dg-cell>
           <clr-dg-cell>{{user.department}}</clr-dg-cell>
           <clr-dg-cell>{{user.module}}</clr-dg-cell>
           <clr-dg-cell>{{user.form_name}}</clr-dg-cell>
         
           <clr-dg-cell>
             <button class="btn btn-sm btn-info" (click)="view(i)">view</button>
           </clr-dg-cell>
        </clr-dg-row>
          <clr-dg-row *clrDgItems="results?.length==0">
                <clr-dg-cell>No Record Found!</clr-dg-cell>
          </clr-dg-row>  
       </clr-datagrid>
      </div>
  </div>
</div>

<!-- *ngIf="isView" -->
