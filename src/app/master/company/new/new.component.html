<div class="cmp-page" *ngIf="!isDiv">
  <div class="cmp-card card">
    <header class="cmp-card__header">
      <div class="cmp-card__title">
        <span class="cmp-card__badge" aria-hidden="true">B</span>
        <div>
          <h1 class="cmp-card__heading">Bill to / Ship to</h1>
          <p class="cmp-card__sub">Company / godown / unit registration</p>
        </div>
      </div>
      <div class="cmp-card__actions cmp-card__actions--bar" role="toolbar">
        <a class="btn btn-sm cmp-btn cmp-btn--toolbar cmp-btn--close" routerLink="/master/company">
          <clr-icon shape="window-close" class="is-solid"></clr-icon> Close
        </a>
      </div>
    </header>

    <div class="cmp-card__body">
      <form #companyDetails="ngForm" class="cmp-form" novalidate>
        <section class="cmp-section" aria-labelledby="cmp-sec-basic">
          <h2 id="cmp-sec-basic" class="cmp-section__title">Company details</h2>
          <div class="cmp-grid">
            <div class="cmp-field cmp-field--span-2">
              <label class="cmp-label" for="cmp-company-name">Company name / godown / unit <span class="cmp-req">*</span></label>
              <input id="cmp-company-name" class="cmp-input" type="text" name="company_name" ngModel required #company_name="ngModel" />
              <span class="cmp-err" *ngIf="company_name.invalid && company_name.touched">Required</span>
            </div>
            <div class="cmp-field">
              <label class="cmp-label" for="cmp-mobile">Mobile no. <span class="cmp-req">*</span></label>
              <input id="cmp-mobile" class="cmp-input" type="tel" name="mobile_no" ngModel required #mobile_no="ngModel" />
              <span class="cmp-err" *ngIf="mobile_no.invalid && mobile_no.touched">10 digits</span>
            </div>
            <div class="cmp-field">
              <label class="cmp-label" for="cmp-mobile-alt">Alternate mobile <span class="cmp-req">*</span></label>
              <input id="cmp-mobile-alt" class="cmp-input" type="tel" name="mobile_no1" ngModel required #mobile_no1="ngModel" />
              <span class="cmp-err" *ngIf="mobile_no1.invalid && mobile_no1.touched">10 digits</span>
            </div>
          </div>
        </section>

        <section class="cmp-section" aria-labelledby="cmp-sec-addr">
          <h2 id="cmp-sec-addr" class="cmp-section__title">{{'common.address' | translate}}</h2>
          <div class="cmp-grid">
            <div class="cmp-field cmp-field--country">
              <label class="cmp-label" for="cmp-country">Country <span class="cmp-req">*</span></label>
              <select
                id="cmp-country"
                class="cmp-select cmp-select--countries"
                name="country"
                [(ngModel)]="country"
                required
                (ngModelChange)="onCountryChange($event)"
              >
                <option [ngValue]="''">Select country</option>
                <option *ngFor="let c of countries || []" [ngValue]="c.country">{{ c.country }}</option>
              </select>
            </div>
            <div class="cmp-field cmp-field--span-2" *ngIf="isIndia">
              <label class="cmp-label" for="cmp-state-in">State <span class="cmp-req">*</span></label>
              <select
                id="cmp-state-in"
                class="cmp-select"
                name="present_state"
                [(ngModel)]="present_state"
                required
              >
                <option [ngValue]="''">Select state</option>
                <option *ngFor="let s of indianStates" [ngValue]="s">{{ s }}</option>
              </select>
            </div>
            <div class="cmp-field cmp-field--span-2" *ngIf="!isIndia">
              <label class="cmp-label" for="cmp-state-out">State / region <span class="cmp-req">*</span></label>
              <input id="cmp-state-out" class="cmp-input" type="text" name="present_state" [(ngModel)]="present_state" required />
            </div>
            <div class="cmp-field">
              <label class="cmp-label" for="cmp-city">City <span class="cmp-req">*</span></label>
              <input id="cmp-city" class="cmp-input" type="text" name="present_city" ngModel required />
            </div>
            <!-- <div class="cmp-field">
              <label class="cmp-label" for="cmp-area">Area <span class="cmp-req">*</span></label>
              <input id="cmp-area" class="cmp-input" type="text" name="area" ngModel required />
            </div> -->
            <div class="cmp-field">
              <label class="cmp-label" for="cmp-pin">Postal Code <span class="cmp-req">*</span></label>
              <input id="cmp-pin" class="cmp-input" type="text" name="pin" ngModel required #pin="ngModel"
                placeholder="A1A 1A1" maxlength="7"
                pattern="[A-Za-z][0-9][A-Za-z] ?[0-9][A-Za-z][0-9]"
                oninput="let v=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6); this.value = v.length>3 ? v.slice(0,3)+' '+v.slice(3) : v;" />
              <span class="cmp-err" *ngIf="pin.invalid && pin.touched">Format: A1A 1A1</span>
            </div>
            <div class="cmp-field cmp-field--full">
              <label class="cmp-label" for="cmp-address">Address <span class="cmp-req">*</span></label>
              <input id="cmp-address" class="cmp-input" type="text" name="address" ngModel required #address="ngModel" />
              <span class="cmp-err" *ngIf="address.invalid && address.touched">Required</span>
            </div>
            <div class="cmp-field cmp-field--full">
              <label class="cmp-label" for="cmp-address1">Address line 2</label>
              <input id="cmp-address1" class="cmp-input" type="text" name="address1" ngModel />
            </div>
            <div class="cmp-field">
              <label class="cmp-label" for="cmp-person">Contact person <span class="cmp-req">*</span></label>
              <input id="cmp-person" class="cmp-input" type="text" name="person" ngModel required />
            </div>
            <div class="cmp-field">
              <label class="cmp-label" for="cmp-email">Email <span class="cmp-req">*</span></label>
              <input id="cmp-email" class="cmp-input" type="email" name="p_email" ngModel required />
            </div>
          </div>
        </section>
      </form>
    </div>

    <footer class="cmp-card__footer">
      <button type="button" class="btn btn-sm cmp-btn cmp-btn--toolbar cmp-btn--primary" (click)="submit(companyDetails)">{{'common.submit' | translate}}</button>
    </footer>
  </div>
</div>
