<div class="wobmr-hub">
  <header class="hub-top">
    <h1 class="hub-title">WO BMR</h1>
    <a class="hub-close" [routerLink]="['..']" [relativeTo]="route">
      <i class="fas fa-times" aria-hidden="true"></i>
      Close
    </a>
  </header>

  <div class="hub-cards" role="navigation" aria-label="WO BMR actions">
    <a class="hub-card" routerLink="productionstage">
      <div class="hub-card-icon" style="background: linear-gradient(135deg, #ff6e7f 0%, #bfe9ff 100%)">
        <i class="fas fa-stream" aria-hidden="true"></i>
      </div>
      <div class="hub-card-body">
        <span class="hub-card-title">Stage master</span>
        <span class="hub-card-desc">Process step master</span>
      </div>
      <i class="fas fa-chevron-right hub-card-arrow" aria-hidden="true"></i>
    </a>

    <a class="hub-card" routerLink="bmrdash">
      <div class="hub-card-icon" style="background: linear-gradient(135deg, #d97706 0%, #b45309 100%)">
        <i class="fas fa-file-medical" aria-hidden="true"></i>
      </div>
      <div class="hub-card-body">
        <span class="hub-card-title">Prepare BMR</span>
        <span class="hub-card-desc">eBMR master and BMR preparation</span>
      </div>
      <i class="fas fa-chevron-right hub-card-arrow" aria-hidden="true"></i>
    </a>
  </div>
</div>
