<div class="eb-page">
  <div class="eb-header">
    <h1>
      <i class="fas fa-table-list"></i>
      Form Masters
      <span class="eb-sub">Create and maintain master forms — enable &amp; bind them per step in BMR Builder</span>
    </h1>
    <div class="eb-header-actions">
      <button class="eb-btn eb-btn-ghost" (click)="close()"><i class="fas fa-arrow-left"></i> Back</button>
    </div>
  </div>

  <div class="eb-access-note">
    <i class="fas fa-circle-info"></i>
    In <b>BMR Builder → Step configuration</b>, tick each master form (Line Clearance, Procedure, etc.), then select from the master library and bind to the step.
  </div>

  <div class="fm-grid">
    <button class="fm-tile" *ngFor="let t of tiles" (click)="open(t)" [style.--fm-color]="t.color">
      <span class="fm-icon"><i [class]="t.icon"></i></span>
      <span class="fm-name">{{ t.name }}</span>
      <span class="fm-desc">{{ t.desc }}</span>
      <span class="fm-go">Open master <i class="fas fa-arrow-right"></i></span>
    </button>
  </div>
</div>
