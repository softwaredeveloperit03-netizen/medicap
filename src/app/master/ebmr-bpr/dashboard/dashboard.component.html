<div class="eb-page">
  <div class="eb-header">
    <h1>
      <i class="fas fa-notes-medical"></i>
      EBMR / eBPR Master
      <span class="eb-sub">Generic batch-record builder &amp; process masters</span>
    </h1>
    <div class="eb-header-actions">
      <button class="eb-btn eb-btn-ghost" (click)="close()"><i class="fas fa-times"></i> Close</button>
    </div>
  </div>

  <div *ngFor="let group of groups" class="eb-group">
    <div class="eb-group-title">{{ group }}</div>
    <div class="eb-tile-grid">
      <div class="eb-tile" *ngFor="let tile of tilesOf(group)" (click)="open(tile)" [title]="tile.desc">
        <div class="eb-tile-icon" [style.background]="tile.color">
          <i [class]="tile.icon"></i>
        </div>
        <div class="eb-tile-body">
          <div class="eb-tile-name">{{ tile.name }}</div>
          <div class="eb-tile-desc">{{ tile.desc }}</div>
        </div>
        <i class="fas fa-chevron-right eb-tile-go"></i>
      </div>
    </div>
  </div>
</div>
