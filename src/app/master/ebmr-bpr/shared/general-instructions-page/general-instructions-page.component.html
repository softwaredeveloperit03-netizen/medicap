<div class="sp-wrap">
  <div class="sp-toolbar" *ngIf="editable">
    <div class="sp-add-btns">
      <button class="eb-btn eb-btn-sm eb-btn-outline" type="button" (click)="addPoint(1)"><i class="fas fa-plus"></i> Add 1.0</button>
      <button class="eb-btn eb-btn-sm eb-btn-outline" type="button" (click)="addPoint(2)"><i class="fas fa-plus"></i> Add 1.1.0</button>
      <button class="eb-btn eb-btn-sm eb-btn-outline" type="button" (click)="addPoint(3)"><i class="fas fa-plus"></i> Add 1.1.1.0</button>
    </div>
    <span class="eb-hint">Add general instruction points with hierarchical numbering</span>
  </div>

  <div class="sp-body" *ngIf="editable">
    <div class="sp-rows">
      <div class="sp-row" *ngFor="let p of content.paragraphs; let i = index" [class]="'sp-lv-' + p.level">
        <span class="sp-num">{{ numbered[i]?.number }}</span>
        <select class="eb-select sp-lv" [(ngModel)]="p.level" (ngModelChange)="emit()">
          <option *ngFor="let o of levelOptions" [ngValue]="o.value">{{ o.label }}</option>
        </select>
        <textarea class="eb-textarea sp-text" [(ngModel)]="p.text" (ngModelChange)="emit()" rows="3"
          placeholder="General instruction text…"></textarea>
        <div class="sp-row-actions">
          <button class="eb-icon-btn" type="button" (click)="movePoint(i, -1)" [disabled]="i === 0"><i class="fas fa-arrow-up"></i></button>
          <button class="eb-icon-btn" type="button" (click)="movePoint(i, 1)" [disabled]="i === content.paragraphs.length - 1"><i class="fas fa-arrow-down"></i></button>
          <button class="eb-icon-btn danger" type="button" (click)="removePoint(i)"><i class="fas fa-trash"></i></button>
        </div>
      </div>
    </div>

    <div class="sp-preview" *ngIf="numbered.length">
      <div class="eb-section-title">Preview</div>
      <div class="sp-preview-body" [innerHTML]="previewHtml"></div>
    </div>
  </div>

  <div class="sp-readonly" *ngIf="!editable">
    <div class="sp-read-row" *ngFor="let p of numbered" [class]="'sp-lv-' + p.level">
      <span class="sp-num">{{ p.number }}</span>
      <span class="sp-read-text">{{ p.text || '—' }}</span>
    </div>
    <p class="eb-empty" *ngIf="!numbered.length">No general instructions defined.</p>
  </div>

  <div class="sp-save-bar" *ngIf="showSave && editable">
    <button class="eb-btn eb-btn-solid" type="button" (click)="onSave()" [disabled]="saving">
      <i class="fas" [ngClass]="saving ? 'fa-spinner fa-spin' : 'fa-save'"></i> Save General Instructions
    </button>
  </div>
</div>
