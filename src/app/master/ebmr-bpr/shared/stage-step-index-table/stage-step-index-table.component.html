<div class="ssi-wrap">
  <table class="eb-table ssi-table">
    <thead>
      <tr>
        <th class="ssi-sr">Sr No</th>
        <th>Stage</th>
        <th>Step</th>
        <th>Details</th>
        <th class="ssi-status">Status</th>
        <th class="ssi-actions">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngIf="!rows?.length">
        <td colspan="6" class="eb-empty">{{ emptyText }}</td>
      </tr>
      <tr
        *ngFor="let r of rows"
        [class.ssi-active]="highlightStepIndex !== null && r.stepIndex === highlightStepIndex"
      >
        <td class="ssi-sr">{{ r.sr }}</td>
        <td>{{ r.stageName }}</td>
        <td class="eb-strong">{{ r.stepName }}</td>
        <td class="ssi-details">{{ r.details || '—' }}</td>
        <td class="ssi-status">
          <span class="eb-badge" [ngClass]="statusClass(r.status)">{{ r.status || '—' }}</span>
        </td>
        <td class="ssi-actions">
          <ng-container *ngIf="mode === 'builder'">
            <button
              type="button"
              class="eb-btn eb-btn-sm eb-btn-solid"
              *ngIf="r.canConfigure"
              (click)="configure.emit(r)"
              title="Configure step"
            >
              <i class="fas fa-cog"></i> Configure
            </button>
            <button
              type="button"
              class="eb-btn eb-btn-sm eb-btn-outline"
              *ngIf="r.canView"
              (click)="view.emit(r)"
              title="View step"
            >
              <i class="fas fa-eye"></i> View
            </button>
            <button
              type="button"
              class="eb-btn eb-btn-sm eb-btn-ghost"
              *ngIf="r.canEdit"
              (click)="edit.emit(r)"
              title="Edit after correction"
            >
              <i class="fas fa-pen"></i> Edit
            </button>
          </ng-container>

          <ng-container *ngIf="mode === 'checking'">
            <button type="button" class="eb-btn eb-btn-sm eb-btn-outline" (click)="view.emit(r)">
              <i class="fas fa-eye"></i> View
            </button>
            <button
              type="button"
              class="eb-btn eb-btn-sm eb-btn-solid"
              *ngIf="r.canCheck"
              (click)="check.emit(r)"
            >
              <i class="fas fa-signature"></i> Check
            </button>
            <button
              type="button"
              class="eb-btn eb-btn-sm eb-btn-ghost"
              *ngIf="r.canSendBack"
              (click)="sendBack.emit(r)"
            >
              <i class="fas fa-undo"></i> Send back
            </button>
          </ng-container>

          <ng-container *ngIf="mode === 'review'">
            <button type="button" class="eb-btn eb-btn-sm eb-btn-outline" (click)="view.emit(r)">
              <i class="fas fa-eye"></i> View
            </button>
            <button
              type="button"
              class="eb-btn eb-btn-sm eb-btn-solid"
              *ngIf="r.canReview"
              (click)="review.emit(r)"
            >
              <i class="fas fa-signature"></i> Review
            </button>
            <button
              type="button"
              class="eb-btn eb-btn-sm eb-btn-ghost"
              *ngIf="r.canSendBack"
              (click)="sendBack.emit(r)"
            >
              <i class="fas fa-undo"></i> Send back
            </button>
          </ng-container>

          <ng-container *ngIf="mode === 'final'">
            <button type="button" class="eb-btn eb-btn-sm eb-btn-outline" (click)="view.emit(r)">
              <i class="fas fa-eye"></i> View
            </button>
          </ng-container>

          <ng-container *ngIf="mode === 'execution'">
            <button
              type="button"
              class="eb-btn eb-btn-sm eb-btn-solid"
              *ngIf="r.canOpen || r.canConfigure"
              (click)="open.emit(r)"
            >
              <i class="fas fa-play"></i> Open
            </button>
            <button type="button" class="eb-btn eb-btn-sm eb-btn-outline" (click)="view.emit(r)">
              <i class="fas fa-eye"></i> View
            </button>
          </ng-container>
        </td>
      </tr>
    </tbody>
  </table>
</div>
