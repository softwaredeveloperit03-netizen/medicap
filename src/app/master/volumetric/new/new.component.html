 

<div class="container-fluid">
    <div class="card">
        <div class="card-header" style="text-align: center">
            <div class="clr-row" style="margin-bottom: -10px;">
                <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">Volumetric / Standard
                    Solution Master</div>
                <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                    <button class="btn btn-sm" routerLink="/master/volumetric"
                        style="background-color: red;color: white;">
                        CLOSE
                    </button>
                </div>
            </div>
        </div>
        <div class="card-block">
            <div class="card-text">
                <form #volumetricForm="ngForm">
                    <div class="clr-row">

                        <div class="clr-col-4">
                            <label>Solution Type</label>
                            <select name="solution_type" [(ngModel)]="solution_type" required>
                                <option></option>
                                <option>Molar</option>
                                <option>Percentage</option>
                                <option>Normal</option>
                            </select>
                        </div>


                        <div class="clr-col-4">
                            <label>Name of Volumetric / Standard Solution:<span style="color: red;">*</span></label>
                            <input type="text" name="solution_name" #solution_name="ngModel" ngModel required>
                            <span style="color: red;" *ngIf="solution_name.invalid && solution_name.touched">Please
                                Enter The Volumetric Name</span>
                        </div>

                        <div *ngIf="solution_type == 'Percentage'" class="clr-col-4">
                            <label>Percentage:<span style="color: red;">*</span></label>
                            <input type="text" name="percentage" #percentage="ngModel" ngModel required>
                            <span style="color: red;" *ngIf="percentage.invalid && percentage.touched">Please Enter The
                                Percentage</span>
                        </div>
                        <div *ngIf="solution_type == 'Percentage'" class="clr-col-4">
                            <label>Unit:<span style="color: red;">*</span></label>
                            <select name="strength_unit" ngModel required>
                                <option>w/v</option>
                                <option>w/w</option>
                                <option>v/v</option>
                            </select>
                        </div>

                        <div *ngIf="solution_type != 'Percentage'" class="clr-col-4">
                            <label>Strength:<span style="color: red;">*</span></label>
                            <input type="text" name="strength" #strength="ngModel" ngModel required>
                            <span style="color: red;" *ngIf="strength.invalid && strength.touched">Please Enter
                                Strength</span>
                        </div>

                        <div *ngIf="solution_type == 'Molar'" class="clr-col-4">
                            <label>Unit:</label>
                            <input type="text" name="strength_unit" [(ngModel)]="strength_unit" readonly>
                        </div>

                        <div *ngIf="solution_type == 'Normal'" class="clr-col-4">
                            <label>Unit:</label>
                            <input type="text" name="strength_unit" [(ngModel)]="normal_unit" readonly>
                        </div>




                    </div>
                </form>
            </div>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary" (click)="saveVolumetricMaster(volumetricForm)">{{'common.save' | translate}}</button>
        </div>
    </div>
</div>
