<div class="container-fluid vs-master-page">
  <div class="card vs-master-dashboard-card">
    <div class="card-header">
      <div class="vs-dash-header-row">
        <div class="vs-dash-title">Volumetric Solution Master</div>
        <div class="vs-dash-header-actions" style="display:flex;gap:8px;align-items:center;">
          <app-master-excel-provision
            configId="VOLUMETRIC"
            buttonClass="btn btn-sm vs-dash-btn btn-primary"
            (uploaded)="onExcelUploaded()"
          ></app-master-excel-provision>
          <button type="button" class="btn btn-sm vs-dash-btn vs-dash-btn-close" routerLink="/master">
            {{ 'common.close' | translate }}
          </button>
        </div>
      </div>
    </div>

    <div class="vs-dash-tabs" role="navigation" aria-label="Volumetric Solution Master actions">
      <div class="vs-dash-tabs-links">
        <a *ngIf="isuser == 'Yes'" class="vs-dash-tab" routerLink="new" routerLinkActive="vs-dash-tab--active">New</a>
        <a *ngIf="isapprover == 'Yes'" class="vs-dash-tab" routerLink="approval" routerLinkActive="vs-dash-tab--active">Approval</a>
        <a class="vs-dash-tab" routerLink="log" routerLinkActive="vs-dash-tab--active">Log</a>
      </div>
      <div class="vs-dash-tools">
        <div class="vs-dash-search-wrap">
          <i class="fas fa-search" aria-hidden="true"></i>
          <input
            type="search"
            class="vs-dash-search"
            [(ngModel)]="searchTerm"
            (ngModelChange)="onSearchChange($event)"
            placeholder="Search…"
            aria-label="Search volumetric solutions"
          />
        </div>
        <span class="vs-dash-count">{{ recordCount }} record(s)</span>
      </div>
    </div>

    <div class="card-block vs-master-dashboard-body">
      <app-log
        [embedded]="true"
        [externalSearch]="searchTerm"
        (recordCountChange)="recordCount = $event"
      ></app-log>
    </div>
  </div>

  <app-volumetric-log-modals></app-volumetric-log-modals>
</div>
