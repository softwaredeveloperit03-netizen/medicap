<div class="card">
    <div class="card-header" style="text-align: center">
        <div class="clr-row" style="margin-bottom: -10px;">
            <div class="clr-col-9" style="color: aliceblue;margin-top: -2px;text-align: left;">New</div>
            <div class="clr-col-lg-3" style="text-align: right;padding-right: 0px;margin-top: -7px;">
                <button class="btn btn-sm btn-danger" routerLink="/unitformula">{{'common.close' | translate}}</button>
            </div>
        </div>
    </div>
    <div class="card-block">
        <div class="card-text">
           
               <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Select Combi Product : <span style="color: red">*</span></strong></label>
                        <select name="combi_product"  [(ngModel)]="combi_product" required (change)="getCombidata($event.target.selectedIndex)">
                            <option></option>
                            <option *ngFor="let data of combis;let i = index;">{{data.product_name}} </option>
                           
                        </select>
                    </div>
                    <div class="clr-row">
                         <form #basicForm="ngForm">
                    <div class="clr-col-lg-12">
                        <div class="card">
                            <div class="card-header" style="text-align: center">
                                <div class="clr-row" style="margin-bottom: -10px;">
                                    <div class="clr-col-7" style="color: aliceblue;margin-top: -2px;text-align: left;">ADD PRODUCTS</div>
                                </div>
                            </div>
                            <div class="card-block">
                               <div class="clr-row">
                 
                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Category : <span style="color: red">*</span></strong></label>
                        <select name="category"  [(ngModel)]="category" required >
                            <option></option>
                            <option>Pharma</option>
                            <option>Cosmetics / Others</option>
                            <option>Herbal/Ayurvedic</option>
                        </select>
                    </div>
 

                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Sub Group : <span style="color: red">*</span></strong></label>
                        <select name="dosage_form" [(ngModel)]="dosage_form" required  >
                            <option></option>
                            <option *ngFor="let type of types" [ngValue]="type.material_subtype">{{type.material_subtype}}</option>
                        </select>
                    </div>

                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Nature Of Product : <span style="color: red">*</span></strong></label>
                        <select name="dosage_type" [(ngModel)]="dosage_type" required (change)="getProductByDosageTypeForm()" >
                            <option></option>
                            <option>SOLID</option>
                            <option>LIQUID</option>
                            <option>SEMI SOLID</option>
                            <option>Gases</option>
                        </select>
                    </div> 

                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12">
                        <label><strong>Product Name : <span style="color:red;">*</span></strong></label>
                        <select name="product_name" ngModel required  (change)="getProductdata($event.target.selectedIndex)">
                            <option></option>
                            <option *ngFor="let product of products; " >{{product.product_name }} </option>
                        </select>
                    </div>

              

                    <div class="clr-col-lg-3 clr-col-md-3 clr-col-sm-12 clr-col-xs-12" >
                      
                        <label  ><strong> Qty : <span style="color:red;">*</span></strong></label>
                       
                        <input type="text" name="Qty" ngModel required style="width: 30%;">
                        <select name="Qty_unit" ngModel required style="width: 30%;">
                            <option></option>
                            <option>Nos</option>
                             
                        </select>
                    </div>
                      <button class="btn btn-primary"  (click)="AddSubProds(basicForm)">{{'common.add' | translate}}</button>

                    <table class="table">
                        <tr>
                            <th>Sr</th>
                            <th>{{'common.category' | translate}}</th>
                            <th>Subgroup</th>
                            <th>Nature</th>
                            <th>Prduct Name</th>
                            <th>Qty</th>
                        </tr>
                        <tr *ngFor="let data of combiProductList; let i = index;">
                            <td>{{i+1}}</td>
                            <td>{{data.category}}</td>
                            <td>{{data.dosage_form}}</td>
                            <td>{{data.dosage_type}}</td>
                            <td>{{ data.product_name }}{{data.product_code}}</td>
                            <td>{{data.Qty}} {{data.Qty_unit}}</td>
                        </tr>
                    </table> 
 
                     <div class="card-footer">
      
        
    </div>
 
                </div>
                            </div>
                        </div>
                    </div>
                         </form>         
                </div>
 
 
   

              

    
             <button class="btn btn-primary"  (click)="Save()">{{'common.save' | translate}}</button>
        </div>
   
</div>
</div>
