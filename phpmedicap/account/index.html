<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Animation</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .animated-text {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            text-align: center;
            animation: bounce 2s infinite;
        }

        .animated-text a {
            text-decoration: none;
            color: #007bff;
        }

        /* Animation */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-20px);
            }
            60% {
                transform: translateY(-10px);
            }
        }
    </style>
</head>
<body>
    <div class="animated-text">
        <p>Please visit this <a href="https://gmpsoftwareindia.com/" target="_blank">website</a></p>
    </div>
</body>
</html>
